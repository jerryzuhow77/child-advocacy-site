<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>法庭漫畫｜護童行動聯盟</title><link rel="stylesheet" href="../assets/site.css"></head><body><header><div class="container nav"><a class="brand" href="../">護童行動聯盟</a><nav><a href="../">首頁</a><a href="../court-comics/">法庭漫畫</a><a href="../hearing-records/">旁聽紀錄</a><button class="lang-btn" onclick="toggleLang()">简</button></nav></div></header><section class="page-hero"><div class="container"><h1>法庭漫畫</h1><p>以圖像整理法庭觀察與案件脈絡。</p></div></section><section><div class="container"><div id="list" class="comic-grid"></div></div></section><footer><div class="container">護童行動聯盟</div></footer><script src="../assets/site.js"></script><script>fetch('../data/court-comics.json').then(r=>r.json()).then(a=>{document.getElementById('list').innerHTML=a.slice().reverse().map(x=>`<article class="comic"><img src="${x.image}" alt="${x.alt||x.title}"><div class="copy"><div class="meta">${x.date}</div><h3>${x.title}</h3><p>${x.summary||''}</p></div></article>`).join('');setLang(localStorage.getItem('siteLang')||'zh-Hant')})</script></body></html>
