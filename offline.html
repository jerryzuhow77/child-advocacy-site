<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#082b4b">
  <title>目前無法連線｜護童行動聯盟</title>
  <style>
    *{box-sizing:border-box}body{min-height:100vh;margin:0;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at top,#f9f3e7,#e7ede9 55%,#d7e2df);color:#183447;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.card{width:min(100%,560px);padding:34px 28px;border:1px solid rgba(8,43,75,.12);border-radius:26px;background:rgba(255,255,255,.82);box-shadow:0 24px 70px rgba(8,43,75,.16);text-align:center}.logo{width:96px;height:96px;border-radius:25px;box-shadow:0 10px 30px rgba(8,43,75,.18)}h1{margin:22px 0 10px;color:#082b4b;font-size:clamp(26px,7vw,38px)}p{margin:0 auto;max-width:420px;color:#526575;font-size:16px;line-height:1.8}.actions{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:25px}button,a{min-height:46px;padding:12px 18px;border-radius:14px;font:800 15px/1 system-ui,sans-serif;cursor:pointer;text-decoration:none}button{border:0;background:#082b4b;color:#fff}a{display:inline-flex;align-items:center;border:1px solid rgba(8,43,75,.25);color:#082b4b;background:#fff}@media(max-width:440px){.actions>*{width:100%;justify-content:center}}
  </style>
</head>
<body>
  <main class="card">
    <img class="logo" src="./assets/icons/app-icon-192.png" alt="護童行動聯盟">
    <h1>目前無法連線</h1>
    <p>請確認網路連線後再試一次。曾經開啟過的部分頁面，仍可在離線狀態下閱讀。</p>
    <div class="actions">
      <button type="button" onclick="location.reload()">重新連線</button>
      <a href="./">回到首頁</a>
    </div>
  </main>
</body>
</html>
