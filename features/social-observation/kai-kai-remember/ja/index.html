<!doctype html><html lang="ja"><meta charset="utf-8"><title>剴剴｜この世に来たのに、安全に育つことはできなかった</title><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{max-width:760px;margin:10vh auto;padding:2rem;background:#f4f0e9;color:#293a48;font:18px/1.9 system-ui}img{width:100%;border-radius:1rem}a{color:#506777}</style><nav><a href="../">繁</a> · <a href="../zh-Hans/">简</a> · <a href="../en/">EN</a> · 日</nav><h1>剴剴｜この世に来たのに、安全に育つことはできなかった</h1><img src="../kai-kai.jpg" alt="ベビーベッドで眠る新生児"><p>剴剴は、抱かれ、食べさせてもらい、あやされ、泣くたびに応えてもらうべきだった子どもです。</p><p>裁判で認定された事実は、助けを求めることも逃げることもできない幼い子どもが、深刻な傷害と長い苦痛を受けたことを示しています。2023年12月24日、剴剴は亡くなりました。</p><p>写真の子どもを忘れないでください。彼はニュースでも事件番号でもありません。通報、訪問、保護、説明責任の一つひとつが、苦しむ次の子どもにもっと早く届きますように。</p>
