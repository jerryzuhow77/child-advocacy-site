<!doctype html><html lang="zh-Hans"><meta charset="utf-8"><title>剀剀｜你来过人间，却没能平安长大</title><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{max-width:760px;margin:10vh auto;padding:2rem;background:#f4f0e9;color:#293a48;font:18px/1.8 system-ui}img{width:100%;border-radius:1rem}a{color:#506777}</style><nav><a href="../">繁</a> · 简 · <a href="../en/">EN</a> · <a href="../ja/">日</a></nav><h1>剀剀｜你来过人间，却没能平安长大</h1><img src="../kai-kai.jpg" alt="安静熟睡的新生儿，躺在婴儿床中"><p>剀剀来到世上时，应该被好好抱着、喂饱、哄睡；每一次哭泣，都应得到回应。</p><p>法院判决所认定的事实，让人看见一个幼小孩子在无力求救、无法逃离时，承受严重伤害与长久痛苦。2023年12月24日，剀剀离开了。</p><p>请记得照片里的孩子。他不是一则新闻，也不是一个案号。愿每一次通报、访视、安置与追责，都能更早接住下一个正在受苦的孩子。</p>
