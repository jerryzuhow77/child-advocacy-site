name: One-off diagnose Kaikai 320px overflow

on:
  push:
    branches:
      - fix/kaikai-ch2-anchor-viewport-20260828

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Apply tested mobile title rule
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('hearing-records/prison-watch/kaikai-final-chapter/final-chapter.css')
          s = p.read_text(encoding='utf-8')
          old = '.hero h1{font-size:clamp(40px,13vw,50px)}'
          new = '.hero h1{font-size:clamp(32px,9.5vw,38px);white-space:nowrap}'
          assert s.count(old) == 1
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Diagnose with Chromium
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/pw" "$GITHUB_WORKSPACE/overflow-diagnostic"
          cd "$RUNNER_TEMP/pw"
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null
          cat > diagnose.mjs <<'JS'
          import fs from 'node:fs';
          import path from 'node:path';
          import { chromium } from 'playwright';
          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({ viewport: { width: 320, height: 780 } });
          await page.goto('http://127.0.0.1:4173/hearing-records/prison-watch/kaikai-final-chapter/', { waitUntil: 'domcontentloaded', timeout: 45000 });
          await page.waitForTimeout(800);
          const report = await page.evaluate(() => {
            const selectorFor = (el) => {
              if (el.id) return `#${el.id}`;
              const classes = [...el.classList].slice(0, 3).join('.');
              return `${el.tagName.toLowerCase()}${classes ? `.${classes}` : ''}`;
            };
            const offenders = [...document.querySelectorAll('body *')].map((el) => {
              const r = el.getBoundingClientRect();
              const s = getComputedStyle(el);
              return {
                selector: selectorFor(el),
                tag: el.tagName,
                left: Math.round(r.left * 10) / 10,
                right: Math.round(r.right * 10) / 10,
                width: Math.round(r.width * 10) / 10,
                scrollWidth: el.scrollWidth,
                clientWidth: el.clientWidth,
                position: s.position,
                overflowX: s.overflowX,
                whiteSpace: s.whiteSpace,
                text: (el.textContent || '').trim().replace(/\s+/g, ' ').slice(0, 100)
              };
            }).filter((x) => x.right > innerWidth + 1 || x.left < -1 || x.scrollWidth > x.clientWidth + 1)
              .sort((a, b) => Math.max(b.right - innerWidth, b.scrollWidth - b.clientWidth) - Math.max(a.right - innerWidth, a.scrollWidth - a.clientWidth))
              .slice(0, 80);
            return {
              viewport: innerWidth,
              documentClientWidth: document.documentElement.clientWidth,
              documentScrollWidth: document.documentElement.scrollWidth,
              bodyClientWidth: document.body.clientWidth,
              bodyScrollWidth: document.body.scrollWidth,
              offenders
            };
          });
          const out = path.join(process.env.GITHUB_WORKSPACE, 'overflow-diagnostic');
          fs.writeFileSync(path.join(out, 'report.json'), JSON.stringify(report, null, 2));
          await page.screenshot({ path: path.join(out, 'page-320.png'), fullPage: false });
          console.log(JSON.stringify(report, null, 2));
          await browser.close();
          JS
          cd "$GITHUB_WORKSPACE"
          python -m http.server 4173 > "$RUNNER_TEMP/http.log" 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          for i in {1..20}; do curl -fsS http://127.0.0.1:4173/hearing-records/prison-watch/kaikai-final-chapter/ >/dev/null && break || sleep 1; done
          cd "$RUNNER_TEMP/pw"
          node diagnose.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: kaikai-320-overflow-diagnostic
          path: overflow-diagnostic/
          retention-days: 7
