name: Assemble Kaikai Chapter 2 second background track

on:
  push:
    branches:
      - main
    paths:
      - '.github/media/kaikai-chapter2-audio-20260829/**'
      - '.github/workflows/assemble-kaikai-chapter2-audio-20260829.yml'

permissions:
  contents: write

concurrency:
  group: assemble-kaikai-chapter2-audio-20260829
  cancel-in-progress: false

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate and assemble audio
        shell: bash
        run: |
          set -euo pipefail
          chunk_dir='.github/media/kaikai-chapter2-audio-20260829'
          output='assets/audio/kaikai-chapter2-bgm-02-20260829.webm'

          test "$(find "$chunk_dir" -maxdepth 1 -type f -name 'part-*.b64' | wc -l)" -eq 5
          mkdir -p "$(dirname "$output")"
          cat "$chunk_dir"/part-*.b64 | base64 --decode > "$output"
          echo 'aa01b770180f924ec229800361caf392c4e55ef8f80db6c96d1522dcd6703c7  assets/audio/kaikai-chapter2-bgm-02-20260829.webm' | sha256sum -c -
          test "$(stat -c '%s' "$output")" -eq 48131
          rm -rf "$chunk_dir"

      - name: Commit assembled media
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$(git status --porcelain)" ]]; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A assets/audio/kaikai-chapter2-bgm-02-20260829.webm .github/media/kaikai-chapter2-audio-20260829
          git commit -m 'Assemble Chapter 2 second background track'
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 3))
          done
          exit 1
