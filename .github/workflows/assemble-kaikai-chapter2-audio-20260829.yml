name: Assemble Kaikai Chapter 2 second background track

on:
  push:
    branches:
      - main
    paths:
      - '.github/media/kaikai-chapter2-audio-20260829/**'
      - '.github/workflows/assemble-kaikai-chapter2-audio-20260829.yml'

permissions:
  contents: write

concurrency:
  group: assemble-kaikai-chapter2-audio-20260829
  cancel-in-progress: false

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate and assemble audio
        shell: bash
        run: |
          set -euo pipefail
          chunk_dir='.github/media/kaikai-chapter2-audio-20260829'
          output='assets/audio/kaikai-chapter2-bgm-02-20260829.webm'

          test "$(find "$chunk_dir" -maxdepth 1 -type f -name 'part-*.b64' | wc -l)" -eq 5
          mkdir -p "$(dirname "$output")"
          cat "$chunk_dir"/part-*.b64 | base64 --decode > "$output"
          test "$(stat -c '%s' "$output")" -eq 48131
          sha256sum "$output"

          ffprobe -v error -select_streams a:0 \
            -show_entries stream=codec_name,channels,sample_rate:format=duration \
            -of json "$output" > /tmp/kaikai-track.json
          cat /tmp/kaikai-track.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path('/tmp/kaikai-track.json').read_text())
          streams = data.get('streams') or []
          assert streams and streams[0].get('codec_name') == 'opus', data
          duration = float((data.get('format') or {}).get('duration') or 0)
          assert 30.0 <= duration <= 31.5, duration
          PY

          rm -rf "$chunk_dir"

      - name: Commit assembled media and remove one-off tooling
        shell: bash
        run: |
          set -euo pipefail
          workflow='.github/workflows/assemble-kaikai-chapter2-audio-20260829.yml'
          git rm "$workflow"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A assets/audio/kaikai-chapter2-bgm-02-20260829.webm .github/media/kaikai-chapter2-audio-20260829 "$workflow"
          git commit -m 'Assemble validated Chapter 2 second background track'
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 3))
          done
          exit 1
