name: Global Protection legacy credential probe 20260829

on:
  push:
    branches:
      - ops/global-protection-runner-probe-20260829
    paths:
      - .github/workflows/global-protection-legacy-credential-probe-20260829.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DEPLOY_KEY: ${{ secrets.GPDEPLOY_RSA || secrets.GP_DEPLOY_RSA || secrets.GP_DEPLOY_KEY || secrets.GLOBAL_PROTECTION_DEPLOY_KEY || secrets.GLOBAL_PROTECTION_SSH_KEY || secrets.GLOBAL_PROTECTION_PRIVATE_KEY || secrets.PRODUCTION_SSH_KEY || secrets.PROD_SSH_KEY || secrets.DEPLOY_SSH_KEY || secrets.SERVER_SSH_KEY || secrets.CVM_SSH_KEY || secrets.TENCENT_PRIVATE_KEY || secrets.SSH_KEY || secrets.DEPLOY_KEY }}
      DEPLOY_HOST: ${{ secrets.GLOBAL_PROTECTION_SSH_HOST || secrets.GLOBAL_PROTECTION_HOST || secrets.PRODUCTION_SSH_HOST || secrets.PROD_SSH_HOST || secrets.DEPLOY_HOST || secrets.SSH_HOST || vars.GLOBAL_PROTECTION_SSH_HOST || vars.PRODUCTION_SSH_HOST || vars.DEPLOY_HOST || '150.109.69.104' }}
      DEPLOY_USER: ${{ secrets.GLOBAL_PROTECTION_SSH_USER || secrets.PRODUCTION_SSH_USER || secrets.PROD_SSH_USER || secrets.DEPLOY_USER || secrets.SSH_USER || vars.GLOBAL_PROTECTION_SSH_USER || vars.DEPLOY_USER || 'ubuntu' }}
      DEPLOY_PORT: ${{ secrets.GLOBAL_PROTECTION_SSH_PORT || secrets.PRODUCTION_SSH_PORT || secrets.DEPLOY_PORT || secrets.SSH_PORT || vars.DEPLOY_PORT || '22' }}
    steps:
      - name: Probe merged legacy credential aliases read-only
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          key_present=false
          key_valid=false
          ssh_connected=false
          if [[ -n "${DEPLOY_KEY:-}" ]]; then
            key_present=true
            if [[ "$DEPLOY_KEY" == *"BEGIN "*"PRIVATE KEY"* ]]; then
              printf '%s\n' "$DEPLOY_KEY" > id_key
            elif printf '%s' "$DEPLOY_KEY" | base64 -d > id_key 2>/dev/null; then
              :
            else
              printf '%s\n' "$DEPLOY_KEY" > id_key
            fi
            chmod 600 id_key
            if ssh-keygen -y -f id_key >/dev/null 2>&1; then
              key_valid=true
              if ssh -i id_key -p "$DEPLOY_PORT" -o BatchMode=yes -o PasswordAuthentication=no -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new "${DEPLOY_USER}@${DEPLOY_HOST}" 'echo SSH_CONNECTED=true; printf HOSTNAME=; hostname; test -d /opt/global-protection && echo APP_PRESENT=true || echo APP_PRESENT=false; command -v systemctl >/dev/null && { printf SERVICE_ACTIVE=; systemctl is-active global-protection.service 2>/dev/null || true; }' > ssh-result.txt 2>ssh-error.txt; then
                ssh_connected=true
              fi
            fi
            rm -f id_key
          fi
          echo "LEGACY_KEY_PRESENT=$key_present"
          echo "LEGACY_KEY_VALID=$key_valid"
          echo "SSH_CONNECTED=$ssh_connected"
          if [[ "$ssh_connected" == true ]]; then cat ssh-result.txt; fi
          echo 'PRODUCTION_MUTATED=false'
