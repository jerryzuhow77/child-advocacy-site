name: One-off address PR 109 review

on:
  push:
    branches: [feat/kaikai-chapter2-full-ux-20260828]

permissions:
  contents: write

concurrency:
  group: pr109-review-fix
  cancel-in-progress: false

jobs:
  fix-and-verify:
    if: ${{ !contains(github.event.head_commit.message, '[pr109-review-fixed]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Patch review findings
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          base = Path('hearing-records/prison-watch/kaikai-final-chapter')
          js_path, css_path = base / 'final-chapter.js', base / 'final-chapter.css'
          js = js_path.read_text(encoding='utf-8')

          filter_pattern = re.compile(
              r"  const filterLifeEvents = \(\) => \{.*?\n  \};\n\n  lifeSearch\?\.addEventListener\('input', filterLifeEvents\);",
              re.DOTALL,
          )
          filter_replacement = '''  const filterLifeEvents = () => {
            const query = normalize(lifeSearch?.value || '');
            document.body.classList.toggle('life-search-active', Boolean(query));
            let shown = 0;

            lifeEvents.forEach((event) => {
              const haystack = normalize(`${event.dataset.search || ''} ${event.textContent || ''}`);
              const match = !query || haystack.includes(query);
              event.hidden = !match;
              if (match) shown += 1;
            });

            if (lifeStatus) {
              const quickCollapsed = !query
                && document.body.dataset.readingDepth === 'quick'
                && !document.body.classList.contains('show-all-life');
              const quickShown = Math.min(4, lifeEvents.length);
              lifeStatus.textContent = query
                ? `${locale === 'zh-Hans' ? '找到' : '找到'} ${shown} ${resultLabel}`
                : quickCollapsed
                  ? `${locale === 'zh-Hans' ? '重点显示' : '重點顯示'} ${quickShown} / ${lifeEvents.length} ${totalLabel}`
                  : `${locale === 'zh-Hans' ? '显示' : '顯示'} ${lifeEvents.length} ${totalLabel}`;
            }
          };

          lifeSearch?.addEventListener('input', filterLifeEvents);'''
          js, count = filter_pattern.subn(lambda _: filter_replacement, js, count=1)
          if count != 1:
              raise SystemExit(f'Expected one life filter block, found {count}')

          depth_pattern = re.compile(
              r"  const revealHashTarget = \(scroll = false\) => \{.*?\n  \};\n  const applyReadingDepth = \(scrollToHash = false\) => \{.*?\n  \};\n",
              re.DOTALL,
          )
          depth_replacement = '''  const revealHashTarget = (scroll = false) => {
            document.querySelectorAll('[data-depth-reveal="true"]').forEach((node) => {
              node.removeAttribute('data-depth-reveal');
              node.querySelector(':scope > .depth-reveal-note')?.remove();
            });
            const target = getHashTarget();
            const closestSection = target?.closest('main section[data-reading-level]');
            const revealedSections = new Set();
            if (!closestSection) return revealedSections;

            let section = closestSection;
            while (section) {
              section.dataset.depthReveal = 'true';
              section.hidden = false;
              section.removeAttribute('aria-hidden');
              revealedSections.add(section);
              section = section.parentElement?.closest('main section[data-reading-level]') || null;
            }

            if (!closestSection.querySelector(':scope > .depth-reveal-note')) {
              const note = document.createElement('p');
              note.className = 'depth-reveal-note';
              note.textContent = copy.revealed;
              closestSection.prepend(note);
            }
            if (scroll) requestAnimationFrame(() => target.scrollIntoView({ behavior: reduceMotion ? 'auto' : 'smooth', block: 'start' }));
            return revealedSections;
          };
          const applyReadingDepth = (scrollToHash = false) => {
            const selected = Object.prototype.hasOwnProperty.call(depthRank, body.dataset.readingDepth)
              ? body.dataset.readingDepth : 'guided';
            const revealedSections = revealHashTarget(false);
            depthSections.forEach((section) => {
              const needed = depthRank[section.dataset.readingLevel] ?? 0;
              const hide = needed > depthRank[selected] && !revealedSections.has(section);
              section.hidden = hide;
              if (hide) section.setAttribute('aria-hidden', 'true');
              else section.removeAttribute('aria-hidden');
            });
            if (scrollToHash) revealHashTarget(true);
            syncLifeToggle();
          };
          '''
          js, count = depth_pattern.subn(lambda _: depth_replacement, js, count=1)
          if count != 1:
              raise SystemExit(f'Expected one reading-depth block, found {count}')

          sync_pattern = re.compile(r"  function syncLifeToggle\(\) \{.*?\n  \}", re.DOTALL)
          sync_replacement = '''  function syncLifeToggle() {
            if (!lifeToggle) return;
            const expanded = body.classList.contains('show-all-life');
            lifeToggle.textContent = expanded ? copy.hideLife : copy.showLife;
            lifeToggle.setAttribute('aria-expanded', String(expanded));
            lifeToggle.setAttribute('aria-controls', 'lifeTimeline');
            lifeSearch?.dispatchEvent(new Event('input'));
          }'''
          js, count = sync_pattern.subn(lambda _: sync_replacement, js, count=1)
          if count != 1:
              raise SystemExit(f'Expected one life toggle sync block, found {count}')
          js_path.write_text(js, encoding='utf-8')

          css = css_path.read_text(encoding='utf-8')
          old = '.js-ready body[data-reading-depth="quick"]:not(.show-all-life) #lifeTimeline .life-event:nth-child(n+5){display:none}'
          new = '.js-ready body[data-reading-depth="quick"]:not(.show-all-life):not(.life-search-active) #lifeTimeline .life-event:nth-child(n+5){display:none}'
          if css.count(old) != 1:
              raise SystemExit(f'Expected one quick timeline selector, found {css.count(old)}')
          css = css.replace(old, new, 1)
          anchor = '#lifeQuickToggle{align-items:center;'
          if css.count(anchor) != 1:
              raise SystemExit(f'Expected one life toggle CSS anchor, found {css.count(anchor)}')
          css = css.replace(anchor, 'body.life-search-active #lifeQuickToggle{display:none!important}\n' + anchor, 1)
          css_path.write_text(css, encoding='utf-8')
          PY

      - name: Static checks
        run: |
          node --check hearing-records/prison-watch/kaikai-final-chapter/final-chapter.js
          git diff --check
          grep -F "const revealedSections = new Set();" hearing-records/prison-watch/kaikai-final-chapter/final-chapter.js
          grep -F "!revealedSections.has(section)" hearing-records/prison-watch/kaikai-final-chapter/final-chapter.js
          grep -F "life-search-active" hearing-records/prison-watch/kaikai-final-chapter/final-chapter.js
          grep -F ':not(.life-search-active) #lifeTimeline' hearing-records/prison-watch/kaikai-final-chapter/final-chapter.css

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Targeted Chromium regressions
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/pw" && cd "$RUNNER_TEMP/pw"
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null
          cat > smoke.mjs <<'JS'
          import { chromium } from 'playwright';
          const origin = 'http://127.0.0.1:4173';
          const route = '/hearing-records/prison-watch/kaikai-final-chapter/';
          const browser = await chromium.launch({ headless: true });
          const context = await browser.newContext({ viewport: { width: 390, height: 844 }, isMobile: true });
          await context.addInitScript(() => localStorage.setItem('kaikai-final-reading-depth-v1', 'quick'));
          const page = await context.newPage();
          const failures = [];
          page.on('pageerror', e => failures.push(`pageerror: ${e.message}`));

          for (const test of [{ hash: '#dental-warning', parent: 'chen-trial' }, { hash: '#placement-spectrum', parent: 'system' }]) {
            await page.goto(origin + route + test.hash, { waitUntil: 'domcontentloaded', timeout: 45000 });
            await page.waitForTimeout(400);
            const state = await page.evaluate(({ hash, parent }) => {
              const target = document.getElementById(hash.slice(1));
              const ancestor = document.getElementById(parent);
              return { targetHidden: target.hidden, parentHidden: ancestor.hidden, rects: target.getClientRects().length };
            }, test);
            if (state.targetHidden || state.parentHidden || !state.rects) failures.push(`${test.hash}: ${JSON.stringify(state)}`);
          }

          await page.goto(origin + route, { waitUntil: 'domcontentloaded', timeout: 45000 });
          await page.locator('#lifeSearch').fill('周保母');
          await page.waitForTimeout(200);
          const search = await page.evaluate(() => {
            const matches = [...document.querySelectorAll('#lifeTimeline .life-event')].filter(e => (e.dataset.search || '').includes('周保母'));
            return {
              active: document.body.classList.contains('life-search-active'),
              matches: matches.length,
              visible: matches.filter(e => !e.hidden && getComputedStyle(e).display !== 'none' && e.getClientRects().length).length,
              status: document.getElementById('lifeStatus').textContent,
              toggle: getComputedStyle(document.getElementById('lifeQuickToggle')).display
            };
          });
          if (!search.active || search.matches < 1 || search.visible !== search.matches || !search.status.includes('找到') || search.toggle !== 'none') failures.push(`search: ${JSON.stringify(search)}`);
          await page.locator('#lifeSearch').fill('');
          await page.waitForTimeout(100);
          const status = await page.locator('#lifeStatus').textContent();
          if (!status.includes('重點顯示')) failures.push(`status: ${status}`);
          const overflow = await page.evaluate(() => document.documentElement.scrollWidth - document.documentElement.clientWidth);
          if (overflow > 8) failures.push(`overflow: ${overflow}px`);
          await browser.close();
          if (failures.length) throw new Error(failures.join('\n'));
          console.log(JSON.stringify({ search, status, overflow }, null, 2));
          JS
          cd "$GITHUB_WORKSPACE"
          python -m http.server 4173 > "$RUNNER_TEMP/http.log" 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          for i in {1..20}; do curl -fsS "http://127.0.0.1:4173/hearing-records/prison-watch/kaikai-final-chapter/" >/dev/null && break || sleep 1; done
          cd "$RUNNER_TEMP/pw" && node smoke.mjs

      - name: Commit fixes and remove one-off workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -- .github/workflows/oneoff-address-pr109-review.yml
          git add hearing-records/prison-watch/kaikai-final-chapter/final-chapter.js hearing-records/prison-watch/kaikai-final-chapter/final-chapter.css
          git diff --cached --check
          git commit -m "Fix nested deep links and timeline search [pr109-review-fixed]"
          git push origin "HEAD:${{ github.ref_name }}"
