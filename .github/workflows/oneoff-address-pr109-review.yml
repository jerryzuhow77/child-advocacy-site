name: One-off address PR 109 review

on:
  push:
    branches:
      - feat/kaikai-chapter2-full-ux-20260828

permissions:
  contents: write

concurrency:
  group: pr109-review-fix
  cancel-in-progress: false

jobs:
  fix-and-verify:
    if: ${{ !contains(github.event.head_commit.message, '[pr109-review-fixed]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fix nested deep links and quick-mode timeline search
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          base = Path('hearing-records/prison-watch/kaikai-final-chapter')
          js_path = base / 'final-chapter.js'
          css_path = base / 'final-chapter.css'

          js = js_path.read_text(encoding='utf-8')

          filter_pattern = re.compile(
              r"  const filterLifeEvents = \(\) => \{.*?\n  \};\n\n  lifeSearch\?\.addEventListener\('input', filterLifeEvents\);",
              re.DOTALL,
          )
          filter_replacement = r'''  const filterLifeEvents = () => {
            const query = normalize(lifeSearch?.value || '');
            document.body.classList.toggle('life-search-active', Boolean(query));
            let shown = 0;

            lifeEvents.forEach((event) => {
              const haystack = normalize(`${event.dataset.search || ''} ${event.textContent || ''}`);
              const match = !query || haystack.includes(query);
              event.hidden = !match;
              if (match) shown += 1;
            });

            if (lifeStatus) {
              const quickCollapsed = !query
                && document.body.dataset.readingDepth === 'quick'
                && !document.body.classList.contains('show-all-life');
              const quickShown = Math.min(4, lifeEvents.length);
              lifeStatus.textContent = query
                ? `${locale === 'zh-Hans' ? '找到' : '找到'} ${shown} ${resultLabel}`
                : quickCollapsed
                  ? `${locale === 'zh-Hans' ? '重点显示' : '重點顯示'} ${quickShown} / ${lifeEvents.length} ${totalLabel}`
                  : `${locale === 'zh-Hans' ? '显示' : '顯示'} ${lifeEvents.length} ${totalLabel}`;
            }
          };

          lifeSearch?.addEventListener('input', filterLifeEvents);'''
          js, count = filter_pattern.subn(filter_replacement, js, count=1)
          if count != 1:
              raise SystemExit(f'Expected one life filter block, found {count}')

          depth_pattern = re.compile(
              r"  const revealHashTarget = \(scroll = false\) => \{.*?\n  \};\n  const applyReadingDepth = \(scrollToHash = false\) => \{.*?\n  \};\n",
              re.DOTALL,
          )
          depth_replacement = r'''  const revealHashTarget = (scroll = false) => {
            document.querySelectorAll('[data-depth-reveal="true"]').forEach((node) => {
              node.removeAttribute('data-depth-reveal');
              node.querySelector(':scope > .depth-reveal-note')?.remove();
            });
            const target = getHashTarget();
            const closestSection = target?.closest('main section[data-reading-level]');
            const revealedSections = new Set();
            if (!closestSection) return revealedSections;

            let section = closestSection;
            while (section) {
              section.dataset.depthReveal = 'true';
              section.hidden = false;
              section.removeAttribute('aria-hidden');
              revealedSections.add(section);
              section = section.parentElement?.closest('main section[data-reading-level]') || null;
            }

            if (!closestSection.querySelector(':scope > .depth-reveal-note')) {
              const note = document.createElement('p');
              note.className = 'depth-reveal-note';
              note.textContent = copy.revealed;
              closestSection.prepend(note);
            }
            if (scroll) requestAnimationFrame(() => target.scrollIntoView({ behavior: reduceMotion ? 'auto' : 'smooth', block: 'start' }));
            return revealedSections;
          };
          const applyReadingDepth = (scrollToHash = false) => {
            const selected = Object.prototype.hasOwnProperty.call(depthRank, body.dataset.readingDepth)
              ? body.dataset.readingDepth : 'guided';
            const revealedSections = revealHashTarget(false);
            depthSections.forEach((section) => {
              const needed = depthRank[section.dataset.readingLevel] ?? 0;
              const hide = needed > depthRank[selected] && !revealedSections.has(section);
              section.hidden = hide;
              if (hide) section.setAttribute('aria-hidden', 'true');
              else section.removeAttribute('aria-hidden');
            });
            if (scrollToHash) revealHashTarget(true);
            syncLifeToggle();
          };
          '''
          js, count = depth_pattern.subn(depth_replacement, js, count=1)
          if count != 1:
              raise SystemExit(f'Expected one reading-depth block, found {count}')

          sync_old = '''  function syncLifeToggle() {
            if (!lifeToggle) return;
            const expanded = body.classList.contains('show-all-life');
            lifeToggle.textContent = expanded ? copy.hideLife : copy.showLife;
            lifeToggle.setAttribute('aria-expanded', String(expanded));
            lifeToggle.setAttribute('aria-controls', 'lifeTimeline');
          }'''
          sync_new = '''  function syncLifeToggle() {
            if (!lifeToggle) return;
            const expanded = body.classList.contains('show-all-life');
            lifeToggle.textContent = expanded ? copy.hideLife : copy.showLife;
            lifeToggle.setAttribute('aria-expanded', String(expanded));
            lifeToggle.setAttribute('aria-controls', 'lifeTimeline');
            document.querySelector('#lifeSearch')?.dispatchEvent(new Event('input'));
          }'''
          if js.count(sync_old) != 1:
              raise SystemExit(f'Expected one life toggle sync block, found {js.count(sync_old)}')
          js = js.replace(sync_old, sync_new, 1)
          js_path.write_text(js, encoding='utf-8')

          css = css_path.read_text(encoding='utf-8')
          selector_old = '.js-ready body[data-reading-depth="quick"]:not(.show-all-life) #lifeTimeline .life-event:nth-child(n+5){display:none}'
          selector_new = '.js-ready body[data-reading-depth="quick"]:not(.show-all-life):not(.life-search-active) #lifeTimeline .life-event:nth-child(n+5){display:none}'
          if css.count(selector_old) != 1:
              raise SystemExit(f'Expected one quick timeline selector, found {css.count(selector_old)}')
          css = css.replace(selector_old, selector_new, 1)
          anchor = '#lifeQuickToggle{align-items:center;'
          if css.count(anchor) != 1:
              raise SystemExit(f'Expected one life toggle CSS anchor, found {css.count(anchor)}')
          css = css.replace(anchor, 'body.life-search-active #lifeQuickToggle{display:none!important}\n' + anchor, 1)
          css_path.write_text(css, encoding='utf-8')
          PY

      - name: Run static checks
        shell: bash
        run: |
          node --check hearing-records/prison-watch/kaikai-final-chapter/final-chapter.js
          git diff --check
          python - <<'PY'
          from pathlib import Path
          js = Path('hearing-records/prison-watch/kaikai-final-chapter/final-chapter.js').read_text(encoding='utf-8')
          css = Path('hearing-records/prison-watch/kaikai-final-chapter/final-chapter.css').read_text(encoding='utf-8')
          assert 'const revealedSections = new Set();' in js
          assert '!revealedSections.has(section)' in js
          assert "classList.toggle('life-search-active', Boolean(query))" in js
          assert ':not(.life-search-active) #lifeTimeline' in css
          assert 'body.life-search-active #lifeQuickToggle{display:none!important}' in css
          print('Static review-fix assertions passed.')
          PY

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run targeted Chromium regression tests
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/pr109-pw"
          cd "$RUNNER_TEMP/pr109-pw"
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null
          cat > smoke.mjs <<'JS'
          import { chromium } from 'playwright';

          const origin = 'http://127.0.0.1:4173';
          const route = '/hearing-records/prison-watch/kaikai-final-chapter/';
          const browser = await chromium.launch({ headless: true });
          const failures = [];

          const context = await browser.newContext({ viewport: { width: 390, height: 844 }, isMobile: true });
          await context.addInitScript(() => localStorage.setItem('kaikai-final-reading-depth-v1', 'quick'));
          const page = await context.newPage();
          page.on('pageerror', (error) => failures.push(`pageerror: ${error.message}`));
          page.on('response', (response) => {
            const url = new URL(response.url());
            if (url.origin === origin && response.status() >= 400) failures.push(`${response.status()} ${url.pathname}`);
          });

          await page.goto(origin + route + '#dental-warning', { waitUntil: 'domcontentloaded', timeout: 45000 });
          await page.waitForTimeout(500);
          const dental = await page.evaluate(() => ({
            parentHidden: document.getElementById('chen-trial')?.hidden,
            targetHidden: document.getElementById('dental-warning')?.hidden,
            targetVisible: Boolean(document.getElementById('dental-warning')?.getClientRects().length),
          }));
          if (dental.parentHidden || dental.targetHidden || !dental.targetVisible) failures.push(`nested dental deep link failed: ${JSON.stringify(dental)}`);

          await page.goto(origin + route + '#placement-spectrum', { waitUntil: 'domcontentloaded', timeout: 45000 });
          await page.waitForTimeout(500);
          const placement = await page.evaluate(() => ({
            parentHidden: document.getElementById('system')?.hidden,
            targetHidden: document.getElementById('placement-spectrum')?.hidden,
            targetVisible: Boolean(document.getElementById('placement-spectrum')?.getClientRects().length),
          }));
          if (placement.parentHidden || placement.targetHidden || !placement.targetVisible) failures.push(`nested placement deep link failed: ${JSON.stringify(placement)}`);

          await page.goto(origin + route, { waitUntil: 'domcontentloaded', timeout: 45000 });
          await page.locator('#lifeSearch').fill('周保母');
          await page.waitForTimeout(250);
          const search = await page.evaluate(() => {
            const events = [...document.querySelectorAll('#lifeTimeline .life-event')];
            const matches = events.filter((event) => (event.dataset.search || '').includes('周保母'));
            return {
              active: document.body.classList.contains('life-search-active'),
              matches: matches.length,
              visibleMatches: matches.filter((event) => !event.hidden && getComputedStyle(event).display !== 'none' && event.getClientRects().length).length,
              status: document.getElementById('lifeStatus')?.textContent || '',
              toggleDisplay: getComputedStyle(document.getElementById('lifeQuickToggle')).display,
            };
          });
          if (!search.active || search.matches < 1 || search.visibleMatches !== search.matches || !search.status.includes('找到') || search.toggleDisplay !== 'none') {
            failures.push(`quick-mode timeline search failed: ${JSON.stringify(search)}`);
          }

          await page.locator('#lifeSearch').fill('');
          await page.waitForTimeout(150);
          const collapsedStatus = await page.locator('#lifeStatus').textContent();
          if (!collapsedStatus.includes('重點顯示')) failures.push(`quick-mode status not updated: ${collapsedStatus}`);

          const overflow = await page.evaluate(() => document.documentElement.scrollWidth - document.documentElement.clientWidth);
          if (overflow > 8) failures.push(`horizontal overflow: ${overflow}px`);

          await context.close();
          await browser.close();
          if (failures.length) throw new Error(failures.join('\n'));
          console.log(JSON.stringify({ dental, placement, search, collapsedStatus, overflow }, null, 2));
          JS

          cd "$GITHUB_WORKSPACE"
          python -m http.server 4173 > "$RUNNER_TEMP/pr109-http.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in {1..20}; do
            curl -fsS "http://127.0.0.1:4173${route:-/hearing-records/prison-watch/kaikai-final-chapter/}" >/dev/null && break
            sleep 1
          done
          cd "$RUNNER_TEMP/pr109-pw"
          node smoke.mjs

      - name: Commit verified review fixes and remove one-off workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -- .github/workflows/oneoff-address-pr109-review.yml
          git add hearing-records/prison-watch/kaikai-final-chapter/final-chapter.js
          git add hearing-records/prison-watch/kaikai-final-chapter/final-chapter.css
          git diff --cached --check
          git diff --cached --stat
          git commit -m "Fix nested deep links and timeline search [pr109-review-fixed]"
          git push origin "HEAD:${{ github.ref_name }}"
