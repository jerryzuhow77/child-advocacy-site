name: Refactor Fujian Qiqi feature
on:
  push:
    branches: [refactor/fujian-qiqi-stabilization-20260821]
    paths: ['.github/workflows/refactor-qiqi-stabilization.yml']
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
permissions:
  contents: write
jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: refactor/fujian-qiqi-stabilization-20260821
      - name: Install conversion and image dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          python -m pip install --disable-pip-version-check opencc-python-reimplemented pillow
      - name: Apply consolidated refactor
        run: |
          cat \
            .github/scripts/refactor_qiqi.part1 \
            .github/scripts/refactor_qiqi.part2 \
            .github/scripts/refactor_qiqi.part3a \
            .github/scripts/refactor_qiqi.part3b \
            .github/scripts/refactor_qiqi.part4a \
            .github/scripts/refactor_qiqi.part4b \
            | base64 -d | gzip -d > /tmp/refactor_qiqi.py
          python /tmp/refactor_qiqi.py
          node --check assets/fujian-qiqi-feature.js
          sed -i 's/[[:space:]]\+$//' \
            historical-cases/regions/mainland-china/fujian-qiqi/index.html \
            en/historical-cases/regions/mainland-china/fujian-qiqi/index.html \
            ja/historical-cases/regions/mainland-china/fujian-qiqi/index.html \
            zh-hans/historical-cases/regions/mainland-china/fujian-qiqi/index.html
          rm -f \
            .github/scripts/refactor_qiqi.part1 \
            .github/scripts/refactor_qiqi.part2 \
            .github/scripts/refactor_qiqi.part3 \
            .github/scripts/refactor_qiqi.part4 \
            .github/scripts/refactor_qiqi.part3a \
            .github/scripts/refactor_qiqi.part3b \
            .github/scripts/refactor_qiqi.part4a \
            .github/scripts/refactor_qiqi.part4b
      - name: Commit validated changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            historical-cases/regions/mainland-china/fujian-qiqi/index.html \
            en/historical-cases/regions/mainland-china/fujian-qiqi/index.html \
            ja/historical-cases/regions/mainland-china/fujian-qiqi/index.html \
            zh-hans/historical-cases/regions/mainland-china/fujian-qiqi/index.html \
            assets/fujian-qiqi-feature.css \
            assets/fujian-qiqi-feature.js \
            assets/home-view-counter-20260811.css \
            assets/fujian-qiqi/og-share-20260821.jpg \
            sitemap.xml \
            assets/fujian-qiqi-dialogue-hotfix.css \
            assets/fujian-qiqi-ronghua.css \
            assets/fujian-qiqi-gsap-refine.css \
            assets/fujian-qiqi-gsap-refine.js \
            assets/fujian-qiqi/ronghua-peony.svg \
            assets/fujian-qiqi/ronghua-camellia.svg \
            .github/workflows/oneoff-fujian-putian-name.yml \
            .github/workflows/oneoff-qiqi-dialogue-hotfix.yml \
            .github/workflows/oneoff-qiqi-ending-punctuation.yml \
            .github/workflows/oneoff-qiqi-gsap-refine.yml \
            .github/workflows/oneoff-qiqi-ronghua.yml \
            .github/workflows/refactor-qiqi-stabilization.yml \
            .github/scripts/refactor_qiqi.part1 \
            .github/scripts/refactor_qiqi.part2 \
            .github/scripts/refactor_qiqi.part3 \
            .github/scripts/refactor_qiqi.part4 \
            .github/scripts/refactor_qiqi.part3a \
            .github/scripts/refactor_qiqi.part3b \
            .github/scripts/refactor_qiqi.part4a \
            .github/scripts/refactor_qiqi.part4b
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m 'Refactor and stabilize Fujian Qiqi feature'
          git push origin HEAD
