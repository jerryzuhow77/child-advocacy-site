name: Publish and verify out-of-home care as a new Chapter 2 major chapter

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oneoff-kaikai-out-of-home-major-chapter-20260829.yml'

permissions:
  contents: write

jobs:
  publish-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare localized patch and verifier
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/prepare-kaikai-out-of-home-major-chapter-20260829.py
          python3 -m py_compile .github/scripts/promote-kaikai-out-of-home-major-chapter-20260829.py
          node --check .github/scripts/verify-kaikai-out-of-home-major-chapter-20260829.mjs

      - name: Promote the existing out-of-home care content into a major chapter
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin main
          python3 .github/scripts/promote-kaikai-out-of-home-major-chapter-20260829.py
          node --check hearing-records/prison-watch/kaikai-final-chapter/final-chapter.js
          git diff --check

          pages=(
            hearing-records/prison-watch/kaikai-final-chapter/index.html
            hearing-records/prison-watch/kaikai-final-chapter/zh-Hans/index.html
          )
          for page in "${pages[@]}"; do
            test "$(grep -o 'id="out-of-home-chapter"' "$page" | wc -l)" -eq 1
            test "$(grep -o 'id="placement-spectrum"' "$page" | wc -l)" -eq 1
            test "$(grep -o 'id="placement-state-duty"' "$page" | wc -l)" -eq 1
            test "$(grep -o 'id="placement-failures"' "$page" | wc -l)" -eq 1
            test "$(grep -o 'id="placement-harm-cases"' "$page" | wc -l)" -eq 1
            test "$(grep -o 'id="placement-data-panel"' "$page" | wc -l)" -eq 1
            test "$(grep -o 'id="placement-boundary"' "$page" | wc -l)" -eq 1
            test "$(grep -o 'class="nav-group nav-group-major out-of-home-nav"' "$page" | wc -l)" -eq 1
            test "$(grep -o 'class="placement-harm-card' "$page" | wc -l)" -eq 4
            test "$(grep -o 'class="placement-data-grid"' "$page" | wc -l)" -eq 2
          done

          CSS_VERSION="$(grep -o 'final-chapter.css?v=20260829-[0-9]*' "${pages[0]}" | head -1 | cut -d= -f2)"
          test -n "$CSS_VERSION"
          grep -q "final-chapter.css?v=${CSS_VERSION}" "${pages[1]}"
          echo "CSS_VERSION=${CSS_VERSION}" >> "$GITHUB_ENV"

          css='hearing-records/prison-watch/kaikai-final-chapter/final-chapter.css'
          grep -q 'OUT-OF-HOME-MAJOR-CHAPTER-20260829' "$css"
          grep -q '.out-of-home-major-chapter' "$css"
          grep -q '.nav-group-major' "$css"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hearing-records/prison-watch/kaikai-final-chapter/index.html
          git add hearing-records/prison-watch/kaikai-final-chapter/zh-Hans/index.html
          git add hearing-records/prison-watch/kaikai-final-chapter/final-chapter.css
          git commit -m 'Promote out-of-home care into a new major Chapter 2 chapter'
          pushed=0
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              pushed=1
              break
            fi
            git pull --rebase origin main
          done
          test "$pushed" -eq 1

      - name: Wait for GitHub Pages to expose the new major chapter
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p browser-validation/out-of-home-major-chapter
          pages=(
            'https://jerryzuhow77.github.io/child-advocacy-site/hearing-records/prison-watch/kaikai-final-chapter/'
            'https://jerryzuhow77.github.io/child-advocacy-site/hearing-records/prison-watch/kaikai-final-chapter/zh-Hans/'
          )
          css_url='https://jerryzuhow77.github.io/child-advocacy-site/hearing-records/prison-watch/kaikai-final-chapter/final-chapter.css'
          for attempt in $(seq 1 120); do
            ready=1
            for i in 0 1; do
              token="${GITHUB_SHA}-${attempt}-${i}"
              html="$(curl -fsSL --connect-timeout 15 --max-time 30 "${pages[$i]}?qa=${token}" || true)"
              grep -q 'id="out-of-home-chapter"' <<<"$html" || ready=0
              grep -q 'class="nav-group nav-group-major out-of-home-nav"' <<<"$html" || ready=0
              grep -q 'id="placement-data-panel"' <<<"$html" || ready=0
              grep -q 'id="placement-boundary"' <<<"$html" || ready=0
              grep -q "final-chapter.css?v=${CSS_VERSION}" <<<"$html" || ready=0
            done
            css="$(curl -fsSL --connect-timeout 15 --max-time 30 "${css_url}?v=${CSS_VERSION}&qa=${GITHUB_SHA}-${attempt}" || true)"
            grep -q 'OUT-OF-HOME-MAJOR-CHAPTER-20260829' <<<"$css" || ready=0
            if [[ "$ready" -eq 1 ]]; then
              echo 'The new major chapter is public in both languages.'
              exit 0
            fi
            sleep 10
          done
          echo 'Timed out before GitHub Pages exposed the new major chapter.' >&2
          exit 1

      - name: Install Playwright driver
        run: npm install --no-save playwright-core@1.55.0

      - name: Verify Traditional and Simplified desktop and mobile Chrome layouts
        run: node .github/scripts/verify-kaikai-out-of-home-major-chapter-20260829.mjs

      - name: Upload browser screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kaikai-out-of-home-major-chapter-browser-proof
          path: browser-validation/out-of-home-major-chapter
          retention-days: 14

      - name: Remove completed one-off tools
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main
          git rm -f --ignore-unmatch .github/workflows/oneoff-kaikai-out-of-home-major-chapter-20260829.yml
          git rm -f --ignore-unmatch .github/scripts/promote-kaikai-out-of-home-major-chapter-20260829.py
          git rm -f --ignore-unmatch .github/scripts/verify-kaikai-out-of-home-major-chapter-20260829.mjs
          git rm -f --ignore-unmatch .github/scripts/prepare-kaikai-out-of-home-major-chapter-20260829.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Remove completed out-of-home major chapter publication tools'
          pushed=0
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              pushed=1
              break
            fi
            git pull --rebase origin main
          done
          test "$pushed" -eq 1
