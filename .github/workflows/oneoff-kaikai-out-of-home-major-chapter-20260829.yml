name: Publish and verify out-of-home care as a new Chapter 2 major chapter

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oneoff-kaikai-out-of-home-major-chapter-20260829.yml'

permissions:
  contents: write

jobs:
  publish-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Normalize localized labels and verifier behavior
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          patch_path = Path('.github/scripts/promote-kaikai-out-of-home-major-chapter-20260829.py')
          patch = patch_path.read_text(encoding='utf-8')
          old = """        'path': ROOT / 'zh-Hans' / 'index.html',
        'responsibility_summary': '制度責任',
"""
          new = """        'path': ROOT / 'zh-Hans' / 'index.html',
        'responsibility_summary': '制度责任',
"""
          if old in patch:
              patch = patch.replace(old, new, 1)
          elif new not in patch:
              raise SystemExit('Simplified responsibility summary was not found in the promotion script')
          patch_path.write_text(patch, encoding='utf-8')

          verifier_path = Path('.github/scripts/verify-kaikai-out-of-home-major-chapter-20260829.mjs')
          verifier = verifier_path.read_text(encoding='utf-8')
          old_config = """  'zh-Hans': {
    url: 'https://jerryzuhow77.github.io/child-advocacy-site/hearing-records/prison-watch/kaikai-final-chapter/zh-Hans/',
    majorSummary: '家外安置大篇章',
    majorTitle: '离开危险以后，谁持续保护孩子？',
    heroEntry: '家外安置大篇章',
    startLink: '开始阅读完整专章',
    responsibilitySummary: '制度責任',
"""
          new_config = """  'zh-Hans': {
    url: 'https://jerryzuhow77.github.io/child-advocacy-site/hearing-records/prison-watch/kaikai-final-chapter/zh-Hans/',
    majorSummary: '家外安置大篇章',
    majorTitle: '离开危险以后，谁持续保护孩子？',
    heroEntry: '家外安置大篇章',
    startLink: '开始阅读完整专章',
    responsibilitySummary: '制度责任',
"""
          if old_config in verifier:
              verifier = verifier.replace(old_config, new_config, 1)
          elif new_config not in verifier:
              raise SystemExit('Simplified verifier configuration was not found')

          old_open = """      if (!(await group.getAttribute('open'))) await summary.click();
"""
          new_open = """      if (!(await group.evaluate((element) => element.hasAttribute('open')))) await summary.click();
"""
          if old_open in verifier:
              verifier = verifier.replace(old_open, new_open, 1)
          elif new_open not in verifier:
              raise SystemExit('Major navigation open-state check was not found')
          verifier_path.write_text(verifier, encoding='utf-8')
          PY
          python3 -m py_compile .github/scripts/promote-kaikai-out-of-home-major-chapter-20260829.py
          node --check .github/scripts/verify-kaikai-out-of-home-major-chapter-20260829.mjs

      - name: Promote the existing out-of-home care content into a major chapter
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin main
          python3 .github/scripts/promote-kaikai-out-of-home-major-chapter-20260829.py
          node --check hearing-records/prison-watch/kaikai-final-chapter/final-chapter.js
          git diff --check

          python3 - <<'PY'
          import re
          from pathlib import Path

          pages = [
              Path('hearing-records/prison-watch/kaikai-final-chapter/index.html'),
              Path('hearing-records/prison-watch/kaikai-final-chapter/zh-Hans/index.html'),
          ]
          versions = []
          for page in pages:
              text = page.read_text(encoding='utf-8')
              match = re.search(r'final-chapter\.css\?v=(20260829-\d+)', text)
              if not match:
                  raise SystemExit(f'{page}: CSS version not found')
              versions.append(match.group(1))
              expected = {
                  'id="out-of-home-chapter"': 1,
                  'id="placement-spectrum"': 1,
                  'id="placement-state-duty"': 1,
                  'id="placement-failures"': 1,
                  'id="placement-harm-cases"': 1,
                  'id="placement-data-panel"': 1,
                  'id="placement-boundary"': 1,
                  'class="nav-group nav-group-major out-of-home-nav"': 1,
                  'class="out-of-home-major-stats"': 1,
              }
              for phrase, count in expected.items():
                  actual = text.count(phrase)
                  if actual != count:
                      raise SystemExit(f'{page}: {phrase} expected {count}, found {actual}')
              major = re.search(r'<details class="nav-group nav-group-major out-of-home-nav">.*?</details>', text, flags=re.S)
              if not major or major.group(0).count('<a ') != 7:
                  raise SystemExit(f'{page}: major menu must have seven links')
              if text.count('class="placement-failure-grid"') != 1 or text.count('class="placement-harm-card') != 4 or text.count('class="placement-data-grid"') != 2:
                  raise SystemExit(f'{page}: existing out-of-home content was not preserved')
          if len(set(versions)) != 1:
              raise SystemExit(f'Localized CSS versions differ: {versions}')
          Path('/tmp/out-of-home-major-css-version.txt').write_text(versions[0], encoding='utf-8')
          print(f'CSS_VERSION={versions[0]}')
          PY
          echo "CSS_VERSION=$(cat /tmp/out-of-home-major-css-version.txt)" >> "$GITHUB_ENV"

          css='hearing-records/prison-watch/kaikai-final-chapter/final-chapter.css'
          grep -q 'OUT-OF-HOME-MAJOR-CHAPTER-20260829' "$css"
          grep -q '.out-of-home-major-chapter' "$css"
          grep -q '.nav-group-major' "$css"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hearing-records/prison-watch/kaikai-final-chapter/index.html
          git add hearing-records/prison-watch/kaikai-final-chapter/zh-Hans/index.html
          git add hearing-records/prison-watch/kaikai-final-chapter/final-chapter.css
          git commit -m 'Promote out-of-home care into a new major Chapter 2 chapter'
          pushed=0
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              pushed=1
              break
            fi
            git pull --rebase origin main
          done
          test "$pushed" -eq 1

      - name: Wait for GitHub Pages to expose the new major chapter
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p browser-validation/out-of-home-major-chapter
          pages=(
            'https://jerryzuhow77.github.io/child-advocacy-site/hearing-records/prison-watch/kaikai-final-chapter/'
            'https://jerryzuhow77.github.io/child-advocacy-site/hearing-records/prison-watch/kaikai-final-chapter/zh-Hans/'
          )
          css_url='https://jerryzuhow77.github.io/child-advocacy-site/hearing-records/prison-watch/kaikai-final-chapter/final-chapter.css'
          for attempt in $(seq 1 120); do
            ready=1
            for i in 0 1; do
              token="${GITHUB_SHA}-${attempt}-${i}"
              html="$(curl -fsSL --connect-timeout 15 --max-time 30 "${pages[$i]}?qa=${token}" || true)"
              grep -q 'id="out-of-home-chapter"' <<<"$html" || ready=0
              grep -q 'class="nav-group nav-group-major out-of-home-nav"' <<<"$html" || ready=0
              grep -q 'id="placement-data-panel"' <<<"$html" || ready=0
              grep -q 'id="placement-boundary"' <<<"$html" || ready=0
              grep -q "final-chapter.css?v=${CSS_VERSION}" <<<"$html" || ready=0
            done
            css="$(curl -fsSL --connect-timeout 15 --max-time 30 "${css_url}?v=${CSS_VERSION}&qa=${GITHUB_SHA}-${attempt}" || true)"
            grep -q 'OUT-OF-HOME-MAJOR-CHAPTER-20260829' <<<"$css" || ready=0
            if [[ "$ready" -eq 1 ]]; then
              echo 'The new major chapter is public in both languages.'
              exit 0
            fi
            sleep 10
          done
          echo 'Timed out before GitHub Pages exposed the new major chapter.' >&2
          exit 1

      - name: Install Playwright driver
        run: npm install --no-save playwright-core@1.55.0

      - name: Verify Traditional and Simplified desktop and mobile Chrome layouts
        run: node .github/scripts/verify-kaikai-out-of-home-major-chapter-20260829.mjs

      - name: Upload browser screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kaikai-out-of-home-major-chapter-browser-proof
          path: browser-validation/out-of-home-major-chapter
          retention-days: 14

      - name: Remove completed one-off tools
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main
          git rm -f --ignore-unmatch .github/workflows/oneoff-kaikai-out-of-home-major-chapter-20260829.yml
          git rm -f --ignore-unmatch .github/scripts/promote-kaikai-out-of-home-major-chapter-20260829.py
          git rm -f --ignore-unmatch .github/scripts/verify-kaikai-out-of-home-major-chapter-20260829.mjs
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Remove completed out-of-home major chapter publication tools'
          pushed=0
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              pushed=1
              break
            fi
            git pull --rebase origin main
          done
          test "$pushed" -eq 1
