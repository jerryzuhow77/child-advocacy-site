name: Verify Day 5 images on GitHub Pages

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/day5-live-image-check-trigger.txt'

permissions:
  contents: read

jobs:
  verify-live:
    if: github.head_ref == 'verify-day5-live-images-20260822'
    runs-on: ubuntu-latest
    steps:
      - name: Check live page and both selected JPEG posters
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet pillow requests
          python - <<'PY'
          from __future__ import annotations
          from io import BytesIO
          from PIL import Image, ImageStat
          import requests, time

          base = 'https://jerryzuhow77.github.io/child-advocacy-site'
          page_url = base + '/hearing-records/prison-watch/kaikai-day5-20250429/?v=20260822-jpeg-blank-fix-1'
          images = [
              base + '/assets/art/prison-watch-day5-selected-evidence-01-zh-hant-20260822.jpg?v=20260822-jpeg-blank-fix-1',
              base + '/assets/art/prison-watch-day5-selected-evidence-02-zh-hant-20260822.jpg?v=20260822-jpeg-blank-fix-1',
          ]
          session = requests.Session()
          session.headers['User-Agent'] = 'Day5-live-image-verifier/1.0'
          last_error = None

          for attempt in range(1, 16):
              try:
                  page = session.get(page_url + f'&attempt={attempt}', timeout=25)
                  page.raise_for_status()
                  text = page.text
                  required = [
                      'prison-watch-day5-selected-evidence-01-zh-hant-20260822.jpg',
                      'prison-watch-day5-selected-evidence-02-zh-hant-20260822.jpg',
                      '42處是可確認下限，不是完整總數',
                      '不是只有42處',
                  ]
                  missing = [item for item in required if item not in text]
                  if missing:
                      raise RuntimeError(f'Live HTML is stale; missing {missing}')

                  for index, url in enumerate(images, 1):
                      response = session.get(url + f'&attempt={attempt}', timeout=30)
                      response.raise_for_status()
                      if response.headers.get('content-type', '').split(';')[0] not in {'image/jpeg', 'image/jpg'}:
                          raise RuntimeError(f'Poster {index} content type: {response.headers.get("content-type")}')
                      if len(response.content) < 100_000:
                          raise RuntimeError(f'Poster {index} is undersized: {len(response.content)} bytes')
                      with Image.open(BytesIO(response.content)) as image:
                          image.load()
                          if image.format != 'JPEG' or image.size != (512, 768):
                              raise RuntimeError(f'Poster {index}: {image.format}, {image.size}')
                          stat = ImageStat.Stat(image.convert('RGB').resize((64, 96)))
                          if max(stat.var) < 100:
                              raise RuntimeError(f'Poster {index} appears blank; variance={stat.var}')
                          print(f'Poster {index}: HTTP {response.status_code}, {len(response.content)} bytes, {image.size}, variance={stat.var}')

                  print(f'Live page verified on attempt {attempt}: {page.status_code}, {len(page.content)} bytes')
                  break
              except Exception as exc:
                  last_error = exc
                  print(f'Attempt {attempt} failed: {exc}')
                  if attempt == 15:
                      raise
                  time.sleep(20)
          else:
              raise RuntimeError(last_error)
          PY
