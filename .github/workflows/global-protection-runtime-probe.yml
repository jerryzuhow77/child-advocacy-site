name: Global Protection runtime read-only probe
# Refreshed 2026-08-30 for read-only deployment connectivity verification

on:
  push:
    branches:
      - ops/global-protection-runtime-probe-20260823
    paths:
      - .github/workflows/global-protection-runtime-probe.yml

permissions:
  contents: read

concurrency:
  group: global-protection-runtime-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      HOST: 150.109.69.104
      DOMAIN: cn.globalprotectionwall.com
      WORKER_URL: https://global-protection-sync.jerryzuhow77.workers.dev/
    steps:
      - uses: actions/checkout@v4

      - name: Read-only application route probe
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p probe-output/assets

          curl -ksS --max-time 20 --resolve "${DOMAIN}:443:${HOST}" \
            "https://${DOMAIN}/" -D probe-output/home.headers -o probe-output/home.html || true

          python3 - <<'PY'
          import re, pathlib
          html=pathlib.Path('probe-output/home.html').read_text(errors='ignore')
          srcs=[]
          for s in re.findall(r'<script[^>]+src=["\']([^"\']+)', html):
              if s.startswith('/') and s not in srcs: srcs.append(s)
          pathlib.Path('probe-output/script-srcs.txt').write_text('\n'.join(srcs[:80]))
          PY

          i=0
          while IFS= read -r src; do
            [ -n "$src" ] || continue
            i=$((i+1))
            curl -ksS --max-time 20 --resolve "${DOMAIN}:443:${HOST}" \
              "https://${DOMAIN}${src}" -o "probe-output/assets/${i}.js" || true
          done < probe-output/script-srcs.txt

          cat probe-output/home.html probe-output/assets/*.js 2>/dev/null > probe-output/all-front-end.txt || true
          python3 - <<'PY'
          import re, pathlib
          text=pathlib.Path('probe-output/all-front-end.txt').read_text(errors='ignore')
          apis=sorted(set(re.findall(r'/api/[A-Za-z0-9_?=&%./:-]+', text)))
          keys=[]
          for pat in ['moderation','pending','review','approve','reject','submit','submission','sync','admin','guest','message']:
              if re.search(pat,text,re.I): keys.append(pat)
          pathlib.Path('probe-output/api-routes.txt').write_text('\n'.join(apis[:300]))
          pathlib.Path('probe-output/keyword-presence.txt').write_text('\n'.join(keys))
          PY

          : > probe-output/route-status.txt
          while IFS= read -r path; do
            [ -n "$path" ] || continue
            code=$(curl -ksS --max-time 12 --resolve "${DOMAIN}:443:${HOST}" \
              -o /dev/null -w '%{http_code}' "https://${DOMAIN}${path}" || true)
            printf '%s %s\n' "$code" "$path" >> probe-output/route-status.txt
          done < probe-output/api-routes.txt

          curl -ksS --max-time 15 --resolve "${DOMAIN}:443:${HOST}" \
            -D probe-output/public-messages.headers \
            "https://${DOMAIN}/api/public/messages" \
            -o probe-output/public-messages.body || true

          curl -sS --max-time 15 -D probe-output/worker.headers "$WORKER_URL" \
            -o probe-output/worker.body || true

          {
            echo '## Global Protection application route probe'
            echo
            echo '### API routes discovered in front-end bundles'
            echo '```text'
            cat probe-output/api-routes.txt || true
            echo '```'
            echo
            echo '### Read-only GET status'
            echo '```text'
            cat probe-output/route-status.txt || true
            echo '```'
            echo
            echo '### Relevant bundle keywords'
            echo '```text'
            cat probe-output/keyword-presence.txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload sanitized probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: global-protection-application-route-probe
          path: probe-output/
          retention-days: 3
