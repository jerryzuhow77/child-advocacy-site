name: Publish user-selected Day 5 art

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/day5-selected-art-trigger.txt'

permissions:
  contents: write

concurrency:
  group: oneoff-day5-user-selected-art
  cancel-in-progress: false

jobs:
  publish:
    if: github.head_ref == 'trigger-day5-user-selected-art-20260822'
    runs-on: ubuntu-latest
    steps:
      - name: Check out production branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Reconstruct the selected second poster and refresh references
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin main

          target='assets/art/prison-watch-day5-medical-zh-hant-20260822.webp'
          temporary='/tmp/day5-medical-selected.webp'
          cat .github/day5-selected-medical/part*.b64 | base64 --decode > "$temporary"
          printf '%s  %s\n' 'd8d4dd77bef5bb0f63f6d1f65c455a4dc09b2d60b84ae3d64a7616df246d60ab' "$temporary" | sha256sum --check --strict
          printf '%s  %s\n' '91578cae32c993ba149cb477527c2e686d3378f1e201bbbb553ac064422f07f1' 'assets/art/prison-watch-day5-forensic-zh-hant-20260822.webp' | sha256sum --check --strict
          mv "$temporary" "$target"

          python - <<'PY'
          from pathlib import Path
          import re

          version = '20260822-user-selected-1'
          names = [
              'prison-watch-day5-forensic-zh-hant-20260822.webp',
              'prison-watch-day5-medical-zh-hant-20260822.webp',
          ]
          pages = [
              Path('hearing-records/prison-watch/kaikai-day5-20250429/index.html'),
              Path('en/hearing-records/prison-watch/kaikai-day5-20250429/index.html'),
              Path('ja/hearing-records/prison-watch/kaikai-day5-20250429/index.html'),
              Path('source/hearing-records/prison-watch/kaikai-day5-20250429/index.html'),
              Path('source/en/hearing-records/prison-watch/kaikai-day5-20250429/index.html'),
              Path('source/ja/hearing-records/prison-watch/kaikai-day5-20250429/index.html'),
          ]
          for page in pages:
              text = page.read_text(encoding='utf-8')
              for name in names:
                  text = text.replace(name + '?v=' + version, name)
                  text = text.replace(name, name + '?v=' + version)
              page.write_text(text, encoding='utf-8')

          sw = Path('sw.js')
          text = sw.read_text(encoding='utf-8')
          text = re.sub(
              r"const VERSION = '[^']+';",
              "const VERSION = '2026-08-22-day5-user-selected-art-v1';",
              text,
              count=1,
          )
          sw.write_text(text, encoding='utf-8')
          PY

          test "$(stat -c %s assets/art/prison-watch-day5-forensic-zh-hant-20260822.webp)" -gt 400000
          test "$(stat -c %s assets/art/prison-watch-day5-medical-zh-hant-20260822.webp)" -gt 150000
          grep -Fq 'prison-watch-day5-forensic-zh-hant-20260822.webp?v=20260822-user-selected-1' hearing-records/prison-watch/kaikai-day5-20250429/index.html
          grep -Fq 'prison-watch-day5-medical-zh-hant-20260822.webp?v=20260822-user-selected-1' hearing-records/prison-watch/kaikai-day5-20250429/index.html
          grep -Fq "const VERSION = '2026-08-22-day5-user-selected-art-v1';" sw.js
          git diff --check

      - name: Commit verified artwork replacement
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github/day5-selected-medical
          rm -f .github/day5-selected-art-trigger.txt
          rm -f .github/workflows/oneoff-day5-user-selected-art.yml

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && { echo 'No artwork changes produced.'; exit 1; }
          git commit -m 'Use selected Day 5 evidence-investigation artwork'
          git pull --rebase origin main
          git push origin main
