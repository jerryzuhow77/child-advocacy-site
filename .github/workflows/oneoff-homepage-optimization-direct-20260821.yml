name: Directly publish homepage optimization

on:
  push:
    paths:
      - '.github/workflows/oneoff-homepage-optimization-direct-20260821.yml'

permissions:
  contents: write

concurrency:
  group: homepage-optimization-20260821-direct
  cancel-in-progress: false

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Start from newest main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B homepage-optimization origin/main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image tooling
        run: python -m pip install --disable-pip-version-check pillow

      - name: Recover and validate optimization script
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64
          import re
          import zlib

          source = Path('.github/workflows/oneoff-homepage-optimization-20260821.yml').read_text(encoding='utf-8')
          match = re.search(r"<<'PAYLOAD'\n(?P<data>.*?)\n[ \t]*PAYLOAD[ \t]*\n", source, re.S)
          if not match:
              raise SystemExit('Embedded homepage optimization payload was not found')
          encoded = ''.join(match.group('data').split())
          script = zlib.decompress(base64.b64decode(encoded))
          target = Path('/tmp/homepage_optimize_20260821.py')
          target.write_bytes(script)
          print(f'Recovered optimization script: {len(script):,} bytes')
          PY
          python -m py_compile /tmp/homepage_optimize_20260821.py

      - name: Apply and validate homepage optimization
        run: python /tmp/homepage_optimize_20260821.py

      - name: Commit without overwriting concurrent work
        shell: bash
        run: |
          set -euo pipefail
          rm -- \
            .github/workflows/oneoff-homepage-optimization-20260821.yml \
            .github/workflows/oneoff-homepage-optimization-retry-20260821.yml \
            .github/workflows/oneoff-homepage-optimization-direct-20260821.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            index.html \
            en/index.html \
            assets/home-gsap.js \
            assets/home-gsap.css \
            assets/home-optimization-20260821.css \
            assets/art/dui-police-killing-poster-home.webp \
            assets/art/lin-xinci-missing-four-days-home.webp \
            sitemap.xml \
            sw.js \
            .github/workflows/oneoff-homepage-optimization-20260821.yml \
            .github/workflows/oneoff-homepage-optimization-retry-20260821.yml \
            .github/workflows/oneoff-homepage-optimization-direct-20260821.yml
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m 'Optimize homepage hierarchy performance and accessibility'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
