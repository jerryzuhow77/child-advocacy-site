name: Recover Hong Kong blank page

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hk-mobile-first-paint-recovery.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hong-kong-blank-page-recovery
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HK_HOST: ${{ secrets.TENCENT_SSH_HOST }}
      HK_USER: ${{ secrets.TENCENT_SSH_USER }}
      HK_PORT: ${{ secrets.TENCENT_SSH_PORT }}
      HK_KEY_A: ${{ secrets.TENCENT_SSH_PRIVATE_KEY }}
      HK_KEY_B: ${{ secrets.TENCENT_CVM_SSH_KEY }}
      HK_KEY_C: ${{ secrets.SSH_PRIVATE_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
    steps:
      - name: Configure SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          host="${HK_HOST:-150.109.69.104}"
          user="${HK_USER:-ubuntu}"
          port="${HK_PORT:-22}"
          key="${HK_KEY_A:-${HK_KEY_B:-${HK_KEY_C:-}}}"
          test -n "$key" || { echo '::error::Hong Kong SSH key is unavailable.'; exit 1; }
          mkdir -p ~/.ssh
          printf '%s\n' "$key" > ~/.ssh/hk_key
          chmod 600 ~/.ssh/hk_key
          ssh-keyscan -p "$port" "$host" > ~/.ssh/known_hosts
          printf 'HOST=%s\nUSER=%s\nPORT=%s\n' "$host" "$user" "$port" >> "$GITHUB_ENV"

      - name: Install blank-page recovery
        id: patch
        shell: bash
        run: |
          set -Eeuo pipefail
          css_name="$(ssh -i ~/.ssh/hk_key -p "$PORT" "$USER@$HOST" \
            "curl -fsS --max-time 15 http://127.0.0.1:8787/" \
            | sed -nE 's#.*href="/assets/([^"?]+\.css)[^"]*".*#\1#p' | head -n 1)"
          test -n "$css_name" || { echo '::error::Could not resolve the live stylesheet.'; exit 1; }
          js_name="$(ssh -i ~/.ssh/hk_key -p "$PORT" "$USER@$HOST" \
            "curl -fsS --max-time 15 http://127.0.0.1:8787/" \
            | sed -nE 's#.*(src|href)="/assets/(guardian-wall-[^"?]+\.js)[^"]*".*#\2#p' | head -n 1)"
          test -n "$js_name" || { echo '::error::Could not resolve the live Guardian Wall script.'; exit 1; }
          if [[ "$js_name" == *-localefix-v1.js ]]; then
            js_new_name="$js_name"
          else
            js_new_name="${js_name%.js}-localefix-v1.js"
          fi
          printf 'css_name=%s\n' "$css_name" >> "$GITHUB_OUTPUT"
          printf 'js_name=%s\n' "$js_name" >> "$GITHUB_OUTPUT"
          printf 'js_new_name=%s\n' "$js_new_name" >> "$GITHUB_OUTPUT"

          ssh -i ~/.ssh/hk_key -p "$PORT" "$USER@$HOST" \
            "sudo CSS_NAME='$css_name' JS_NAME='$js_name' JS_NEW_NAME='$js_new_name' python3 -" <<'PY'
          from pathlib import Path
          import os

          marker = "hk-mobile-first-paint-v1"
          css_name = os.environ["CSS_NAME"]
          roots = [Path("/var/www"), Path("/srv"), Path("/opt"), Path("/home/ubuntu")]
          matches = []
          for root in roots:
              if root.exists():
                  matches.extend(root.rglob(css_name))
          matches = [path for path in matches if path.is_file()]
          if not matches:
              raise SystemExit(f"Live stylesheet not found: {css_name}")

          rule = '''
          /* hk-mobile-first-paint-v1: keep core content visible if GSAP stalls in Android WebView/Chrome */
          @media (max-width:980px){
            .gsap-enhanced .site-header,
            .gsap-enhanced .visitor-launch-section,
            .gsap-enhanced .hero-copy>*,
            .gsap-enhanced .hero-art,
            .gsap-enhanced .paper-sky-art,
            .gsap-enhanced .kaikai-clay-heart{
              opacity:1!important;
              visibility:visible!important;
              transform:none!important;
            }
          }
          '''
          patched = 0
          for path in matches:
              text = path.read_text(encoding="utf-8", errors="strict")
              if ".gsap-enhanced .hero-copy" not in text:
                  continue
              repaired = text.replace(r"\n/* " + marker, "\n/* " + marker)
              if marker not in repaired:
                  repaired += rule
              if repaired != text:
                  path.write_text(repaired, encoding="utf-8")
              patched += 1
          if patched == 0:
              raise SystemExit("No matching Guardian Wall stylesheet was patched")
          print(f"Patched {patched} live stylesheet(s)")

          js_name = os.environ["JS_NAME"]
          js_new_name = os.environ["JS_NEW_NAME"]
          js_matches = []
          for root in roots:
              if root.exists():
                  js_matches.extend(root.rglob(js_name))
          js_matches = [path for path in js_matches if path.is_file()]
          if not js_matches:
              raise SystemExit(f"Live Guardian Wall script not found: {js_name}")

          unsafe = 'function P(e,t){return e[t]||e[`zh-Hant`]||e.en||``}'
          safe = 'function P(e,t){return e?.[t]||e?.[`zh-Hant`]||e?.en||``}'
          js_patched = 0
          html_patched = 0
          for path in js_matches:
              try:
                  text = path.read_text(encoding="utf-8", errors="strict")
              except UnicodeDecodeError:
                  continue
              if safe not in text and unsafe not in text:
                  continue
              repaired = text.replace(unsafe, safe, 1)
              target = path.with_name(js_new_name)
              try:
                  target_current = target.read_text(encoding="utf-8", errors="strict")
              except (FileNotFoundError, UnicodeDecodeError):
                  target_current = None
              if target_current != repaired:
                  target.write_text(repaired, encoding="utf-8")
              js_patched += 1
          if js_patched == 0:
              raise SystemExit("No matching Guardian Wall locale helper was patched")
          for root in roots:
              if not root.exists():
                  continue
              for html_path in root.rglob("*.html"):
                  try:
                      html = html_path.read_text(encoding="utf-8", errors="strict")
                  except UnicodeDecodeError:
                      continue
                  updated = html.replace(js_name, js_new_name)
                  if updated != html:
                      html_path.write_text(updated, encoding="utf-8")
                      html_patched += 1
          if js_name != js_new_name and html_patched == 0:
              raise SystemExit("No Guardian Wall HTML reference was updated")
          print(f"Published {js_patched} repaired script(s); updated {html_patched} HTML file(s)")
          PY

      - name: Purge patched assets from Cloudflare
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ZONE_ID != ''
        shell: bash
        env:
          CSS_NAME: ${{ steps.patch.outputs.css_name }}
          JS_NAME: ${{ steps.patch.outputs.js_name }}
          JS_NEW_NAME: ${{ steps.patch.outputs.js_new_name }}
        run: |
          set -Eeuo pipefail
          response="$(curl -fsS --max-time 20 \
            -X POST "https://api.cloudflare.com/client/v4/zones/$CLOUDFLARE_ZONE_ID/purge_cache" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H 'Content-Type: application/json' \
            --data "{\"files\":[\"https://cn.globalprotectionwall.com/\",\"https://cn.globalprotectionwall.com/assets/$CSS_NAME\",\"https://cn.globalprotectionwall.com/assets/$JS_NAME\",\"https://cn.globalprotectionwall.com/assets/$JS_NEW_NAME\"]}")"
          printf '%s' "$response" | python3 -c 'import json,sys; assert json.load(sys.stdin).get("success") is True'

      - name: Verify blank-page recovery
        shell: bash
        env:
          CSS_NAME: ${{ steps.patch.outputs.css_name }}
          JS_NEW_NAME: ${{ steps.patch.outputs.js_new_name }}
        run: |
          set -Eeuo pipefail
          css="$(curl -fsS --retry 5 --retry-delay 3 --max-time 25 \
            -A 'Mozilla/5.0 (Linux; Android 16; SM-F9360) AppleWebKit/537.36 Chrome/140.0 Mobile Safari/537.36' \
            "https://cn.globalprotectionwall.com/assets/$CSS_NAME")"
          grep -Fq 'hk-mobile-first-paint-v1' <<<"$css"
          if grep -Fq '\n/* hk-mobile-first-paint-v1' <<<"$css"; then
            echo '::error::Mobile CSS still contains an invalid literal newline.'
            exit 1
          fi
          page="$(curl -fsS --retry 5 --retry-delay 3 --max-time 25 \
            -A 'Mozilla/5.0 (Linux; Android 16; SM-F9360) AppleWebKit/537.36 Chrome/140.0 Mobile Safari/537.36' \
            https://cn.globalprotectionwall.com/)"
          grep -Fq '全球守護留言牆' <<<"$page"
          grep -Fq "/assets/$JS_NEW_NAME" <<<"$page"
          curl -fsS --retry 5 --retry-delay 3 --max-time 25 \
            -A 'Mozilla/5.0 (Linux; Android 16; SM-F9360) AppleWebKit/537.36 Chrome/140.0 Mobile Safari/537.36' \
            "https://cn.globalprotectionwall.com/assets/$JS_NEW_NAME" > /tmp/guardian-wall.js
          python3 - <<'PY'
          from pathlib import Path

          text = Path("/tmp/guardian-wall.js").read_text(encoding="utf-8", errors="strict")
          unsafe = 'function P(e,t){return e[t]||e[`zh-Hant`]||e.en||``}'
          safe = 'function P(e,t){return e?.[t]||e?.[`zh-Hant`]||e?.en||``}'
          assert safe in text, "Safe locale fallback is missing from the live script"
          assert unsafe not in text, "Unsafe locale fallback remains in the live script"
          PY
