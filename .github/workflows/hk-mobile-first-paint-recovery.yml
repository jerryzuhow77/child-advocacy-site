name: Recover Hong Kong blank page and mobile layout

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hk-mobile-first-paint-recovery.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hong-kong-blank-page-recovery
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HK_HOST: ${{ secrets.TENCENT_SSH_HOST }}
      HK_USER: ${{ secrets.TENCENT_SSH_USER }}
      HK_PORT: ${{ secrets.TENCENT_SSH_PORT }}
      HK_KEY_A: ${{ secrets.TENCENT_SSH_PRIVATE_KEY }}
      HK_KEY_B: ${{ secrets.TENCENT_CVM_SSH_KEY }}
      HK_KEY_C: ${{ secrets.SSH_PRIVATE_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
    steps:
      - name: Configure SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          host="${HK_HOST:-150.109.69.104}"
          user="${HK_USER:-ubuntu}"
          port="${HK_PORT:-22}"
          key="${HK_KEY_A:-${HK_KEY_B:-${HK_KEY_C:-}}}"
          test -n "$key" || { echo '::error::Hong Kong SSH key is unavailable.'; exit 1; }
          mkdir -p ~/.ssh
          printf '%s\n' "$key" > ~/.ssh/hk_key
          chmod 600 ~/.ssh/hk_key
          ssh-keyscan -p "$port" "$host" > ~/.ssh/known_hosts
          printf 'HOST=%s\nUSER=%s\nPORT=%s\n' "$host" "$user" "$port" >> "$GITHUB_ENV"

      - name: Install blank-page recovery
        id: patch
        shell: bash
        run: |
          set -Eeuo pipefail
          css_name="$(ssh -i ~/.ssh/hk_key -p "$PORT" "$USER@$HOST" \
            "curl -fsS --max-time 15 http://127.0.0.1:8787/" \
            | sed -nE 's#.*href="/assets/([^"?]+\.css)[^"]*".*#\1#p' | head -n 1)"
          test -n "$css_name" || { echo '::error::Could not resolve the live stylesheet.'; exit 1; }
          js_name="$(ssh -i ~/.ssh/hk_key -p "$PORT" "$USER@$HOST" \
            "curl -fsS --max-time 15 http://127.0.0.1:8787/" \
            | sed -nE 's#.*(src|href)="/assets/(guardian-wall-[^"?]+\.js)[^"]*".*#\2#p' | head -n 1)"
          test -n "$js_name" || { echo '::error::Could not resolve the live Guardian Wall script.'; exit 1; }
          printf 'css_name=%s\n' "$css_name" >> "$GITHUB_OUTPUT"
          printf 'js_name=%s\n' "$js_name" >> "$GITHUB_OUTPUT"

          ssh -i ~/.ssh/hk_key -p "$PORT" "$USER@$HOST" \
            "sudo CSS_NAME='$css_name' JS_NAME='$js_name' python3 -" <<'PY'
          from pathlib import Path
          import os
          import tempfile

          marker = "hk-mobile-first-paint-v1"
          layout_marker = "hk-mobile-layout-guardrails-v1"
          css_name = os.environ["CSS_NAME"]
          roots = [Path("/var/www"), Path("/srv"), Path("/opt"), Path("/home/ubuntu")]

          def atomic_write_text(path, text):
              metadata = path.stat()
              fd, temporary_name = tempfile.mkstemp(
                  prefix=f".{path.name}.", suffix=".recovery-tmp", dir=path.parent
              )
              temporary = Path(temporary_name)
              try:
                  with os.fdopen(fd, "w", encoding="utf-8") as handle:
                      handle.write(text)
                      handle.flush()
                      os.fsync(handle.fileno())
                      os.fchmod(handle.fileno(), metadata.st_mode)
                      os.fchown(handle.fileno(), metadata.st_uid, metadata.st_gid)
                  os.replace(temporary, path)
              finally:
                  temporary.unlink(missing_ok=True)

          matches = []
          for root in roots:
              if root.exists():
                  matches.extend(root.rglob(css_name))
          matches = [path for path in matches if path.is_file()]
          if not matches:
              raise SystemExit(f"Live stylesheet not found: {css_name}")

          rule = '''
          /* hk-mobile-first-paint-v1: keep core content visible if GSAP stalls in Android WebView/Chrome */
          @media (max-width:980px){
            .gsap-enhanced .site-header,
            .gsap-enhanced .visitor-launch-section,
            .gsap-enhanced .hero-copy>*,
            .gsap-enhanced .hero-art,
            .gsap-enhanced .paper-sky-art,
            .gsap-enhanced .kaikai-clay-heart{
              opacity:1!important;
              visibility:visible!important;
              transform:none!important;
            }
          }
          '''

          layout_rule = '''
          /* hk-mobile-layout-guardrails-v1: compact mobile chrome without changing public data routes */
          .mobile-nav-locales{
            display:grid;
            grid-template-columns:repeat(2,minmax(0,1fr));
            gap:7px;
            padding:11px;
            border:1px solid rgba(67,103,103,.16);
            border-radius:16px 9px;
            background:rgba(235,241,235,.72);
          }
          .mobile-nav-locales button{
            min-width:0;
            min-height:40px;
            padding:7px 8px;
            border:1px solid rgba(67,103,103,.14);
            border-radius:999px;
            color:#4e6665;
            background:rgba(255,253,247,.82);
            box-shadow:none;
            cursor:pointer;
            font-size:13px;
            font-weight:800;
            white-space:nowrap;
          }
          .mobile-nav-locales button.active{
            border-color:#496f70;
            color:#fff;
            background:#496f70;
          }
          .mobile-nav-locales button:focus-visible{
            outline:3px solid rgba(73,111,112,.28);
            outline-offset:2px;
          }
          @media(max-width:900px){
            html body>.four-language-toolbar{
              display:none!important;
              visibility:hidden!important;
              position:absolute!important;
              height:0!important;
              min-height:0!important;
              padding:0!important;
              border:0!important;
              overflow:hidden!important;
            }
            html body{padding-top:0!important}
            .portal-header{top:0!important}
            .portal-page~.pwa-install-fab{display:none!important}
          }
          @media(max-width:680px){
            .site~.pwa-install-fab{display:none!important}
            .site-footer{padding-bottom:calc(118px + env(safe-area-inset-bottom))!important}
            .plaza-page,.message-reader-page{padding-bottom:calc(112px + env(safe-area-inset-bottom))!important}
            .review-workspace.is-empty,
            .review-workspace:has(.review-queue .empty-state){display:block!important;min-height:0!important}
            .review-workspace.is-empty .review-queue,
            .review-workspace:has(.review-queue .empty-state) .review-queue{display:none!important}
            .review-workspace.is-empty .review-detail,
            .review-workspace:has(.review-queue .empty-state) .review-detail{
              min-height:0!important;
              display:grid!important;
              gap:14px!important;
              place-items:stretch!important;
              padding:22px 16px!important;
              text-align:center!important;
            }
            .review-workspace.is-empty .review-detail>p,
            .review-workspace:has(.review-queue .empty-state) .review-detail>p{margin:0!important}
            .review-workspace.is-empty .review-reason,
            .review-workspace:has(.review-queue .empty-state) .review-reason{text-align:left!important}
            .review-workspace.is-empty .review-detail>button,
            .review-workspace:has(.review-queue .empty-state) .review-detail>button{
              min-height:44px!important;
              border-radius:9px!important;
            }
          }
          '''
          patched = 0
          for path in matches:
              text = path.read_text(encoding="utf-8", errors="strict")
              if ".gsap-enhanced .hero-copy" not in text:
                  continue
              repaired = text.replace(r"\n/* " + marker, "\n/* " + marker)
              if marker not in repaired:
                  repaired += rule
              if layout_marker not in repaired:
                  repaired += layout_rule
              if repaired != text:
                  atomic_write_text(path, repaired)
              patched += 1
          if patched == 0:
              raise SystemExit("No matching Guardian Wall stylesheet was patched")
          print(f"Patched {patched} live stylesheet(s)")

          js_name = os.environ["JS_NAME"]
          js_matches = []
          for root in roots:
              if root.exists():
                  js_matches.extend(root.rglob(js_name))
          js_matches = [path for path in js_matches if path.is_file()]
          if not js_matches:
              raise SystemExit(f"Live Guardian Wall script not found: {js_name}")

          unsafe = 'function P(e,t){return e[t]||e[`zh-Hant`]||e.en||``}'
          safe = 'function P(e,t){return e?.[t]||e?.[`zh-Hant`]||e?.en||``}'

          script_marker = "hk-mobile-layout-nav-v1"
          script_addition = r'''
          ;(()=>{const m="hk-mobile-layout-nav-v1";if(window.__hkMobileLayoutNav===m)return;window.__hkMobileLayoutNav=m;
          const labels={"zh-Hant":"繁體中文","zh-Hans":"简体中文","en":"English","ja":"日本語"};
          const activate=(wrap,key)=>wrap.querySelectorAll("button").forEach((button)=>{const active=button.dataset.locale===key;button.classList.toggle("active",active);button.setAttribute("aria-pressed",String(active));});
          const install=()=>{const nav=document.querySelector(".mobile-nav");if(!nav||nav.querySelector(".mobile-nav-locales"))return;
          const wrap=document.createElement("div");wrap.className="mobile-nav-locales";wrap.setAttribute("role","group");wrap.setAttribute("aria-label","Language");
          const select=document.querySelector(".locale-picker select");const current=select?.value||document.documentElement.lang||"zh-Hans";
          Object.entries(labels).forEach(([key,label])=>{const button=document.createElement("button");button.type="button";button.dataset.locale=key;button.textContent=label;
          button.addEventListener("click",()=>{activate(wrap,key);const picker=document.querySelector(".locale-picker select");if(picker){picker.value=key;picker.dispatchEvent(new Event("change",{bubbles:true}));return;}
          const destination=new URL(window.location.href);if(key==="zh-Hant"||key==="zh-Hans"){destination.hostname=key==="zh-Hant"?"global-protection.jerryzuhow77.chatgpt.site":"cn.globalprotectionwall.com";destination.protocol="https:";destination.port="";destination.searchParams.set("lang",key);destination.searchParams.set("region",key==="zh-Hant"?"tw":"hk");}else{destination.searchParams.set("lang",key);if(!destination.searchParams.has("region"))destination.searchParams.set("region",window.location.hostname==="cn.globalprotectionwall.com"?"hk":"tw");}window.location.assign(destination.toString());});
          wrap.appendChild(button);});activate(wrap,current);nav.insertBefore(wrap,nav.querySelector(".mobile-nav-official"));};
          install();new MutationObserver(install).observe(document.documentElement,{childList:true,subtree:true});})();
          '''
          js_patched = 0
          for path in js_matches:
              try:
                  text = path.read_text(encoding="utf-8", errors="strict")
              except UnicodeDecodeError:
                  continue
              if safe not in text and unsafe not in text and script_marker not in text:
                  continue
              repaired = text.replace(unsafe, safe, 1)
              if script_marker not in repaired:
                  repaired += script_addition
              if repaired != text:
                  atomic_write_text(path, repaired)
              js_patched += 1
          if js_patched == 0:
              raise SystemExit("No matching Guardian Wall locale helper was patched")
          print(f"Patched {js_patched} live script(s)")
          PY

      - name: Purge patched assets from Cloudflare
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ZONE_ID != ''
        shell: bash
        env:
          CSS_NAME: ${{ steps.patch.outputs.css_name }}
          JS_NAME: ${{ steps.patch.outputs.js_name }}
        run: |
          set -Eeuo pipefail
          response="$(curl -fsS --max-time 20 \
            -X POST "https://api.cloudflare.com/client/v4/zones/$CLOUDFLARE_ZONE_ID/purge_cache" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H 'Content-Type: application/json' \
            --data "{\"files\":[\"https://cn.globalprotectionwall.com/\",\"https://cn.globalprotectionwall.com/assets/$CSS_NAME\",\"https://cn.globalprotectionwall.com/assets/$JS_NAME\"]}")"
          printf '%s' "$response" | python3 -c 'import json,sys; assert json.load(sys.stdin).get("success") is True'

      - name: Verify blank-page recovery
        shell: bash
        env:
          CSS_NAME: ${{ steps.patch.outputs.css_name }}
          JS_NAME: ${{ steps.patch.outputs.js_name }}
        run: |
          set -Eeuo pipefail
          css="$(curl -fsS --retry 5 --retry-delay 3 --max-time 25 \
            -A 'Mozilla/5.0 (Linux; Android 16; SM-F9360) AppleWebKit/537.36 Chrome/140.0 Mobile Safari/537.36' \
            "https://cn.globalprotectionwall.com/assets/$CSS_NAME")"
          grep -Fq 'hk-mobile-first-paint-v1' <<<"$css"
          grep -Fq 'hk-mobile-layout-guardrails-v1' <<<"$css"
          grep -Fq '.mobile-nav-locales' <<<"$css"
          if grep -Fq '\n/* hk-mobile-first-paint-v1' <<<"$css"; then
            echo '::error::Mobile CSS still contains an invalid literal newline.'
            exit 1
          fi
          page="$(curl -fsS --retry 5 --retry-delay 3 --max-time 25 \
            -A 'Mozilla/5.0 (Linux; Android 16; SM-F9360) AppleWebKit/537.36 Chrome/140.0 Mobile Safari/537.36' \
            https://cn.globalprotectionwall.com/)"
          grep -Fq '全球守護留言牆' <<<"$page"
          grep -Fq "/assets/$JS_NAME" <<<"$page"
          headers="$(curl -fsSI --retry 5 --retry-delay 3 --max-time 25 \
            "https://cn.globalprotectionwall.com/assets/$JS_NAME")"
          grep -Eiq '^cache-control:.*max-age=0.*must-revalidate' <<<"$headers"
          curl -fsS --retry 5 --retry-delay 3 --max-time 25 \
            -A 'Mozilla/5.0 (Linux; Android 16; SM-F9360) AppleWebKit/537.36 Chrome/140.0 Mobile Safari/537.36' \
            "https://cn.globalprotectionwall.com/assets/$JS_NAME" > /tmp/guardian-wall.js
          python3 - <<'PY'
          from pathlib import Path

          text = Path("/tmp/guardian-wall.js").read_text(encoding="utf-8", errors="strict")
          unsafe = 'function P(e,t){return e[t]||e[`zh-Hant`]||e.en||``}'
          safe = 'function P(e,t){return e?.[t]||e?.[`zh-Hant`]||e?.en||``}'
          assert safe in text, "Safe locale fallback is missing from the live script"
          assert unsafe not in text, "Unsafe locale fallback remains in the live script"
          assert 'hk-mobile-layout-nav-v1' in text, "Mobile layout navigation helper is missing"
          assert '.mobile-nav-locales' in text, "Mobile language controls are missing"
          PY
