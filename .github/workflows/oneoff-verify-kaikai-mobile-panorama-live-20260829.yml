name: Verify Kaikai mobile panorama prologue on production

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/oneoff-verify-kaikai-mobile-panorama-live-20260829.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: oneoff-verify-kaikai-mobile-panorama-live-20260829
  cancel-in-progress: false

jobs:
  verify-live:
    runs-on: ubuntu-latest
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Chromium verification tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/kaikai-panorama-live-browser
          cd /tmp/kaikai-panorama-live-browser
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.55.0
          npx playwright install --with-deps chromium >/dev/null

      - name: Verify production panorama behavior
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/kaikai-panorama-live-evidence
          cat > /tmp/kaikai-panorama-live-browser/verify.mjs <<'NODE'
          import { chromium } from 'playwright';
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import path from 'node:path';

          const root = 'https://jerryzuhow77.github.io/child-advocacy-site/hearing-records/prison-watch/kaikai-final-chapter/';
          const expectedVersion = '20260829-mobile-panorama-1';
          const outDir = '/tmp/kaikai-panorama-live-evidence';
          const cases = [
            ['zh-Hant-mobile', root, { width: 390, height: 844 }, true],
            ['zh-Hans-mobile', `${root}zh-Hans/`, { width: 390, height: 844 }, true],
            ['zh-Hant-desktop', root, { width: 1440, height: 1000 }, false]
          ];
          const browser = await chromium.launch({ headless: true });
          const report = [];

          for (const [name, baseUrl, viewport, mobile] of cases) {
            const context = await browser.newContext({
              viewport,
              isMobile: mobile,
              hasTouch: mobile,
              locale: name.includes('Hans') ? 'zh-CN' : 'zh-TW'
            });
            const page = await context.newPage();
            const pageErrors = [];
            const failedRequests = [];
            const keyResponses = [];
            page.on('pageerror', error => pageErrors.push(error.message));
            page.on('requestfailed', request => failedRequests.push({
              url: request.url(),
              error: request.failure()?.errorText || ''
            }));
            page.on('response', response => {
              if (/final-chapter\.css|kaikai-final-chapter-prologue\.(?:webm|mp4|jpg)/.test(response.url())) {
                keyResponses.push({ url: response.url(), status: response.status() });
              }
            });

            const response = await page.goto(`${baseUrl}?panorama-final=${Date.now()}-${name}`, {
              waitUntil: 'domcontentloaded',
              timeout: 60000
            });
            assert.equal(response?.status(), 200, `${name}: document HTTP ${response?.status()}`);
            const overlay = page.locator('[data-entry-prologue]');
            await overlay.waitFor({ state: 'visible', timeout: 15000 });
            await page.waitForFunction(() => {
              const video = document.querySelector('[data-prologue-video]');
              return Boolean(video?.error) || (video?.videoWidth > 0 && video?.videoHeight > 0 && video.currentTime > 0.08);
            }, null, { timeout: 30000 });

            const state = await page.evaluate(() => {
              const overlay = document.querySelector('[data-entry-prologue]');
              const video = document.querySelector('[data-prologue-video]');
              const skip = document.querySelector('[data-prologue-skip]');
              const audio = document.querySelector('#chapterBgm');
              const style = getComputedStyle(video);
              const backdrop = getComputedStyle(overlay, '::before');
              const rect = video.getBoundingClientRect();
              const ratio = video.videoWidth / video.videoHeight;
              const boxRatio = rect.width / rect.height;
              const paintedWidth = ratio >= boxRatio ? rect.width : rect.height * ratio;
              const paintedHeight = ratio >= boxRatio ? rect.width / ratio : rect.height;
              const center = document.elementFromPoint(innerWidth / 2, innerHeight / 2);
              return {
                cssHref: document.querySelector('link[href*="final-chapter.css"]')?.href || '',
                objectFit: style.objectFit,
                objectPosition: style.objectPosition,
                videoWidth: video.videoWidth,
                videoHeight: video.videoHeight,
                currentTime: video.currentTime,
                duration: video.duration,
                paused: video.paused,
                muted: video.muted,
                currentSrc: video.currentSrc,
                boxWidth: rect.width,
                boxHeight: rect.height,
                paintedWidth,
                paintedHeight,
                backdropContent: backdrop.content,
                backdropImage: backdrop.backgroundImage,
                backdropFilter: backdrop.filter,
                overlayOnTop: Boolean(center && overlay.contains(center)),
                bodyLocked: document.body.classList.contains('prologue-active'),
                skipVisible: Boolean(skip && skip.getBoundingClientRect().width > 0),
                overflowX: document.documentElement.scrollWidth - innerWidth,
                audioTrackCount: audio?.dataset.trackCount || '',
                audioPaused: audio?.paused ?? null,
                audioTime: audio?.currentTime ?? null
              };
            });

            assert.ok(state.cssHref.includes(expectedVersion), `${name}: stale CSS ${state.cssHref}`);
            if (mobile) {
              assert.equal(state.objectFit, 'contain', `${name}: mobile video is still cropped`);
              assert.equal(state.objectPosition, '50% 50%', `${name}: panorama is not centered`);
              assert.notEqual(state.backdropContent, 'none', `${name}: backdrop pseudo-element missing`);
              assert.ok(state.backdropImage.includes('kaikai-final-chapter-prologue-poster.jpg'), `${name}: backdrop poster missing`);
              assert.ok(state.backdropFilter.includes('blur'), `${name}: backdrop blur missing`);
              assert.ok(state.paintedWidth >= viewport.width - 1, `${name}: panorama does not span phone width`);
              assert.ok(state.paintedHeight < state.boxHeight - 1, `${name}: complete-frame letterbox space missing`);
            } else {
              assert.equal(state.objectFit, 'cover', `${name}: desktop cover presentation regressed`);
            }
            assert.ok(state.videoWidth > state.videoHeight, `${name}: source is not landscape`);
            assert.ok(state.currentTime > 0.08 && !state.paused, `${name}: muted autoplay did not advance`);
            assert.equal(state.muted, true, `${name}: prologue is not muted`);
            assert.equal(state.overlayOnTop && state.bodyLocked, true, `${name}: prologue no longer owns entry screen`);
            assert.equal(state.skipVisible, true, `${name}: skip/enter control missing`);
            assert.ok(state.overflowX <= 1, `${name}: horizontal overflow ${state.overflowX}px`);
            assert.equal(state.audioTrackCount, '2', `${name}: two-track music regressed`);
            assert.equal(state.audioPaused, true, `${name}: background music started before user action`);
            assert.ok(state.audioTime === 0 || state.audioTime < 0.05, `${name}: background music time advanced early`);
            assert.deepEqual(pageErrors, [], `${name}: page errors ${pageErrors.join(' | ')}`);

            const actionableFailures = failedRequests.filter(item => {
              const intentionalMediaAbort = item.error === 'net::ERR_ABORTED' && /\.(?:webm|m4a|mp4)(?:\?|$)/.test(item.url);
              return item.url.includes('/child-advocacy-site/') && !intentionalMediaAbort;
            });
            assert.deepEqual(actionableFailures, [], `${name}: actionable same-origin failures`);
            assert.ok(keyResponses.some(item => item.url.includes('final-chapter.css') && item.status >= 200 && item.status < 400), `${name}: CSS response missing`);
            assert.ok(keyResponses.some(item => item.url.includes('kaikai-final-chapter-prologue.') && item.status >= 200 && item.status < 400), `${name}: prologue response missing`);

            await page.screenshot({ path: path.join(outDir, `${name}.png`), fullPage: false });
            report.push({ name, viewport, ...state, keyResponses, failedRequests, actionableFailures, pageErrors });
            await context.close();
          }

          await browser.close();
          fs.writeFileSync(path.join(outDir, 'report.json'), JSON.stringify({
            verifiedAt: new Date().toISOString(),
            expectedVersion,
            cases: report
          }, null, 2));
          console.log('LIVE_PANORAMA_VERIFY_PASS');
          console.log(JSON.stringify(report.map(item => ({
            name: item.name,
            objectFit: item.objectFit,
            video: `${item.videoWidth}x${item.videoHeight}`,
            painted: `${item.paintedWidth}x${item.paintedHeight}`,
            viewport: `${item.viewport.width}x${item.viewport.height}`,
            currentTime: item.currentTime,
            overflowX: item.overflowX,
            audioTrackCount: item.audioTrackCount,
            actionableFailures: item.actionableFailures.length,
            pageErrors: item.pageErrors.length
          })), null, 2));
          NODE
          node /tmp/kaikai-panorama-live-browser/verify.mjs

      - name: Upload production browser evidence
        uses: actions/upload-artifact@v4
        with:
          name: kaikai-mobile-panorama-prologue-live-evidence-20260829
          path: /tmp/kaikai-panorama-live-evidence/*
          if-no-files-found: error
          retention-days: 7

      - name: Remove completed one-off verifier
        shell: bash
        run: |
          set -euo pipefail
          workflow='.github/workflows/oneoff-verify-kaikai-mobile-panorama-live-20260829.yml'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm "$workflow"
          git commit -m 'Remove completed mobile panorama verifier'
          pushed=0
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              pushed=1
              break
            fi
            sleep $((attempt * 3))
          done
          test "$pushed" -eq 1
