name: Publish Lin Hsin-tzu news section

on:
  push:
    branches:
      - feat/news-section-lin-xinci-20260903
    paths:
      - '.github/workflows/oneoff-news-section-lin-xinci-20260903.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: oneoff-news-section-lin-xinci-20260903
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/news-section-lin-xinci-20260903
          fetch-depth: 0

      - name: Generate section, localized articles, routes, and sitemap
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import json
          import subprocess
          import zlib
          from pathlib import Path

          root = Path('.')
          payload_parts = sorted((root / '.github/news-payload').glob('part-*.txt'))
          assert len(payload_parts) == 6, f'Expected 6 payload parts, found {len(payload_parts)}'
          encoded = ''.join(path.read_text(encoding='utf-8').strip() for path in payload_parts)
          payload = zlib.decompress(base64.b64decode(encoded)).decode('utf-8')
          files = json.loads(payload)

          for relative, content in files.items():
              path = root / relative
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(content, encoding='utf-8')

          old_flat_page = root / 'news/lin-xinci-nexttv-20260902.html'
          old_flat_page.unlink(missing_ok=True)

          loader_host = root / 'assets/home-history-anchor-stability-20260825.js'
          loader_marker = 'data-home-media-reports-loader'
          loader = "(() => {\n  'use strict';\n  if (document.querySelector('script[data-home-media-reports-loader]')) return;\n  const current = document.currentScript && document.currentScript.src\n    ? document.currentScript.src\n    : new URL('./assets/home-history-anchor-stability-20260825.js', document.baseURI).href;\n  const script = document.createElement('script');\n  script.src = new URL('home-media-reports-20260903.js?v=20260903-1', current).href;\n  script.defer = true;\n  script.dataset.homeMediaReportsLoader = 'true';\n  document.head.appendChild(script);\n})();"
          host_text = loader_host.read_text(encoding='utf-8')
          if loader_marker not in host_text:
              loader_host.write_text(host_text.rstrip() + '\n\n' + loader + '\n', encoding='utf-8')

          subprocess.run(['python3', '.github/scripts/sync-four-language-toolbar.py'], check=True)
          subprocess.run(['python3', 'scripts/sync_sitemap.py'], check=True)
          subprocess.run(['python3', '.github/scripts/verify-chapter-two-publication.py'], check=True)
          subprocess.run(['node', '--check', 'assets/home-media-reports-20260903.js'], check=True)
          subprocess.run(['node', '--check', 'assets/home-history-anchor-stability-20260825.js'], check=True)

          expected_pages = {
              'zh-Hant': root / 'news/lin-xinci-nexttv-20260902/index.html',
              'zh-Hans': root / 'news/lin-xinci-nexttv-20260902/zh-Hans/index.html',
              'en': root / 'en/news/lin-xinci-nexttv-20260902/index.html',
              'ja': root / 'ja/news/lin-xinci-nexttv-20260902/index.html',
          }
          source_url = 'https://www.nexttv.com.tw/NextTV/News/Home/Society/m/2026-09-02/2455025.html'
          for locale, path in expected_pages.items():
              text = path.read_text(encoding='utf-8')
              assert f'<html lang="{locale}">' in text, f'Locale declaration missing: {locale}'
              assert source_url in text, f'Source URL missing: {locale}'
              assert text.count('rel="canonical"') == 1, f'Canonical count invalid: {locale}'
              assert text.count('rel="alternate"') == 5, f'hreflang count invalid: {locale}'
              assert 'data-cpa-four-language-toolbar-style' in text
              assert 'data-cpa-four-language-toolbar-flag' in text
              assert 'data-cpa-four-language-toolbar-script' in text
              assert 'media-report-paper-clay-20260903.css' in text
              assert (
                  '無罪推定' in text
                  or 'Presumption of innocence' in text
                  or '无罪推定' in text
              ), f'Innocence notice missing: {locale}'

          routes = json.loads((root / 'data/four-language-routes.json').read_text(encoding='utf-8'))
          route = routes['routes']['news/lin-xinci-nexttv-20260902/']
          assert set(route) == {'zh-Hant', 'zh-Hans', 'en', 'ja'}, route
          assert 'home-media-reports-20260903.js' in loader_host.read_text(encoding='utf-8')
          assert not old_flat_page.exists()
          assert source_url in files['assets/home-media-reports-20260903.js']
          print('News section generation and validation passed.')
          PY
          git diff --check

      - name: Commit generated publication files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github/news-payload
          rm -f .github/workflows/oneoff-news-section-lin-xinci-20260903.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m 'feat: publish four-language media reports section'
          git push origin HEAD:feat/news-section-lin-xinci-20260903
