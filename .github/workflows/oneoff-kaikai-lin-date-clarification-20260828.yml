name: Clarify Kaikai visit and record dates

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oneoff-kaikai-lin-date-clarification-20260828.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Separate visit date, photo date and record date
        run: |
          python - <<'PY'
          from pathlib import Path

          trad_path = Path('hearing-records/prison-watch/kaikai-final-chapter/index.html')
          simp_path = Path('hearing-records/prison-watch/kaikai-final-chapter/zh-Hans/index.html')

          def apply(path, replacements):
              text = path.read_text(encoding='utf-8')
              for label, old, new in replacements:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f'{path} / {label}: expected 1 match, found {count}')
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')

          trad = [
              ('search keywords', 'data-search="2023 9月25 9月26 瘀傷 額頭 兒盟訪視 台北 文山 居托 訪視"', 'data-search="2023 9月22 9月25 9月26 瘀傷 額頭 兒盟訪視 台北 文山 居托 訪視"'),
              ('timeline date', '<time datetime="2023-09-25">2023.09.25—09.26<small>相隔一天的兩次訪視</small></time>', '<time datetime="2023-09-22">2023.09.22／09.25／09.26<small>實際訪視、照片與表載日期分離</small></time>'),
              ('timeline heading', '<h3>照片出現額頭瘀傷；次日居托訪視未記載異狀</h3>', '<h3>實際訪視日、兒盟照片與表載紀錄出現落差</h3>'),
              ('timeline explanation', '<p>監察院指出，兒盟社工9月25日訪視照片可見額頭明顯瘀傷；9月26日臺北市文山區居托中心完成新收托訪視，紀錄卻未載異狀。臺北市後續回應稱當日訪視頻率、地點符合中央規範且訪員未見異常。</p>', '<p>監察院以9月25日兒盟訪視照片與表載9月26日文山新收托訪視紀錄對照，指出前者可見額頭明顯瘀傷、後者未載異狀。檢方2026年另案起訴則指實際訪視日可能為9月22日、涉嫌記載為9月26日；此一指控尚待法院審理。臺北市先前回應稱訪視頻率、地點符合當時中央規範，訪員未見異常。</p>'),
              ('timeline source', '<a href="https://dosw.gov.taipei/News_Content.aspx?n=6CA16D3397A7A302&amp;s=25AE196A96CFC667&amp;sms=72544237BBE4C5F6" target="_blank" rel="noopener">臺北市回應 ↗</a></div></article>', '<a href="https://dosw.gov.taipei/News_Content.aspx?n=6CA16D3397A7A302&amp;s=25AE196A96CFC667&amp;sms=72544237BBE4C5F6" target="_blank" rel="noopener">臺北市回應 ↗</a><a href="https://udn.com/news/story/7321/9589852" target="_blank" rel="noopener">另案起訴｜日期爭點 ↗</a></div></article>'),
              ('conflict caution', '日期造假與是否看見傷勢是不同待證問題。', '日期登載爭議與是否看見傷勢是不同待證問題。'),
              ('cross issue', '9月25日照片可見額頭瘀傷；9月26日居托紀錄未載異常；10月23日記錄安靜無精神；11月20日前後出現嚴重掉牙。', '9月25日兒盟照片可見額頭瘀傷；文山紀錄表載9月26日未載異常，檢方另案起訴則指實際訪視可能在9月22日；10月23日記錄安靜無精神；11月20日前後出現嚴重掉牙。'),
              ('open question title', '9月25日與26日相隔一天，兩次訪視為何得出不同畫面？', '實際訪視日、9月25日照片與9月26日表載紀錄，為何彼此對不上？'),
              ('open question known', '監察院指出前一日照片有明顯額頭瘀傷，次日居托訪視紀錄未載異狀。', '監察院以9月25日照片與表載9月26日紀錄對照；檢方另案起訴則指實際訪視可能在9月22日。三個日期不能再被簡化為相隔一天的兩次現場觀察。'),
              ('open question missing', '原始照片時間資訊、完整訪視表、現場動線、詢問對象與逐項查核方式。', '原始照片時間資訊、實際到訪／離場紀錄、完整訪視表的製作時間、現場動線、詢問對象與逐項查核方式。'),
              ('role ledger', '文山於2023年9月26日辦理新收托訪視；監察院指出紀錄未呈現前一日照片可見的額頭瘀傷，且日誌欄位未實際核對。', '文山新收托訪視紀錄表載2023年9月26日；監察院以此與9月25日兒盟照片對照，檢方另案起訴則指實際訪視可能在9月22日。紀錄未呈現照片所見額頭瘀傷，日誌欄位也未實際核對。'),
              ('tree node', '9月25日兒盟照片有額頭瘀傷，9月26日文山訪視卻未記載；表載每日填日誌但未實查，案後才掌握非登記照顧處所。', '9月25日兒盟照片有額頭瘀傷，文山紀錄表載9月26日卻未記載；檢方另案起訴另指實際訪視可能在9月22日。表載每日填日誌但未實查，案後才掌握非登記照顧處所。'),
              ('relation visit', '依居托制度負責登記、訪視、輔導與監督；9月26日曾進行新收托訪視。', '依居托制度負責登記、訪視、輔導與監督；新收托訪視紀錄表載9月26日，檢方另案起訴則指實際訪視可能在9月22日。'),
              ('relation bruise', '未記載前一日照片可見的額頭瘀傷，未實際核對A童日誌，案後才掌握非登記照顧處所。', '未記載9月25日兒盟照片可見的額頭瘀傷，未實際核對A童日誌，案後才掌握非登記照顧處所。'),
              ('responsibility relationship', '負責劉姓保母的居托登記、管理、輔導、訪視與檢查；文山居托在9月26日完成新收托訪視，是外部直接看見孩子的制度節點。', '負責劉姓保母的居托登記、管理、輔導、訪視與檢查；新收托訪視紀錄表載9月26日，檢方另案起訴則指實際訪視可能在9月22日。無論日期爭點如何審理，該次訪視仍是外部直接看見孩子的重要制度節點。'),
              ('responsibility finding', '監察院認定訪視管理流於形式：未反映前一日照片中的額頭瘀傷、未實際核對A童日誌，且案後才發現非登記照顧處所與不適幼童環境。', '監察院認定訪視管理流於形式：未反映9月25日兒盟照片中的額頭瘀傷、未實際核對A童日誌，且案後才發現非登記照顧處所與不適幼童環境。'),
              ('responsibility response', '臺北市主張當日屬無預警訪視，頻率與地點符合當時中央規範，訪員當下未見異常；此回應與監察院糾正並列保留。', '臺北市先前主張該次訪視屬無預警訪視，頻率與地點符合當時中央規範，訪員未見異常；此回應與監察院糾正、檢方另案起訴的日期爭點並列保留。'),
          ]

          simp = [
              ('search keywords', 'data-search="2023 9月25 9月26 瘀伤 额头 儿盟访视 台北 文山 居托 访视"', 'data-search="2023 9月22 9月25 9月26 瘀伤 额头 儿盟访视 台北 文山 居托 访视"'),
              ('timeline date', '<time datetime="2023-09-25">2023.09.25—09.26<small>相隔一天的两次访视</small></time>', '<time datetime="2023-09-22">2023.09.22／09.25／09.26<small>实际访视、照片与表载日期分离</small></time>'),
              ('timeline heading', '<h3>照片出现额头瘀伤；次日居托访视未记载异状</h3>', '<h3>实际访视日、儿盟照片与表载纪录出现落差</h3>'),
              ('timeline explanation', '<p>监察院指出，儿盟社工9月25日访视照片可见额头明显瘀伤；9月26日台北市文山区居托中心完成新收托访视，纪录却未载异状。台北市后续回应称当日访视频率、地点符合中央规范且访员未见异常。</p>', '<p>监察院以9月25日儿盟访视照片与表载9月26日文山新收托访视纪录对照，指出前者可见额头明显瘀伤、后者未载异状。检方2026年另案起诉则指实际访视日可能为9月22日、涉嫌记载为9月26日；此一指控尚待法院审理。台北市先前回应称访视频率、地点符合当时中央规范，访员未见异常。</p>'),
              ('timeline source', '<a href="https://dosw.gov.taipei/News_Content.aspx?n=6CA16D3397A7A302&amp;s=25AE196A96CFC667&amp;sms=72544237BBE4C5F6" target="_blank" rel="noopener">台北市回应 ↗</a></div></article>', '<a href="https://dosw.gov.taipei/News_Content.aspx?n=6CA16D3397A7A302&amp;s=25AE196A96CFC667&amp;sms=72544237BBE4C5F6" target="_blank" rel="noopener">台北市回应 ↗</a><a href="https://udn.com/news/story/7321/9589852" target="_blank" rel="noopener">另案起诉｜日期争点 ↗</a></div></article>'),
              ('conflict caution', '日期造假与是否看见伤势是不同待证问题。', '日期登载争议与是否看见伤势是不同待证问题。'),
              ('cross issue', '9月25日照片可见额头瘀伤；9月26日居托纪录未载异常；10月23日记录安静无精神；11月20日前后出现严重掉牙。', '9月25日儿盟照片可见额头瘀伤；文山纪录表载9月26日未载异常，检方另案起诉则指实际访视可能在9月22日；10月23日记录安静无精神；11月20日前后出现严重掉牙。'),
              ('open question title', '9月25日与26日相隔一天，两次访视为何得出不同画面？', '实际访视日、9月25日照片与9月26日表载纪录，为何彼此对不上？'),
              ('open question known', '监察院指出前一日照片有明显额头瘀伤，次日居托访视纪录未载异状。', '监察院以9月25日照片与表载9月26日纪录对照；检方另案起诉则指实际访视可能在9月22日。三个日期不能再被简化为相隔一天的两次现场观察。'),
              ('open question missing', '原始照片时间资讯、完整访视表、现场动线、询问对象与逐项查核方式。', '原始照片时间资讯、实际到访／离场纪录、完整访视表的制作时间、现场动线、询问对象与逐项查核方式。'),
              ('role ledger', '文山于2023年9月26日办理新收托访视；监察院指出纪录未呈现前一日照片可见的额头瘀伤，且日志栏位未实际核对。', '文山新收托访视纪录表载2023年9月26日；监察院以此与9月25日儿盟照片对照，检方另案起诉则指实际访视可能在9月22日。纪录未呈现照片所见额头瘀伤，日志栏位也未实际核对。'),
              ('tree node', '9月25日儿盟照片有额头瘀伤，9月26日文山访视却未记载；表载每日填日志但未实查，案后才掌握非登记照顾场所。', '9月25日儿盟照片有额头瘀伤，文山纪录表载9月26日却未记载；检方另案起诉另指实际访视可能在9月22日。表载每日填日志但未实查，案后才掌握非登记照顾场所。'),
              ('relation visit', '依居托制度负责登记、访视、辅导与监督；9月26日曾进行新收托访视。', '依居托制度负责登记、访视、辅导与监督；新收托访视纪录表载9月26日，检方另案起诉则指实际访视可能在9月22日。'),
              ('relation bruise', '未记载前一日照片可见的额头瘀伤，未实际核对A童日志，案后才掌握非登记照顾处所。', '未记载9月25日儿盟照片可见的额头瘀伤，未实际核对A童日志，案后才掌握非登记照顾处所。'),
              ('responsibility relationship', '负责刘姓保母的居托登记、管理、辅导、访视与检查；文山居托在9月26日完成新收托访视，是外部直接看见孩子的制度节点。', '负责刘姓保母的居托登记、管理、辅导、访视与检查；新收托访视纪录表载9月26日，检方另案起诉则指实际访视可能在9月22日。无论日期争点如何审理，该次访视仍是外部直接看见孩子的重要制度节点。'),
              ('responsibility finding', '监察院认定访视管理流于形式：未反映前一日照片中的额头瘀伤、未实际核对A童日志，且案后才发现非登记照顾处所与不适幼童环境。', '监察院认定访视管理流于形式：未反映9月25日儿盟照片中的额头瘀伤、未实际核对A童日志，且案后才发现非登记照顾处所与不适幼童环境。'),
              ('responsibility response', '台北市主张当日属无预警访视，频率与地点符合当时中央规范，访员当下未见异常；此回应与监察院纠正并列保留。', '台北市先前主张该次访视属无预警访视，频率与地点符合当时中央规范，访员未见异常；此回应与监察院纠正、检方另案起诉的日期争点并列保留。'),
          ]

          apply(trad_path, trad)
          apply(simp_path, simp)
          PY

      - name: Validate date distinctions
        run: |
          git diff --check
          grep -q '2023.09.22／09.25／09.26' hearing-records/prison-watch/kaikai-final-chapter/index.html
          grep -q '实际访视、照片与表载日期分离' hearing-records/prison-watch/kaikai-final-chapter/zh-Hans/index.html
          ! grep -q '相隔一天的兩次訪視' hearing-records/prison-watch/kaikai-final-chapter/index.html
          ! grep -q '相隔一天的两次访视' hearing-records/prison-watch/kaikai-final-chapter/zh-Hans/index.html
          ! grep -q '日期造假與是否看見傷勢' hearing-records/prison-watch/kaikai-final-chapter/index.html
          ! grep -q '日期造假与是否看见伤势' hearing-records/prison-watch/kaikai-final-chapter/zh-Hans/index.html

      - name: Commit correction
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add hearing-records/prison-watch/kaikai-final-chapter/index.html hearing-records/prison-watch/kaikai-final-chapter/zh-Hans/index.html
          git commit -m 'Clarify Kaikai visit and record dates'
          git push origin HEAD:main