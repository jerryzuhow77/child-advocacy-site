name: One-off Jungein credential and SSH probe

on:
  push:
    branches:
      - ops/jungein-intro-probe-20260829
    paths:
      - .github/workflows/oneoff-jungein-credential-probe-20260829.yml

permissions:
  contents: read

concurrency:
  group: oneoff-jungein-credential-probe-20260829
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      DEFAULT_HOST: 150.109.69.104
      DEFAULT_USER: ubuntu
      DEFAULT_PORT: "22"
    steps:
      - name: Check credential presence and SSH access read-only
        shell: bash
        env:
          TENCENT_SSH_HOST: ${{ secrets.TENCENT_SSH_HOST }}
          TENCENT_SSH_USER: ${{ secrets.TENCENT_SSH_USER }}
          TENCENT_SSH_PORT: ${{ secrets.TENCENT_SSH_PORT }}
          TENCENT_SSH_PRIVATE_KEY: ${{ secrets.TENCENT_SSH_PRIVATE_KEY }}
          TENCENT_CVM_SSH_KEY: ${{ secrets.TENCENT_CVM_SSH_KEY }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          TENCENT_APP_PATH: ${{ secrets.TENCENT_APP_PATH }}
        run: |
          set -Eeuo pipefail
          umask 077
          mkdir -p evidence

          HOST="${TENCENT_SSH_HOST:-$DEFAULT_HOST}"
          USER_NAME="${TENCENT_SSH_USER:-$DEFAULT_USER}"
          PORT="${TENCENT_SSH_PORT:-$DEFAULT_PORT}"
          APP_PATH="${TENCENT_APP_PATH:-/opt/global-protection}"

          KEY=""
          KEY_SOURCE="none"
          if [[ -n "${TENCENT_SSH_PRIVATE_KEY:-}" ]]; then
            KEY="$TENCENT_SSH_PRIVATE_KEY"
            KEY_SOURCE="TENCENT_SSH_PRIVATE_KEY"
          elif [[ -n "${TENCENT_CVM_SSH_KEY:-}" ]]; then
            KEY="$TENCENT_CVM_SSH_KEY"
            KEY_SOURCE="TENCENT_CVM_SSH_KEY"
          elif [[ -n "${SSH_PRIVATE_KEY:-}" ]]; then
            KEY="$SSH_PRIVATE_KEY"
            KEY_SOURCE="SSH_PRIVATE_KEY"
          fi

          key_present=false
          [[ -n "$KEY" ]] && key_present=true
          ssh_connected=false

          if [[ -n "$KEY" ]]; then
            printf '%s\n' "$KEY" > evidence/id_key
            chmod 600 evidence/id_key
            if ssh -i evidence/id_key -p "$PORT" \
              -o BatchMode=yes -o ConnectTimeout=15 \
              -o StrictHostKeyChecking=accept-new \
              "${USER_NAME}@${HOST}" \
              "APP_PATH='$APP_PATH' bash -s" > evidence/ssh-readonly.txt 2> evidence/ssh-error.txt <<'REMOTE'
          set -Eeuo pipefail
          echo 'ssh_connected=true'
          printf 'hostname='; hostname
          printf 'identity='; id
          printf 'app_path='; printf '%s\n' "$APP_PATH"
          for path in "$APP_PATH" "$APP_PATH/dist/client"; do
            if [[ -e "$path" ]]; then
              stat -c 'path=%n type=%F owner=%U:%G mode=%a' "$path"
            else
              echo "missing=$path"
            fi
          done
          for unit in global-protection.service global-protection-hk.service; do
            if command -v systemctl >/dev/null 2>&1; then
              printf '%s=' "$unit"
              systemctl is-active "$unit" 2>/dev/null || true
            fi
          done
          REMOTE
            then
              ssh_connected=true
            fi
            rm -f evidence/id_key
          else
            echo 'ssh_skipped=no_private_key_secret_available' > evidence/ssh-error.txt
          fi

          cat > evidence/summary.json <<JSON
          {
            "key_present": ${key_present},
            "key_source": "${KEY_SOURCE}",
            "host_secret_present": $([[ -n "${TENCENT_SSH_HOST:-}" ]] && echo true || echo false),
            "user_secret_present": $([[ -n "${TENCENT_SSH_USER:-}" ]] && echo true || echo false),
            "port_secret_present": $([[ -n "${TENCENT_SSH_PORT:-}" ]] && echo true || echo false),
            "app_path_secret_present": $([[ -n "${TENCENT_APP_PATH:-}" ]] && echo true || echo false),
            "ssh_connected": ${ssh_connected},
            "production_mutated": false
          }
          JSON

          cat evidence/summary.json
          {
            echo '## Jungein deployment credential probe'
            echo '```json'
            cat evidence/summary.json
            echo '```'
            echo 'Read-only only; no production mutation was performed.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload sanitized evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oneoff-jungein-credential-probe-20260829
          path: evidence/
          if-no-files-found: error
          retention-days: 3
