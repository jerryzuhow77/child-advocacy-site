        if: failure()
        shell: bash
        run: |
          set +e
          test -s .github/homepage-optimization-diagnostic.txt || printf 'Workflow failed before the Python diagnostic was created.\n' > .github/homepage-optimization-diagnostic.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/homepage-optimization-diagnostic.txt
          git commit -m 'Record homepage optimization diagnostic'
          git fetch origin main
          git rebase origin/main
