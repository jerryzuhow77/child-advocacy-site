name: Verify Huang Ziche four-locale experience

on:
  push:
    branches: [main]
    paths:
      - "historical-cases/regions/mainland-china/huang-ziche/**"
      - "en/historical-cases/regions/mainland-china/huang-ziche/**"
      - "ja/historical-cases/regions/mainland-china/huang-ziche/**"
      - "assets/huang-ziche-shanghai-crafts-20260829.*"
      - ".github/workflows/verify-huang-ziche-four-locale-20260829.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-huang-ziche-four-locale
  cancel-in-progress: true

jobs:
  chrome:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Verify four locales at desktop and mobile widths
        env:
          BASE_URL: https://jerryzuhow77.github.io/child-advocacy-site
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');

          const pages = [
            { locale: 'zh-Hant', path: '/historical-cases/regions/mainland-china/huang-ziche/' },
            { locale: 'zh-Hans', path: '/historical-cases/regions/mainland-china/huang-ziche/zh-Hans/' },
            { locale: 'en', path: '/en/historical-cases/regions/mainland-china/huang-ziche/' },
            { locale: 'ja', path: '/ja/historical-cases/regions/mainland-china/huang-ziche/' },
          ];
          const viewports = [
            { name: 'desktop', width: 1440, height: 1000 },
            { name: 'mobile-390', width: 390, height: 844 },
            { name: 'mobile-320', width: 320, height: 800 },
          ];

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const failures = [];
            try {
              for (const viewport of viewports) {
                const context = await browser.newContext({ viewport });
                for (const item of pages) {
                  const page = await context.newPage();
                  const pageErrors = [];
                  const httpErrors = [];
                  page.on('pageerror', error => pageErrors.push(String(error)));
                  page.on('response', response => {
                    const url = response.url();
                    if (url.startsWith(process.env.BASE_URL) && response.status() >= 400) {
                      httpErrors.push(response.status() + ' ' + url);
                    }
                  });
                  const url = process.env.BASE_URL + item.path;
                  try {
                    const response = await page.goto(url, { waitUntil: 'load', timeout: 60000 });
                    if (!response || response.status() !== 200) throw new Error('HTTP ' + (response?.status() ?? 'no response'));
                    await page.waitForTimeout(2500);
                    const result = await page.evaluate(({ locale, canonical }) => {
                      const ids = new Set([...document.querySelectorAll('[id]')].map(node => node.id));
                      const missingAnchors = [...document.querySelectorAll('a[href^="#"]')]
                        .map(link => link.getAttribute('href').slice(1))
                        .filter(Boolean)
                        .filter(id => !ids.has(id));
                      const brokenImages = [...document.images]
                        .filter(image => image.complete && image.naturalWidth === 0)
                        .map(image => image.currentSrc || image.src);
                      const assetUrls = [
                        ...[...document.querySelectorAll('link[rel="stylesheet"]')].map(node => node.href),
                        ...[...document.scripts].map(node => node.src).filter(Boolean),
                      ];
                      return {
                        lang: document.documentElement.lang,
                        canonical: document.querySelector('link[rel="canonical"]')?.href,
                        hasCss: assetUrls.some(url => url.includes('huang-ziche-shanghai-crafts-20260829.css')),
                        hasJs: assetUrls.some(url => url.includes('huang-ziche-shanghai-crafts-20260829.js')),
                        hasRail: Boolean(document.querySelector('.hz-lantern-rail')),
                        hasBackTop: Boolean(document.querySelector('.hz-back-top')),
                        hasMobileSummary: Boolean(document.querySelector('.hz-mobile-summary')),
                        hasEnding: Boolean(document.querySelector('[data-hz-ending]')),
                        missingAnchors,
                        brokenImages,
                        overflow: Math.max(0, document.documentElement.scrollWidth - innerWidth),
                      };
                    }, { locale: item.locale, canonical: url });
                    const mismatches = [];
                    if (result.lang !== item.locale) mismatches.push('lang=' + result.lang);
                    if (result.canonical !== url) mismatches.push('canonical=' + result.canonical);
                    for (const key of ['hasCss','hasJs','hasRail','hasBackTop','hasMobileSummary','hasEnding']) {
                      if (!result[key]) mismatches.push(key + '=false');
                    }
                    if (result.missingAnchors.length) mismatches.push('missing anchors=' + result.missingAnchors.join(','));
                    if (result.brokenImages.length) mismatches.push('broken images=' + result.brokenImages.join(','));
                    if (result.overflow > 1) mismatches.push('overflow=' + result.overflow);
                    if (pageErrors.length) mismatches.push('page errors=' + pageErrors.join(' | '));
                    if (httpErrors.length) mismatches.push('HTTP errors=' + httpErrors.join(' | '));
                    if (mismatches.length) throw new Error(mismatches.join('; '));
                    console.log('PASS', viewport.name, item.locale, url);
                  } catch (error) {
                    failures.push(viewport.name + ' ' + item.locale + ': ' + error.message);
                  } finally {
                    await page.close();
                  }
                }
                const routePage = await context.newPage();
                try {
                  await routePage.goto(process.env.BASE_URL + '/historical-cases/regions/mainland-china/huang-ziche/zh-Hans/', { waitUntil: 'load', timeout: 60000 });
                  await routePage.waitForTimeout(500);
                  await Promise.all([
                    routePage.waitForNavigation({ waitUntil: 'load', timeout: 60000 }),
                    routePage.click('.tt-language a[title="zh-Hant"]'),
                  ]);
                  await routePage.waitForTimeout(1000);
                  const returnedLang = await routePage.evaluate(() => document.documentElement.lang);
                  if (returnedLang !== 'zh-Hant') failures.push(viewport.name + ' route zh-Hans→zh-Hant: lang=' + returnedLang);
                  else console.log('PASS', viewport.name, 'route zh-Hans→zh-Hant');
                } catch (error) {
                  failures.push(viewport.name + ' route zh-Hans→zh-Hant: ' + error.message);
                } finally {
                  await routePage.close();
                }
                await context.close();
              }
            } finally {
              await browser.close();
            }
            if (failures.length) {
              console.error(failures.join('\n'));
              process.exit(1);
            }
          })();
          NODE
