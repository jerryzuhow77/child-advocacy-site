name: Verify Huang Ziche four-locale experience

on:
  push:
    branches: [main]
    paths:
      - "historical-cases/regions/mainland-china/huang-ziche/**"
      - "en/historical-cases/regions/mainland-china/huang-ziche/**"
      - "ja/historical-cases/regions/mainland-china/huang-ziche/**"
      - "assets/huang-ziche-shanghai-crafts-20260829.*"
      - "assets/art/huang-ziche-haipai-shadow-stage-concept-20260830.webp"
      - "assets/art/huang-ziche-main-visual-20260830.jpg"
      - "assets/art/huang-ziche-main-visual-hant-20260830.webp"
      - "assets/art/huang-ziche-haipai-stage-backdrop-clean-20260830.webp"
      - ".github/workflows/verify-huang-ziche-four-locale-20260829.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-huang-ziche-four-locale
  cancel-in-progress: true

jobs:
  chrome:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Verify four locales at desktop and mobile widths
        env:
          BASE_URL: https://jerryzuhow77.github.io/child-advocacy-site
        run: |
          node <<'NODE'
          const crypto = require('node:crypto');
          const fs = require('node:fs');
          const { chromium } = require('playwright');

          const pages = [
            { locale: 'zh-Hant', path: '/historical-cases/regions/mainland-china/huang-ziche/', verdict: '判決與法律觀點', father: '生父刑責爭點', precedent: '案例與裁判規則對照', poster: 'huang-ziche-main-visual-hant-20260830.webp' },
            { locale: 'zh-Hans', path: '/historical-cases/regions/mainland-china/huang-ziche/zh-Hans/', verdict: '判决与法律观点', father: '生父刑责争点', precedent: '案例与裁判规则对照', poster: 'huang-ziche-main-visual-20260830.jpg' },
            { locale: 'en', path: '/en/historical-cases/regions/mainland-china/huang-ziche/', verdict: 'Judgment and legal analysis', father: 'potential criminal liability', precedent: 'Comparative cases', poster: 'huang-ziche-haipai-stage-backdrop-clean-20260830.webp' },
            { locale: 'ja', path: '/ja/historical-cases/regions/mainland-china/huang-ziche/', verdict: '判決と法的観点', father: '実父の刑事責任の争点', precedent: '類似事件と裁判規則の比較', poster: 'huang-ziche-haipai-stage-backdrop-clean-20260830.webp' },
          ];
          const viewports = [
            { name: 'desktop', width: 1440, height: 1000 },
            { name: 'mobile-390', width: 390, height: 844 },
            { name: 'mobile-320', width: 320, height: 800 },
          ];
          const sha256 = value => crypto.createHash('sha256').update(value).digest('hex');
          const expectedPageHashes = new Map(pages.map(item => [
            item.path,
            sha256(fs.readFileSync('.' + item.path + 'index.html')),
          ]));

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const failures = [];
            try {
              // GitHub Pages deploys in a separate workflow. Wait for this commit's
              // versioned HTML before testing the live URL, so the verifier never
              // mistakes the preceding deployment for a product regression.
              const readinessPage = await browser.newPage();
              let deploymentReady = false;
              try {
                for (let attempt = 0; attempt < 36 && !deploymentReady; attempt += 1) {
                  try {
                    const liveHashes = new Map();
                    for (const item of pages) {
                      const response = await readinessPage.goto(
                        process.env.BASE_URL + item.path + '?deployment=' + Date.now(),
                        { waitUntil: 'domcontentloaded', timeout: 30000 }
                      );
                      if (!response || response.status() !== 200) break;
                      liveHashes.set(item.path, sha256(await response.body()));
                    }
                    deploymentReady = pages.every(item =>
                      liveHashes.get(item.path) === expectedPageHashes.get(item.path)
                    );
                  } catch (_) {
                    deploymentReady = false;
                  }
                  if (!deploymentReady) await readinessPage.waitForTimeout(5000);
                }
              } finally {
                await readinessPage.close();
              }
              if (!deploymentReady) throw new Error('GitHub Pages did not publish the expected Huang Ziche page fingerprints in time');

              for (const viewport of viewports) {
                const context = await browser.newContext({ viewport });
                for (const item of pages) {
                  const page = await context.newPage();
                  const pageErrors = [];
                  const httpErrors = [];
                  page.on('pageerror', error => pageErrors.push(String(error)));
                  page.on('response', response => {
                    const url = response.url();
                    if (url.startsWith(process.env.BASE_URL) && response.status() >= 400) {
                      httpErrors.push(response.status() + ' ' + url);
                    }
                  });
                  const url = process.env.BASE_URL + item.path;
                  try {
                    const response = await page.goto(url, { waitUntil: 'load', timeout: 60000 });
                    if (!response || response.status() !== 200) throw new Error('HTTP ' + (response?.status() ?? 'no response'));
                    await page.waitForTimeout(2500);
                    const result = await page.evaluate(({ locale, canonical, verdict, father, precedent, poster }) => {
                      const ids = new Set([...document.querySelectorAll('[id]')].map(node => node.id));
                      const missingAnchors = [...document.querySelectorAll('a[href^="#"]')]
                        .map(link => link.getAttribute('href').slice(1))
                        .filter(Boolean)
                        .filter(id => !ids.has(id));
                      const brokenImages = [...document.images]
                        .filter(image => image.complete && image.naturalWidth === 0)
                        .map(image => image.currentSrc || image.src);
                      const assetUrls = [
                        ...[...document.querySelectorAll('link[rel="stylesheet"]')].map(node => node.href),
                        ...[...document.scripts].map(node => node.src).filter(Boolean),
                      ];
                      return {
                        lang: document.documentElement.lang,
                        canonical: document.querySelector('link[rel="canonical"]')?.href,
                        hasCss: assetUrls.some(url => url.includes('huang-ziche-shanghai-crafts-20260829.css?v=23')),
                        hasJs: assetUrls.some(url => url.includes('huang-ziche-shanghai-crafts-20260829.js?v=13')),
                        puppetScenes: document.querySelectorAll('.tt-stage > .tt-pose-layer--opening, .tt-transition[data-shadow-scene] .tt-pose-layer').length,
                        puppetCraftLayers: document.querySelectorAll('.hz-puppet-craft-layer').length,
                        puppetCraftReady: document.documentElement.classList.contains('hz-puppet-craft-ready'),
                        hasRail: Boolean(document.querySelector('.hz-lantern-rail')),
                        hasBackTop: Boolean(document.querySelector('.hz-back-top')),
                        hasMobileSummary: Boolean(document.querySelector('.hz-mobile-summary')),
                        traditionalColours: document.querySelectorAll('.hz-traditional-palette span').length,
                        shanghaiLandmarks: document.querySelectorAll('.hz-landmark-grid article').length,
                        inkLandmarkCards: [...document.querySelectorAll('.hz-landmark-grid article')].filter(card => getComputedStyle(card, '::before').backgroundImage.includes('huang-ziche-shanghai-landmarks-cards-20260830/')).length,
                        hasEnding: Boolean(document.querySelector('[data-hz-ending]')),
                        keyPosterMatchesLocale: document.querySelector('.hz-case-key-visual img')?.src.includes(poster),
                        endingPosterMatchesLocale: document.querySelector('.hz-ending-reveal img:not(.hz-ending-reveal-backdrop)')?.src.includes(poster),
                        hasEndingStageBackdrop: Boolean(document.querySelector('.hz-ending-stage-backdrop')),
                        endingPaperPanels: document.querySelectorAll('.hz-ending-paper-panel').length,
                        hasEndingCopyPoster: Boolean(document.querySelector('.hz-ending-copy-poster img')),
                        chineseEndingScriptMatches: locale === 'zh-Hant'
                          ? document.querySelector('.tt-ending-copy')?.textContent.includes('願你被世界記得')
                          : locale === 'zh-Hans'
                            ? document.querySelector('.tt-ending-copy')?.textContent.includes('愿你被世界记得')
                            : true,
                        hasVerdictTranslation: document.querySelector('#verdict')?.textContent.includes(verdict),
                        hasFatherTranslation: document.querySelector('#father')?.textContent.includes(father),
                        hasPrecedentTranslation: document.querySelector('#precedents')?.textContent.includes(precedent),
                        precedentCards: document.querySelectorAll('#precedents .hz-case-card').length,
                        precedentSources: document.querySelectorAll('#precedents a[href^="https://www.court.gov.cn/"]').length,
                        precedentAxes: document.querySelectorAll('#precedents .hz-law-axis article').length,
                        precedentQuote: Boolean(document.querySelector('#precedents .hz-classical-echo')),
                        matrixRows: document.querySelectorAll('#precedents .hz-compare-matrix tbody tr').length,
                        filterButtons: document.querySelectorAll('#precedents [data-hz-case-filter]').length,
                        sourceButtons: document.querySelectorAll('#precedents [data-hz-source-open]').length,
                        hasSourceDrawer: Boolean(document.querySelector('[data-hz-source-drawer]')),
                        intentSteps: document.querySelectorAll('#verdict .hz-intent-scale article').length,
                        evidenceGates: document.querySelectorAll('#father .hz-evidence-tree li').length,
                        interventionSteps: document.querySelectorAll('#protection .hz-intervention-path li').length,
                        railLinks: document.querySelectorAll('.hz-lantern-rail .hz-rail-link').length,
                        protectionNumber: document.querySelector('#protection .tt-chapter-mark b')?.textContent.trim(),
                        verdictCards: document.querySelectorAll('#verdict .tt-action-grid article').length,
                        fatherCards: document.querySelectorAll('#father .tt-action-grid article').length,
                        missingAnchors,
                        brokenImages,
                        overflow: Math.max(0, document.documentElement.scrollWidth - innerWidth),
                      };
                    }, { locale: item.locale, canonical: url, verdict: item.verdict, father: item.father, precedent: item.precedent, poster: item.poster });
                    await page.evaluate(() => document.querySelector('#precedents [data-hz-case-filter="homicide"]')?.click());
                    await page.waitForTimeout(120);
                    const filtered = await page.evaluate(() => ({
                      cards: document.querySelectorAll('#precedents .hz-case-card:not([hidden])').length,
                      rows: document.querySelectorAll('#precedents .hz-compare-matrix tbody tr:not([hidden])').length,
                    }));
                    await page.evaluate(() => document.querySelector('#precedents .hz-case-card:not([hidden]) [data-hz-source-open]')?.click());
                    await page.waitForTimeout(120);
                    const drawerOpen = await page.evaluate(() => Boolean(document.querySelector('[data-hz-source-drawer][open]')));
                    await page.keyboard.press('Escape');
                    const mismatches = [];
                    if (result.lang !== item.locale) mismatches.push('lang=' + result.lang);
                    if (result.canonical !== url) mismatches.push('canonical=' + result.canonical);
                    for (const key of ['hasCss','hasJs','hasRail','hasBackTop','hasMobileSummary','hasEnding','keyPosterMatchesLocale','endingPosterMatchesLocale','hasEndingStageBackdrop','hasEndingCopyPoster','chineseEndingScriptMatches']) {
                      if (!result[key]) mismatches.push(key + '=false');
                    }
                    if (result.endingPaperPanels !== 2) mismatches.push('endingPaperPanels=' + result.endingPaperPanels);
                    if (result.puppetScenes < 1) mismatches.push('puppetScenes=' + result.puppetScenes);
                    if (result.traditionalColours !== 10) mismatches.push('traditionalColours=' + result.traditionalColours);
                    if (result.shanghaiLandmarks !== 10) mismatches.push('shanghaiLandmarks=' + result.shanghaiLandmarks);
                    if (result.inkLandmarkCards !== 10) mismatches.push('inkLandmarkCards=' + result.inkLandmarkCards);
                    if (result.puppetCraftLayers !== result.puppetScenes) mismatches.push('puppetCraftLayers=' + result.puppetCraftLayers + '/' + result.puppetScenes);
                    if (!result.puppetCraftReady) mismatches.push('puppetCraftReady=false');
                    if (!result.hasVerdictTranslation) mismatches.push('verdict translation missing');
                    if (!result.hasFatherTranslation) mismatches.push('father translation missing');
                    if (!result.hasPrecedentTranslation) mismatches.push('precedent translation missing');
                    if (result.precedentCards !== 4) mismatches.push('precedentCards=' + result.precedentCards);
                    if (result.precedentSources !== 1) mismatches.push('precedentSources=' + result.precedentSources);
                    if (result.precedentAxes !== 4) mismatches.push('precedentAxes=' + result.precedentAxes);
                    if (!result.precedentQuote) mismatches.push('precedentQuote=false');
                    if (result.matrixRows !== 4) mismatches.push('matrixRows=' + result.matrixRows);
                    if (result.filterButtons !== 6) mismatches.push('filterButtons=' + result.filterButtons);
                    if (result.sourceButtons !== 4) mismatches.push('sourceButtons=' + result.sourceButtons);
                    if (!result.hasSourceDrawer) mismatches.push('sourceDrawer=false');
                    if (result.intentSteps !== 3) mismatches.push('intentSteps=' + result.intentSteps);
                    if (result.evidenceGates !== 6) mismatches.push('evidenceGates=' + result.evidenceGates);
                    if (result.interventionSteps !== 5) mismatches.push('interventionSteps=' + result.interventionSteps);
                    if (result.railLinks !== 10) mismatches.push('railLinks=' + result.railLinks);
                    if (filtered.cards !== 1 || filtered.rows !== 1) mismatches.push('filter interaction=' + JSON.stringify(filtered));
                    if (!drawerOpen) mismatches.push('source drawer did not open');
                    if (result.protectionNumber !== '09') mismatches.push('protectionNumber=' + result.protectionNumber);
                    if (result.verdictCards !== 4) mismatches.push('verdictCards=' + result.verdictCards);
                    if (result.fatherCards !== 5) mismatches.push('fatherCards=' + result.fatherCards);
                    if (result.missingAnchors.length) mismatches.push('missing anchors=' + result.missingAnchors.join(','));
                    if (result.brokenImages.length) mismatches.push('broken images=' + result.brokenImages.join(','));
                    if (result.overflow > 1) mismatches.push('overflow=' + result.overflow);
                    if (pageErrors.length) mismatches.push('page errors=' + pageErrors.join(' | '));
                    if (httpErrors.length) mismatches.push('HTTP errors=' + httpErrors.join(' | '));
                    if (mismatches.length) throw new Error(mismatches.join('; '));
                    console.log('PASS', viewport.name, item.locale, url);
                  } catch (error) {
                    failures.push(viewport.name + ' ' + item.locale + ': ' + error.message);
                  } finally {
                    await page.close();
                  }
                }
                const routePage = await context.newPage();
                try {
                  await routePage.goto(process.env.BASE_URL + '/historical-cases/regions/mainland-china/huang-ziche/zh-Hans/', { waitUntil: 'load', timeout: 60000 });
                  await routePage.waitForTimeout(500);
                  await Promise.all([
                    routePage.waitForNavigation({ waitUntil: 'load', timeout: 60000 }),
                    routePage.click('.tt-language a[title="zh-Hant"]'),
                  ]);
                  await routePage.waitForTimeout(1000);
                  const returnedState = await routePage.evaluate(() => ({
                    lang: document.documentElement.lang,
                    poster: document.querySelector('.hz-case-key-visual img')?.src || ''
                  }));
                  if (returnedState.lang !== 'zh-Hant') failures.push(viewport.name + ' route zh-Hans→zh-Hant: lang=' + returnedState.lang);
                  else if (!returnedState.poster.includes('huang-ziche-main-visual-hant-20260830.webp')) failures.push(viewport.name + ' route zh-Hans→zh-Hant: poster=' + returnedState.poster);
                  else {
                    await routePage.evaluate(() => { document.documentElement.lang = 'zh-Hans'; });
                    await routePage.waitForTimeout(120);
                    const convertedPoster = await routePage.evaluate(() => document.querySelector('.hz-case-key-visual img')?.src || '');
                    if (!convertedPoster.includes('huang-ziche-main-visual-20260830.jpg')) failures.push(viewport.name + ' dynamic zh-Hans poster=' + convertedPoster);
                    else console.log('PASS', viewport.name, 'route and dynamic poster pairing');
                  }
                } catch (error) {
                  failures.push(viewport.name + ' route zh-Hans→zh-Hant: ' + error.message);
                } finally {
                  await routePage.close();
                }
                await context.close();
              }
            } finally {
              await browser.close();
            }
            if (failures.length) {
              console.error(failures.join('\n'));
              process.exit(1);
            }
          })();
          NODE
