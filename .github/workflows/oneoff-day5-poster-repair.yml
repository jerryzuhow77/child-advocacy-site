name: Repair blank Day 5 selected posters

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/day5-poster-repair-exact-trigger.txt'

permissions:
  contents: write

concurrency:
  group: oneoff-day5-poster-repair-exact
  cancel-in-progress: false

jobs:
  repair:
    if: github.head_ref == 'trigger-day5-poster-repair-exact-20260822'
    runs-on: ubuntu-latest
    steps:
      - name: Check out current production branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Reconstruct and verify the two exact user-selected posters
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin main

          work='/tmp/day5-poster-repair-exact'
          rm -rf "$work"
          mkdir -p "$work"

          cat \
            .github/day5-exact-image-chunks/poster1-00.b64 \
            .github/day5-exact-image-chunks/poster1-01a.b64 \
            .github/day5-exact-image-chunks/poster1-01b.b64 \
            .github/day5-exact-image-chunks/poster1-01c.b64 \
            .github/day5-exact-image-chunks/poster1-02.b64 \
            .github/day5-exact-image-chunks/poster1-03.b64 \
            | tr -d '\r\n ' | base64 --decode > "$work/forensic.webp"

          cat \
            .github/day5-exact-image-chunks/poster2-00.b64 \
            .github/day5-exact-image-chunks/poster2-01ab.b64 \
            .github/day5-exact-image-chunks/poster2-01c.b64 \
            .github/day5-exact-image-chunks/poster2-02ab.b64 \
            .github/day5-exact-image-chunks/poster2-02c.b64 \
            .github/day5-exact-image-chunks/poster2-03ab.b64 \
            .github/day5-exact-image-chunks/poster2-03c.b64 \
            | tr -d '\r\n ' | base64 --decode > "$work/medical.webp"

          printf '%s  %s\n' '454848c56839996a8364e93073c738d5cb7b46d3908ad28a7b158b0f932f15ec' "$work/forensic.webp" | sha256sum --check --strict
          printf '%s  %s\n' '34580a2690b33550f1aa1e61a0fa68fa768ff1ad5af9e23f7dec1f61d318b082' "$work/medical.webp" | sha256sum --check --strict

          python -m pip install --disable-pip-version-check --quiet pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageStat

          expected = {
              Path('/tmp/day5-poster-repair-exact/forensic.webp'): (400, 600),
              Path('/tmp/day5-poster-repair-exact/medical.webp'): (400, 600),
          }
          for path, size in expected.items():
              with Image.open(path) as image:
                  image.verify()
              with Image.open(path) as image:
                  image.load()
                  if image.format != 'WEBP' or image.size != size:
                      raise SystemExit(f'Invalid poster {path}: {image.format}, {image.size}')
                  rgb = image.convert('RGB')
                  if rgb.getbbox() is None:
                      raise SystemExit(f'Blank poster: {path}')
                  variance = sum(ImageStat.Stat(rgb.resize((80, 120))).var)
                  if variance < 100:
                      raise SystemExit(f'Poster lacks visual detail: {path}; variance={variance}')
                  print(f'Validated {path.name}: {path.stat().st_size} bytes, {size[0]}x{size[1]}, variance={variance:.2f}')
          PY

          install -m 0644 "$work/forensic.webp" assets/art/prison-watch-day5-forensic-zh-hant-20260822.webp
          install -m 0644 "$work/medical.webp" assets/art/prison-watch-day5-medical-zh-hant-20260822.webp

      - name: Refresh cache keys and preserve the strengthened 42-plus note
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          version = '20260822-poster-repair-exact-1'
          pages = [
              Path('hearing-records/prison-watch/kaikai-day5-20250429/index.html'),
              Path('en/hearing-records/prison-watch/kaikai-day5-20250429/index.html'),
              Path('ja/hearing-records/prison-watch/kaikai-day5-20250429/index.html'),
              Path('source/hearing-records/prison-watch/kaikai-day5-20250429/index.html'),
              Path('source/en/hearing-records/prison-watch/kaikai-day5-20250429/index.html'),
              Path('source/ja/hearing-records/prison-watch/kaikai-day5-20250429/index.html'),
          ]
          assets = [
              'prison-watch-day5-forensic-zh-hant-20260822.webp',
              'prison-watch-day5-forensic-zh-hans-20260822.webp',
              'prison-watch-day5-medical-zh-hant-20260822.webp',
              'prison-watch-day5-medical-zh-hans-20260822.webp',
          ]
          notes = {
              'zh': (
                  '不是只有42處｜42處是可確認的最低數量',
                  '原始紀錄明載，簡報只挑選部分照片，並未呈現所有傷勢照片；「全身至少42處確定傷勢」是依現有資料仍能辨識、確認的下限。部分傷勢癒合後，死亡時外觀已看不到；頭皮等部位另被描述為傷勢「非常多，族繁不及備載」。因此，不應把42處理解成孩子曾受傷害的完整總數。正式表述應是「至少42處確定傷勢」，而不是只有42處。',
                  '資料依原始紀錄 P.5–6｜查看完整原文',
              ),
              'en': (
                  'Not only 42 injuries | 42 is the confirmed minimum',
                  'The source record states that only some photographs were selected and not every injury photograph was shown. “At least 42 confirmed injuries” is the minimum that could still be identified and confirmed. Some injuries had healed and were no longer visible at death, while injuries including those to the scalp were described as too numerous to list fully. The number 42 must not be read as the complete total of harm the child experienced.',
                  'Based on source record pp. 5–6 | Read the complete passage',
              ),
              'ja': (
                  '42か所だけではない｜42か所は確認できた最低数',
                  '原記録には、説明用資料では一部の写真だけを選び、すべての外傷写真を示していないと明記されています。「全身に少なくとも42か所の確定外傷」は、現存資料から確認できた下限です。治癒後、死亡時には外見から確認できなくなった外傷もあり、頭皮などの外傷は非常に多く、すべてを列挙できないとも説明されています。42か所を傷害の完全な総数と解釈してはいけません。',
                  '原記録5～6頁に基づく｜全文を確認',
              ),
          }

          for page in pages:
              text = page.read_text(encoding='utf-8')
              text = re.sub(r'day5\.js\?v=[^"\']+', f'day5.js?v={version}', text)
              for asset in assets:
                  text = re.sub(re.escape(asset) + r'(?:\?v=[^"\']+)?', f'{asset}?v={version}', text)

              key = 'en' if '/en/' in page.as_posix() else 'ja' if '/ja/' in page.as_posix() else 'zh'
              title, body, source = notes[key]
              note = (
                  '<aside id="day5InjuryCountNote" class="day5-injury-count-note" '
                  f'aria-label="{title}"><strong>{title}</strong><p>{body}</p>'
                  f'<a href="#record-08">{source}</a></aside>'
              )
              pattern = re.compile(r'<aside id="day5InjuryCountNote"\b.*?</aside>', re.S)
              if pattern.search(text):
                  text = pattern.sub(note, text, count=1)
              else:
                  marker = '<article class="day5-compare-card is-agree"><header><span>04</span>'
                  start = text.find(marker)
                  if start < 0:
                      raise SystemExit(f'Comparison card 04 not found in {page}')
                  end = text.find('</article>', start)
                  if end < 0:
                      raise SystemExit(f'Comparison card 04 not closed in {page}')
                  end += len('</article>')
                  text = text[:end] + note + text[end:]

              if key == 'zh':
                  text = text.replace(
                      '<strong>至少42處</strong><small>部分癒合後已看不到</small>',
                      '<strong>至少42處</strong><small>42處是可確認下限，不是完整總數</small>',
                  )
              page.write_text(text, encoding='utf-8')

          for script in [
              Path('hearing-records/prison-watch/kaikai-day5-20250429/day5.js'),
              Path('source/hearing-records/prison-watch/kaikai-day5-20250429/day5.js'),
          ]:
              text = script.read_text(encoding='utf-8')
              text = re.sub(r"const posterVersion = '[^']+';", f"const posterVersion = '{version}';", text, count=1)
              script.write_text(text, encoding='utf-8')

          sw = Path('sw.js')
          text = sw.read_text(encoding='utf-8')
          text = re.sub(r"const VERSION = '[^']+';", "const VERSION = '2026-08-22-day5-poster-repair-exact-v1';", text, count=1)
          sw.write_text(text, encoding='utf-8')
          PY

      - name: Validate the repaired production output
        shell: bash
        run: |
          set -euo pipefail
          node --check hearing-records/prison-watch/kaikai-day5-20250429/day5.js
          node --check source/hearing-records/prison-watch/kaikai-day5-20250429/day5.js

          printf '%s  %s\n' '454848c56839996a8364e93073c738d5cb7b46d3908ad28a7b158b0f932f15ec' assets/art/prison-watch-day5-forensic-zh-hant-20260822.webp | sha256sum --check --strict
          printf '%s  %s\n' '34580a2690b33550f1aa1e61a0fa68fa768ff1ad5af9e23f7dec1f61d318b082' assets/art/prison-watch-day5-medical-zh-hant-20260822.webp | sha256sum --check --strict

          python - <<'PY'
          from pathlib import Path

          version = '20260822-poster-repair-exact-1'
          pages = [
              Path('hearing-records/prison-watch/kaikai-day5-20250429/index.html'),
              Path('en/hearing-records/prison-watch/kaikai-day5-20250429/index.html'),
              Path('ja/hearing-records/prison-watch/kaikai-day5-20250429/index.html'),
              Path('source/hearing-records/prison-watch/kaikai-day5-20250429/index.html'),
              Path('source/en/hearing-records/prison-watch/kaikai-day5-20250429/index.html'),
              Path('source/ja/hearing-records/prison-watch/kaikai-day5-20250429/index.html'),
          ]
          for page in pages:
              text = page.read_text(encoding='utf-8')
              if text.count('id="day5InjuryCountNote"') != 1:
                  raise SystemExit(f'42-plus note missing or duplicated in {page}')
              if f'day5.js?v={version}' not in text:
                  raise SystemExit(f'Fresh Day 5 script key missing in {page}')
              for name in [
                  'prison-watch-day5-forensic-zh-hant-20260822.webp',
                  'prison-watch-day5-medical-zh-hant-20260822.webp',
              ]:
                  if f'{name}?v={version}' not in text:
                      raise SystemExit(f'Fresh poster key missing in {page}: {name}')
          zh = pages[0].read_text(encoding='utf-8')
          for phrase in ['不是只有42處', '42處是可確認的最低數量', '並未呈現所有傷勢照片', '族繁不及備載']:
              if phrase not in zh:
                  raise SystemExit(f'Missing strengthened note phrase: {phrase}')
          PY
          grep -Fq "const VERSION = '2026-08-22-day5-poster-repair-exact-v1';" sw.js
          git diff --check

      - name: Commit verified repair and remove staging files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github/day5-exact-image-chunks
          rm -rf .github/day5-poster-repair
          rm -rf .github/day5-selected-medical
          rm -f .github/day5-poster-repair-exact-trigger.txt
          rm -f .github/workflows/oneoff-day5-poster-repair.yml
          rm -f .github/workflows/oneoff-day5-user-selected-art.yml

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && { echo 'No repair changes produced.'; exit 1; }
          git commit -m 'Repair Day 5 selected posters and strengthen 42-plus note'
          git pull --rebase origin main
          git push origin main
