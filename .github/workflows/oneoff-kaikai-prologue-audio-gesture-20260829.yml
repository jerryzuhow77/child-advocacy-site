name: Publish prologue-to-background-audio interaction

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/oneoff-kaikai-prologue-audio-gesture-20260829.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: oneoff-kaikai-prologue-audio-gesture-20260829
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebase onto latest main
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin main

      - name: Connect the prologue entry gesture to the background playlist
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_PATCH'
          from pathlib import Path
          import re

          base = Path('hearing-records/prison-watch/kaikai-final-chapter')
          js_path = base / 'final-chapter.js'
          js = js_path.read_text(encoding='utf-8')

          old_handler = "  prologueSkip?.addEventListener('click', () => closePrologue({ focusMain: true }));"
          new_handler = """  prologueSkip?.addEventListener('click', () => {
    // The click is a genuine user gesture, so it may safely unlock audible media.
    // Keep natural prologue completion silent; only this explicit entry action starts the playlist.
    playChapterAudioFromGesture();
    closePrologue({ focusMain: true });
  });"""
          if old_handler in js:
              js = js.replace(old_handler, new_handler, 1)
          elif new_handler not in js:
              raise SystemExit('prologue skip handler marker not found')
          js_path.write_text(js, encoding='utf-8')

          pages = [
              {
                  'path': base / 'index.html',
                  'old_description': '序幕會在進站時立即播放；播放完畢後自動揭開正文。象徵性公益影像，非案件現場或證據影像。',
                  'new_description': '序幕會在進站時立即靜音播放；播放完畢後自動揭開正文。按「略過／進入」會啟動背景配樂。象徵性公益影像，非案件現場或證據影像。',
                  'old_button': '<button class="entry-prologue__skip" type="button" data-prologue-skip>略過序幕<span aria-hidden="true">↓</span></button>',
                  'new_button': '<button class="entry-prologue__skip" type="button" data-prologue-skip aria-label="略過序幕、進入正文並播放背景配樂" title="進入正文並播放背景配樂">略過／進入<span aria-hidden="true">↓</span></button>',
              },
              {
                  'path': base / 'zh-Hans/index.html',
                  'old_description': '序幕会在进站时立即播放；播放完毕后自动揭开正文。象征性公益影像，非案件现场或证据影像。',
                  'new_description': '序幕会在进站时立即静音播放；播放完毕后自动揭开正文。按“略过／进入”会启动背景配乐。象征性公益影像，非案件现场或证据影像。',
                  'old_button': '<button class="entry-prologue__skip" type="button" data-prologue-skip>略过序幕<span aria-hidden="true">↓</span></button>',
                  'new_button': '<button class="entry-prologue__skip" type="button" data-prologue-skip aria-label="略过序幕、进入正文并播放背景配乐" title="进入正文并播放背景配乐">略过／进入<span aria-hidden="true">↓</span></button>',
              },
          ]

          for page in pages:
              path = page['path']
              text = path.read_text(encoding='utf-8')
              if page['old_description'] in text:
                  text = text.replace(page['old_description'], page['new_description'], 1)
              elif page['new_description'] not in text:
                  raise SystemExit(f'prologue description marker not found in {path}')

              if page['old_button'] in text:
                  text = text.replace(page['old_button'], page['new_button'], 1)
              elif page['new_button'] not in text:
                  raise SystemExit(f'prologue entry button marker not found in {path}')

              text, count = re.subn(
                  r'(final-chapter\.js\?v=)20260829-34',
                  r'\g<1>20260829-35',
                  text,
                  count=1,
              )
              if count != 1 and 'final-chapter.js?v=20260829-35' not in text:
                  raise SystemExit(f'final-chapter.js cache marker not found in {path}')
              path.write_text(text, encoding='utf-8')
          PY_PATCH

      - name: Validate source contract
        shell: bash
        run: |
          set -euo pipefail
          base='hearing-records/prison-watch/kaikai-final-chapter'
          node --check "$base/final-chapter.js"
          grep -q 'playChapterAudioFromGesture();' "$base/final-chapter.js"
          grep -q 'Keep natural prologue completion silent' "$base/final-chapter.js"
          test "$(grep -c "prologueVideo?.addEventListener('ended', () => closePrologue())" "$base/final-chapter.js")" -eq 1
          for page in "$base/index.html" "$base/zh-Hans/index.html"; do
            grep -q 'data-entry-prologue' "$page"
            grep -q 'autoplay muted playsinline' "$page"
            grep -q 'data-track-count="2"' "$page"
            grep -q 'final-chapter.js?v=20260829-35' "$page"
            grep -q 'data-prologue-skip aria-label=' "$page"
          done
          grep -q '按「略過／進入」會啟動背景配樂' "$base/index.html"
          grep -q '按“略过／进入”会启动背景配乐' "$base/zh-Hans/index.html"

      - name: Browser-check silent natural completion and gesture-started audio
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/prologue-audio-browser
          cd /tmp/prologue-audio-browser
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.55.0
          npx playwright install --with-deps chromium >/dev/null

          cd "$GITHUB_WORKSPACE"
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/prologue-audio-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && break
            sleep 1
          done

          mkdir -p /tmp/prologue-audio-evidence
          node <<'NODE'
          const { chromium } = require('/tmp/prologue-audio-browser/node_modules/playwright');
          const assert = require('node:assert/strict');

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const root = 'http://127.0.0.1:4173/hearing-records/prison-watch/kaikai-final-chapter/';

            // Natural completion must stay silent because no user gesture occurred.
            {
              const page = await browser.newPage({ viewport: { width: 1440, height: 900 } });
              const errors = [];
              page.on('pageerror', error => errors.push(error.message));
              await page.goto(root, { waitUntil: 'domcontentloaded' });
              await page.locator('[data-entry-prologue]').waitFor({ state: 'visible' });
              assert.equal(await page.locator('#chapterBgm').evaluate(audio => audio.paused), true);
              await page.waitForFunction(() => document.querySelector('[data-entry-prologue]').hidden === true, null, { timeout: 20000 });
              const natural = await page.evaluate(() => ({
                audioPaused: document.querySelector('#chapterBgm').paused,
                audioTime: document.querySelector('#chapterBgm').currentTime,
                audioLabel: document.querySelector('[data-audio-label]').textContent.trim(),
                trackCount: document.querySelector('#chapterBgm').dataset.trackCount
              }));
              console.log('natural completion', JSON.stringify(natural));
              assert.equal(natural.audioPaused, true, 'natural completion unexpectedly started audible media');
              assert.ok(natural.audioTime <= 0.05, 'natural completion advanced background music');
              assert.equal(natural.audioLabel, '播放配樂');
              assert.equal(natural.trackCount, '2');
              assert.deepEqual(errors, []);
              await page.close();
            }

            const gestureCases = [
              ['zh-Hant-desktop', root, { width: 1440, height: 900 }, '暫停配樂'],
              ['zh-Hans-mobile', `${root}zh-Hans/`, { width: 390, height: 844 }, '暂停配乐']
            ];

            for (const [name, url, viewport, playingLabel] of gestureCases) {
              const page = await browser.newPage({ viewport });
              const errors = [];
              page.on('pageerror', error => errors.push(error.message));
              await page.goto(url, { waitUntil: 'domcontentloaded' });
              const overlay = page.locator('[data-entry-prologue]');
              await overlay.waitFor({ state: 'visible' });
              await page.waitForFunction(() => document.querySelector('[data-prologue-video]').currentTime > 0.08, null, { timeout: 20000 });

              const button = page.locator('[data-prologue-skip]');
              assert.equal(await button.isVisible(), true, `${name}: entry button is hidden`);
              await button.click();
              await page.waitForFunction(() => document.querySelector('[data-entry-prologue]').hidden === true);
              await page.waitForFunction(() => {
                const audio = document.querySelector('#chapterBgm');
                return !audio.paused && audio.currentTime > 0.05;
              }, null, { timeout: 15000 });

              const playing = await page.evaluate(() => ({
                paused: document.querySelector('#chapterBgm').paused,
                currentTime: document.querySelector('#chapterBgm').currentTime,
                label: document.querySelector('[data-audio-label]').textContent.trim(),
                trackCount: document.querySelector('#chapterBgm').dataset.trackCount,
                overlayHidden: document.querySelector('[data-entry-prologue]').hidden,
                bodyLocked: document.body.classList.contains('prologue-active')
              }));
              console.log(name, 'gesture start', JSON.stringify(playing));
              assert.equal(playing.paused, false, `${name}: gesture did not start background music`);
              assert.ok(playing.currentTime > 0.05, `${name}: background music did not advance`);
              assert.equal(playing.label, playingLabel, `${name}: player label did not switch to pause`);
              assert.equal(playing.trackCount, '2', `${name}: dual playlist regressed`);
              assert.equal(playing.overlayHidden, true, `${name}: prologue did not close`);
              assert.equal(playing.bodyLocked, false, `${name}: article remained locked`);

              await page.screenshot({ path: `/tmp/prologue-audio-evidence/${name}-after-entry.png`, fullPage: false });

              await page.locator('.audio-toggle').click();
              await page.waitForFunction(() => document.querySelector('#chapterBgm').paused === true);
              await page.locator('.audio-toggle').click();
              await page.waitForFunction(() => document.querySelector('#chapterBgm').paused === false);
              assert.deepEqual(errors, [], `${name}: ${errors.join(' | ')}`);
              await page.close();
            }

            await browser.close();
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Upload browser evidence
        uses: actions/upload-artifact@v4
        with:
          name: kaikai-prologue-audio-gesture-evidence-20260829
          path: /tmp/prologue-audio-evidence/*.png
          if-no-files-found: error
          retention-days: 7

      - name: Commit publication and remove one-off workflow
        shell: bash
        run: |
          set -euo pipefail
          workflow='.github/workflows/oneoff-kaikai-prologue-audio-gesture-20260829.yml'
          git rm "$workflow"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Start Chapter 2 music from the entry gesture'
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 3))
          done
          exit 1
