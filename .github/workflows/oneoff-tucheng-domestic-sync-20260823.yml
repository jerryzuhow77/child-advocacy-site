name: Sync Tucheng domestic violence case across official site
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oneoff-tucheng-domestic-sync-20260823.yml'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Synchronize toolbar, latest reports, case directory and hearing records
        run: |
          python - <<'PY'
          import base64, zlib
          source = zlib.decompress(base64.b64decode('')).decode('utf-8')
          exec(compile(source, 'tucheng-site-sync.py', 'exec'))
          PY
      - name: Validate updated JSON and HTML links
        run: |
          python -m json.tool data/hearing-records.json >/dev/null
          python -m json.tool data/latest-bulletins.json >/dev/null
          grep -q 'tucheng-domestic-violence-double-homicide' index.html
          grep -q 'tucheng-domestic-violence-double-homicide' cases/index.html
          grep -q 'tucheng-domestic-violence-double-homicide-20260821' hearing-records/index.html
      - name: Commit and publish synchronized information
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html cases/index.html hearing-records/index.html data/hearing-records.json data/latest-bulletins.json assets/site.js sitemap.xml
          git diff --cached --quiet && exit 0
          git commit -m 'Sync Tucheng domestic violence case across official site'
          git pull --rebase origin main
          git push origin HEAD:main
