name: Export bilingual Kaikai visual download package

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/qa-export-kaikai-six-visuals-20260829.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install image and browser dependencies
        run: |
          python3 -m pip install --disable-pip-version-check pillow
          npm install --no-save playwright-core@1.55.0

      - name: Copy existing bilingual artwork
        shell: bash
        run: |
          set -euo pipefail
          out='visual-exports'
          mkdir -p "$out"

          files=(
            'assets/art/kaikai-chapter2-hero-zh-Hant-20260828-v3.jpg'
            'assets/art/kaikai-chapter2-hero-zh-Hans-20260828-v3.jpg'
            'assets/art/kaikai-115days-explainer-zh-Hant-20260828.png'
            'assets/art/kaikai-115days-explainer-zh-Hans-20260828.png'
            'assets/art/kaikai-115days-explainer-zh-Hant-20260828.svg'
            'assets/art/kaikai-115days-explainer-zh-Hans-20260828.svg'
            'assets/art/kaikai-115days-explainer-zh-Hant-20260828.webp'
            'assets/art/kaikai-115days-explainer-zh-Hans-20260828.webp'
          )
          for source in "${files[@]}"; do
            test -s "$source"
          done

          cp assets/art/kaikai-chapter2-hero-zh-Hant-20260828-v3.jpg "$out/kaikai-main-visual-zh-Hant.jpg"
          cp assets/art/kaikai-chapter2-hero-zh-Hans-20260828-v3.jpg "$out/kaikai-main-visual-zh-Hans.jpg"
          cp assets/art/kaikai-115days-explainer-zh-Hant-20260828.png "$out/kaikai-115days-poster-zh-Hant.png"
          cp assets/art/kaikai-115days-explainer-zh-Hans-20260828.png "$out/kaikai-115days-poster-zh-Hans.png"
          cp assets/art/kaikai-115days-explainer-zh-Hant-20260828.svg "$out/kaikai-115days-poster-zh-Hant.svg"
          cp assets/art/kaikai-115days-explainer-zh-Hans-20260828.svg "$out/kaikai-115days-poster-zh-Hans.svg"
          cp assets/art/kaikai-115days-explainer-zh-Hant-20260828.webp "$out/kaikai-115days-poster-zh-Hant.webp"
          cp assets/art/kaikai-115days-explainer-zh-Hans-20260828.webp "$out/kaikai-115days-poster-zh-Hans.webp"

          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          out = Path('visual-exports')
          for language in ('zh-Hant', 'zh-Hans'):
              source = out / f'kaikai-main-visual-{language}.jpg'
              target = out / f'kaikai-main-visual-{language}.png'
              with Image.open(source) as image:
                  image.convert('RGB').save(target, 'PNG', optimize=True)
          PY

          test "$(stat -c %s "$out/kaikai-main-visual-zh-Hant.png")" -gt 100000
          test "$(stat -c %s "$out/kaikai-main-visual-zh-Hans.png")" -gt 100000
          test "$(stat -c %s "$out/kaikai-115days-poster-zh-Hant.png")" -gt 100000
          test "$(stat -c %s "$out/kaikai-115days-poster-zh-Hans.png")" -gt 100000

      - name: Start local site
        shell: bash
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 > /tmp/kaikai-export-server.log 2>&1 &
          echo $! > /tmp/kaikai-export-server.pid
          for attempt in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/hearing-records/prison-watch/kaikai-final-chapter/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/kaikai-export-server.log
          exit 1

      - name: Render bilingual relationship trees at high resolution
        run: |
          node --input-type=module <<'JS'
          import { chromium } from 'playwright-core';
          import fs from 'node:fs';

          const output = 'visual-exports';
          const sites = {
            'zh-Hant': {
              url: 'http://127.0.0.1:8000/hearing-records/prison-watch/kaikai-final-chapter/#system',
              title: '五層責任明細樹＋法人治理旁軸',
              child: '剴剴',
              file: 'kaikai-responsibility-tree-zh-Hant.png'
            },
            'zh-Hans': {
              url: 'http://127.0.0.1:8000/hearing-records/prison-watch/kaikai-final-chapter/zh-Hans/#system',
              title: '五层责任明细树＋法人治理旁轴',
              child: '剀剀',
              file: 'kaikai-responsibility-tree-zh-Hans.png'
            }
          };

          const browser = await chromium.launch({
            headless: true,
            executablePath: '/usr/bin/google-chrome',
            args: ['--no-sandbox', '--disable-dev-shm-usage']
          });
          const results = [];
          let failed = false;

          for (const [language, site] of Object.entries(sites)) {
            const context = await browser.newContext({
              viewport: { width: 1800, height: 1200 },
              deviceScaleFactor: 2,
              locale: language === 'zh-Hant' ? 'zh-TW' : 'zh-CN',
              colorScheme: 'light',
              reducedMotion: 'reduce'
            });
            await context.route('**/*', async route => {
              if (route.request().resourceType() === 'media') return route.abort();
              return route.continue();
            });
            const page = await context.newPage();
            const pageErrors = [];
            const localErrors = [];
            page.on('pageerror', error => pageErrors.push(String(error)));
            page.on('response', response => {
              const parsed = new URL(response.url());
              if (parsed.hostname === '127.0.0.1' && response.status() >= 400) {
                localErrors.push({ url: response.url(), status: response.status() });
              }
            });

            const response = await page.goto(site.url, { waitUntil: 'domcontentloaded', timeout: 60000 });
            await page.waitForSelector('.responsibility-tree-panel', { state: 'attached', timeout: 15000 });
            await page.evaluate(() => {
              document.querySelectorAll('main section[data-reading-level]').forEach(section => {
                section.hidden = false;
                section.style.contentVisibility = 'visible';
                section.dataset.depthReveal = 'true';
              });
              const system = document.getElementById('system');
              if (system) {
                system.hidden = false;
                system.style.contentVisibility = 'visible';
                system.dataset.depthReveal = 'true';
              }
            });
            await page.addStyleTag({ content: `
              html, body { margin: 0 !important; background: #f3ead8 !important; }
              .topbar, .chapter-breadcrumb, .chapter-audio, .reading-depth, .back-to-top, .chapter-toast, .site-footer { display: none !important; }
              main { width: 100% !important; max-width: none !important; margin: 0 !important; padding: 0 !important; }
              #system { width: 100% !important; max-width: none !important; margin: 0 !important; padding: 48px !important; box-sizing: border-box !important; }
              #system > *:not(.responsibility-tree-panel) { display: none !important; }
              .responsibility-tree-panel {
                display: block !important;
                width: 1540px !important;
                max-width: 1540px !important;
                margin: 0 auto !important;
                box-sizing: border-box !important;
                opacity: 1 !important;
                transform: none !important;
              }
              .responsibility-tree-panel, .responsibility-tree-panel * {
                animation: none !important;
                transition: none !important;
              }
              .responsibility-tree-panel * { opacity: 1 !important; transform: none !important; }
              .responsibility-tree { width: 100% !important; max-width: none !important; overflow: visible !important; }
            ` });
            await page.evaluate(async () => { await document.fonts.ready; });
            await page.waitForTimeout(900);

            const panel = page.locator('.responsibility-tree-panel');
            await panel.scrollIntoViewIfNeeded();
            const state = await panel.evaluate((node, expected) => {
              const rect = node.getBoundingClientRect();
              const text = node.textContent || '';
              const tree = node.querySelector('.responsibility-tree');
              return {
                title: text.includes(expected.title),
                child: text.includes(expected.child),
                layers: node.querySelectorAll('.tree-layer').length,
                width: Math.round(rect.width),
                height: Math.round(rect.height),
                treeOverflowX: tree ? tree.scrollWidth - tree.clientWidth : 999,
                panelOverflowX: node.scrollWidth - node.clientWidth
              };
            }, site);

            await panel.screenshot({
              path: `${output}/${site.file}`,
              animations: 'disabled',
              caret: 'hide',
              timeout: 30000
            });

            const checks = {
              http200: response?.status() === 200,
              localizedTitle: state.title,
              childPresent: state.child,
              fiveLayers: state.layers === 5,
              usefulDimensions: state.width >= 1400 && state.height >= 900,
              noHorizontalClipping: state.treeOverflowX <= 2 && state.panelOverflowX <= 2,
              noPageErrors: pageErrors.length === 0
            };
            const passed = Object.values(checks).every(Boolean);
            if (!passed) failed = true;
            results.push({ language, status: response?.status() ?? null, checks, state, pageErrors, localErrors, passed });
            await context.close();
          }

          await browser.close();
          fs.writeFileSync(`${output}/responsibility-tree-report.json`, JSON.stringify({ generatedAt: new Date().toISOString(), results }, null, 2));
          console.log(JSON.stringify(results, null, 2));
          if (failed) process.exit(1);
          JS

      - name: Convert trees, verify dimensions, and package downloads
        shell: bash
        run: |
          set -euo pipefail
          out='visual-exports'
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          out = Path('visual-exports')
          for language in ('zh-Hant', 'zh-Hans'):
              source = out / f'kaikai-responsibility-tree-{language}.png'
              target = out / f'kaikai-responsibility-tree-{language}.webp'
              with Image.open(source) as image:
                  image.convert('RGB').save(target, 'WEBP', quality=92, method=6)

          names = [
              'kaikai-main-visual-zh-Hant.png',
              'kaikai-main-visual-zh-Hans.png',
              'kaikai-115days-poster-zh-Hant.png',
              'kaikai-115days-poster-zh-Hans.png',
              'kaikai-responsibility-tree-zh-Hant.png',
              'kaikai-responsibility-tree-zh-Hans.png',
          ]
          lines = []
          for name in names:
              path = out / name
              if not path.is_file() or path.stat().st_size == 0:
                  raise SystemExit(f'Missing output: {name}')
              with Image.open(path) as image:
                  width, height = image.size
              if width < 1200 or height < 800:
                  raise SystemExit(f'Output too small: {name} {width}x{height}')
              lines.append(f'{name}: {width}x{height}')
          (out / 'image-dimensions.txt').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY

          cat > "$out/README.txt" <<'EOF'
          剴剴案第二章｜三組視覺繁簡體下載包

          三組 PNG：
          1. 主視覺：kaikai-main-visual-zh-Hant.png / zh-Hans.png
          2. 115天大海報：kaikai-115days-poster-zh-Hant.png / zh-Hans.png
          3. 五層責任關係樹：kaikai-responsibility-tree-zh-Hant.png / zh-Hans.png

          另附：
          - 主視覺原始 JPG
          - 115天大海報 SVG、WebP
          - 關係樹 WebP
          - 圖片尺寸、SHA-256與Chrome渲染驗證報告
          EOF

          sha256sum "$out"/kaikai-* > "$out/SHA256SUMS.txt"
          (
            cd "$out"
            zip -9 kaikai-main-visuals-bilingual.zip kaikai-main-visual-zh-Hant.* kaikai-main-visual-zh-Hans.*
            zip -9 kaikai-115days-posters-bilingual.zip kaikai-115days-poster-zh-Hant.* kaikai-115days-poster-zh-Hans.*
            zip -9 kaikai-responsibility-trees-bilingual.zip kaikai-responsibility-tree-zh-Hant.* kaikai-responsibility-tree-zh-Hans.* responsibility-tree-report.json
            zip -9 kaikai-three-visuals-bilingual-complete.zip \
              kaikai-main-visual-zh-Hant.* kaikai-main-visual-zh-Hans.* \
              kaikai-115days-poster-zh-Hant.* kaikai-115days-poster-zh-Hans.* \
              kaikai-responsibility-tree-zh-Hant.* kaikai-responsibility-tree-zh-Hans.* \
              README.txt SHA256SUMS.txt image-dimensions.txt responsibility-tree-report.json
          )
          find "$out" -maxdepth 1 -type f -printf '%f %s bytes\n' | sort

      - name: Upload bilingual visual package
        uses: actions/upload-artifact@v4
        with:
          name: kaikai-three-visuals-bilingual-downloads
          path: visual-exports
          retention-days: 14
