name: Fix Kaikai Simplified Chinese fonts

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oneoff-kaikai-simplified-font-fix-20260829.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Simplified Chinese font stack
        run: python scripts/fix-kaikai-simplified-fonts-20260829.py

      - name: Validate font configuration
        run: |
          git diff --check
          grep -q 'Noto+Sans+SC' hearing-records/prison-watch/kaikai-final-chapter/zh-Hans/index.html
          grep -q 'Noto+Serif+SC' hearing-records/prison-watch/kaikai-final-chapter/zh-Hans/index.html
          grep -q 'id="zh-hans-font-stack"' hearing-records/prison-watch/kaikai-final-chapter/zh-Hans/index.html
          ! grep -q 'Noto+Sans+TC' hearing-records/prison-watch/kaikai-final-chapter/zh-Hans/index.html

      - name: Commit correction and remove one-off files
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add hearing-records/prison-watch/kaikai-final-chapter/zh-Hans/index.html
          git rm scripts/fix-kaikai-simplified-fonts-20260829.py .github/workflows/oneoff-kaikai-simplified-font-fix-20260829.yml
          git commit -m 'Use Simplified Chinese fonts on Kaikai zh-Hans page'
          git push origin HEAD:main