name: Add classical quotations to every Qiqi chapter

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oneoff-qiqi-classical-notes.yml'
      - 'scripts/add_qiqi_classical_notes.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: child-advocacy-site-sitemap
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add eleven classical quotation notes to all four languages
        run: python3 scripts/add_qiqi_classical_notes.py

      - name: Refresh multilingual update dates and cache tokens
        env:
          QIQI_VERSION_SHA: ${{ github.sha }}
        run: python3 scripts/sync_fujian_qiqi_feature.py

      - name: Validate copy, structure, CSS and source boundaries
        run: |
          python3 -m py_compile \
            scripts/add_qiqi_classical_notes.py \
            scripts/sync_fujian_qiqi_feature.py
          python3 - <<'PY'
          from pathlib import Path

          pages = [
              Path('historical-cases/regions/mainland-china/fujian-qiqi/index.html'),
              Path('zh-hans/historical-cases/regions/mainland-china/fujian-qiqi/index.html'),
              Path('en/historical-cases/regions/mainland-china/fujian-qiqi/index.html'),
              Path('ja/historical-cases/regions/mainland-china/fujian-qiqi/index.html'),
          ]
          keys = ('act-1','waiting','act-2','signals','act-3','court-findings','act-4','justice','act-5','protection','sources')
          required_quotes = (
              '人面不知何',
              '寸草心',
              '一葉落',
              '凡事豫則立',
              '長太息',
              '惻隱之心',
              '天網恢恢',
              '徒善不足',
              '落紅不是無情物',
              '幼吾幼',
              '多聞闕疑',
          )
          for page in pages:
              text = page.read_text(encoding='utf-8')
              assert text.count('data-fq-classic-key=') == len(keys), page
              for key in keys:
                  assert text.count(f'data-fq-classic-key="{key}"') == 1, (page, key)
              assert text.count('<html') == 1 and text.count('</html>') == 1, page
              assert 'fujian-qiqi-feature.css?v=' in text, page
              assert 'fujian-qiqi-feature.js?v=' in text, page
          traditional = pages[0].read_text(encoding='utf-8')
          for fragment in required_quotes:
              assert fragment in traditional, fragment
          css = Path('assets/fujian-qiqi-feature.css').read_text(encoding='utf-8')
          assert 'Classical inscriptions and gentle modern readings' in css
          assert '.fq-classic-note' in css
          assert '@media (max-width: 720px)' in css
          print('Validated 44 classical quotation notes and responsive styling.')
          PY
          git diff --check

      - name: Commit the four-language feature and remove one-off files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -- \
            .github/workflows/oneoff-qiqi-classical-notes.yml \
            scripts/add_qiqi_classical_notes.py
          git add -- \
            assets/fujian-qiqi-feature.css \
            historical-cases/regions/mainland-china/fujian-qiqi/index.html \
            zh-hans/historical-cases/regions/mainland-china/fujian-qiqi/index.html \
            en/historical-cases/regions/mainland-china/fujian-qiqi/index.html \
            ja/historical-cases/regions/mainland-china/fujian-qiqi/index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Add classical quotations and gentle modern readings to Qiqi feature'
          git pull --rebase origin main
          git push
