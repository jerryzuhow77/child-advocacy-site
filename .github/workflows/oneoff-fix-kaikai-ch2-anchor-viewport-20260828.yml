name: One-off fix Kaikai Chapter 2 anchor viewport

on:
  push:
    branches:
      - fix/kaikai-ch2-anchor-viewport-20260828

permissions:
  contents: write

concurrency:
  group: fix-kaikai-ch2-anchor-viewport-20260828
  cancel-in-progress: false

jobs:
  patch-test-commit:
    if: ${{ !contains(github.event.head_commit.message, '[anchor-viewport-fixed]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out fix branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Patch initial and in-page anchors plus mobile title
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          base = Path('hearing-records/prison-watch/kaikai-final-chapter')
          js_path = base / 'final-chapter.js'
          css_path = base / 'final-chapter.css'
          html_paths = [base / 'index.html', base / 'zh-Hans' / 'index.html']

          js = js_path.read_text(encoding='utf-8')
          pattern = re.compile(
              r"  const revealHashTarget = \(scroll = false\) => \{.*?\nconst applyReadingDepth = \(scrollToHash = false\) => \{.*?\n\};",
              re.DOTALL,
          )
          replacement = '''  const revealHashTarget = (scroll = false, instant = false) => {
            document.querySelectorAll('[data-depth-reveal="true"]').forEach((node) => {
              node.removeAttribute('data-depth-reveal');
              node.querySelector(':scope > .depth-reveal-note')?.remove();
            });

            const target = getHashTarget();
            const revealedSections = new Set();
            if (!target) return revealedSections;

            const closestSection = target.closest('main section[data-reading-level]');
            let section = closestSection;
            while (section) {
              section.dataset.depthReveal = 'true';
              section.hidden = false;
              section.removeAttribute('aria-hidden');
              revealedSections.add(section);
              section = section.parentElement?.closest('main section[data-reading-level]') || null;
            }

            if (closestSection && !closestSection.querySelector(':scope > .depth-reveal-note')) {
              const note = document.createElement('p');
              note.className = 'depth-reveal-note';
              note.textContent = copy.revealed;
              closestSection.prepend(note);
            }

            const revealNodes = new Set();
            if (target.matches('.reveal')) revealNodes.add(target);
            const revealAncestor = target.closest('.reveal');
            if (revealAncestor) revealNodes.add(revealAncestor);
            target.querySelectorAll(':scope > .reveal, :scope > header.reveal').forEach((node) => revealNodes.add(node));
            revealNodes.forEach((node) => node.classList.add('in-view'));

            if (scroll) {
              requestAnimationFrame(() => {
                requestAnimationFrame(() => target.scrollIntoView({
                  behavior: instant || reduceMotion ? 'auto' : 'smooth',
                  block: 'start'
                }));
              });
            }
            return revealedSections;
          };
          const applyReadingDepth = (scrollToHash = false, instant = false) => {
            const selected = Object.prototype.hasOwnProperty.call(depthRank, body.dataset.readingDepth)
              ? body.dataset.readingDepth : 'guided';
            const revealedSections = revealHashTarget(false);
            depthSections.forEach((section) => {
              const needed = depthRank[section.dataset.readingLevel] ?? 0;
              const hide = needed > depthRank[selected] && !revealedSections.has(section);
              section.hidden = hide;
              if (hide) section.setAttribute('aria-hidden', 'true');
              else section.removeAttribute('aria-hidden');
            });
            if (scrollToHash) revealHashTarget(true, instant);
            syncLifeToggle();
          };'''
          js, count = pattern.subn(lambda _: replacement, js, count=1)
          if count != 1:
              raise SystemExit(f'Expected one reveal/apply block, found {count}')

          old_hash = "  window.addEventListener('hashchange', () => applyReadingDepth(true));"
          new_hash = "  window.addEventListener('hashchange', () => applyReadingDepth(true, false));"
          if js.count(old_hash) != 1:
              raise SystemExit(f'Expected one hashchange block, found {js.count(old_hash)}')
          js = js.replace(old_hash, new_hash, 1)

          old_initial = "  syncLifeToggle();\n  applyReadingDepth(false);"
          new_initial = "  syncLifeToggle();\n  applyReadingDepth(Boolean(getHashTarget()), true);"
          if js.count(old_initial) != 1:
              raise SystemExit(f'Expected one initial apply block, found {js.count(old_initial)}')
          js = js.replace(old_initial, new_initial, 1)
          js_path.write_text(js, encoding='utf-8')

          css = css_path.read_text(encoding='utf-8')
          old_mobile_title = '.hero h1{font-size:50px}'
          new_mobile_title = '.hero h1{font-size:clamp(36px,11.7vw,46px);white-space:nowrap}'
          if css.count(old_mobile_title) != 1:
              raise SystemExit(f'Expected one mobile hero title rule, found {css.count(old_mobile_title)}')
          css = css.replace(old_mobile_title, new_mobile_title, 1)
          css_path.write_text(css, encoding='utf-8')

          for html_path in html_paths:
              html = html_path.read_text(encoding='utf-8')
              if html.count('final-chapter.css?v=20260828-17') != 1:
                  raise SystemExit(f'{html_path}: unexpected CSS cache-bust count')
              if html.count('final-chapter.js?v=20260828-5') != 1:
                  raise SystemExit(f'{html_path}: unexpected JS cache-bust count')
              html = html.replace('final-chapter.css?v=20260828-17', 'final-chapter.css?v=20260828-18', 1)
              html = html.replace('final-chapter.js?v=20260828-5', 'final-chapter.js?v=20260828-6', 1)
              html_path.write_text(html, encoding='utf-8')
          PY

      - name: Static validation
        shell: bash
        run: |
          node --check hearing-records/prison-watch/kaikai-final-chapter/final-chapter.js
          git diff --check
          grep -F "applyReadingDepth(Boolean(getHashTarget()), true);" hearing-records/prison-watch/kaikai-final-chapter/final-chapter.js
          grep -F "target.scrollIntoView" hearing-records/prison-watch/kaikai-final-chapter/final-chapter.js
          grep -F "revealNodes.forEach((node) => node.classList.add('in-view'));" hearing-records/prison-watch/kaikai-final-chapter/final-chapter.js
          grep -F 'font-size:clamp(36px,11.7vw,46px);white-space:nowrap' hearing-records/prison-watch/kaikai-final-chapter/final-chapter.css
          grep -R -F 'final-chapter.css?v=20260828-18' hearing-records/prison-watch/kaikai-final-chapter/index.html hearing-records/prison-watch/kaikai-final-chapter/zh-Hans/index.html
          grep -R -F 'final-chapter.js?v=20260828-6' hearing-records/prison-watch/kaikai-final-chapter/index.html hearing-records/prison-watch/kaikai-final-chapter/zh-Hans/index.html

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Chromium
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/kaikai-anchor-pw"
          cd "$RUNNER_TEMP/kaikai-anchor-pw"
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null

      - name: Run local real-browser regression suite
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/browser-fix-artifacts"
          cd "$RUNNER_TEMP/kaikai-anchor-pw"
          cat > verify.mjs <<'JS'
          import fs from 'node:fs';
          import path from 'node:path';
          import { chromium } from 'playwright';

          const origin = 'http://127.0.0.1:4173';
          const route = '/hearing-records/prison-watch/kaikai-final-chapter/';
          const out = path.join(process.env.GITHUB_WORKSPACE, 'browser-fix-artifacts');
          const locales = [
            { name: 'zh-Hant', path: '' },
            { name: 'zh-Hans', path: 'zh-Hans/' }
          ];
          const viewports = [
            { name: 'desktop', width: 1440, height: 900 },
            { name: 'mobile', width: 390, height: 844 }
          ];
          const deepIds = ['evidence-atlas', 'witness-conflicts', 'blood-boundary', 'responsibility-orbit', 'dental-warning', 'placement-spectrum'];
          const failures = [];
          const results = [];
          const browser = await chromium.launch({ headless: true });

          const state = async (page, selector) => page.locator(selector).evaluate((element) => {
            const rect = element.getBoundingClientRect();
            const style = getComputedStyle(element);
            return {
              top: Math.round(rect.top),
              bottom: Math.round(rect.bottom),
              opacity: Number(style.opacity),
              display: style.display,
              visibility: style.visibility,
              inViewport: rect.top < innerHeight && rect.bottom > 0,
              hidden: element.hidden,
              className: element.className
            };
          });

          for (const locale of locales) {
            for (const viewport of viewports) {
              const context = await browser.newContext({ viewport: { width: viewport.width, height: viewport.height } });
              await context.addInitScript(() => localStorage.setItem('kaikai-final-reading-depth-v1', 'quick'));
              const page = await context.newPage();
              const pageErrors = [];
              page.on('pageerror', (error) => pageErrors.push(error.message));
              const base = `${origin}${route}${locale.path}`;

              await page.goto(base, { waitUntil: 'domcontentloaded', timeout: 45000 });
              await page.waitForTimeout(300);
              const topState = await page.evaluate(() => {
                const h1 = document.querySelector('.hero h1');
                const titleNode = [...h1.childNodes].find((node) => node.nodeType === Node.TEXT_NODE && node.textContent.trim());
                const range = document.createRange();
                range.selectNodeContents(titleNode);
                const titleRects = [...range.getClientRects()].map((rect) => ({ width: Math.round(rect.width), top: Math.round(rect.top) }));
                return {
                  titleRects,
                  overflow: document.documentElement.scrollWidth - document.documentElement.clientWidth,
                  h1WhiteSpace: getComputedStyle(h1).whiteSpace
                };
              });
              results.push({ test: 'title', locale: locale.name, viewport: viewport.name, state: topState });
              if (topState.overflow > 4) failures.push(`${locale.name}/${viewport.name} overflow ${topState.overflow}px`);
              if (viewport.name === 'mobile' && (topState.titleRects.length !== 1 || topState.h1WhiteSpace !== 'nowrap')) failures.push(`${locale.name}/mobile title wrapped: ${JSON.stringify(topState)}`);

              await page.locator('#menuButton').click();
              await page.locator('.nav-group').filter({ has: page.locator('a[href="#evidence-atlas"]') }).evaluate((element) => { element.open = true; });
              await page.locator('#siteNav a[href="#evidence-atlas"]').click();
              await page.waitForTimeout(900);
              const menuAtlas = await state(page, '#evidence-atlas');
              results.push({ test: 'menu-anchor', locale: locale.name, viewport: viewport.name, state: menuAtlas });
              if (!menuAtlas.inViewport || menuAtlas.opacity < 0.99 || menuAtlas.hidden) failures.push(`${locale.name}/${viewport.name} menu atlas: ${JSON.stringify(menuAtlas)}`);

              for (const id of deepIds) {
                await page.goto(`${base}#${id}`, { waitUntil: 'domcontentloaded', timeout: 45000 });
                await page.waitForTimeout(350);
                const initial = await state(page, `#${id}`);
                await page.reload({ waitUntil: 'domcontentloaded', timeout: 45000 });
                await page.waitForTimeout(350);
                const reloaded = await state(page, `#${id}`);
                results.push({ test: 'deep-link', locale: locale.name, viewport: viewport.name, id, initial, reloaded });
                for (const [phase, item] of [['initial', initial], ['reload', reloaded]]) {
                  if (!item.inViewport || item.opacity < 0.99 || item.hidden || item.display === 'none' || item.visibility === 'hidden') failures.push(`${locale.name}/${viewport.name} #${id} ${phase}: ${JSON.stringify(item)}`);
                }
                if (locale.name === 'zh-Hant' && viewport.name === 'mobile' && id === 'dental-warning') {
                  await page.screenshot({ path: path.join(out, 'mobile-dental-after-fix.png'), fullPage: false });
                }
                if (locale.name === 'zh-Hant' && viewport.name === 'mobile' && id === 'responsibility-orbit') {
                  await page.screenshot({ path: path.join(out, 'mobile-responsibility-after-fix.png'), fullPage: false });
                }
              }
              if (pageErrors.length) failures.push(`${locale.name}/${viewport.name} page errors: ${pageErrors.join(' | ')}`);
              await context.close();
            }
          }

          const narrow = await browser.newPage({ viewport: { width: 320, height: 780 } });
          await narrow.goto(`${origin}${route}`, { waitUntil: 'domcontentloaded', timeout: 45000 });
          await narrow.waitForTimeout(250);
          const narrowTitle = await narrow.evaluate(() => {
            const h1 = document.querySelector('.hero h1');
            const node = [...h1.childNodes].find((item) => item.nodeType === Node.TEXT_NODE && item.textContent.trim());
            const range = document.createRange();
            range.selectNodeContents(node);
            return { rects: range.getClientRects().length, overflow: document.documentElement.scrollWidth - document.documentElement.clientWidth, fontSize: getComputedStyle(h1).fontSize };
          });
          results.push({ test: 'narrow-title', state: narrowTitle });
          if (narrowTitle.rects !== 1 || narrowTitle.overflow > 4) failures.push(`320px title: ${JSON.stringify(narrowTitle)}`);
          await narrow.close();
          await browser.close();

          const report = { passed: failures.length === 0, failures, results };
          fs.writeFileSync(path.join(out, 'report.json'), JSON.stringify(report, null, 2));
          fs.writeFileSync(path.join(out, 'summary.txt'), `Result: ${report.passed ? 'PASS' : 'FAIL'}\nFailures: ${failures.length}\n${failures.join('\n')}`);
          console.log(JSON.stringify(report, null, 2));
          if (failures.length) process.exit(1);
          JS

          cd "$GITHUB_WORKSPACE"
          python -m http.server 4173 > "$RUNNER_TEMP/kaikai-anchor-http.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in {1..20}; do
            curl -fsS "http://127.0.0.1:4173/hearing-records/prison-watch/kaikai-final-chapter/" >/dev/null && break
            sleep 1
          done
          cd "$RUNNER_TEMP/kaikai-anchor-pw"
          node verify.mjs

      - name: Upload fix evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kaikai-chapter2-anchor-viewport-fix-evidence
          path: browser-fix-artifacts/
          if-no-files-found: error
          retention-days: 14

      - name: Commit verified fix and remove one-off workflows
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -- .github/workflows/oneoff-fix-kaikai-ch2-anchor-viewport-20260828.yml
          git rm -- .github/workflows/oneoff-kaikai-browser-validation-20260829-v2.yml
          git add hearing-records/prison-watch/kaikai-final-chapter/final-chapter.js
          git add hearing-records/prison-watch/kaikai-final-chapter/final-chapter.css
          git add hearing-records/prison-watch/kaikai-final-chapter/index.html
          git add hearing-records/prison-watch/kaikai-final-chapter/zh-Hans/index.html
          git diff --cached --check
          git commit -m "Fix Chapter 2 anchor viewport and mobile title [anchor-viewport-fixed]"
          git push origin "HEAD:${{ github.ref_name }}"
