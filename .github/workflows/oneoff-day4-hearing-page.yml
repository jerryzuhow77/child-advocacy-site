name: One-off fix Day 4 homepage artwork
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oneoff-day4-hearing-page.yml'
permissions:
  contents: write
jobs:
  fix-homepage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace Day 4 homepage image references
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          old='prison-watch-day4-hearing-poster-20260821.svg'
          new='prison-watch-day4-hearing-poster-20260821.webp'
          for p in [Path('index.html'), Path('source/index.html')]:
              s=p.read_text(encoding='utf-8')
              before=s.count(old)
              if before < 1:
                  raise SystemExit(f'{p}: no old Day 4 SVG reference found')
              s=s.replace(old,new)
              p.write_text(s,encoding='utf-8')
              print(f'{p}: replaced {before} reference(s)')
          assert old not in Path('index.html').read_text(encoding='utf-8')
          assert old not in Path('source/index.html').read_text(encoding='utf-8')
          assert new in Path('index.html').read_text(encoding='utf-8')
          assert new in Path('source/index.html').read_text(encoding='utf-8')
          PY
      - name: Commit homepage fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- index.html source/index.html
          git diff --cached --check
          git commit -m 'Use revised Day 4 artwork on homepage'
          git push