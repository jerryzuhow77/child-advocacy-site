name: Publish corrected Day 4 clay artwork

on:
  push:
    branches:
      - update/day4-impression-art-20260821
    paths:
      - ".github/workflows/oneoff-day4-hearing-page.yml"
      - ".github/day4-image-payload/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: child-advocacy-site-day4-art-v2-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out artwork branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Decode, install, relink and validate artwork
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import base64
          import hashlib
          import html
          import re
          import shutil
          from pathlib import Path

          root = Path.cwd()
          payload_dir = root / '.github/day4-image-payload'
          parts = sorted(payload_dir.glob('part*.b64'))
          if len(parts) != 11:
              raise SystemExit(f'Expected 11 payload parts, found {len(parts)}')

          encoded = ''.join(part.read_text(encoding='ascii') for part in parts)
          data = base64.b64decode(encoded, validate=True)
          expected_sha256 = '474254e709db422adbad8fc03c0d4dc96050a68ca8b46719e51d1ae909b39e6e'
          actual_sha256 = hashlib.sha256(data).hexdigest()
          if actual_sha256 != expected_sha256:
              raise SystemExit(f'Artwork SHA-256 mismatch: expected {expected_sha256}, got {actual_sha256}')
          if len(data) != 61666:
              raise SystemExit(f'Artwork size mismatch: expected 61666 bytes, got {len(data)}')
          if not data.startswith(b'RIFF') or data[8:12] != b'WEBP':
              raise SystemExit('Decoded payload is not a WebP image')

          new_name = 'prison-watch-day4-hearing-poster-clay-20260821-v2.webp'
          old_names = (
              'prison-watch-day4-hearing-poster-20260821.svg',
              'prison-watch-day4-hearing-poster-20260821.webp',
          )

          asset_paths = [
              root / 'assets/art' / new_name,
              root / 'source/assets/art' / new_name,
          ]
          for path in asset_paths:
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(data)

          text_paths = [
              root / 'index.html',
              root / 'en/index.html',
              root / 'ja/index.html',
              root / 'source/index.html',
              root / 'source/en/index.html',
              root / 'source/ja/index.html',
              root / 'hearing-records/prison-watch/kaikai-day4-20250428/index.html',
              root / 'en/hearing-records/prison-watch/kaikai-day4-20250428/index.html',
              root / 'ja/hearing-records/prison-watch/kaikai-day4-20250428/index.html',
              root / 'source/hearing-records/prison-watch/kaikai-day4-20250428/index.html',
              root / 'source/en/hearing-records/prison-watch/kaikai-day4-20250428/index.html',
              root / 'source/ja/hearing-records/prison-watch/kaikai-day4-20250428/index.html',
              root / 'data/hearing-records.json',
              root / 'en/data/hearing-records.json',
              root / 'ja/data/hearing-records.json',
              root / 'source/data/hearing-records.json',
              root / 'source/en/data/hearing-records.json',
              root / 'source/ja/data/hearing-records.json',
              root / 'scripts/apply_home_first_round.py',
          ]
          changed_text_paths: list[Path] = []
          for path in text_paths:
              if not path.exists():
                  continue
              text = path.read_text(encoding='utf-8')
              revised = text
              for old_name in old_names:
                  revised = revised.replace(old_name, new_name)
              if revised != text:
                  path.write_text(revised, encoding='utf-8')
                  changed_text_paths.append(path)

          localized_pages = {
              root / 'hearing-records/prison-watch/kaikai-day4-20250428/index.html': '第四日庭訊印象主視覺，以紙雕與陶土藝術呈現法庭、守護意象，以及穿著淺藍與深藍條紋上衣的孩子',
              root / 'source/hearing-records/prison-watch/kaikai-day4-20250428/index.html': '第四日庭訊印象主視覺，以紙雕與陶土藝術呈現法庭、守護意象，以及穿著淺藍與深藍條紋上衣的孩子',
              root / 'en/hearing-records/prison-watch/kaikai-day4-20250428/index.html': 'Day 4 hearing impression artwork in papercraft and clay, showing the courtroom, protective motifs, and a child in light-blue and dark-blue stripes',
              root / 'source/en/hearing-records/prison-watch/kaikai-day4-20250428/index.html': 'Day 4 hearing impression artwork in papercraft and clay, showing the courtroom, protective motifs, and a child in light-blue and dark-blue stripes',
              root / 'ja/hearing-records/prison-watch/kaikai-day4-20250428/index.html': '紙彫刻と陶土アートで法廷と見守りの象徴、淡い青と濃い青の縞模様の服を着た子どもを描いた第4日公判イメージ',
              root / 'source/ja/hearing-records/prison-watch/kaikai-day4-20250428/index.html': '紙彫刻と陶土アートで法廷と見守りの象徴、淡い青と濃い青の縞模様の服を着た子どもを描いた第4日公判イメージ',
          }
          tag_pattern = re.compile(r'<img\b[^>]*\bsrc="[^"]*' + re.escape(new_name) + r'"[^>]*>')
          for path, alt_text in localized_pages.items():
              if not path.exists():
                  continue
              text = path.read_text(encoding='utf-8')
              match = tag_pattern.search(text)
              if not match:
                  raise SystemExit(f'Hero image tag not found in {path}')
              tag = match.group(0)
              escaped_alt = html.escape(alt_text, quote=True)
              if re.search(r'\balt="[^"]*"', tag):
                  tag = re.sub(r'\balt="[^"]*"', f'alt="{escaped_alt}"', tag, count=1)
              else:
                  tag = tag[:-1] + f' alt="{escaped_alt}">'
              if re.search(r'\bwidth="\d+"', tag):
                  tag = re.sub(r'\bwidth="\d+"', 'width="720"', tag, count=1)
              if re.search(r'\bheight="\d+"', tag):
                  tag = re.sub(r'\bheight="\d+"', 'height="480"', tag, count=1)
              revised = text[:match.start()] + tag + text[match.end():]
              if revised != text:
                  path.write_text(revised, encoding='utf-8')
                  if path not in changed_text_paths:
                      changed_text_paths.append(path)

          marker = '/* 2026-08-21 clay/papercraft Day 4 impression art v2 */'
          css_patch = '''
          /* 2026-08-21 clay/papercraft Day 4 impression art v2 */
          .day4-page .day3-hero-poster {
            align-self: center;
            width: min(100%, 760px);
          }
          .day4-page .day3-hero-poster::before {
            display: none;
          }
          .day4-page .day3-hero-poster img {
            display: block;
            width: 100%;
            height: auto;
            aspect-ratio: 3 / 2;
            object-fit: contain;
            border-radius: 24px;
          }
          @media (max-width: 860px) {
            .day4-page .day3-hero-poster {
              width: 100%;
            }
            .day4-page .day3-hero-poster img {
              aspect-ratio: 3 / 2;
            }
          }
          '''.strip()
          css_paths = [
              root / 'hearing-records/prison-watch/kaikai-day4-20250428/day4.css',
              root / 'source/hearing-records/prison-watch/kaikai-day4-20250428/day4.css',
          ]
          for path in css_paths:
              text = path.read_text(encoding='utf-8')
              if marker not in text:
                  path.write_text(text.rstrip() + '\n\n' + css_patch + '\n', encoding='utf-8')
                  changed_text_paths.append(path)

          required = [
              root / 'index.html',
              root / 'source/index.html',
              *localized_pages.keys(),
          ]
          for path in required:
              text = path.read_text(encoding='utf-8')
              if new_name not in text:
                  raise SystemExit(f'New artwork is not referenced by {path}')
          if hashlib.sha256(asset_paths[0].read_bytes()).hexdigest() != expected_sha256:
              raise SystemExit('Installed public artwork failed final checksum')
          if asset_paths[0].read_bytes() != asset_paths[1].read_bytes():
              raise SystemExit('Public and source artwork copies differ')

          (root / '.github/day4-changed-paths.txt').write_text(
              '\n'.join(str(path.relative_to(root)) for path in dict.fromkeys(changed_text_paths)) + '\n',
              encoding='utf-8',
          )
          shutil.rmtree(payload_dir)
          workflow = root / '.github/workflows/oneoff-day4-hearing-page.yml'
          workflow.unlink()
          print(f'Installed {new_name}: {len(data)} bytes; SHA-256 {actual_sha256}')
          PY

      - name: Commit corrected artwork to the branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          paths=(
            assets/art/prison-watch-day4-hearing-poster-clay-20260821-v2.webp
            source/assets/art/prison-watch-day4-hearing-poster-clay-20260821-v2.webp
          )
          while IFS= read -r path; do
            [[ -n "$path" && -e "$path" ]] && paths+=("$path")
          done < .github/day4-changed-paths.txt
          git add -- "${paths[@]}"
          git rm -r --ignore-unmatch -- .github/day4-image-payload .github/workflows/oneoff-day4-hearing-page.yml
          rm -f .github/day4-changed-paths.txt

          git diff --cached --check
          git commit -m 'Publish corrected Day 4 clay artwork'
          git push origin HEAD:"${GITHUB_REF_NAME}"
