name: Finalize Day 4 Site B residence attribution

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oneoff-day4-location-owner-final.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove final stale Site B attribution
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin main
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          target = root / 'hearing-records/prison-watch/kaikai-day4-20250428/day4-crosscheck.js'
          text = target.read_text(encoding='utf-8')
          old = 'possibly at Liu Ruo-lin’s residence'
          new = 'possibly at Liu Tsai-hsuan’s residence'
          if old not in text:
              raise SystemExit('Expected stale English Site B wording was not found')
          text = text.replace(old, new)
          if old in text:
              raise SystemExit('Stale English Site B wording remains')
          target.write_text(text, encoding='utf-8')

          def bump(path, pattern, replacement):
              value = path.read_text(encoding='utf-8')
              value, count = re.subn(pattern, replacement, value, count=1)
              if count != 1:
                  raise SystemExit(f'Cache-bust anchor missing in {path}')
              path.write_text(value, encoding='utf-8')

          bump(
              root / 'hearing-records/prison-watch/kaikai-day3-20250425/day3-reading-core-20260821.js',
              r"day4-crosscheck\.js\?v=[^']+",
              'day4-crosscheck.js?v=20260821-location-owner-final-4'
          )
          bump(
              root / 'hearing-records/prison-watch/kaikai-day3-20250425/day3-reading.js',
              r"day3-reading-core-20260821\.js\?v=[^']+",
              'day3-reading-core-20260821.js?v=20260821-shared-location-owner-final-4'
          )
          bump(
              root / 'sw.js',
              r"const VERSION = '[^']+';",
              "const VERSION = '2026-08-21-day4-location-owner-final-v4';"
          )
          PY

          node --check hearing-records/prison-watch/kaikai-day4-20250428/day4-crosscheck.js
          node --check hearing-records/prison-watch/kaikai-day3-20250425/day3-reading-core-20260821.js
          node --check hearing-records/prison-watch/kaikai-day3-20250425/day3-reading.js
          node --check sw.js

          rm -f .github/workflows/oneoff-day4-location-owner-final.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Finalize Site B as possible Liu Tsai-hsuan residence'
          git pull --rebase origin main
          git push origin main
