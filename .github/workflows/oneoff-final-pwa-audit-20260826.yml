name: One-off final three-site PWA audit 2026-08-26

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/oneoff-final-pwa-audit-20260826.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Final Chrome installability verification
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Wait until the repaired GitHub Pages homepage is public
        shell: bash
        run: |
          set -Eeuo pipefail
          url='https://jerryzuhow77.github.io/child-advocacy-site/'
          deployed=0
          for attempt in $(seq 1 30); do
            curl -fsSL --retry 2 --connect-timeout 15 --max-time 60 \
              -o /tmp/official-home.html "${url}?pwa-final-deploy=${GITHUB_SHA}-${attempt}"
            if python3 - <<'PY'
          from pathlib import Path
          raw = Path('/tmp/official-home.html').read_bytes()
          raise SystemExit(0 if raw.startswith(b'<!DOCTYPE html>') and b'Warning: truncated output' not in raw[:256] else 1)
          PY
            then
              deployed=1
              break
            fi
            sleep 5
          done
          test "$deployed" = 1

      - name: Capture public PWA resources
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p pwa-final-audit/{official,wall-tw,wall-hk}

          capture() {
            local id="$1" home="$2" manifest="$3" sw="$4"
            local dir="pwa-final-audit/$id"
            local nonce="${GITHUB_SHA}-$(date +%s%N)"
            printf '%s\n' "$home" > "$dir/home.url"
            printf '%s\n' "$manifest" > "$dir/manifest.url"
            printf '%s\n' "$sw" > "$dir/sw.url"
            curl -fL --retry 3 --retry-delay 2 --connect-timeout 15 --max-time 60 \
              -D "$dir/home.headers" -o "$dir/home.html" "${home}?pwa-final=${nonce}"
            curl -fL --retry 3 --retry-delay 2 --connect-timeout 15 --max-time 60 \
              -D "$dir/manifest.headers" -o "$dir/manifest.webmanifest" "${manifest}?pwa-final=${nonce}"
            curl -fL --retry 3 --retry-delay 2 --connect-timeout 15 --max-time 60 \
              -D "$dir/sw.headers" -o "$dir/sw.js" "${sw}?pwa-final=${nonce}"
            sha256sum "$dir/home.html" "$dir/manifest.webmanifest" "$dir/sw.js" > "$dir/sha256.txt"
          }

          capture official \
            'https://jerryzuhow77.github.io/child-advocacy-site/' \
            'https://jerryzuhow77.github.io/child-advocacy-site/manifest.webmanifest' \
            'https://jerryzuhow77.github.io/child-advocacy-site/sw.js'
          capture wall-tw \
            'https://global-protection.jerryzuhow77.chatgpt.site/' \
            'https://global-protection.jerryzuhow77.chatgpt.site/site.webmanifest' \
            'https://global-protection.jerryzuhow77.chatgpt.site/sw.js'
          capture wall-hk \
            'https://cn.globalprotectionwall.com/' \
            'https://cn.globalprotectionwall.com/site.webmanifest' \
            'https://cn.globalprotectionwall.com/sw.js'

      - name: Run Lighthouse PWA audits in headless Chrome
        shell: bash
        run: |
          set -Eeuo pipefail
          run_lighthouse() {
            local id="$1" url="$2" dir="pwa-final-audit/$1"
            npx -y lighthouse@11.7.1 "${url}?pwa-final-browser=${GITHUB_SHA}" \
              --only-categories=pwa \
              --output=json \
              --output=html \
              --output-path="$dir/lighthouse" \
              --chrome-flags='--headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage' \
              --max-wait-for-load=60000 \
              --quiet
          }
          run_lighthouse official 'https://jerryzuhow77.github.io/child-advocacy-site/'
          run_lighthouse wall-tw 'https://global-protection.jerryzuhow77.chatgpt.site/'
          run_lighthouse wall-hk 'https://cn.globalprotectionwall.com/'

      - name: Assert all three sites are Chrome-installable PWAs
        shell: bash
        run: |
          python3 - <<'PY'
          from datetime import datetime, timezone
          from pathlib import Path
          import glob
          import json
          import re
          import urllib.parse
          import urllib.request

          root = Path('pwa-final-audit')
          labels = {
              'official': '護童行動聯盟官網',
              'wall-tw': '全球守護留言牆・台灣版',
              'wall-hk': '全球守護留言牆・香港／大陸版',
          }
          summary = {
              'audited_at': datetime.now(timezone.utc).isoformat(),
              'all_pass': True,
              'sites': {},
          }

          def last_header(text, name):
              values = re.findall(rf'(?im)^{re.escape(name)}:\s*(.+?)\s*$', text)
              return values[-1] if values else None

          for site_id, label in labels.items():
              directory = root / site_id
              home_url = (directory / 'home.url').read_text().strip()
              manifest_url = (directory / 'manifest.url').read_text().strip()
              home = (directory / 'home.html').read_text(errors='replace')
              manifest = json.loads((directory / 'manifest.webmanifest').read_text())
              sw = (directory / 'sw.js').read_text(errors='replace')
              sw_headers = (directory / 'sw.headers').read_text(errors='replace')
              report_path = sorted(glob.glob(str(directory / 'lighthouse*.json')))[0]
              lighthouse = json.loads(Path(report_path).read_text())
              audits = lighthouse.get('audits', {})
              pwa_score = lighthouse.get('categories', {}).get('pwa', {}).get('score')

              icon_results = []
              for icon in manifest.get('icons') or []:
                  src = icon.get('src')
                  if not src:
                      continue
                  url = urllib.parse.urljoin(manifest_url, src)
                  try:
                      request = urllib.request.Request(url, headers={'User-Agent': 'PWA-Final-Audit/20260826'})
                      with urllib.request.urlopen(request, timeout=30) as response:
                          payload = response.read()
                          icon_results.append({
                              'url': url,
                              'status': response.status,
                              'bytes': len(payload),
                              'sizes': icon.get('sizes'),
                              'purpose': icon.get('purpose'),
                              'content_type': response.headers.get('content-type'),
                          })
                  except Exception as exc:
                      icon_results.append({'url': url, 'status': 0, 'error': str(exc), 'sizes': icon.get('sizes')})

              display_values = [manifest.get('display')] + list(manifest.get('display_override') or [])
              checks = {
                  'secure_context': home_url.startswith('https://'),
                  'homepage_not_contaminated': 'Warning: truncated output' not in home[:256],
                  'homepage_has_viewport': bool(re.search(r'<meta[^>]+name=["\']viewport["\']', home, re.I)),
                  'homepage_has_theme_color': bool(re.search(r'<meta[^>]+name=["\']theme-color["\']', home, re.I)),
                  'homepage_has_manifest_link': bool(re.search(r'<link[^>]+rel=["\']manifest["\']', home, re.I)),
                  'install_ui_present': bool(re.search(r'下載.{0,12}(App|APP)|加入主畫面|安裝.{0,8}(App|APP)', home, re.I)),
                  'manifest_name': bool(manifest.get('name') and manifest.get('short_name')),
                  'manifest_start_url': bool(manifest.get('start_url')),
                  'manifest_scope': bool(manifest.get('scope')),
                  'manifest_same_origin_start_url': urllib.parse.urljoin(manifest_url, manifest.get('start_url', '')).split('/')[2] == home_url.split('/')[2],
                  'manifest_same_origin_scope': urllib.parse.urljoin(manifest_url, manifest.get('scope', '')).split('/')[2] == home_url.split('/')[2],
                  'manifest_standalone': any(value in {'standalone', 'fullscreen', 'minimal-ui', 'window-controls-overlay'} for value in display_values),
                  'icon_192': any(item.get('status') == 200 and '192x192' in str(item.get('sizes')) and item.get('bytes', 0) > 0 for item in icon_results),
                  'icon_512': any(item.get('status') == 200 and '512x512' in str(item.get('sizes')) and item.get('bytes', 0) > 0 for item in icon_results),
                  'maskable_icon': any(item.get('status') == 200 and 'maskable' in str(item.get('purpose')) for item in icon_results),
                  'service_worker_javascript': bool(re.search(r'javascript|ecmascript', last_header(sw_headers, 'content-type') or '', re.I)),
                  'service_worker_script': 'self.addEventListener' in sw and '<!doctype' not in sw.lower() and '<html' not in sw.lower(),
                  # Lighthouse 11 combines the manifest and controlling service worker
                  # into this installability audit.
                  'chrome_installability': audits.get('installable-manifest', {}).get('score') == 1,
                  'chrome_viewport': audits.get('viewport', {}).get('score') == 1,
                  'chrome_theme_color': audits.get('themed-omnibox', {}).get('score') == 1,
                  'chrome_maskable_icon': audits.get('maskable-icon', {}).get('score') == 1,
                  'chrome_splash_screen': audits.get('splash-screen', {}).get('score') == 1,
                  'lighthouse_pwa_score_100': pwa_score == 1,
              }

              passed = all(checks.values())
              summary['all_pass'] = summary['all_pass'] and passed
              result = {
                  'label': label,
                  'pass': passed,
                  'pwa_score': pwa_score,
                  'checks': checks,
                  'manifest': manifest,
                  'icons': icon_results,
                  'service_worker_headers': {
                      'content_type': last_header(sw_headers, 'content-type'),
                      'cache_control': last_header(sw_headers, 'cache-control'),
                      'service_worker_allowed': last_header(sw_headers, 'service-worker-allowed'),
                  },
                  'lighthouse_audits': {
                      key: {
                          'score': audits.get(key, {}).get('score'),
                          'title': audits.get(key, {}).get('title'),
                          'explanation': audits.get(key, {}).get('explanation'),
                      }
                      for key in ['installable-manifest', 'viewport', 'themed-omnibox', 'maskable-icon', 'splash-screen']
                  },
              }
              summary['sites'][site_id] = result
              (directory / 'validation.json').write_text(json.dumps(result, ensure_ascii=False, indent=2))

          (root / 'summary.json').write_text(json.dumps(summary, ensure_ascii=False, indent=2))
          lines = [
              '# 三站 PWA／手機 App 最終 Chrome 驗證', '',
              '| 站點 | 結果 | PWA 分數 | Manifest＋SW 可安裝 | 192/512 圖示 | Maskable | Viewport | Theme | 安裝入口 |',
              '|---|---:|---:|---:|---:|---:|---:|---:|---:|',
          ]
          for result in summary['sites'].values():
              mark = lambda value: 'PASS' if value else 'FAIL'
              c = result['checks']
              lines.append(
                  f"| {result['label']} | {mark(result['pass'])} | {int((result['pwa_score'] or 0) * 100)} | "
                  f"{mark(c['chrome_installability'])} | {mark(c['icon_192'] and c['icon_512'])} | "
                  f"{mark(c['chrome_maskable_icon'])} | {mark(c['chrome_viewport'])} | "
                  f"{mark(c['chrome_theme_color'])} | {mark(c['install_ui_present'])} |"
              )
          lines += ['', f"總結：{'三站全部通過' if summary['all_pass'] else '仍有未通過項目'}。"]
          (root / 'SUMMARY.md').write_text('\n'.join(lines))
          print('\n'.join(lines))
          if not summary['all_pass']:
              raise SystemExit('One or more PWA sites failed final validation')
          PY

      - name: Upload final browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-pwa-browser-audit-20260826-${{ github.sha }}
          path: pwa-final-audit
          if-no-files-found: error
          retention-days: 14
