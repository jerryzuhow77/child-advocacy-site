name: Fast Qiqi mobile actor proportion refinement

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oneoff-qiqi-mobile-actor-proportion-fast.yml'
      - 'scripts/patch_qiqi_mobile_actor_proportion.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: qiqi-mobile-actor-proportion-20260821
  cancel-in-progress: false

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply mobile actor proportion and motion patch
        run: python3 scripts/patch_qiqi_mobile_actor_proportion.py

      - name: Refresh four-language cache versions
        env:
          QIQI_VERSION_SHA: ${{ github.sha }}
        run: python3 scripts/sync_fujian_qiqi_feature.py

      - name: Validate generated assets
        run: |
          node --check assets/fujian-qiqi-feature.js
          python3 -m py_compile scripts/sync_fujian_qiqi_feature.py scripts/patch_qiqi_mobile_actor_proportion.py
          grep -q 'Mobile actor proportion and motion refinement' assets/fujian-qiqi-feature.css
          grep -q 'Mobile actor proportion and ambient motion' assets/fujian-qiqi-feature.js
          grep -q "version: '1.3.6'" assets/fujian-qiqi-feature.js
          grep -q -- '--fq-actor-proportion: 1.13' assets/fujian-qiqi-feature.css
          for page in \
            historical-cases/regions/mainland-china/fujian-qiqi/index.html \
            zh-hans/historical-cases/regions/mainland-china/fujian-qiqi/index.html \
            en/historical-cases/regions/mainland-china/fujian-qiqi/index.html \
            ja/historical-cases/regions/mainland-china/fujian-qiqi/index.html; do
            grep -q 'fujian-qiqi-feature.css?v=' "$page"
            grep -q 'fujian-qiqi-feature.js?v=' "$page"
          done
          git diff --check

      - name: Commit refined assets and remove one-off files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f -- \
            .github/workflows/oneoff-qiqi-mobile-actor-proportion.yml \
            .github/workflows/oneoff-qiqi-mobile-actor-proportion-fast.yml \
            scripts/patch_qiqi_mobile_actor_proportion.py
          git add -- \
            assets/fujian-qiqi-feature.css \
            assets/fujian-qiqi-feature.js \
            historical-cases/regions/mainland-china/fujian-qiqi/index.html \
            zh-hans/historical-cases/regions/mainland-china/fujian-qiqi/index.html \
            en/historical-cases/regions/mainland-china/fujian-qiqi/index.html \
            ja/historical-cases/regions/mainland-china/fujian-qiqi/index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Normalize Qiqi mobile actor proportions and motion'
          git pull --rebase origin main
          git push
