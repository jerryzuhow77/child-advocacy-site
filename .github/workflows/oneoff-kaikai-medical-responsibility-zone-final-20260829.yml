name: Finalize and verify Kaikai medical responsibility zone

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oneoff-kaikai-medical-responsibility-zone-final-20260829.yml'

permissions:
  contents: write

jobs:
  finalize-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Finalize witness links, cache key, and browser verifier
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin main
          python3 .github/scripts/finalize-kaikai-medical-zone-20260829.py
          node --check hearing-records/prison-watch/kaikai-final-chapter/medical-responsibility/medical-responsibility.js
          node --check .github/scripts/verify-kaikai-medical-responsibility-zone-20260829.mjs
          git diff --check

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hearing-records/prison-watch/kaikai-final-chapter/witnesses/index.html
          git add hearing-records/prison-watch/kaikai-final-chapter/zh-Hans/witnesses/index.html
          git add hearing-records/prison-watch/kaikai-final-chapter/medical-responsibility/index.html
          git add hearing-records/prison-watch/kaikai-final-chapter/medical-responsibility/zh-Hans/index.html
          git add .github/scripts/verify-kaikai-medical-responsibility-zone-20260829.mjs
          if ! git diff --cached --quiet; then
            git commit -m 'Finalize medical responsibility zone navigation and anchor behavior'
            git push origin HEAD:main
          fi

      - name: Wait for the finalized public version
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p browser-validation/medical-responsibility-zone
          pages=(
            'https://jerryzuhow77.github.io/child-advocacy-site/hearing-records/prison-watch/kaikai-final-chapter/medical-responsibility/'
            'https://jerryzuhow77.github.io/child-advocacy-site/hearing-records/prison-watch/kaikai-final-chapter/medical-responsibility/zh-Hans/'
          )
          witnesses=(
            'https://jerryzuhow77.github.io/child-advocacy-site/hearing-records/prison-watch/kaikai-final-chapter/witnesses/'
            'https://jerryzuhow77.github.io/child-advocacy-site/hearing-records/prison-watch/kaikai-final-chapter/zh-Hans/witnesses/'
          )
          witness_phrases=('進入醫療責任釐清專區' '进入医疗责任厘清专区')
          for attempt in $(seq 1 90); do
            ready=1
            for i in 0 1; do
              page_html="$(curl -fsSL --connect-timeout 15 --max-time 30 "${pages[$i]}?qa=${GITHUB_SHA}-${attempt}" || true)"
              witness_html="$(curl -fsSL --connect-timeout 15 --max-time 30 "${witnesses[$i]}?qa=${GITHUB_SHA}-${attempt}" || true)"
              grep -q 'medical-responsibility.js?v=20260829-2' <<<"$page_html" || ready=0
              grep -q 'id="control-yuan"' <<<"$page_html" || ready=0
              grep -q 'id="clinics"' <<<"$page_html" || ready=0
              grep -q "${witness_phrases[$i]}" <<<"$witness_html" || ready=0
            done
            if [[ "$ready" -eq 1 ]]; then
              echo 'Final medical responsibility zone is live in both languages.'
              exit 0
            fi
            sleep 10
          done
          echo 'Timed out before the finalized medical responsibility zone became public.' >&2
          exit 1

      - name: Install Playwright driver
        run: npm install --no-save playwright-core@1.55.0

      - name: Run final Traditional and Simplified desktop and mobile Chrome verification
        run: node .github/scripts/verify-kaikai-medical-responsibility-zone-20260829.mjs

      - name: Upload final browser screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kaikai-medical-responsibility-zone-final-browser-proof
          path: browser-validation/medical-responsibility-zone
          retention-days: 14

      - name: Remove completed one-off tools
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main
          git rm -f .github/workflows/oneoff-kaikai-medical-responsibility-zone-20260829.yml
          git rm -f .github/workflows/oneoff-kaikai-medical-responsibility-zone-final-20260829.yml
          git rm -f .github/scripts/patch-kaikai-medical-responsibility-navigation-20260829.py
          git rm -f .github/scripts/verify-kaikai-medical-responsibility-zone-20260829.mjs
          git rm -f .github/scripts/finalize-kaikai-medical-zone-20260829.py
          git commit -m 'Remove completed medical responsibility publication tools'
          pushed=0
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              pushed=1
              break
            fi
            git pull --rebase origin main
          done
          test "$pushed" -eq 1
