name: Verify current Chapter 2 in Chromium r3

on:
  push:
    branches:
      - qa/browser-verify-chapter2-current-20260829
    paths:
      - .github/workflows/verify-current-chapter2-browser-r3-20260829.yml

permissions:
  contents: write

concurrency:
  group: verify-current-chapter2-browser-r3-20260829
  cancel-in-progress: true

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Verify current production
        env:
          SITE: https://jerryzuhow77.github.io/child-advocacy-site
          CHAPTER: https://jerryzuhow77.github.io/child-advocacy-site/hearing-records/prison-watch/kaikai-final-chapter
          QA_STAMP: 33fdddbca3e7ebede521b63ee1bad1dc10174730
        run: |
          mkdir -p /tmp/chapter2-browser-r3
          node <<'JS'
          const { chromium } = require('playwright');
          const assert = require('node:assert/strict');
          const path = require('node:path');

          const site = process.env.SITE;
          const chapter = process.env.CHAPTER;
          const stamp = process.env.QA_STAMP;
          const screenshots = '/tmp/chapter2-browser-r3';
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
          const pageErrors = [];
          const badResponses = [];
          const failedRequests = [];
          const metrics = [];

          function urlFor(raw, attempt, hash = '') {
            const url = new URL(raw);
            url.searchParams.set('browser-r3', stamp);
            url.searchParams.set('attempt', String(attempt));
            if (hash) url.hash = hash.startsWith('#') ? hash : `#${hash}`;
            return url.href;
          }

          function diagnose(page, label) {
            page.on('pageerror', (error) => pageErrors.push(`${label}: ${error.message}`));
            page.on('response', (response) => {
              if (response.url().startsWith(site) && response.status() >= 400) {
                badResponses.push(`${label}: ${response.status()} ${response.url()}`);
              }
            });
            page.on('requestfailed', (request) => {
              const failure = request.failure()?.errorText || 'unknown';
              if (request.url().startsWith(site) && !/ERR_ABORTED|NS_BINDING_ABORTED/i.test(failure)) {
                failedRequests.push(`${label}: ${failure} ${request.url()}`);
              }
            });
          }

          async function context(browser, mobile) {
            const ctx = await browser.newContext(mobile
              ? { viewport: { width: 390, height: 844 }, isMobile: true, hasTouch: true, deviceScaleFactor: 1, locale: 'zh-TW' }
              : { viewport: { width: 1440, height: 1000 }, deviceScaleFactor: 1, locale: 'zh-TW' });
            await ctx.addInitScript(() => {
              window.__qaCLS = 0;
              try {
                new PerformanceObserver((list) => {
                  for (const entry of list.getEntries()) {
                    if (!entry.hadRecentInput) window.__qaCLS += entry.value;
                  }
                }).observe({ type: 'layout-shift', buffered: true });
              } catch (_) {}
            });
            return ctx;
          }

          async function ready(page, raw, phrase, hash = '') {
            let last = '';
            for (let attempt = 1; attempt <= 24; attempt += 1) {
              const target = urlFor(raw, attempt, hash);
              try {
                const response = await page.goto(target, { waitUntil: 'domcontentloaded', timeout: 45_000 });
                const source = await page.locator('body').textContent({ timeout: 12_000 });
                last = `HTTP ${response?.status()}; ${String(source).slice(0, 150)}`;
                if ((response?.status() === 200 || response?.status() === 0) && source?.includes(phrase)) {
                  await page.waitForTimeout(1_300);
                  return;
                }
              } catch (error) { last = String(error); }
              console.log(`Waiting ${attempt}/24: ${target} :: ${last}`);
              await sleep(5_000);
            }
            throw new Error(`${raw}${hash ? `#${hash}` : ''} not ready: ${last}`);
          }

          async function duplicateIds(page) {
            return page.evaluate(() => {
              const counts = new Map();
              for (const node of document.querySelectorAll('[id]')) counts.set(node.id, (counts.get(node.id) || 0) + 1);
              return [...counts].filter(([, count]) => count > 1);
            });
          }

          async function initialLayout(page, label, maxCLS) {
            const value = await page.evaluate(() => ({
              width: innerWidth,
              scrollWidth: document.documentElement.scrollWidth,
              overflow: document.documentElement.scrollWidth - innerWidth,
              cls: window.__qaCLS || 0,
              h1: document.querySelectorAll('h1').length,
            }));
            metrics.push({ label, phase: 'initial', ...value });
            assert.ok(value.overflow <= 2, `${label}: horizontal overflow ${value.overflow}px`);
            assert.ok(value.cls <= maxCLS, `${label}: initial CLS ${value.cls.toFixed(4)} > ${maxCLS}`);
            assert.ok(value.h1 >= 1, `${label}: missing H1`);
            assert.deepEqual(await duplicateIds(page), [], `${label}: duplicate IDs`);
          }

          async function postScrollLayout(page, label) {
            const value = await page.evaluate(() => ({
              overflow: document.documentElement.scrollWidth - innerWidth,
              cls: window.__qaCLS || 0,
            }));
            metrics.push({ label, phase: 'after-scroll', ...value });
            assert.ok(value.overflow <= 2, `${label}: post-scroll horizontal overflow ${value.overflow}px`);
            assert.deepEqual(await duplicateIds(page), [], `${label}: duplicate IDs after scroll`);
          }

          async function viewportBrokenImages(page, label) {
            const broken = await page.locator('img').evaluateAll((nodes) => nodes.filter((node) => {
              const rect = node.getBoundingClientRect();
              const inViewport = rect.bottom > 0 && rect.top < innerHeight && rect.right > 0 && rect.left < innerWidth;
              return inViewport && node.complete && node.naturalWidth === 0;
            }).map((node) => node.currentSrc || node.src));
            assert.deepEqual(broken, [], `${label}: broken viewport images ${JSON.stringify(broken)}`);
          }

          async function homepage(browser, mobile) {
            const ctx = await context(browser, mobile);
            const page = await ctx.newPage();
            const label = `homepage-${mobile ? 'mobile' : 'desktop'}`;
            diagnose(page, label);
            await ready(page, `${site}/`, '第二章');
            await page.waitForTimeout(6_500);
            await initialLayout(page, label, mobile ? 0.35 : 0.30);
            const links = page.locator('a[href*="kaikai-final-chapter"]:visible');
            assert.ok(await links.count() >= 1, `${label}: no visible Chapter 2 entry`);
            const entries = await links.evaluateAll((nodes) => nodes.map((node) => ({ text: node.innerText.trim(), href: node.href })));
            assert.ok(entries.some((entry) => /第二章|沒人要的孩子|证据|制度|醫療|监护/.test(entry.text)), `${label}: unlabelled Chapter 2 links ${JSON.stringify(entries)}`);
            await viewportBrokenImages(page, label);
            await page.screenshot({ path: path.join(screenshots, `${label}.png`), fullPage: false });
            await ctx.close();
          }

          async function mainPage(browser, urlPath, hans, mobile) {
            const ctx = await context(browser, mobile);
            const page = await ctx.newPage();
            const label = `chapter-${hans ? 'hans' : 'hant'}-${mobile ? 'mobile' : 'desktop'}`;
            diagnose(page, label);
            await ready(page, `${chapter}${urlPath}`, hans ? '监察院报告必须是整页最醒目的官方主轴' : '監察院報告必須是整頁最醒目的官方主軸');
            await page.waitForTimeout(6_500);
            await initialLayout(page, label, mobile ? 0.38 : 0.32);

            assert.equal(await page.locator('#control-yuan .finding-card').count(), 4, `${label}: Control Yuan cards`);
            assert.equal(await page.locator('#emergency .temperature-card').count(), 1, `${label}: 24°C card`);
            assert.equal(await page.locator('#emergency .temperature-limits').count(), 1, `${label}: temperature limits`);
            assert.equal(await page.locator('#closed-loop .closed-loop>li').count(), 7, `${label}: seven-step closed loop`);
            assert.equal(await page.locator('#institutional-failures .institution-card').count(), 5, `${label}: institution cards`);
            assert.equal(await page.locator('#institutional-failures .deficiency-list>li').count(), 7, `${label}: deficiency cards`);
            assert.equal(await page.locator('#restraint-boundary .restraint-levels>li').count(), 5, `${label}: restraint levels`);
            assert.equal(await page.locator('#siteNav summary').filter({ hasText: hans ? '医疗专题' : '醫療專題' }).count(), 0, `${label}: medical topic remains in main menu`);
            assert.ok(await page.locator('#siteNav a').filter({ hasText: hans ? '12名证人全文' : '12名證人全文' }).count() >= 1, `${label}: 12-witness entry missing`);

            const source = (await page.locator('body').textContent()) || '';
            assert.ok(!source.includes(hans ? '完整医疗子页仍保留' : '完整醫療子頁仍保留'), `${label}: removed reminder remains`);

            const restraintNode = page.locator('#restraint-boundary');
            await restraintNode.scrollIntoViewIfNeeded();
            await page.waitForTimeout(350);
            const restraint = (await restraintNode.textContent()) || '';
            assert.ok(restraint.includes(hans ? '二审检方已勘验照片' : '二審檢方已勘驗照片'), `${label}: second-instance photo inspection missing`);
            assert.ok(restraint.includes(hans
              ? '尚未找到足以把“反折、用束带扣住私处、绑在便盆”整句列为法院已认定单一事实'
              : '尚未找到足以把「反折、用束帶扣住私處、綁在便盆」整句列為法院已認定單一事實'), `${label}: evidence boundary missing`);
            await viewportBrokenImages(page, `${label}-restraint`);
            await page.screenshot({ path: path.join(screenshots, `${label}-restraint.png`), fullPage: false });

            for (const selector of ['#control-yuan', '#emergency', '#closed-loop', '#institutional-failures']) {
              await page.locator(selector).scrollIntoViewIfNeeded();
              await page.waitForTimeout(250);
              await viewportBrokenImages(page, `${label}-${selector}`);
            }
            await postScrollLayout(page, label);
            await page.locator('#control-yuan').scrollIntoViewIfNeeded();
            await page.screenshot({ path: path.join(screenshots, `${label}-control-yuan.png`), fullPage: false });
            await ctx.close();
          }

          async function anchor(browser, urlPath, id, mobile) {
            const ctx = await context(browser, mobile);
            const page = await ctx.newPage();
            const label = `anchor-${urlPath.includes('zh-Hans') ? 'hans' : 'hant'}-${id}-${mobile ? 'mobile' : 'desktop'}`;
            diagnose(page, label);
            await ready(page, `${chapter}${urlPath}`, '第二章', id);
            await page.waitForTimeout(3_200);
            const state = await page.evaluate((targetId) => {
              const target = document.getElementById(targetId);
              if (!target) return { found: false };
              const expected = parseFloat(getComputedStyle(document.documentElement).scrollPaddingTop) || 0;
              const actual = target.getBoundingClientRect().top;
              return { found: true, expected, actual, difference: Math.abs(actual - expected), hash: location.hash };
            }, id);
            assert.equal(state.found, true, `${label}: missing target`);
            assert.equal(state.hash, `#${id}`, `${label}: hash changed`);
            assert.ok(state.difference <= (mobile ? 72 : 58), `${label}: anchor mismatch ${JSON.stringify(state)}`);
            await ctx.close();
          }

          async function witnesses(browser, urlPath, hans) {
            const ctx = await context(browser, true);
            const page = await ctx.newPage();
            const label = `witnesses-${hans ? 'hans' : 'hant'}-mobile`;
            diagnose(page, label);
            await ready(page, `${chapter}${urlPath}`, hans ? '12名证人，不是12座孤岛' : '12名證人，不是12座孤島');
            await page.waitForTimeout(2_000);
            assert.equal(await page.locator('[data-witness-card]').count(), 12);
            assert.equal(await page.locator('#witnessQuickNav>a').count(), 12);
            assert.equal(await page.locator('#witness-10.moved-witness-card').count(), 1);
            assert.equal(await page.locator('article.witness-card#witness-10').count(), 0);
            assert.deepEqual(await Promise.all(['11','12','13'].map(async (id) => (await page.locator(`#witness-${id} .witness-number`).innerText()).trim())), ['10','11','12']);
            await page.locator('#witnessSearch').fill('林心慈');
            await page.waitForTimeout(300);
            assert.equal(await page.locator('#witness-11').isVisible(), true);
            assert.ok(await page.locator('[data-witness-card]:visible').count() >= 1);
            await page.locator('#witnessSearch').fill('');
            await initialLayout(page, label, 0.32);
            await page.screenshot({ path: path.join(screenshots, `${label}.png`), fullPage: false });
            await ctx.close();
          }

          async function medical(browser, urlPath, hans, mobile) {
            const ctx = await context(browser, mobile);
            const page = await ctx.newPage();
            const label = `medical-${hans ? 'hans' : 'hant'}-${mobile ? 'mobile' : 'desktop'}`;
            diagnose(page, label);
            await ready(page, `${chapter}${urlPath}`, hans ? '蔡函妤牙医证词：完整全文正式移入医疗专题' : '蔡函妤牙醫證詞：完整全文正式移入醫療專題');
            await page.waitForTimeout(2_000);
            await initialLayout(page, `${label}-initial`, 0.35);
            assert.equal(await page.locator('#clinics').count(), 1);
            assert.equal(await page.locator('#cai-hanyu-full').count(), 1);
            assert.equal(await page.locator('#cai-hanyu-transcript').count(), 1);
            assert.ok(await page.locator('#cai-hanyu-full .transcript-line').count() > 30);
            assert.equal(await page.locator('.main-section-relocation').count(), 3);
            assert.equal(await page.locator('section#control-yuan,section#emergency,section#closed-loop').count(), 0);
            const source = (await page.locator('body').textContent()) || '';
            assert.ok(source.includes(hans ? '兴隆内科小儿科诊所' : '興隆內科小兒科診所'));
            assert.ok(source.includes(hans ? '采新牙医诊所' : '采新牙醫診所'));
            assert.ok(!source.includes(hans ? '完整医疗子页仍保留' : '完整醫療子頁仍保留'));
            await page.locator('#cai-hanyu').scrollIntoViewIfNeeded();
            await page.locator('#cai-hanyu-transcript>summary').click();
            assert.equal(await page.locator('#cai-hanyu-transcript').getAttribute('open'), '');
            assert.ok(await page.locator('#cai-hanyu-transcript [data-copy-transcript]').count() >= 1);
            await postScrollLayout(page, label);
            await page.screenshot({ path: path.join(screenshots, `${label}-cai.png`), fullPage: false });
            await ctx.close();
          }

          async function legacy(browser, hash, expected) {
            const ctx = await context(browser, true);
            const page = await ctx.newPage();
            const label = `legacy-${hash}`;
            diagnose(page, label);
            await page.goto(urlFor(`${chapter}/`, 1, hash), { waitUntil: 'domcontentloaded', timeout: 45_000 });
            if (expected === 'main') {
              await page.waitForTimeout(1_400);
              const current = new URL(page.url());
              assert.ok(current.pathname.endsWith('/kaikai-final-chapter/'));
              assert.equal(current.hash, `#${hash}`);
            } else if (expected === 'dental') {
              await page.waitForURL((url) => url.pathname.includes('/medical-responsibility/') && url.hash === '#dental-warning', { timeout: 20_000 });
            } else {
              await page.waitForURL((url) => url.pathname.endsWith('/medical-responsibility/') && !url.hash, { timeout: 20_000 });
            }
            await ctx.close();
          }

          (async () => {
            const browser = await chromium.launch({ headless: true });
            await homepage(browser, false);
            await homepage(browser, true);
            await mainPage(browser, '/', false, false);
            await mainPage(browser, '/', false, true);
            await mainPage(browser, '/zh-Hans/', true, false);
            await mainPage(browser, '/zh-Hans/', true, true);
            for (const id of ['control-yuan','emergency','closed-loop','institutional-failures','restraint-boundary']) {
              await anchor(browser, '/', id, false);
              await anchor(browser, '/', id, true);
              await anchor(browser, '/zh-Hans/', id, true);
            }
            await witnesses(browser, '/witnesses/', false);
            await witnesses(browser, '/zh-Hans/witnesses/', true);
            await medical(browser, '/medical-responsibility/', false, false);
            await medical(browser, '/medical-responsibility/', false, true);
            await medical(browser, '/medical-responsibility/zh-Hans/', true, false);
            await medical(browser, '/medical-responsibility/zh-Hans/', true, true);
            await legacy(browser, 'death-temperature-evidence', 'main');
            await legacy(browser, 'medical-network-omissions', 'main');
            await legacy(browser, 'dental-warning', 'dental');
            await legacy(browser, 'medical-special-topic', 'topic');
            await browser.close();
            console.log('METRICS', JSON.stringify(metrics, null, 2));
            assert.deepEqual(pageErrors, [], `Browser page errors:\n${pageErrors.join('\n')}`);
            assert.deepEqual(badResponses, [], `Same-origin HTTP failures:\n${badResponses.join('\n')}`);
            assert.deepEqual(failedRequests, [], `Same-origin request failures:\n${failedRequests.join('\n')}`);
            console.log('BROWSER VERIFICATION PASSED: homepage entry, Traditional/Simplified desktop/mobile Chapter 2, direct anchors, official evidence sections, 12-witness page, full Cai Hanyu medical page, legacy hashes, images, overflow, initial CLS, page errors and same-origin requests.');
          })().catch((error) => {
            console.error(error);
            console.error('METRICS', JSON.stringify(metrics, null, 2));
            console.error('Page errors', pageErrors);
            console.error('Bad responses', badResponses);
            console.error('Request failures', failedRequests);
            process.exit(1);
          });
          JS

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chapter2-browser-r3-${{ github.run_id }}
          path: /tmp/chapter2-browser-r3
          if-no-files-found: warn
          retention-days: 7

      - name: Delete QA branch
        if: success()
        shell: bash
        run: |
          git init /tmp/cleanup
          cd /tmp/cleanup
          git remote add origin https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
          git push origin --delete qa/browser-verify-chapter2-current-20260829
