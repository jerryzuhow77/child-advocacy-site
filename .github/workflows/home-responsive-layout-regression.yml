name: Home responsive layout regression

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'en/index.html'
      - 'ja/index.html'
      - 'data/four-language-routes.json'
      - '.github/workflows/four-language-qa.yml'
      - 'assets/**'
      - '.github/scripts/verify-home-responsive-layout.mjs'
      - '.github/scripts/test-home-language-links.py'
      - '.github/workflows/home-responsive-layout-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  responsive-layout:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright-core@1.55.0
      - name: Install Chinese and Japanese fonts for visual verification
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk
      - name: Verify hearing time qualifiers
        run: |
          python3 scripts/verify-jiajia-hearing-qualifiers.py
      - name: Verify explicit homepage language links and synchronization
        run: python3 .github/scripts/test-home-language-links.py -v
      - name: Check homepage JavaScript syntax
        run: |
          node .github/scripts/verify-home-locale-parity.mjs
          node .github/scripts/test-four-language-cross-origin-routing.mjs
          node --check assets/home-feed-integrity-20260911.js
          node --check assets/home-responsive-unification-20260909.js
          node --check assets/home-media-reports-gsap-20260909.js
          node --check assets/home-gsap-base-20260823.js
          node --check assets/home-autumn-motion-20260908.js
          node --check assets/home-post-engagement-20260826.js
          node --check .github/scripts/verify-home-responsive-layout.mjs
      - name: Verify homepage at six responsive widths
        env:
          BASE_URL: http://127.0.0.1:8765/
          CHROME_PATH: /usr/bin/google-chrome
        run: |
          node .github/scripts/verify-home-responsive-layout.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: home-responsive-layout
          path: browser-validation/home-responsive-layout/
          retention-days: 14
          if-no-files-found: error
