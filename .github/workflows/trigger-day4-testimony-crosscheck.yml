name: Trigger Day 4 testimony cross-check

on:
  push:
    branches: [main]
    paths:
      - '.github/day4-crosscheck-trigger.txt'

permissions:
  contents: write

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Touch cross-check workflow
        run: |
          set -euo pipefail
          git pull --rebase origin main
          printf '\n# triggered by %s\n' "${GITHUB_SHA}" >> .github/workflows/oneoff-day4-testimony-crosscheck.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/oneoff-day4-testimony-crosscheck.yml
          git commit -m 'Trigger Day 4 testimony cross-check update'
          git pull --rebase origin main
          git push
