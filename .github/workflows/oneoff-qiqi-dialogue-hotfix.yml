name: Enable Fujian Qiqi dialogue hotfix
on:
  push:
    branches: [main]
    paths: ['.github/workflows/oneoff-qiqi-dialogue-hotfix.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Attach hotfix stylesheet and bust cache
        run: |
          python - <<'PY'
          from pathlib import Path
          paths=[Path('historical-cases/regions/mainland-china/fujian-qiqi/index.html'),Path('en/historical-cases/regions/mainland-china/fujian-qiqi/index.html'),Path('ja/historical-cases/regions/mainland-china/fujian-qiqi/index.html')]
          for p in paths:
            if not p.exists(): continue
            s=p.read_text(encoding='utf-8')
            href='../../../../assets/fujian-qiqi-dialogue-hotfix.css?v=20260821-1'
            tag=f'  <link rel="stylesheet" href="{href}">\n'
            if 'fujian-qiqi-dialogue-hotfix.css' not in s: s=s.replace('</head>',tag+'</head>',1)
            p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add historical-cases/regions/mainland-china/fujian-qiqi/index.html en/historical-cases/regions/mainland-china/fujian-qiqi/index.html ja/historical-cases/regions/mainland-china/fujian-qiqi/index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Ensure Fujian Qiqi theatre dialogue remains visible'
          git push
