name: Final Kaikai live browser validation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oneoff-kaikai-browser-validation-final-20260829.yml'

permissions:
  contents: read

jobs:
  browser-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install Playwright driver
        run: npm install --no-save playwright-core@1.55.0

      - name: Validate public site in Google Chrome
        run: node scripts/validate-kaikai-browser-final-20260829.mjs

      - name: Upload screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kaikai-final-live-browser-validation
          path: browser-validation/artifacts
          retention-days: 14