name: Final live verification for expanded Kaikai out-of-home care section

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oneoff-kaikai-out-of-home-care-final-verify-20260829.yml'

permissions:
  contents: write

jobs:
  verify-and-clean:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Confirm the expanded source remains on current main
        shell: bash
        run: |
          set -euo pipefail
          for page in \
            hearing-records/prison-watch/kaikai-final-chapter/index.html \
            hearing-records/prison-watch/kaikai-final-chapter/zh-Hans/index.html; do
            grep -q 'id="placement-state-duty"' "$page"
            grep -q 'id="placement-failures"' "$page"
            grep -q 'id="placement-harm-cases"' "$page"
            test "$(grep -o 'class="placement-harm-card' "$page" | wc -l)" -eq 4
            test "$(grep -o 'class="placement-data-grid"' "$page" | wc -l)" -eq 2
            grep -q 'href="#placement-harm-cases"' "$page"
          done
          grep -q 'OUT-OF-HOME-CARE-FAILURES-20260829' hearing-records/prison-watch/kaikai-final-chapter/final-chapter.css
          node --check .github/scripts/verify-kaikai-out-of-home-care-20260829.mjs

      - name: Wait for any current public deployment containing the expansion
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p browser-validation/out-of-home-care
          pages=(
            'https://jerryzuhow77.github.io/child-advocacy-site/hearing-records/prison-watch/kaikai-final-chapter/'
            'https://jerryzuhow77.github.io/child-advocacy-site/hearing-records/prison-watch/kaikai-final-chapter/zh-Hans/'
          )
          css_url='https://jerryzuhow77.github.io/child-advocacy-site/hearing-records/prison-watch/kaikai-final-chapter/final-chapter.css'
          for attempt in $(seq 1 120); do
            ready=1
            for i in 0 1; do
              token="${GITHUB_SHA}-${attempt}-${i}"
              html="$(curl -fsSL --connect-timeout 15 --max-time 30 "${pages[$i]}?qa=${token}" || true)"
              grep -q 'id="placement-state-duty"' <<<"$html" || ready=0
              grep -q 'id="placement-failures"' <<<"$html" || ready=0
              grep -q 'id="placement-harm-cases"' <<<"$html" || ready=0
              grep -q 'href="#placement-harm-cases"' <<<"$html" || ready=0
            done
            css="$(curl -fsSL --connect-timeout 15 --max-time 30 "${css_url}?qa=${GITHUB_SHA}-${attempt}" || true)"
            grep -q 'OUT-OF-HOME-CARE-FAILURES-20260829' <<<"$css" || ready=0
            if [[ "$ready" -eq 1 ]]; then
              echo 'Expanded out-of-home care content is live in both languages.'
              exit 0
            fi
            sleep 10
          done
          echo 'Timed out before a public deployment exposed the expanded section.' >&2
          exit 1

      - name: Install Playwright driver
        run: npm install --no-save playwright-core@1.55.0

      - name: Verify Traditional and Simplified desktop and mobile Chrome layouts
        run: node .github/scripts/verify-kaikai-out-of-home-care-20260829.mjs

      - name: Upload final browser screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kaikai-out-of-home-care-final-browser-proof
          path: browser-validation/out-of-home-care
          retention-days: 14

      - name: Remove completed one-off files
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main
          git rm -f .github/workflows/oneoff-kaikai-out-of-home-care-20260829.yml
          git rm -f .github/workflows/oneoff-kaikai-out-of-home-care-final-verify-20260829.yml
          git rm -f .github/scripts/patch-kaikai-out-of-home-care-20260829.py
          git rm -f .github/scripts/verify-kaikai-out-of-home-care-20260829.mjs
          git commit -m 'Remove completed out-of-home care publication tools'
          pushed=0
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              pushed=1
              break
            fi
            git pull --rebase origin main
          done
          test "$pushed" -eq 1
