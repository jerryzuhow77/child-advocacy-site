name: Diagnose HK local wall API safely
on:
  push:
    branches: [main]
    paths: ['.github/workflows/oneoff-restore-hk-local-wall-api-safely.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      K: ${{ secrets.TENCENT_SSH_PRIVATE_KEY }}
    steps:
      - run: |
          set -Eeuo pipefail; test -n "$K"; umask 077; mkdir -p ~/.ssh
          printf '%s\n' "$K" > ~/.ssh/key; chmod 600 ~/.ssh/key
          ssh-keyscan 150.109.69.104 > ~/.ssh/known_hosts
      - name: Inspect services and loopback APIs
        run: |
          ssh -i ~/.ssh/key ubuntu@150.109.69.104 'sudo bash -s' <<'REMOTE'
          set -u
          for unit in global-protection.service global-protection-hk.service; do
            echo "SERVICE=$unit"
            systemctl show "$unit" --property=LoadState,ActiveState,SubState,FragmentPath,WorkingDirectory,User,ExecStart --no-pager || true
          done
          echo LISTENERS
          ss -ltnp | grep -E ':(8787|8788|8790|3000|4173)[[:space:]]' || true
          for port in 8787 8788 8790 3000 4173; do
            out=$(curl -sS --max-time 4 "http://127.0.0.1:$port/api/public/submission-stats" 2>/dev/null || true)
            PORT="$port" BODY="$out" python3 - <<'PY'
          import json,os
          try:
           d=json.loads(os.environ["BODY"]); print("PORT="+os.environ["PORT"],"scope="+str(d.get("scope")),"total="+str(d.get("total")),"pending="+str(d.get("pending")),"published="+str(d.get("published")))
          except: pass
          PY
          done
          REMOTE
