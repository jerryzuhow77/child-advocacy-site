name: Apply Kaikai witness publication XZ 20260829

on:
  push:
    branches:
      - feat/kaikai-witness-analysis-20260829
    paths:
      - .tmp/kaikai-publish-xz.ready

permissions:
  contents: write

concurrency:
  group: apply-kaikai-witness-publication-xz-20260829
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out prepared feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and verify prepared package
        shell: bash
        run: |
          set -euo pipefail
          package=/tmp/kaikai-publish-compact.tar.xz
          cat .tmp/kaikai-publish-xz.[0-9][0-9][0-9].b64 | base64 --decode > "$package"
          echo "20fb08156b1bc8aa4f653ebab7ef4dd809a26e6921181005d4343bc6eb2b67e8  $package" | sha256sum -c -
          xz -t "$package"
          tar -tJf "$package" | sed -n '1,80p'

      - name: Build, validate, commit and publish on latest main
        shell: bash
        run: |
          set -euo pipefail
          package=/tmp/kaikai-publish-compact.tar.xz
          chapter='hearing-records/prison-watch/kaikai-final-chapter'

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          validate_publication() {
            git diff --check
            node --check "$chapter/final-chapter.js"
            node --check "$chapter/witnesses/witnesses.js"

            test "$(grep -o 'data-witness-card' "$chapter/witnesses/index.html" | wc -l | tr -d ' ')" = '13'
            test "$(grep -o 'data-witness-card' "$chapter/zh-Hans/witnesses/index.html" | wc -l | tr -d ' ')" = '13'
            test "$(grep -o 'class="issue-row"' "$chapter/witnesses/index.html" | wc -l | tr -d ' ')" = '13'
            test "$(grep -o 'class="issue-row"' "$chapter/zh-Hans/witnesses/index.html" | wc -l | tr -d ' ')" = '13'

            grep -q '13名證人全文' "$chapter/index.html"
            grep -q '13名证人全文' "$chapter/zh-Hans/index.html"
            grep -q 'WITNESS-DEEP-DIVE-20260829' "$chapter/index.html"
            grep -q 'WITNESS-DEEP-DIVE-20260829' "$chapter/zh-Hans/index.html"
            grep -q 'WITNESS-ANCHOR-CORRECTION-20260829' "$chapter/final-chapter.js"
            grep -q 'html{scroll-padding-top:var(--chapter-anchor-offset)}' "$chapter/final-chapter.css"
            grep -q 'RELATIONSHIP-TREE-REFRESH-20260829' "$chapter/index.html"
            grep -q '法院並未公開官方逐字稿' "$chapter/witnesses/index.html"
            grep -q '法院并未公开官方逐字稿' "$chapter/zh-Hans/witnesses/index.html"
            grep -q '束帶直接扣住私處並綁在便盆' "$chapter/witnesses/index.html"
            grep -q '尚未把「束帶直接扣住私處並綁在便盆」寫成一個完整、已認定的單一事實' "$chapter/witnesses/index.html"
            grep -q '/kaikai-final-chapter/witnesses/' sitemap.xml
            grep -q '/kaikai-final-chapter/zh-Hans/witnesses/' sitemap.xml

            python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          root = Path('hearing-records/prison-watch/kaikai-final-chapter')
          pages = (
              root / 'witnesses/index.html',
              root / 'zh-Hans/witnesses/index.html',
          )

          class IdParser(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.ids = []

              def handle_starttag(self, tag, attrs):
                  for key, value in attrs:
                      if key == 'id' and value:
                          self.ids.append(value)

          for page in pages:
              parser = IdParser()
              parser.feed(page.read_text(encoding='utf-8'))
              duplicates = sorted({value for value in parser.ids if parser.ids.count(value) > 1})
              if duplicates:
                  raise SystemExit(f'{page}: duplicate ids: {duplicates}')
              for required in ('contradiction-matrix', 'binding-evidence', 'witness-01', 'witness-13'):
                  if required not in parser.ids:
                      raise SystemExit(f'{page}: missing #{required}')

          image_path = Path('assets/art/kaikai-dual-track-responsibility-tree-zh-Hant-20260829.webp')
          image = image_path.read_bytes()
          if len(image) < 50_000 or image[:4] != b'RIFF' or image[8:12] != b'WEBP':
              raise SystemExit(f'{image_path}: invalid or unexpectedly small WebP')
          print('Static Kaikai publication validation passed.')
          PY
          }

          publication_present() {
            grep -q 'WITNESS-DEEP-DIVE-20260829' "$chapter/index.html" 2>/dev/null \
              && grep -q 'WITNESS-ANCHOR-CORRECTION-20260829' "$chapter/final-chapter.js" 2>/dev/null \
              && test -s "$chapter/witnesses/index.html" \
              && test -s "$chapter/zh-Hans/witnesses/index.html" \
              && test -s assets/art/kaikai-dual-track-responsibility-tree-zh-Hant-20260829.webp
          }

          build_commit() {
            git fetch origin main
            git reset --hard origin/main

            if publication_present; then
              echo 'Kaikai witness publication is already present on latest main.'
              validate_publication
              return 2
            fi

            tar -xJf "$package" -C .
            test -s main.patch
            patch --batch --forward -p1 < main.patch
            rm -f main.patch

            validate_publication

            test ! -e .tmp/kaikai-publish-xz.000.b64
            test ! -e .github/workflows/apply-kaikai-witness-publication-xz-20260829.yml
            test ! -e .github/workflows/apply-kaikai-witness-publication-20260829.yml

            git add -A
            if git diff --cached --quiet; then
              echo 'No public changes remain to commit.'
              return 2
            fi
            git commit -m 'Publish Kaikai witness evidence atlas and anchor fix'
          }

          for attempt in 1 2 3 4 5; do
            set +e
            build_commit
            status=$?
            set -e

            if [ "$status" -eq 2 ]; then
              exit 0
            fi
            if [ "$status" -ne 0 ]; then
              echo "Failed to build the publication commit on attempt $attempt." >&2
              exit "$status"
            fi

            if git push origin HEAD:main; then
              echo 'Published Kaikai witness analysis to main.'
              exit 0
            fi

            echo "Main advanced while publishing; rebuilding on latest main (attempt $attempt)."
          done

          echo 'Unable to publish after five safe retries.' >&2
          exit 1
