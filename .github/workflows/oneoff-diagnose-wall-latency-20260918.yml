name: Recover guardian wall service

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oneoff-diagnose-wall-latency-20260918.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      HK_HOST: ${{ secrets.TENCENT_SSH_HOST }}
      HK_USER: ${{ secrets.TENCENT_SSH_USER }}
      HK_PORT: ${{ secrets.TENCENT_SSH_PORT }}
      HK_KEY_A: ${{ secrets.TENCENT_SSH_PRIVATE_KEY }}
      HK_KEY_B: ${{ secrets.TENCENT_CVM_SSH_KEY }}
      HK_KEY_C: ${{ secrets.SSH_PRIVATE_KEY }}
    steps:
      - name: Configure SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          host="${HK_HOST:-150.109.69.104}"
          user="${HK_USER:-ubuntu}"
          port="${HK_PORT:-22}"
          key="${HK_KEY_A:-${HK_KEY_B:-${HK_KEY_C:-}}}"
          test -n "$key"
          mkdir -p ~/.ssh
          printf '%s\n' "$key" > ~/.ssh/hk_key
          chmod 600 ~/.ssh/hk_key
          ssh-keyscan -p "$port" "$host" > ~/.ssh/known_hosts
          printf 'HOST=%s\nUSER=%s\nPORT=%s\n' "$host" "$user" "$port" >> "$GITHUB_ENV"

      - name: Restart guardian wall service and verify public APIs
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/hk_key -p "$PORT" "$USER@$HOST" 'sudo systemctl restart global-protection.service && sudo systemctl is-active global-protection.service'
          for path in /api/public/messages?limit=1 /api/public/submission-stats /api/public/view-count; do
            code="$(curl --silent --show-error --max-time 20 --output /dev/null --write-out '%{http_code}' "https://cn.globalprotectionwall.com$path")"
            test "$code" = 200
            echo "$path $code"
          done
