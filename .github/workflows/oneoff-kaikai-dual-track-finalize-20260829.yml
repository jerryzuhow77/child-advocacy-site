name: Finalize and verify bilingual dual-track responsibility layout

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oneoff-kaikai-dual-track-finalize-20260829.yml'

permissions:
  contents: write

jobs:
  finalize-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Correct Simplified-page asset depth
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin main
          python3 - <<'PY'
          from pathlib import Path

          path = Path('hearing-records/prison-watch/kaikai-final-chapter/zh-Hans/index.html')
          text = path.read_text(encoding='utf-8')
          assets = [
              'kaikai-dual-track-responsibility-tree-zh-Hans-20260829.webp',
              'kaikai-dual-track-responsibility-tree-zh-Hant-20260829.webp',
          ]
          expected = {
              assets[0]: 3,
              assets[1]: 1,
          }
          for filename in assets:
              old = f'../../../assets/art/{filename}'
              new = f'../../../../assets/art/{filename}'
              count = text.count(old)
              if count != expected[filename]:
                  raise SystemExit(f'{filename}: expected {expected[filename]} old paths, found {count}')
              text = text.replace(old, new)
          if text.count('../../../../assets/art/kaikai-dual-track-responsibility-tree-zh-Hans-20260829.webp') != 3:
              raise SystemExit('Simplified image paths were not corrected')
          path.write_text(text, encoding='utf-8')
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hearing-records/prison-watch/kaikai-final-chapter/zh-Hans/index.html
          git commit -m 'Fix Simplified dual-track poster asset paths'
          git push origin HEAD:main

      - name: Wait for corrected public pages and assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p browser-validation/dual-track-pair-final
          hant='https://jerryzuhow77.github.io/child-advocacy-site/hearing-records/prison-watch/kaikai-final-chapter/'
          hans='https://jerryzuhow77.github.io/child-advocacy-site/hearing-records/prison-watch/kaikai-final-chapter/zh-Hans/'
          assets=(
            'https://jerryzuhow77.github.io/child-advocacy-site/assets/art/kaikai-dual-track-responsibility-tree-zh-Hant-20260829.webp'
            'https://jerryzuhow77.github.io/child-advocacy-site/assets/art/kaikai-dual-track-responsibility-tree-zh-Hans-20260829.webp'
          )
          for attempt in $(seq 1 90); do
            ready=1
            hant_html="$(curl -fsSL --connect-timeout 15 --max-time 30 "${hant}?qa=${GITHUB_SHA}-${attempt}" || true)"
            hans_html="$(curl -fsSL --connect-timeout 15 --max-time 30 "${hans}?qa=${GITHUB_SHA}-${attempt}" || true)"
            grep -q 'class="responsibility-tree-pair"' <<<"$hant_html" || ready=0
            grep -q 'class="responsibility-tree-pair"' <<<"$hans_html" || ready=0
            grep -q '../../../assets/art/kaikai-dual-track-responsibility-tree-zh-Hant-20260829.webp' <<<"$hant_html" || ready=0
            grep -q '../../../../assets/art/kaikai-dual-track-responsibility-tree-zh-Hans-20260829.webp' <<<"$hans_html" || ready=0
            grep -q 'final-chapter.css?v=20260829-24' <<<"$hant_html" || ready=0
            grep -q 'final-chapter.css?v=20260829-24' <<<"$hans_html" || ready=0
            for i in 0 1; do
              headers="browser-validation/dual-track-pair-final/asset-${i}.headers"
              curl -fsSI --connect-timeout 15 --max-time 30 "${assets[$i]}?qa=${GITHUB_SHA}-${attempt}" -o "$headers" || ready=0
              grep -Eqi '^content-type: *image/webp' "$headers" || ready=0
            done
            [[ "$ready" -eq 1 ]] && exit 0
            sleep 10
          done
          echo 'Corrected bilingual responsibility layout was not observable in time.' >&2
          exit 1

      - name: Make lazy-image verification scroll-aware
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/scripts/verify-kaikai-dual-track-pair-20260829.mjs')
          text = path.read_text(encoding='utf-8')
          old = """    await page.waitForSelector('#system .responsibility-tree-pair', { state: 'visible', timeout: 15000 });
    await page.waitForFunction(() => {
      const image = document.querySelector('#system .responsibility-tree-visual img');
"""
          new = """    await page.waitForSelector('#system .responsibility-tree-pair', { state: 'visible', timeout: 15000 });
    await page.locator('#system .responsibility-tree-visual img').scrollIntoViewIfNeeded();
    await page.waitForFunction(() => {
      const image = document.querySelector('#system .responsibility-tree-visual img');
"""
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Expected one lazy-image verifier block, found {count}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          node --check .github/scripts/verify-kaikai-dual-track-pair-20260829.mjs

      - name: Install Playwright driver
        run: npm install --no-save playwright-core@1.55.0

      - name: Verify Traditional and Simplified desktop and mobile Chrome layouts
        run: node .github/scripts/verify-kaikai-dual-track-pair-20260829.mjs

      - name: Upload final browser proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kaikai-dual-track-pair-final-browser-proof
          path: browser-validation/dual-track-pair
          retention-days: 14

      - name: Remove completed one-off tools
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main
          git rm -f .github/workflows/oneoff-kaikai-dual-track-pair-20260829.yml
          git rm -f .github/workflows/oneoff-kaikai-dual-track-pair-v2-20260829.yml
          git rm -f .github/workflows/oneoff-kaikai-dual-track-finalize-20260829.yml
          git rm -f .github/scripts/render-kaikai-dual-track-hans-20260829.py
          git rm -f .github/scripts/place-kaikai-dual-track-poster-20260829.py
          git rm -f .github/scripts/prepare-kaikai-dual-track-source-20260829.py
          git rm -f .github/scripts/verify-kaikai-dual-track-pair-20260829.mjs
          git commit -m 'Remove completed dual-track responsibility publication tools'
          pushed=0
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              pushed=1
              break
            fi
            git pull --rebase origin main
          done
          test "$pushed" -eq 1
