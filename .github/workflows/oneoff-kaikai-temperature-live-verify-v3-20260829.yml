name: Final live validation for Kaikai 24C evidence

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oneoff-kaikai-temperature-live-verify-v3-20260829.yml'

permissions:
  contents: write

jobs:
  live-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Poll GitHub Pages for content and corrected script
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p browser-validation/temperature-evidence-v3
          urls=(
            'https://jerryzuhow77.github.io/child-advocacy-site/hearing-records/prison-watch/kaikai-final-chapter/'
            'https://jerryzuhow77.github.io/child-advocacy-site/hearing-records/prison-watch/kaikai-final-chapter/zh-Hans/'
          )
          for attempt in $(seq 1 60); do
            ready=1
            index=0
            for url in "${urls[@]}"; do
              index=$((index + 1))
              file="browser-validation/temperature-evidence-v3/page-${index}.html"
              curl -fsSL --connect-timeout 15 --max-time 30 "${url}?deploy=${GITHUB_SHA}-${attempt}" -o "$file" || ready=0
              grep -q 'id="death-temperature-evidence"' "$file" || ready=0
              grep -q '24°C' "$file" || ready=0
              grep -q 'final-chapter.js?v=20260829-7' "$file" || ready=0
            done
            if [[ "$ready" -eq 1 ]]; then
              echo 'Both public pages expose the evidence block and corrected hash script.'
              exit 0
            fi
            sleep 10
          done
          echo 'Timed out before GitHub Pages exposed the corrected version.' >&2
          exit 1

      - name: Install Playwright driver
        run: npm install --no-save playwright-core@1.55.0

      - name: Validate both languages on desktop and mobile
        run: |
          node --input-type=module <<'JS'
          import { chromium } from 'playwright-core';
          import fs from 'node:fs';

          const output = 'browser-validation/temperature-evidence-v3';
          fs.mkdirSync(output, { recursive: true });
          const sites = {
            'zh-Hant': {
              url: 'https://jerryzuhow77.github.io/child-advocacy-site/hearing-records/prison-watch/kaikai-final-chapter/',
              heading: '到院體溫約24°C',
              conclusion: '現有公開證據不足以精確到某一鐘點',
              nav: '24°C與離世時間'
            },
            'zh-Hans': {
              url: 'https://jerryzuhow77.github.io/child-advocacy-site/hearing-records/prison-watch/kaikai-final-chapter/zh-Hans/',
              heading: '到院体温约24°C',
              conclusion: '现有公开证据不足以精确到某一钟点',
              nav: '24°C与离世时间'
            }
          };
          const viewports = {
            desktop: { width: 1440, height: 1000 },
            mobile: { width: 390, height: 844 }
          };

          const browser = await chromium.launch({
            headless: true,
            executablePath: '/usr/bin/google-chrome',
            args: ['--no-sandbox', '--disable-dev-shm-usage']
          });
          const results = [];
          let failed = false;

          const measureAlignment = async (page, id) => {
            await page.waitForSelector(`#${id}`, { state: 'visible', timeout: 15000 });
            try {
              await page.waitForFunction((targetId) => {
                const target = document.getElementById(targetId);
                if (!target) return false;
                const parsed = Number.parseFloat(getComputedStyle(document.documentElement).scrollPaddingTop);
                const expected = Number.isFinite(parsed) ? parsed : 90;
                return Math.abs(target.getBoundingClientRect().top - expected) <= 18;
              }, id, { timeout: 6500 });
            } catch (_) {}
            await page.waitForTimeout(350);
            return page.evaluate((targetId) => {
              const target = document.getElementById(targetId);
              const rect = target.getBoundingClientRect();
              const style = getComputedStyle(target);
              const parsed = Number.parseFloat(getComputedStyle(document.documentElement).scrollPaddingTop);
              const expectedTop = Number.isFinite(parsed) ? parsed : 90;
              return {
                hash: location.hash,
                expectedTop,
                top: Math.round(rect.top),
                bottom: Math.round(rect.bottom),
                delta: Math.round(Math.abs(rect.top - expectedTop)),
                aligned: Math.abs(rect.top - expectedTop) <= 18,
                visible: style.display !== 'none' && style.visibility !== 'hidden' && Number(style.opacity) > 0.99,
                intersectsViewport: rect.top < innerHeight && rect.bottom > 0,
                overflowPixels: Math.max(0, document.documentElement.scrollWidth - innerWidth)
              };
            }, id);
          };

          for (const [language, site] of Object.entries(sites)) {
            for (const [viewportName, viewport] of Object.entries(viewports)) {
              const context = await browser.newContext({
                viewport,
                locale: language === 'zh-Hant' ? 'zh-TW' : 'zh-CN',
                colorScheme: 'light'
              });
              const page = await context.newPage();
              const pageErrors = [];
              const badSameOriginResponses = [];
              page.on('pageerror', error => pageErrors.push(String(error)));
              page.on('response', response => {
                const parsed = new URL(response.url());
                if (parsed.hostname === 'jerryzuhow77.github.io' && response.status() >= 400) {
                  badSameOriginResponses.push({ url: response.url(), status: response.status() });
                }
              });

              const base = `${site.url}?qa=${Date.now()}-${language}-${viewportName}`;
              const response = await page.goto(base, { waitUntil: 'networkidle', timeout: 60000 });
              await page.waitForSelector('#death-temperature-evidence', { state: 'attached', timeout: 15000 });

              const content = await page.evaluate(({ heading, conclusion, nav }) => {
                const target = document.getElementById('death-temperature-evidence');
                const text = target?.textContent || '';
                const navLinks = [...document.querySelectorAll('a[href="#death-temperature-evidence"]')];
                const sourceHrefs = [...(target?.querySelectorAll('.source-chips a') || [])].map(link => link.href);
                const script = document.querySelector('script[src*="final-chapter.js"]');
                return {
                  headingPresent: text.includes(heading),
                  conclusionPresent: text.includes(conclusion),
                  navLinkPresent: navLinks.some(link => (link.textContent || '').trim() === nav),
                  sourceReportPresent: sourceHrefs.some(href => href === 'https://www.taisounds.com/news/content/95/230066'),
                  forensicSourcePresent: sourceHrefs.some(href => href.startsWith('https://doi.org/10.1177/002580247701700209')),
                  uniqueDeepLinkId: document.querySelectorAll('#death-temperature-evidence').length === 1,
                  scriptVersionPresent: Boolean(script?.src.includes('v=20260829-7')),
                  modifiedDate: document.querySelector('meta[property="article:modified_time"]')?.content || ''
                };
              }, site);

              await page.evaluate(() => document.querySelector('a[href="#death-temperature-evidence"]')?.click());
              const menuJump = await measureAlignment(page, 'death-temperature-evidence');
              await page.locator('#death-temperature-evidence').screenshot({
                path: `${output}/${language}-${viewportName}-evidence.png`
              });

              await page.reload({ waitUntil: 'networkidle', timeout: 60000 });
              const directReload = await measureAlignment(page, 'death-temperature-evidence');

              await page.goto(`${site.url}?qa=legacy-${Date.now()}-${language}-${viewportName}#dental-warning`, {
                waitUntil: 'networkidle',
                timeout: 60000
              });
              const existingAnchor = await measureAlignment(page, 'dental-warning');

              const checks = {
                http200: response?.status() === 200,
                headingPresent: content.headingPresent,
                conclusionPresent: content.conclusionPresent,
                navLinkPresent: content.navLinkPresent,
                sourceReportPresent: content.sourceReportPresent,
                forensicSourcePresent: content.forensicSourcePresent,
                uniqueDeepLinkId: content.uniqueDeepLinkId,
                scriptVersionPresent: content.scriptVersionPresent,
                modifiedDateCurrent: content.modifiedDate === '2026-08-29',
                menuHashCorrect: menuJump.hash === '#death-temperature-evidence',
                menuJumpAligned: menuJump.aligned && menuJump.intersectsViewport && menuJump.visible,
                menuNoOverflow: menuJump.overflowPixels <= 1,
                reloadHashCorrect: directReload.hash === '#death-temperature-evidence',
                directReloadAligned: directReload.aligned && directReload.intersectsViewport && directReload.visible,
                reloadNoOverflow: directReload.overflowPixels <= 1,
                existingHashCorrect: existingAnchor.hash === '#dental-warning',
                existingAnchorAligned: existingAnchor.aligned && existingAnchor.intersectsViewport && existingAnchor.visible,
                existingAnchorNoOverflow: existingAnchor.overflowPixels <= 1,
                noPageErrors: pageErrors.length === 0,
                noSameOrigin404s: badSameOriginResponses.length === 0
              };
              const passed = Object.values(checks).every(Boolean);
              if (!passed) failed = true;
              results.push({
                language,
                viewport: viewportName,
                checks,
                content,
                menuJump,
                directReload,
                existingAnchor,
                pageErrors,
                badSameOriginResponses,
                passed
              });
              await context.close();
            }
          }

          await browser.close();
          fs.writeFileSync(`${output}/report.json`, JSON.stringify(results, null, 2));
          console.log(JSON.stringify(results, null, 2));
          if (failed) process.exit(1);
          JS

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kaikai-24c-live-validation-v3
          path: browser-validation/temperature-evidence-v3
          retention-days: 14

      - name: Remove all completed one-off validation workflows
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/oneoff-kaikai-temperature-live-verify-20260829.yml
          git rm -f .github/workflows/oneoff-kaikai-temperature-live-verify-v2-20260829.yml
          git rm -f .github/workflows/oneoff-kaikai-temperature-live-verify-v3-20260829.yml
          git commit -m 'Remove completed 24C live validation workflows'
          git push origin HEAD:main
