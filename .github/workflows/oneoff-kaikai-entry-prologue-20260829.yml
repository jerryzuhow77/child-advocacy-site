name: Publish immediate-entry prologue for Kaikai Chapter 2

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/oneoff-kaikai-entry-prologue-20260829.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: oneoff-kaikai-entry-prologue-20260829
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebase onto latest main
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin main

      - name: Apply the immediate full-screen entry prologue patch
        shell: bash
        run: |
          set -euo pipefail
          original_commit='7f7c5814068644bc36377c740819b5fb28c88d8d'
          workflow='.github/workflows/oneoff-kaikai-entry-prologue-20260829.yml'
          git show "${original_commit}:${workflow}" > /tmp/original-entry-prologue-workflow.yml
          python3 - <<'PY_EXTRACT'
          from pathlib import Path
          import textwrap

          source = Path('/tmp/original-entry-prologue-workflow.yml').read_text(encoding='utf-8')
          start_marker = "          python3 - <<'PY_PATCH'\n"
          end_marker = "\n          PY_PATCH"
          start = source.index(start_marker) + len(start_marker)
          end = source.index(end_marker, start)
          patch_source = textwrap.dedent(source[start:end])
          if "ENTRY-PROLOGUE-OVERLAY-20260829" not in patch_source:
              raise SystemExit('entry-prologue patch marker was not recovered')
          Path('/tmp/apply-entry-prologue.py').write_text(patch_source, encoding='utf-8')
          PY_EXTRACT
          python3 /tmp/apply-entry-prologue.py

      - name: Validate source and media contract
        shell: bash
        run: |
          set -euo pipefail
          base='hearing-records/prison-watch/kaikai-final-chapter'
          node --check "$base/final-chapter.js"
          test -s "$base/assets/kaikai-final-chapter-prologue.mp4"
          test -s "$base/assets/kaikai-final-chapter-prologue-poster.jpg"

          for page in "$base/index.html" "$base/zh-Hans/index.html"; do
            test "$(grep -c 'data-entry-prologue' "$page")" -eq 1
            test "$(grep -c 'data-prologue-video' "$page")" -eq 1
            test "$(grep -c 'id=\"prologue-film\"' "$page")" -eq 1
            grep -q '<body class="prologue-active">' "$page"
            grep -q 'ENTRY-PROLOGUE-OVERLAY-20260829' "$page"
            grep -q 'autoplay muted playsinline' "$page"
            grep -q 'final-chapter.css?v=20260829-33' "$page"
            grep -q 'final-chapter.js?v=20260829-33' "$page"
            ! grep -q 'class="section prologue-film-section"' "$page"
          done

          python3 - <<'PY_VALIDATE'
          from pathlib import Path
          import re

          base = Path('hearing-records/prison-watch/kaikai-final-chapter')
          for path in (base / 'index.html', base / 'zh-Hans/index.html'):
              text = path.read_text(encoding='utf-8')
              body = text.index('<body class="prologue-active">')
              overlay = text.index('data-entry-prologue', body)
              skip_link = text.index('class="skip-link"', body)
              main = text.index('<main id="main">', body)
              if not body < overlay < skip_link < main:
                  raise SystemExit(f'entry overlay is not ahead of ordinary page content in {path}')
              if len(re.findall(r'<section class="entry-prologue"', text)) != 1:
                  raise SystemExit(f'unexpected entry overlay count in {path}')

          css = (base / 'final-chapter.css').read_text(encoding='utf-8')
          js = (base / 'final-chapter.js').read_text(encoding='utf-8')
          for marker in (
              'position:fixed;',
              'z-index:2147483000;',
              'body.prologue-active',
              '.entry-prologue.is-closing',
          ):
              if marker not in css:
                  raise SystemExit(f'missing CSS marker: {marker}')
          for marker in (
              'requestAnimationFrame(playPrologue);',
              "prologueVideo?.addEventListener('ended'",
              'setProloguePageState(true);',
              'prologueReplayLinks.forEach',
          ):
              if marker not in js:
                  raise SystemExit(f'missing JS marker: {marker}')
          PY_VALIDATE

      - name: Browser-check the actual immediate first-screen behavior
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/prologue-browser
          cd /tmp/prologue-browser
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.55.0
          npx playwright install --with-deps chromium >/dev/null

          cd "$GITHUB_WORKSPACE"
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/prologue-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              break
            fi
            sleep 1
          done

          mkdir -p /tmp/prologue-screenshots
          node <<'NODE'
          const { chromium } = require('/tmp/prologue-browser/node_modules/playwright');
          const assert = require('node:assert/strict');

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const cases = [
              {
                name: 'zh-Hant-desktop',
                url: 'http://127.0.0.1:4173/hearing-records/prison-watch/kaikai-final-chapter/',
                viewport: { width: 1440, height: 900 }
              },
              {
                name: 'zh-Hans-mobile',
                url: 'http://127.0.0.1:4173/hearing-records/prison-watch/kaikai-final-chapter/zh-Hans/',
                viewport: { width: 390, height: 844 }
              }
            ];

            for (const testCase of cases) {
              const page = await browser.newPage({ viewport: testCase.viewport });
              const pageErrors = [];
              page.on('pageerror', (error) => pageErrors.push(error.message));

              await page.goto(testCase.url, { waitUntil: 'domcontentloaded' });
              const overlay = page.locator('[data-entry-prologue]');
              await overlay.waitFor({ state: 'visible' });

              const initial = await page.evaluate(() => {
                const entry = document.querySelector('[data-entry-prologue]');
                const main = document.querySelector('#main');
                const video = entry.querySelector('[data-prologue-video]');
                const skip = entry.querySelector('[data-prologue-skip]');
                const rect = entry.getBoundingClientRect();
                const skipRect = skip.getBoundingClientRect();
                const style = getComputedStyle(entry);
                const centerLayer = document.elementFromPoint(window.innerWidth / 2, window.innerHeight / 2);
                return {
                  firstElementSummary: document.body.firstElementChild?.outerHTML.slice(0, 120) || '',
                  parentIsBody: entry.parentElement === document.body,
                  overlayBeforeMain: Boolean(entry.compareDocumentPosition(main) & Node.DOCUMENT_POSITION_FOLLOWING),
                  bodyLocked: document.body.classList.contains('prologue-active'),
                  centerCoveredByOverlay: Boolean(centerLayer && entry.contains(centerLayer)),
                  position: style.position,
                  zIndex: Number.parseInt(style.zIndex, 10),
                  rect: { x: rect.x, y: rect.y, width: rect.width, height: rect.height },
                  skipVisible: skipRect.width > 0 && skipRect.height > 0,
                  autoplay: video.autoplay,
                  muted: video.muted,
                  playsInline: video.playsInline,
                  horizontalOverflow: document.documentElement.scrollWidth - window.innerWidth
                };
              });

              console.log(testCase.name, JSON.stringify(initial));
              assert.equal(initial.parentIsBody, true, `${testCase.name}: overlay is not a direct body layer`);
              assert.equal(initial.overlayBeforeMain, true, `${testCase.name}: overlay follows ordinary page content`);
              assert.equal(initial.bodyLocked, true, `${testCase.name}: page is not locked behind the prologue`);
              assert.equal(initial.centerCoveredByOverlay, true, `${testCase.name}: overlay is not the top visual layer`);
              assert.equal(initial.position, 'fixed', `${testCase.name}: overlay is not fixed to viewport`);
              assert.ok(initial.zIndex >= 1000000, `${testCase.name}: overlay z-index is too low`);
              assert.ok(Math.abs(initial.rect.x) <= 0.5 && Math.abs(initial.rect.y) <= 0.5, `${testCase.name}: overlay does not start at viewport origin`);
              assert.ok(initial.rect.width >= testCase.viewport.width - 1, `${testCase.name}: overlay width is incomplete`);
              assert.ok(initial.rect.height >= testCase.viewport.height - 1, `${testCase.name}: overlay height is incomplete`);
              assert.equal(initial.skipVisible, true, `${testCase.name}: skip button is not visible`);
              assert.equal(initial.autoplay, true, `${testCase.name}: autoplay attribute is missing`);
              assert.equal(initial.muted, true, `${testCase.name}: video is not muted`);
              assert.equal(initial.playsInline, true, `${testCase.name}: playsinline is missing`);
              assert.ok(initial.horizontalOverflow <= 1, `${testCase.name}: horizontal overflow ${initial.horizontalOverflow}px`);

              await page.waitForTimeout(1000);
              const playback = await page.evaluate(() => {
                const entry = document.querySelector('[data-entry-prologue]');
                const video = entry.querySelector('[data-prologue-video]');
                const playButton = entry.querySelector('[data-prologue-play]');
                return {
                  currentTime: video.currentTime,
                  paused: video.paused,
                  readyState: video.readyState,
                  playPromptVisible: !playButton.hidden
                };
              });
              console.log(testCase.name, 'playback', JSON.stringify(playback));
              assert.ok(
                playback.currentTime > 0 || (!playback.paused && playback.readyState >= 2),
                `${testCase.name}: muted autoplay did not start`
              );
              assert.equal(playback.playPromptVisible, false, `${testCase.name}: autoplay unexpectedly required a gesture`);

              await page.screenshot({
                path: `/tmp/prologue-screenshots/${testCase.name}-entry.png`,
                fullPage: false
              });

              await page.locator('[data-prologue-skip]').click();
              await page.waitForFunction(() => document.querySelector('[data-entry-prologue]').hidden === true);
              assert.equal(
                await page.evaluate(() => document.body.classList.contains('prologue-active')),
                false,
                `${testCase.name}: page remained locked after skipping`
              );

              if (testCase.name === 'zh-Hant-desktop') {
                await page.evaluate(() => document.querySelector('a[href="#prologue-film"]').click());
                await overlay.waitFor({ state: 'visible' });
                assert.equal(
                  await page.evaluate(() => document.body.classList.contains('prologue-active')),
                  true,
                  `${testCase.name}: replay did not lock the page`
                );
                await page.evaluate(() => {
                  document.querySelector('[data-prologue-video]').dispatchEvent(new Event('ended'));
                });
                await page.waitForFunction(() => document.querySelector('[data-entry-prologue]').hidden === true);
              }

              assert.deepEqual(pageErrors, [], `${testCase.name}: page errors: ${pageErrors.join(' | ')}`);
              await page.close();
            }

            await browser.close();
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Upload browser evidence
        uses: actions/upload-artifact@v4
        with:
          name: kaikai-entry-prologue-browser-evidence-20260829-r2
          path: /tmp/prologue-screenshots/*.png
          if-no-files-found: error
          retention-days: 7

      - name: Commit publication and remove the one-off workflow
        shell: bash
        run: |
          set -euo pipefail
          workflow='.github/workflows/oneoff-kaikai-entry-prologue-20260829.yml'
          git rm "$workflow"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Show Chapter 2 prologue immediately on entry'
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 3))
          done
          exit 1
