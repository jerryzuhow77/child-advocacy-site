name: Publish immediate-entry prologue for Kaikai Chapter 2

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/oneoff-kaikai-entry-prologue-20260829.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: oneoff-kaikai-entry-prologue-20260829
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebase onto latest main
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin main

      - name: Apply the immediate full-screen entry prologue patch
        shell: bash
        run: |
          set -euo pipefail
          original_commit='7f7c5814068644bc36377c740819b5fb28c88d8d'
          workflow='.github/workflows/oneoff-kaikai-entry-prologue-20260829.yml'
          git show "${original_commit}:${workflow}" > /tmp/original-entry-prologue-workflow.yml
          python3 - <<'PY_EXTRACT'
          from pathlib import Path
          import textwrap

          source = Path('/tmp/original-entry-prologue-workflow.yml').read_text(encoding='utf-8')
          start_marker = "          python3 - <<'PY_PATCH'\n"
          end_marker = "\n          PY_PATCH"
          start = source.index(start_marker) + len(start_marker)
          end = source.index(end_marker, start)
          patch_source = textwrap.dedent(source[start:end])

          condition = patch_source.index("if '// ENTRY-PROLOGUE-OVERLAY-20260829' in js:")
          branch_start = patch_source.index('else:\n', condition)
          branch_end = patch_source.index('\n\njs_path.write_text', branch_start)
          robust_branch = """else:
              js, replaced = re.subn(
                  r'  // PROLOGUE-VIDEO-20260829.*?(?=  const totalLabel =)',
                  new_js + '\\n',
                  js,
                  count=1,
                  flags=re.S,
              )
              if replaced != 1:
                  raise SystemExit('legacy prologue JavaScript marker range not found')
          """
          patch_source = patch_source[:branch_start] + robust_branch + patch_source[branch_end:]

          old_video_source = '<source src="{asset}/kaikai-final-chapter-prologue.mp4?v=20260829-3" type="video/mp4">'
          new_video_sources = (
              '<source src="{asset}/kaikai-final-chapter-prologue.webm?v=20260829-4" type="video/webm">\n'
              '              <source src="{asset}/kaikai-final-chapter-prologue.mp4?v=20260829-4" type="video/mp4">'
          )
          if patch_source.count(old_video_source) != 1:
              raise SystemExit('expected one MP4 source in recovered patch')
          patch_source = patch_source.replace(old_video_source, new_video_sources, 1)

          filtered_lines = []
          removed_video_preloads = 0
          for line in patch_source.splitlines():
              if 'link rel="preload" as="video"' in line and 'kaikai-final-chapter-prologue.mp4' in line:
                  removed_video_preloads += 1
                  continue
              filtered_lines.append(line)
          if removed_video_preloads != 1:
              raise SystemExit(f'unexpected video preload count: {removed_video_preloads}')
          patch_source = '\n'.join(filtered_lines) + '\n'
          patch_source = patch_source.replace('20260829-33', '20260829-34')

          Path('/tmp/apply-entry-prologue.py').write_text(patch_source, encoding='utf-8')
          PY_EXTRACT
          python3 /tmp/apply-entry-prologue.py

      - name: Prepare cross-browser prologue media
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi

          base='hearing-records/prison-watch/kaikai-final-chapter/assets'
          mp4="$base/kaikai-final-chapter-prologue.mp4"
          optimized="$base/kaikai-final-chapter-prologue.faststart.mp4"
          webm="$base/kaikai-final-chapter-prologue.webm"

          ffmpeg -hide_banner -loglevel error -y -i "$mp4" \
            -map 0:v:0 -c:v copy -an -movflags +faststart -avoid_negative_ts make_zero "$optimized"
          test -s "$optimized"
          mv "$optimized" "$mp4"

          ffmpeg -hide_banner -loglevel error -y -i "$mp4" \
            -map 0:v:0 -an -c:v libvpx-vp9 -crf 31 -b:v 0 \
            -deadline good -cpu-used 4 -pix_fmt yuv420p "$webm"
          test -s "$webm"
          test "$(stat -c '%s' "$webm")" -gt 100000

          mp4_duration="$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 "$mp4")"
          webm_duration="$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 "$webm")"
          python3 - "$mp4_duration" "$webm_duration" <<'PY_MEDIA'
          import sys
          mp4_duration, webm_duration = map(float, sys.argv[1:])
          if not 4.8 <= mp4_duration <= 5.3:
              raise SystemExit(f'unexpected MP4 duration: {mp4_duration}')
          if abs(mp4_duration - webm_duration) > 0.25:
              raise SystemExit(f'WebM duration mismatch: mp4={mp4_duration}, webm={webm_duration}')
          PY_MEDIA

          printf '%s\n' '=== MP4 ==='
          ffprobe -v error -select_streams v:0 \
            -show_entries stream=codec_name,width,height,duration \
            -of default=noprint_wrappers=1 "$mp4"
          printf '%s\n' '=== WEBM ==='
          ffprobe -v error -select_streams v:0 \
            -show_entries stream=codec_name,width,height,duration \
            -of default=noprint_wrappers=1 "$webm"

      - name: Validate source and media contract
        shell: bash
        run: |
          set -euo pipefail
          base='hearing-records/prison-watch/kaikai-final-chapter'
          node --check "$base/final-chapter.js"
          test -s "$base/assets/kaikai-final-chapter-prologue.mp4"
          test -s "$base/assets/kaikai-final-chapter-prologue.webm"
          test -s "$base/assets/kaikai-final-chapter-prologue-poster.jpg"

          for page in "$base/index.html" "$base/zh-Hans/index.html"; do
            test "$(grep -c 'data-entry-prologue' "$page")" -eq 1
            test "$(grep -c 'data-prologue-video' "$page")" -eq 1
            grep -q '<body class="prologue-active">' "$page"
            grep -q 'autoplay muted playsinline' "$page"
            grep -q 'kaikai-final-chapter-prologue.webm?v=20260829-4' "$page"
            grep -q 'kaikai-final-chapter-prologue.mp4?v=20260829-4' "$page"
            grep -q 'final-chapter.css?v=20260829-34' "$page"
            grep -q 'final-chapter.js?v=20260829-34' "$page"
            ! grep -q 'class="section prologue-film-section"' "$page"
            ! grep -q 'rel="preload" as="video"' "$page"
          done

          grep -q 'z-index:2147483000' "$base/final-chapter.css"
          grep -q 'requestAnimationFrame(playPrologue)' "$base/final-chapter.js"
          grep -q "addEventListener('ended'" "$base/final-chapter.js"
          ffmpeg -hide_banner -loglevel error -i "$base/assets/kaikai-final-chapter-prologue.mp4" -f null -
          ffmpeg -hide_banner -loglevel error -i "$base/assets/kaikai-final-chapter-prologue.webm" -f null -

      - name: Browser-check immediate desktop and mobile entry
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/prologue-browser
          cd /tmp/prologue-browser
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.55.0
          npx playwright install --with-deps chromium >/dev/null

          cd "$GITHUB_WORKSPACE"
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/prologue-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              break
            fi
            sleep 1
          done

          mkdir -p /tmp/prologue-screenshots
          node <<'NODE'
          const { chromium } = require('/tmp/prologue-browser/node_modules/playwright');
          const assert = require('node:assert/strict');

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const cases = [
              ['zh-Hant-desktop', 'http://127.0.0.1:4173/hearing-records/prison-watch/kaikai-final-chapter/', { width: 1440, height: 900 }],
              ['zh-Hans-mobile', 'http://127.0.0.1:4173/hearing-records/prison-watch/kaikai-final-chapter/zh-Hans/', { width: 390, height: 844 }]
            ];

            for (const [name, url, viewport] of cases) {
              const page = await browser.newPage({ viewport });
              const pageErrors = [];
              const mediaResponses = [];
              page.on('pageerror', error => pageErrors.push(error.message));
              page.on('response', response => {
                if (response.url().includes('kaikai-final-chapter-prologue.')) {
                  mediaResponses.push({ status: response.status(), url: response.url() });
                }
              });

              await page.goto(url, { waitUntil: 'domcontentloaded' });
              const overlay = page.locator('[data-entry-prologue]');
              await overlay.waitFor({ state: 'visible' });

              const state = await page.evaluate(() => {
                const entry = document.querySelector('[data-entry-prologue]');
                const main = document.querySelector('#main');
                const video = entry.querySelector('[data-prologue-video]');
                const skip = entry.querySelector('[data-prologue-skip]');
                const rect = entry.getBoundingClientRect();
                const style = getComputedStyle(entry);
                const topLayer = document.elementFromPoint(innerWidth / 2, innerHeight / 2);
                return {
                  parentIsBody: entry.parentElement === document.body,
                  beforeMain: Boolean(entry.compareDocumentPosition(main) & Node.DOCUMENT_POSITION_FOLLOWING),
                  locked: document.body.classList.contains('prologue-active'),
                  topLayer: Boolean(topLayer && entry.contains(topLayer)),
                  position: style.position,
                  zIndex: parseInt(style.zIndex, 10),
                  rect: [rect.x, rect.y, rect.width, rect.height],
                  skipVisible: skip.getBoundingClientRect().width > 0,
                  autoplay: video.autoplay,
                  muted: video.muted,
                  inline: video.playsInline,
                  canPlayWebM: video.canPlayType('video/webm; codecs="vp9"'),
                  canPlayMp4: video.canPlayType('video/mp4; codecs="avc1.42E01E"'),
                  overflow: document.documentElement.scrollWidth - innerWidth
                };
              });
              console.log(name, 'entry', JSON.stringify(state));
              assert.equal(state.parentIsBody && state.beforeMain, true, `${name}: overlay is not ahead of article content`);
              assert.equal(state.locked && state.topLayer, true, `${name}: overlay does not own the first screen`);
              assert.equal(state.position, 'fixed', `${name}: overlay is not viewport-fixed`);
              assert.ok(state.zIndex >= 1000000, `${name}: overlay z-index is too low`);
              assert.ok(Math.abs(state.rect[0]) <= 0.5 && Math.abs(state.rect[1]) <= 0.5, `${name}: overlay origin is wrong`);
              assert.ok(state.rect[2] >= viewport.width - 1 && state.rect[3] >= viewport.height - 1, `${name}: overlay does not cover viewport`);
              assert.equal(state.skipVisible, true, `${name}: skip control is hidden`);
              assert.equal(state.autoplay && state.muted && state.inline, true, `${name}: autoplay media contract is incomplete`);
              assert.notEqual(state.canPlayWebM, '', `${name}: Chromium cannot decode the WebM fallback`);
              assert.ok(state.overflow <= 1, `${name}: horizontal overflow ${state.overflow}px`);

              await page.waitForFunction(() => {
                const video = document.querySelector('[data-prologue-video]');
                return Boolean(video.error) || video.currentTime > 0.08;
              }, null, { timeout: 20000 });

              const playback = await page.evaluate(() => {
                const video = document.querySelector('[data-prologue-video]');
                return {
                  currentTime: video.currentTime,
                  paused: video.paused,
                  readyState: video.readyState,
                  currentSrc: video.currentSrc,
                  error: video.error ? { code: video.error.code, message: video.error.message } : null
                };
              });
              console.log(name, 'media', JSON.stringify({ playback, mediaResponses }));
              assert.equal(playback.error, null, `${name}: media failed to load`);
              assert.equal(playback.paused, false, `${name}: autoplay is paused`);
              assert.ok(playback.currentTime > 0.08, `${name}: autoplay did not advance`);
              assert.ok(playback.currentSrc.includes('kaikai-final-chapter-prologue.webm'), `${name}: Chromium did not select WebM`);
              assert.ok(mediaResponses.some(item => item.status >= 200 && item.status < 400 && item.url.includes('.webm')), `${name}: WebM response was not successful`);

              await page.screenshot({ path: `/tmp/prologue-screenshots/${name}.png`, fullPage: false });
              await page.waitForFunction(() => document.querySelector('[data-entry-prologue]').hidden === true, null, { timeout: 15000 });
              assert.equal(await page.evaluate(() => document.body.classList.contains('prologue-active')), false, `${name}: article remained locked after ending`);

              if (name === 'zh-Hant-desktop') {
                await page.evaluate(() => document.querySelector('a[href="#prologue-film"]').click());
                await overlay.waitFor({ state: 'visible' });
                await page.locator('[data-prologue-skip]').click();
                await page.waitForFunction(() => document.querySelector('[data-entry-prologue]').hidden === true);
              }

              assert.deepEqual(pageErrors, [], `${name}: ${pageErrors.join(' | ')}`);
              await page.close();
            }

            await browser.close();
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Upload browser evidence
        uses: actions/upload-artifact@v4
        with:
          name: kaikai-entry-prologue-browser-evidence-20260829-r5
          path: /tmp/prologue-screenshots/*.png
          if-no-files-found: error
          retention-days: 7

      - name: Commit publication and remove one-off workflow
        shell: bash
        run: |
          set -euo pipefail
          workflow='.github/workflows/oneoff-kaikai-entry-prologue-20260829.yml'
          git rm "$workflow"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Show Chapter 2 prologue immediately on entry'
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 3))
          done
          exit 1
