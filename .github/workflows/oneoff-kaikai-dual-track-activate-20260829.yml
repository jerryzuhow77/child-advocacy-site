name: Finalize Kaikai Chapter 2 prologue and dual background playlist

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/oneoff-kaikai-dual-track-activate-20260829.yml'

permissions:
  contents: write

concurrency:
  group: oneoff-kaikai-dual-track-activate-20260829
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install media tools when absent
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          ffmpeg -version | head -1
          ffprobe -version | head -1

      - name: Create AAC fallback and keep one playlist controller
        shell: bash
        run: |
          set -euo pipefail
          webm='assets/audio/kaikai-chapter2-bgm-02-20260829.webm'
          m4a='assets/audio/kaikai-chapter2-bgm-02-20260829.m4a'
          base='hearing-records/prison-watch/kaikai-final-chapter'

          test -s "$webm"
          duration="$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 "$webm")"
          python3 - "$duration" <<'PY_CHECK'
          import sys
          duration = float(sys.argv[1])
          if not 29.0 <= duration <= 33.0:
              raise SystemExit(f'unexpected second-track duration: {duration}')
          PY_CHECK

          ffmpeg -hide_banner -loglevel error -y -i "$webm" -map 0:a:0 -vn \
            -c:a aac -b:a 64k -ar 44100 -ac 1 -movflags +faststart -map_metadata 0 \
            -metadata title='退潮的街' -metadata album='遺落的劇本' \
            -metadata genre='Mandopop Ballad' "$m4a"

          test -s "$m4a"
          test "$(stat -c '%s' "$m4a")" -gt 100000
          fallback_duration="$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 "$m4a")"
          python3 - "$duration" "$fallback_duration" <<'PY_CHECK'
          import sys
          source, fallback = map(float, sys.argv[1:])
          if abs(source - fallback) > 0.25:
              raise SystemExit(f'AAC duration mismatch: source={source}, fallback={fallback}')
          PY_CHECK

          python3 - <<'PY_PATCH'
          from pathlib import Path
          import re

          base = Path('hearing-records/prison-watch/kaikai-final-chapter')
          js_path = base / 'final-chapter.js'
          js = js_path.read_text(encoding='utf-8')

          generic_title = "title: locale === 'zh-Hans' ? '第二章主题配乐' : '第二章主題配樂',"
          named_title = "title: locale === 'zh-Hans' ? '岁月深处的告白' : '歲月深處的告白',"
          if generic_title in js:
              js = js.replace(generic_title, named_title, 1)
          elif named_title not in js:
              raise SystemExit('first-track title marker not found')

          old_sources = "    sources: [\n      {\n        src: new URL('kaikai-chapter2-bgm-02-20260829.webm', audioDirectory).href,\n        type: 'audio/webm; codecs=\"opus\"'\n      }\n    ]"
          new_sources = "    sources: [\n      {\n        src: new URL('kaikai-chapter2-bgm-02-20260829.webm', audioDirectory).href,\n        type: 'audio/webm; codecs=\"opus\"'\n      },\n      {\n        src: new URL('kaikai-chapter2-bgm-02-20260829.m4a', audioDirectory).href,\n        type: 'audio/mp4'\n      }\n    ]"
          if old_sources in js:
              js = js.replace(old_sources, new_sources, 1)
          elif new_sources not in js:
              raise SystemExit('second-track source block not found')

          js_path.write_text(js, encoding='utf-8')

          pages = [base / 'index.html', base / 'zh-Hans/index.html']
          playlist_pattern = re.compile(
              r'\n?\s*<script\s+src="(?:\./|\.\./)final-chapter-playlist\.js[^"\n]*"\s*></script>'
          )
          for page in pages:
              text = page.read_text(encoding='utf-8')
              text = playlist_pattern.sub('', text)
              text, count = re.subn(
                  r'(final-chapter\.js\?v=)[^"\']+',
                  r'\g<1>20260829-32',
                  text,
                  count=1,
              )
              if count != 1:
                  raise SystemExit(f'final-chapter.js cache marker not found in {page}')
              page.write_text(text, encoding='utf-8')

          playlist = base / 'final-chapter-playlist.js'
          if playlist.exists():
              playlist.unlink()
          PY_PATCH

      - name: Verify publication contract
        shell: bash
        run: |
          set -euo pipefail
          base='hearing-records/prison-watch/kaikai-final-chapter'
          node --check "$base/final-chapter.js"
          grep -q 'data-prologue-video' "$base/index.html"
          grep -q 'data-prologue-video' "$base/zh-Hans/index.html"
          grep -q 'PROLOGUE ANIMATION · 00:05' "$base/index.html"
          grep -q 'PROLOGUE ANIMATION · 00:05' "$base/zh-Hans/index.html"
          grep -q 'final-chapter.js?v=20260829-32' "$base/index.html"
          grep -q 'final-chapter.js?v=20260829-32' "$base/zh-Hans/index.html"
          ! grep -q 'final-chapter-playlist.js' "$base/index.html"
          ! grep -q 'final-chapter-playlist.js' "$base/zh-Hans/index.html"
          test ! -e "$base/final-chapter-playlist.js"
          grep -q 'kaikai-chapter2-bgm-02-20260829.webm' "$base/final-chapter.js"
          grep -q 'kaikai-chapter2-bgm-02-20260829.m4a' "$base/final-chapter.js"
          grep -q 'setAudioTrack(audioTrackIndex + 1, true)' "$base/final-chapter.js"
          grep -q '歲月深處的告白' "$base/final-chapter.js"
          grep -q '退潮的街' "$base/final-chapter.js"
          test -s "$base/assets/kaikai-final-chapter-prologue.mp4"
          test -s 'assets/audio/kaikai-chapter2-bgm-02-20260829.webm'
          test -s 'assets/audio/kaikai-chapter2-bgm-02-20260829.m4a'
          ffmpeg -hide_banner -loglevel error -i 'assets/audio/kaikai-chapter2-bgm-02-20260829.webm' -f null -
          ffmpeg -hide_banner -loglevel error -i 'assets/audio/kaikai-chapter2-bgm-02-20260829.m4a' -f null -

      - name: Commit final publication and remove one-off workflow
        shell: bash
        run: |
          set -euo pipefail
          workflow='.github/workflows/oneoff-kaikai-dual-track-activate-20260829.yml'
          git rm "$workflow"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Finalize Chapter 2 prologue and dual-track soundtrack'
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 3))
          done
          exit 1
