name: Group guardian actions in top toolbar
on:
  push:
    branches: [main]
    paths: ['.github/workflows/oneoff-header-guard-menu.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Group guest and member submission links under Together Guarding
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          guest='<a class="guardian-wall-nav-link guest-message-nav-link" href="#guest-message-home" aria-label="前往首頁訪客留言投稿表單"><span class="guardian-wall-nav-mark" aria-hidden="true">♡</span><span class="guardian-wall-nav-label">訪客留言投稿</span></a>'
          member='<a class="guardian-wall-nav-link" href="https://global-protection.jerryzuhow77.chatgpt.site/submit" target="_blank" rel="noopener noreferrer" aria-label="前往全球守護留言牆一般會員投稿入口"><span class="guardian-wall-nav-mark" aria-hidden="true">✎</span><span class="guardian-wall-nav-label">一般會員投稿</span></a>'
          grouped='''<details class="guardian-action-nav"><summary aria-label="開啟一起守護專區"><span class="guardian-action-nav-heart" aria-hidden="true">♡</span><span>一起守護</span><i aria-hidden="true">⌄</i></summary><div class="guardian-action-nav-menu" role="group" aria-label="一起守護專區"><a class="guardian-action-menu-link guest-message-nav-link" href="#guest-message-home"><span class="guardian-wall-nav-mark" aria-hidden="true">♡</span><span><b>訪客留言投稿</b><small>免登入，前往首頁留言表單</small></span></a><a class="guardian-action-menu-link" href="https://global-protection.jerryzuhow77.chatgpt.site/submit" target="_blank" rel="noopener noreferrer"><span class="guardian-wall-nav-mark" aria-hidden="true">✎</span><span><b>一般會員投稿</b><small>登入後投稿並追蹤審核</small></span></a></div></details>'''
          pair=guest+'\n'+member
          if 'class="guardian-action-nav"' not in s and pair in s:
            s=s.replace(pair, grouped, 1)
          style='''<style id="guardian-action-nav-style">\n.guardian-action-nav{position:relative;flex:0 0 auto}.guardian-action-nav>summary{list-style:none;display:inline-flex;align-items:center;gap:.38rem;min-height:40px;padding:.48rem .72rem;border:1px solid rgba(255,255,255,.3);border-radius:12px;background:linear-gradient(135deg,rgba(255,241,232,.98),rgba(241,207,194,.96));color:#603f35;font:inherit;font-weight:900;cursor:pointer;box-shadow:0 6px 18px rgba(64,42,34,.12);white-space:nowrap}.guardian-action-nav>summary::-webkit-details-marker{display:none}.guardian-action-nav>summary i{font-style:normal;font-size:.78em;transition:transform .2s ease}.guardian-action-nav[open]>summary i{transform:rotate(180deg)}.guardian-action-nav-heart{color:#a55348;font-size:1.05rem}.guardian-action-nav-menu{position:absolute;top:calc(100% + 10px);right:0;z-index:40;width:min(86vw,320px);display:grid;gap:8px;padding:10px;border:1px solid rgba(109,72,58,.16);border-radius:16px;background:rgba(255,252,249,.98);box-shadow:0 18px 48px rgba(39,27,22,.2);backdrop-filter:blur(12px)}.guardian-action-menu-link{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:center;padding:11px 12px;border-radius:12px;color:#4f3a31;background:#fff;text-decoration:none}.guardian-action-menu-link:hover,.guardian-action-menu-link:focus-visible{background:#f7ebe5;outline:2px solid rgba(165,83,72,.2);outline-offset:1px}.guardian-action-menu-link .guardian-wall-nav-mark{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:#f2ded5;color:#9e4f46;font-weight:900}.guardian-action-menu-link b{display:block;font-size:.9rem}.guardian-action-menu-link small{display:block;margin-top:2px;color:#7b6a62;font-size:.72rem;font-weight:600;line-height:1.35}.guardian-action-menu-link.guest-message-nav-link{background:linear-gradient(135deg,#fff5ef,#f8e2d8)!important}.guardian-action-menu-link.guest-message-nav-link:hover{background:linear-gradient(135deg,#ffefe6,#f4d6c8)!important}@media(max-width:800px){.guardian-action-nav{width:100%}.guardian-action-nav>summary{width:100%;justify-content:center;min-height:46px}.guardian-action-nav-menu{position:static;width:100%;margin-top:8px;box-shadow:none;background:rgba(255,255,255,.9)}.guardian-action-menu-link{min-height:52px}}\n</style>\n'''
          if 'id="guardian-action-nav-style"' not in s:
            s=s.replace('</head>', style+'</head>', 1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Group guest and member submissions in header guard menu'
          git push
