name: Verify Kaikai puppet dialogue transparency

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oneoff-kaikai-puppet-dialogue-transparency-20260829.yml'

permissions:
  contents: write

jobs:
  verify-and-clean:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Confirm committed transparent styles
        shell: bash
        run: |
          set -euo pipefail
          css='hearing-records/prison-watch/kaikai-final-chapter/final-chapter.css'
          grep -q 'rgba(246,235,213,.56),rgba(235,217,184,.42)' "$css"
          grep -q 'rgba(246,235,213,.60),rgba(235,217,184,.46)' "$css"
          grep -q 'backdrop-filter:blur(7px) saturate(.95)' "$css"
          grep -q 'final-chapter.css?v=20260829-19' hearing-records/prison-watch/kaikai-final-chapter/index.html
          grep -q 'final-chapter.css?v=20260829-19' hearing-records/prison-watch/kaikai-final-chapter/zh-Hans/index.html

      - name: Wait for public CSS v19
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p browser-validation/puppet-dialogue-transparency-v2
          urls=(
            'https://jerryzuhow77.github.io/child-advocacy-site/hearing-records/prison-watch/kaikai-final-chapter/'
            'https://jerryzuhow77.github.io/child-advocacy-site/hearing-records/prison-watch/kaikai-final-chapter/zh-Hans/'
          )
          css_url='https://jerryzuhow77.github.io/child-advocacy-site/hearing-records/prison-watch/kaikai-final-chapter/final-chapter.css'
          for attempt in $(seq 1 60); do
            ready=1
            for url in "${urls[@]}"; do
              html="$(curl -fsSL --connect-timeout 15 --max-time 30 "${url}?qa=${GITHUB_SHA}-${attempt}" || true)"
              grep -q 'final-chapter.css?v=20260829-19' <<<"$html" || ready=0
            done
            css="$(curl -fsSL --connect-timeout 15 --max-time 30 "${css_url}?v=20260829-19&qa=${GITHUB_SHA}-${attempt}" || true)"
            grep -q 'rgba(246,235,213,.56),rgba(235,217,184,.42)' <<<"$css" || ready=0
            grep -q 'rgba(246,235,213,.60),rgba(235,217,184,.46)' <<<"$css" || ready=0
            [[ "$ready" -eq 1 ]] && exit 0
            sleep 10
          done
          echo 'Public CSS v19 was not observable in time.' >&2
          exit 1

      - name: Install Playwright driver
        run: npm install --no-save playwright-core@1.55.0

      - name: Verify visible dialogue after its GSAP entrance
        run: |
          node --input-type=module <<'JS'
          import { chromium } from 'playwright-core';
          import fs from 'node:fs';

          const output = 'browser-validation/puppet-dialogue-transparency-v2';
          fs.mkdirSync(output, { recursive: true });
          const sites = {
            'zh-Hant': 'https://jerryzuhow77.github.io/child-advocacy-site/hearing-records/prison-watch/kaikai-final-chapter/',
            'zh-Hans': 'https://jerryzuhow77.github.io/child-advocacy-site/hearing-records/prison-watch/kaikai-final-chapter/zh-Hans/'
          };
          const viewports = {
            desktop: { width: 1440, height: 1000, alphaA: '0.56', alphaB: '0.42' },
            mobile: { width: 390, height: 844, alphaA: '0.6', alphaB: '0.46' }
          };
          const browser = await chromium.launch({
            headless: true,
            executablePath: '/usr/bin/google-chrome',
            args: ['--no-sandbox', '--disable-dev-shm-usage']
          });
          const results = [];
          let failed = false;

          for (const [language, url] of Object.entries(sites)) {
            for (const [viewportName, viewport] of Object.entries(viewports)) {
              const context = await browser.newContext({
                viewport: { width: viewport.width, height: viewport.height },
                locale: language === 'zh-Hant' ? 'zh-TW' : 'zh-CN',
                colorScheme: 'light',
                reducedMotion: 'no-preference'
              });
              const page = await context.newPage();
              const pageErrors = [];
              const sameOriginErrors = [];
              page.on('pageerror', error => pageErrors.push(String(error)));
              page.on('response', response => {
                const parsed = new URL(response.url());
                if (parsed.hostname === 'jerryzuhow77.github.io' && response.status() >= 400) {
                  sameOriginErrors.push({ url: response.url(), status: response.status() });
                }
              });

              const response = await page.goto(`${url}?qa=${Date.now()}-${language}-${viewportName}#puppet-theatre`, {
                waitUntil: 'domcontentloaded',
                timeout: 60000
              });
              await page.waitForSelector('.puppet-dialogue', { state: 'attached', timeout: 15000 });
              await page.waitForSelector('[data-puppet-action="play"]', { state: 'visible', timeout: 15000 });
              await page.waitForTimeout(900);
              await page.locator('[data-puppet-action="play"]').click();

              await page.waitForFunction(() => {
                const dialogue = document.querySelector('.puppet-dialogue');
                if (!dialogue) return false;
                const style = getComputedStyle(dialogue);
                const text = (dialogue.textContent || '').trim();
                return Number(style.opacity) >= 0.95
                  && style.visibility !== 'hidden'
                  && text.length > 20
                  && !text.includes('按下「開演」')
                  && !text.includes('按下“开演”');
              }, null, { timeout: 9000 });
              await page.waitForTimeout(250);

              const state = await page.evaluate(() => {
                const dialogue = document.querySelector('.puppet-dialogue');
                const stage = document.querySelector('.puppet-stage');
                const dialogueRect = dialogue.getBoundingClientRect();
                const stageRect = stage.getBoundingClientRect();
                const style = getComputedStyle(dialogue);
                return {
                  backgroundImage: style.backgroundImage,
                  backdropFilter: style.backdropFilter || style.webkitBackdropFilter || '',
                  opacity: Number(style.opacity),
                  visibility: style.visibility,
                  color: style.color,
                  text: (dialogue.textContent || '').trim(),
                  dialogueCount: document.querySelectorAll('.puppet-dialogue').length,
                  insideStage: dialogueRect.left >= stageRect.left - 2
                    && dialogueRect.right <= stageRect.right + 2
                    && dialogueRect.top >= stageRect.top - 2
                    && dialogueRect.bottom <= stageRect.bottom + 2,
                  dialogueRect: {
                    left: Math.round(dialogueRect.left),
                    top: Math.round(dialogueRect.top),
                    right: Math.round(dialogueRect.right),
                    bottom: Math.round(dialogueRect.bottom),
                    width: Math.round(dialogueRect.width),
                    height: Math.round(dialogueRect.height)
                  },
                  stageRect: {
                    left: Math.round(stageRect.left),
                    top: Math.round(stageRect.top),
                    right: Math.round(stageRect.right),
                    bottom: Math.round(stageRect.bottom),
                    width: Math.round(stageRect.width),
                    height: Math.round(stageRect.height)
                  },
                  overflow: Math.max(0, Math.max(document.documentElement.scrollWidth, document.body.scrollWidth) - innerWidth),
                  cssHref: document.querySelector('link[href*="final-chapter.css"]')?.href || ''
                };
              });

              await page.locator('.puppet-dialogue').screenshot({ path: `${output}/${language}-${viewportName}-dialogue.png` });
              await page.locator('.puppet-stage').screenshot({ path: `${output}/${language}-${viewportName}-stage.png` });

              const checks = {
                http200: response?.status() === 200,
                cssVersionCurrent: state.cssHref.includes('v=20260829-19'),
                uniqueDialogue: state.dialogueCount === 1,
                dialogueVisible: state.opacity >= 0.95 && state.visibility !== 'hidden' && state.text.length > 20,
                correctFirstAlpha: state.backgroundImage.includes(`rgba(246, 235, 213, ${viewport.alphaA})`),
                correctSecondAlpha: state.backgroundImage.includes(`rgba(235, 217, 184, ${viewport.alphaB})`),
                softenedBackdrop: state.backdropFilter.includes('blur(7px)') && state.backdropFilter.includes('saturate(0.95)'),
                dialogueInsideStage: state.insideStage,
                noHorizontalOverflow: state.overflow <= 2,
                noPageErrors: pageErrors.length === 0,
                noSameOriginErrors: sameOriginErrors.length === 0
              };
              const passed = Object.values(checks).every(Boolean);
              if (!passed) failed = true;
              results.push({ language, viewport: viewportName, dimensions: { width: viewport.width, height: viewport.height }, checks, state, pageErrors, sameOriginErrors, passed });
              await context.close();
            }
          }

          await browser.close();
          fs.writeFileSync(`${output}/report.json`, JSON.stringify({ generatedAt: new Date().toISOString(), results }, null, 2));
          const lines = ['# Puppet dialogue transparency final browser verification', ''];
          for (const result of results) {
            lines.push(`## ${result.language} · ${result.viewport} (${result.dimensions.width}×${result.dimensions.height})`);
            lines.push(`- Result: ${result.passed ? 'PASS' : 'FAIL'}`);
            lines.push(`- Background: ${result.state.backgroundImage}`);
            lines.push(`- Backdrop: ${result.state.backdropFilter}; opacity=${result.state.opacity}`);
            lines.push(`- Dialogue: ${result.state.dialogueRect.width}×${result.state.dialogueRect.height}; inside stage=${result.state.insideStage}`);
            lines.push(`- Overflow=${result.state.overflow}px; page errors=${result.pageErrors.length}; HTTP errors=${result.sameOriginErrors.length}`);
            const failedChecks = Object.entries(result.checks).filter(([, value]) => !value).map(([key]) => key);
            lines.push(`- Failed checks: ${failedChecks.length ? failedChecks.join(', ') : 'none'}`);
            lines.push('');
          }
          fs.writeFileSync(`${output}/summary.md`, lines.join('\n'));
          console.log(lines.join('\n'));
          if (failed) process.exit(1);
          JS

      - name: Upload final browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kaikai-puppet-dialogue-transparency-final-proof
          path: browser-validation/puppet-dialogue-transparency-v2
          retention-days: 14

      - name: Remove completed one-off workflow
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main
          git rm .github/workflows/oneoff-kaikai-puppet-dialogue-transparency-20260829.yml
          git commit -m 'Remove completed puppet dialogue transparency workflow'
          git push origin HEAD:main
