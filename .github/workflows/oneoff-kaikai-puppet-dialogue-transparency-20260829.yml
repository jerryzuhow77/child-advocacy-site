name: Make Kaikai puppet dialogue panel more transparent

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oneoff-kaikai-puppet-dialogue-transparency-20260829.yml'

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reduce dialogue-panel opacity and refresh CSS cache key
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          css_path = Path('hearing-records/prison-watch/kaikai-final-chapter/final-chapter.css')
          css = css_path.read_text(encoding='utf-8')

          old_desktop = 'background:linear-gradient(135deg,rgba(246,235,213,.78),rgba(235,217,184,.68));color:#263c3a;border:1px solid rgba(239,199,125,.9);border-left:7px solid var(--red);box-shadow:0 13px 34px rgba(0,0,0,.4),inset 0 1px rgba(255,255,255,.55);-webkit-backdrop-filter:blur(9px) saturate(.9);backdrop-filter:blur(9px) saturate(.9)'
          new_desktop = 'background:linear-gradient(135deg,rgba(246,235,213,.56),rgba(235,217,184,.42));color:#263c3a;border:1px solid rgba(239,199,125,.78);border-left:7px solid var(--red);box-shadow:0 13px 34px rgba(0,0,0,.34),inset 0 1px rgba(255,255,255,.45);-webkit-backdrop-filter:blur(7px) saturate(.95);backdrop-filter:blur(7px) saturate(.95)'
          old_mobile = 'background:linear-gradient(135deg,rgba(246,235,213,.84),rgba(235,217,184,.76))'
          new_mobile = 'background:linear-gradient(135deg,rgba(246,235,213,.60),rgba(235,217,184,.46))'

          if css.count(old_desktop) != 1:
              raise SystemExit(f'Expected one desktop dialogue style, found {css.count(old_desktop)}')
          if css.count(old_mobile) != 1:
              raise SystemExit(f'Expected one mobile dialogue style, found {css.count(old_mobile)}')

          css = css.replace(old_desktop, new_desktop, 1)
          css = css.replace(old_mobile, new_mobile, 1)
          css_path.write_text(css, encoding='utf-8')

          for path in [
              Path('hearing-records/prison-watch/kaikai-final-chapter/index.html'),
              Path('hearing-records/prison-watch/kaikai-final-chapter/zh-Hans/index.html'),
          ]:
              html = path.read_text(encoding='utf-8')
              old = 'final-chapter.css?v=20260829-18'
              new = 'final-chapter.css?v=20260829-19'
              if html.count(old) != 1:
                  raise SystemExit(f'{path}: expected one old CSS cache key, found {html.count(old)}')
              path.write_text(html.replace(old, new, 1), encoding='utf-8')

          assert 'rgba(246,235,213,.56),rgba(235,217,184,.42)' in css
          assert 'rgba(246,235,213,.60),rgba(235,217,184,.46)' in css
          assert 'backdrop-filter:blur(7px) saturate(.95)' in css
          PY

          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hearing-records/prison-watch/kaikai-final-chapter/final-chapter.css
          git add hearing-records/prison-watch/kaikai-final-chapter/index.html
          git add hearing-records/prison-watch/kaikai-final-chapter/zh-Hans/index.html
          git commit -m 'Make puppet dialogue panel more transparent'
          git push origin HEAD:main

      - name: Wait for the updated public CSS
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p browser-validation/puppet-dialogue-transparency
          urls=(
            'https://jerryzuhow77.github.io/child-advocacy-site/hearing-records/prison-watch/kaikai-final-chapter/'
            'https://jerryzuhow77.github.io/child-advocacy-site/hearing-records/prison-watch/kaikai-final-chapter/zh-Hans/'
          )
          css_url='https://jerryzuhow77.github.io/child-advocacy-site/hearing-records/prison-watch/kaikai-final-chapter/final-chapter.css'
          for attempt in $(seq 1 75); do
            ready=1
            i=0
            for url in "${urls[@]}"; do
              i=$((i + 1))
              html="browser-validation/puppet-dialogue-transparency/page-${i}.html"
              curl -fsSL --connect-timeout 15 --max-time 30 "${url}?deploy=${GITHUB_SHA}-${attempt}" -o "$html" || ready=0
              grep -q 'final-chapter.css?v=20260829-19' "$html" || ready=0
            done
            css='browser-validation/puppet-dialogue-transparency/final-chapter.css'
            curl -fsSL --connect-timeout 15 --max-time 30 "${css_url}?v=20260829-19&deploy=${GITHUB_SHA}-${attempt}" -o "$css" || ready=0
            grep -q 'rgba(246,235,213,.56),rgba(235,217,184,.42)' "$css" || ready=0
            grep -q 'rgba(246,235,213,.60),rgba(235,217,184,.46)' "$css" || ready=0
            if [[ "$ready" -eq 1 ]]; then
              echo 'Updated transparent dialogue styles are live.'
              exit 0
            fi
            sleep 10
          done
          echo 'Timed out before both public pages exposed CSS v19.' >&2
          exit 1

      - name: Install Playwright driver
        run: npm install --no-save playwright-core@1.55.0

      - name: Verify computed transparency and responsive layout in Chrome
        run: |
          node --input-type=module <<'JS'
          import { chromium } from 'playwright-core';
          import fs from 'node:fs';

          const output = 'browser-validation/puppet-dialogue-transparency';
          fs.mkdirSync(output, { recursive: true });
          const sites = {
            'zh-Hant': 'https://jerryzuhow77.github.io/child-advocacy-site/hearing-records/prison-watch/kaikai-final-chapter/',
            'zh-Hans': 'https://jerryzuhow77.github.io/child-advocacy-site/hearing-records/prison-watch/kaikai-final-chapter/zh-Hans/'
          };
          const viewports = {
            desktop: { width: 1440, height: 1000, alphaA: '0.56', alphaB: '0.42' },
            mobile: { width: 390, height: 844, alphaA: '0.6', alphaB: '0.46' }
          };

          const browser = await chromium.launch({
            headless: true,
            executablePath: '/usr/bin/google-chrome',
            args: ['--no-sandbox', '--disable-dev-shm-usage']
          });
          const results = [];
          let failed = false;

          for (const [language, url] of Object.entries(sites)) {
            for (const [viewportName, viewport] of Object.entries(viewports)) {
              const context = await browser.newContext({
                viewport: { width: viewport.width, height: viewport.height },
                locale: language === 'zh-Hant' ? 'zh-TW' : 'zh-CN',
                colorScheme: 'light'
              });
              const page = await context.newPage();
              const pageErrors = [];
              const sameOriginErrors = [];
              page.on('pageerror', error => pageErrors.push(String(error)));
              page.on('response', response => {
                const parsed = new URL(response.url());
                if (parsed.hostname === 'jerryzuhow77.github.io' && response.status() >= 400) {
                  sameOriginErrors.push({ url: response.url(), status: response.status() });
                }
              });

              const response = await page.goto(`${url}?qa=${Date.now()}-${language}-${viewportName}#puppet-theatre`, {
                waitUntil: 'domcontentloaded',
                timeout: 60000
              });
              await page.waitForSelector('.puppet-dialogue', { state: 'visible', timeout: 15000 });
              await page.waitForTimeout(1200);

              const play = page.locator('[data-puppet-action="play"]');
              if (await play.isEnabled()) {
                await play.click();
                await page.waitForTimeout(900);
              }

              const state = await page.evaluate(() => {
                const dialogue = document.querySelector('.puppet-dialogue');
                const stage = document.querySelector('.puppet-stage');
                const dialogueRect = dialogue.getBoundingClientRect();
                const stageRect = stage.getBoundingClientRect();
                const style = getComputedStyle(dialogue);
                return {
                  backgroundImage: style.backgroundImage,
                  backdropFilter: style.backdropFilter || style.webkitBackdropFilter || '',
                  borderColor: style.borderTopColor,
                  color: style.color,
                  dialogueText: (dialogue.textContent || '').trim(),
                  dialogueCount: document.querySelectorAll('.puppet-dialogue').length,
                  visible: style.display !== 'none' && style.visibility !== 'hidden' && Number(style.opacity) > 0.99,
                  insideStage: dialogueRect.left >= stageRect.left - 1 && dialogueRect.right <= stageRect.right + 1 && dialogueRect.top >= stageRect.top - 1 && dialogueRect.bottom <= stageRect.bottom + 1,
                  dialogueWidth: Math.round(dialogueRect.width),
                  dialogueHeight: Math.round(dialogueRect.height),
                  stageWidth: Math.round(stageRect.width),
                  stageHeight: Math.round(stageRect.height),
                  overflow: Math.max(0, Math.max(document.documentElement.scrollWidth, document.body.scrollWidth) - innerWidth),
                  cssHref: document.querySelector('link[href*="final-chapter.css"]')?.href || ''
                };
              });

              await page.locator('.puppet-stage').screenshot({ path: `${output}/${language}-${viewportName}-puppet-stage.png` });

              const checks = {
                http200: response?.status() === 200,
                cssVersionCurrent: state.cssHref.includes('v=20260829-19'),
                uniqueDialogue: state.dialogueCount === 1,
                dialogueVisible: state.visible && state.dialogueText.length > 5,
                correctFirstAlpha: state.backgroundImage.includes(`rgba(246, 235, 213, ${viewport.alphaA})`),
                correctSecondAlpha: state.backgroundImage.includes(`rgba(235, 217, 184, ${viewport.alphaB})`),
                softenedBackdrop: state.backdropFilter.includes('blur(7px)') && state.backdropFilter.includes('saturate(0.95)'),
                dialogueInsideStage: state.insideStage,
                noHorizontalOverflow: state.overflow <= 2,
                noPageErrors: pageErrors.length === 0,
                noSameOriginErrors: sameOriginErrors.length === 0
              };
              const passed = Object.values(checks).every(Boolean);
              if (!passed) failed = true;
              results.push({
                language,
                viewport: viewportName,
                dimensions: { width: viewport.width, height: viewport.height },
                checks,
                state,
                pageErrors,
                sameOriginErrors,
                passed
              });
              await context.close();
            }
          }

          await browser.close();
          fs.writeFileSync(`${output}/report.json`, JSON.stringify({ generatedAt: new Date().toISOString(), results }, null, 2));
          const lines = ['# Puppet dialogue transparency browser verification', ''];
          for (const result of results) {
            lines.push(`## ${result.language} · ${result.viewport} (${result.dimensions.width}×${result.dimensions.height})`);
            lines.push(`- Result: ${result.passed ? 'PASS' : 'FAIL'}`);
            lines.push(`- Background: ${result.state.backgroundImage}`);
            lines.push(`- Backdrop filter: ${result.state.backdropFilter}`);
            lines.push(`- Dialogue/stage: ${result.state.dialogueWidth}×${result.state.dialogueHeight} / ${result.state.stageWidth}×${result.state.stageHeight}`);
            lines.push(`- Overflow=${result.state.overflow}px; page errors=${result.pageErrors.length}; HTTP errors=${result.sameOriginErrors.length}`);
            const failedChecks = Object.entries(result.checks).filter(([, value]) => !value).map(([key]) => key);
            lines.push(`- Failed checks: ${failedChecks.length ? failedChecks.join(', ') : 'none'}`);
            lines.push('');
          }
          fs.writeFileSync(`${output}/summary.md`, lines.join('\n'));
          console.log(lines.join('\n'));
          if (failed) process.exit(1);
          JS

      - name: Upload browser screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kaikai-puppet-dialogue-transparency-proof
          path: browser-validation/puppet-dialogue-transparency
          retention-days: 14

      - name: Remove completed one-off workflow
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main
          git rm .github/workflows/oneoff-kaikai-puppet-dialogue-transparency-20260829.yml
          git commit -m 'Remove completed puppet dialogue transparency workflow'
          git push origin HEAD:main
