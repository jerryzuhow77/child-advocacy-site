name: Apply 13-witness page contrast fix

on:
  push:
    branches:
      - fix/witness-contrast-20260829
    paths:
      - .tmp/witness-contrast.ready
      - .tmp/apply_witness_contrast.py
      - .github/workflows/apply-witness-contrast-20260829.yml

permissions:
  contents: write

concurrency:
  group: apply-witness-contrast-20260829
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out publisher branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Switch to latest main and apply correction
        shell: bash
        run: |
          set -euo pipefail
          cp .tmp/apply_witness_contrast.py /tmp/apply_witness_contrast.py
          git fetch origin main
          git checkout -B witness-contrast-publish origin/main
          python /tmp/apply_witness_contrast.py
          git diff --check

      - name: Commit directly to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hearing-records/prison-watch/kaikai-final-chapter/witnesses/witnesses.css
          git add hearing-records/prison-watch/kaikai-final-chapter/witnesses/index.html
          git add hearing-records/prison-watch/kaikai-final-chapter/zh-Hans/witnesses/index.html
          git commit -m 'Increase 13-witness page text contrast'

          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Main advanced; rebasing contrast fix (attempt ${attempt})."
            git fetch origin main
            git rebase origin/main
          done

          echo 'Unable to publish contrast fix after five attempts.' >&2
          exit 1
