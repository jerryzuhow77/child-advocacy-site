name: Add and verify Kaikai medical omissions

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oneoff-kaikai-medical-omissions-20260829.yml'

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch Traditional and Simplified pages
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin main
          python .github/scripts/patch-kaikai-medical-omissions-20260829.py
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hearing-records/prison-watch/kaikai-final-chapter/index.html
          git add hearing-records/prison-watch/kaikai-final-chapter/zh-Hans/index.html
          git add hearing-records/prison-watch/kaikai-final-chapter/final-chapter.css
          git commit -m 'Add medical-network omissions with evidence boundaries'
          pushed=0
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              pushed=1
              break
            fi
            git pull --rebase origin main
          done
          test "$pushed" -eq 1

      - name: Wait for GitHub Pages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p browser-validation/medical-omissions
          urls=(
            'https://jerryzuhow77.github.io/child-advocacy-site/hearing-records/prison-watch/kaikai-final-chapter/'
            'https://jerryzuhow77.github.io/child-advocacy-site/hearing-records/prison-watch/kaikai-final-chapter/zh-Hans/'
          )
          css_url='https://jerryzuhow77.github.io/child-advocacy-site/hearing-records/prison-watch/kaikai-final-chapter/final-chapter.css'
          for attempt in $(seq 1 90); do
            ready=1
            for url in "${urls[@]}"; do
              html="$(curl -fsSL --connect-timeout 15 --max-time 30 "${url}?qa=${GITHUB_SHA}-${attempt}" || true)"
              grep -q 'id="medical-network-omissions"' <<<"$html" || ready=0
              grep -q 'href="#medical-network-omissions"' <<<"$html" || ready=0
              grep -q 'final-chapter.css?v=20260829-21' <<<"$html" || ready=0
            done
            css="$(curl -fsSL --connect-timeout 15 --max-time 30 "${css_url}?v=20260829-21&qa=${GITHUB_SHA}-${attempt}" || true)"
            grep -q 'MEDICAL-NETWORK-OMISSIONS-20260829' <<<"$css" || ready=0
            if [[ "$ready" -eq 1 ]]; then
              echo 'Medical omissions section is live in both languages.'
              exit 0
            fi
            sleep 10
          done
          echo 'Timed out before GitHub Pages exposed the new section.' >&2
          exit 1

      - name: Install Playwright driver
        run: npm install --no-save playwright-core@1.55.0

      - name: Verify desktop and mobile Chrome layouts
        run: node .github/scripts/verify-kaikai-medical-omissions-20260829.mjs

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kaikai-medical-omissions-browser-proof
          path: browser-validation/medical-omissions
          retention-days: 14

      - name: Remove completed one-off tools
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main
          git rm .github/workflows/oneoff-kaikai-medical-omissions-20260829.yml
          git rm .github/scripts/patch-kaikai-medical-omissions-20260829.py
          git rm .github/scripts/verify-kaikai-medical-omissions-20260829.mjs
          git commit -m 'Remove completed medical omissions one-off tools'
          pushed=0
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              pushed=1
              break
            fi
            git pull --rebase origin main
          done
          test "$pushed" -eq 1
