.medical-status-legend{display:flex;flex-wrap:wrap;justify-content:center;gap:7px;margin-bottom:18px}.medical-status{display:inline-flex;align-items:center;min-height:28px;padding:4px 10px;border-radius:999px;color:#fff;font-size:9px;font-weight:950;letter-spacing:.045em}.status-official{background:#87372f}.status-record{background:#355f78}.status-open{background:#7e622b}
.medical-contact-cascade{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}.medical-contact-card{display:flex;flex-direction:column;min-width:0;padding:20px;background:rgba(255,254,248,.96);border-top:6px solid var(--teal);box-shadow:0 10px 26px rgba(8,37,48,.08)}.medical-contact-record{border-top-color:#355f78}.medical-contact-official{border-top-color:var(--red)}.medical-contact-system{border-top-color:var(--gold)}.medical-contact-card>header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:7px}.medical-contact-card time{color:var(--red-dark);font-size:12px;font-weight:950;letter-spacing:.07em}.medical-contact-card h5{margin:13px 0 8px;color:var(--ink);font:900 20px/1.42 var(--serif)}.medical-contact-card>p{margin:0;color:#52615e;font-size:12px;line-height:1.76}.medical-contact-card>aside{margin-top:14px;padding:14px 15px;background:#e7ddc8;border-left:5px solid var(--teal)}.medical-contact-official>aside{border-left-color:var(--red)}.medical-contact-system>aside{border-left-color:var(--gold)}.medical-contact-card>aside b{display:block;margin-bottom:4px;color:var(--ink);font:900 14px/1.4 var(--serif)}.medical-contact-card>aside p{margin:0;color:#53615e;font-size:11px;line-height:1.72}.medical-contact-card .source-chips{margin-top:auto}
.control-yuan-omissions{margin-top:16px;background:#fffdf7;border:1px solid #cfbb91}.control-yuan-omissions>summary{display:flex;align-items:center;justify-content:space-between;gap:15px;padding:16px 18px;background:var(--navy);color:#fff;cursor:pointer;font-weight:900;list-style:none}.control-yuan-omissions>summary::-webkit-details-marker{display:none}.control-yuan-omissions>summary span{font:900 17px/1.45 var(--serif)}.control-yuan-omissions>summary em{flex:0 0 auto;color:#f0c77b;font-size:10px;font-style:normal;letter-spacing:.06em}.control-yuan-omissions>summary:after{content:'＋';display:grid;place-items:center;width:26px;height:26px;border:1px solid rgba(255,255,255,.45);border-radius:50%;font-size:17px}.control-yuan-omissions[open]>summary:after{content:'−'}
.control-yuan-omission-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:#d8c6a3}.control-yuan-omission-grid article{position:relative;min-height:178px;padding:20px 18px;background:#fffaf0}.control-yuan-omission-grid article>span{position:absolute;top:0;right:0;padding:5px 8px;background:#e2d1ad;color:var(--red-dark);font-size:9px;font-weight:950}.control-yuan-omission-grid b{display:block;padding-right:24px;color:var(--ink);font:900 16px/1.46 var(--serif)}.control-yuan-omission-grid p{margin:8px 0 0;color:#53615e;font-size:11px;line-height:1.72}
.medical-evidence-boundary{display:grid;grid-template-columns:180px 1fr;gap:18px;align-items:center;margin-top:15px;padding:17px 19px;background:#173d4e;color:#fff;border-left:7px solid var(--gold)}.medical-evidence-boundary b{color:#f0c77b;font:900 17px/1.45 var(--serif)}.medical-evidence-boundary p{margin:0;color:#d4dfda;font-size:11px;line-height:1.75}.medical-evidence-boundary strong{color:#fff}.medical-network-omissions>.source-chips{border-top-color:#c9b68e}
@media(max-width:980px){.medical-contact-cascade,.control-yuan-omission-grid{grid-template-columns:1fr 1fr}.medical-contact-system{grid-column:1/-1}}
@media(max-width:640px){.medical-network-omissions{padding:22px 13px}.medical-contact-cascade,.control-yuan-omission-grid,.medical-evidence-boundary{grid-template-columns:1fr}.medical-contact-system{grid-column:auto}.medical-contact-card{padding:18px 15px}.control-yuan-omission-grid article{min-height:0}.control-yuan-omissions>summary{padding:14px}.control-yuan-omissions>summary span{font-size:15px}.control-yuan-omissions>summary em{display:none}}
@media print{.medical-network-omissions{background:#fff;color:#111;box-shadow:none}.medical-contact-cascade,.control-yuan-omission-grid{break-inside:avoid}.control-yuan-omissions:not([open])>.control-yuan-omission-grid{display:grid}}
'''
          if css_marker not in css:
              css += css_block
          if css.count(css_marker) != 1:
              raise SystemExit(f'CSS marker count is {css.count(css_marker)}')
          for phrase in [
              '.medical-network-omissions',
              '.medical-contact-cascade',
              '.control-yuan-omission-grid',
              '@media(max-width:640px)',
          ]:
              if phrase not in css:
                  raise SystemExit(f'CSS missing {phrase}')
          css_path.write_text(css, encoding='utf-8')
          PY

          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hearing-records/prison-watch/kaikai-final-chapter/index.html
          git add hearing-records/prison-watch/kaikai-final-chapter/zh-Hans/index.html
          git add hearing-records/prison-watch/kaikai-final-chapter/final-chapter.css
          git commit -m 'Add medical-network omissions with evidence boundaries'
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git pull --rebase origin main
          done
          exit 1

      - name: Wait for GitHub Pages to expose the new section
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p browser-validation/medical-omissions
          urls=(
            'https://jerryzuhow77.github.io/child-advocacy-site/hearing-records/prison-watch/kaikai-final-chapter/'
            'https://jerryzuhow77.github.io/child-advocacy-site/hearing-records/prison-watch/kaikai-final-chapter/zh-Hans/'
          )
          css_url='https://jerryzuhow77.github.io/child-advocacy-site/hearing-records/prison-watch/kaikai-final-chapter/final-chapter.css'
          for attempt in $(seq 1 90); do
            ready=1
            i=0
            for url in "${urls[@]}"; do
              i=$((i + 1))
              html="browser-validation/medical-omissions/page-${i}.html"
              curl -fsSL --connect-timeout 15 --max-time 30 "${url}?deploy=${GITHUB_SHA}-${attempt}" -o "$html" || ready=0
              grep -q 'id="medical-network-omissions"' "$html" || ready=0
              grep -q 'final-chapter.css?v=20260829-21' "$html" || ready=0
              grep -q 'href="#medical-network-omissions"' "$html" || ready=0
            done
            css='browser-validation/medical-omissions/final-chapter.css'
            curl -fsSL --connect-timeout 15 --max-time 30 "${css_url}?v=20260829-21&deploy=${GITHUB_SHA}-${attempt}" -o "$css" || ready=0
            grep -q 'MEDICAL-NETWORK-OMISSIONS-20260829' "$css" || ready=0
            if [[ "$ready" -eq 1 ]]; then
              echo 'Medical omissions section is live in both languages.'
              exit 0
            fi
            sleep 10
          done
          echo 'Timed out before GitHub Pages exposed the medical omissions section.' >&2
          exit 1

      - name: Install Playwright driver
        run: npm install --no-save playwright-core@1.55.0

      - name: Verify desktop and mobile layout in Google Chrome
        run: |
          node --input-type=module <<'JS'
          import { chromium } from 'playwright-core';
          import fs from 'node:fs';

          const output = 'browser-validation/medical-omissions';
          fs.mkdirSync(output, { recursive: true });
          const sites = {
            'zh-Hant': {
              url: 'https://jerryzuhow77.github.io/child-advocacy-site/hearing-records/prison-watch/kaikai-final-chapter/',
              clinic: '興隆內科小兒科診所',
              boundary: '監察院公開調查報告沒有點名興隆內科小兒科診所',
              summary: '其他監察院認定或要求檢討的制度斷點',
              nav: '醫療漏接'
            },
            'zh-Hans': {
              url: 'https://jerryzuhow77.github.io/child-advocacy-site/hearing-records/prison-watch/kaikai-final-chapter/zh-Hans/',
              clinic: '兴隆内科小儿科诊所',
              boundary: '监察院公开调查报告没有点名兴隆内科小儿科诊所',
              summary: '其他监察院认定或要求检讨的制度断点',
              nav: '医疗漏接'
            }
          };
          const viewports = {
            desktop: { width: 1440, height: 1000 },
            mobile: { width: 390, height: 844 }
          };
          const browser = await chromium.launch({
            headless: true,
            executablePath: '/usr/bin/google-chrome',
            args: ['--no-sandbox', '--disable-dev-shm-usage']
          });
          const results = [];
          let failed = false;

          const waitForAnchor = async (page, id) => {
            await page.waitForSelector(`#${id}`, { state: 'visible', timeout: 15000 });
            await page.waitForFunction(targetId => {
              const target = document.getElementById(targetId);
              if (!target || location.hash !== `#${targetId}`) return false;
              const rect = target.getBoundingClientRect();
              return rect.top < innerHeight && rect.bottom > 0;
            }, id, { timeout: 12000 });
            await page.waitForTimeout(400);
            return page.locator(`#${id}`).evaluate(target => {
              const rect = target.getBoundingClientRect();
              return {
                hash: location.hash,
                top: Math.round(rect.top),
                bottom: Math.round(rect.bottom),
                visible: rect.top < innerHeight && rect.bottom > 0,
                overflow: Math.max(0, Math.max(document.documentElement.scrollWidth, document.body.scrollWidth) - innerWidth)
              };
            });
          };

          for (const [language, site] of Object.entries(sites)) {
            for (const [viewportName, viewport] of Object.entries(viewports)) {
              const context = await browser.newContext({
                viewport,
                locale: language === 'zh-Hant' ? 'zh-TW' : 'zh-CN',
                colorScheme: 'light'
              });
              const page = await context.newPage();
              const pageErrors = [];
              const sameOriginErrors = [];
              page.on('pageerror', error => pageErrors.push(String(error)));
              page.on('response', response => {
                const parsed = new URL(response.url());
                if (parsed.hostname === 'jerryzuhow77.github.io' && response.status() >= 400) {
                  sameOriginErrors.push({ url: response.url(), status: response.status() });
                }
              });

              const response = await page.goto(`${site.url}?qa=${Date.now()}-${language}-${viewportName}#medical-network-omissions`, {
                waitUntil: 'domcontentloaded', timeout: 60000
              });
              const anchor = await waitForAnchor(page, 'medical-network-omissions');
              await page.locator('.control-yuan-omissions').evaluate(element => { element.open = true; });
              await page.waitForTimeout(300);

              const state = await page.evaluate(({ clinic, boundary, summary, nav }) => {
                const section = document.getElementById('medical-network-omissions');
                const text = section.textContent || '';
                const cards = [...section.querySelectorAll('.medical-contact-card')];
                const omissions = [...section.querySelectorAll('.control-yuan-omission-grid article')];
                const details = section.querySelector('.control-yuan-omissions');
                const rect = section.getBoundingClientRect();
                const cardRects = cards.map(card => {
                  const r = card.getBoundingClientRect();
                  return { left: r.left, right: r.right, width: r.width };
                });
                const sourceHrefs = [...section.querySelectorAll('a')].map(link => link.href);
                const navLinks = [...document.querySelectorAll('a[href="#medical-network-omissions"]')];
                return {
                  clinicPresent: text.includes(clinic),
                  boundaryPresent: text.includes(boundary),
                  summaryPresent: text.includes(summary),
                  navPresent: navLinks.some(link => (link.textContent || '').trim() === nav),
                  cardCount: cards.length,
                  omissionCount: omissions.length,
                  detailsOpen: details?.open === true,
                  officialBadgeCount: section.querySelectorAll('.status-official').length,
                  recordBadgeCount: section.querySelectorAll('.status-record').length,
                  openBadgeCount: section.querySelectorAll('.status-open').length,
                  controlYuanSource: sourceHrefs.includes('https://cybsbox.cy.gov.tw/CYBSBoxSSL/edoc/download/76497'),
                  pressSource: sourceHrefs.includes('https://www.cy.gov.tw/News_Content.aspx?Create=1&n=125&s=34118'),
                  timelineSource: sourceHrefs.includes('https://www.children.org.tw/news/news_detail/kaikai-case-timeline'),
                  cssVersion: document.querySelector('link[href*="final-chapter.css"]')?.href || '',
                  sectionVisible: rect.top < innerHeight && rect.bottom > 0,
                  cardsInsideViewport: cardRects.every(r => r.left >= -1 && r.right <= innerWidth + 1),
                  overflow: Math.max(0, Math.max(document.documentElement.scrollWidth, document.body.scrollWidth) - innerWidth)
                };
              }, site);

              await page.locator('#medical-network-omissions').screenshot({ path: `${output}/${language}-${viewportName}-medical-omissions.png` });

              const legacy = {};
              for (const id of ['dental-warning', 'death-temperature-evidence']) {
                await page.goto(`${site.url}?qa=legacy-${Date.now()}-${id}#${id}`, { waitUntil: 'domcontentloaded', timeout: 60000 });
                legacy[id] = await waitForAnchor(page, id);
              }

              const checks = {
                http200: response?.status() === 200,
                deepLinkVisible: anchor.hash === '#medical-network-omissions' && anchor.visible,
                clinicPresent: state.clinicPresent,
                evidenceBoundaryPresent: state.boundaryPresent,
                summaryPresent: state.summaryPresent,
                navPresent: state.navPresent,
                expectedCards: state.cardCount === 3 && state.omissionCount === 6,
                evidenceBadgesPresent: state.officialBadgeCount >= 2 && state.recordBadgeCount >= 2 && state.openBadgeCount >= 2,
                detailsWorks: state.detailsOpen,
                sourcesPresent: state.controlYuanSource && state.pressSource && state.timelineSource,
                cssVersionCurrent: state.cssVersion.includes('v=20260829-21'),
                responsiveCards: state.cardsInsideViewport,
                noHorizontalOverflow: state.overflow <= 2 && anchor.overflow <= 2,
                legacyDentalWorks: legacy['dental-warning'].hash === '#dental-warning' && legacy['dental-warning'].visible,
                legacyTemperatureWorks: legacy['death-temperature-evidence'].hash === '#death-temperature-evidence' && legacy['death-temperature-evidence'].visible,
                noPageErrors: pageErrors.length === 0,
                noSameOriginErrors: sameOriginErrors.length === 0
              };
              const passed = Object.values(checks).every(Boolean);
              if (!passed) failed = true;
              results.push({ language, viewport: viewportName, dimensions: viewport, checks, state, anchor, legacy, pageErrors, sameOriginErrors, passed });
              await context.close();
            }
          }

          await browser.close();
          fs.writeFileSync(`${output}/report.json`, JSON.stringify({ generatedAt: new Date().toISOString(), results }, null, 2));
          const lines = ['# Kaikai medical omissions browser verification', ''];
          for (const result of results) {
            lines.push(`## ${result.language} · ${result.viewport} (${result.dimensions.width}×${result.dimensions.height})`);
            lines.push(`- Result: ${result.passed ? 'PASS' : 'FAIL'}`);
            lines.push(`- Cards: medical=${result.state.cardCount}; official omissions=${result.state.omissionCount}`);
            lines.push(`- Deep link top=${result.anchor.top}; overflow=${result.state.overflow}px`);
            lines.push(`- Existing anchors: dental=${result.legacy['dental-warning'].visible}; temperature=${result.legacy['death-temperature-evidence'].visible}`);
            lines.push(`- Errors: page=${result.pageErrors.length}; HTTP=${result.sameOriginErrors.length}`);
            const failedChecks = Object.entries(result.checks).filter(([, value]) => !value).map(([key]) => key);
            lines.push(`- Failed checks: ${failedChecks.length ? failedChecks.join(', ') : 'none'}`);
            lines.push('');
          }
          fs.writeFileSync(`${output}/summary.md`, lines.join('\n'));
          console.log(lines.join('\n'));
          if (failed) process.exit(1);
          JS

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kaikai-medical-omissions-browser-proof
          path: browser-validation/medical-omissions
          retention-days: 14

      - name: Remove completed one-off workflow
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main
          git rm .github/workflows/oneoff-kaikai-medical-omissions-20260829.yml
          git commit -m 'Remove completed medical omissions workflow'
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git pull --rebase origin main
          done
          exit 1
