    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch Traditional and Simplified evidence sections
        shell: bash
        run: |
          set -euo pipefail
