          <summary><span>其他监察院认定或要求检讨的制度断点</span><em>展开6项</em></summary>
          <div class="control-yuan-omission-grid">
            <article><span>01</span><b>卫福部检查、评鉴未及早发现</b><p>儿盟收出养服务的7项程序缺失，是案件发生后实际查核才被发现；历年业务检查与定期评鉴未能揭露。</p></article>
