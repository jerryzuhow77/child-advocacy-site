name: Refresh Day 5 selected artwork and injury note

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/day5-static-refresh-trigger.txt'

permissions:
  contents: write

concurrency:
  group: oneoff-day5-static-refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: github.head_ref == 'trigger-day5-static-refresh-20260822'
    runs-on: ubuntu-latest
    steps:
      - name: Check out production branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Add static note and cache-busted asset references
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin main

          python - <<'PY'
          from pathlib import Path
          import re

          version = '20260822-user-selected-art-2'
          pages = [
              Path('hearing-records/prison-watch/kaikai-day5-20250429/index.html'),
              Path('en/hearing-records/prison-watch/kaikai-day5-20250429/index.html'),
              Path('ja/hearing-records/prison-watch/kaikai-day5-20250429/index.html'),
              Path('source/hearing-records/prison-watch/kaikai-day5-20250429/index.html'),
              Path('source/en/hearing-records/prison-watch/kaikai-day5-20250429/index.html'),
              Path('source/ja/hearing-records/prison-watch/kaikai-day5-20250429/index.html'),
          ]
          images = [
              'prison-watch-day5-forensic-zh-hant-20260822.webp',
              'prison-watch-day5-forensic-zh-hans-20260822.webp',
              'prison-watch-day5-medical-zh-hant-20260822.webp',
              'prison-watch-day5-medical-zh-hans-20260822.webp',
          ]

          notes = {
              'zh': (
                  '不是只有42處｜42處是可確認的最低數量',
                  '原始紀錄明載，簡報只挑選部分照片，並未呈現所有傷勢照片；「全身至少42處確定傷勢」是依現有資料仍能辨識、確認的下限。部分傷勢癒合後，死亡時外觀已看不到；頭皮等部位另被描述為傷勢「非常多，族繁不及備載」。因此，不應把42處理解成孩子曾受傷害的完整總數。正式表述應是「至少42處確定傷勢」，而不是只有42處。',
                  '資料依原始紀錄 P.5–6｜查看完整原文',
              ),
              'en': (
                  'Not only 42 injuries | 42 is the confirmed minimum',
                  'The source record states that only some photographs were selected and not every injury photograph was shown. “At least 42 confirmed injuries” is the minimum that could still be identified and confirmed. Some injuries had healed and were no longer visible at death, while injuries including those to the scalp were described as too numerous to list fully. The number 42 must not be read as the complete total of harm the child experienced.',
                  'Based on source record pp. 5–6 | Read the complete passage',
              ),
              'ja': (
                  '42か所だけではない｜42か所は確認できた最低数',
                  '原記録には、説明用資料では一部の写真だけを選び、すべての外傷写真を示していないと明記されています。「全身に少なくとも42か所の確定外傷」は、現存資料から確認できた下限です。治癒後、死亡時には外見から確認できなくなった外傷もあり、頭皮などの外傷は非常に多く、すべてを列挙できないとも説明されています。42か所を傷害の完全な総数と解釈してはいけません。',
                  '原記録5～6頁に基づく｜全文を確認',
              ),
          }

          for page in pages:
              text = page.read_text(encoding='utf-8')
              text = re.sub(r'day5\.js\?v=[^"\']+', f'day5.js?v={version}', text)
              for name in images:
                  text = re.sub(re.escape(name) + r'(?:\?v=[^"\']+)?', f'{name}?v={version}', text)

              if '/en/' in page.as_posix():
                  key = 'en'
              elif '/ja/' in page.as_posix():
                  key = 'ja'
              else:
                  key = 'zh'

              if key == 'zh':
                  text = text.replace(
                      '<strong>至少42處</strong><small>部分癒合後已看不到</small>',
                      '<strong>至少42處</strong><small>42處是可確認下限，不是完整總數</small>',
                  )

              if 'id="day5InjuryCountNote"' not in text:
                  marker = '<article class="day5-compare-card is-agree"><header><span>04</span>'
                  start = text.find(marker)
                  if start < 0:
                      raise SystemExit(f'Comparison card 04 not found in {page}')
                  end = text.find('</article>', start)
                  if end < 0:
                      raise SystemExit(f'Comparison card 04 is not closed in {page}')
                  end += len('</article>')
                  title, body, source = notes[key]
                  note = (
                      '<aside id="day5InjuryCountNote" class="day5-injury-count-note" '
                      f'aria-label="{title}"><strong>{title}</strong><p>{body}</p>'
                      f'<a href="#record-08">{source}</a></aside>'
                  )
                  text = text[:end] + note + text[end:]

              page.write_text(text, encoding='utf-8')
          PY

          node --check hearing-records/prison-watch/kaikai-day5-20250429/day5.js

          python - <<'PY'
          from pathlib import Path

          version = '20260822-user-selected-art-2'
          pages = [
              Path('hearing-records/prison-watch/kaikai-day5-20250429/index.html'),
              Path('en/hearing-records/prison-watch/kaikai-day5-20250429/index.html'),
              Path('ja/hearing-records/prison-watch/kaikai-day5-20250429/index.html'),
              Path('source/hearing-records/prison-watch/kaikai-day5-20250429/index.html'),
              Path('source/en/hearing-records/prison-watch/kaikai-day5-20250429/index.html'),
              Path('source/ja/hearing-records/prison-watch/kaikai-day5-20250429/index.html'),
          ]
          for page in pages:
              text = page.read_text(encoding='utf-8')
              if f'day5.js?v={version}' not in text:
                  raise SystemExit(f'Day 5 script cache key missing in {page}')
              if text.count('id="day5InjuryCountNote"') != 1:
                  raise SystemExit(f'Injury-count note missing or duplicated in {page}')
              if f'prison-watch-day5-forensic-zh-hant-20260822.webp?v={version}' not in text:
                  raise SystemExit(f'Selected poster cache key missing in {page}')
          PY

          git diff --check

      - name: Commit verified static refresh
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/day5-static-refresh-trigger.txt
          rm -f .github/workflows/oneoff-day5-static-refresh.yml

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && { echo 'No static refresh changes produced.'; exit 1; }
          git commit -m 'Refresh Day 5 selected artwork and 42+ note'
          git pull --rebase origin main
          git push origin main
