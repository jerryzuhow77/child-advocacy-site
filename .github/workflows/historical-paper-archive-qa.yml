name: Historical paper archive visual QA

on:
  push:
    branches: [main]
    paths:
      - 'assets/home-archive-layout-20260823.js'
      - 'assets/home-history-paper-art-20260823.js'
      - 'assets/home-history-paper-art-20260823.css'
      - '.github/workflows/historical-paper-archive-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: JavaScript syntax
        run: |
          set -euo pipefail
          node --check assets/home-archive-layout-20260823.js
          node --check assets/home-history-paper-art-20260823.js

      - name: Static visual architecture assertions
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          loader = Path('assets/home-archive-layout-20260823.js').read_text(encoding='utf-8')
          js = Path('assets/home-history-paper-art-20260823.js').read_text(encoding='utf-8')
          css = Path('assets/home-history-paper-art-20260823.css').read_text(encoding='utf-8')

          assert 'home-history-paper-art-20260823.js' in loader
          assert 'history-paper-map-svg' in js
          assert 'history-region-seal' in js
          assert 'history-silk-thread' in js
          assert "mainland:'陸'" in js
          assert 'paper-archive-deluxe' in css
          assert 'history-paper-file-card' in css
          assert '@media(max-width:720px)' in css
          assert '@media(prefers-reduced-motion:reduce)' in css
          assert 'color-mix' in css
          print('Historical paper archive static QA passed.')
          PY
