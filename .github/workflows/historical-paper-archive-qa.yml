name: Historical paper archive visual QA

on:
  push:
    branches: [main]
    paths:
      - 'assets/home-archive-layout-20260823.js'
      - 'assets/home-ia-history-20260823.js'
      - 'assets/home-gsap-map-20260824.js'
      - 'assets/home-history-paper-art-20260823.js'
      - 'assets/home-history-paper-art-20260823.css'
      - 'assets/home-history-relief-map-20260823.js'
      - 'assets/home-history-relief-map-20260823.css'
      - 'assets/home-history-paper-weather-20260825.js'
      - 'assets/home-history-paper-weather-20260825.css'
      - 'assets/art/paper-cloud-bank-v1.webp'
      - 'assets/art/paper-wind-ribbon-v1.webp'
      - 'assets/art/paper-ocean-current-v1.webp'
      - 'index.html'
      - 'en/index.html'
      - 'ja/index.html'
      - 'assets/home-post-engagement-20260826.css'
      - 'assets/home-post-engagement-20260826.js'
      - 'assets/art/east-asia-case-memory-map-paper-clay-20260824.webp'
      - 'sw.js'
      - '.github/workflows/historical-paper-archive-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install image QA dependency
        run: python3 -m pip install --disable-pip-version-check --quiet Pillow

      - name: JavaScript syntax
        run: |
          set -euo pipefail
          node --check assets/home-archive-layout-20260823.js
          node --check assets/home-ia-history-20260823.js
          node --check assets/home-gsap-map-20260824.js
          node --check assets/home-post-engagement-20260826.js
          node --check assets/home-history-paper-art-20260823.js
          node --check assets/home-history-relief-map-20260823.js
          node --check assets/home-history-paper-weather-20260825.js
          node --check sw.js

      - name: Static visual architecture assertions
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image

          loader = Path('assets/home-archive-layout-20260823.js').read_text(encoding='utf-8')
          history_js = Path('assets/home-ia-history-20260823.js').read_text(encoding='utf-8')
          map_loader = Path('assets/home-gsap-map-20260824.js').read_text(encoding='utf-8')
          engagement_js = Path('assets/home-post-engagement-20260826.js').read_text(encoding='utf-8')
          paper_js = Path('assets/home-history-paper-art-20260823.js').read_text(encoding='utf-8')
          paper_css = Path('assets/home-history-paper-art-20260823.css').read_text(encoding='utf-8')
          relief_js = Path('assets/home-history-relief-map-20260823.js').read_text(encoding='utf-8')
          relief_css = Path('assets/home-history-relief-map-20260823.css').read_text(encoding='utf-8')
          weather_js = Path('assets/home-history-paper-weather-20260825.js').read_text(encoding='utf-8')
          weather_css = Path('assets/home-history-paper-weather-20260825.css').read_text(encoding='utf-8')
          home_html = Path('index.html').read_text(encoding='utf-8')
          home_en_html = Path('en/index.html').read_text(encoding='utf-8')
          home_ja_html = Path('ja/index.html').read_text(encoding='utf-8')
          image_path = Path('assets/art/east-asia-case-memory-map-paper-clay-20260824.webp')
          weather_art = [
              Path('assets/art/paper-cloud-bank-v1.webp'),
              Path('assets/art/paper-wind-ribbon-v1.webp'),
              Path('assets/art/paper-ocean-current-v1.webp'),
          ]

          assert 'home-history-paper-art-20260823.js' in loader
          assert "s.src=base+files[index]+'?v='+version" in loader
          assert 'home-history-relief-map-20260823.js' in loader
          assert "key:'other'" not in history_js
          assert 'OTHER REGIONS' not in history_js
          assert "region:'unclassified'" in history_js
          assert "if(!b[m.region])return" in history_js
          assert 'The Jeong-in Case | The Door Did Not Open' in history_js
          assert 'チョンイン事件｜開かなかった扉' in history_js
          assert "home-archive-layout-20260823.js?v='+version" in map_loader
          assert 'host: card.querySelector(":scope > span:last-of-type") || card' in engagement_js
          assert 'history-paper-map-svg' in paper_js
          assert 'history-region-seal' in paper_js
          assert 'history-silk-thread' in paper_js
          assert "mainland:'陸'" in paper_js
          assert 'paper-archive-deluxe' in paper_css
          assert 'width:100%;\n  min-width:0;\n  max-width:100%;\n  aspect-ratio:auto;' in paper_css
          assert '>.home-post-engagement{' in paper_css
          assert 'order:5;' in paper_css
          assert 'history-relief-figure' in relief_js
          assert 'history-relief-region-dock' in relief_js
          assert 'east-asia-case-memory-map-paper-clay-20260824.webp' in relief_js
          assert 'history-relief-pin' in relief_css
          assert 'history-relief-cover-cloud' in relief_css
          assert '@media(max-width:760px)' in relief_css
          assert '@media(prefers-reduced-motion:reduce)' in relief_css
          assert 'paper-cloud-bank-v1.webp' in weather_js
          assert 'paper-wind-ribbon-v1.webp' in weather_js
          assert 'paper-ocean-current-v1.webp' in weather_js
          assert 'home-map-paper-wind-art' in weather_js
          assert 'home-map-paper-current-art' in weather_js
          assert 'home-map-paper-cloud-art' in weather_js
          assert 'home-map-paper-fibres' in weather_js
          assert 'x: 92 + index * 30' in weather_js
          assert 'x: -68 - index * 26' in weather_js
          assert 'travel.progress(progress)' in weather_js
          assert 'fleckTravel.progress' in weather_js
          assert 'IntersectionObserver' in weather_js
          assert 'prefers-reduced-motion: reduce' in weather_js
          assert 'pointer-events: none' in weather_css
          assert 'home-map-paper-wind.is-wind-one' in weather_css
          assert 'home-map-paper-current.is-current-one' in weather_css
          assert 'home-map-paper-cloud.is-near' in weather_css
          assert 'transform-style: preserve-3d' in weather_css
          assert 'home-history-paper-weather-20260825.css' in home_html
          assert 'home-history-paper-weather-20260825.js' in home_html
          assert 'home-history-paper-weather-20260825.css' in home_en_html
          assert 'home-history-paper-weather-20260825.js' in home_en_html
          assert 'home-post-engagement-20260826.css' in home_en_html
          assert 'home-post-engagement-20260826.js' in home_en_html
          assert 'Other Regions' not in home_en_html
          assert 'id="home-historical-cases"' in home_ja_html
          assert home_ja_html.count('class="home-historical-card"') == 6
          assert 'data-view-counter-key="historical-fujian-qiqi-shared"' in home_ja_html
          assert 'data-view-counter-key="historical-fu-junxiang-shared"' in home_ja_html
          assert 'home-post-engagement-20260826.css' in home_ja_html
          assert 'home-post-engagement-20260826.js' in home_ja_html
          assert 'home-history-paper-weather-20260825.css' in home_ja_html
          assert 'home-history-paper-weather-20260825.js' in home_ja_html
          assert image_path.exists() and image_path.stat().st_size > 50000
          with Image.open(image_path) as image:
              assert image.width >= 1000 and image.height >= 560
              print(f'Validated map artwork: {image.width}x{image.height}')
          for art_path in weather_art:
              assert art_path.exists() and art_path.stat().st_size > 50000
              with Image.open(art_path) as art:
                  assert art.width >= 1500 and art.height >= 650
                  assert art.mode == 'RGBA'
                  alpha_min, alpha_max = art.getchannel('A').getextrema()
                  assert alpha_min == 0 and alpha_max == 255
                  print(f'Validated transparent weather artwork: {art_path.name} {art.width}x{art.height}')
          print('Historical relief archive static QA passed.')
          PY
