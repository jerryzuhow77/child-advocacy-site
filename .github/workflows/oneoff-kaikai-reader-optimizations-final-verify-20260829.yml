name: Final verify Kaikai reader optimizations

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oneoff-kaikai-reader-optimizations-final-verify-20260829.yml'

permissions:
  contents: write

jobs:
  verify-and-clean:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Confirm deployed source contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'final-chapter.css?v=20260829-22' hearing-records/prison-watch/kaikai-final-chapter/index.html
          grep -q 'final-chapter.js?v=20260829-9' hearing-records/prison-watch/kaikai-final-chapter/index.html
          grep -q 'final-chapter.css?v=20260829-22' hearing-records/prison-watch/kaikai-final-chapter/zh-Hans/index.html
          grep -q 'final-chapter.js?v=20260829-9' hearing-records/prison-watch/kaikai-final-chapter/zh-Hans/index.html
          grep -q 'class="medical-alert-loop"' hearing-records/prison-watch/kaikai-final-chapter/index.html
          grep -q 'class="medical-alert-loop"' hearing-records/prison-watch/kaikai-final-chapter/zh-Hans/index.html
          grep -q 'data-audio-collapse' hearing-records/prison-watch/kaikai-final-chapter/index.html
          grep -q 'data-reading-route="quick"' hearing-records/prison-watch/kaikai-final-chapter/index.html
          grep -q 'READER-OPTIMIZATIONS-20260829' hearing-records/prison-watch/kaikai-final-chapter/final-chapter.css
          grep -q 'READER-OPTIMIZATIONS-20260829' hearing-records/prison-watch/kaikai-final-chapter/final-chapter.js
          node --check hearing-records/prison-watch/kaikai-final-chapter/final-chapter.js

      - name: Wait for the current public version
        shell: bash
        run: |
          set -euo pipefail
          urls=(
            'https://jerryzuhow77.github.io/child-advocacy-site/hearing-records/prison-watch/kaikai-final-chapter/'
            'https://jerryzuhow77.github.io/child-advocacy-site/hearing-records/prison-watch/kaikai-final-chapter/zh-Hans/'
          )
          for attempt in $(seq 1 60); do
            ready=1
            for url in "${urls[@]}"; do
              html="$(curl -fsSL --connect-timeout 15 --max-time 30 "${url}?qa=${GITHUB_SHA}-${attempt}" || true)"
              grep -q 'final-chapter.css?v=20260829-22' <<<"$html" || ready=0
              grep -q 'final-chapter.js?v=20260829-9' <<<"$html" || ready=0
              grep -q 'data-audio-collapse' <<<"$html" || ready=0
              grep -q 'class="medical-alert-loop"' <<<"$html" || ready=0
            done
            [[ "$ready" -eq 1 ]] && exit 0
            sleep 10
          done
          echo 'The current optimized public version was not observable in time.' >&2
          exit 1

      - name: Correct the verification sequence for the top-of-page audio state
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/scripts/verify-kaikai-reader-optimizations-20260829.mjs')
          text = path.read_text(encoding='utf-8')
          old = '''      if (viewportName === 'mobile') {
        result.states.audioTop = await page.locator('[data-audio-controller]').evaluate(controller => ({ collapsed: controller.classList.contains('is-collapsed'), width: Math.round(controller.getBoundingClientRect().width), aria: controller.querySelector('[data-audio-collapse]')?.getAttribute('aria-label') || '', bottom: getComputedStyle(controller).bottom }));'''
          new = '''      if (viewportName === 'mobile') {
        await page.evaluate(() => window.scrollTo(0, 0));
        await page.waitForFunction(() => !document.querySelector('[data-audio-controller]')?.classList.contains('is-collapsed'), null, { timeout: 5000 });
        await page.waitForTimeout(350);
        result.states.audioTop = await page.locator('[data-audio-controller]').evaluate(controller => ({ collapsed: controller.classList.contains('is-collapsed'), width: Math.round(controller.getBoundingClientRect().width), aria: controller.querySelector('[data-audio-collapse]')?.getAttribute('aria-label') || '', bottom: getComputedStyle(controller).bottom }));'''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Expected one verifier sequence, found {count}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          node --check .github/scripts/verify-kaikai-reader-optimizations-20260829.mjs

      - name: Install Playwright driver
        run: npm install --no-save playwright-core@1.55.0

      - name: Run final Traditional and Simplified desktop and mobile Chrome verification
        run: node .github/scripts/verify-kaikai-reader-optimizations-20260829.mjs

      - name: Upload final browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kaikai-reader-optimizations-final-proof
          path: browser-validation/reader-optimizations
          retention-days: 14

      - name: Remove completed one-off tools
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main
          git rm -f .github/workflows/oneoff-kaikai-reader-optimizations-20260829.yml
          git rm -f .github/workflows/oneoff-kaikai-reader-optimizations-final-verify-20260829.yml
          git rm -f .github/scripts/patch-kaikai-reader-optimizations-20260829.py
          git rm -f .github/scripts/verify-kaikai-reader-optimizations-20260829.mjs
          git commit -m 'Remove completed Chapter 2 reader optimization tools'
          pushed=0
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              pushed=1
              break
            fi
            git pull --rebase origin main
          done
          test "$pushed" -eq 1
