name: Repair Day 5 blank images with cache-safe aliases

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/day5-image-alias-v3-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: oneoff-day5-image-alias-v3
  cancel-in-progress: false

jobs:
  repair:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'trigger-day5-image-alias-v3-20260822'
    runs-on: ubuntu-latest
    steps:
      - name: Check out current production branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validate the selected artwork and update all references
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin main
          python -m pip install --disable-pip-version-check --quiet pillow

          python - <<'PY'
          from __future__ import annotations

          from pathlib import Path
          from PIL import Image, ImageStat
          import json
          import re

          root = Path('.')
          version = '20260822-selected-poster-alias-v3'
          absolute = 'https://jerryzuhow77.github.io/child-advocacy-site/assets/art/'

          names = {
              'f_hant': 'prison-watch-day5-selected-evidence-01-zh-hant-20260822-v3.jpg',
              'f_hans': 'prison-watch-day5-selected-evidence-01-zh-hans-20260822-v3.jpg',
              'm_hant': 'prison-watch-day5-selected-evidence-02-zh-hant-20260822-v3.jpg',
              'm_hans': 'prison-watch-day5-selected-evidence-02-zh-hans-20260822-v3.jpg',
          }
          assets = {key: root / 'assets/art' / name for key, name in names.items()}

          dimensions = {}
          for key, path in assets.items():
              if not path.is_file() or path.stat().st_size < 100_000:
                  raise SystemExit(f'Missing or undersized selected poster: {path}')
              with Image.open(path) as image:
                  image.verify()
              with Image.open(path) as image:
                  image.load()
                  if image.format not in {'JPEG', 'MPO'}:
                      raise SystemExit(f'Unexpected poster format: {path}: {image.format}')
                  width, height = image.size
                  if width < 480 or height < 700 or not 0.60 <= width / height <= 0.75:
                      raise SystemExit(f'Unexpected poster dimensions: {path}: {image.size}')
                  gray = image.convert('L')
                  low, high = gray.getextrema()
                  deviation = ImageStat.Stat(gray).stddev[0]
                  if high - low < 90 or deviation < 24:
                      raise SystemExit(f'Poster appears blank: {path}; range={high-low}, stddev={deviation:.2f}')
                  dimensions[key] = image.size
                  print(f'Validated {path.name}: {image.size}, {path.stat().st_size} bytes, stddev={deviation:.2f}')

          pages = [
              root / 'hearing-records/prison-watch/kaikai-day5-20250429/index.html',
              root / 'en/hearing-records/prison-watch/kaikai-day5-20250429/index.html',
              root / 'ja/hearing-records/prison-watch/kaikai-day5-20250429/index.html',
              root / 'source/hearing-records/prison-watch/kaikai-day5-20250429/index.html',
              root / 'source/en/hearing-records/prison-watch/kaikai-day5-20250429/index.html',
              root / 'source/ja/hearing-records/prison-watch/kaikai-day5-20250429/index.html',
          ]

          replacement_map = {
              'prison-watch-day5-forensic-zh-hant-20260822.webp': names['f_hant'],
              'prison-watch-day5-forensic-zh-hans-20260822.webp': names['f_hans'],
              'prison-watch-day5-medical-zh-hant-20260822.webp': names['m_hant'],
              'prison-watch-day5-medical-zh-hans-20260822.webp': names['m_hans'],
              'prison-watch-day5-selected-evidence-01-zh-hant-20260822.jpg': names['f_hant'],
              'prison-watch-day5-selected-evidence-01-zh-hans-20260822.jpg': names['f_hans'],
              'prison-watch-day5-selected-evidence-02-zh-hant-20260822.jpg': names['m_hant'],
              'prison-watch-day5-selected-evidence-02-zh-hans-20260822.jpg': names['m_hans'],
          }

          notes = {
              'zh': (
                  '不是只有42處｜42處是可確認的最低數量',
                  '原始紀錄明載，簡報只挑選部分照片，並未呈現所有傷勢照片；「全身至少42處確定傷勢」是依現有資料仍能辨識、確認的下限。部分傷勢癒合後，死亡時外觀已看不到；頭皮等部位另被描述為傷勢「非常多，族繁不及備載」。因此，不應把42處理解成孩子曾受傷害的完整總數。正式表述應是「至少42處確定傷勢」，而不是只有42處。',
                  '資料依原始紀錄 P.5–6｜查看完整原文',
              ),
              'en': (
                  'Not only 42 injuries | 42 is the confirmed minimum',
                  'The source record states that only some photographs were selected and not every injury photograph was shown. “At least 42 confirmed injuries” is the minimum that could still be identified and confirmed. Some injuries had healed and were no longer visible at death, while injuries including those to the scalp were described as too numerous to list fully. The number 42 must not be read as the complete total of harm the child experienced.',
                  'Based on source record pp. 5–6 | Read the complete passage',
              ),
              'ja': (
                  '42か所だけではない｜42か所は確認できた最低数',
                  '原記録には、説明用資料では一部の写真だけを選び、すべての外傷写真を示していないと明記されています。「全身に少なくとも42か所の確定外傷」は、現存資料から確認できた下限です。治癒後、死亡時には外見から確認できなくなった外傷もあり、頭皮などの外傷は非常に多く、すべてを列挙できないとも説明されています。42か所を傷害の完全な総数と解釈してはいけません。',
                  '原記録5～6頁に基づく｜全文を確認',
              ),
          }

          for page in pages:
              text = page.read_text(encoding='utf-8')

              for old, new in replacement_map.items():
                  text = re.sub(re.escape(old) + r'(?:\?v=[^"\']+)?', new, text)
              for new in names.values():
                  text = re.sub(re.escape(new) + r'(?:\?v=[^"\']+)?', f'{new}?v={version}', text)

              text = re.sub(r'day5\.js\?v=[^"\']+', f'day5.js?v={version}', text)

              language_key = 'en' if '/en/' in page.as_posix() else 'ja' if '/ja/' in page.as_posix() else 'zh'
              title, note_body, source = notes[language_key]
              note = (
                  '<aside id="day5InjuryCountNote" class="day5-injury-count-note" '
                  f'aria-label="{title}"><strong>{title}</strong><p>{note_body}</p>'
                  f'<a href="#record-08">{source}</a></aside>'
              )
              text = re.sub(r'<aside id="day5InjuryCountNote"[^>]*>.*?</aside>', '', text, flags=re.S)
              marker = '<article class="day5-compare-card is-agree"><header><span>04</span>'
              start = text.find(marker)
              end = text.find('</article>', start)
              if start < 0 or end < 0:
                  raise SystemExit(f'Cannot position injury-count note in {page}')
              end += len('</article>')
              text = text[:end] + note + text[end:]

              if language_key == 'zh':
                  text = re.sub(
                      r'<strong>至少42處</strong><small>.*?</small>',
                      '<strong>至少42處</strong><small>42處是可確認下限，不是完整總數</small>',
                      text,
                      count=1,
                  )

              page.write_text(text, encoding='utf-8')

          for script in [
              root / 'hearing-records/prison-watch/kaikai-day5-20250429/day5.js',
              root / 'source/hearing-records/prison-watch/kaikai-day5-20250429/day5.js',
          ]:
              text = script.read_text(encoding='utf-8')
              text = re.sub(r"const posterVersion = '[^']+';", f"const posterVersion = '{version}';", text, count=1)
              script.write_text(text, encoding='utf-8')

          record_files = [
              (root / 'data/hearing-records.json', '../assets/art/'),
              (root / 'en/data/hearing-records.json', '../../assets/art/'),
              (root / 'ja/data/hearing-records.json', '../../assets/art/'),
              (root / 'source/data/hearing-records.json', '../assets/art/'),
              (root / 'source/en/data/hearing-records.json', '../../assets/art/'),
              (root / 'source/ja/data/hearing-records.json', '../../assets/art/'),
          ]
          for path, prefix in record_files:
              data = json.loads(path.read_text(encoding='utf-8'))
              entry = next((item for item in data if item.get('url') == 'prison-watch/kaikai-day5-20250429/'), None)
              if entry is None:
                  raise SystemExit(f'Day 5 entry missing from {path}')
              entry['image'] = prefix + names['f_hant'] + f'?v={version}'
              path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          bulletin = root / 'data/latest-bulletins.json'
          if bulletin.exists():
              data = json.loads(bulletin.read_text(encoding='utf-8'))
              item = next((entry for entry in data.get('items', []) if entry.get('id') == 'kaikai-day5-20250429'), None)
              if item is not None:
                  item['image'] = absolute + names['f_hant'] + f'?v={version}'
                  bulletin.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          sw = root / 'sw.js'
          text = sw.read_text(encoding='utf-8')
          text = re.sub(r"const VERSION = '[^']+';", "const VERSION = '2026-08-22-day5-selected-poster-alias-v3';", text, count=1)
          resources = [f"./assets/art/{name}" for name in names.values()]
          shell_start = text.find('const APP_SHELL = [')
          shell_end = text.find('];', shell_start)
          if shell_start >= 0 and shell_end >= 0:
              segment = text[shell_start:shell_end]
              missing = [resource for resource in resources if resource not in segment]
              if missing:
                  prefix = text[:shell_end].rstrip()
                  if not prefix.endswith(','):
                      prefix += ','
                  prefix += '\n' + ',\n'.join(f"  '{resource}'" for resource in missing) + '\n'
                  text = prefix + text[shell_end:]
          sw.write_text(text, encoding='utf-8')
          PY

          node --check hearing-records/prison-watch/kaikai-day5-20250429/day5.js
          node --check source/hearing-records/prison-watch/kaikai-day5-20250429/day5.js
          git diff --check

      - name: Validate the final visible result
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageStat
          import json

          root = Path('.')
          version = '20260822-selected-poster-alias-v3'
          names = [
              'prison-watch-day5-selected-evidence-01-zh-hant-20260822-v3.jpg',
              'prison-watch-day5-selected-evidence-01-zh-hans-20260822-v3.jpg',
              'prison-watch-day5-selected-evidence-02-zh-hant-20260822-v3.jpg',
              'prison-watch-day5-selected-evidence-02-zh-hans-20260822-v3.jpg',
          ]
          for name in names:
              path = root / 'assets/art' / name
              with Image.open(path) as image:
                  image.load()
                  deviation = ImageStat.Stat(image.convert('L')).stddev[0]
                  if deviation < 24:
                      raise SystemExit(f'Blank alias poster: {path}')

          pages = [
              root / 'hearing-records/prison-watch/kaikai-day5-20250429/index.html',
              root / 'en/hearing-records/prison-watch/kaikai-day5-20250429/index.html',
              root / 'ja/hearing-records/prison-watch/kaikai-day5-20250429/index.html',
              root / 'source/hearing-records/prison-watch/kaikai-day5-20250429/index.html',
              root / 'source/en/hearing-records/prison-watch/kaikai-day5-20250429/index.html',
              root / 'source/ja/hearing-records/prison-watch/kaikai-day5-20250429/index.html',
          ]
          for page in pages:
              text = page.read_text(encoding='utf-8')
              for name in names:
                  if f'{name}?v={version}' not in text:
                      raise SystemExit(f'Fresh alias reference missing from {page}: {name}')
              if f'day5.js?v={version}' not in text:
                  raise SystemExit(f'Fresh script reference missing from {page}')
              if text.count('id="day5InjuryCountNote"') != 1:
                  raise SystemExit(f'Injury-count note missing or duplicated in {page}')

          zh = pages[0].read_text(encoding='utf-8')
          for phrase in ['不是只有42處', '42處是可確認的最低數量', '並未呈現所有傷勢照片', '族繁不及備載']:
              if phrase not in zh:
                  raise SystemExit(f'Missing strengthened note phrase: {phrase}')

          for path in [
              'data/hearing-records.json',
              'en/data/hearing-records.json',
              'ja/data/hearing-records.json',
              'source/data/hearing-records.json',
              'source/en/data/hearing-records.json',
              'source/ja/data/hearing-records.json',
              'data/latest-bulletins.json',
          ]:
              candidate = root / path
              if candidate.exists():
                  json.loads(candidate.read_text(encoding='utf-8'))
          PY
          grep -Fq "const VERSION = '2026-08-22-day5-selected-poster-alias-v3';" sw.js

      - name: Commit verified repair and remove temporary machinery
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github/day5-image-fix .github/day5-poster-repair .github/day5-selected-medical
          rm -f .github/day5-image-alias-v3-trigger.txt
          rm -f .github/day5-visible-images-trigger.txt .github/day5-visible-images-trigger-v2.txt
          rm -f .github/day5-poster-repair-trigger.txt .github/day5-selected-art-trigger.txt
          rm -f .github/workflows/oneoff-day5-image-alias-v3.yml
          rm -f .github/workflows/oneoff-day5-visible-selected-images.yml
          rm -f .github/workflows/oneoff-day5-poster-repair.yml
          rm -f .github/workflows/oneoff-day5-user-selected-art.yml

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && { echo 'No Day 5 image repair changes produced.'; exit 1; }
          git commit -m 'Fix blank Day 5 posters with cache-safe selected images'
          git pull --rebase origin main
          git push origin main
