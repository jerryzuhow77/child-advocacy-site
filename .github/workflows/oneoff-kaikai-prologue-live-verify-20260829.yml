name: Verify Kaikai prologue video on public site

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oneoff-kaikai-prologue-live-verify-20260829.yml'

permissions:
  contents: write

jobs:
  chrome:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate committed media and source
        shell: bash
        run: |
          set -euo pipefail
          video='hearing-records/prison-watch/kaikai-final-chapter/assets/kaikai-final-chapter-prologue.mp4'
          poster='hearing-records/prison-watch/kaikai-final-chapter/assets/kaikai-final-chapter-prologue-poster.jpg'
          test -s "$video"
          test -s "$poster"
          test "$(stat -c %s "$video")" -gt 100000
          test "$(stat -c %s "$video")" -lt 26214400
          file "$video" | grep -qi 'ISO Media\|MP4'
          file "$poster" | grep -qi 'JPEG image'
          grep -q 'id="prologue-film"' hearing-records/prison-watch/kaikai-final-chapter/index.html
          grep -q 'id="prologue-film"' hearing-records/prison-watch/kaikai-final-chapter/zh-Hans/index.html
          grep -q 'autoplay muted playsinline' hearing-records/prison-watch/kaikai-final-chapter/index.html
          grep -q 'autoplay muted playsinline' hearing-records/prison-watch/kaikai-final-chapter/zh-Hans/index.html
          grep -q 'PROLOGUE-VIDEO-20260829' hearing-records/prison-watch/kaikai-final-chapter/final-chapter.js
          grep -q 'PROLOGUE-VIDEO-20260829' hearing-records/prison-watch/kaikai-final-chapter/final-chapter.css
          node --check hearing-records/prison-watch/kaikai-final-chapter/final-chapter.js
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,pix_fmt,width,height -of default=nw=1 "$video" | tee /tmp/prologue-video.txt
          grep -q 'codec_name=h264' /tmp/prologue-video.txt
          grep -q 'pix_fmt=yuv420p' /tmp/prologue-video.txt

      - name: Wait for GitHub Pages deployment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p browser-validation/prologue
          urls=(
            'https://jerryzuhow77.github.io/child-advocacy-site/hearing-records/prison-watch/kaikai-final-chapter/'
            'https://jerryzuhow77.github.io/child-advocacy-site/hearing-records/prison-watch/kaikai-final-chapter/zh-Hans/'
          )
          for attempt in $(seq 1 75); do
            ready=1
            i=0
            for url in "${urls[@]}"; do
              i=$((i + 1))
              html="browser-validation/prologue/page-${i}.html"
              curl -fsSL --connect-timeout 15 --max-time 30 "${url}?deploy=${GITHUB_SHA}-${attempt}" -o "$html" || ready=0
              grep -q 'id="prologue-film"' "$html" || ready=0
              grep -q 'kaikai-final-chapter-prologue.mp4' "$html" || ready=0
              grep -q 'final-chapter.js?v=20260829-8' "$html" || ready=0
            done
            if [[ "$ready" -eq 1 ]]; then
              video_url='https://jerryzuhow77.github.io/child-advocacy-site/hearing-records/prison-watch/kaikai-final-chapter/assets/kaikai-final-chapter-prologue.mp4'
              poster_url='https://jerryzuhow77.github.io/child-advocacy-site/hearing-records/prison-watch/kaikai-final-chapter/assets/kaikai-final-chapter-prologue-poster.jpg'
              curl -fsSI --connect-timeout 15 --max-time 30 "$video_url?deploy=${GITHUB_SHA}-${attempt}" | tee browser-validation/prologue/video-headers.txt
              curl -fsSI --connect-timeout 15 --max-time 30 "$poster_url?deploy=${GITHUB_SHA}-${attempt}" | tee browser-validation/prologue/poster-headers.txt
              grep -Eqi '^content-type: *video/mp4' browser-validation/prologue/video-headers.txt
              grep -Eqi '^content-type: *image/jpeg' browser-validation/prologue/poster-headers.txt
              exit 0
            fi
            sleep 10
          done
          echo 'Timed out before both public pages exposed the prologue video.' >&2
          exit 1

      - name: Install Playwright driver
        run: npm install --no-save playwright-core@1.55.0

      - name: Run desktop and mobile Chrome checks
        run: |
          node --input-type=module <<'JS'
          import { chromium } from 'playwright-core';
          import fs from 'node:fs';

          const output = 'browser-validation/prologue';
          fs.mkdirSync(output, { recursive: true });
          const sites = {
            'zh-Hant': {
              url: 'https://jerryzuhow77.github.io/child-advocacy-site/hearing-records/prison-watch/kaikai-final-chapter/',
              heading: '在閱讀終章之前',
              skip: '略過影片，進入正文'
            },
            'zh-Hans': {
              url: 'https://jerryzuhow77.github.io/child-advocacy-site/hearing-records/prison-watch/kaikai-final-chapter/zh-Hans/',
              heading: '在阅读终章之前',
              skip: '略过视频，进入正文'
            }
          };
          const viewports = {
            desktop: { width: 1440, height: 1000 },
            mobile: { width: 390, height: 844 }
          };

          const browser = await chromium.launch({
            headless: true,
            executablePath: '/usr/bin/google-chrome',
            args: [
              '--no-sandbox',
              '--disable-dev-shm-usage',
              '--autoplay-policy=no-user-gesture-required'
            ]
          });
          const results = [];
          let failed = false;

          for (const [language, site] of Object.entries(sites)) {
            for (const [viewportName, viewport] of Object.entries(viewports)) {
              const context = await browser.newContext({
                viewport,
                locale: language === 'zh-Hant' ? 'zh-TW' : 'zh-CN',
                colorScheme: 'light',
                reducedMotion: 'no-preference'
              });
              const page = await context.newPage();
              const pageErrors = [];
              const sameOriginErrors = [];
              const failedRequests = [];
              page.on('pageerror', error => pageErrors.push(String(error)));
              page.on('response', response => {
                const parsed = new URL(response.url());
                if (parsed.hostname === 'jerryzuhow77.github.io' && response.status() >= 400) {
                  sameOriginErrors.push({ url: response.url(), status: response.status() });
                }
              });
              page.on('requestfailed', request => {
                failedRequests.push({ url: request.url(), type: request.resourceType(), error: request.failure()?.errorText || '' });
              });

              const response = await page.goto(`${site.url}?qa=${Date.now()}-${language}-${viewportName}#prologue-film`, {
                waitUntil: 'domcontentloaded',
                timeout: 60000
              });
              await page.waitForSelector('#prologue-film', { state: 'visible', timeout: 15000 });
              await page.waitForSelector('[data-prologue-video]', { state: 'visible', timeout: 15000 });
              await page.waitForFunction(() => {
                const video = document.querySelector('[data-prologue-video]');
                return video instanceof HTMLVideoElement && video.readyState >= 2 && video.duration > 0 && video.videoWidth > 0;
              }, null, { timeout: 30000 });
              await page.waitForTimeout(1800);

              const initial = await page.evaluate(({ heading, skip }) => {
                const section = document.getElementById('prologue-film');
                const video = section.querySelector('[data-prologue-video]');
                const rect = section.getBoundingClientRect();
                const poster = new Image();
                poster.src = video.poster;
                return {
                  hash: location.hash,
                  headingPresent: (section.textContent || '').includes(heading),
                  skipPresent: [...section.querySelectorAll('[data-prologue-skip]')].some(link => (link.textContent || '').trim() === skip),
                  controls: video.controls,
                  muted: video.muted,
                  autoplayAttribute: video.hasAttribute('autoplay'),
                  playsInline: video.playsInline,
                  preload: video.preload,
                  currentTime: video.currentTime,
                  paused: video.paused,
                  duration: video.duration,
                  videoWidth: video.videoWidth,
                  videoHeight: video.videoHeight,
                  currentSrc: video.currentSrc,
                  poster: video.poster,
                  posterComplete: poster.complete,
                  sectionTop: Math.round(rect.top),
                  sectionVisible: rect.top < innerHeight && rect.bottom > 0,
                  overflow: Math.max(0, Math.max(document.documentElement.scrollWidth, document.body.scrollWidth) - innerWidth),
                  sourceCount: video.querySelectorAll('source[type="video/mp4"]').length,
                  idCount: document.querySelectorAll('#prologue-film').length
                };
              }, site);

              await page.locator('[data-prologue-video]').evaluate(async video => {
                video.muted = true;
                await video.play();
              });
              await page.waitForTimeout(1400);
              const playback = await page.locator('[data-prologue-video]').evaluate(video => ({
                paused: video.paused,
                currentTime: video.currentTime,
                readyState: video.readyState,
                networkState: video.networkState
              }));

              await page.locator('[data-prologue-skip]').click();
              await page.waitForFunction(() => location.hash === '#chapter-after-prologue', null, { timeout: 5000 });
              await page.waitForTimeout(500);
              const skipped = await page.evaluate(() => {
                const video = document.querySelector('[data-prologue-video]');
                const target = document.getElementById('chapter-after-prologue');
                const rect = target.getBoundingClientRect();
                return {
                  hash: location.hash,
                  paused: video.paused,
                  targetTop: Math.round(rect.top),
                  targetNearViewport: rect.top >= 0 && rect.top <= 160
                };
              });

              await page.goto(`${site.url}?qa=reload-${Date.now()}-${language}-${viewportName}#prologue-film`, {
                waitUntil: 'domcontentloaded', timeout: 60000
              });
              await page.waitForSelector('#prologue-film', { state: 'visible', timeout: 15000 });
              await page.reload({ waitUntil: 'domcontentloaded', timeout: 60000 });
              await page.waitForSelector('#prologue-film', { state: 'visible', timeout: 15000 });
              await page.waitForTimeout(900);
              const reload = await page.evaluate(() => {
                const rect = document.getElementById('prologue-film').getBoundingClientRect();
                return {
                  hash: location.hash,
                  sectionVisible: rect.top < innerHeight && rect.bottom > 0,
                  top: Math.round(rect.top),
                  overflow: Math.max(0, Math.max(document.documentElement.scrollWidth, document.body.scrollWidth) - innerWidth)
                };
              });

              await page.screenshot({ path: `${output}/${language}-${viewportName}-prologue.png`, fullPage: false });

              const relevantFailures = failedRequests.filter(item =>
                !(item.type === 'media' && item.error === 'net::ERR_ABORTED')
              );
              const checks = {
                http200: response?.status() === 200,
                correctDeepLink: initial.hash === '#prologue-film' && initial.sectionVisible,
                copyPresent: initial.headingPresent && initial.skipPresent,
                videoAttributes: initial.controls && initial.muted && initial.autoplayAttribute && initial.playsInline && initial.preload === 'metadata',
                mediaDecoded: initial.duration > 0 && initial.videoWidth > 0 && initial.videoHeight > 0 && initial.sourceCount === 1,
                sourceCorrect: initial.currentSrc.endsWith('/assets/kaikai-final-chapter-prologue.mp4'),
                posterCorrect: initial.poster.endsWith('/assets/kaikai-final-chapter-prologue-poster.jpg'),
                uniqueSection: initial.idCount === 1,
                playbackWorks: playback.readyState >= 2 && playback.currentTime > 0.2 && !playback.paused,
                skipWorks: skipped.hash === '#chapter-after-prologue' && skipped.paused && skipped.targetNearViewport,
                reloadWorks: reload.hash === '#prologue-film' && reload.sectionVisible,
                noHorizontalOverflow: initial.overflow <= 2 && reload.overflow <= 2,
                noPageErrors: pageErrors.length === 0,
                noSameOriginErrors: sameOriginErrors.length === 0,
                noRelevantRequestFailures: relevantFailures.length === 0
              };
              const passed = Object.values(checks).every(Boolean);
              if (!passed) failed = true;
              results.push({
                language,
                viewport: viewportName,
                dimensions: viewport,
                checks,
                initial,
                playback,
                skipped,
                reload,
                pageErrors,
                sameOriginErrors,
                relevantFailures,
                passed
              });
              await context.close();
            }
          }

          await browser.close();
          fs.writeFileSync(`${output}/report.json`, JSON.stringify({ generatedAt: new Date().toISOString(), results }, null, 2));
          const summary = ['# Kaikai prologue video browser verification', ''];
          for (const result of results) {
            summary.push(`## ${result.language} · ${result.viewport} (${result.dimensions.width}×${result.dimensions.height})`);
            summary.push(`- Result: ${result.passed ? 'PASS' : 'FAIL'}`);
            summary.push(`- Video: ${Math.round(result.initial.duration * 10) / 10}s, ${result.initial.videoWidth}×${result.initial.videoHeight}`);
            summary.push(`- Playback: currentTime=${result.playback.currentTime.toFixed(2)}s, paused=${result.playback.paused}`);
            summary.push(`- Skip: hash=${result.skipped.hash}, paused=${result.skipped.paused}, targetTop=${result.skipped.targetTop}`);
            summary.push(`- Errors: page=${result.pageErrors.length}, HTTP=${result.sameOriginErrors.length}, requests=${result.relevantFailures.length}`);
            summary.push('');
          }
          fs.writeFileSync(`${output}/summary.md`, summary.join('\n'));
          console.log(summary.join('\n'));
          if (failed) process.exit(1);
          JS

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kaikai-prologue-video-browser-verification
          path: browser-validation/prologue
          retention-days: 14

      - name: Remove completed one-off workflow and probes
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main
          git rm -f .github/workflows/oneoff-kaikai-prologue-live-verify-20260829.yml
          git rm -f tmp/test-upload-path.txt tmp/local-file-upload-probe.bin tmp/second-probe.txt tmp/connector-file-probe.json tmp/do-not-keep.txt tmp/file-parameter-probe.txt || true
          git rm -f hearing-records/prison-watch/kaikai-final-chapter/assets/1000026713.mp4 || true
          rmdir tmp 2>/dev/null || true
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Remove completed prologue video validation workflow'
          git push origin HEAD:main
