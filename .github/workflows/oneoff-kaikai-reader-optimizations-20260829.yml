name: Publish and verify Kaikai reader optimizations

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oneoff-kaikai-reader-optimizations-20260829.yml'

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch all reader, medical, audio, source, and performance improvements
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin main
          python -m py_compile .github/scripts/patch-kaikai-reader-optimizations-20260829.py
          python .github/scripts/patch-kaikai-reader-optimizations-20260829.py
          python - <<'PY'
          from pathlib import Path
          path = Path('hearing-records/prison-watch/kaikai-final-chapter/final-chapter.js')
          text = path.read_text(encoding='utf-8')
          text = text.replace("    audioController?.classList.toggle('is-playing', playing);\n", '')
          path.write_text(text, encoding='utf-8')
          PY
          node --check hearing-records/prison-watch/kaikai-final-chapter/final-chapter.js
          git diff --check
          grep -q 'READER-OPTIMIZATIONS-20260829' hearing-records/prison-watch/kaikai-final-chapter/index.html
          grep -q 'READER-OPTIMIZATIONS-20260829' hearing-records/prison-watch/kaikai-final-chapter/zh-Hans/index.html
          grep -q 'READER-OPTIMIZATIONS-20260829' hearing-records/prison-watch/kaikai-final-chapter/final-chapter.css
          grep -q 'READER-OPTIMIZATIONS-20260829' hearing-records/prison-watch/kaikai-final-chapter/final-chapter.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hearing-records/prison-watch/kaikai-final-chapter/index.html
          git add hearing-records/prison-watch/kaikai-final-chapter/zh-Hans/index.html
          git add hearing-records/prison-watch/kaikai-final-chapter/final-chapter.css
          git add hearing-records/prison-watch/kaikai-final-chapter/final-chapter.js
          git commit -m 'Implement all next-round Chapter 2 reader optimizations'
          pushed=0
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              pushed=1
              break
            fi
            git pull --rebase origin main
          done
          test "$pushed" -eq 1

      - name: Wait for GitHub Pages to expose the new version
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p browser-validation/reader-optimizations
          urls=(
            'https://jerryzuhow77.github.io/child-advocacy-site/hearing-records/prison-watch/kaikai-final-chapter/'
            'https://jerryzuhow77.github.io/child-advocacy-site/hearing-records/prison-watch/kaikai-final-chapter/zh-Hans/'
          )
          css_url='https://jerryzuhow77.github.io/child-advocacy-site/hearing-records/prison-watch/kaikai-final-chapter/final-chapter.css'
          js_url='https://jerryzuhow77.github.io/child-advocacy-site/hearing-records/prison-watch/kaikai-final-chapter/final-chapter.js'
          for attempt in $(seq 1 105); do
            ready=1
            for url in "${urls[@]}"; do
              html="$(curl -fsSL --connect-timeout 15 --max-time 30 "${url}?qa=${GITHUB_SHA}-${attempt}" || true)"
              grep -q 'final-chapter.css?v=20260829-22' <<<"$html" || ready=0
              grep -q 'final-chapter.js?v=20260829-9' <<<"$html" || ready=0
              grep -q 'class="medical-alert-loop"' <<<"$html" || ready=0
              grep -q 'data-reading-route="guided"' <<<"$html" || ready=0
              grep -q 'data-audio-collapse' <<<"$html" || ready=0
            done
            css="$(curl -fsSL --connect-timeout 15 --max-time 30 "${css_url}?v=20260829-22&qa=${GITHUB_SHA}-${attempt}" || true)"
            js="$(curl -fsSL --connect-timeout 15 --max-time 30 "${js_url}?v=20260829-9&qa=${GITHUB_SHA}-${attempt}" || true)"
            grep -q 'READER-OPTIMIZATIONS-20260829' <<<"$css" || ready=0
            grep -q 'READER-OPTIMIZATIONS-20260829' <<<"$js" || ready=0
            if [[ "$ready" -eq 1 ]]; then
              echo 'All reader optimizations are live in both languages.'
              exit 0
            fi
            sleep 10
          done
          echo 'Timed out before GitHub Pages exposed the new reader optimizations.' >&2
          exit 1

      - name: Install Playwright driver
        run: npm install --no-save playwright-core@1.55.0

      - name: Run Traditional and Simplified desktop and mobile Chrome verification
        run: node .github/scripts/verify-kaikai-reader-optimizations-20260829.mjs

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kaikai-reader-optimizations-browser-proof
          path: browser-validation/reader-optimizations
          retention-days: 14

      - name: Remove completed one-off tools
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main
          git rm .github/workflows/oneoff-kaikai-reader-optimizations-20260829.yml
          git rm .github/scripts/patch-kaikai-reader-optimizations-20260829.py
          git rm .github/scripts/verify-kaikai-reader-optimizations-20260829.mjs
          git commit -m 'Remove completed Chapter 2 reader optimization tools'
          pushed=0
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              pushed=1
              break
            fi
            git pull --rebase origin main
          done
          test "$pushed" -eq 1
