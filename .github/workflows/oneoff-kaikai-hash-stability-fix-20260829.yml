name: Fix Kaikai deep-link layout shifts v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oneoff-kaikai-hash-stability-fix-20260829.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply deep-link stability patch
        run: python scripts/fix-kaikai-hash-stability-20260829.py

      - name: Validate JavaScript and cache keys
        run: |
          git diff --check
          node --check hearing-records/prison-watch/kaikai-final-chapter/final-chapter.js
          grep -q 'const stabilizeHashTarget' hearing-records/prison-watch/kaikai-final-chapter/final-chapter.js
          grep -q 'applyReadingDepth(Boolean(location.hash))' hearing-records/prison-watch/kaikai-final-chapter/final-chapter.js
          grep -q 'final-chapter.js?v=20260829-6' hearing-records/prison-watch/kaikai-final-chapter/index.html
          grep -q 'final-chapter.js?v=20260829-6' hearing-records/prison-watch/kaikai-final-chapter/zh-Hans/index.html

      - name: Commit patch and remove one-off files
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add hearing-records/prison-watch/kaikai-final-chapter/final-chapter.js hearing-records/prison-watch/kaikai-final-chapter/index.html hearing-records/prison-watch/kaikai-final-chapter/zh-Hans/index.html
          git rm scripts/fix-kaikai-hash-stability-20260829.py .github/workflows/oneoff-kaikai-hash-stability-fix-20260829.yml
          git commit -m 'Stabilize Kaikai deep-link navigation'
          git push origin HEAD:main