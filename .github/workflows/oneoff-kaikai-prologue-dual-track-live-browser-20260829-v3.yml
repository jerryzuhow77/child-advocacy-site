name: Kaikai prologue and dual-track live browser proof v3

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oneoff-kaikai-prologue-dual-track-live-browser-20260829-v3.yml'

permissions:
  contents: read

jobs:
  live-chrome-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Install Playwright driver
        run: npm install --no-save playwright-core@1.55.0

      - name: Exercise public media in Chrome
        run: |
          mkdir -p browser-proof
          node --input-type=module <<'JS'
          import { chromium } from 'playwright-core';
          import fs from 'node:fs';

          const sites = {
            'zh-Hant': 'https://jerryzuhow77.github.io/child-advocacy-site/hearing-records/prison-watch/kaikai-final-chapter/',
            'zh-Hans': 'https://jerryzuhow77.github.io/child-advocacy-site/hearing-records/prison-watch/kaikai-final-chapter/zh-Hans/'
          };
          const viewports = {
            desktop: { width: 1440, height: 1000, mobile: false },
            mobile: { width: 390, height: 844, mobile: true }
          };
          const out = 'browser-proof';
          const results = [];
          const browser = await chromium.launch({
            headless: true,
            executablePath: '/usr/bin/google-chrome',
            args: ['--no-sandbox', '--disable-dev-shm-usage', '--autoplay-policy=no-user-gesture-required']
          });

          const snapshot = (page, selector) => page.locator(selector).evaluate((media) => ({
            autoplay: media.autoplay,
            muted: media.muted,
            playsInline: media.playsInline,
            paused: media.paused,
            ended: media.ended,
            currentTime: Number(media.currentTime.toFixed(3)),
            duration: Number.isFinite(media.duration) ? Number(media.duration.toFixed(3)) : null,
            readyState: media.readyState,
            networkState: media.networkState,
            currentSrc: media.currentSrc,
            error: media.error ? { code: media.error.code, message: media.error.message || '' } : null,
            trackIndex: media.dataset.trackIndex ?? null,
            trackCount: media.dataset.trackCount ?? null,
            trackTitle: media.dataset.trackTitle ?? null,
            sources: [...media.querySelectorAll('source')].map((source) => ({ src: source.src, type: source.type }))
          }));

          const waitMetadata = (page, selector, timeout = 30000) => page.waitForFunction((sel) => {
            const media = document.querySelector(sel);
            return media && media.readyState >= 1 && Number.isFinite(media.duration) && media.duration > 0;
          }, selector, { timeout });

          const head = async (request, url) => {
            try {
              const response = await request.fetch(url, { method: 'HEAD', timeout: 30000, failOnStatusCode: false });
              return { url, status: response.status(), type: response.headers()['content-type'] || '', length: response.headers()['content-length'] || '' };
            } catch (error) {
              return { url, status: 0, error: String(error?.message || error) };
            }
          };

          for (const [language, url] of Object.entries(sites)) {
            for (const [viewportName, viewport] of Object.entries(viewports)) {
              const context = await browser.newContext({
                viewport: { width: viewport.width, height: viewport.height },
                locale: language === 'zh-Hant' ? 'zh-TW' : 'zh-CN',
                isMobile: viewport.mobile,
                hasTouch: viewport.mobile,
                deviceScaleFactor: viewport.mobile ? 2 : 1
              });
              const page = await context.newPage();
              const result = {
                language,
                viewport: viewportName,
                size: `${viewport.width}x${viewport.height}`,
                status: null,
                script: '',
                video: {},
                audio: {},
                layout: {},
                mediaHeads: [],
                pageErrors: [],
                httpErrors: [],
                failures: []
              };
              results.push(result);
              const fail = (message) => result.failures.push(message);

              await page.addInitScript(() => {
                window.__mediaEvents = [];
                window.__cls = 0;
                const record = (event) => {
                  const media = event.target;
                  if (!(media instanceof HTMLMediaElement)) return;
                  window.__mediaEvents.push({
                    type: event.type,
                    tag: media.tagName,
                    id: media.id || '',
                    prologue: media.hasAttribute('data-prologue-video'),
                    currentTime: Number(media.currentTime.toFixed(3)),
                    src: media.currentSrc || media.src || ''
                  });
                };
                for (const type of ['loadstart', 'loadedmetadata', 'canplay', 'play', 'playing', 'pause', 'ended', 'error']) {
                  document.addEventListener(type, record, true);
                }
                try {
                  new PerformanceObserver((list) => {
                    for (const entry of list.getEntries()) if (!entry.hadRecentInput) window.__cls += entry.value;
                  }).observe({ type: 'layout-shift', buffered: true });
                } catch (_) {}
              });

              page.on('pageerror', (error) => result.pageErrors.push(String(error)));
              page.on('response', (response) => {
                const parsed = new URL(response.url());
                if (parsed.hostname === 'jerryzuhow77.github.io' && response.status() >= 400) {
                  result.httpErrors.push({ status: response.status(), url: response.url() });
                }
              });

              try {
                const response = await page.goto(`${url}?live-media-proof=${Date.now()}-${language}-${viewportName}`, {
                  waitUntil: 'domcontentloaded', timeout: 60000
                });
                result.status = response?.status() ?? null;
                if (result.status !== 200) fail(`page HTTP ${result.status}`);

                await page.waitForSelector('[data-prologue-video]', { state: 'attached', timeout: 20000 });
                await page.waitForSelector('#chapterBgm', { state: 'attached', timeout: 20000 });
                await page.waitForFunction(() => document.documentElement.classList.contains('js-ready'), undefined, { timeout: 12000 });
                result.script = await page.locator('script[src*="final-chapter.js"]').getAttribute('src') || '';
                if (!result.script.includes('final-chapter.js')) fail(`final-chapter script missing: ${result.script}`);

                await waitMetadata(page, '[data-prologue-video]');
                await page.evaluate(async () => { await document.fonts.ready; });
                const beforeLayout = await page.evaluate(() => {
                  const hero = document.querySelector('.hero')?.getBoundingClientRect();
                  const prologue = document.querySelector('#prologue-film')?.getBoundingClientRect();
                  return {
                    heroHeight: Math.round(hero?.height || 0),
                    prologueTop: Math.round(prologue?.top || 0),
                    prologueHeight: Math.round(prologue?.height || 0),
                    overflow: Math.max(document.documentElement.scrollWidth, document.body.scrollWidth) - innerWidth
                  };
                });

                const videoBefore = await snapshot(page, '[data-prologue-video]');
                await page.waitForTimeout(650);
                const videoAfter = await snapshot(page, '[data-prologue-video]');
                const videoEvents = await page.evaluate(() => (window.__mediaEvents || []).filter((event) => event.prologue));
                result.video = { before: videoBefore, after: videoAfter, events: videoEvents };
                if (!videoBefore.autoplay) fail('prologue autoplay=false');
                if (!videoBefore.muted) fail('prologue muted=false');
                if (!videoBefore.playsInline) fail('prologue playsInline=false');
                if (videoBefore.error || videoAfter.error) fail(`prologue error ${JSON.stringify(videoBefore.error || videoAfter.error)}`);
                if (!(videoAfter.duration >= 3 && videoAfter.duration <= 10)) fail(`unexpected prologue duration ${videoAfter.duration}`);
                if (!videoEvents.some((event) => event.type === 'play' || event.type === 'playing')) fail('prologue did not autoplay');
                if (!(videoAfter.currentTime > videoBefore.currentTime || videoAfter.ended || videoEvents.some((event) => event.type === 'ended'))) fail('prologue time did not advance');

                const videoUrls = [...new Set([videoAfter.currentSrc, ...videoAfter.sources.map((source) => source.src)].filter(Boolean))];
                for (const mediaUrl of videoUrls) result.mediaHeads.push(await head(context.request, mediaUrl));

                await waitMetadata(page, '#chapterBgm');
                const audioInitial = await snapshot(page, '#chapterBgm');
                const toggle = page.locator('.audio-toggle');
                result.audio.initial = { media: audioInitial, counter: await page.locator('[data-audio-time]').textContent() };
                if (audioInitial.trackCount !== '2') fail(`trackCount=${audioInitial.trackCount}`);
                if (audioInitial.trackIndex !== '0') fail(`initial trackIndex=${audioInitial.trackIndex}`);
                if (!/歲月深處的告白|岁月深处的告白/.test(audioInitial.trackTitle || '')) fail(`first title=${audioInitial.trackTitle}`);
                if (!String(result.audio.initial.counter).includes('1/2')) fail(`initial counter=${result.audio.initial.counter}`);

                await toggle.click();
                await page.waitForFunction(() => {
                  const audio = document.querySelector('#chapterBgm');
                  return audio && !audio.paused && audio.currentTime > 0.04;
                }, undefined, { timeout: 12000 });
                await page.locator('#chapterBgm').evaluate((audio) => { audio.playbackRate = 16; });
                const firstPlaying = await snapshot(page, '#chapterBgm');
                if (firstPlaying.error || firstPlaying.paused) fail(`first track playback failed ${JSON.stringify(firstPlaying.error)}`);

                await page.waitForFunction(() => document.querySelector('#chapterBgm')?.dataset.trackIndex === '1', undefined, { timeout: 20000 });
                await waitMetadata(page, '#chapterBgm');
                await page.locator('#chapterBgm').evaluate((audio) => { audio.playbackRate = 16; });
                await page.waitForFunction(() => {
                  const audio = document.querySelector('#chapterBgm');
                  return audio && audio.dataset.trackIndex === '1' && !audio.paused && audio.currentTime > 0.04;
                }, undefined, { timeout: 15000 });
                const secondPlaying = await snapshot(page, '#chapterBgm');
                result.audio.second = { media: secondPlaying, counter: await page.locator('[data-audio-time]').textContent() };
                if (secondPlaying.error || secondPlaying.paused) fail(`second track playback failed ${JSON.stringify(secondPlaying.error)}`);
                if (secondPlaying.trackTitle !== '退潮的街') fail(`second title=${secondPlaying.trackTitle}`);
                if (secondPlaying.trackIndex !== '1') fail(`second trackIndex=${secondPlaying.trackIndex}`);
                if (!secondPlaying.sources.some((source) => source.src.includes('kaikai-chapter2-bgm-02-20260829'))) fail('second source filename missing');
                if (!String(result.audio.second.counter).includes('2/2')) fail(`second counter=${result.audio.second.counter}`);
                await page.screenshot({ path: `${out}/${language}_${viewportName}_track2.png`, fullPage: false });

                const audioUrls = await page.evaluate(() => {
                  const directory = new URL('../../../assets/audio/', document.baseURI);
                  return [
                    new URL('kaikai-chapter2-bgm-20260828.webm', directory).href,
                    new URL('kaikai-chapter2-bgm-20260828.m4a', directory).href,
                    new URL('kaikai-chapter2-bgm-02-20260829.webm', directory).href,
                    new URL('kaikai-chapter2-bgm-02-20260829.m4a', directory).href
                  ];
                });
                for (const mediaUrl of audioUrls) result.mediaHeads.push(await head(context.request, mediaUrl));

                await page.waitForFunction(() => document.querySelector('#chapterBgm')?.dataset.trackIndex === '0', undefined, { timeout: 50000 });
                await waitMetadata(page, '#chapterBgm');
                const wrapped = await snapshot(page, '#chapterBgm');
                result.audio.wrapped = { media: wrapped, counter: await page.locator('[data-audio-time]').textContent() };
                if (wrapped.trackIndex !== '0' || wrapped.paused) fail('track 2 did not wrap to playing track 1');
                if (!String(result.audio.wrapped.counter).includes('1/2')) fail(`wrapped counter=${result.audio.wrapped.counter}`);
                await page.locator('#chapterBgm').evaluate((audio) => audio.pause());

                const badHeads = result.mediaHeads.filter((item) => ![200, 206].includes(item.status));
                if (badHeads.length) fail(`media HTTP failure ${JSON.stringify(badHeads)}`);

                if (viewport.mobile) {
                  await page.evaluate(() => window.scrollTo(0, 520));
                  await page.waitForTimeout(500);
                  const collapsed = await page.locator('[data-audio-controller]').evaluate((controller) => ({
                    collapsed: controller.classList.contains('is-collapsed'),
                    expanded: controller.querySelector('[data-audio-collapse]')?.getAttribute('aria-expanded')
                  }));
                  result.audio.mobileCollapsed = collapsed;
                  if (!collapsed.collapsed || collapsed.expanded !== 'false') fail(`mobile collapse failed ${JSON.stringify(collapsed)}`);
                  await page.locator('[data-audio-collapse]').click();
                  await page.waitForTimeout(180);
                  const reopened = await page.locator('[data-audio-controller]').evaluate((controller) => ({
                    collapsed: controller.classList.contains('is-collapsed'),
                    expanded: controller.querySelector('[data-audio-collapse]')?.getAttribute('aria-expanded')
                  }));
                  result.audio.mobileReopened = reopened;
                  if (reopened.collapsed || reopened.expanded !== 'true') fail(`mobile reopen failed ${JSON.stringify(reopened)}`);
                  await page.evaluate(() => window.scrollTo(0, 0));
                  await page.waitForTimeout(250);
                }

                const afterLayout = await page.evaluate(() => {
                  const hero = document.querySelector('.hero')?.getBoundingClientRect();
                  const prologue = document.querySelector('#prologue-film')?.getBoundingClientRect();
                  return {
                    heroHeight: Math.round(hero?.height || 0),
                    prologueTop: Math.round(prologue?.top || 0),
                    prologueHeight: Math.round(prologue?.height || 0),
                    overflow: Math.max(document.documentElement.scrollWidth, document.body.scrollWidth) - innerWidth,
                    cls: Number((window.__cls || 0).toFixed(4))
                  };
                });
                result.layout = {
                  before: beforeLayout,
                  after: afterLayout,
                  heroDelta: Math.abs(afterLayout.heroHeight - beforeLayout.heroHeight),
                  prologueTopDelta: Math.abs(afterLayout.prologueTop - beforeLayout.prologueTop),
                  prologueHeightDelta: Math.abs(afterLayout.prologueHeight - beforeLayout.prologueHeight)
                };
                if (Math.max(beforeLayout.overflow, afterLayout.overflow) > 2) fail(`horizontal overflow ${Math.max(beforeLayout.overflow, afterLayout.overflow)}px`);
                if (result.layout.heroDelta > 24 || result.layout.prologueTopDelta > 24 || result.layout.prologueHeightDelta > 24) fail(`media layout shift ${JSON.stringify(result.layout)}`);
                if (afterLayout.cls > 0.6) fail(`severe CLS ${afterLayout.cls}`);

                result.mediaEvents = await page.evaluate(() => window.__mediaEvents || []);
                const mediaErrors = result.mediaEvents.filter((event) => event.type === 'error');
                if (mediaErrors.length) fail(`media error events ${JSON.stringify(mediaErrors)}`);
                if (result.pageErrors.length) fail(`${result.pageErrors.length} page error(s)`);
                if (result.httpErrors.length) fail(`${result.httpErrors.length} same-origin HTTP error(s)`);
              } catch (error) {
                fail(`exception: ${error?.message || error}`);
                result.exception = String(error?.stack || error);
                await page.screenshot({ path: `${out}/${language}_${viewportName}_exception.png`, fullPage: false }).catch(() => {});
              }

              await context.close();
            }
          }

          await browser.close();
          fs.writeFileSync(`${out}/report.json`, JSON.stringify({ generatedAt: new Date().toISOString(), results }, null, 2));
          const lines = ['# Kaikai prologue and dual-track live browser proof v3', ''];
          for (const result of results) {
            lines.push(`## ${result.language} · ${result.viewport} (${result.size})`);
            lines.push(`- HTTP: ${result.status}; script: ${result.script || 'missing'}`);
            lines.push(`- Prologue: duration=${result.video.after?.duration ?? 'n/a'}s, autoplay=${result.video.before?.autoplay ?? 'n/a'}, muted=${result.video.before?.muted ?? 'n/a'}, events=${result.video.events?.map((event) => event.type).join(',') || 'none'}`);
            lines.push(`- Track 1: ${result.audio.initial?.media?.trackTitle || 'n/a'}; counter=${result.audio.initial?.counter || 'n/a'}`);
            lines.push(`- Track 2: ${result.audio.second?.media?.trackTitle || 'n/a'}; playing=${result.audio.second?.media ? !result.audio.second.media.paused : false}; counter=${result.audio.second?.counter || 'n/a'}`);
            lines.push(`- Wrap 2→1: index=${result.audio.wrapped?.media?.trackIndex ?? 'n/a'}; playing=${result.audio.wrapped?.media ? !result.audio.wrapped.media.paused : false}; counter=${result.audio.wrapped?.counter || 'n/a'}`);
            if (result.audio.mobileCollapsed) lines.push(`- Mobile controller: collapsed=${result.audio.mobileCollapsed.collapsed}; reopened=${!result.audio.mobileReopened?.collapsed}`);
            lines.push(`- Media URLs checked: ${result.mediaHeads.length}; bad=${result.mediaHeads.filter((item) => ![200,206].includes(item.status)).length}`);
            lines.push(`- Overflow=${Math.max(result.layout.before?.overflow || 0, result.layout.after?.overflow || 0)}px; CLS=${result.layout.after?.cls ?? 'n/a'}`);
            lines.push(`- Page errors=${result.pageErrors.length}; HTTP errors=${result.httpErrors.length}`);
            lines.push(`- Failures: ${result.failures.length ? result.failures.join(' | ') : 'none'}`);
            lines.push('');
          }
          const failures = results.reduce((sum, result) => sum + result.failures.length, 0);
          lines.push(`**Total failures: ${failures}**`);
          fs.writeFileSync(`${out}/summary.md`, lines.join('\n'));
          console.log(lines.join('\n'));
          if (failures) process.exit(1);
          JS

      - name: Upload browser proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kaikai-prologue-dual-track-live-browser-proof-v3
          path: browser-proof
          retention-days: 14
