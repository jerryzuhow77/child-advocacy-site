name: Fix Kaikai nested evidence deep links v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oneoff-kaikai-generic-hash-fix-20260829.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply nested hash-target fix
        run: python scripts/fix-kaikai-generic-hash-20260829.py

      - name: Validate patch
        run: |
          git diff --check
          node --check hearing-records/prison-watch/kaikai-final-chapter/final-chapter.js
          grep -q 'final-chapter.js?v=20260829-7' hearing-records/prison-watch/kaikai-final-chapter/index.html
          grep -q 'final-chapter.js?v=20260829-7' hearing-records/prison-watch/kaikai-final-chapter/zh-Hans/index.html

      - name: Commit patch and remove one-off files
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add hearing-records/prison-watch/kaikai-final-chapter/final-chapter.js hearing-records/prison-watch/kaikai-final-chapter/index.html hearing-records/prison-watch/kaikai-final-chapter/zh-Hans/index.html
          git rm scripts/fix-kaikai-generic-hash-20260829.py .github/workflows/oneoff-kaikai-generic-hash-fix-20260829.yml
          git commit -m 'Stabilize nested Kaikai evidence deep links'
          git push origin HEAD:main