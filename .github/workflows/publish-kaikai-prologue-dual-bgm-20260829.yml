name: Publish Kaikai prologue animation and dual soundtrack

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-kaikai-prologue-dual-bgm-20260829.yml'

permissions:
  contents: write

concurrency:
  group: publish-kaikai-prologue-dual-bgm-20260829
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch prologue and alternating soundtrack
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from textwrap import dedent
          import re

          root = Path('hearing-records/prison-watch/kaikai-final-chapter')
          js_path = root / 'final-chapter.js'
          js = js_path.read_text(encoding='utf-8')
          start_marker = "  const audio = document.querySelector('#chapterBgm');"
          end_marker = "\n\n  // READER-OPTIMIZATIONS-20260829"
          assert js.count(start_marker) == 1, js.count(start_marker)
          start = js.index(start_marker)
          end = js.index(end_marker, start)
          replacement = dedent(r'''
            const audio = document.querySelector('#chapterBgm');
            const audioToggle = document.querySelector('[data-audio-label]')?.closest('button');
            const audioLabel = document.querySelector('[data-audio-label]');
            const audioTime = document.querySelector('[data-audio-time]');
            const audioVolume = document.querySelector('[data-audio-volume]');
            const audioCopy = locale === 'zh-Hans'
              ? { play: '播放配乐', pause: '暂停配乐', replay: '重播配乐', track: '当前曲目' }
              : { play: '播放配樂', pause: '暫停配樂', replay: '重播配樂', track: '目前曲目' };

            const originalAudioSources = audio
              ? [...audio.querySelectorAll('source')].map((source) => ({
                  src: source.src,
                  type: source.type
                }))
              : [];
            const audioDirectory = originalAudioSources[0]
              ? new URL('.', originalAudioSources[0].src)
              : new URL('../../../assets/audio/', document.baseURI);
            const audioTracks = [
              {
                title: locale === 'zh-Hans' ? '第二章主题配乐' : '第二章主題配樂',
                sources: originalAudioSources
              },
              {
                title: '退潮的街',
                sources: [
                  {
                    src: new URL('kaikai-chapter2-bgm-02-20260829.webm', audioDirectory).href,
                    type: 'audio/webm; codecs="opus"'
                  }
                ]
              }
            ].filter((track) => track.sources.length);
            let audioTrackIndex = 0;

            const formatMediaTime = (value) => {
              const safeValue = Number.isFinite(value) ? Math.max(0, value) : 0;
              const minutes = Math.floor(safeValue / 60);
              const seconds = Math.floor(safeValue % 60);
              return `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
            };

            const currentAudioTrack = () => audioTracks[audioTrackIndex] || audioTracks[0];

            const updateAudioTime = () => {
              if (!audio || !audioTime || !audioTracks.length) return;
              audioTime.textContent = `${audioTrackIndex + 1}/${audioTracks.length} · ${formatMediaTime(audio.currentTime)} / ${formatMediaTime(audio.duration || 30.8)}`;
              const title = currentAudioTrack()?.title || '';
              const accessible = `${audioCopy.track}：${title}，${audioTrackIndex + 1}/${audioTracks.length}`;
              audioTime.setAttribute('aria-label', accessible);
              audioTime.title = accessible;
            };

            const updateAudioState = () => {
              if (!audio || !audioToggle || !audioLabel || !audioTracks.length) return;
              const playing = !audio.paused && !audio.ended;
              const action = playing ? audioCopy.pause : (audio.ended ? audioCopy.replay : audioCopy.play);
              audioToggle.setAttribute('aria-pressed', String(playing));
              audioLabel.textContent = action;
              const title = currentAudioTrack()?.title || '';
              audioToggle.setAttribute('aria-label', `${action}：${title}`);
              audioToggle.title = `${title} · ${audioTrackIndex + 1}/${audioTracks.length}`;
              updateAudioTime();
            };

            const setAudioTrack = (index, autoplay = false) => {
              if (!audio || !audioTracks.length) return Promise.resolve(false);
              audioTrackIndex = ((index % audioTracks.length) + audioTracks.length) % audioTracks.length;
              const track = currentAudioTrack();
              const sourceNodes = track.sources.map(({ src, type }) => {
                const source = document.createElement('source');
                source.src = src;
                if (type) source.type = type;
                return source;
              });
              audio.replaceChildren(...sourceNodes);
              audio.dataset.trackIndex = String(audioTrackIndex);
              audio.dataset.trackCount = String(audioTracks.length);
              audio.dataset.trackTitle = track.title;
              audio.load();
              updateAudioState();
              if (!autoplay) return Promise.resolve(true);
              return audio.play().then(() => true).catch(() => false);
            };

            const playChapterAudioFromGesture = (restart = false) => {
              if (!audio) return Promise.resolve();
              if (restart || audio.ended || (audio.duration && audio.currentTime >= audio.duration - 0.05)) audio.currentTime = 0;
              return audio.play().catch(() => undefined);
            };

            if (audio && audioTracks.length) {
              audio.loop = false;
              audio.volume = Number(audioVolume?.value || 0.58);
              audio.dataset.trackIndex = '0';
              audio.dataset.trackCount = String(audioTracks.length);
              audio.dataset.trackTitle = currentAudioTrack().title;
              audio.addEventListener('loadedmetadata', updateAudioTime);
              audio.addEventListener('durationchange', updateAudioTime);
              audio.addEventListener('timeupdate', updateAudioTime);
              audio.addEventListener('play', updateAudioState);
              audio.addEventListener('pause', updateAudioState);
              audio.addEventListener('ended', () => {
                setAudioTrack(audioTrackIndex + 1, true);
              });
              audioToggle?.addEventListener('click', () => {
                if (audio.paused || audio.ended) playChapterAudioFromGesture(audio.ended);
                else audio.pause();
              });
              audioVolume?.addEventListener('input', () => { audio.volume = Number(audioVolume.value); });
              updateAudioState();
            }
          ''').lstrip('\n')
          js = js[:start] + replacement.rstrip() + js[end:]
          js_path.write_text(js, encoding='utf-8')

          pages = [
              {
                  'path': root / 'index.html',
                  'nav_old': '<a href="#prologue-film">序幕影片</a>',
                  'nav_new': '<a href="#prologue-film">序幕動畫</a>',
                  'group_label': '雙曲循環背景配樂',
                  'small_old': 'PROLOGUE FILM · 00:05',
                  'small_new': 'PROLOGUE ANIMATION · 00:05',
                  'source_old': '<source src="./assets/kaikai-final-chapter-prologue.mp4" type="video/mp4">',
                  'source_new': '<source src="./assets/kaikai-final-chapter-prologue.mp4?v=20260829-2" type="video/mp4">',
              },
              {
                  'path': root / 'zh-Hans/index.html',
                  'nav_old': '<a href="#prologue-film">序幕视频</a>',
                  'nav_new': '<a href="#prologue-film">序幕动画</a>',
                  'group_label': '双曲循环背景配乐',
                  'small_old': 'PROLOGUE FILM · 00:05',
                  'small_new': 'PROLOGUE ANIMATION · 00:05',
                  'source_old': '<source src="../assets/kaikai-final-chapter-prologue.mp4" type="video/mp4">',
                  'source_new': '<source src="../assets/kaikai-final-chapter-prologue.mp4?v=20260829-2" type="video/mp4">',
              },
          ]

          for page in pages:
              path = page['path']
              html = path.read_text(encoding='utf-8')

              replacements = [
                  (page['nav_old'], page['nav_new']),
                  (
                      '<div class="chapter-audio" data-audio-controller>',
                      f'<div class="chapter-audio" data-audio-controller role="group" aria-label="{page["group_label"]}">'
                  ),
                  (
                      '<audio id="chapterBgm" preload="metadata">',
                      '<audio id="chapterBgm" preload="metadata" data-track-count="2">'
                  ),
                  (
                      '<time data-audio-time aria-live="polite">00:00 / 00:31</time>',
                      '<time data-audio-time aria-live="polite">1/2 · 00:00 / 00:31</time>'
                  ),
                  (page['small_old'], page['small_new']),
                  (page['source_old'], page['source_new']),
              ]

              for old, new in replacements:
                  count = html.count(old)
                  assert count == 1, (path, old, count)
                  html = html.replace(old, new, 1)

              html, video_count = re.subn(
                  r'(<video\b[^>]*data-prologue-video[^>]*?)preload="metadata"',
                  r'\1preload="auto"',
                  html,
                  count=1,
              )
              assert video_count == 1, (path, video_count)

              html, script_count = re.subn(
                  r'(final-chapter\.js\?v=)[^"\']+',
                  r'\g<1>20260829-31',
                  html,
                  count=1,
              )
              assert script_count == 1, (path, script_count)
              path.write_text(html, encoding='utf-8')

          assert 'kaikai-chapter2-bgm-02-20260829.webm' in js
          assert 'setAudioTrack(audioTrackIndex + 1, true)' in js
          assert "audio.dataset.trackCount = String(audioTracks.length)" in js
          for page in pages:
              html = page['path'].read_text(encoding='utf-8')
              assert 'data-track-count="2"' in html
              assert 'PROLOGUE ANIMATION · 00:05' in html
              assert 'preload="auto"' in html
              assert 'kaikai-final-chapter-prologue.mp4?v=20260829-2' in html
              assert 'final-chapter.js?v=20260829-31' in html
          PY

          node --check hearing-records/prison-watch/kaikai-final-chapter/final-chapter.js
          test -s assets/audio/kaikai-chapter2-bgm-02-20260829.webm
          test "$(stat -c '%s' assets/audio/kaikai-chapter2-bgm-02-20260829.webm)" -eq 48131
          echo 'adc89eee95493aea634e9a2435dd45ec32782f2732697f409d713e595c13dc5a  assets/audio/kaikai-chapter2-bgm-02-20260829.webm' | sha256sum -c -

      - name: Commit publication and remove one-off workflow
        shell: bash
        run: |
          set -euo pipefail
          workflow='.github/workflows/publish-kaikai-prologue-dual-bgm-20260829.yml'
          git rm "$workflow"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add Kaikai prologue animation and alternating soundtrack'
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 3))
          done
          exit 1
