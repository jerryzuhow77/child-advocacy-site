name: Fix blank Day 5 posters with unique JPEG URLs

on:
  push:
    branches: [main]
    paths:
      - '.github/day5-exact-image-repair-trigger.txt'

permissions:
  contents: write

concurrency:
  group: day5-jpeg-blank-fix
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out production branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Pillow
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends python3-pil

      - name: Create fresh JPEG assets and update every reference
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin main

          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps, ImageStat
          import html, json, os, re

          root = Path('.')
          assets = root / 'assets/art'
          version = '20260822-jpeg-blank-fix-1'
          files = {
              'hant1': 'prison-watch-day5-selected-evidence-01-zh-hant-20260822.jpg',
              'hant2': 'prison-watch-day5-selected-evidence-02-zh-hant-20260822.jpg',
              'hans1': 'prison-watch-day5-selected-evidence-01-zh-hans-20260822.jpg',
              'hans2': 'prison-watch-day5-selected-evidence-02-zh-hans-20260822.jpg',
          }
          sources = {
              'hant1': 'prison-watch-day5-forensic-zh-hant-20260822.webp',
              'hant2': 'prison-watch-day5-medical-zh-hant-20260822.webp',
              'hans1': 'prison-watch-day5-forensic-zh-hans-20260822.webp',
              'hans2': 'prison-watch-day5-medical-zh-hans-20260822.webp',
          }

          for key, source_name in sources.items():
              source = assets / source_name
              destination = assets / files[key]
              if not source.is_file() or source.stat().st_size < 30000:
                  raise SystemExit(f'Missing source poster: {source}')
              with Image.open(source) as image:
                  image.load()
                  rgb = ImageOps.fit(image.convert('RGB'), (512, 768), Image.Resampling.LANCZOS)
                  if sum(ImageStat.Stat(rgb.resize((64, 96))).var) < 250:
                      raise SystemExit(f'Source poster appears blank: {source}')
                  rgb.save(destination, 'JPEG', quality=90, subsampling=0, optimize=True, progressive=True)
              with Image.open(destination) as check:
                  check.load()
                  if check.format != 'JPEG' or check.size != (512, 768):
                      raise SystemExit(f'Invalid JPEG: {destination}')
                  if sum(ImageStat.Stat(check.resize((64, 96))).var) < 250:
                      raise SystemExit(f'JPEG appears blank: {destination}')
              if destination.stat().st_size < 35000:
                  raise SystemExit(f'JPEG unexpectedly small: {destination}')
              print(destination, destination.stat().st_size)

          pages = [
              root / 'hearing-records/prison-watch/kaikai-day5-20250429/index.html',
              root / 'en/hearing-records/prison-watch/kaikai-day5-20250429/index.html',
              root / 'ja/hearing-records/prison-watch/kaikai-day5-20250429/index.html',
              root / 'source/hearing-records/prison-watch/kaikai-day5-20250429/index.html',
              root / 'source/en/hearing-records/prison-watch/kaikai-day5-20250429/index.html',
              root / 'source/ja/hearing-records/prison-watch/kaikai-day5-20250429/index.html',
          ]

          def relative(page, name):
              return os.path.relpath(assets / name, page.parent).replace(os.sep, '/')

          def set_attr(tag, key, value):
              value = html.escape(value, quote=True)
              pattern = rf'\s{re.escape(key)}="[^"]*"'
              replacement = f' {key}="{value}"'
              if re.search(pattern, tag):
                  return re.sub(pattern, replacement, tag, count=1)
              return tag[:-1] + replacement + '>'

          def update_tags(text, page, number, traditional, simplified):
              pattern = re.compile(rf'<img\b[^>]*\bdata-day5-poster="{number}"[^>]*>', re.I)
              if not pattern.search(text):
                  raise SystemExit(f'Poster hook {number} missing in {page}')
              def replace(match):
                  tag = match.group(0)
                  tag = set_attr(tag, 'data-traditional', relative(page, traditional))
                  tag = set_attr(tag, 'data-simplified', relative(page, simplified))
                  tag = set_attr(tag, 'src', relative(page, traditional))
                  tag = set_attr(tag, 'width', '512')
                  tag = set_attr(tag, 'height', '768')
                  tag = set_attr(tag, 'loading', 'eager')
                  tag = set_attr(tag, 'decoding', 'async')
                  tag = set_attr(tag, 'fetchpriority', 'high' if number == 1 else 'auto')
                  return tag
              return pattern.sub(replace, text)

          absolute = 'https://jerryzuhow77.github.io/child-advocacy-site/assets/art/'
          for page in pages:
              text = page.read_text(encoding='utf-8')
              text = update_tags(text, page, 1, files['hant1'], files['hans1'])
              text = update_tags(text, page, 2, files['hant2'], files['hans2'])
              text = re.sub(r'day5\.js\?v=[^"\']+', f'day5.js?v={version}', text)
              cover = absolute + files['hant1'] + '?v=' + version
              text = re.sub(r'(<meta\s+property="og:image"\s+content=")[^"]*(")', rf'\1{cover}\2', text, count=1)
              text = re.sub(r'(<meta\s+name="twitter:image"\s+content=")[^"]*(")', rf'\1{cover}\2', text, count=1)
              text = re.sub(r'("image"\s*:\s*")[^"]*(")', rf'\1{cover}\2', text, count=1)
              page.write_text(text, encoding='utf-8')

          for path in [
              root / 'hearing-records/prison-watch/kaikai-day5-20250429/day5.js',
              root / 'source/hearing-records/prison-watch/kaikai-day5-20250429/day5.js',
          ]:
              text = path.read_text(encoding='utf-8')
              text, count = re.subn(r"const posterVersion = '[^']+';", f"const posterVersion = '{version}';", text, count=1)
              if count != 1:
                  raise SystemExit(f'posterVersion not found in {path}')
              path.write_text(text, encoding='utf-8')

          record_files = [
              (root / 'data/hearing-records.json', '../assets/art/' + files['hant1']),
              (root / 'en/data/hearing-records.json', '../../assets/art/' + files['hant1']),
              (root / 'ja/data/hearing-records.json', '../../assets/art/' + files['hant1']),
              (root / 'source/data/hearing-records.json', '../assets/art/' + files['hant1']),
              (root / 'source/en/data/hearing-records.json', '../../assets/art/' + files['hant1']),
              (root / 'source/ja/data/hearing-records.json', '../../assets/art/' + files['hant1']),
          ]
          for path, image in record_files:
              data = json.loads(path.read_text(encoding='utf-8'))
              item = next((entry for entry in data if entry.get('url') == 'prison-watch/kaikai-day5-20250429/'), None)
              if item is None:
                  raise SystemExit(f'Day 5 entry missing in {path}')
              item['image'] = image
              path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          bulletins = root / 'data/latest-bulletins.json'
          data = json.loads(bulletins.read_text(encoding='utf-8'))
          item = next((entry for entry in data.get('items', []) if entry.get('id') == 'kaikai-day5-20250429'), None)
          if item is not None:
              item['image'] = absolute + files['hant1'] + '?v=' + version
              bulletins.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          sw = root / 'sw.js'
          text = sw.read_text(encoding='utf-8')
          text = re.sub(r"const VERSION = '[^']+';", "const VERSION = '2026-08-22-day5-jpeg-blank-fix-v1';", text, count=1)
          text = re.sub(r"^\s*'\./assets/art/prison-watch-day5-(?:forensic|medical|evidence-selected)[^']*\.(?:webp|jpg)',?\s*$", '', text, flags=re.M)
          resources = [f"./assets/art/{name}" for name in files.values()]
          shell_end = text.find('];', text.find('const APP_SHELL = ['))
          prefix = text[:shell_end].rstrip()
          if not prefix.endswith(','):
              prefix += ','
          prefix += '\n' + ',\n'.join(f"  '{resource}'" for resource in resources) + '\n'
          text = prefix + text[shell_end:]
          fresh = (
              "const day5Fresh =\n"
              "    url.pathname.endsWith('/hearing-records/prison-watch/kaikai-day5-20250429/day5.js') ||\n"
              "    url.pathname.includes('/assets/art/prison-watch-day5-selected-evidence-');"
          )
          text, count = re.subn(r'const day5Fresh =.*?;', fresh, text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('day5Fresh block missing')
          sw.write_text(text, encoding='utf-8')
          PY

          node --check hearing-records/prison-watch/kaikai-day5-20250429/day5.js
          node --check source/hearing-records/prison-watch/kaikai-day5-20250429/day5.js
          node --check sw.js
          git diff --check

      - name: Validate visible assets and strengthened note
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageStat

          names = [
              'prison-watch-day5-selected-evidence-01-zh-hant-20260822.jpg',
              'prison-watch-day5-selected-evidence-02-zh-hant-20260822.jpg',
              'prison-watch-day5-selected-evidence-01-zh-hans-20260822.jpg',
              'prison-watch-day5-selected-evidence-02-zh-hans-20260822.jpg',
          ]
          for name in names:
              path = Path('assets/art') / name
              with Image.open(path) as image:
                  image.load()
                  if image.format != 'JPEG' or image.size != (512, 768):
                      raise SystemExit(f'Invalid JPEG: {path}')
                  if sum(ImageStat.Stat(image.resize((64, 96))).var) < 250:
                      raise SystemExit(f'Blank JPEG: {path}')

          pages = [
              Path('hearing-records/prison-watch/kaikai-day5-20250429/index.html'),
              Path('en/hearing-records/prison-watch/kaikai-day5-20250429/index.html'),
              Path('ja/hearing-records/prison-watch/kaikai-day5-20250429/index.html'),
              Path('source/hearing-records/prison-watch/kaikai-day5-20250429/index.html'),
              Path('source/en/hearing-records/prison-watch/kaikai-day5-20250429/index.html'),
              Path('source/ja/hearing-records/prison-watch/kaikai-day5-20250429/index.html'),
          ]
          for page in pages:
              text = page.read_text(encoding='utf-8')
              for name in names:
                  if name not in text:
                      raise SystemExit(f'JPEG reference missing in {page}: {name}')
              if 'day5.js?v=20260822-jpeg-blank-fix-1' not in text:
                  raise SystemExit(f'Fresh script URL missing in {page}')

          traditional = pages[0].read_text(encoding='utf-8')
          for phrase in ['不是只有42處', '42處是可確認的最低數量', '並未呈現所有傷勢照片', '族繁不及備載', '不是完整總數']:
              if phrase not in traditional:
                  raise SystemExit(f'Missing strengthened note wording: {phrase}')
          PY

      - name: Commit repair and remove one-off workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/day5-exact-image-repair-trigger.txt
          rm -f .github/workflows/oneoff-day5-exact-image-repair.yml

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && { echo 'No JPEG repair changes produced.'; exit 1; }
          git commit -m 'Fix blank Day 5 posters with unique JPEG assets'
          git pull --rebase origin main
          git push origin main
