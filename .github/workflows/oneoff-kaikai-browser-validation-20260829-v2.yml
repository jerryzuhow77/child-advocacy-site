name: One-off Kaikai live browser validation v3

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oneoff-kaikai-browser-validation-20260829-v2.yml'

permissions:
  contents: read

jobs:
  browser-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: npm install --no-save playwright-core@1.55.0
      - name: Validate real menu navigation, reveals and hashes
        run: |
          mkdir -p browser-validation/artifacts
          cat > browser-validation/validate.mjs <<'JS'
          import { chromium } from 'playwright-core';
          import fs from 'node:fs';

          const out = 'browser-validation/artifacts';
          const browser = await chromium.launch({
            headless: true,
            executablePath: '/usr/bin/google-chrome',
            args: ['--no-sandbox', '--disable-dev-shm-usage']
          });
          const sites = {
            'zh-Hant': 'https://jerryzuhow77.github.io/child-advocacy-site/hearing-records/prison-watch/kaikai-final-chapter/',
            'zh-Hans': 'https://jerryzuhow77.github.io/child-advocacy-site/hearing-records/prison-watch/kaikai-final-chapter/zh-Hans/'
          };
          const viewports = { desktop: { width: 1440, height: 1000 }, mobile: { width: 390, height: 844 } };
          const results = [];

          const state = async (page, selector) => page.locator(selector).evaluate(el => {
            const r = el.getBoundingClientRect();
            const s = getComputedStyle(el);
            return {
              className: el.className,
              opacity: s.opacity,
              visibility: s.visibility,
              display: s.display,
              transform: s.transform,
              contentVisibility: s.contentVisibility,
              top: Math.round(r.top),
              bottom: Math.round(r.bottom),
              width: Math.round(r.width),
              height: Math.round(r.height),
              inViewport: r.top < innerHeight && r.bottom > 0
            };
          });

          for (const [lang, base] of Object.entries(sites)) {
            for (const [viewportName, viewport] of Object.entries(viewports)) {
              const context = await browser.newContext({ viewport, locale: lang === 'zh-Hant' ? 'zh-TW' : 'zh-CN' });
              const page = await context.newPage();
              const result = { lang, viewport: viewportName, viewportSize: viewport, fatal: [], warnings: [], errors: [] };
              results.push(result);
              page.on('pageerror', e => result.errors.push(String(e)));
              page.on('console', m => { if (m.type() === 'error') result.warnings.push(m.text()); });

              const response = await page.goto(base, { waitUntil: 'domcontentloaded', timeout: 60000 });
              await page.waitForLoadState('networkidle', { timeout: 20000 }).catch(() => {});
              await page.waitForTimeout(1800);
              result.http = response?.status() || null;
              result.documentOverflow = await page.evaluate(() => Math.max(document.documentElement.scrollWidth, document.body.scrollWidth) - innerWidth);
              result.required = {};
              for (const id of ['evidence-atlas','witness-conflicts','blood-boundary','restraint-boundary','responsibility-orbit']) {
                result.required[id] = await page.locator(`#${id}`).count();
              }

              // Follow the same interaction a reader uses at 1440px and on mobile.
              await page.locator('#menuButton').click();
              await page.locator('.nav-group').filter({ has: page.locator('a[href="#evidence-atlas"]') }).evaluate(el => { el.open = true; });
              const menuLink = page.locator('#siteNav a[href="#evidence-atlas"]');
              result.menuBeforeClick = {
                menuExpanded: await page.locator('#menuButton').getAttribute('aria-expanded'),
                linkVisible: await menuLink.isVisible()
              };
              await menuLink.click({ timeout: 10000 });
              await page.waitForTimeout(1800);
              result.menuAfterClick = {
                hash: await page.evaluate(() => location.hash),
                menuExpanded: await page.locator('#menuButton').getAttribute('aria-expanded'),
                atlas: await state(page, '#evidence-atlas')
              };
              await page.screenshot({ path: `${out}/${lang}_${viewportName}_menu-atlas.png`, fullPage: false });
              await page.locator('#evidence-atlas').screenshot({ path: `${out}/${lang}_${viewportName}_atlas-element.png` });

              // Direct hash load and reload must also reveal the target, not leave opacity at zero.
              await page.goto(`${base}#evidence-atlas`, { waitUntil: 'domcontentloaded', timeout: 60000 });
              await page.waitForLoadState('networkidle', { timeout: 20000 }).catch(() => {});
              await page.waitForTimeout(2600);
              result.directAtlas = { hash: await page.evaluate(() => location.hash), atlas: await state(page, '#evidence-atlas') };
              await page.reload({ waitUntil: 'domcontentloaded', timeout: 60000 });
              await page.waitForLoadState('networkidle', { timeout: 20000 }).catch(() => {});
              await page.waitForTimeout(2600);
              result.reloadAtlas = { hash: await page.evaluate(() => location.hash), atlas: await state(page, '#evidence-atlas') };
              await page.screenshot({ path: `${out}/${lang}_${viewportName}_direct-atlas.png`, fullPage: false });

              // Deep-link three other new sections and record the actual final geometry.
              result.deepLinks = {};
              for (const id of ['witness-conflicts','blood-boundary','responsibility-orbit']) {
                await page.goto(`${base}#${id}`, { waitUntil: 'domcontentloaded', timeout: 60000 });
                await page.waitForLoadState('networkidle', { timeout: 15000 }).catch(() => {});
                await page.waitForTimeout(2200);
                result.deepLinks[id] = { hash: await page.evaluate(() => location.hash), state: await state(page, `#${id}`) };
                await page.screenshot({ path: `${out}/${lang}_${viewportName}_${id}-viewport.png`, fullPage: false });
              }

              if (result.http !== 200) result.fatal.push(`HTTP ${result.http}`);
              if (result.documentOverflow > 4) result.fatal.push(`document overflow ${result.documentOverflow}px`);
              for (const [id, count] of Object.entries(result.required)) if (count !== 1) result.fatal.push(`#${id} count ${count}`);
              if (!result.menuBeforeClick.linkVisible) result.fatal.push('menu evidence-atlas link not visible after opening its group');
              if (result.menuAfterClick.hash !== '#evidence-atlas') result.fatal.push('menu click did not set #evidence-atlas');
              for (const [label, item] of [['menu', result.menuAfterClick.atlas], ['direct', result.directAtlas.atlas], ['reload', result.reloadAtlas.atlas]]) {
                if (!item.className.includes('in-view') || Number(item.opacity) < 0.99 || !item.inViewport) {
                  result.fatal.push(`${label} atlas not fully revealed: ${JSON.stringify(item)}`);
                }
              }
              for (const [id, item] of Object.entries(result.deepLinks)) {
                if (item.hash !== `#${id}` || !item.state.inViewport || Number(item.state.opacity) < 0.99) {
                  result.fatal.push(`${id} deep link failed: ${JSON.stringify(item)}`);
                }
              }
              if (result.errors.length) result.fatal.push(`${result.errors.length} page error(s)`);
              await context.close();
            }
          }
          await browser.close();
          const report = { generatedAt: new Date().toISOString(), results };
          fs.writeFileSync(`${out}/report.json`, JSON.stringify(report, null, 2));
          const lines = ['# Kaikai browser validation v3', ''];
          for (const r of results) {
            lines.push(`## ${r.lang} · ${r.viewport}`);
            lines.push(`- HTTP ${r.http}; overflow ${r.documentOverflow}px`);
            lines.push(`- menu link visible: ${r.menuBeforeClick.linkVisible}; menu atlas: opacity=${r.menuAfterClick.atlas.opacity}, class=${r.menuAfterClick.atlas.className}, top=${r.menuAfterClick.atlas.top}`);
            lines.push(`- direct atlas: opacity=${r.directAtlas.atlas.opacity}, class=${r.directAtlas.atlas.className}, top=${r.directAtlas.atlas.top}`);
            lines.push(`- reload atlas: opacity=${r.reloadAtlas.atlas.opacity}, class=${r.reloadAtlas.atlas.className}, top=${r.reloadAtlas.atlas.top}`);
            for (const [id, value] of Object.entries(r.deepLinks)) lines.push(`- ${id}: opacity=${value.state.opacity}, top=${value.state.top}, visible=${value.state.inViewport}`);
            lines.push(`- fatal: ${r.fatal.length ? r.fatal.join(' | ') : 'none'}`);
            lines.push('');
          }
          fs.writeFileSync(`${out}/summary.md`, lines.join('\n'));
          console.log(lines.join('\n'));
          JS
          node browser-validation/validate.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kaikai-live-browser-validation-v3
          path: browser-validation/artifacts
          retention-days: 14
      - if: always()
        run: |
          node - <<'JS'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('browser-validation/artifacts/report.json','utf8'));
          const failures = report.results.flatMap(r => r.fatal.map(x => `${r.lang}/${r.viewport}: ${x}`));
          if (failures.length) { console.error(failures.join('\n')); process.exit(1); }
          console.log('All real-browser checks passed.');
          JS