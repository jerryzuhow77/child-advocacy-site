name: One-off Kaikai live browser validation v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oneoff-kaikai-browser-validation-20260829-v2.yml'

permissions:
  contents: read

jobs:
  browser-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install Playwright driver
        run: npm install --no-save playwright-core@1.55.0

      - name: Run live Chromium validation
        run: |
          mkdir -p browser-validation/artifacts
          cat > browser-validation/validate.mjs <<'JS'
          import { chromium } from 'playwright-core';
          import fs from 'node:fs';

          const outDir = 'browser-validation/artifacts';
          fs.mkdirSync(outDir, { recursive: true });
          const sites = {
            'zh-Hant': 'https://jerryzuhow77.github.io/child-advocacy-site/hearing-records/prison-watch/kaikai-final-chapter/',
            'zh-Hans': 'https://jerryzuhow77.github.io/child-advocacy-site/hearing-records/prison-watch/kaikai-final-chapter/zh-Hans/'
          };
          const viewports = {
            desktop: { width: 1440, height: 1000 },
            mobile: { width: 390, height: 844 }
          };
          const requiredIds = ['evidence-atlas','witness-conflicts','blood-boundary','restraint-boundary','responsibility-orbit','dentalDutyTitle'];
          const chromeCandidates = ['/usr/bin/google-chrome','/usr/bin/google-chrome-stable','/usr/bin/chromium','/usr/bin/chromium-browser'];
          const executablePath = chromeCandidates.find(path => fs.existsSync(path));
          if (!executablePath) throw new Error('No system Chromium/Chrome executable found');

          const results = [];
          const saveReport = () => fs.writeFileSync(`${outDir}/report.json`, JSON.stringify({ generatedAt: new Date().toISOString(), executablePath, results }, null, 2));
          const browser = await chromium.launch({ headless: true, executablePath, args: ['--no-sandbox','--disable-dev-shm-usage'] });

          for (const [lang, url] of Object.entries(sites)) {
            for (const [viewportName, viewport] of Object.entries(viewports)) {
              const prefix = `${lang}_${viewportName}`;
              const result = {
                lang, viewport: viewportName, dimensions: viewport, status: null, title: '', finalUrl: '',
                finalChapterCss: [], ids: {}, textChecks: {}, overflow: null, anchor: {}, deepLink: {},
                console: [], pageErrors: [], failedRequests: [], badResponses: [], fatal: [], crash: null
              };
              results.push(result);
              const context = await browser.newContext({
                viewport,
                locale: lang === 'zh-Hant' ? 'zh-TW' : 'zh-CN',
                colorScheme: 'light',
                reducedMotion: 'no-preference'
              });
              const page = await context.newPage();
              page.on('console', message => {
                if (message.type() === 'error' || message.type() === 'warning') result.console.push({ type: message.type(), text: message.text() });
              });
              page.on('pageerror', error => result.pageErrors.push(String(error)));
              page.on('requestfailed', request => result.failedRequests.push({ url: request.url(), error: request.failure()?.errorText || 'unknown' }));
              page.on('response', response => {
                if (response.status() >= 400) result.badResponses.push({ url: response.url(), status: response.status(), type: response.request().resourceType() });
              });

              try {
                const response = await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 60000 });
                await page.waitForLoadState('networkidle', { timeout: 20000 }).catch(() => {});
                await page.waitForTimeout(1800);
                result.status = response?.status() ?? null;
                result.title = await page.title();
                result.finalUrl = page.url();
                await page.screenshot({ path: `${outDir}/${prefix}_initial-viewport.png`, fullPage: false });

                const cssLinks = await page.locator('link[rel="stylesheet"]').evaluateAll(elements => elements.map(element => element.href));
                result.finalChapterCss = cssLinks.filter(link => link.includes('final-chapter.css'));
                for (const id of requiredIds) result.ids[id] = await page.locator(`#${id}`).count();
                result.textChecks = {
                  atlasTitle: await page.getByText(lang === 'zh-Hant' ? '她在法庭上怎麼說？證據又怎麼回答？' : '她在法庭上怎么说？证据又怎么回答？', { exact: true }).count(),
                  bloodTitle: await page.getByText(lang === 'zh-Hant' ? '血跡證明空間，不直接證明單一行為人' : '血迹证明空间，不直接证明单一行为人', { exact: true }).count(),
                  dateTriplet: await page.getByText(/2023\.09\.22.*09\.25.*09\.26/).count()
                };
                result.overflow = await page.evaluate(() => {
                  const viewportWidth = innerWidth;
                  const scrollWidth = Math.max(document.documentElement.scrollWidth, document.body.scrollWidth);
                  const offenders = [...document.querySelectorAll('body *')]
                    .map(element => {
                      const rect = element.getBoundingClientRect();
                      const style = getComputedStyle(element);
                      return {
                        tag: element.tagName.toLowerCase(), id: element.id || '',
                        className: typeof element.className === 'string' ? element.className.slice(0, 140) : '',
                        left: Math.round(rect.left * 10) / 10, right: Math.round(rect.right * 10) / 10,
                        width: Math.round(rect.width * 10) / 10, position: style.position, overflowX: style.overflowX
                      };
                    })
                    .filter(item => item.width > 0 && item.position !== 'fixed' && (item.left < -2 || item.right > viewportWidth + 2))
                    .slice(0, 30);
                  return { viewportWidth, scrollWidth, overflowPx: scrollWidth - viewportWidth, offenders };
                });

                const allNavCount = await page.locator('a[href="#evidence-atlas"]').count();
                const visibleNav = page.locator('a[href="#evidence-atlas"]:visible').first();
                const visibleNavCount = await page.locator('a[href="#evidence-atlas"]:visible').count();
                result.anchor = { allNavCount, visibleNavCount, missing: visibleNavCount === 0 };
                if (visibleNavCount) {
                  await visibleNav.scrollIntoViewIfNeeded();
                  await visibleNav.click({ timeout: 8000 });
                  await page.waitForTimeout(900);
                  Object.assign(result.anchor, {
                    hash: await page.evaluate(() => location.hash),
                    visible: await page.locator('#evidence-atlas').evaluate(element => {
                      const rect = element.getBoundingClientRect();
                      return rect.top < innerHeight && rect.bottom > 0;
                    }),
                    top: await page.locator('#evidence-atlas').evaluate(element => Math.round(element.getBoundingClientRect().top))
                  });
                  await page.screenshot({ path: `${outDir}/${prefix}_anchor-viewport.png`, fullPage: false });
                }

                for (const id of ['evidence-atlas','witness-conflicts','blood-boundary','restraint-boundary','responsibility-orbit']) {
                  const locator = page.locator(`#${id}`);
                  if (await locator.count()) {
                    await locator.scrollIntoViewIfNeeded();
                    await page.waitForTimeout(250);
                    await locator.screenshot({ path: `${outDir}/${prefix}_${id}.png` });
                  }
                }

                const deepResponse = await page.goto(`${url.split('#')[0]}#witness-conflicts`, { waitUntil: 'domcontentloaded', timeout: 60000 });
                await page.waitForLoadState('networkidle', { timeout: 15000 }).catch(() => {});
                await page.waitForTimeout(1000);
                result.deepLink = {
                  status: deepResponse?.status() ?? null,
                  hash: await page.evaluate(() => location.hash),
                  visible: await page.locator('#witness-conflicts').evaluate(element => {
                    const rect = element.getBoundingClientRect();
                    return rect.top < innerHeight && rect.bottom > 0;
                  }),
                  top: await page.locator('#witness-conflicts').evaluate(element => Math.round(element.getBoundingClientRect().top))
                };
                await page.reload({ waitUntil: 'domcontentloaded', timeout: 60000 });
                await page.waitForLoadState('networkidle', { timeout: 15000 }).catch(() => {});
                await page.waitForTimeout(800);
                result.deepLink.reloadHash = await page.evaluate(() => location.hash);
                result.deepLink.reloadVisible = await page.locator('#witness-conflicts').evaluate(element => {
                  const rect = element.getBoundingClientRect();
                  return rect.top < innerHeight && rect.bottom > 0;
                });

                result.console = result.console.filter(message => !/favicon|third-party cookie/i.test(message.text));
                if (result.status !== 200) result.fatal.push(`HTTP status ${result.status}`);
                for (const [id, count] of Object.entries(result.ids)) if (count !== 1) result.fatal.push(`#${id} count ${count}`);
                for (const [key, count] of Object.entries(result.textChecks)) if (count < 1) result.fatal.push(`${key} missing`);
                if ((result.overflow?.overflowPx ?? 999) > 4) result.fatal.push(`horizontal overflow ${result.overflow.overflowPx}px`);
                if (result.anchor.missing || result.anchor.hash !== '#evidence-atlas' || !result.anchor.visible) result.fatal.push('evidence-atlas visible anchor failed');
                if (result.deepLink.status !== 200 || result.deepLink.hash !== '#witness-conflicts' || !result.deepLink.visible || result.deepLink.reloadHash !== '#witness-conflicts' || !result.deepLink.reloadVisible) result.fatal.push('witness-conflicts deep link/reload failed');
                if (result.pageErrors.length) result.fatal.push(`${result.pageErrors.length} page error(s)`);
              } catch (error) {
                result.crash = String(error?.stack || error);
                result.fatal.push(`test crash: ${error?.message || error}`);
                await page.screenshot({ path: `${outDir}/${prefix}_crash.png`, fullPage: false }).catch(() => {});
              } finally {
                saveReport();
                await context.close();
              }
            }
          }

          await browser.close();
          const lines = ['# Kaikai live browser validation v2', ''];
          for (const result of results) {
            lines.push(`## ${result.lang} · ${result.viewport} (${result.dimensions.width}×${result.dimensions.height})`);
            lines.push(`- HTTP: ${result.status}`);
            lines.push(`- CSS: ${result.finalChapterCss.join(', ') || 'missing'}`);
            lines.push(`- Required IDs: ${Object.values(result.ids).length && Object.values(result.ids).every(value => value === 1) ? 'PASS' : 'FAIL'}`);
            lines.push(`- Text checks: ${JSON.stringify(result.textChecks)}`);
            lines.push(`- Horizontal overflow: ${result.overflow?.overflowPx ?? 'unknown'}px`);
            lines.push(`- Navigation links: all=${result.anchor.allNavCount ?? 0}, visible=${result.anchor.visibleNavCount ?? 0}`);
            lines.push(`- Anchor: ${result.anchor.hash || 'missing'} / visible=${result.anchor.visible ?? false} / top=${result.anchor.top ?? 'n/a'}`);
            lines.push(`- Deep link + reload: ${result.deepLink.hash || 'missing'} / visible=${result.deepLink.visible ?? false} / reloadVisible=${result.deepLink.reloadVisible ?? false}`);
            lines.push(`- Console warnings/errors: ${result.console.length}; page errors: ${result.pageErrors.length}; failed requests: ${result.failedRequests.length}; HTTP >=400: ${result.badResponses.length}`);
            lines.push(`- Fatal checks: ${result.fatal.length ? result.fatal.join('; ') : 'none'}`);
            if (result.overflow?.offenders?.length) lines.push(`- First overflow offender: ${JSON.stringify(result.overflow.offenders[0])}`);
            if (result.crash) lines.push(`- Crash: ${result.crash.split('\n')[0]}`);
            lines.push('');
          }
          const fatalCount = results.reduce((sum, result) => sum + result.fatal.length, 0);
          lines.push(`**Total fatal checks: ${fatalCount}**`);
          fs.writeFileSync(`${outDir}/summary.md`, lines.join('\n'));
          saveReport();
          console.log(lines.join('\n'));
          JS
          node browser-validation/validate.mjs

      - name: Upload screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kaikai-live-browser-validation-v2
          path: browser-validation/artifacts
          retention-days: 14

      - name: Enforce browser checks
        if: always()
        run: |
          node - <<'JS'
          const fs = require('node:fs');
          const path = './browser-validation/artifacts/report.json';
          if (!fs.existsSync(path)) throw new Error('Browser report was not generated');
          const report = require(path);
          const failures = report.results.flatMap(result => result.fatal.map(message => `${result.lang}/${result.viewport}: ${message}`));
          if (failures.length) {
            console.error(failures.join('\n'));
            process.exit(1);
          }
          console.log('All live browser checks passed.');
          JS