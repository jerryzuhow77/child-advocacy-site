name: Finalize Tucheng homepage priority and search sync
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oneoff-tucheng-home-priority-search-20260823.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update homepage priority card and site search index
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          # Keep the three-card priority strip balanced, replacing the prior
          # court-note card with the newest Tucheng judgment/hearing record.
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '''<a href="./hearing-records/prison-watch/kaikai-day5-20250429/"><span class="home-priority-icon" aria-hidden="true">記</span><span><small>最新重製編輯筆記</small><strong>第五次審判期日</strong><em>兩位醫師證詞、死因研判與醫學證據</em></span><b aria-hidden="true">→</b></a>'''
          new = '''<a class="is-hearing is-tucheng-domestic-priority" href="./hearing-records/tucheng-domestic-violence-double-homicide-20260821/"><time datetime="2026-08-21">08.21</time><span><small>一審宣判・最新旁聽筆記</small><strong>土城家暴雙屍案</strong><em>兩項殺人罪各判無期徒刑；全案仍可上訴</em></span><b aria-hidden="true">→</b></a>'''
          if 'is-tucheng-domestic-priority' not in s:
              if old not in s:
                  raise SystemExit('Homepage priority source card not found')
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          # Add the two new public pages to full-site search.
          q = Path('data/search-index.json')
          data = json.loads(q.read_text(encoding='utf-8'))
          case_url = 'cases/tucheng-domestic-violence-double-homicide/'
          hearing_url = 'hearing-records/tucheng-domestic-violence-double-homicide-20260821/'
          data['items'] = [x for x in data.get('items', []) if x.get('url') not in {case_url, hearing_url}]
          hearing_item = {
              'title': '土城家暴雙屍案｜2026年8月21日完整旁聽筆記',
              'category': '旁聽紀錄・國民法官案件',
              'url': hearing_url,
              'date': '2026-08-23',
              'summary': '整理一審宣判日的檢辯量刑攻防、預謀四步驟、再犯風險、兒童最佳利益、無期徒刑與判決結果。',
              'keywords': '土城家暴雙屍案 土城家暴双尸案 2026年8月21日 完整旁聽筆記 完整旁听笔记 國民法官 新北地方法院 一審宣判 無期徒刑 褫奪公權 預謀四步驟 一命換四命 再犯風險 兒童最佳利益 家暴 保護令 跟監 尾隨 量刑攻防',
              'text': '土城家暴雙屍案2026年8月21日完整旁聽筆記。依現場旁聽紀錄重製，分層整理法院確認、檢方與被害人方主張、辯方意見、鑑定爭點、死刑與無期徒刑攻防，以及一審判決。兩項殺人罪各判無期徒刑，定應執行無期徒刑，褫奪公權終身，全案仍可上訴。'
          }
          case_item = {
              'title': '裂痕之前：一個家庭的沉默與崩解｜土城家暴雙屍案',
              'category': '社會案件・專題',
              'url': case_url,
              'date': '2026-08-23',
              'summary': '從家暴、保護令、跟監尾隨與分離後高風險，回看家庭悲劇發生以前已經出現的警訊與制度責任。',
              'keywords': '土城家暴雙屍案 土城家暴双尸案 裂痕之前 家庭悲劇 家庭悲剧 家暴防治 保護令 保护令 跟監 尾隨 跟踪尾随 分離後暴力 控制 報復 兒童最佳利益 制度反思 社會案件',
              'text': '裂痕之前：一個家庭的沉默與崩解。土城家暴雙屍案社會案件專題，以家庭悲劇與制度反思為敘事層次，整理2025年5月衝突與求助、2025年7月保護令程序、庭後尾隨追撞與殺害，以及2026年8月21日一審判決。專題不重現血腥細節，並連結完整旁聽紀錄。'
          }
          data['items'] = [hearing_item, case_item] + data['items']
          for item in data['items']:
              if item.get('url') == '':
                  extra = ' 土城家暴雙屍案 土城家暴双尸案 裂痕之前 2026年8月21日完整旁聽筆記 家暴 保護令 國民法官 一審宣判'
                  if '土城家暴雙屍案' not in item.get('keywords', ''):
                      item['keywords'] = (item.get('keywords', '') + extra).strip()
                  if '土城家暴雙屍案' not in item.get('text', ''):
                      item['text'] = (item.get('text', '') + ' 最新同步：土城家暴雙屍案社會案件專題與2026年8月21日完整旁聽筆記已上線。').strip()
                  break
          data['updated'] = '2026-08-23'
          data['count'] = len(data['items'])
          q.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          # Make the search hint reflect the newly indexed case.
          js = Path('assets/site.js')
          text = js.read_text(encoding='utf-8')
          old_tip = '可搜尋「土城」、「白麗芳」、「凱道」、「2026/08/06」等內容。'
          new_tip = '可搜尋「土城家暴雙屍案」、「剴剴案」、「保護令」、「2026/08/21」等內容。'
          if old_tip in text:
              text = text.replace(old_tip, new_tip, 1)
          js.write_text(text, encoding='utf-8')
          PY
      - name: Validate synchronized content
        run: |
          python -m json.tool data/search-index.json >/dev/null
          grep -q 'is-tucheng-domestic-priority' index.html
          grep -q 'cases/tucheng-domestic-violence-double-homicide/' data/search-index.json
          grep -q 'hearing-records/tucheng-domestic-violence-double-homicide-20260821/' data/search-index.json
          grep -q '土城家暴雙屍案' assets/site.js
          git diff --check
      - name: Commit and publish
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html data/search-index.json assets/site.js
          git diff --cached --quiet && exit 0
          git commit -m 'Finalize Tucheng homepage priority and search index'
          git pull --rebase origin main
          git push origin HEAD:main
