name: Fix Kaikai entry prologue autoplay prompt

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/oneoff-fix-kaikai-prologue-play-prompt-20260829.yml'

permissions:
  contents: write

concurrency:
  group: oneoff-fix-kaikai-prologue-play-prompt-20260829
  cancel-in-progress: false

jobs:
  fix-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out latest main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebase before patching
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin main

      - name: Hide the fallback play prompt while autoplay is working
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_PATCH'
          from pathlib import Path
          import re

          base = Path('hearing-records/prison-watch/kaikai-final-chapter')
          css_path = base / 'final-chapter.css'
          css = css_path.read_text(encoding='utf-8')
          marker = '/* PROLOGUE-HIDDEN-PLAY-PROMPT-FIX-20260829 */'
          rule = '''

/* PROLOGUE-HIDDEN-PLAY-PROMPT-FIX-20260829 */
.entry-prologue__play[hidden]{
  display:none!important;
}
'''
          if marker not in css:
              css = css.rstrip() + rule
              css_path.write_text(css, encoding='utf-8')

          pages = [base / 'index.html', base / 'zh-Hans/index.html']
          for page in pages:
              text = page.read_text(encoding='utf-8')
              text, count = re.subn(
                  r'(final-chapter\.css\?v=)[^"\']+',
                  r'\g<1>20260829-36',
                  text,
                  count=1,
              )
              if count != 1:
                  raise SystemExit(f'CSS cache marker not found in {page}')
              page.write_text(text, encoding='utf-8')
          PY_PATCH

      - name: Validate the minimal correction
        shell: bash
        run: |
          set -euo pipefail
          base='hearing-records/prison-watch/kaikai-final-chapter'
          grep -q 'PROLOGUE-HIDDEN-PLAY-PROMPT-FIX-20260829' "$base/final-chapter.css"
          grep -q '\.entry-prologue__play\[hidden\]' "$base/final-chapter.css"
          grep -q 'display:none!important' "$base/final-chapter.css"
          grep -q 'final-chapter.css?v=20260829-36' "$base/index.html"
          grep -q 'final-chapter.css?v=20260829-36' "$base/zh-Hans/index.html"
          grep -q 'data-entry-prologue' "$base/index.html"
          grep -q 'data-entry-prologue' "$base/zh-Hans/index.html"
          grep -q 'autoplay muted playsinline' "$base/index.html"
          grep -q 'autoplay muted playsinline' "$base/zh-Hans/index.html"
          node --check "$base/final-chapter.js"

      - name: Commit correction and remove one-off workflow
        shell: bash
        run: |
          set -euo pipefail
          workflow='.github/workflows/oneoff-fix-kaikai-prologue-play-prompt-20260829.yml'
          git rm "$workflow"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Hide blocked-play prompt during successful prologue autoplay'
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 3))
          done
          exit 1
