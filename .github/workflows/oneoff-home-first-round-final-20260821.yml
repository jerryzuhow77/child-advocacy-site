name: Publish homepage first-round optimization

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oneoff-home-first-round-final-20260821.yml'

permissions:
  contents: write

concurrency:
  group: child-advocacy-site-content-write
  cancel-in-progress: false

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply, validate and publish from newest main
        shell: bash
        run: |
          set -euo pipefail
          run_checked() {
            local label="$1"
            shift
            if ! "$@" > /tmp/home-opt-step.log 2>&1; then
              {
                printf 'Homepage optimization failed during: %s\n\n' "$label"
                cat /tmp/home-opt-step.log
              } > .github/homepage-optimization-diagnostic.txt
              cat .github/homepage-optimization-diagnostic.txt
              return 1
            fi
            cat /tmp/home-opt-step.log
          }

          for attempt in 1 2 3; do
            echo "Homepage optimization attempt $attempt"
            git fetch origin main
            git reset --hard origin/main
            git clean -fd

            run_checked 'Python syntax validation' python3 -m py_compile scripts/apply_home_first_round.py scripts/sync_sitemap.py
            run_checked 'Homepage transformation and validation' python3 scripts/apply_home_first_round.py
            run_checked 'Sitemap synchronization' python3 scripts/sync_sitemap.py

            test -s assets/home-first-round-optimization.css
            grep -q 'home-priority-strip' index.html
            grep -q 'home-guard-actions' index.html
            grep -q 'home-hearing-zone-feature-day4' index.html
            grep -q 'home-disc-motion-control' assets/home-gsap.js
            grep -q 'content="en_US"' en/index.html
            grep -q 'content="ja_JP"' ja/index.html

            rm -f .home-optimization-generated-files
            rm -f .github/homepage-optimization-diagnostic.txt
            rm -f \
              .github/workflows/oneoff-homepage-optimization-20260821.yml \
              .github/workflows/oneoff-homepage-optimization-retry-20260821.yml \
              .github/workflows/oneoff-homepage-optimization-direct-20260821.yml \
              .github/workflows/oneoff-homepage-optimization-robust-20260821.yml \
              .github/workflows/oneoff-home-first-round-final-20260821.yml

            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -A
            git diff --cached --check
            if git diff --cached --quiet; then
              echo 'No homepage changes were necessary.'
              exit 0
            fi
            git commit -m 'Complete homepage hierarchy accessibility SEO and performance optimization'
            if git push origin HEAD:main; then
              exit 0
            fi
            echo 'Main advanced during publication; rebuilding from newest revision.'
          done

          printf 'Could not publish after three safe retries.\n' > .github/homepage-optimization-diagnostic.txt
          exit 1

      - name: Publish failure diagnostic
        if: failure()
        shell: bash
        run: |
          set +e
          test -s .github/homepage-optimization-diagnostic.txt || printf 'Workflow failed before a detailed diagnostic was created.\n' > .github/homepage-optimization-diagnostic.txt
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/home-opt-step.log /tmp/home-opt-step-copy.log 2>/dev/null || true
          if test -s /tmp/home-opt-step-copy.log; then
            {
              printf 'Homepage optimization step output:\n\n'
              cat /tmp/home-opt-step-copy.log
            } > .github/homepage-optimization-diagnostic.txt
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/homepage-optimization-diagnostic.txt
          git diff --cached --quiet && exit 0
          git commit -m 'Record homepage optimization diagnostic'
          git pull --rebase origin main
          git push
