name: Definitive Kaikai prologue and dual-track browser proof

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oneoff-kaikai-prologue-dual-track-live-browser-20260829-v4.yml'

permissions:
  contents: read

jobs:
  live-chrome-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Install Playwright driver
        run: npm install --no-save playwright-core@1.55.0

      - name: Verify live prologue and two-track rotation
        run: |
          mkdir -p browser-proof
          node --input-type=module <<'JS'
          import { chromium } from 'playwright-core';
          import fs from 'node:fs';

          const sites = {
            'zh-Hant': 'https://jerryzuhow77.github.io/child-advocacy-site/hearing-records/prison-watch/kaikai-final-chapter/',
            'zh-Hans': 'https://jerryzuhow77.github.io/child-advocacy-site/hearing-records/prison-watch/kaikai-final-chapter/zh-Hans/'
          };
          const viewports = {
            desktop: { width: 1440, height: 1000, mobile: false },
            mobile: { width: 390, height: 844, mobile: true }
          };
          const out = 'browser-proof';
          const browser = await chromium.launch({
            headless: true,
            executablePath: '/usr/bin/google-chrome',
            args: ['--no-sandbox', '--disable-dev-shm-usage']
          });
          const results = [];

          const mediaState = (page, selector) => page.locator(selector).evaluate((media) => ({
            autoplay: media.autoplay,
            muted: media.muted,
            playsInline: media.playsInline,
            paused: media.paused,
            ended: media.ended,
            currentTime: Number(media.currentTime.toFixed(3)),
            duration: Number.isFinite(media.duration) ? Number(media.duration.toFixed(3)) : null,
            readyState: media.readyState,
            currentSrc: media.currentSrc,
            error: media.error ? { code: media.error.code, message: media.error.message || '' } : null,
            trackIndex: media.dataset.trackIndex ?? null,
            trackCount: media.dataset.trackCount ?? null,
            trackTitle: media.dataset.trackTitle ?? null,
            sources: [...media.querySelectorAll('source')].map((source) => ({ src: source.src, type: source.type }))
          }));

          const waitMetadata = (page, selector) => page.waitForFunction((sel) => {
            const media = document.querySelector(sel);
            return media && media.readyState >= 1 && Number.isFinite(media.duration) && media.duration > 0;
          }, selector, { timeout: 30000 });

          const checkMediaUrl = async (request, url) => {
            try {
              const response = await request.fetch(url, { method: 'HEAD', timeout: 30000, failOnStatusCode: false });
              return {
                url,
                status: response.status(),
                contentType: response.headers()['content-type'] || '',
                contentLength: response.headers()['content-length'] || ''
              };
            } catch (error) {
              return { url, status: 0, error: String(error?.message || error) };
            }
          };

          for (const [language, baseUrl] of Object.entries(sites)) {
            for (const [viewportName, viewport] of Object.entries(viewports)) {
              const context = await browser.newContext({
                viewport: { width: viewport.width, height: viewport.height },
                locale: language === 'zh-Hant' ? 'zh-TW' : 'zh-CN',
                isMobile: viewport.mobile,
                hasTouch: viewport.mobile,
                deviceScaleFactor: viewport.mobile ? 2 : 1
              });
              const page = await context.newPage();
              const result = {
                language,
                viewport: viewportName,
                dimensions: `${viewport.width}x${viewport.height}`,
                pageStatus: null,
                script: '',
                prologue: {},
                audio: {},
                mediaChecks: [],
                layout: {},
                pageErrors: [],
                sameOriginErrors: [],
                failures: []
              };
              results.push(result);
              const fail = (message) => result.failures.push(message);

              await page.addInitScript(() => {
                window.__mediaEvents = [];
                window.__cls = 0;
                const record = (event) => {
                  const media = event.target;
                  if (!(media instanceof HTMLMediaElement)) return;
                  window.__mediaEvents.push({
                    type: event.type,
                    tag: media.tagName,
                    id: media.id || '',
                    prologue: media.hasAttribute('data-prologue-video'),
                    currentTime: Number(media.currentTime.toFixed(3)),
                    src: media.currentSrc || media.src || ''
                  });
                };
                for (const type of ['loadstart', 'loadedmetadata', 'canplay', 'play', 'playing', 'pause', 'ended', 'error']) {
                  document.addEventListener(type, record, true);
                }
                try {
                  new PerformanceObserver((list) => {
                    for (const entry of list.getEntries()) {
                      if (!entry.hadRecentInput) window.__cls += entry.value;
                    }
                  }).observe({ type: 'layout-shift', buffered: true });
                } catch (_) {}
              });

              page.on('pageerror', (error) => result.pageErrors.push(String(error)));
              page.on('response', (response) => {
                const parsed = new URL(response.url());
                if (parsed.hostname === 'jerryzuhow77.github.io' && response.status() >= 400) {
                  result.sameOriginErrors.push({ status: response.status(), url: response.url() });
                }
              });

              try {
                const response = await page.goto(`${baseUrl}?definitive-media-proof=${Date.now()}-${language}-${viewportName}`, {
                  waitUntil: 'domcontentloaded',
                  timeout: 60000
                });
                result.pageStatus = response?.status() ?? null;
                if (result.pageStatus !== 200) fail(`page HTTP ${result.pageStatus}`);

                await page.waitForSelector('[data-prologue-video]', { state: 'attached', timeout: 20000 });
                await page.waitForSelector('#chapterBgm', { state: 'attached', timeout: 20000 });
                await page.waitForFunction(() => document.documentElement.classList.contains('js-ready'), undefined, { timeout: 12000 });
                result.script = await page.locator('script[src*="final-chapter.js"]').getAttribute('src') || '';
                if (!result.script.includes('final-chapter.js?v=20260829-32')) fail(`unexpected script ${result.script}`);

                await page.evaluate(async () => { await document.fonts.ready; });
                await waitMetadata(page, '[data-prologue-video]');
                const layoutBefore = await page.evaluate(() => {
                  const hero = document.querySelector('.hero')?.getBoundingClientRect();
                  const prologue = document.querySelector('#prologue-film')?.getBoundingClientRect();
                  return {
                    heroHeight: Math.round(hero?.height || 0),
                    prologueTop: Math.round(prologue?.top || 0),
                    prologueHeight: Math.round(prologue?.height || 0),
                    overflow: Math.max(document.documentElement.scrollWidth, document.body.scrollWidth) - innerWidth
                  };
                });

                const prologueBefore = await mediaState(page, '[data-prologue-video]');
                await page.waitForFunction((startAt) => {
                  const video = document.querySelector('[data-prologue-video]');
                  return video && (video.currentTime > startAt + 0.15 || video.ended);
                }, prologueBefore.currentTime, { timeout: 12000 });
                const prologueAfter = await mediaState(page, '[data-prologue-video]');
                const prologueEvents = await page.evaluate(() => (window.__mediaEvents || []).filter((event) => event.prologue));
                result.prologue = { before: prologueBefore, after: prologueAfter, events: prologueEvents };
                if (!prologueBefore.autoplay) fail('prologue autoplay=false');
                if (!prologueBefore.muted) fail('prologue muted=false');
                if (!prologueBefore.playsInline) fail('prologue playsInline=false');
                if (prologueBefore.error || prologueAfter.error) fail(`prologue media error ${JSON.stringify(prologueBefore.error || prologueAfter.error)}`);
                if (!(prologueAfter.duration >= 4.8 && prologueAfter.duration <= 5.3)) fail(`prologue duration=${prologueAfter.duration}`);
                if (!prologueEvents.some((event) => event.type === 'play' || event.type === 'playing')) fail('prologue emitted no autoplay event');
                if (!(prologueAfter.currentTime > prologueBefore.currentTime || prologueAfter.ended)) fail('prologue did not advance');
                await page.locator('#prologue-film').screenshot({ path: `${out}/${language}_${viewportName}_prologue.png` });

                await waitMetadata(page, '#chapterBgm');
                const firstReady = await mediaState(page, '#chapterBgm');
                result.audio.firstReady = firstReady;
                result.audio.firstCounter = await page.locator('[data-audio-time]').textContent();
                if (firstReady.trackCount !== '2') fail(`trackCount=${firstReady.trackCount}`);
                if (firstReady.trackIndex !== '0') fail(`first trackIndex=${firstReady.trackIndex}`);
                if (!/歲月深處的告白|岁月深处的告白/.test(firstReady.trackTitle || '')) fail(`first title=${firstReady.trackTitle}`);
                if (!String(result.audio.firstCounter).includes('1/2')) fail(`first counter=${result.audio.firstCounter}`);

                await page.locator('.audio-toggle').click();
                await page.waitForFunction(() => {
                  const audio = document.querySelector('#chapterBgm');
                  return audio && !audio.paused && audio.currentTime > 0.04;
                }, undefined, { timeout: 12000 });
                await page.locator('#chapterBgm').evaluate((audio) => { audio.playbackRate = 16; });
                const firstPlaying = await mediaState(page, '#chapterBgm');
                result.audio.firstPlaying = firstPlaying;
                if (firstPlaying.error || firstPlaying.paused) fail(`first track failed ${JSON.stringify(firstPlaying.error)}`);

                await page.waitForFunction(() => document.querySelector('#chapterBgm')?.dataset.trackIndex === '1', undefined, { timeout: 20000 });
                await waitMetadata(page, '#chapterBgm');
                await page.locator('#chapterBgm').evaluate((audio) => { audio.playbackRate = 16; });
                await page.waitForFunction(() => {
                  const audio = document.querySelector('#chapterBgm');
                  return audio && audio.dataset.trackIndex === '1' && !audio.paused && audio.currentTime > 0.04;
                }, undefined, { timeout: 12000 });
                const secondPlaying = await mediaState(page, '#chapterBgm');
                result.audio.secondPlaying = secondPlaying;
                result.audio.secondCounter = await page.locator('[data-audio-time]').textContent();
                if (secondPlaying.error || secondPlaying.paused) fail(`second track failed ${JSON.stringify(secondPlaying.error)}`);
                if (secondPlaying.trackIndex !== '1') fail(`second trackIndex=${secondPlaying.trackIndex}`);
                if (secondPlaying.trackTitle !== '退潮的街') fail(`second title=${secondPlaying.trackTitle}`);
                if (!secondPlaying.sources.some((source) => source.src.includes('kaikai-chapter2-bgm-02-20260829'))) fail('second source missing');
                if (!String(result.audio.secondCounter).includes('2/2')) fail(`second counter=${result.audio.secondCounter}`);
                await page.screenshot({ path: `${out}/${language}_${viewportName}_track2.png`, fullPage: false });

                await page.waitForFunction(() => document.querySelector('#chapterBgm')?.dataset.trackIndex === '0', undefined, { timeout: 20000 });
                await waitMetadata(page, '#chapterBgm');
                await page.waitForFunction(() => {
                  const audio = document.querySelector('#chapterBgm');
                  return audio && audio.dataset.trackIndex === '0' && !audio.paused;
                }, undefined, { timeout: 12000 });
                const wrapped = await mediaState(page, '#chapterBgm');
                result.audio.wrapped = wrapped;
                result.audio.wrappedCounter = await page.locator('[data-audio-time]').textContent();
                if (wrapped.trackIndex !== '0' || wrapped.paused) fail('track 2 did not wrap to playing track 1');
                if (!String(result.audio.wrappedCounter).includes('1/2')) fail(`wrapped counter=${result.audio.wrappedCounter}`);
                await page.locator('#chapterBgm').evaluate((audio) => audio.pause());

                const actualUrls = [...new Set([
                  prologueAfter.currentSrc,
                  ...prologueAfter.sources.map((source) => source.src),
                  firstReady.currentSrc,
                  ...firstReady.sources.map((source) => source.src),
                  secondPlaying.currentSrc,
                  ...secondPlaying.sources.map((source) => source.src)
                ].filter(Boolean))];
                for (const mediaUrl of actualUrls) result.mediaChecks.push(await checkMediaUrl(context.request, mediaUrl));
                const badMedia = result.mediaChecks.filter((item) => ![200, 206].includes(item.status));
                if (badMedia.length) fail(`actual media HTTP failures ${JSON.stringify(badMedia)}`);

                if (viewport.mobile) {
                  await page.evaluate(() => window.scrollTo(0, 520));
                  await page.waitForTimeout(500);
                  const collapsed = await page.locator('[data-audio-controller]').evaluate((controller) => ({
                    collapsed: controller.classList.contains('is-collapsed'),
                    expanded: controller.querySelector('[data-audio-collapse]')?.getAttribute('aria-expanded')
                  }));
                  result.audio.mobileCollapsed = collapsed;
                  if (!collapsed.collapsed || collapsed.expanded !== 'false') fail(`mobile collapse failed ${JSON.stringify(collapsed)}`);
                  await page.locator('[data-audio-collapse]').click();
                  await page.waitForTimeout(180);
                  const reopened = await page.locator('[data-audio-controller]').evaluate((controller) => ({
                    collapsed: controller.classList.contains('is-collapsed'),
                    expanded: controller.querySelector('[data-audio-collapse]')?.getAttribute('aria-expanded')
                  }));
                  result.audio.mobileReopened = reopened;
                  if (reopened.collapsed || reopened.expanded !== 'true') fail(`mobile reopen failed ${JSON.stringify(reopened)}`);
                  await page.evaluate(() => window.scrollTo(0, 0));
                  await page.waitForTimeout(250);
                }

                const layoutAfter = await page.evaluate(() => {
                  const hero = document.querySelector('.hero')?.getBoundingClientRect();
                  const prologue = document.querySelector('#prologue-film')?.getBoundingClientRect();
                  return {
                    heroHeight: Math.round(hero?.height || 0),
                    prologueTop: Math.round(prologue?.top || 0),
                    prologueHeight: Math.round(prologue?.height || 0),
                    overflow: Math.max(document.documentElement.scrollWidth, document.body.scrollWidth) - innerWidth,
                    cls: Number((window.__cls || 0).toFixed(4))
                  };
                });
                result.layout = {
                  before: layoutBefore,
                  after: layoutAfter,
                  heroDelta: Math.abs(layoutAfter.heroHeight - layoutBefore.heroHeight),
                  prologueTopDelta: Math.abs(layoutAfter.prologueTop - layoutBefore.prologueTop),
                  prologueHeightDelta: Math.abs(layoutAfter.prologueHeight - layoutBefore.prologueHeight)
                };
                if (Math.max(layoutBefore.overflow, layoutAfter.overflow) > 2) fail(`horizontal overflow ${Math.max(layoutBefore.overflow, layoutAfter.overflow)}px`);
                if (result.layout.heroDelta > 24 || result.layout.prologueTopDelta > 24 || result.layout.prologueHeightDelta > 24) fail(`media layout shift ${JSON.stringify(result.layout)}`);
                if (layoutAfter.cls > 0.1) fail(`CLS=${layoutAfter.cls}`);

                result.mediaEvents = await page.evaluate(() => window.__mediaEvents || []);
                const mediaErrors = result.mediaEvents.filter((event) => event.type === 'error');
                if (mediaErrors.length) fail(`media error events ${JSON.stringify(mediaErrors)}`);
                if (result.pageErrors.length) fail(`${result.pageErrors.length} page error(s)`);
                if (result.sameOriginErrors.length) fail(`${result.sameOriginErrors.length} same-origin HTTP error(s)`);
              } catch (error) {
                fail(`exception: ${error?.message || error}`);
                result.exception = String(error?.stack || error);
                await page.screenshot({ path: `${out}/${language}_${viewportName}_exception.png`, fullPage: false }).catch(() => {});
              }

              await context.close();
            }
          }

          await browser.close();
          fs.writeFileSync(`${out}/report.json`, JSON.stringify({ generatedAt: new Date().toISOString(), results }, null, 2));
          const lines = ['# Definitive Kaikai prologue and dual-track browser proof', ''];
          for (const result of results) {
            lines.push(`## ${result.language} · ${result.viewport} (${result.dimensions})`);
            lines.push(`- Page HTTP: ${result.pageStatus}; script: ${result.script || 'missing'}`);
            lines.push(`- Prologue: duration=${result.prologue.after?.duration ?? 'n/a'}s; autoplay=${result.prologue.before?.autoplay ?? 'n/a'}; muted=${result.prologue.before?.muted ?? 'n/a'}; advanced=${(result.prologue.after?.currentTime ?? 0) > (result.prologue.before?.currentTime ?? 0) || Boolean(result.prologue.after?.ended)}`);
            lines.push(`- Track 1: ${result.audio.firstReady?.trackTitle || 'n/a'}; playing=${result.audio.firstPlaying ? !result.audio.firstPlaying.paused : false}; counter=${result.audio.firstCounter || 'n/a'}`);
            lines.push(`- Track 2: ${result.audio.secondPlaying?.trackTitle || 'n/a'}; playing=${result.audio.secondPlaying ? !result.audio.secondPlaying.paused : false}; counter=${result.audio.secondCounter || 'n/a'}`);
            lines.push(`- Wrap 2→1: index=${result.audio.wrapped?.trackIndex ?? 'n/a'}; playing=${result.audio.wrapped ? !result.audio.wrapped.paused : false}; counter=${result.audio.wrappedCounter || 'n/a'}`);
            if (result.audio.mobileCollapsed) lines.push(`- Mobile controller: collapsed=${result.audio.mobileCollapsed.collapsed}; reopened=${!result.audio.mobileReopened?.collapsed}`);
            lines.push(`- Actual media URLs: ${result.mediaChecks.length}; bad=${result.mediaChecks.filter((item) => ![200,206].includes(item.status)).length}`);
            lines.push(`- Overflow=${Math.max(result.layout.before?.overflow || 0, result.layout.after?.overflow || 0)}px; CLS=${result.layout.after?.cls ?? 'n/a'}`);
            lines.push(`- Page errors=${result.pageErrors.length}; same-origin HTTP errors=${result.sameOriginErrors.length}`);
            lines.push(`- Failures: ${result.failures.length ? result.failures.join(' | ') : 'none'}`);
            lines.push('');
          }
          const failures = results.reduce((sum, result) => sum + result.failures.length, 0);
          lines.push(`**Total failures: ${failures}**`);
          fs.writeFileSync(`${out}/summary.md`, lines.join('\n'));
          console.log(lines.join('\n'));
          if (failures) process.exit(1);
          JS

      - name: Upload browser proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: definitive-kaikai-prologue-dual-track-browser-proof
          path: browser-proof
          retention-days: 14
