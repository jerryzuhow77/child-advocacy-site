name: Apply final Qiqi mobile actor motion

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oneoff-qiqi-mobile-actor-motion-final-fast.yml'
      - 'scripts/patch_qiqi_mobile_actor_motion_final.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: qiqi-mobile-actor-motion-final-fast-20260821
  cancel-in-progress: false

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply actor-size and motion patch
        run: python3 scripts/patch_qiqi_mobile_actor_motion_final.py
      - name: Refresh multilingual asset versions
        env:
          QIQI_VERSION_SHA: ${{ github.sha }}
        run: python3 scripts/sync_fujian_qiqi_feature.py
      - name: Validate output
        run: |
          node --check assets/fujian-qiqi-feature.js
          python3 -m py_compile scripts/sync_fujian_qiqi_feature.py scripts/patch_qiqi_mobile_actor_motion_final.py
          grep -q 'Final mobile actor proportions' assets/fujian-qiqi-feature.css
          grep -q 'profile.shift \*= 0.62' assets/fujian-qiqi-feature.js
          grep -q "version: '1.3.6'" assets/fujian-qiqi-feature.js
          git diff --check
      - name: Commit and clean temporary files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f -- \
            .github/workflows/oneoff-qiqi-mobile-actor-motion-final.yml \
            .github/workflows/oneoff-qiqi-mobile-actor-motion-final-fast.yml \
            scripts/patch_qiqi_mobile_actor_motion_final.py
          git add -- \
            assets/fujian-qiqi-feature.css \
            assets/fujian-qiqi-feature.js \
            historical-cases/regions/mainland-china/fujian-qiqi/index.html \
            zh-hans/historical-cases/regions/mainland-china/fujian-qiqi/index.html \
            en/historical-cases/regions/mainland-china/fujian-qiqi/index.html \
            ja/historical-cases/regions/mainland-china/fujian-qiqi/index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Finalize Qiqi mobile actor proportions and motion'
          git pull --rebase origin main
          git push

