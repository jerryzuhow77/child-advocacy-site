name: Final verify Kaikai medical hub root entry

# Verification revision 2: measure page overflow before QA-only menu rendering.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oneoff-kaikai-medical-root-entry-final-verify-20260829.yml'

permissions:
  contents: read

jobs:
  chrome:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Make nested header-menu verification responsive-safe
        run: |
          python3 .github/scripts/patch-kaikai-medical-root-verifier-20260829.py
          node --check .github/scripts/verify-kaikai-medical-root-entry-20260829.mjs

      - name: Install Playwright driver
        run: npm install --no-save playwright-core@1.55.0

      - name: Run final public desktop and mobile Chrome checks
        run: node .github/scripts/verify-kaikai-medical-root-entry-20260829.mjs

      - name: Upload final screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kaikai-medical-root-entry-final-browser-proof
          path: browser-validation/medical-root-entry
          retention-days: 14
