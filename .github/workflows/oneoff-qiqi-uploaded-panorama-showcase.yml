name: Publish uploaded Qiqi panorama showcase

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oneoff-qiqi-uploaded-panorama-showcase.yml'

permissions:
  contents: write

concurrency:
  group: child-advocacy-site-sitemap
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and verify the uploaded panorama
        run: |
          mkdir -p assets/fujian-qiqi
          cat .github/qiqi-panorama-parts/part-01.b64 \
              .github/qiqi-panorama-parts/part-02.b64 \
              .github/qiqi-panorama-parts/part-03.b64 \
            | tr -d '\r\n' \
            | base64 --decode \
            > assets/fujian-qiqi/ending-panorama-watercolor-20260821.webp
          python3 - <<'PY'
          from hashlib import sha256
          from pathlib import Path

          path = Path('assets/fujian-qiqi/ending-panorama-watercolor-20260821.webp')
          data = path.read_bytes()
          assert len(data) == 42446, f'unexpected panorama size: {len(data)}'
          assert data[:4] == b'RIFF' and data[8:12] == b'WEBP', 'not a valid WebP RIFF container'
          digest = sha256(data).hexdigest()
          assert digest == 'c7aa2065231d2bb9a91f6862c75a2fcd00033ef7d9d68e7fa278647de087ea1e', digest
          print(f'Verified uploaded panorama: {len(data)} bytes, sha256={digest}')
          PY

      - name: Attach the dedicated ending experience to all four languages
        run: |
          python3 - <<'PY'
          from pathlib import Path

          pages = {
              Path('historical-cases/regions/mainland-china/fujian-qiqi/index.html'): '../../../../',
              Path('zh-hans/historical-cases/regions/mainland-china/fujian-qiqi/index.html'): '../../../../../',
              Path('en/historical-cases/regions/mainland-china/fujian-qiqi/index.html'): '../../../../../',
              Path('ja/historical-cases/regions/mainland-china/fujian-qiqi/index.html'): '../../../../../',
          }
          version = '20260821-panorama-2'
          for path, prefix in pages.items():
              html = path.read_text(encoding='utf-8')
              css_name = 'fujian-qiqi-ending-showcase-20260821.css'
              js_name = 'fujian-qiqi-ending-showcase-20260821.js'
              css_tag = f'  <link rel="stylesheet" href="{prefix}assets/{css_name}?v={version}">\n'
              js_tag = f'  <script src="{prefix}assets/{js_name}?v={version}"></script>\n'

              if css_name not in html:
                  html = html.replace('</head>', css_tag + '</head>', 1)

              if js_name not in html:
                  feature_needle = f'  <script src="{prefix}assets/fujian-qiqi-feature.js'
                  if feature_needle not in html:
                      raise RuntimeError(f'Missing main feature script in {path}')
                  html = html.replace(feature_needle, js_tag + feature_needle, 1)

              if html.count(css_name) != 1 or html.count(js_name) != 1:
                  raise RuntimeError(f'Duplicate or missing showcase asset in {path}')
              path.write_text(html, encoding='utf-8', newline='\n')
          PY

      - name: Validate JavaScript, CSS references and language pages
        run: |
          node --check assets/fujian-qiqi-ending-showcase-20260821.js
          grep -q 'ending-panorama-watercolor-20260821.webp' assets/fujian-qiqi-ending-showcase-20260821.css
          python3 - <<'PY'
          from pathlib import Path

          pages = [
              Path('historical-cases/regions/mainland-china/fujian-qiqi/index.html'),
              Path('zh-hans/historical-cases/regions/mainland-china/fujian-qiqi/index.html'),
              Path('en/historical-cases/regions/mainland-china/fujian-qiqi/index.html'),
              Path('ja/historical-cases/regions/mainland-china/fujian-qiqi/index.html'),
          ]
          for page in pages:
              html = page.read_text(encoding='utf-8')
              assert html.count('fujian-qiqi-ending-showcase-20260821.css') == 1, page
              assert html.count('fujian-qiqi-ending-showcase-20260821.js') == 1, page
              assert html.index('fujian-qiqi-ending-showcase-20260821.js') < html.index('fujian-qiqi-feature.js'), page
              assert html.count('</html>') == 1, page
          print('Validated the four-language ending showcase integration.')
          PY
          git diff --check

      - name: Commit the panorama and remove temporary staging files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -r -- .github/qiqi-panorama-parts
          git rm -- .github/workflows/oneoff-qiqi-uploaded-panorama-showcase.yml
          git add -- \
            assets/fujian-qiqi/ending-panorama-watercolor-20260821.webp \
            assets/fujian-qiqi-ending-showcase-20260821.css \
            assets/fujian-qiqi-ending-showcase-20260821.js \
            historical-cases/regions/mainland-china/fujian-qiqi/index.html \
            zh-hans/historical-cases/regions/mainland-china/fujian-qiqi/index.html \
            en/historical-cases/regions/mainland-china/fujian-qiqi/index.html \
            ja/historical-cases/regions/mainland-china/fujian-qiqi/index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Showcase the uploaded watercolor panorama in Qiqi epilogue'
          git pull --rebase origin main
          git push
