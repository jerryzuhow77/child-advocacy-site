name: Global Protection live feature check

on:
  push:
    branches:
      - ops/global-protection-live-feature-check-20260823
    paths:
      - .github/workflows/global-protection-live-feature-check.yml
      - handoffs/global-protection-archive-20260823/live-check/**
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/global-protection-live-feature-check.yml
      - handoffs/global-protection-archive-20260823/live-check/**

permissions:
  contents: read

jobs:
  check:
    name: Read-only homepage, PWA and public API check
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SITE_URL: https://cn.globalprotectionwall.com/
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Inspect live public frontend without mutations
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p live-check-output
          python3 - <<'PY'
          import html
          import json
          import re
          import ssl
          import urllib.error
          import urllib.parse
          import urllib.request
          from datetime import datetime, timezone

          site = "https://cn.globalprotectionwall.com/"
          user_agent = "GlobalProtectionReadOnlyCheck/20260823"
          context = ssl.create_default_context()

          def fetch(url, *, max_bytes=6_000_000):
              req = urllib.request.Request(url, headers={"User-Agent": user_agent, "Accept": "*/*"})
              try:
                  with urllib.request.urlopen(req, timeout=25, context=context) as response:
                      body = response.read(max_bytes + 1)
                      return {
                          "ok": True,
                          "status": response.status,
                          "content_type": response.headers.get("Content-Type", ""),
                          "content_length_read": min(len(body), max_bytes),
                          "truncated": len(body) > max_bytes,
                          "final_url": response.geturl(),
                          "body": body[:max_bytes],
                      }
              except urllib.error.HTTPError as exc:
                  body = exc.read(min(max_bytes, 4096))
                  return {
                      "ok": False,
                      "status": exc.code,
                      "content_type": exc.headers.get("Content-Type", "") if exc.headers else "",
                      "content_length_read": len(body),
                      "truncated": False,
                      "final_url": url,
                      "body": body,
                      "error": f"HTTPError: {exc.code}",
                  }
              except Exception as exc:
                  return {
                      "ok": False,
                      "status": None,
                      "content_type": "",
                      "content_length_read": 0,
                      "truncated": False,
                      "final_url": url,
                      "body": b"",
                      "error": f"{type(exc).__name__}: {exc}",
                  }

          homepage = fetch(site)
          homepage_text = homepage["body"].decode("utf-8", errors="ignore")
          corpus = [homepage_text]
          script_urls = []
          for src in re.findall(r'<script[^>]+src=["\']([^"\']+)["\']', homepage_text, flags=re.I):
              url = urllib.parse.urljoin(site, html.unescape(src))
              parsed = urllib.parse.urlparse(url)
              if parsed.hostname == "cn.globalprotectionwall.com" and url not in script_urls:
                  script_urls.append(url)

          script_results = []
          for url in script_urls[:60]:
              result = fetch(url, max_bytes=8_000_000)
              script_results.append({
                  "url": url,
                  "status": result["status"],
                  "content_type": result["content_type"],
                  "bytes_read": result["content_length_read"],
                  "truncated": result["truncated"],
              })
              if result["body"]:
                  corpus.append(result["body"].decode("utf-8", errors="ignore"))

          combined = "\n".join(corpus)
          markers = [
              "守護文章典藏館",
              "守护文章典藏馆",
              "今天，再讀一篇守護",
              "今天，再读一篇守护",
              "本月值得再讀",
              "本月值得再读",
              "你可能錯過的守護",
              "你可能错过的守护",
              "守護書架",
              "守护书架",
              "繼續閱讀這條守護線",
              "继续阅读这条守护线",
              "Guardian Article Archive",
              "archive-section",
              "ticker-archive-bridge",
              "guardian-archive",
          ]
          marker_results = {}
          for marker in markers:
              escaped = json.dumps(marker, ensure_ascii=True)[1:-1]
              marker_results[marker] = marker in combined or escaped in combined

          baseline_markers = [
              "全球守護留言牆",
              "全球守护留言墙",
              "世界地圖便條牆",
              "世界地图便条墙",
              "守護拼圖",
              "守护拼图",
          ]
          baseline_results = {}
          for marker in baseline_markers:
              escaped = json.dumps(marker, ensure_ascii=True)[1:-1]
              baseline_results[marker] = marker in combined or escaped in combined

          endpoints = {}
          for path in [
              "manifest.webmanifest",
              "sw.js",
              "api/public/messages?limit=1",
          ]:
              result = fetch(urllib.parse.urljoin(site, path), max_bytes=4096)
              endpoints[path] = {
                  "status": result["status"],
                  "content_type": result["content_type"],
                  "bytes_sampled": result["content_length_read"],
                  "error": result.get("error"),
              }

          high_signal = [
              marker_results["守護文章典藏館"],
              marker_results["守护文章典藏馆"],
              marker_results["Guardian Article Archive"],
              marker_results["archive-section"],
              marker_results["ticker-archive-bridge"],
          ]
          detected = any(high_signal)
          result = {
              "generated_at_utc": datetime.now(timezone.utc).isoformat(),
              "mode": "read_only",
              "site_url": site,
              "homepage": {
                  "status": homepage["status"],
                  "content_type": homepage["content_type"],
                  "bytes_read": homepage["content_length_read"],
                  "final_url": homepage["final_url"],
                  "error": homepage.get("error"),
              },
              "same_origin_scripts_discovered": len(script_urls),
              "same_origin_scripts_checked": len(script_results),
              "script_results": script_results,
              "baseline_markers": baseline_results,
              "archive_markers": marker_results,
              "archive_feature_detected": detected,
              "archive_detection_result": "detected_in_live_html_or_same_origin_javascript" if detected else "not_detected_in_live_html_or_same_origin_javascript",
              "endpoints": endpoints,
              "production_mutated": False,
              "data_written": False,
          }
          with open("live-check-output/live-feature-check.json", "w", encoding="utf-8") as fh:
              json.dump(result, fh, ensure_ascii=False, indent=2)

          with open("live-check-output/live-feature-check.md", "w", encoding="utf-8") as fh:
              fh.write("# Global Protection live feature check\n\n")
              fh.write(f"- Homepage HTTP status: `{homepage['status']}`\n")
              fh.write(f"- Same-origin scripts checked: `{len(script_results)}`\n")
              fh.write(f"- Archive feature detected: `{str(detected).lower()}`\n")
              fh.write(f"- Result: `{result['archive_detection_result']}`\n")
              fh.write("- Mode: read-only; no post, account, database, DNS or service mutation.\n\n")
              fh.write("## Endpoint status\n\n")
              for path, entry in endpoints.items():
                  fh.write(f"- `{path}`: `{entry['status']}` · `{entry['content_type']}`\n")
              fh.write("\n## Archive markers\n\n")
              for marker, found in marker_results.items():
                  fh.write(f"- `{marker}`: `{str(found).lower()}`\n")
          PY

          cat live-check-output/live-feature-check.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload sanitized live check
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: global-protection-live-feature-check
          path: live-check-output/
          if-no-files-found: error
          retention-days: 7
