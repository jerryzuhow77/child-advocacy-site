name: Explain Day 4 location labels

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oneoff-day4-location-key.yml'

permissions:
  contents: write

concurrency:
  group: day4-location-key
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add location key to all Day 4 pages
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin main

          python - <<'PY'
          from pathlib import Path
          import re

          pages = {
              Path('hearing-records/prison-watch/kaikai-day4-20250428/index.html'): 'zh',
              Path('source/hearing-records/prison-watch/kaikai-day4-20250428/index.html'): 'zh',
              Path('en/hearing-records/prison-watch/kaikai-day4-20250428/index.html'): 'en',
              Path('source/en/hearing-records/prison-watch/kaikai-day4-20250428/index.html'): 'en',
              Path('ja/hearing-records/prison-watch/kaikai-day4-20250428/index.html'): 'ja',
              Path('source/ja/hearing-records/prison-watch/kaikai-day4-20250428/index.html'): 'ja',
          }

          route = {
              'zh': '''<div class="day4-route day3-reveal" aria-label="劉彩萱證詞中的三處日常動線">
<article><span>乙地</span><small class="day4-location-exact">另一棟的夜間睡覺處</small><strong>夜間睡眠</strong><p>劉彩萱稱晚間與A童在此睡覺；部分夜間照片與乙地罰站情節也涉及此處。這份紀錄未明載完整門牌與樓層。</p></article><i aria-hidden="true">→</i>
<article><span>丙地</span><small class="day4-location-exact">4號3樓・劉若琳住處</small><strong>上午與往返</strong><p>也是劉若琳的居家托育空間。A童前往頻率是兩人證詞爭點；澡盆事件與部分照片涉及此處。</p></article><i aria-hidden="true">→</i>
<article><span>甲地</span><small class="day4-location-exact">4號1樓・白天主要托育處</small><strong>午餐與日間照顧</strong><p>劉彩萱稱白天主要在此托育；準備餐點、用餐、冷靜區／罰站與地下室入口等情節涉及此處。</p></article>
<small>依2025年4月28日庭審問答整理；用途與動線屬證人陳述，不等於法院認定每天均固定如此。</small></div>''',
              'en': '''<div class="day4-route" aria-label="Three location labels in Liu Tsai-hsuan’s testimony">
<article><span>Site B</span><small class="day4-location-exact">Separate building · overnight sleeping location</small><strong>Night</strong><p>Liu Tsai-hsuan said she and the child slept here at night. Some night photographs and standing episodes also involved this site. The source record does not state its full address or floor.</p></article><i aria-hidden="true">→</i>
<article><span>Site C</span><small class="day4-location-exact">No. 4, 3F · Liu Ruo-lin’s residence</small><strong>Morning / movement</strong><p>It was also Liu Ruo-lin’s home childcare setting. How often the child went there is disputed in the testimony; the basin incident and some photographs involved this site.</p></article><i aria-hidden="true">→</i>
<article><span>Site A</span><small class="day4-location-exact">No. 4, 1F · main daytime care location</small><strong>Lunch / daytime</strong><p>Liu Tsai-hsuan described this as the principal daytime childcare site. Meals, the calm-down/standing area and the basement entrance involved this location.</p></article>
<small>Compiled from the 28 April 2025 hearing questions and answers. Uses and movement are witness accounts, not findings that every day followed a fixed route.</small></div>''',
              'ja': '''<div class="day4-route" aria-label="劉彩萱の供述における三つの場所">
<article><span>乙地</span><small class="day4-location-exact">別棟の夜間就寝場所</small><strong>夜間</strong><p>劉彩萱は、夜にA児とここで就寝したと供述した。夜間の写真や乙地で立たせた場面の一部もこの場所に関係する。原記録には完全な住所と階数の記載がない。</p></article><i aria-hidden="true">→</i>
<article><span>丙地</span><small class="day4-location-exact">4号3階・劉若琳の住居</small><strong>午前・移動</strong><p>劉若琳の居宅保育スペースでもある。A児が訪れた頻度は二人の供述の争点で、洗面器の出来事と一部の写真がこの場所に関係する。</p></article><i aria-hidden="true">→</i>
<article><span>甲地</span><small class="day4-location-exact">4号1階・日中の主な保育場所</small><strong>昼食・日中</strong><p>劉彩萱は日中の主な保育場所と供述した。食事の準備、食事、クールダウン／立たせ、地下室入口などがこの場所に関係する。</p></article>
<small>2025年4月28日の法廷での質問と回答から整理。用途と動線は証人の供述であり、毎日固定されていたとの裁判所認定ではない。</small></div>''',
          }

          key = {
              'zh': '''<aside class="day4-location-key day3-reveal" id="location-key" aria-labelledby="day4LocationTitle">
<header><small>LOCATION KEY</small><h3 id="day4LocationTitle">甲、乙、丙地分別是哪裡？</h3><p>「甲地、乙地、丙地」是庭審紀錄使用的地點代稱，不是證據編號。本頁只寫入原始紀錄已公開的樓層與用途，不補寫紀錄未載明的完整地址。</p></header>
<div class="day4-location-grid">
<article class="is-a"><span>甲地</span><strong>4號1樓</strong><p>劉彩萱稱白天主要在此托育。準備餐點、用餐、冷靜區／罰站、地下室入口與家庭共餐等情節涉及此處。</p></article>
<article class="is-b"><span>乙地</span><strong>另一棟的夜間睡覺處</strong><p>劉彩萱稱晚間與A童在此睡覺；部分夜間照片與乙地罰站情節涉及此處。這份紀錄沒有明載完整門牌與樓層。</p></article>
<article class="is-c"><span>丙地</span><strong>4號3樓・劉若琳住處</strong><p>也是劉若琳的居家托育空間。A童前往此處的頻率是本日證詞爭點；澡盆事件與部分照片涉及此處。</p></article>
</div><p class="day4-location-source">閱讀界線｜地點用途與往返動線均依證人陳述整理；除明載的「4號1樓」「4號3樓」外，不推定未公開的完整地址。</p></aside>''',
              'en': '''<aside class="day4-location-key" id="location-key" aria-labelledby="day4LocationTitle">
<header><small>LOCATION KEY</small><h3 id="day4LocationTitle">What do Sites A, B and C mean?</h3><p>They are location labels used in the hearing record, not exhibit numbers. This page shows only the floor and use disclosed in the source record and does not supply an unstated full address.</p></header>
<div class="day4-location-grid">
<article class="is-a"><span>Site A</span><strong>No. 4, 1F</strong><p>Liu Tsai-hsuan described it as the main daytime childcare site. Meals, the calm-down/standing area, basement entrance and family dining involved this location.</p></article>
<article class="is-b"><span>Site B</span><strong>Separate overnight sleeping location</strong><p>Liu Tsai-hsuan said she and the child slept here at night. Some night photographs and standing episodes involved this site. The record does not state its full address or floor.</p></article>
<article class="is-c"><span>Site C</span><strong>No. 4, 3F · Liu Ruo-lin’s residence</strong><p>It was also her home childcare setting. The frequency of the child’s visits is a testimony issue; the basin incident and some photographs involved this site.</p></article>
</div><p class="day4-location-source">Reading limit | Uses and movement are summarized from witness testimony. Apart from “No. 4, 1F” and “No. 4, 3F,” no unpublished address is inferred.</p></aside>''',
              'ja': '''<aside class="day4-location-key" id="location-key" aria-labelledby="day4LocationTitle">
<header><small>LOCATION KEY</small><h3 id="day4LocationTitle">甲・乙・丙地とは？</h3><p>甲地・乙地・丙地は法廷記録で使われた場所の呼称であり、証拠番号ではない。本頁は原記録に明示された階数と用途だけを掲載し、記載のない完全な住所を補わない。</p></header>
<div class="day4-location-grid">
<article class="is-a"><span>甲地</span><strong>4号1階</strong><p>劉彩萱は日中の主な保育場所と供述した。食事の準備、食事、クールダウン／立たせ、地下室入口、家族との食事などが関係する。</p></article>
<article class="is-b"><span>乙地</span><strong>別棟の夜間就寝場所</strong><p>劉彩萱は夜にA児とここで就寝したと供述した。夜間の写真や乙地での立たせも一部関係する。原記録には完全な住所と階数の記載がない。</p></article>
<article class="is-c"><span>丙地</span><strong>4号3階・劉若琳の住居</strong><p>劉若琳の居宅保育スペースでもある。A児が訪れた頻度は本日の供述の争点で、洗面器の出来事と一部の写真が関係する。</p></article>
</div><p class="day4-location-source">読み方の限界｜用途と動線は証人供述から整理した。「4号1階」「4号3階」以外の非公開住所は推定しない。</p></aside>''',
          }

          reminder = {
              'zh': '''<aside class="day4-location-reminder" aria-label="地點代稱快速對照"><b>地點代稱</b><span>甲：4號1樓</span><span>乙：另一棟夜間睡覺處</span><span>丙：4號3樓・劉若琳住處</span><a href="#location-key">查看完整說明 ↑</a></aside>''',
              'en': '''<aside class="day4-location-reminder" aria-label="Location-label quick reference"><b>Location labels</b><span>A: No. 4, 1F</span><span>B: separate overnight location</span><span>C: No. 4, 3F · Liu Ruo-lin’s residence</span><a href="#location-key">Full explanation ↑</a></aside>''',
              'ja': '''<aside class="day4-location-reminder" aria-label="場所呼称の早見表"><b>場所呼称</b><span>甲：4号1階</span><span>乙：別棟の夜間就寝場所</span><span>丙：4号3階・劉若琳の住居</span><a href="#location-key">詳しい説明 ↑</a></aside>''',
          }

          route_pattern = re.compile(r'<div class="day4-route(?: day3-reveal)?"(?:\s+aria-label="[^"]*")?>.*?</div>', re.S)
          record_pattern = re.compile(r'(<section\b[^>]*\bid="full-record"[^>]*>)')

          for path, lang in pages.items():
              if not path.exists():
                  raise SystemExit(f'Missing page: {path}')
              text = path.read_text(encoding='utf-8')
              if text.count('id="location-key"') == 0:
                  text, count = route_pattern.subn(route[lang] + key[lang], text, count=1)
                  if count != 1:
                      raise SystemExit(f'Route block not found in {path}')
              if 'day4-location-reminder' not in text:
                  text, count = record_pattern.subn(reminder[lang] + r'\1', text, count=1)
                  if count != 1:
                      raise SystemExit(f'Full-record insertion point not found in {path}')
              text, count = re.subn(r'day4\.css\?v=[^"\']+', 'day4.css?v=20260821-location-key-1', text)
              if count < 1:
                  raise SystemExit(f'Day 4 stylesheet URL not found in {path}')
              path.write_text(text, encoding='utf-8')

          css = r'''

/* 2026-08-21 Day 4 location-label key */
.day4-location-exact{display:block;margin:.35rem 0 .65rem;color:#8a634d;font-size:.75rem;font-weight:850;line-height:1.5}
.day4-location-key{max-width:1120px;margin:22px auto 0;padding:clamp(20px,3vw,30px);border:1px solid rgba(16,43,58,.13);border-radius:26px;background:linear-gradient(145deg,rgba(255,255,255,.96),rgba(244,239,231,.9));box-shadow:0 16px 42px rgba(16,43,58,.08)}
.day4-location-key header small{display:block;color:#9f4e3f;font-size:.72rem;font-weight:900;letter-spacing:.12em}
.day4-location-key h3{margin:.35rem 0 .55rem;color:#102b3a;font-size:clamp(1.45rem,3vw,2rem);line-height:1.3}
.day4-location-key header p{margin:0;color:#5b717c;line-height:1.75}
.day4-location-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px;margin-top:20px}
.day4-location-grid article{padding:18px;border:1px solid rgba(16,43,58,.1);border-top:4px solid #9f4e3f;border-radius:18px;background:#fff;box-shadow:0 8px 24px rgba(16,43,58,.055)}
.day4-location-grid article.is-b{border-top-color:#3d7185}.day4-location-grid article.is-c{border-top-color:#b98b45}
.day4-location-grid span{display:inline-flex;padding:.25rem .55rem;border-radius:999px;background:#edf2f3;color:#24495a;font-size:.72rem;font-weight:900}
.day4-location-grid strong{display:block;margin:.7rem 0 .45rem;color:#102b3a;font-size:1.05rem;line-height:1.4}
.day4-location-grid p{margin:0;color:#526b76;line-height:1.7}
.day4-location-source{margin:16px 0 0;color:#6b7d85;font-size:.76rem;line-height:1.65}
.day4-location-reminder{display:flex;flex-wrap:wrap;align-items:center;gap:8px;max-width:1180px;margin:0 auto 22px;padding:14px 16px;border:1px solid rgba(16,43,58,.1);border-radius:18px;background:rgba(248,245,239,.94);color:#526b76;box-shadow:0 8px 24px rgba(16,43,58,.05)}
.day4-location-reminder>b{color:#102b3a}.day4-location-reminder span{padding:.35rem .58rem;border-radius:999px;background:#fff;font-size:.78rem;font-weight:800}.day4-location-reminder a{margin-left:auto;color:#8f4438;font-size:.78rem;font-weight:900;text-decoration:none}
@media(max-width:760px){.day4-location-grid{grid-template-columns:1fr}.day4-location-reminder a{width:100%;margin-left:0}.day4-location-exact{font-size:.72rem}}
'''
          for path in (
              Path('hearing-records/prison-watch/kaikai-day4-20250428/day4.css'),
              Path('source/hearing-records/prison-watch/kaikai-day4-20250428/day4.css'),
          ):
              if not path.exists():
                  raise SystemExit(f'Missing stylesheet: {path}')
              text = path.read_text(encoding='utf-8')
              if 'Day 4 location-label key' not in text:
                  text += css
              path.write_text(text, encoding='utf-8')

          for path in pages:
              text = path.read_text(encoding='utf-8')
              assert text.count('id="location-key"') == 1, path
              assert text.count('day4-location-reminder') == 1, path
              assert 'day4.css?v=20260821-location-key-1' in text, path
          PY

          rm -f .github/workflows/oneoff-day4-location-key.yml

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to publish.'
            exit 0
          fi
          git commit -m 'Explain Day 4 location labels'
          git pull --rebase origin main
          git push origin main
