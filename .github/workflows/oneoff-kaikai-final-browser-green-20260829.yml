name: Clean final Kaikai browser regression

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oneoff-kaikai-final-browser-green-20260829.yml'

permissions:
  contents: write

jobs:
  chrome:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wait for current public evidence block
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p browser-validation/final-green
          for attempt in $(seq 1 60); do
            ok=1
            for url in \
              'https://jerryzuhow77.github.io/child-advocacy-site/hearing-records/prison-watch/kaikai-final-chapter/' \
              'https://jerryzuhow77.github.io/child-advocacy-site/hearing-records/prison-watch/kaikai-final-chapter/zh-Hans/'; do
              html="$(curl -fsSL --connect-timeout 15 --max-time 30 "${url}?deploy=${GITHUB_SHA}-${attempt}" || true)"
              grep -q 'final-chapter.js?v=20260829-7' <<<"$html" || ok=0
              grep -q 'id="death-temperature-evidence"' <<<"$html" || ok=0
              grep -q 'href="#death-temperature-evidence"' <<<"$html" || ok=0
            done
            [[ "$ok" -eq 1 ]] && exit 0
            sleep 10
          done
          echo 'The current evidence block did not appear on both public pages.' >&2
          exit 1

      - name: Install Playwright driver
        run: npm install --no-save playwright-core@1.55.0

      - name: Run Google Chrome verification
        run: |
          node --input-type=module <<'JS'
          import { chromium } from 'playwright-core';
          import fs from 'node:fs';

          const output = 'browser-validation/final-green';
          const sites = {
            'zh-Hant': {
              url: 'https://jerryzuhow77.github.io/child-advocacy-site/hearing-records/prison-watch/kaikai-final-chapter/',
              heading: '到院體溫約24°C，真正的離世時間能推到哪裡？',
              testimony: '孩子應已無呼吸心跳一段時間',
              conclusion: '現有公開證據不足以精確到某一鐘點',
              menu: '24°C與離世時間'
            },
            'zh-Hans': {
              url: 'https://jerryzuhow77.github.io/child-advocacy-site/hearing-records/prison-watch/kaikai-final-chapter/zh-Hans/',
              heading: '到院体温约24°C，真正的离世时间能推到哪里？',
              testimony: '孩子应已无呼吸心跳一段时间',
              conclusion: '现有公开证据不足以精确到某一钟点',
              menu: '24°C与离世时间'
            }
          };
          const viewports = {
            desktop: { width: 1440, height: 1000 },
            mobile: { width: 390, height: 844 }
          };
          const compact = (value = '') => value
            .normalize('NFKC')
            .replace(/[\s\u200B-\u200D\uFEFF]+/gu, '');
          const browser = await chromium.launch({
            headless: true,
            executablePath: '/usr/bin/google-chrome',
            args: ['--no-sandbox', '--disable-dev-shm-usage']
          });
          const results = [];
          let failed = false;

          const waitForTarget = async (page, id) => {
            await page.waitForSelector(`#${id}`, { state: 'visible', timeout: 15000 });
            await page.waitForFunction((targetId) => {
              const target = document.getElementById(targetId);
              if (!target || location.hash !== `#${targetId}`) return false;
              const rect = target.getBoundingClientRect();
              const style = getComputedStyle(target);
              return style.display !== 'none'
                && style.visibility !== 'hidden'
                && Number(style.opacity) >= 0.99
                && rect.top >= 48
                && rect.top <= 140
                && rect.bottom > rect.top;
            }, id, { timeout: 12000 });
            await page.waitForTimeout(350);
            return page.locator(`#${id}`).evaluate((target) => {
              const rect = target.getBoundingClientRect();
              return {
                hash: location.hash,
                top: Math.round(rect.top),
                bottom: Math.round(rect.bottom),
                visible: rect.top >= 48 && rect.top <= 140 && rect.bottom > rect.top,
                opacity: Number(getComputedStyle(target).opacity),
                overflow: Math.max(0, Math.max(document.documentElement.scrollWidth, document.body.scrollWidth) - innerWidth)
              };
            });
          };

          for (const [language, site] of Object.entries(sites)) {
            for (const [viewportName, viewport] of Object.entries(viewports)) {
              const context = await browser.newContext({
                viewport,
                locale: language === 'zh-Hant' ? 'zh-TW' : 'zh-CN',
                colorScheme: 'light'
              });
              const page = await context.newPage();
              const pageErrors = [];
              const sameOriginErrors = [];
              const failedRequests = [];
              page.on('pageerror', error => pageErrors.push(String(error)));
              page.on('response', response => {
                const parsed = new URL(response.url());
                if (parsed.hostname === 'jerryzuhow77.github.io' && response.status() >= 400) {
                  sameOriginErrors.push({ url: response.url(), status: response.status() });
                }
              });
              page.on('requestfailed', request => {
                failedRequests.push({
                  url: request.url(),
                  type: request.resourceType(),
                  error: request.failure()?.errorText || ''
                });
              });

              const result = {
                language,
                viewport: viewportName,
                dimensions: viewport,
                checks: {},
                initial: null,
                menuJump: null,
                direct: {},
                reload: {},
                pageErrors,
                sameOriginErrors,
                failedRequests,
                passed: false
              };
              results.push(result);

              try {
                const initialResponse = await page.goto(`${site.url}?qa=${Date.now()}-${language}-${viewportName}`, {
                  waitUntil: 'domcontentloaded',
                  timeout: 60000
                });
                await page.waitForSelector('#death-temperature-evidence', { state: 'visible', timeout: 15000 });
                await page.waitForTimeout(1000);

                result.initial = await page.evaluate(({ heading, testimony, conclusion, menu }) => {
                  const compactInPage = (value = '') => value
                    .normalize('NFKC')
                    .replace(/[\s\u200B-\u200D\uFEFF]+/gu, '');
                  const target = document.getElementById('death-temperature-evidence');
                  const targetText = compactInPage(target?.textContent || '');
                  const navLinks = [...document.querySelectorAll('a[href="#death-temperature-evidence"]')];
                  const sources = [...(target?.querySelectorAll('.source-chips a') || [])].map(link => link.href);
                  return {
                    http: 200,
                    headingPresent: targetText.includes(compactInPage(heading)),
                    testimonyPresent: targetText.includes(compactInPage(testimony)),
                    conclusionPresent: targetText.includes(compactInPage(conclusion)),
                    menuLinkPresent: navLinks.some(link => compactInPage(link.textContent || '') === compactInPage(menu)),
                    testimonySourcePresent: sources.includes('https://www.taisounds.com/news/content/95/230066'),
                    forensicSourcePresent: sources.some(href => href.startsWith('https://doi.org/10.1177/002580247701700209')),
                    uniqueTemperatureId: document.querySelectorAll('#death-temperature-evidence').length === 1,
                    uniqueDentalId: document.querySelectorAll('#dental-warning').length === 1,
                    overflow: Math.max(0, Math.max(document.documentElement.scrollWidth, document.body.scrollWidth) - innerWidth)
                  };
                }, site);
                result.initial.http = initialResponse?.status() ?? null;

                await page.locator('#menuButton').click();
                const menuLink = page.locator('#siteNav a[href="#death-temperature-evidence"]');
                const group = menuLink.locator('xpath=ancestor::details[1]');
                if (await group.count()) await group.evaluate(element => { element.open = true; });
                await menuLink.click({ timeout: 10000 });
                result.menuJump = await waitForTarget(page, 'death-temperature-evidence');
                await page.screenshot({ path: `${output}/${language}_${viewportName}_menu-temperature.png`, fullPage: false });

                for (const id of ['dental-warning', 'death-temperature-evidence']) {
                  const directResponse = await page.goto(`${site.url}?qa=${Date.now()}-${id}#${id}`, {
                    waitUntil: 'domcontentloaded',
                    timeout: 60000
                  });
                  result.direct[id] = await waitForTarget(page, id);
                  result.direct[id].http = directResponse?.status() ?? null;
                  await page.screenshot({ path: `${output}/${language}_${viewportName}_${id}.png`, fullPage: false });

                  const reloadResponse = await page.reload({ waitUntil: 'domcontentloaded', timeout: 60000 });
                  result.reload[id] = await waitForTarget(page, id);
                  result.reload[id].http = reloadResponse?.status() ?? null;
                }

                const relevantRequestFailures = failedRequests.filter(item =>
                  !(item.type === 'media' && item.error === 'net::ERR_ABORTED')
                );
                result.checks = {
                  initialHttp200: result.initial.http === 200,
                  headingPresent: result.initial.headingPresent,
                  testimonyPresent: result.initial.testimonyPresent,
                  conclusionPresent: result.initial.conclusionPresent,
                  menuLinkPresent: result.initial.menuLinkPresent,
                  testimonySourcePresent: result.initial.testimonySourcePresent,
                  forensicSourcePresent: result.initial.forensicSourcePresent,
                  uniqueIds: result.initial.uniqueTemperatureId && result.initial.uniqueDentalId,
                  noInitialOverflow: result.initial.overflow <= 2,
                  menuJumpCorrect: result.menuJump.hash === '#death-temperature-evidence' && result.menuJump.visible && result.menuJump.overflow <= 2,
                  directDentalCorrect: result.direct['dental-warning'].http === 200 && result.direct['dental-warning'].hash === '#dental-warning' && result.direct['dental-warning'].visible && result.direct['dental-warning'].overflow <= 2,
                  reloadDentalCorrect: result.reload['dental-warning'].http === 200 && result.reload['dental-warning'].hash === '#dental-warning' && result.reload['dental-warning'].visible && result.reload['dental-warning'].overflow <= 2,
                  directTemperatureCorrect: result.direct['death-temperature-evidence'].http === 200 && result.direct['death-temperature-evidence'].hash === '#death-temperature-evidence' && result.direct['death-temperature-evidence'].visible && result.direct['death-temperature-evidence'].overflow <= 2,
                  reloadTemperatureCorrect: result.reload['death-temperature-evidence'].http === 200 && result.reload['death-temperature-evidence'].hash === '#death-temperature-evidence' && result.reload['death-temperature-evidence'].visible && result.reload['death-temperature-evidence'].overflow <= 2,
                  noPageErrors: pageErrors.length === 0,
                  noSameOriginHttpErrors: sameOriginErrors.length === 0,
                  noRelevantRequestFailures: relevantRequestFailures.length === 0
                };
                result.relevantRequestFailures = relevantRequestFailures;
                result.passed = Object.values(result.checks).every(Boolean);
              } catch (error) {
                result.exception = String(error?.stack || error);
                await page.screenshot({ path: `${output}/${language}_${viewportName}_exception.png`, fullPage: false }).catch(() => {});
              }

              if (!result.passed) failed = true;
              await context.close();
            }
          }

          await browser.close();
          fs.writeFileSync(`${output}/report.json`, JSON.stringify({ generatedAt: new Date().toISOString(), results }, null, 2));
          const summary = ['# Kaikai 24°C browser verification', ''];
          for (const result of results) {
            summary.push(`## ${result.language} · ${result.viewport} (${result.dimensions.width}×${result.dimensions.height})`);
            summary.push(`- Result: ${result.passed ? 'PASS' : 'FAIL'}`);
            summary.push(`- Content: heading=${Boolean(result.initial?.headingPresent)}, testimony=${Boolean(result.initial?.testimonyPresent)}, conclusion=${Boolean(result.initial?.conclusionPresent)}`);
            summary.push(`- Menu jump: #death-temperature-evidence top=${result.menuJump?.top ?? 'n/a'}`);
            summary.push(`- Direct: #dental-warning top=${result.direct['dental-warning']?.top ?? 'n/a'}; #death-temperature-evidence top=${result.direct['death-temperature-evidence']?.top ?? 'n/a'}`);
            summary.push(`- Reload: #dental-warning top=${result.reload['dental-warning']?.top ?? 'n/a'}; #death-temperature-evidence top=${result.reload['death-temperature-evidence']?.top ?? 'n/a'}`);
            summary.push(`- Page errors=${result.pageErrors.length}; same-origin HTTP errors=${result.sameOriginErrors.length}; relevant failed requests=${result.relevantRequestFailures?.length ?? 'n/a'}`);
            summary.push('');
          }
          fs.writeFileSync(`${output}/summary.md`, summary.join('\n'));
          console.log(summary.join('\n'));
          if (failed) process.exit(1);
          JS

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kaikai-24c-final-browser-verification
          path: browser-validation/final-green
          retention-days: 14

      - name: Remove completed one-off workflow
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main
          git rm .github/workflows/oneoff-kaikai-final-browser-green-20260829.yml
          git commit -m 'Remove completed Kaikai browser verification workflow'
          git push origin HEAD:main