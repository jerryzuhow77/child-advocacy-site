name: Restore Qiqi ending and normalize region wording

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oneoff-qiqi-ending-region-terminology.yml'
      - 'scripts/patch_qiqi_ending_and_region_terms.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: qiqi-ending-region-terminology-20260821
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore ending animation and replace region wording
        run: python3 scripts/patch_qiqi_ending_and_region_terms.py

      - name: Refresh four-language cache versions
        env:
          QIQI_VERSION_SHA: ${{ github.sha }}
        run: python3 scripts/sync_fujian_qiqi_feature.py

      - name: Validate JavaScript, HTML and terminology
        run: |
          node --check assets/fujian-qiqi-feature.js
          node --check assets/pwa-install.js
          node --check sw.js
          python3 -m py_compile \
            scripts/patch_qiqi_ending_and_region_terms.py \
            scripts/sync_fujian_qiqi_feature.py
          grep -q 'Ending visibility isolation repair' assets/fujian-qiqi-feature.js
          grep -q 'Qiqi ending visibility isolation' assets/fujian-qiqi-feature.css
          grep -q "version: '1.3.5'" assets/fujian-qiqi-feature.js
          grep -q "2026-08-21-qiqi-ending-region-v1" sw.js
          for page in \
            historical-cases/regions/mainland-china/fujian-qiqi/index.html \
            zh-hans/historical-cases/regions/mainland-china/fujian-qiqi/index.html \
            en/historical-cases/regions/mainland-china/fujian-qiqi/index.html \
            ja/historical-cases/regions/mainland-china/fujian-qiqi/index.html; do
            grep -q '<section class="fq-ending" data-fq-ending>' "$page"
            ! grep -q '<section class="fq-ending" data-fq-reveal>' "$page"
            grep -q 'fujian-qiqi-feature.css?v=' "$page"
            grep -q 'fujian-qiqi-feature.js?v=' "$page"
          done
          ! git grep -n -e '中國大陸' -e '中国大陆' -e '中国大陸' -- \
            '*.html' '*.htm' '*.js' '*.css' '*.json' '*.xml' '*.webmanifest' '*.md' '*.txt' \
            ':(exclude).github/**' ':(exclude)scripts/**'
          git diff --check

      - name: Commit repaired site and remove one-off files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f -- \
            .github/workflows/oneoff-qiqi-ending-region-terminology.yml \
            scripts/patch_qiqi_ending_and_region_terms.py
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'Restore Qiqi ending animation and use shorter region wording'
          git pull --rebase origin main
          git push
