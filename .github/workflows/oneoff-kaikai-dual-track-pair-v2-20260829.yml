name: Retry bilingual dual-track responsibility poster publication

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oneoff-kaikai-dual-track-pair-v2-20260829.yml'

permissions:
  contents: write

jobs:
  publish-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate localized image and pair it with the five-layer tree
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin main
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk >/dev/null
          python3 -m pip install --disable-pip-version-check pillow
          python3 .github/scripts/prepare-kaikai-dual-track-source-20260829.py
          python3 .github/scripts/render-kaikai-dual-track-hans-20260829.py
          python3 .github/scripts/place-kaikai-dual-track-poster-20260829.py
          git diff --check

          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageChops, ImageStat
          root = Path('assets/art')
          hant = root / 'kaikai-dual-track-responsibility-tree-zh-Hant-20260829.webp'
          hans = root / 'kaikai-dual-track-responsibility-tree-zh-Hans-20260829.webp'
          for path in (hant, hans):
              if not path.is_file() or path.stat().st_size < 80_000:
                  raise SystemExit(f'Missing or undersized artwork: {path}')
          with Image.open(hant).convert('RGB') as a, Image.open(hans).convert('RGB') as b:
              if a.size != b.size or a.size not in {(960, 540), (1536, 864)}:
                  raise SystemExit(f'Unexpected dimensions: {a.size} / {b.size}')
              mean = sum(ImageStat.Stat(ImageChops.difference(a, b)).mean) / 3
              if mean < 2.0:
                  raise SystemExit(f'Simplified artwork is not sufficiently distinct: {mean}')
              print(f'Localized artwork: {b.size[0]}×{b.size[1]}, mean pixel difference {mean:.2f}')
          PY

          grep -q 'class="responsibility-tree-pair"' hearing-records/prison-watch/kaikai-final-chapter/index.html
          grep -q 'class="responsibility-tree-pair"' hearing-records/prison-watch/kaikai-final-chapter/zh-Hans/index.html
          grep -q 'final-chapter.css?v=20260829-24' hearing-records/prison-watch/kaikai-final-chapter/index.html
          grep -q 'DUAL-TRACK-RESPONSIBILITY-PAIR-20260829' hearing-records/prison-watch/kaikai-final-chapter/final-chapter.css

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/art/kaikai-dual-track-responsibility-tree-zh-Hans-20260829.webp
          git add hearing-records/prison-watch/kaikai-final-chapter/index.html
          git add hearing-records/prison-watch/kaikai-final-chapter/zh-Hans/index.html
          git add hearing-records/prison-watch/kaikai-final-chapter/final-chapter.css
          git commit -m 'Place bilingual dual-track poster beside five-layer responsibility tree'
          pushed=0
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              pushed=1
              break
            fi
            git pull --rebase origin main
          done
          test "$pushed" -eq 1

      - name: Wait for GitHub Pages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p browser-validation/dual-track-pair
          urls=(
            'https://jerryzuhow77.github.io/child-advocacy-site/hearing-records/prison-watch/kaikai-final-chapter/'
            'https://jerryzuhow77.github.io/child-advocacy-site/hearing-records/prison-watch/kaikai-final-chapter/zh-Hans/'
          )
          assets=(
            'https://jerryzuhow77.github.io/child-advocacy-site/assets/art/kaikai-dual-track-responsibility-tree-zh-Hant-20260829.webp'
            'https://jerryzuhow77.github.io/child-advocacy-site/assets/art/kaikai-dual-track-responsibility-tree-zh-Hans-20260829.webp'
          )
          for attempt in $(seq 1 105); do
            ready=1
            for url in "${urls[@]}"; do
              html="$(curl -fsSL --connect-timeout 15 --max-time 30 "${url}?qa=${GITHUB_SHA}-${attempt}" || true)"
              grep -q 'class="responsibility-tree-pair"' <<<"$html" || ready=0
              grep -q 'final-chapter.css?v=20260829-24' <<<"$html" || ready=0
              grep -q 'kaikai-dual-track-responsibility-tree-zh-Hans-20260829.webp' <<<"$html" || ready=0
            done
            for i in 0 1; do
              headers="browser-validation/dual-track-pair/asset-${i}.headers"
              curl -fsSI --connect-timeout 15 --max-time 30 "${assets[$i]}?qa=${GITHUB_SHA}-${attempt}" -o "$headers" || ready=0
              grep -Eqi '^content-type: *image/webp' "$headers" || ready=0
            done
            [[ "$ready" -eq 1 ]] && exit 0
            sleep 10
          done
          echo 'Timed out before the bilingual paired layout became public.' >&2
          exit 1

      - name: Install Playwright driver
        run: npm install --no-save playwright-core@1.55.0

      - name: Verify desktop and mobile public layouts
        run: node .github/scripts/verify-kaikai-dual-track-pair-20260829.mjs

      - name: Upload browser proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kaikai-dual-track-pair-browser-proof
          path: browser-validation/dual-track-pair
          retention-days: 14

      - name: Remove completed one-off tools
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main
          git rm -f .github/workflows/oneoff-kaikai-dual-track-pair-20260829.yml
          git rm -f .github/workflows/oneoff-kaikai-dual-track-pair-v2-20260829.yml
          git rm -f .github/scripts/render-kaikai-dual-track-hans-20260829.py
          git rm -f .github/scripts/place-kaikai-dual-track-poster-20260829.py
          git rm -f .github/scripts/prepare-kaikai-dual-track-source-20260829.py
          git rm -f .github/scripts/verify-kaikai-dual-track-pair-20260829.mjs
          git commit -m 'Remove completed dual-track poster publication tools'
          pushed=0
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              pushed=1
              break
            fi
            git pull --rebase origin main
          done
          test "$pushed" -eq 1
