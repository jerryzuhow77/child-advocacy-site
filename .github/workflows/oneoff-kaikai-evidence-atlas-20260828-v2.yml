name: Publish Kaikai evidence atlas v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oneoff-kaikai-evidence-atlas-20260828-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure Traditional-to-Simplified converter
        run: |
          if ! command -v uconv >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y icu-devtools
          fi

      - name: Add evidence atlas content and responsive styles
        run: |
          python - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          from collections import Counter
          import re
          import shutil
          import subprocess

          root = Path('.')
          staging = root / 'scripts/kaikai-evidence-atlas-20260828'
          bundle_path = staging / 'traditional.html'
          style_path = staging / 'styles.css'
          trad_path = root / 'hearing-records/prison-watch/kaikai-final-chapter/index.html'
          simp_path = root / 'hearing-records/prison-watch/kaikai-final-chapter/zh-Hans/index.html'
          css_path = root / 'hearing-records/prison-watch/kaikai-final-chapter/final-chapter.css'
          marker = '<!-- EVIDENCE-ATLAS-20260828 -->'
          order = ['ATLAS', 'CONFLICTS', 'DENTAL', 'BOUNDARY', 'ORBIT']

          def split_bundle(text):
              result = {}
              for index, name in enumerate(order):
                  start_marker = f'<!-- FRAGMENT:{name} -->'
                  start = text.index(start_marker) + len(start_marker)
                  if index + 1 < len(order):
                      end_marker = f'<!-- FRAGMENT:{order[index + 1]} -->'
                      end = text.index(end_marker, start)
                  else:
                      end = len(text)
                  result[name] = text[start:end].strip()
              return result

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one anchor, found {count}')
              return text.replace(old, new, 1)

          def bump_css_cache(text, label):
              pattern = re.compile(r'(final-chapter\.css\?v=20260828-)(\d+)')
              matches = pattern.findall(text)
              if len(matches) != 1:
                  raise SystemExit(f'{label}: expected one CSS cache key, found {len(matches)}')
              old_number = int(matches[0][1])
              return pattern.sub(lambda match: f'{match.group(1)}{old_number + 1}', text, count=1)

          traditional_bundle = bundle_path.read_text(encoding='utf-8')
          simplified_bundle = subprocess.run(
              ['uconv', '-x', 'Traditional-Simplified'],
              input=traditional_bundle,
              text=True,
              capture_output=True,
              check=True,
          ).stdout
          trad = split_bundle(traditional_bundle)
          simp = split_bundle(simplified_bundle)

          def patch_page(path, fragments, simplified=False):
              text = path.read_text(encoding='utf-8')
              if marker in text:
                  print(f'{path} already contains the evidence atlas')
                  return

              if simplified:
                  text = replace_once(
                      text,
                      '<a href="#chen-trial">另案一审</a><a href="#dental-warning">牙医警讯</a>',
                      '<a href="#chen-trial">另案一审</a><a href="#evidence-atlas">证词图谱</a><a href="#dental-warning">牙医警讯</a>',
                      'simplified navigation',
                  )
                  text = replace_once(
                      text,
                      '<h2>陈尚洁案一审证人证词：制度内部如何解释警讯</h2>',
                      '<h2>证词不是孤岛：谁看见、谁转述、谁没有查证？</h2>',
                      'simplified title',
                  )
                  text = replace_once(
                      text,
                      '下列白丽芳、李芳玲、江怡韵均以证人身份出庭，并非该案刑事被告。',
                      '本区区分七名证人、陈尚洁的被告陈述，以及林心慈另案起诉资料；证人并非本案刑事被告，林心慈另案及陈尚洁本案都仍应保留未定谳与无罪推定标示。',
                      'simplified legal banner',
                  )
              else:
                  text = replace_once(
                      text,
                      '<a href="#chen-trial">另案一審</a><a href="#dental-warning">牙醫警訊</a>',
                      '<a href="#chen-trial">另案一審</a><a href="#evidence-atlas">證詞圖譜</a><a href="#dental-warning">牙醫警訊</a>',
                      'traditional navigation',
                  )
                  text = replace_once(
                      text,
                      '<h2>陳尚潔案一審證人證詞：制度內部如何解釋警訊</h2>',
                      '<h2>證詞不是孤島：誰看見、誰轉述、誰沒有查證？</h2>',
                      'traditional title',
                  )
                  text = replace_once(
                      text,
                      '下列白麗芳、李芳玲、江怡韻均以證人身分出庭，並非該案刑事被告。',
                      '本區區分七名證人、陳尚潔的被告陳述，以及林心慈另案起訴資料；證人並非本案刑事被告，林心慈另案及陳尚潔本案都仍應保留未定讞與無罪推定標示。',
                      'traditional legal banner',
                  )

              text = replace_once(
                  text,
                  '    <div class="chen-dialogues">\n',
                  fragments['ATLAS'] + '\n    <div class="chen-dialogues">\n',
                  f'{path} defendant evidence atlas',
              )
              text = replace_once(
                  text,
                  '    <aside class="chen-source-note reveal">',
                  fragments['CONFLICTS'] + '\n    <aside class="chen-source-note reveal">',
                  f'{path} witness conflict matrix',
              )
              text = replace_once(
                  text,
                  '      <aside class="dental-conclusion">',
                  fragments['DENTAL'] + '\n      <aside class="dental-conclusion">',
                  f'{path} dental verification map',
              )
              text = replace_once(
                  text,
                  '      <div class="corroboration-grid">',
                  fragments['BOUNDARY'] + '\n      <div class="corroboration-grid">',
                  f'{path} blood and restraint boundary',
              )
              text = replace_once(
                  text,
                  '      <div class="poster-canvas">',
                  fragments['ORBIT'] + '\n      <div class="poster-canvas">',
                  f'{path} responsibility orbit',
              )
              text = bump_css_cache(text, str(path))
              path.write_text(text, encoding='utf-8')
              print(f'patched {path}')

          patch_page(trad_path, trad, simplified=False)
          patch_page(simp_path, simp, simplified=True)

          css = css_path.read_text(encoding='utf-8')
          style_block = style_path.read_text(encoding='utf-8').strip()
          if '/* EVIDENCE ATLAS 20260828 */' not in css:
              css_path.write_text(css.rstrip() + '\n\n' + style_block + '\n', encoding='utf-8')
              print(f'patched {css_path}')

          class IdChecker(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.ids = []
              def handle_starttag(self, tag, attrs):
                  for key, value in attrs:
                      if key == 'id' and value:
                          self.ids.append(value)

          required = {
              'evidence-atlas', 'witness-conflicts', 'blood-boundary',
              'restraint-boundary', 'responsibility-orbit', 'dentalDutyTitle'
          }
          for page in (trad_path, simp_path):
              text = page.read_text(encoding='utf-8')
              parser = IdChecker()
              parser.feed(text)
              duplicates = [item for item, count in Counter(parser.ids).items() if count > 1]
              missing = sorted(required.difference(parser.ids))
              if duplicates:
                  raise SystemExit(f'{page}: duplicate ids: {duplicates}')
              if missing:
                  raise SystemExit(f'{page}: missing ids: {missing}')
              if text.count(marker) != 1:
                  raise SystemExit(f'{page}: evidence marker count is {text.count(marker)}')
              if 'FRAGMENT:' in text:
                  raise SystemExit(f'{page}: staging marker leaked into public HTML')

          simp_text = simp_path.read_text(encoding='utf-8')
          for forbidden in ('證詞圖譜', '血跡證明空間', '以剴剴為中心'):
              if forbidden in simp_text:
                  raise SystemExit(f'simplified page still contains Traditional phrase: {forbidden}')

          shutil.rmtree(staging)
          for workflow in (
              root / '.github/workflows/oneoff-kaikai-evidence-atlas-20260828.yml',
              root / '.github/workflows/oneoff-kaikai-evidence-atlas-20260828-v2.yml',
          ):
              workflow.unlink(missing_ok=True)
          print('removed one-off staging payloads and workflows')
          PY

      - name: Validate diff
        run: |
          git diff --check
          grep -q 'id="evidence-atlas"' hearing-records/prison-watch/kaikai-final-chapter/index.html
          grep -q 'id="witness-conflicts"' hearing-records/prison-watch/kaikai-final-chapter/zh-Hans/index.html
          grep -q 'EVIDENCE ATLAS 20260828' hearing-records/prison-watch/kaikai-final-chapter/final-chapter.css
          test ! -e scripts/kaikai-evidence-atlas-20260828

      - name: Commit and publish
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add hearing-records/prison-watch/kaikai-final-chapter .github/workflows scripts/kaikai-evidence-atlas-20260828
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m 'Expand Kaikai testimony and evidence atlas'
          git push origin HEAD:main