name: Publish complete Day 4 PDF testimony
# retry: 2026-08-21T06:22Z

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oneoff-day4-verbatim.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install verbatim PDF record and highlights
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin main

          work=/tmp/day4-verbatim
          rm -rf "$work"
          mkdir -p "$work/extracted"
          cat .github/day4-verbatim/part*.b64 | base64 --decode > "$work/payload.tar.xz"
          printf '%s  %s\n' 'c5f2b9b61601fda17b5566390b85a31f4be05d52f3ef77c784d6ba4b4e1d8d03' "$work/payload.tar.xz" | sha256sum --check --strict
          tar -xJf "$work/payload.tar.xz" -C "$work/extracted"

          install -D -m 0644 "$work/extracted/assets/day4-verbatim-source.txt" assets/day4-verbatim-source.txt
          install -D -m 0644 "$work/extracted/hearing-records/prison-watch/kaikai-day4-20250428/day4-verbatim.js" hearing-records/prison-watch/kaikai-day4-20250428/day4-verbatim.js
          install -D -m 0644 "$work/extracted/assets/day4-verbatim-source.txt" source/assets/day4-verbatim-source.txt
          install -D -m 0644 "$work/extracted/hearing-records/prison-watch/kaikai-day4-20250428/day4-verbatim.js" source/hearing-records/prison-watch/kaikai-day4-20250428/day4-verbatim.js

          python - <<'PY'
          from pathlib import Path
          import hashlib
          import re

          root = Path('.')
          shared_rel = Path('hearing-records/prison-watch/kaikai-day3-20250425/day3-reading-core-20260821.js')
          loader_rel = Path('hearing-records/prison-watch/kaikai-day3-20250425/day3-reading.js')

          def patch_shared(path: Path) -> None:
              text = path.read_text(encoding='utf-8')
              crosscheck_line = "  const crosscheck = new URL('../kaikai-day4-20250428/day4-crosscheck.js?v=20260821-1', base).href;"
              crosscheck_line_v2 = "  const crosscheck = new URL('../kaikai-day4-20250428/day4-crosscheck.js?v=20260821-2', base).href;"
              verbatim_line = "  const verbatim = new URL('../kaikai-day4-20250428/day4-verbatim.js?v=20260821-verbatim-1', base).href;"
              if crosscheck_line in text:
                  text = text.replace(crosscheck_line, crosscheck_line_v2, 1)
              elif "day4-crosscheck.js?v=20260821-" in text:
                  text = re.sub(r"day4-crosscheck\.js\?v=20260821-[^']+", "day4-crosscheck.js?v=20260821-2", text, count=1)
              if 'day4-verbatim.js' not in text:
                  anchor = crosscheck_line_v2 if crosscheck_line_v2 in text else next(
                      (line for line in text.splitlines() if 'const crosscheck' in line and 'day4-crosscheck.js' in line),
                      None
                  )
                  if not anchor:
                      raise SystemExit(f'cross-check loader anchor missing in {path}')
                  text = text.replace(anchor, anchor + '\n' + verbatim_line, 1)

              old_prepare = """  const prepare = isDay4
    ? load(crosscheck).then(() => window.day4CrosscheckReady)
    : Promise.resolve();"""
              new_prepare = """  const prepare = isDay4
    ? Promise.all([
        load(crosscheck).then(() => window.day4CrosscheckReady),
        load(verbatim).then(() => window.day4VerbatimReady)
      ])
    : Promise.resolve();"""
              if old_prepare in text:
                  text = text.replace(old_prepare, new_prepare, 1)
              elif 'load(verbatim).then(() => window.day4VerbatimReady)' not in text:
                  raise SystemExit(f'Day 4 prepare block not recognized in {path}')
              text = text.replace("Day 4 cross-check failed to load", "Day 4 enhancement failed to load")
              path.write_text(text, encoding='utf-8')

          def patch_loader(path: Path) -> None:
              text = path.read_text(encoding='utf-8')
              text, count = re.subn(
                  r"day3-reading-core-20260821\.js\?v=[^']+",
                  "day3-reading-core-20260821.js?v=20260821-shared-loader-verbatim-1",
                  text,
                  count=1
              )
              if count != 1:
                  raise SystemExit(f'shared reader URL not found in {path}')
              path.write_text(text, encoding='utf-8')

          def patch_sw(path: Path) -> None:
              if not path.exists():
                  return
              text = path.read_text(encoding='utf-8')
              text, count = re.subn(
                  r"const VERSION = '[^']+';",
                  "const VERSION = '2026-08-21-day4-verbatim-v1';",
                  text,
                  count=1
              )
              if count != 1:
                  raise SystemExit(f'PWA version anchor not found in {path}')
              entries = [
                  "./assets/day4-verbatim-source.txt",
                  "./hearing-records/prison-watch/kaikai-day4-20250428/day4-verbatim.js",
                  "./hearing-records/prison-watch/kaikai-day3-20250425/day3-reading-core-20260821.js",
              ]
              start = text.find('const APP_SHELL = [')
              end = text.find('];', start)
              if start < 0 or end < 0:
                  raise SystemExit(f'APP_SHELL block not found in {path}')
              missing = [entry for entry in entries if entry not in text[start:end]]
              if missing:
                  before = text[:end].rstrip()
                  if not before.endswith(','):
                      before += ','
                  before += '\n' + ',\n'.join(f"  '{entry}'" for entry in missing) + '\n'
                  text = before + text[end:]
              path.write_text(text, encoding='utf-8')

          patch_shared(root / shared_rel)
          patch_loader(root / loader_rel)
          patch_sw(root / 'sw.js')

          source_shared = root / 'source' / shared_rel
          source_loader = root / 'source' / loader_rel
          if source_shared.exists():
              patch_shared(source_shared)
          if source_loader.exists():
              patch_loader(source_loader)
          patch_sw(root / 'source/sw.js')

          source = (root / 'assets/day4-verbatim-source.txt').read_bytes()
          if hashlib.sha256(source).hexdigest() != '9842c7562f8dd3b7e09671c03eabecc168daeadbef962b96dbac52b99f7790d6':
              raise SystemExit('verbatim source checksum mismatch')
          text = source.decode('utf-8')
          if len([page for page in text.split('\f') if page.strip()]) != 11:
              raise SystemExit('expected 11 PDF pages in verbatim source')
          phrases = [
              '偶爾會，還好，因為我自己還有要照顧的小朋友',
              '幾乎',
              '中午1點下去，待1~1個多小時',
              '吃午餐，幾十分鐘',
              '是不是被罰站不知道',
              '問我為什麼A童站在那裡',
              '沒有說要做什麼',
              '就交代了一下',
              '手腳都被綁住',
              '傳照片才知道',
              '出門會托給我',
              '確實不會，劉若琳偶爾會幫忙',
              '跌倒、手，都有跟她說過要跟社工說',
              '怕會被發現脖子上的傷',
              '沒什麼印象，有拍過「這邊」',
              '她叫我不要這麼大聲',
              '口頭上有說不要打小孩',
          ]
          missing = [phrase for phrase in phrases if text.count(phrase) != 1]
          if missing:
              raise SystemExit(f'key phrases missing or duplicated: {missing}')
          PY

          node --check hearing-records/prison-watch/kaikai-day4-20250428/day4-verbatim.js
          node --check hearing-records/prison-watch/kaikai-day3-20250425/day3-reading-core-20260821.js
          node --check hearing-records/prison-watch/kaikai-day3-20250425/day3-reading.js
          node --check sw.js
          grep -q 'PDF 原文完整證詞' hearing-records/prison-watch/kaikai-day4-20250428/day4-verbatim.js
          grep -q 'day4VerbatimReady' hearing-records/prison-watch/kaikai-day3-20250425/day3-reading-core-20260821.js

          rm -rf .github/day4-verbatim
          rm -f .github/workflows/oneoff-day4-verbatim.yml

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to publish.'
            exit 0
          fi
          git commit -m 'Preserve complete Day 4 PDF testimony with highlights'
          git pull --rebase origin main
          git push origin main
