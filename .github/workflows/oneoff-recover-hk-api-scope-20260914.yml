name: One-off recover Hong Kong API scope

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oneoff-recover-hk-api-scope-20260914.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oneoff-recover-hk-api-scope-20260914
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HK_HOST: ${{ secrets.TENCENT_SSH_HOST }}
      HK_USER: ${{ secrets.TENCENT_SSH_USER }}
      HK_PORT: ${{ secrets.TENCENT_SSH_PORT }}
      HK_KEY_A: ${{ secrets.TENCENT_SSH_PRIVATE_KEY }}
      HK_KEY_B: ${{ secrets.TENCENT_CVM_SSH_KEY }}
      HK_KEY_C: ${{ secrets.SSH_PRIVATE_KEY }}
    steps:
      - name: Configure SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          host="${HK_HOST:-150.109.69.104}"
          user="${HK_USER:-ubuntu}"
          port="${HK_PORT:-22}"
          key="${HK_KEY_A:-${HK_KEY_B:-${HK_KEY_C:-}}}"
          test -n "$key"
          mkdir -p ~/.ssh
          printf '%s\n' "$key" > ~/.ssh/hk_key
          chmod 600 ~/.ssh/hk_key
          ssh-keyscan -p "$port" "$host" > ~/.ssh/known_hosts
          printf 'HOST=%s\nUSER=%s\nPORT=%s\n' "$host" "$user" "$port" >> "$GITHUB_ENV"

      - name: Recover dedicated Hong Kong data service
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/hk_key -p "$PORT" "$USER@$HOST" 'sudo bash -s' <<'REMOTE'
          set -Eeuo pipefail
          expected=hong-kong-data-site
          shared_service=global-protection.service
          hk_service=global-protection-hk.service

          scope() {
            curl --silent --show-error --max-time 10               -H 'accept: application/json'               http://127.0.0.1:8787/api/public/submission-stats |
              python3 -c 'import json,sys; print(json.load(sys.stdin).get("scope",""))'
          }

          before="$(scope 2>/dev/null || true)"
          printf 'scope_before=%s\n' "$before"
          systemctl is-active "$shared_service" || true
          systemctl is-active "$hk_service" || true
          systemctl --no-pager --full status "$shared_service" "$hk_service" || true
          ss -ltnp | grep ':8787' || true

          if [ "$before" = "$expected" ]; then
            echo 'Hong Kong API scope is already correct.'
            exit 0
          fi

          shared_was_active=false
          if systemctl is-active --quiet "$shared_service"; then
            shared_was_active=true
          fi

          rollback() {
            code=$?
            if [ "$code" -ne 0 ]; then
              echo 'Recovery validation failed; restoring previous service state.'
              systemctl stop "$hk_service" || true
              if [ "$shared_was_active" = true ]; then
                systemctl restart "$shared_service" || true
              fi
            fi
            exit "$code"
          }
          trap rollback EXIT

          systemctl stop "$shared_service"
          systemctl restart "$hk_service"

          recovered=
          for attempt in 1 2 3 4 5 6; do
            current="$(scope 2>/dev/null || true)"
            printf 'scope_attempt_%s=%s\n' "$attempt" "$current"
            if [ "$current" = "$expected" ]; then
              recovered=1
              break
            fi
            sleep 5
          done
          test -n "$recovered"

          nginx -t
          systemctl reload nginx
          trap - EXIT
          echo 'local_scope_recovered=true'
          REMOTE

      - name: Route Hong Kong API to the recovered local service
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/hk_key -p "$PORT" "$USER@$HOST" 'sudo python3 -' <<'PY'
          from pathlib import Path
          import re, shutil, subprocess, time

          domain = "cn.globalprotectionwall.com"
          declarations = ("location ^~ /api/", "location /api/")
          candidates = []
          for root in (Path("/etc/nginx/sites-enabled"), Path("/etc/nginx/conf.d")):
              if root.exists():
                  candidates.extend(p for p in root.iterdir() if p.is_file() or p.is_symlink())

          def masked(text):
              pattern = r'''#[^\n]*|"(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*' '''
              return re.sub(pattern.rstrip(), lambda m: re.sub(r"[^\n]", " ", m.group()), text)

          def block_end(text, start):
              syntax = masked(text)
              brace = syntax.find("{", start)
              depth = 0
              for i in range(brace, len(syntax)):
                  if syntax[i] == "{":
                      depth += 1
                  elif syntax[i] == "}":
                      depth -= 1
                      if depth == 0:
                          return i + 1
              raise SystemExit("Unbalanced nginx block")

          selected = None
          for path in candidates:
              try:
                  text = path.read_text()
              except Exception:
                  continue
              syntax = masked(text)
              for match in re.finditer(r"(?m)^\s*server\s*\{", syntax):
                  end = block_end(text, match.start())
                  block = text[match.start():end]
                  names = re.findall(r"(?m)^\s*server_name\s+([^;]+);", block)
                  if any(domain in value.split() for value in names):
                      if re.search(r"(?m)^\s*listen\s+[^;]*\bssl\b", block):
                          selected = (path.resolve(), text, match.start(), end)
                          break
                      selected = selected or (path.resolve(), text, match.start(), end)
              if selected and re.search(r"(?m)^\s*listen\s+[^;]*\bssl\b", selected[1][selected[2]:selected[3]]):
                  break
          if not selected:
              raise SystemExit("Hong Kong nginx server block not found")

          target, full, start, end = selected
          block = full[start:end]
          for declaration in declarations:
              while True:
                  syntax = masked(block)
                  match = re.search(r"(?m)^\s*" + re.escape(declaration) + r"\s*\{", syntax)
                  if not match:
                      break
                  loc_end = block_end(block, match.start())
                  line_start = block.rfind("\n", 0, match.start()) + 1
                  while loc_end < len(block) and block[loc_end] in " \t\r\n":
                      loc_end += 1
                  block = block[:line_start] + block[loc_end:]

          insert = block.rfind("}")
          snippet = """
              # dedicated-hong-kong-api
              location ^~ /api/ {
                  proxy_pass http://127.0.0.1:8787;
                  proxy_http_version 1.1;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
                  proxy_no_cache 1;
                  proxy_cache_bypass 1;
              }
          """
          updated_block = block[:insert] + snippet + block[insert:]
          backup_dir = Path("/var/backups/child-advocacy-nginx")
          backup_dir.mkdir(parents=True, exist_ok=True)
          backup = backup_dir / (target.name + ".api-scope-" + str(time.time_ns()))
          shutil.copy2(target, backup)
          target.write_text(full[:start] + updated_block + full[end:])
          try:
              subprocess.run(["nginx", "-t"], check=True)
              subprocess.run(["systemctl", "reload", "nginx"], check=True)
          except Exception:
              shutil.copy2(backup, target)
              subprocess.run(["nginx", "-t"], check=True)
              subprocess.run(["systemctl", "reload", "nginx"], check=True)
              raise
          PY

          origin_scope="$(ssh -i ~/.ssh/hk_key -p "$PORT" "$USER@$HOST"             "curl -k --silent --show-error --max-time 15 --resolve cn.globalprotectionwall.com:443:127.0.0.1 https://cn.globalprotectionwall.com/api/public/submission-stats | python3 -c 'import json,sys; print(json.load(sys.stdin).get(\"scope\",\"\"))'")"
          printf 'origin_scope=%s\n' "$origin_scope"
          test "$origin_scope" = hong-kong-data-site

      - name: Verify public Hong Kong API scope
        shell: bash
        run: |
          set -Eeuo pipefail
          expected=hong-kong-data-site
          for attempt in 1 2 3 4 5 6; do
            scope="$(curl --silent --show-error --max-time 20               -H 'accept: application/json'               "https://cn.globalprotectionwall.com/api/public/submission-stats?verify=${GITHUB_RUN_ID}-${attempt}" |
              python3 -c 'import json,sys; print(json.load(sys.stdin).get("scope",""))' || true)"
            printf 'public_scope_attempt_%s=%s\n' "$attempt" "$scope"
            if [ "$scope" = "$expected" ]; then
              exit 0
            fi
            sleep 5
          done
          exit 1
