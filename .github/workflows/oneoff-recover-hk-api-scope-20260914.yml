name: One-off recover Hong Kong API scope
# Operational retrigger: restore the dedicated Hong Kong public API route.

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oneoff-recover-hk-api-scope-20260914.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oneoff-recover-hk-api-scope-20260914
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HK_HOST: ${{ secrets.TENCENT_SSH_HOST }}
      HK_USER: ${{ secrets.TENCENT_SSH_USER }}
      HK_PORT: ${{ secrets.TENCENT_SSH_PORT }}
      HK_KEY_A: ${{ secrets.TENCENT_SSH_PRIVATE_KEY }}
      HK_KEY_B: ${{ secrets.TENCENT_CVM_SSH_KEY }}
      HK_KEY_C: ${{ secrets.SSH_PRIVATE_KEY }}
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
    steps:
      - name: Configure SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          host="${HK_HOST:-150.109.69.104}"
          user="${HK_USER:-ubuntu}"
          port="${HK_PORT:-22}"
          key="${HK_KEY_A:-${HK_KEY_B:-${HK_KEY_C:-}}}"
          test -n "$key"
          mkdir -p ~/.ssh
          printf '%s\n' "$key" > ~/.ssh/hk_key
          chmod 600 ~/.ssh/hk_key
          ssh-keyscan -p "$port" "$host" > ~/.ssh/known_hosts
          printf 'HOST=%s\nUSER=%s\nPORT=%s\n' "$host" "$user" "$port" >> "$GITHUB_ENV"

      - name: Recover dedicated Hong Kong data service
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/hk_key -p "$PORT" "$USER@$HOST" 'sudo bash -s' <<'REMOTE'
          set -Eeuo pipefail
          expected=hong-kong-data-site
          shared_service=global-protection.service
          hk_service=global-protection-hk.service

          scope() {
            curl --silent --show-error --max-time 10               -H 'accept: application/json'               http://127.0.0.1:8787/api/public/submission-stats |
              python3 -c 'import json,sys; print(json.load(sys.stdin).get("scope",""))'
          }

          before="$(scope 2>/dev/null || true)"
          printf 'scope_before=%s\n' "$before"
          systemctl is-active "$shared_service" || true
          systemctl is-active "$hk_service" || true
          systemctl --no-pager --full status "$shared_service" "$hk_service" || true
          ss -ltnp | grep ':8787' || true

          echo 'safe_service_metadata_begin'
          for unit in "$shared_service" "$hk_service"; do
            systemctl show "$unit"               --property=FragmentPath               --property=DropInPaths               --property=WorkingDirectory               --property=User               --property=ExecStart               --no-pager || true
          done
          find /opt/global-protection -maxdepth 2 -type f             \( -name 'package.json' -o -name 'wrangler*.json' -o -name '.dev.vars*' \)             -printf 'config_file=%p\n' 2>/dev/null | sort || true
          python3 - <<'PY'
          from pathlib import Path
          import json, re

          package = Path("/opt/global-protection/package.json")
          if package.is_file():
              scripts = json.loads(package.read_text()).get("scripts", {})
              for name in sorted(scripts):
                  value = str(scripts[name])
                  if not re.search(r"(token|secret|password|key)", value, re.I):
                      print(f"package_script_{name}={value}")

          safe_name = re.compile(r"(scope|data_primary|site_mode|region|deployment)", re.I)
          secret_name = re.compile(r"(token|secret|password|key|credential)", re.I)
          for env_file in sorted(Path("/opt/global-protection").glob(".dev.vars*")):
              print(f"env_file={env_file}")
              for raw in env_file.read_text(errors="replace").splitlines():
                  line = raw.strip()
                  if not line or line.startswith("#") or "=" not in line:
                      continue
                  name, value = line.split("=", 1)
                  name = name.strip()
                  if safe_name.search(name) and not secret_name.search(name):
                      print(f"scope_setting={env_file.name}:{name}={value.strip()}")
          PY
          grep -R -n -E 'hong-kong-data-site|taiwan-hong-kong-shared' /opt/global-protection \
            --exclude-dir=node_modules --exclude-dir=.git --exclude-dir=.wrangler \
            --exclude='*.map' 2>/dev/null | head -80 || true
          echo 'safe_service_metadata_end'

          if [ "$before" = "$expected" ]; then
            echo 'Hong Kong API scope is already correct.'
            exit 0
          fi

          shared_was_active=false
          if systemctl is-active --quiet "$shared_service"; then
            shared_was_active=true
          fi

          rollback() {
            code=$?
            if [ "$code" -ne 0 ]; then
              echo 'Recovery validation failed; restoring previous service state.'
              systemctl stop "$hk_service" || true
              if [ "$shared_was_active" = true ]; then
                systemctl restart "$shared_service" || true
              fi
            fi
            exit "$code"
          }
          trap rollback EXIT

          systemctl stop "$shared_service"
          systemctl restart "$hk_service"

          recovered=
          for attempt in 1 2 3 4 5 6; do
            current="$(scope 2>/dev/null || true)"
            printf 'scope_attempt_%s=%s\n' "$attempt" "$current"
            if [ "$current" = "$expected" ]; then
              recovered=1
              break
            fi
            sleep 5
          done
          test -n "$recovered"

          nginx -t
          systemctl reload nginx
          trap - EXIT
          echo 'local_scope_recovered=true'
          REMOTE

      - name: Route Hong Kong API to the recovered local service
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/hk_key -p "$PORT" "$USER@$HOST" 'sudo python3 -' <<'PY'
          from pathlib import Path
          import re, shutil, subprocess, time

          domain = "cn.globalprotectionwall.com"
          declarations = ("location ^~ /api/", "location /api/")
          candidates = []
          for root in (Path("/etc/nginx/sites-enabled"), Path("/etc/nginx/conf.d")):
              if root.exists():
                  candidates.extend(p for p in root.iterdir() if p.is_file() or p.is_symlink())

          def masked(text):
              pattern = r'''#[^\n]*|"(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*' '''
              return re.sub(pattern.rstrip(), lambda m: re.sub(r"[^\n]", " ", m.group()), text)

          def block_end(text, start):
              syntax = masked(text)
              brace = syntax.find("{", start)
              depth = 0
              for i in range(brace, len(syntax)):
                  if syntax[i] == "{":
                      depth += 1
                  elif syntax[i] == "}":
                      depth -= 1
                      if depth == 0:
                          return i + 1
              raise SystemExit("Unbalanced nginx block")

          selected = None
          for path in candidates:
              try:
                  text = path.read_text()
              except Exception:
                  continue
              syntax = masked(text)
              for match in re.finditer(r"(?m)^\s*server\s*\{", syntax):
                  end = block_end(text, match.start())
                  block = text[match.start():end]
                  names = re.findall(r"(?m)^\s*server_name\s+([^;]+);", block)
                  if any(domain in value.split() for value in names):
                      if re.search(r"(?m)^\s*listen\s+[^;]*\bssl\b", block):
                          selected = (path.resolve(), text, match.start(), end)
                          break
                      selected = selected or (path.resolve(), text, match.start(), end)
              if selected and re.search(r"(?m)^\s*listen\s+[^;]*\bssl\b", selected[1][selected[2]:selected[3]]):
                  break
          if not selected:
              raise SystemExit("Hong Kong nginx server block not found")

          target, full, start, end = selected
          block = full[start:end]
          for declaration in declarations:
              while True:
                  syntax = masked(block)
                  match = re.search(r"(?m)^\s*" + re.escape(declaration) + r"\s*\{", syntax)
                  if not match:
                      break
                  loc_end = block_end(block, match.start())
                  line_start = block.rfind("\n", 0, match.start()) + 1
                  while loc_end < len(block) and block[loc_end] in " \t\r\n":
                      loc_end += 1
                  block = block[:line_start] + block[loc_end:]

          insert = block.rfind("}")
          snippet = """
              # dedicated-hong-kong-api
              location ^~ /api/ {
                  proxy_pass http://127.0.0.1:8787;
                  proxy_http_version 1.1;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
                  proxy_no_cache 1;
                  proxy_cache_bypass 1;
              }
          """
          updated_block = block[:insert] + snippet + block[insert:]
          backup_dir = Path("/var/backups/child-advocacy-nginx")
          backup_dir.mkdir(parents=True, exist_ok=True)
          backup = backup_dir / (target.name + ".api-scope-" + str(time.time_ns()))
          shutil.copy2(target, backup)
          target.write_text(full[:start] + updated_block + full[end:])
          try:
              subprocess.run(["nginx", "-t"], check=True)
              subprocess.run(["systemctl", "reload", "nginx"], check=True)
          except Exception:
              shutil.copy2(backup, target)
              subprocess.run(["nginx", "-t"], check=True)
              subprocess.run(["systemctl", "reload", "nginx"], check=True)
              raise
          PY

          origin_scope="$(ssh -i ~/.ssh/hk_key -p "$PORT" "$USER@$HOST"             "curl -k --silent --show-error --max-time 15 --resolve cn.globalprotectionwall.com:443:127.0.0.1 https://cn.globalprotectionwall.com/api/public/submission-stats | python3 -c 'import json,sys; print(json.load(sys.stdin).get(\"scope\",\"\"))'")"
          printf 'origin_scope=%s\n' "$origin_scope"
          test "$origin_scope" = hong-kong-data-site

      - name: Bypass shared Worker for Hong Kong API
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$CF_TOKEN"
          zone="$CF_ZONE_ID"
          if [ -z "$zone" ]; then
            zone="$(curl --silent --show-error --fail-with-body               -H "Authorization: Bearer $CF_TOKEN"               'https://api.cloudflare.com/client/v4/zones?name=globalprotectionwall.com&status=active' |
              python3 -c 'import json,sys; print((json.load(sys.stdin).get("result") or [{}])[0].get("id",""))')"
          fi
          test -n "$zone"
          api="https://api.cloudflare.com/client/v4/zones/$zone/workers/routes"
          routes="$(curl --silent --show-error --fail-with-body             -H "Authorization: Bearer $CF_TOKEN" "$api")"
          exact="$(printf '%s' "$routes" | python3 -c '
          import json,sys
          rows=json.load(sys.stdin).get("result") or []
          matches=[r for r in rows if r.get("pattern")=="cn.globalprotectionwall.com/api/*"]
          print(json.dumps(matches[0] if matches else {}))
          ')"
          route_id="$(printf '%s' "$exact" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("id",""))')"
          old_script="$(printf '%s' "$exact" | python3 -c 'import json,sys; v=json.load(sys.stdin).get("script"); print("" if v is None else v)')"
          created=false
          if [ -n "$route_id" ]; then
            response="$(curl --silent --show-error --fail-with-body -X PUT               -H "Authorization: Bearer $CF_TOKEN" -H 'Content-Type: application/json'               --data '{"pattern":"cn.globalprotectionwall.com/api/*","script":null}'               "$api/$route_id")"
          else
            response="$(curl --silent --show-error --fail-with-body -X POST               -H "Authorization: Bearer $CF_TOKEN" -H 'Content-Type: application/json'               --data '{"pattern":"cn.globalprotectionwall.com/api/*","script":null}'               "$api")"
            route_id="$(printf '%s' "$response" | python3 -c 'import json,sys; print((json.load(sys.stdin).get("result") or {}).get("id",""))')"
            created=true
          fi
          test -n "$route_id"

          recovered=
          for attempt in 1 2 3 4 5 6; do
            scope="$(curl --silent --show-error --max-time 20               -H 'accept: application/json'               "https://cn.globalprotectionwall.com/api/public/submission-stats?edge=${GITHUB_RUN_ID}-${attempt}" |
              python3 -c 'import json,sys; print(json.load(sys.stdin).get("scope",""))' || true)"
            printf 'edge_scope_attempt_%s=%s\n' "$attempt" "$scope"
            if [ "$scope" = hong-kong-data-site ]; then
              recovered=1
              break
            fi
            sleep 5
          done

          if [ -z "$recovered" ]; then
            if [ "$created" = true ]; then
              curl --silent --show-error --fail-with-body -X DELETE                 -H "Authorization: Bearer $CF_TOKEN" "$api/$route_id" >/dev/null
            elif [ -n "$old_script" ]; then
              payload="$(OLD_SCRIPT="$old_script" python3 -c 'import json,os; print(json.dumps({"pattern":"cn.globalprotectionwall.com/api/*","script":os.environ["OLD_SCRIPT"]}))')"
              curl --silent --show-error --fail-with-body -X PUT                 -H "Authorization: Bearer $CF_TOKEN" -H 'Content-Type: application/json'                 --data "$payload" "$api/$route_id" >/dev/null
            fi
            echo 'Cloudflare API bypass validation failed; route restored.'
            exit 1
          fi
          echo 'cloudflare_api_bypass_verified=true'

      - name: Verify public Hong Kong API scope
        shell: bash
        run: |
          set -Eeuo pipefail
          expected=hong-kong-data-site
          for attempt in 1 2 3 4 5 6; do
            scope="$(curl --silent --show-error --max-time 20               -H 'accept: application/json'               "https://cn.globalprotectionwall.com/api/public/submission-stats?verify=${GITHUB_RUN_ID}-${attempt}" |
              python3 -c 'import json,sys; print(json.load(sys.stdin).get("scope",""))' || true)"
            printf 'public_scope_attempt_%s=%s\n' "$attempt" "$scope"
            if [ "$scope" = "$expected" ]; then
              exit 0
            fi
            sleep 5
          done
          exit 1

      - name: Bypass shared Worker for the published Hong Kong brief
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$CF_TOKEN"
          zone="$CF_ZONE_ID"
          if [ -z "$zone" ]; then
            zone="$(curl --silent --show-error --fail-with-body \
              -H "Authorization: Bearer $CF_TOKEN" \
              'https://api.cloudflare.com/client/v4/zones?name=globalprotectionwall.com&status=active' |
              python3 -c 'import json,sys; print((json.load(sys.stdin).get("result") or [{}])[0].get("id",""))')"
          fi
          test -n "$zone"
          api="https://api.cloudflare.com/client/v4/zones/$zone/workers/routes"
          pattern='cn.globalprotectionwall.com/news/child-safety-network-20260914/*'
          routes="$(curl --silent --show-error --fail-with-body \
            -H "Authorization: Bearer $CF_TOKEN" "$api")"
          existing="$(printf '%s' "$routes" | PATTERN="$pattern" python3 -c '
          import json, os, sys
          rows=json.load(sys.stdin).get("result") or []
          match=next((row for row in rows if row.get("pattern") == os.environ["PATTERN"]), {})
          print(json.dumps(match))
          ')"
          route_id="$(printf '%s' "$existing" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("id", ""))')"
          old_script="$(printf '%s' "$existing" | python3 -c 'import json,sys; value=json.load(sys.stdin).get("script"); print("" if value is None else value)')"
          created=false
          if [ -n "$route_id" ]; then
            curl --silent --show-error --fail-with-body -X PUT \
              -H "Authorization: Bearer $CF_TOKEN" -H 'Content-Type: application/json' \
              --data "$(PATTERN="$pattern" python3 -c 'import json,os; print(json.dumps({"pattern": os.environ["PATTERN"], "script": None}))')" \
              "$api/$route_id" >/dev/null
          else
            response="$(curl --silent --show-error --fail-with-body -X POST \
              -H "Authorization: Bearer $CF_TOKEN" -H 'Content-Type: application/json' \
              --data "$(PATTERN="$pattern" python3 -c 'import json,os; print(json.dumps({"pattern": os.environ["PATTERN"], "script": None}))')" \
              "$api")"
            route_id="$(printf '%s' "$response" | python3 -c 'import json,sys; print((json.load(sys.stdin).get("result") or {}).get("id", ""))')"
            created=true
          fi
          test -n "$route_id"

          path='/news/child-safety-network-20260914/zh-Hans/'
          recovered=
          for attempt in 1 2 3 4 5 6; do
            code="$(curl --silent --show-error --max-time 20 -o /tmp/hk-brief \
              -w '%{http_code}' "https://cn.globalprotectionwall.com${path}?edge=${GITHUB_RUN_ID}-${attempt}" || true)"
            size="$(wc -c </tmp/hk-brief 2>/dev/null || printf 0)"
            printf 'brief_attempt_%s_status=%s size=%s\n' "$attempt" "$code" "$size"
            if [ "$code" = 200 ] && [ "$size" -gt 1000 ]; then
              recovered=1
              break
            fi
            sleep 5
          done

          if [ -z "$recovered" ]; then
            if [ "$created" = true ]; then
              curl --silent --show-error --fail-with-body -X DELETE \
                -H "Authorization: Bearer $CF_TOKEN" "$api/$route_id" >/dev/null
            elif [ -n "$old_script" ]; then
              payload="$(PATTERN="$pattern" OLD_SCRIPT="$old_script" python3 -c 'import json,os; print(json.dumps({"pattern": os.environ["PATTERN"], "script": os.environ["OLD_SCRIPT"]}))')"
              curl --silent --show-error --fail-with-body -X PUT \
                -H "Authorization: Bearer $CF_TOKEN" -H 'Content-Type: application/json' \
                --data "$payload" "$api/$route_id" >/dev/null
            fi
            echo 'Cloudflare brief-route bypass validation failed; route restored.'
            exit 1
          fi
          echo 'cloudflare_brief_bypass_verified=true'
