name: One-off Kaikai live browser validation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oneoff-kaikai-browser-validation-20260829.yml'

permissions:
  contents: read

jobs:
  browser-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install Playwright driver
        run: npm install --no-save playwright-core@1.55.0

      - name: Run live Chromium validation
        run: |
          mkdir -p browser-validation
          cat > browser-validation/validate.mjs <<'JS'
          import { chromium } from 'playwright-core';
          import fs from 'node:fs';
          import { execFileSync } from 'node:child_process';

          const outDir = 'browser-validation/artifacts';
          fs.mkdirSync(outDir, { recursive: true });
          const sites = {
            'zh-Hant': 'https://jerryzuhow77.github.io/child-advocacy-site/hearing-records/prison-watch/kaikai-final-chapter/',
            'zh-Hans': 'https://jerryzuhow77.github.io/child-advocacy-site/hearing-records/prison-watch/kaikai-final-chapter/zh-Hans/'
          };
          const viewports = {
            desktop: { width: 1440, height: 1000 },
            mobile: { width: 390, height: 844 }
          };
          const requiredIds = ['evidence-atlas','witness-conflicts','blood-boundary','restraint-boundary','responsibility-orbit','dentalDutyTitle'];
          const chromeCandidates = ['/usr/bin/google-chrome','/usr/bin/google-chrome-stable','/usr/bin/chromium','/usr/bin/chromium-browser'];
          const executablePath = chromeCandidates.find(path => fs.existsSync(path));
          if (!executablePath) throw new Error('No system Chromium/Chrome executable found');
          console.log(`Using browser: ${executablePath}`);

          const browser = await chromium.launch({
            headless: true,
            executablePath,
            args: ['--no-sandbox','--disable-dev-shm-usage']
          });
          const results = [];

          for (const [lang, url] of Object.entries(sites)) {
            for (const [viewportName, viewport] of Object.entries(viewports)) {
              const context = await browser.newContext({
                viewport,
                locale: lang === 'zh-Hant' ? 'zh-TW' : 'zh-CN',
                colorScheme: 'light',
                reducedMotion: 'no-preference'
              });
              const page = await context.newPage();
              const consoleMessages = [];
              const pageErrors = [];
              const failedRequests = [];
              const badResponses = [];
              page.on('console', msg => {
                if (msg.type() === 'error' || msg.type() === 'warning') {
                  consoleMessages.push({ type: msg.type(), text: msg.text() });
                }
              });
              page.on('pageerror', error => pageErrors.push(String(error)));
              page.on('requestfailed', request => failedRequests.push({ url: request.url(), error: request.failure()?.errorText || 'unknown' }));
              page.on('response', response => {
                if (response.status() >= 400) badResponses.push({ url: response.url(), status: response.status(), type: response.request().resourceType() });
              });

              const started = Date.now();
              const response = await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 60000 });
              await page.waitForLoadState('networkidle', { timeout: 20000 }).catch(() => {});
              await page.waitForTimeout(2200);
              const status = response?.status() ?? null;
              const title = await page.title();
              const finalUrl = page.url();
              const cssLinks = await page.locator('link[rel="stylesheet"]').evaluateAll(elements => elements.map(element => element.href));
              const finalChapterCss = cssLinks.filter(link => link.includes('final-chapter.css'));

              const ids = {};
              const boxes = {};
              for (const id of requiredIds) {
                const locator = page.locator(`#${id}`);
                ids[id] = await locator.count();
                if (ids[id]) boxes[id] = await locator.first().boundingBox();
              }

              const textChecks = {
                atlasTitle: await page.getByText(lang === 'zh-Hant' ? '她在法庭上怎麼說？證據又怎麼回答？' : '她在法庭上怎么说？证据又怎么回答？', { exact: true }).count(),
                bloodTitle: await page.getByText(lang === 'zh-Hant' ? '血跡證明空間，不直接證明單一行為人' : '血迹证明空间，不直接证明单一行为人', { exact: true }).count(),
                dateTriplet: await page.getByText(/2023\.09\.22.*09\.25.*09\.26/).count()
              };

              const overflow = await page.evaluate(() => {
                const viewportWidth = innerWidth;
                const scrollWidth = Math.max(document.documentElement.scrollWidth, document.body.scrollWidth);
                const offenders = [...document.querySelectorAll('body *')]
                  .map(element => {
                    const rect = element.getBoundingClientRect();
                    const style = getComputedStyle(element);
                    return {
                      tag: element.tagName.toLowerCase(),
                      id: element.id || '',
                      className: typeof element.className === 'string' ? element.className.slice(0, 140) : '',
                      left: Math.round(rect.left * 10) / 10,
                      right: Math.round(rect.right * 10) / 10,
                      width: Math.round(rect.width * 10) / 10,
                      position: style.position,
                      overflowX: style.overflowX
                    };
                  })
                  .filter(item => item.width > 0 && item.position !== 'fixed' && (item.left < -2 || item.right > viewportWidth + 2))
                  .slice(0, 30);
                return { viewportWidth, scrollWidth, overflowPx: scrollWidth - viewportWidth, offenders };
              });

              const nav = page.locator('a[href="#evidence-atlas"]').first();
              let anchor = { missing: true };
              if (await nav.count()) {
                await nav.click();
                await page.waitForTimeout(900);
                anchor = {
                  missing: false,
                  hash: await page.evaluate(() => location.hash),
                  visible: await page.locator('#evidence-atlas').evaluate(element => {
                    const rect = element.getBoundingClientRect();
                    return rect.top < innerHeight && rect.bottom > 0;
                  }),
                  top: await page.locator('#evidence-atlas').evaluate(element => Math.round(element.getBoundingClientRect().top))
                };
              }

              const prefix = `${lang}_${viewportName}`;
              await page.screenshot({ path: `${outDir}/${prefix}_anchor-viewport.png`, fullPage: false });
              for (const id of ['evidence-atlas','witness-conflicts','blood-boundary','restraint-boundary','responsibility-orbit']) {
                const locator = page.locator(`#${id}`);
                if (await locator.count()) {
                  await locator.scrollIntoViewIfNeeded();
                  await page.waitForTimeout(350);
                  await locator.screenshot({ path: `${outDir}/${prefix}_${id}.png` });
                }
              }

              const deepUrl = `${url.split('#')[0]}#witness-conflicts`;
              const deepResponse = await page.goto(deepUrl, { waitUntil: 'domcontentloaded', timeout: 60000 });
              await page.waitForLoadState('networkidle', { timeout: 15000 }).catch(() => {});
              await page.waitForTimeout(1200);
              const deepLink = {
                status: deepResponse?.status() ?? null,
                hash: await page.evaluate(() => location.hash),
                visible: await page.locator('#witness-conflicts').evaluate(element => {
                  const rect = element.getBoundingClientRect();
                  return rect.top < innerHeight && rect.bottom > 0;
                }),
                top: await page.locator('#witness-conflicts').evaluate(element => Math.round(element.getBoundingClientRect().top))
              };
              await page.reload({ waitUntil: 'domcontentloaded', timeout: 60000 });
              await page.waitForLoadState('networkidle', { timeout: 15000 }).catch(() => {});
              await page.waitForTimeout(1000);
              deepLink.reloadHash = await page.evaluate(() => location.hash);
              deepLink.reloadVisible = await page.locator('#witness-conflicts').evaluate(element => {
                const rect = element.getBoundingClientRect();
                return rect.top < innerHeight && rect.bottom > 0;
              });

              const actionableConsole = consoleMessages.filter(message => !/favicon|third-party cookie/i.test(message.text));
              const fatal = [];
              if (status !== 200) fatal.push(`HTTP status ${status}`);
              for (const [id, count] of Object.entries(ids)) if (count !== 1) fatal.push(`#${id} count ${count}`);
              for (const [key, count] of Object.entries(textChecks)) if (count < 1) fatal.push(`${key} missing`);
              if (overflow.overflowPx > 4) fatal.push(`horizontal overflow ${overflow.overflowPx}px`);
              if (anchor.missing || anchor.hash !== '#evidence-atlas' || !anchor.visible) fatal.push('evidence-atlas anchor failed');
              if (deepLink.status !== 200 || deepLink.hash !== '#witness-conflicts' || !deepLink.visible || deepLink.reloadHash !== '#witness-conflicts' || !deepLink.reloadVisible) fatal.push('witness-conflicts deep link/reload failed');
              if (pageErrors.length) fatal.push(`${pageErrors.length} page error(s)`);

              results.push({
                lang, viewport: viewportName, dimensions: viewport, status, title, finalUrl,
                loadMs: Date.now() - started, finalChapterCss, ids, boxes, textChecks, overflow,
                anchor, deepLink, console: actionableConsole, pageErrors, failedRequests, badResponses, fatal
              });
              await context.close();
            }
          }

          await browser.close();
          const report = { generatedAt: new Date().toISOString(), executablePath, results };
          fs.writeFileSync(`${outDir}/report.json`, JSON.stringify(report, null, 2));

          const lines = ['# Kaikai live browser validation', ''];
          for (const result of results) {
            lines.push(`## ${result.lang} · ${result.viewport} (${result.dimensions.width}×${result.dimensions.height})`);
            lines.push(`- HTTP: ${result.status}`);
            lines.push(`- CSS: ${result.finalChapterCss.join(', ') || 'missing'}`);
            lines.push(`- Required IDs: ${Object.values(result.ids).every(value => value === 1) ? 'PASS' : 'FAIL'}`);
            lines.push(`- Horizontal overflow: ${result.overflow.overflowPx}px`);
            lines.push(`- Anchor: ${result.anchor.hash || 'missing'} / visible=${result.anchor.visible ?? false}`);
            lines.push(`- Deep link + reload: visible=${result.deepLink.visible} / reloadVisible=${result.deepLink.reloadVisible}`);
            lines.push(`- Console warnings/errors: ${result.console.length}; page errors: ${result.pageErrors.length}; failed requests: ${result.failedRequests.length}; HTTP >=400: ${result.badResponses.length}`);
            lines.push(`- Fatal checks: ${result.fatal.length ? result.fatal.join('; ') : 'none'}`);
            if (result.overflow.offenders.length) lines.push(`- First overflow offender: ${JSON.stringify(result.overflow.offenders[0])}`);
            lines.push('');
          }
          const fatalCount = results.reduce((sum, result) => sum + result.fatal.length, 0);
          lines.push(`**Total fatal checks: ${fatalCount}**`);
          fs.writeFileSync(`${outDir}/summary.md`, lines.join('\n'));
          console.log(lines.join('\n'));
          JS
          node browser-validation/validate.mjs

      - name: Upload screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kaikai-live-browser-validation
          path: browser-validation/artifacts
          retention-days: 14

      - name: Enforce browser checks
        run: |
          node - <<'JS'
          const report = require('./browser-validation/artifacts/report.json');
          const failures = report.results.flatMap(result => result.fatal.map(message => `${result.lang}/${result.viewport}: ${message}`));
          if (failures.length) {
            console.error(failures.join('\n'));
            process.exit(1);
          }
          console.log('All live browser checks passed.');
          JS