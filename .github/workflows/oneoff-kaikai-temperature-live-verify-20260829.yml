name: Verify live Kaikai 24C testimony

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oneoff-kaikai-temperature-live-verify-20260829.yml'

permissions:
  contents: write

jobs:
  live-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Poll GitHub Pages for the new evidence block
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p browser-validation/temperature-evidence
          urls=(
            'https://jerryzuhow77.github.io/child-advocacy-site/hearing-records/prison-watch/kaikai-final-chapter/'
            'https://jerryzuhow77.github.io/child-advocacy-site/hearing-records/prison-watch/kaikai-final-chapter/zh-Hans/'
          )
          for attempt in $(seq 1 60); do
            ready=1
            index=0
            for url in "${urls[@]}"; do
              index=$((index + 1))
              file="browser-validation/temperature-evidence/page-${index}.html"
              curl -fsSL --connect-timeout 15 --max-time 30 "${url}?deploy=${GITHUB_SHA}-${attempt}" -o "$file" || ready=0
              grep -q 'id="death-temperature-evidence"' "$file" || ready=0
              grep -q '24°C' "$file" || ready=0
            done
            if [[ "$ready" -eq 1 ]]; then
              echo "Both public language pages contain the new evidence block."
              exit 0
            fi
            sleep 10
          done
          echo 'Timed out before both public pages exposed the new evidence block.' >&2
          exit 1

      - name: Install Playwright driver
        run: npm install --no-save playwright-core@1.55.0

      - name: Validate desktop, mobile, deep link, reload, and layout
        run: |
          node --input-type=module <<'JS'
          import { chromium } from 'playwright-core';
          import fs from 'node:fs';

          const output = 'browser-validation/temperature-evidence';
          fs.mkdirSync(output, { recursive: true });
          const sites = {
            'zh-Hant': {
              url: 'https://jerryzuhow77.github.io/child-advocacy-site/hearing-records/prison-watch/kaikai-final-chapter/',
              heading: '到院體溫約24°C',
              conclusion: '現有公開證據不足以精確到某一鐘點',
              nav: '24°C與離世時間'
            },
            'zh-Hans': {
              url: 'https://jerryzuhow77.github.io/child-advocacy-site/hearing-records/prison-watch/kaikai-final-chapter/zh-Hans/',
              heading: '到院体温约24°C',
              conclusion: '现有公开证据不足以精确到某一钟点',
              nav: '24°C与离世时间'
            }
          };
          const viewports = {
            desktop: { width: 1440, height: 1000 },
            mobile: { width: 390, height: 844 }
          };

          const browser = await chromium.launch({
            headless: true,
            executablePath: '/usr/bin/google-chrome',
            args: ['--no-sandbox', '--disable-dev-shm-usage']
          });
          const results = [];
          let failed = false;

          for (const [language, site] of Object.entries(sites)) {
            for (const [viewportName, viewport] of Object.entries(viewports)) {
              const context = await browser.newContext({
                viewport,
                locale: language === 'zh-Hant' ? 'zh-TW' : 'zh-CN',
                colorScheme: 'light'
              });
              const page = await context.newPage();
              const pageErrors = [];
              const consoleErrors = [];
              const badSameOriginResponses = [];
              page.on('pageerror', error => pageErrors.push(String(error)));
              page.on('console', message => {
                if (message.type() === 'error') consoleErrors.push(message.text());
              });
              page.on('response', response => {
                const parsed = new URL(response.url());
                if (parsed.hostname === 'jerryzuhow77.github.io' && response.status() >= 400) {
                  badSameOriginResponses.push({ url: response.url(), status: response.status() });
                }
              });

              const targetUrl = `${site.url}?qa=${Date.now()}-${language}-${viewportName}#death-temperature-evidence`;
              const response = await page.goto(targetUrl, { waitUntil: 'networkidle', timeout: 60000 });
              await page.waitForSelector('#death-temperature-evidence', { state: 'visible', timeout: 15000 });
              await page.waitForTimeout(500);

              const beforeReload = await page.evaluate(({ heading, conclusion, nav }) => {
                const target = document.getElementById('death-temperature-evidence');
                const rect = target.getBoundingClientRect();
                const style = getComputedStyle(target);
                const text = target.textContent || '';
                const navLink = [...document.querySelectorAll('a[href="#death-temperature-evidence"]')]
                  .find(link => (link.textContent || '').trim() === nav);
                const sourceHrefs = [...target.querySelectorAll('.source-chips a')].map(link => link.href);
                return {
                  hash: location.hash,
                  headingPresent: text.includes(heading),
                  conclusionPresent: text.includes(conclusion),
                  navLinkPresent: Boolean(navLink),
                  sourceReportPresent: sourceHrefs.some(href => href === 'https://www.taisounds.com/news/content/95/230066'),
                  forensicSourcePresent: sourceHrefs.some(href => href.startsWith('https://doi.org/10.1177/002580247701700209')),
                  visible: style.display !== 'none' && style.visibility !== 'hidden' && Number(style.opacity) > 0.99,
                  targetTop: Math.round(rect.top),
                  targetBottom: Math.round(rect.bottom),
                  targetIntersectsViewport: rect.top < innerHeight && rect.bottom > 0,
                  overflowPixels: Math.max(0, document.documentElement.scrollWidth - innerWidth),
                  duplicateIdCount: document.querySelectorAll('#death-temperature-evidence').length
                };
              }, site);

              await page.reload({ waitUntil: 'networkidle', timeout: 60000 });
              await page.waitForSelector('#death-temperature-evidence', { state: 'visible', timeout: 15000 });
              const afterReload = await page.evaluate(() => ({
                hash: location.hash,
                markerPresent: Boolean(document.getElementById('death-temperature-evidence')),
                targetIntersectsViewport: (() => {
                  const rect = document.getElementById('death-temperature-evidence').getBoundingClientRect();
                  return rect.top < innerHeight && rect.bottom > 0;
                })()
              }));

              const screenshot = `${output}/${language}-${viewportName}.png`;
              await page.screenshot({ path: screenshot, fullPage: true });

              const checks = {
                http200: response?.status() === 200,
                correctHash: beforeReload.hash === '#death-temperature-evidence',
                headingPresent: beforeReload.headingPresent,
                conclusionPresent: beforeReload.conclusionPresent,
                navLinkPresent: beforeReload.navLinkPresent,
                sourceReportPresent: beforeReload.sourceReportPresent,
                forensicSourcePresent: beforeReload.forensicSourcePresent,
                visible: beforeReload.visible,
                targetIntersectsViewport: beforeReload.targetIntersectsViewport,
                noHorizontalOverflow: beforeReload.overflowPixels <= 1,
                uniqueDeepLinkId: beforeReload.duplicateIdCount === 1,
                reloadKeepsHash: afterReload.hash === '#death-temperature-evidence',
                reloadKeepsTarget: afterReload.markerPresent && afterReload.targetIntersectsViewport,
                noPageErrors: pageErrors.length === 0,
                noSameOrigin404s: badSameOriginResponses.length === 0
              };
              const passed = Object.values(checks).every(Boolean);
              if (!passed) failed = true;
              results.push({
                language,
                viewport: viewportName,
                url: page.url(),
                status: response?.status() ?? null,
                checks,
                beforeReload,
                afterReload,
                pageErrors,
                consoleErrors,
                badSameOriginResponses,
                screenshot,
                passed
              });
              await context.close();
            }
          }

          await browser.close();
          fs.writeFileSync(`${output}/report.json`, JSON.stringify(results, null, 2));
          console.log(JSON.stringify(results, null, 2));
          if (failed) process.exit(1);
          JS

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kaikai-24c-live-validation
          path: browser-validation/temperature-evidence
          retention-days: 14

      - name: Remove one-off workflow after success
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/oneoff-kaikai-temperature-live-verify-20260829.yml
          git commit -m 'Remove completed 24C live validation workflow'
          git push origin HEAD:main
