name: Apply repaired Kaikai witness publication 20260829

on:
  push:
    branches:
      - feat/kaikai-witness-analysis-20260829
    paths:
      - .tmp/kaikai-publish-xz.ready-repaired

permissions:
  contents: write

concurrency:
  group: kaikai-witness-publication-repaired-20260829
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out carrier branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assemble and verify publication package
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import hashlib
          from pathlib import Path

          expected_lengths = [17500] * 15 + [11784]
          expected_sha256 = [
              '860878a1c6ab38bfe35826a34e86f5f7e129b992ec740e7cc64716382c49501e',
              '7f7ab8e9ae80fc4907457984f0f1ea39efdb3758ed125b16e9c7b38bd7a8d9e8',
              '738c98e7d9e7652edc84096c33a9f853ec91a37f326be7b69a0f3e7c585128c4',
              '89bd6ebfe47e1afb9fe83636164a71f389d4e6fc6f0ea0197228f57291e3211c',
              '15411cb94803c99e82265097e6150e50b571b5d8cefd48497ff6a309003a3f9b',
              '4fceece10561f40e6f36b338ff6b40adbf8d6166750de571dca3455285b35114',
              '51894bfdc06ed018397b44b8775a1fe88db69321c9feac49f3c3d65840baf90f',
              '9e74ac36bd57699231260f21789162618f1bb4b885b5a872145b1d623720e2f7',
              'aa5b63f569f935a3aec3484ac86923934ee5dedf44d42a619ca87da9e482960b',
              '9a72b6d84dedb80efb9dd5e74e7f0ad4076ef190c096b7529fb5e68c0dfdd937',
              'ac8213f0ac0ce0f2da33b6bbda451a62188dfd05e7be843bc044c62e608c5f5e',
              'b1c8f0f96627f8afc9595d593db920ecf02f75b3cab705608704216935259607',
              '7ce9366dffbc0a9d6c28e6f1e552a84a70fccb8836b7ab66f621a22e5d69b0fe',
              '9134bb9a1d400b586c2ca3f9bb60dcd2c03b8b849b02ca6e1ac959adbdc61a67',
              '809636f50319b022090531d8e1f98d6f258db3b7760becfdf96f225264360d9d',
              '75acb51a9c6c781ff51684eb4c218016f1ddcd579a18478a1d3e60e6a6ee89a2',
          ]
          repaired = {6, 7, 11, 14, 15}
          alphabet = frozenset('ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/=')

          def clean_text(text: str) -> str:
              for escaped in ('\\n', '\\r', '\\t'):
                  text = text.replace(escaped, '')
              return ''.join(ch for ch in text if ch in alphabet)

          decoded_chunks = []
          for index, (expected_chars, expected_digest) in enumerate(zip(expected_lengths, expected_sha256)):
              if index in repaired:
                  parts = sorted(Path('.tmp/repair-xz').glob(f'{index:03d}.*.b64'))
                  if not parts:
                      raise SystemExit(f'chunk {index:03d}: repair parts missing')
                  clean = ''.join(clean_text(path.read_text(encoding='utf-8')) for path in parts)
                  if len(clean) != expected_chars:
                      raise SystemExit(
                          f'chunk {index:03d}: repaired base64 length {len(clean)} != {expected_chars}'
                      )
                  data = base64.b64decode(clean, validate=True)
                  source = f'{len(parts)} repair parts'
                  offset = 0
              else:
                  path = Path(f'.tmp/kaikai-publish-xz.{index:03d}.b64')
                  if not path.is_file():
                      raise SystemExit(f'{path}: missing carrier chunk')
                  clean = clean_text(path.read_text(encoding='utf-8'))
                  data = None
                  offset = None
                  for start in range(max(0, len(clean) - expected_chars) + 1):
                      window = clean[start:start + expected_chars]
                      if len(window) != expected_chars:
                          continue
                      try:
                          candidate = base64.b64decode(window, validate=True)
                      except Exception:
                          continue
                      if hashlib.sha256(candidate).hexdigest() == expected_digest:
                          data = candidate
                          offset = start
                          break
                  if data is None:
                      raise SystemExit(
                          f'chunk {index:03d}: no verified window; clean={len(clean)}, expected={expected_chars}'
                      )
                  source = path.name

              digest = hashlib.sha256(data).hexdigest()
              if digest != expected_digest:
                  raise SystemExit(
                      f'chunk {index:03d}: sha256 mismatch; expected {expected_digest}, got {digest}'
                  )
              print(f'chunk {index:03d}: verified from {source}, offset={offset}, bytes={len(data)}')
              decoded_chunks.append(data)

          package = b''.join(decoded_chunks)
          package_digest = hashlib.sha256(package).hexdigest()
          expected_package_digest = '20fb08156b1bc8aa4f653ebab7ef4dd809a26e6921181005d4343bc6eb2b67e8'
          if package_digest != expected_package_digest:
              raise SystemExit(
                  f'package sha256 mismatch: expected {expected_package_digest}, got {package_digest}'
              )
          Path('/tmp/kaikai-publish-compact.tar.xz').write_bytes(package)
          print(f'package verified: {len(package)} bytes, sha256={package_digest}')
          PY

      - name: Switch to latest main and apply publication
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B kaikai-publication origin/main
          tar -xJf /tmp/kaikai-publish-compact.tar.xz -C .
          patch --batch --forward -p1 < main.patch
          rm -f main.patch
          test -z "$(find . \( -name '*.rej' -o -name '*.orig' \) -print -quit)"

      - name: Validate generated public files
        shell: bash
        run: |
          set -euo pipefail
          chapter='hearing-records/prison-watch/kaikai-final-chapter'
          hant="$chapter/witnesses/index.html"
          hans="$chapter/zh-Hans/witnesses/index.html"

          git diff --check
          node --check "$chapter/final-chapter.js"
          node --check "$chapter/witnesses/witnesses.js"

          test "$(grep -o 'class="witness-card"' "$hant" | wc -l | tr -d ' ')" = '13'
          test "$(grep -o 'class="witness-card"' "$hans" | wc -l | tr -d ' ')" = '13'
          test "$(grep -o 'class="issue-row"' "$hant" | wc -l | tr -d ' ')" = '13'
          test "$(grep -o 'class="issue-row"' "$hans" | wc -l | tr -d ' ')" = '13'

          grep -q '13名證人全文' "$chapter/index.html"
          grep -q '13名证人全文' "$chapter/zh-Hans/index.html"
          grep -q '束帶直接扣住私處並綁在便盆' "$hant"
          grep -q '束带直接扣住私处并绑在便盆' "$hans"
          grep -q '法院並未公開官方逐字稿' "$hant"
          grep -q '法院并未公开官方逐字稿' "$hans"
          grep -q '/kaikai-final-chapter/witnesses/' sitemap.xml
          grep -q '/kaikai-final-chapter/zh-Hans/witnesses/' sitemap.xml
          grep -q 'syncAnchorOffset' "$chapter/final-chapter.js"
          grep -q 'scroll-padding-top:var(--chapter-anchor-offset)' "$chapter/final-chapter.css"

          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          pages = [
              Path('hearing-records/prison-watch/kaikai-final-chapter/index.html'),
              Path('hearing-records/prison-watch/kaikai-final-chapter/zh-Hans/index.html'),
              Path('hearing-records/prison-watch/kaikai-final-chapter/witnesses/index.html'),
              Path('hearing-records/prison-watch/kaikai-final-chapter/zh-Hans/witnesses/index.html'),
          ]

          class IdParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.ids = []
              def handle_starttag(self, tag, attrs):
                  value = dict(attrs).get('id')
                  if value:
                      self.ids.append(value)

          for page in pages:
              text = page.read_text(encoding='utf-8')
              parser = IdParser()
              parser.feed(text)
              duplicates = sorted({item for item in parser.ids if parser.ids.count(item) > 1})
              if duplicates:
                  raise SystemExit(f'{page}: duplicate ids: {duplicates}')
              if '<main' not in text or '</html>' not in text:
                  raise SystemExit(f'{page}: incomplete document')

          for page in pages[2:]:
              text = page.read_text(encoding='utf-8')
              for required in ('contradiction-matrix', 'witness-01', 'witness-13'):
                  if f'id="{required}"' not in text:
                      raise SystemExit(f'{page}: missing #{required}')

          image = Path('assets/art/kaikai-dual-track-responsibility-tree-zh-Hant-20260829.webp').read_bytes()
          if len(image) < 50_000 or image[:4] != b'RIFF' or image[8:12] != b'WEBP':
              raise SystemExit('responsibility-tree WebP is invalid')
          print('Static publication checks passed.')
          PY

      - name: Commit and publish to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            assets/art/kaikai-dual-track-responsibility-tree-zh-Hant-20260829.webp \
            hearing-records/prison-watch/kaikai-final-chapter/index.html \
            hearing-records/prison-watch/kaikai-final-chapter/zh-Hans/index.html \
            hearing-records/prison-watch/kaikai-final-chapter/final-chapter.css \
            hearing-records/prison-watch/kaikai-final-chapter/final-chapter.js \
            hearing-records/prison-watch/kaikai-final-chapter/witnesses \
            hearing-records/prison-watch/kaikai-final-chapter/zh-Hans/witnesses \
            sitemap.xml
          git commit -m 'Publish Kaikai witness evidence analysis and fix chapter anchors'

          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Main advanced; rebasing publication commit (attempt ${attempt})."
            git fetch origin main
            git rebase origin/main
          done
          echo 'Unable to publish after five push attempts.' >&2
          exit 1
