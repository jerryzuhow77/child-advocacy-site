name: Auto-update Fujian Qiqi feature

on:
  push:
    branches: [main]
    paths:
      - 'historical-cases/regions/mainland-china/fujian-qiqi/**'
      - 'zh-hans/historical-cases/regions/mainland-china/fujian-qiqi/**'
      - 'en/historical-cases/regions/mainland-china/fujian-qiqi/**'
      - 'ja/historical-cases/regions/mainland-china/fujian-qiqi/**'
      - 'assets/fujian-qiqi-feature.css'
      - 'assets/fujian-qiqi-feature.js'
      - 'assets/fujian-qiqi/**'
      - 'scripts/sync_fujian_qiqi_feature.py'
      - '.github/workflows/fujian-qiqi-auto-sync.yml'
  workflow_dispatch:

permissions:
  contents: write

# Share the sitemap workflow's lock so both automations cannot push at once.
concurrency:
  group: child-advocacy-site-sitemap
  cancel-in-progress: false

jobs:
  synchronize:
    if: github.actor != 'github-actions[bot]' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refresh four-language metadata and cache tokens
        env:
          QIQI_VERSION_SHA: ${{ github.sha }}
        run: python3 scripts/sync_fujian_qiqi_feature.py

      - name: Validate synchronizer and generated HTML
        run: |
          python3 -m py_compile scripts/sync_fujian_qiqi_feature.py
          python3 - <<'PY'
          from pathlib import Path
          pages = [
              Path('historical-cases/regions/mainland-china/fujian-qiqi/index.html'),
              Path('zh-hans/historical-cases/regions/mainland-china/fujian-qiqi/index.html'),
              Path('en/historical-cases/regions/mainland-china/fujian-qiqi/index.html'),
              Path('ja/historical-cases/regions/mainland-china/fujian-qiqi/index.html'),
          ]
          for page in pages:
              text = page.read_text(encoding='utf-8')
              assert text.count('<html') == 1, page
              assert text.count('</html>') == 1, page
              assert 'fujian-qiqi-feature.css?v=' in text, page
              assert 'fujian-qiqi-feature.js?v=' in text, page
              assert '"dateModified"' in text, page
          print('Validated all four Fujian Qiqi language pages.')
          PY

      - name: Commit synchronized pages only when changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            historical-cases/regions/mainland-china/fujian-qiqi/index.html \
            zh-hans/historical-cases/regions/mainland-china/fujian-qiqi/index.html \
            en/historical-cases/regions/mainland-china/fujian-qiqi/index.html \
            ja/historical-cases/regions/mainland-china/fujian-qiqi/index.html
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m 'Auto-sync Fujian Qiqi multilingual deployment metadata'
          git pull --rebase origin main
          git push
