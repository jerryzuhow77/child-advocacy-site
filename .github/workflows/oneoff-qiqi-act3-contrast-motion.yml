name: Refine Qiqi third-act contrast and motion

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oneoff-qiqi-act3-contrast-motion.yml'

permissions:
  contents: write

concurrency:
  group: child-advocacy-site-sitemap
  cancel-in-progress: false

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add third-act contrast and GSAP refinement
        run: |
          python3 - <<'PY'
          from pathlib import Path

          css_path = Path('assets/fujian-qiqi-feature.css')
          js_path = Path('assets/fujian-qiqi-feature.js')

          css_marker = '/* === Third-act contrast and GSAP visual refinement · 2026-08-21 === */'
          css_patch = r'''
          /* === Third-act contrast and GSAP visual refinement · 2026-08-21 === */
          .fq-act[data-act="3"] {
            --fq-act-accent: #65495f;
            --fq-act-glow: rgba(169, 143, 166, .34);
          }

          .fq-act[data-act="3"] .fq-stage::before {
            background:
              linear-gradient(180deg, rgba(11, 17, 22, .31), rgba(17, 23, 28, .08) 31%, rgba(12, 18, 22, .3) 64%, rgba(9, 14, 18, .76)),
              radial-gradient(circle at 50% 47%, transparent 13%, rgba(6, 11, 15, .33) 100%);
          }

          /* The third act uses dark ink on a pale dossier-like panel. This keeps the
             copy visibly deeper even where the moonlit illustration is bright. */
          .fq-act[data-act="3"] .fq-stage > .fq-act__title {
            padding: .68rem clamp(.8rem, 2vw, 1.25rem) .78rem;
            border: 1px solid rgba(65, 47, 63, .28);
            border-radius: 17px;
            color: #2c2630;
            background: linear-gradient(135deg, rgba(250, 246, 239, .95), rgba(231, 222, 227, .93));
            box-shadow: 0 16px 42px rgba(9, 14, 18, .23), inset 0 1px 0 rgba(255, 255, 255, .72);
            text-shadow: none;
            backdrop-filter: blur(12px) saturate(.86);
          }

          .fq-act[data-act="3"] .fq-stage > .fq-act__title small {
            color: #684b61;
            text-shadow: none;
          }

          .fq-act[data-act="3"] .fq-stage > .fq-act__title h2 {
            color: #2b2530;
            text-shadow: none;
          }

          .fq-act[data-act="3"] .fq-stage > .fq-act__title p {
            color: #454047;
            font-weight: 650;
            text-shadow: none;
          }

          .fq-act[data-act="3"] .fq-line,
          .fq-act[data-act="3"] [data-fq-line] {
            border-color: rgba(70, 52, 67, .34);
            color: #252128;
            background: rgba(249, 245, 239, .96);
            box-shadow: 0 20px 54px rgba(13, 17, 22, .28), inset 0 1px 0 rgba(255, 255, 255, .74);
            font-weight: 560;
            text-shadow: none;
            backdrop-filter: blur(12px) saturate(.8);
          }

          .fq-act[data-act="3"] .fq-line[data-speaker="female"] {
            border-color: rgba(114, 59, 80, .42);
            color: #33252d;
            background: rgba(247, 236, 239, .97);
          }

          .fq-act[data-act="3"] .fq-line[data-speaker="male"] {
            border-color: rgba(55, 91, 99, .4);
            color: #203035;
            background: rgba(237, 243, 242, .97);
          }

          .fq-act[data-act="3"] .fq-line > b {
            color: #5f3f55;
            font-weight: 850;
            text-shadow: none;
          }

          .fq-act[data-act="3"] .fq-line[data-speaker="male"] > b {
            color: #31545c;
          }

          .fq-act[data-act="3"] .fq-line > span {
            color: inherit;
          }

          .fq-act[data-act="3"] .fq-line.is-current {
            border-color: rgba(83, 57, 77, .58);
            box-shadow: 0 25px 64px rgba(12, 16, 21, .34), 0 0 0 1px rgba(255, 255, 255, .48) inset;
          }

          .fq-act[data-act="3"] .fq-transcript {
            border-color: rgba(76, 55, 71, .24);
            color: #2b252d;
            background: rgba(251, 247, 242, .96);
            box-shadow: 0 18px 48px rgba(56, 42, 54, .1);
          }

          .fq-act[data-act="3"] .fq-transcript summary {
            color: #5f3f55;
          }

          .fq-act[data-act="3"] .fq-transcript p {
            color: #373038;
            border-left-color: rgba(101, 73, 95, .4);
          }

          /* Symbolic, non-graphic seventeen-mark motif. It stays behind all text and
             actors, and is animated only by the dedicated GSAP controller. */
          .fq-act3-moon-sweep,
          .fq-act3-marks {
            position: absolute;
            pointer-events: none;
          }

          .fq-act3-moon-sweep {
            z-index: 4;
            inset: -18%;
            opacity: .42;
            background:
              radial-gradient(circle at 50% 24%, rgba(231, 220, 225, .34), transparent 22%),
              linear-gradient(112deg, transparent 25%, rgba(209, 195, 211, .13) 47%, transparent 68%);
            filter: blur(5px);
            mix-blend-mode: screen;
            transform-origin: 50% 50%;
          }

          .fq-act3-marks {
            z-index: 5;
            inset: 5% 3% 12%;
            overflow: hidden;
            opacity: .84;
          }

          .fq-act3-mark {
            position: absolute;
            top: var(--fq-mark-y);
            left: var(--fq-mark-x);
            display: block;
            width: 2px;
            height: var(--fq-mark-height);
            border-radius: 99px;
            opacity: .18;
            background: linear-gradient(180deg, rgba(234, 217, 224, .76), rgba(126, 88, 116, .18));
            box-shadow: 0 0 10px rgba(209, 183, 202, .2);
            transform: rotate(var(--fq-mark-rotation)) scaleY(.18);
            transform-origin: 50% 100%;
          }

          .fq-act3-ready .fq-act3-mark,
          html[data-fq-motion="off"] .fq-act3-mark {
            opacity: .28;
            transform: rotate(var(--fq-mark-rotation)) scaleY(1);
          }

          .fq-act3-animating .fq-act3-moon-sweep,
          .fq-act3-animating .fq-act3-mark {
            will-change: transform, opacity;
          }

          .fq-act3-ready .fq-act3-moon-sweep,
          .fq-act3-ready .fq-act3-mark {
            will-change: auto;
          }

          @media (max-width: 780px) {
            .fq-act[data-act="3"] .fq-stage > .fq-act__title {
              padding: .58rem .72rem .64rem;
              border-radius: 14px;
            }

            .fq-act[data-act="3"] .fq-stage > .fq-act__title h2 {
              font-size: clamp(1.45rem, 7.5vw, 2.1rem);
            }

            .fq-act[data-act="3"] .fq-stage > .fq-act__title p {
              color: #3e3940;
              font-size: .69rem;
            }

            .fq-act[data-act="3"] .fq-line,
            .fq-act[data-act="3"] [data-fq-line] {
              color: #211e24;
              background: rgba(250, 246, 240, .98);
              box-shadow: 0 18px 46px rgba(10, 14, 18, .32);
            }

            .fq-act[data-act="3"] .fq-line[data-speaker="female"] {
              color: #30232b;
              background: rgba(248, 238, 241, .98);
            }

            .fq-act[data-act="3"] .fq-line[data-speaker="male"] {
              color: #1c2c31;
              background: rgba(239, 245, 244, .98);
            }

            .fq-act3-marks {
              inset: 7% 1% 18%;
              opacity: .6;
            }

            .fq-act3-mark {
              width: 1.5px;
              opacity: .13;
            }

            .fq-act3-moon-sweep {
              inset: -10% -28%;
              opacity: .32;
            }
          }

          @media (max-width: 380px) {
            .fq-act[data-act="3"] .fq-stage > .fq-act__title p {
              display: none;
            }

            .fq-act3-mark:nth-child(n + 13) {
              display: none;
            }
          }

          @media (prefers-reduced-motion: reduce) {
            .fq-act3-moon-sweep,
            .fq-act3-mark {
              animation: none;
              transition: none;
              transform: none;
            }

            .fq-act3-mark {
              opacity: .22;
            }
          }

          @media (forced-colors: active) {
            .fq-act3-moon-sweep,
            .fq-act3-marks {
              display: none;
            }

            .fq-act[data-act="3"] .fq-stage > .fq-act__title,
            .fq-act[data-act="3"] .fq-line,
            .fq-act[data-act="3"] [data-fq-line] {
              border: 1px solid CanvasText;
              color: CanvasText;
              background: Canvas;
            }
          }
          '''

          js_marker = '/* Third-act contrast and motion refinement · 2026-08-21 */'
          js_patch = r'''
          /* Third-act contrast and motion refinement · 2026-08-21 */
          (() => {
            'use strict';

            const ready = callback => {
              if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', callback, { once: true });
              } else {
                callback();
              }
            };

            ready(() => {
              const scene = document.querySelector('.fq-act[data-act="3"]');
              const stage = scene && scene.querySelector('.fq-stage');
              if (!scene || !stage || scene.dataset.fqAct3Refined === 'true') return;
              scene.dataset.fqAct3Refined = 'true';

              const html = document.documentElement;
              const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
              const saveData = Boolean(navigator.connection && navigator.connection.saveData);
              const motionMode = html.dataset.fqMotion || 'full';
              const lite = motionMode === 'lite';
              const off = motionMode === 'off';
              const gsap = window.gsap && typeof window.gsap.timeline === 'function' ? window.gsap : null;

              const sweep = document.createElement('div');
              sweep.className = 'fq-act3-moon-sweep';
              sweep.setAttribute('aria-hidden', 'true');

              const marksLayer = document.createElement('div');
              marksLayer.className = 'fq-act3-marks';
              marksLayer.setAttribute('aria-hidden', 'true');

              const xPositions = [7, 13, 20, 28, 36, 44, 52, 61, 69, 77, 85, 91, 17, 33, 48, 65, 82];
              const yPositions = [22, 42, 17, 54, 29, 66, 38, 18, 58, 31, 70, 46, 77, 12, 74, 9, 79];
              const heights = [54, 34, 44, 61, 38, 48, 57, 32, 52, 41, 63, 36, 46, 58, 35, 49, 40];
              const rotations = [-8, 6, -4, 9, -7, 5, -10, 4, -5, 8, -3, 7, -9, 3, -6, 10, -2];

              const marks = xPositions.map((x, index) => {
                const mark = document.createElement('i');
                mark.className = 'fq-act3-mark';
                mark.style.setProperty('--fq-mark-x', `${x}%`);
                mark.style.setProperty('--fq-mark-y', `${yPositions[index]}%`);
                mark.style.setProperty('--fq-mark-height', `${heights[index]}px`);
                mark.style.setProperty('--fq-mark-rotation', `${rotations[index]}deg`);
                marksLayer.append(mark);
                return mark;
              });

              const title = stage.querySelector('.fq-act__title');
              const anchor = stage.querySelector('.fq-stage__light') || title || stage.firstChild;
              stage.insertBefore(sweep, anchor);
              stage.insertBefore(marksLayer, anchor);
              scene.classList.add('fq-act3-refined');

              const titleParts = title ? [...title.querySelectorAll('small, h2, p')] : [];
              const lines = [...stage.querySelectorAll('.fq-dialogue .fq-line')];

              const revealStatic = () => {
                scene.classList.add('fq-act3-ready');
                marks.forEach(mark => mark.classList.add('is-drawn'));
              };

              if (!gsap || reduced || off || saveData) {
                revealStatic();
                return;
              }

              gsap.set(marks, {
                autoAlpha: 0,
                scaleY: 0,
                transformOrigin: '50% 100%'
              });

              const intro = gsap.timeline({
                paused: true,
                defaults: { ease: 'power2.out' },
                onStart: () => scene.classList.add('fq-act3-animating'),
                onComplete: () => {
                  scene.classList.remove('fq-act3-animating');
                  scene.classList.add('fq-act3-ready');
                  gsap.set(titleParts, { clearProps: 'opacity,visibility,transform,filter' });
                }
              });

              if (titleParts.length) {
                intro.fromTo(
                  titleParts,
                  { autoAlpha: 0, y: -10, filter: 'blur(3px)' },
                  { autoAlpha: 1, y: 0, filter: 'blur(0px)', duration: .72, stagger: .12 },
                  0
                );
              }

              intro.to(
                marks,
                {
                  autoAlpha: index => .24 + (index % 4) * .045,
                  scaleY: 1,
                  duration: lite ? .42 : .68,
                  stagger: lite ? .025 : .055,
                  ease: 'power3.out'
                },
                .18
              );

              const ambient = gsap.timeline({ paused: true, repeat: -1, yoyo: true });
              ambient.fromTo(
                sweep,
                { xPercent: -4, yPercent: -1, scale: 1.01, autoAlpha: .34 },
                { xPercent: 4, yPercent: 1, scale: 1.05, autoAlpha: .62, duration: 8.5, ease: 'sine.inOut' }
              );
              ambient.to(marksLayer, { autoAlpha: .78, duration: 4.8, ease: 'sine.inOut' }, 0);

              let currentLine = null;
              const emphasizeLine = line => {
                if (!line || line === currentLine) return;
                currentLine = line;
                const label = line.querySelector('b');
                const copy = line.querySelector('span');
                const index = Math.max(0, lines.indexOf(line));
                const start = index * 4;
                const activeMarks = marks.filter((_, markIndex) => markIndex >= start && markIndex < start + 5);
                const passiveMarks = marks.filter(mark => !activeMarks.includes(mark));

                if (label) {
                  gsap.fromTo(
                    label,
                    { autoAlpha: 0, x: -10 },
                    { autoAlpha: 1, x: 0, duration: .48, ease: 'power2.out', clearProps: 'opacity,visibility,transform' }
                  );
                }
                if (copy) {
                  gsap.fromTo(
                    copy,
                    { autoAlpha: .28, y: 8, filter: 'blur(2px)' },
                    { autoAlpha: 1, y: 0, filter: 'blur(0px)', duration: .68, ease: 'power2.out', clearProps: 'opacity,visibility,transform,filter' }
                  );
                }
                gsap.to(activeMarks, { autoAlpha: .62, duration: .45, stagger: .025, overwrite: 'auto' });
                gsap.to(passiveMarks, { autoAlpha: .2, duration: .58, overwrite: 'auto' });
                gsap.fromTo(
                  line,
                  { boxShadow: '0 14px 34px rgba(20, 15, 23, .18)' },
                  { boxShadow: '0 24px 62px rgba(20, 15, 23, .34)', duration: .75, ease: 'power2.out' }
                );
              };

              lines.forEach(line => {
                if (line.classList.contains('is-current')) emphasizeLine(line);
              });

              const lineObserver = new MutationObserver(records => {
                records.forEach(record => {
                  const line = record.target;
                  if (line.classList.contains('is-current')) emphasizeLine(line);
                });
              });
              lines.forEach(line => lineObserver.observe(line, { attributes: true, attributeFilter: ['class'] }));

              let introPlayed = false;
              const playVisuals = () => {
                if (!introPlayed) {
                  introPlayed = true;
                  intro.play(0);
                }
                if (!lite && !document.hidden) ambient.play();
              };
              const pauseVisuals = () => ambient.pause();

              const visibilityObserver = 'IntersectionObserver' in window
                ? new IntersectionObserver(entries => {
                    entries.forEach(entry => {
                      if (entry.isIntersecting && entry.intersectionRatio >= .12) playVisuals();
                      else pauseVisuals();
                    });
                  }, { threshold: [0, .12, .35], rootMargin: '12% 0px' })
                : null;

              if (visibilityObserver) visibilityObserver.observe(scene);
              else playVisuals();

              const replayButton = scene.querySelector('[data-scene-replay]');
              const onReplay = () => {
                introPlayed = true;
                intro.restart(true);
                if (!lite) ambient.restart(true);
              };
              if (replayButton) replayButton.addEventListener('click', onReplay);

              const onVisibility = () => {
                if (document.hidden) {
                  pauseVisuals();
                  return;
                }
                const rect = scene.getBoundingClientRect();
                if (rect.bottom > 0 && rect.top < innerHeight) playVisuals();
              };
              document.addEventListener('visibilitychange', onVisibility);

              window.addEventListener('pagehide', () => {
                if (visibilityObserver) visibilityObserver.disconnect();
                lineObserver.disconnect();
                intro.kill();
                ambient.kill();
                gsap.killTweensOf([...marks, marksLayer, sweep, ...titleParts, ...lines]);
                if (replayButton) replayButton.removeEventListener('click', onReplay);
                document.removeEventListener('visibilitychange', onVisibility);
              }, { once: true });
            });
          })();
          '''

          css = css_path.read_text(encoding='utf-8')
          if css_marker not in css:
              css_path.write_text(css.rstrip() + '\n\n' + css_patch.strip() + '\n', encoding='utf-8')

          js = js_path.read_text(encoding='utf-8')
          if js_marker not in js:
              js = js.replace("version: '1.3.1'", "version: '1.3.2'", 1)
              js_path.write_text(js.rstrip() + '\n\n' + js_patch.strip() + '\n', encoding='utf-8')
          PY

      - name: Refresh four-language cache versions
        env:
          QIQI_VERSION_SHA: ${{ github.sha }}
        run: python3 scripts/sync_fujian_qiqi_feature.py

      - name: Validate JavaScript, CSS and language pages
        run: |
          node --check assets/fujian-qiqi-feature.js
          python3 -m py_compile scripts/sync_fujian_qiqi_feature.py
          grep -q 'Third-act contrast and GSAP visual refinement' assets/fujian-qiqi-feature.css
          grep -q 'Third-act contrast and motion refinement' assets/fujian-qiqi-feature.js
          grep -q 'fq-act3-marks' assets/fujian-qiqi-feature.css
          grep -q "version: '1.3.2'" assets/fujian-qiqi-feature.js
          for page in \
            historical-cases/regions/mainland-china/fujian-qiqi/index.html \
            zh-hans/historical-cases/regions/mainland-china/fujian-qiqi/index.html \
            en/historical-cases/regions/mainland-china/fujian-qiqi/index.html \
            ja/historical-cases/regions/mainland-china/fujian-qiqi/index.html; do
            grep -q 'fujian-qiqi-feature.css?v=' "$page"
            grep -q 'fujian-qiqi-feature.js?v=' "$page"
          done
          git diff --check

      - name: Commit the refinement and remove this one-off workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -- .github/workflows/oneoff-qiqi-act3-contrast-motion.yml
          git add -- \
            assets/fujian-qiqi-feature.css \
            assets/fujian-qiqi-feature.js \
            historical-cases/regions/mainland-china/fujian-qiqi/index.html \
            zh-hans/historical-cases/regions/mainland-china/fujian-qiqi/index.html \
            en/historical-cases/regions/mainland-china/fujian-qiqi/index.html \
            ja/historical-cases/regions/mainland-china/fujian-qiqi/index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Deepen Qiqi third-act text and refine GSAP motion'
          git pull --rebase origin main
          git push
