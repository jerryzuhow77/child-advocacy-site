name: Clean final Kaikai medical responsibility zone verification

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oneoff-kaikai-medical-zone-clean-final-20260829.yml'

permissions:
  contents: write

jobs:
  verify-and-clean:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Finalize canonical witness links
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin main
          python3 .github/scripts/finalize-kaikai-medical-zone-20260829.py
          node --check hearing-records/prison-watch/kaikai-final-chapter/medical-responsibility/medical-responsibility.js
          node --check .github/scripts/verify-kaikai-medical-zone-live-20260829.mjs
          git diff --check

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hearing-records/prison-watch/kaikai-final-chapter/witnesses/index.html
          git add hearing-records/prison-watch/kaikai-final-chapter/zh-Hans/witnesses/index.html
          if ! git diff --cached --quiet; then
            git commit -m 'Place medical-zone links in the correct witness source panels'
            pushed=0
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then
                pushed=1
                break
              fi
              git pull --rebase origin main
            done
            test "$pushed" -eq 1
          fi

      - name: Wait for finalized public pages and entry points
        shell: bash
        run: |
          set -euo pipefail
          pages=(
            'https://jerryzuhow77.github.io/child-advocacy-site/hearing-records/prison-watch/kaikai-final-chapter/medical-responsibility/'
            'https://jerryzuhow77.github.io/child-advocacy-site/hearing-records/prison-watch/kaikai-final-chapter/medical-responsibility/zh-Hans/'
          )
          parents=(
            'https://jerryzuhow77.github.io/child-advocacy-site/hearing-records/prison-watch/kaikai-final-chapter/'
            'https://jerryzuhow77.github.io/child-advocacy-site/hearing-records/prison-watch/kaikai-final-chapter/zh-Hans/'
          )
          witnesses=(
            'https://jerryzuhow77.github.io/child-advocacy-site/hearing-records/prison-watch/kaikai-final-chapter/witnesses/'
            'https://jerryzuhow77.github.io/child-advocacy-site/hearing-records/prison-watch/kaikai-final-chapter/zh-Hans/witnesses/'
          )
          page_phrases=('醫療責任釐清專區' '医疗责任厘清专区')
          menu_phrases=('<summary>醫療責任</summary>' '<summary>医疗责任</summary>')
          witness_phrases=('進入醫療責任釐清專區' '进入医疗责任厘清专区')
          for attempt in $(seq 1 105); do
            ready=1
            for i in 0 1; do
              token="${GITHUB_SHA}-${attempt}-${i}"
              page_html="$(curl -fsSL --connect-timeout 15 --max-time 30 "${pages[$i]}?qa=${token}" || true)"
              parent_html="$(curl -fsSL --connect-timeout 15 --max-time 30 "${parents[$i]}?qa=${token}" || true)"
              witness_html="$(curl -fsSL --connect-timeout 15 --max-time 30 "${witnesses[$i]}?qa=${token}" || true)"
              grep -q "${page_phrases[$i]}" <<<"$page_html" || ready=0
              grep -q 'medical-responsibility.js?v=20260829-2' <<<"$page_html" || ready=0
              grep -q 'id="control-yuan"' <<<"$page_html" || ready=0
              grep -q 'id="clinics"' <<<"$page_html" || ready=0
              grep -q "${menu_phrases[$i]}" <<<"$parent_html" || ready=0
              grep -q "${witness_phrases[$i]}" <<<"$witness_html" || ready=0
            done
            if [[ "$ready" -eq 1 ]]; then
              echo 'The finalized bilingual medical responsibility zone is public.'
              exit 0
            fi
            sleep 10
          done
          echo 'Timed out before the finalized medical responsibility zone became public.' >&2
          exit 1

      - name: Install Playwright driver
        run: npm install --no-save playwright-core@1.55.0

      - name: Verify Traditional and Simplified desktop and mobile Chrome
        run: node .github/scripts/verify-kaikai-medical-zone-live-20260829.mjs

      - name: Upload final browser proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kaikai-medical-responsibility-zone-clean-final-proof
          path: browser-validation/medical-responsibility-zone-final
          retention-days: 14

      - name: Remove completed one-off files
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main
          git rm -f .github/workflows/oneoff-kaikai-medical-zone-clean-final-20260829.yml
          git rm -f .github/scripts/finalize-kaikai-medical-zone-20260829.py
          git rm -f .github/scripts/verify-kaikai-medical-zone-live-20260829.mjs
          git commit -m 'Remove completed medical responsibility verification files'
          pushed=0
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              pushed=1
              break
            fi
            git pull --rebase origin main
          done
          test "$pushed" -eq 1
