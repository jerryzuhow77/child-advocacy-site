name: Publish and verify expanded Kaikai out-of-home care section

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oneoff-kaikai-out-of-home-care-20260829.yml'

permissions:
  contents: write

jobs:
  publish-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Expand Taiwan out-of-home care defects and real harm evidence
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin main
          python3 -m py_compile .github/scripts/patch-kaikai-out-of-home-care-20260829.py
          python3 .github/scripts/patch-kaikai-out-of-home-care-20260829.py
          node --check hearing-records/prison-watch/kaikai-final-chapter/final-chapter.js
          node --check .github/scripts/verify-kaikai-out-of-home-care-20260829.mjs
          git diff --check

          python3 - <<'PY'
          import re
          from pathlib import Path
          paths = [
              Path('hearing-records/prison-watch/kaikai-final-chapter/index.html'),
              Path('hearing-records/prison-watch/kaikai-final-chapter/zh-Hans/index.html'),
          ]
          versions = []
          for path in paths:
              text = path.read_text(encoding='utf-8')
              match = re.search(r'final-chapter\.css\?v=(20260829-\d+)', text)
              if not match:
                  raise SystemExit(f'{path}: CSS cache version missing')
              versions.append(match.group(1))
              required_counts = {
                  'id="placement-state-duty"': 1,
                  'id="placement-failures"': 1,
                  'id="placement-harm-cases"': 1,
                  'class="placement-failure-grid"': 1,
                  'class="placement-harm-case-grid"': 1,
                  'class="placement-harm-card': 4,
                  'class="placement-data-grid"': 2,
                  'href="#placement-harm-cases"': 1,
              }
              for phrase, expected in required_counts.items():
                  count = text.count(phrase)
                  if count != expected:
                      raise SystemExit(f'{path}: {phrase} expected {expected}, found {count}')
          if len(set(versions)) != 1:
              raise SystemExit(f'Localized CSS versions differ: {versions}')
          Path('/tmp/out-of-home-css-version.txt').write_text(versions[0], encoding='utf-8')
          print(f'CSS_VERSION={versions[0]}')
          PY
          echo "CSS_VERSION=$(cat /tmp/out-of-home-css-version.txt)" >> "$GITHUB_ENV"

          css='hearing-records/prison-watch/kaikai-final-chapter/final-chapter.css'
          grep -q 'OUT-OF-HOME-CARE-FAILURES-20260829' "$css"
          grep -q '.placement-failure-grid' "$css"
          grep -q '.placement-harm-case-grid' "$css"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hearing-records/prison-watch/kaikai-final-chapter/index.html
          git add hearing-records/prison-watch/kaikai-final-chapter/zh-Hans/index.html
          git add hearing-records/prison-watch/kaikai-final-chapter/final-chapter.css
          git commit -m 'Expand Chapter 2 analysis of Taiwan out-of-home care failures'
          pushed=0
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              pushed=1
              break
            fi
            git pull --rebase origin main
          done
          test "$pushed" -eq 1

      - name: Wait for GitHub Pages to expose both localized sections
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p browser-validation/out-of-home-care
          urls=(
            'https://jerryzuhow77.github.io/child-advocacy-site/hearing-records/prison-watch/kaikai-final-chapter/'
            'https://jerryzuhow77.github.io/child-advocacy-site/hearing-records/prison-watch/kaikai-final-chapter/zh-Hans/'
          )
          css_url='https://jerryzuhow77.github.io/child-advocacy-site/hearing-records/prison-watch/kaikai-final-chapter/final-chapter.css'
          for attempt in $(seq 1 105); do
            ready=1
            for i in 0 1; do
              html="$(curl -fsSL --connect-timeout 15 --max-time 30 "${urls[$i]}?qa=${GITHUB_SHA}-${attempt}-${i}" || true)"
              grep -q 'id="placement-state-duty"' <<<"$html" || ready=0
              grep -q 'id="placement-failures"' <<<"$html" || ready=0
              grep -q 'id="placement-harm-cases"' <<<"$html" || ready=0
              grep -q 'href="#placement-harm-cases"' <<<"$html" || ready=0
              grep -q "final-chapter.css?v=${CSS_VERSION}" <<<"$html" || ready=0
            done
            css="$(curl -fsSL --connect-timeout 15 --max-time 30 "${css_url}?v=${CSS_VERSION}&qa=${GITHUB_SHA}-${attempt}" || true)"
            grep -q 'OUT-OF-HOME-CARE-FAILURES-20260829' <<<"$css" || ready=0
            if [[ "$ready" -eq 1 ]]; then
              echo 'Expanded out-of-home care section is public in both languages.'
              exit 0
            fi
            sleep 10
          done
          echo 'Timed out before the expanded out-of-home care section became public.' >&2
          exit 1

      - name: Install Playwright driver
        run: npm install --no-save playwright-core@1.55.0

      - name: Verify Traditional and Simplified desktop and mobile Chrome layouts
        run: node .github/scripts/verify-kaikai-out-of-home-care-20260829.mjs

      - name: Upload browser screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kaikai-out-of-home-care-browser-proof
          path: browser-validation/out-of-home-care
          retention-days: 14

      - name: Remove completed one-off tools
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main
          git rm -f .github/workflows/oneoff-kaikai-out-of-home-care-20260829.yml
          git rm -f .github/scripts/patch-kaikai-out-of-home-care-20260829.py
          git rm -f .github/scripts/verify-kaikai-out-of-home-care-20260829.mjs
          git commit -m 'Remove completed out-of-home care publication tools'
          pushed=0
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              pushed=1
              break
            fi
            git pull --rebase origin main
          done
          test "$pushed" -eq 1
