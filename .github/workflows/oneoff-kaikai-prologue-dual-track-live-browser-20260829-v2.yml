name: Kaikai prologue and dual-track live browser proof

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oneoff-kaikai-prologue-dual-track-live-browser-20260829-v2.yml'

permissions:
  contents: read

jobs:
  live-chrome-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Install Playwright driver
        run: npm install --no-save playwright-core@1.55.0

      - name: Verify public prologue and two-track playback
        run: |
          mkdir -p browser-proof
          node --input-type=module <<'JS'
          import { chromium } from 'playwright-core';
          import fs from 'node:fs';

          const out = 'browser-proof';
          const sites = {
            'zh-Hant': 'https://jerryzuhow77.github.io/child-advocacy-site/hearing-records/prison-watch/kaikai-final-chapter/',
            'zh-Hans': 'https://jerryzuhow77.github.io/child-advocacy-site/hearing-records/prison-watch/kaikai-final-chapter/zh-Hans/'
          };
          const viewports = {
            desktop: { width: 1440, height: 1000, isMobile: false },
            mobile: { width: 390, height: 844, isMobile: true }
          };
          const browser = await chromium.launch({
            headless: true,
            executablePath: '/usr/bin/google-chrome',
            args: ['--no-sandbox', '--disable-dev-shm-usage', '--autoplay-policy=no-user-gesture-required']
          });
          const results = [];

          const mediaSnapshot = async (page, selector) => page.locator(selector).evaluate((media) => ({
            tag: media.tagName,
            autoplay: media.autoplay,
            muted: media.muted,
            playsInline: media.playsInline,
            paused: media.paused,
            ended: media.ended,
            currentTime: Number(media.currentTime.toFixed(3)),
            duration: Number.isFinite(media.duration) ? Number(media.duration.toFixed(3)) : null,
            readyState: media.readyState,
            networkState: media.networkState,
            currentSrc: media.currentSrc,
            error: media.error ? { code: media.error.code, message: media.error.message || '' } : null,
            trackIndex: media.dataset.trackIndex ?? null,
            trackCount: media.dataset.trackCount ?? null,
            trackTitle: media.dataset.trackTitle ?? null,
            sources: [...media.querySelectorAll('source')].map((source) => ({ src: source.src, type: source.type }))
          }));

          const waitForMetadata = async (page, selector) => {
            await page.waitForFunction((sel) => {
              const media = document.querySelector(sel);
              return media && media.readyState >= 1 && Number.isFinite(media.duration) && media.duration > 0;
            }, selector, { timeout: 30000 });
          };

          const waitForProgress = async (page, selector, minimum = 0.08) => {
            const start = await page.locator(selector).evaluate((media) => media.currentTime);
            await page.waitForFunction(({ sel, startAt, min }) => {
              const media = document.querySelector(sel);
              return media && (media.currentTime >= startAt + min || media.ended);
            }, { sel: selector, startAt: start, min: minimum }, { timeout: 12000 });
          };

          const checkHead = async (request, url) => {
            try {
              const response = await request.fetch(url, { method: 'HEAD', timeout: 30000, failOnStatusCode: false });
              return {
                url,
                status: response.status(),
                contentType: response.headers()['content-type'] || '',
                contentLength: response.headers()['content-length'] || ''
              };
            } catch (error) {
              return { url, status: 0, error: String(error?.message || error) };
            }
          };

          for (const [language, url] of Object.entries(sites)) {
            for (const [viewportName, viewport] of Object.entries(viewports)) {
              const context = await browser.newContext({
                viewport: { width: viewport.width, height: viewport.height },
                locale: language === 'zh-Hant' ? 'zh-TW' : 'zh-CN',
                isMobile: viewport.isMobile,
                hasTouch: viewport.isMobile,
                deviceScaleFactor: viewport.isMobile ? 2 : 1
              });
              const page = await context.newPage();
              const result = {
                language,
                viewport: viewportName,
                dimensions: `${viewport.width}x${viewport.height}`,
                status: null,
                script: '',
                prologue: {},
                audio: {},
                layout: {},
                mediaHeads: [],
                pageErrors: [],
                sameOriginErrors: [],
                failures: []
              };
              results.push(result);

              await page.addInitScript(() => {
                window.__mediaEvents = [];
                window.__layoutShift = 0;
                const record = (event) => {
                  const media = event.target;
                  if (!(media instanceof HTMLMediaElement)) return;
                  window.__mediaEvents.push({
                    type: event.type,
                    tag: media.tagName,
                    id: media.id || '',
                    prologue: media.hasAttribute('data-prologue-video'),
                    currentTime: Number(media.currentTime.toFixed(3)),
                    src: media.currentSrc || media.src || '',
                    at: Date.now()
                  });
                };
                for (const type of ['loadstart', 'loadedmetadata', 'canplay', 'play', 'playing', 'pause', 'ended', 'error']) {
                  document.addEventListener(type, record, true);
                }
                try {
                  new PerformanceObserver((list) => {
                    for (const entry of list.getEntries()) {
                      if (!entry.hadRecentInput) window.__layoutShift += entry.value;
                    }
                  }).observe({ type: 'layout-shift', buffered: true });
                } catch (_) {}
              });

              page.on('pageerror', (error) => result.pageErrors.push(String(error)));
              page.on('response', (response) => {
                const parsed = new URL(response.url());
                if (parsed.hostname === 'jerryzuhow77.github.io' && response.status() >= 400) {
                  result.sameOriginErrors.push({ status: response.status(), url: response.url() });
                }
              });

              const fail = (message) => result.failures.push(message);

              try {
                const response = await page.goto(`${url}?media-proof=${Date.now()}-${language}-${viewportName}`, {
                  waitUntil: 'domcontentloaded',
                  timeout: 60000
                });
                result.status = response?.status() ?? null;
                if (result.status !== 200) fail(`page HTTP ${result.status}`);

                await page.waitForSelector('[data-prologue-video]', { timeout: 20000 });
                await page.waitForSelector('#chapterBgm', { timeout: 20000 });
                await page.waitForFunction(() => document.documentElement.classList.contains('js-ready'), undefined, { timeout: 12000 });
                result.script = await page.locator('script[src*="final-chapter.js"]').getAttribute('src') || '';
                if (!result.script.includes('final-chapter.js')) fail(`final-chapter script missing: ${result.script}`);

                await waitForMetadata(page, '[data-prologue-video]');
                await page.evaluate(async () => { await document.fonts.ready; });
                const stableBefore = await page.evaluate(() => {
                  const hero = document.querySelector('.hero')?.getBoundingClientRect();
                  const prologue = document.querySelector('#prologue-film')?.getBoundingClientRect();
                  return {
                    heroHeight: Math.round(hero?.height || 0),
                    prologueTop: Math.round(prologue?.top || 0),
                    prologueHeight: Math.round(prologue?.height || 0),
                    overflow: Math.max(document.documentElement.scrollWidth, document.body.scrollWidth) - innerWidth
                  };
                });

                const videoBefore = await mediaSnapshot(page, '[data-prologue-video]');
                await page.waitForFunction(() => (window.__mediaEvents || []).some((event) => event.prologue && (event.type === 'play' || event.type === 'playing')), undefined, { timeout: 12000 });
                await waitForProgress(page, '[data-prologue-video]', 0.08);
                const videoAfter = await mediaSnapshot(page, '[data-prologue-video]');
                const videoEvents = await page.evaluate(() => (window.__mediaEvents || []).filter((event) => event.prologue));
                result.prologue = { before: videoBefore, after: videoAfter, events: videoEvents };

                if (!videoBefore.autoplay) fail('prologue autoplay attribute/property is false');
                if (!videoBefore.muted) fail('prologue is not muted for autoplay');
                if (!videoBefore.playsInline) fail('prologue playsInline is false');
                if (videoBefore.error || videoAfter.error) fail(`prologue media error ${JSON.stringify(videoBefore.error || videoAfter.error)}`);
                if (!(videoAfter.currentTime > videoBefore.currentTime || videoAfter.ended)) fail('prologue currentTime did not advance');
                if (!(videoAfter.duration >= 3 && videoAfter.duration <= 10)) fail(`unexpected prologue duration ${videoAfter.duration}`);
                if (!videoEvents.some((event) => event.type === 'play' || event.type === 'playing')) fail('prologue emitted no autoplay event');

                const prologueUrls = [...new Set([videoAfter.currentSrc, ...videoAfter.sources.map((source) => source.src)].filter(Boolean))];
                for (const mediaUrl of prologueUrls) result.mediaHeads.push(await checkHead(context.request, mediaUrl));

                await waitForMetadata(page, '#chapterBgm');
                const firstReady = await mediaSnapshot(page, '#chapterBgm');
                const toggle = page.locator('.audio-toggle');
                const countText = await page.locator('[data-audio-time]').textContent();
                result.audio.initial = { media: firstReady, countText, buttonText: await toggle.textContent() };
                if (firstReady.trackCount !== '2') fail(`audio trackCount is ${firstReady.trackCount}`);
                if (firstReady.trackIndex !== '0') fail(`initial trackIndex is ${firstReady.trackIndex}`);
                if (!firstReady.trackTitle || !/歲月深處的告白|岁月深处的告白/.test(firstReady.trackTitle)) fail(`unexpected first title ${firstReady.trackTitle}`);
                if (!String(countText).includes('1/2')) fail(`initial counter missing 1/2: ${countText}`);

                await toggle.click();
                await page.waitForFunction(() => {
                  const audio = document.querySelector('#chapterBgm');
                  return audio && !audio.paused && audio.currentTime > 0.03;
                }, undefined, { timeout: 12000 });
                await waitForProgress(page, '#chapterBgm', 0.08);
                const firstPlaying = await mediaSnapshot(page, '#chapterBgm');
                if (firstPlaying.error || firstPlaying.paused) fail(`first track failed to play: ${JSON.stringify(firstPlaying.error)}`);

                await page.locator('#chapterBgm').evaluate((audio) => {
                  audio.currentTime = Math.max(0, audio.duration - 0.08);
                });
                await page.waitForFunction(() => document.querySelector('#chapterBgm')?.dataset.trackIndex === '1', undefined, { timeout: 15000 });
                await waitForMetadata(page, '#chapterBgm');
                await page.waitForFunction(() => {
                  const audio = document.querySelector('#chapterBgm');
                  return audio && audio.dataset.trackIndex === '1' && !audio.paused && audio.currentTime > 0.02;
                }, undefined, { timeout: 15000 });
                await waitForProgress(page, '#chapterBgm', 0.08);
                const secondPlaying = await mediaSnapshot(page, '#chapterBgm');
                const secondCounter = await page.locator('[data-audio-time]').textContent();
                result.audio.second = { media: secondPlaying, countText: secondCounter, buttonText: await toggle.textContent() };
                if (secondPlaying.error || secondPlaying.paused) fail(`second track failed to play: ${JSON.stringify(secondPlaying.error)}`);
                if (secondPlaying.trackIndex !== '1') fail(`second trackIndex is ${secondPlaying.trackIndex}`);
                if (secondPlaying.trackTitle !== '退潮的街') fail(`unexpected second title ${secondPlaying.trackTitle}`);
                if (!secondPlaying.sources.some((source) => source.src.includes('kaikai-chapter2-bgm-02-20260829'))) fail('second-track source filename missing');
                if (!String(secondCounter).includes('2/2')) fail(`second counter missing 2/2: ${secondCounter}`);

                const allAudioUrls = await page.evaluate(() => {
                  const directory = new URL('../../../assets/audio/', document.baseURI);
                  return [
                    new URL('kaikai-chapter2-bgm-20260828.webm', directory).href,
                    new URL('kaikai-chapter2-bgm-20260828.m4a', directory).href,
                    new URL('kaikai-chapter2-bgm-02-20260829.webm', directory).href,
                    new URL('kaikai-chapter2-bgm-02-20260829.m4a', directory).href
                  ];
                });
                for (const mediaUrl of allAudioUrls) result.mediaHeads.push(await checkHead(context.request, mediaUrl));

                await page.locator('#chapterBgm').evaluate((audio) => {
                  audio.currentTime = Math.max(0, audio.duration - 0.08);
                });
                await page.waitForFunction(() => document.querySelector('#chapterBgm')?.dataset.trackIndex === '0', undefined, { timeout: 15000 });
                await waitForMetadata(page, '#chapterBgm');
                await page.waitForFunction(() => {
                  const audio = document.querySelector('#chapterBgm');
                  return audio && audio.dataset.trackIndex === '0' && !audio.paused && audio.currentTime > 0.02;
                }, undefined, { timeout: 15000 });
                const wrapped = await mediaSnapshot(page, '#chapterBgm');
                const wrappedCounter = await page.locator('[data-audio-time]').textContent();
                result.audio.wrapped = { media: wrapped, countText: wrappedCounter };
                if (wrapped.trackIndex !== '0' || wrapped.paused) fail('second track did not wrap back to a playing first track');
                if (!String(wrappedCounter).includes('1/2')) fail(`wrapped counter missing 1/2: ${wrappedCounter}`);

                const badHeads = result.mediaHeads.filter((item) => ![200, 206].includes(item.status));
                if (badHeads.length) fail(`media HEAD failures: ${JSON.stringify(badHeads)}`);

                if (viewport.isMobile) {
                  await page.evaluate(() => window.scrollTo(0, 520));
                  await page.waitForTimeout(450);
                  const collapsed = await page.locator('[data-audio-controller]').evaluate((controller) => ({
                    classCollapsed: controller.classList.contains('is-collapsed'),
                    expanded: controller.querySelector('[data-audio-collapse]')?.getAttribute('aria-expanded')
                  }));
                  result.audio.mobileCollapsed = collapsed;
                  if (!collapsed.classCollapsed || collapsed.expanded !== 'false') fail(`mobile audio did not auto-collapse: ${JSON.stringify(collapsed)}`);
                  await page.locator('[data-audio-collapse]').click();
                  await page.waitForTimeout(150);
                  const reopened = await page.locator('[data-audio-controller]').evaluate((controller) => ({
                    classCollapsed: controller.classList.contains('is-collapsed'),
                    expanded: controller.querySelector('[data-audio-collapse]')?.getAttribute('aria-expanded')
                  }));
                  result.audio.mobileReopened = reopened;
                  if (reopened.classCollapsed || reopened.expanded !== 'true') fail(`mobile audio did not reopen: ${JSON.stringify(reopened)}`);
                  await page.evaluate(() => window.scrollTo(0, 0));
                }

                await page.waitForTimeout(5500);
                const stableAfter = await page.evaluate(() => {
                  const hero = document.querySelector('.hero')?.getBoundingClientRect();
                  const prologue = document.querySelector('#prologue-film')?.getBoundingClientRect();
                  return {
                    heroHeight: Math.round(hero?.height || 0),
                    prologueTop: Math.round(prologue?.top || 0),
                    prologueHeight: Math.round(prologue?.height || 0),
                    overflow: Math.max(document.documentElement.scrollWidth, document.body.scrollWidth) - innerWidth,
                    cls: Number((window.__layoutShift || 0).toFixed(4))
                  };
                });
                result.layout = {
                  before: stableBefore,
                  after: stableAfter,
                  heroHeightDelta: Math.abs(stableAfter.heroHeight - stableBefore.heroHeight),
                  prologueTopDelta: Math.abs(stableAfter.prologueTop - stableBefore.prologueTop),
                  prologueHeightDelta: Math.abs(stableAfter.prologueHeight - stableBefore.prologueHeight)
                };
                if (Math.max(stableBefore.overflow, stableAfter.overflow) > 2) fail(`horizontal overflow ${Math.max(stableBefore.overflow, stableAfter.overflow)}px`);
                if (result.layout.heroHeightDelta > 24 || result.layout.prologueTopDelta > 24 || result.layout.prologueHeightDelta > 24) {
                  fail(`post-load media layout shift ${JSON.stringify(result.layout)}`);
                }
                if (stableAfter.cls > 0.6) fail(`severe cumulative layout shift ${stableAfter.cls}`);

                const allMediaEvents = await page.evaluate(() => window.__mediaEvents || []);
                result.mediaEvents = allMediaEvents;
                const mediaErrorEvents = allMediaEvents.filter((event) => event.type === 'error');
                if (mediaErrorEvents.length) fail(`media error events: ${JSON.stringify(mediaErrorEvents)}`);
                if (result.pageErrors.length) fail(`${result.pageErrors.length} page error(s)`);
                if (result.sameOriginErrors.length) fail(`${result.sameOriginErrors.length} same-origin HTTP error(s)`);

                await page.screenshot({ path: `${out}/${language}_${viewportName}_track2.png`, fullPage: false });
              } catch (error) {
                fail(`exception: ${error?.message || error}`);
                result.exception = String(error?.stack || error);
                await page.screenshot({ path: `${out}/${language}_${viewportName}_exception.png`, fullPage: false }).catch(() => {});
              }

              await context.close();
            }
          }

          await browser.close();
          const report = { generatedAt: new Date().toISOString(), results };
          fs.writeFileSync(`${out}/report.json`, JSON.stringify(report, null, 2));
          const lines = ['# Kaikai prologue and dual-track live browser proof', ''];
          for (const result of results) {
            lines.push(`## ${result.language} · ${result.viewport} (${result.dimensions})`);
            lines.push(`- Page HTTP: ${result.status}; script: ${result.script || 'missing'}`);
            lines.push(`- Prologue: duration=${result.prologue.after?.duration ?? 'n/a'}s, autoplay=${result.prologue.before?.autoplay ?? 'n/a'}, muted=${result.prologue.before?.muted ?? 'n/a'}, advanced=${(result.prologue.after?.currentTime ?? 0) > (result.prologue.before?.currentTime ?? 0) || Boolean(result.prologue.after?.ended)}`);
            lines.push(`- Track 1: ${result.audio.initial?.media?.trackTitle || 'n/a'}; playing=${result.audio.second ? true : false}`);
            lines.push(`- Track 2: ${result.audio.second?.media?.trackTitle || 'n/a'}; index=${result.audio.second?.media?.trackIndex ?? 'n/a'}; counter=${result.audio.second?.countText || 'n/a'}`);
            lines.push(`- Wrap 2→1: index=${result.audio.wrapped?.media?.trackIndex ?? 'n/a'}; playing=${result.audio.wrapped?.media ? !result.audio.wrapped.media.paused : false}`);
            if (result.audio.mobileCollapsed) lines.push(`- Mobile controller: collapsed=${result.audio.mobileCollapsed.classCollapsed}, reopened=${!result.audio.mobileReopened?.classCollapsed}`);
            lines.push(`- Media URLs: ${result.mediaHeads.length}; bad=${result.mediaHeads.filter((item) => ![200, 206].includes(item.status)).length}`);
            lines.push(`- Overflow: ${Math.max(result.layout.before?.overflow || 0, result.layout.after?.overflow || 0)}px; CLS=${result.layout.after?.cls ?? 'n/a'}`);
            lines.push(`- Page errors: ${result.pageErrors.length}; same-origin HTTP errors: ${result.sameOriginErrors.length}`);
            lines.push(`- Failures: ${result.failures.length ? result.failures.join(' | ') : 'none'}`);
            lines.push('');
          }
          const fatal = results.reduce((sum, result) => sum + result.failures.length, 0);
          lines.push(`**Total failures: ${fatal}**`);
          fs.writeFileSync(`${out}/summary.md`, lines.join('\n'));
          console.log(lines.join('\n'));
          if (fatal) process.exit(1);
          JS

      - name: Upload browser proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kaikai-prologue-dual-track-live-browser-proof
          path: browser-proof
          retention-days: 14
