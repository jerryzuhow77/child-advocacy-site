name: Verify Chen mobile browser proof v3

on:
  push:
    branches:
      - 'verify/chen-mobile-browser-20260830'
    paths:
      - '.github/workflows/verify-chen-mobile-browser-20260830-v3.yml'

permissions:
  contents: read

jobs:
  browser-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install Playwright driver
        run: npm install --no-save playwright-core@1.55.0

      - name: Render and verify the live pages
        run: |
          mkdir -p browser-proof-v3
          node --input-type=module <<'JS'
          import { chromium } from 'playwright-core';
          import fs from 'node:fs';

          const sites = {
            'zh-Hans': 'https://jerryzuhow77.github.io/child-advocacy-site/hearing-records/prison-watch/kaikai-final-chapter/zh-Hans/',
            'zh-Hant': 'https://jerryzuhow77.github.io/child-advocacy-site/hearing-records/prison-watch/kaikai-final-chapter/'
          };
          const viewports = {
            desktop: { width: 1440, height: 1000 },
            mobile360: { width: 360, height: 800 },
            mobile390: { width: 390, height: 844 },
            mobile412: { width: 412, height: 915 }
          };
          const out = 'browser-proof-v3';

          const parseColor = (value) => {
            const m = value?.match(/rgba?\((\d+)[, ]+(\d+)[, ]+(\d+)(?:[, /]+([\d.]+))?\)/);
            return m ? { r:+m[1], g:+m[2], b:+m[3], a:m[4] == null ? 1 : +m[4] } : null;
          };
          const lum = ({r,g,b}) => {
            const c = [r,g,b].map(v => {
              const s = v / 255;
              return s <= .03928 ? s / 12.92 : ((s + .055) / 1.055) ** 2.4;
            });
            return .2126*c[0] + .7152*c[1] + .0722*c[2];
          };
          const contrast = (fgValue, bgValue) => {
            const fg = parseColor(fgValue), bg = parseColor(bgValue);
            if (!fg || !bg || fg.a < .99) return null;
            // For a translucent light panel, black is a conservative backing;
            // the real maroon/paper backing is brighter than this result.
            const flatBg = { r:bg.r*bg.a, g:bg.g*bg.a, b:bg.b*bg.a };
            const a = lum(fg), b = lum(flatBg);
            return (Math.max(a,b)+.05)/(Math.min(a,b)+.05);
          };

          const browser = await chromium.launch({
            headless: true,
            executablePath: '/usr/bin/google-chrome',
            args: ['--no-sandbox','--disable-dev-shm-usage']
          });
          const results = [];

          for (const [locale, base] of Object.entries(sites)) {
            for (const [viewportName, viewport] of Object.entries(viewports)) {
              const context = await browser.newContext({ viewport, locale: locale === 'zh-Hans' ? 'zh-CN' : 'zh-TW' });
              const page = await context.newPage();
              const result = { locale, viewportName, viewport, status:null, overflow:null, widths:{}, colors:{}, contrast:{}, legal:{}, pageErrors:[], httpErrors:[], failures:[] };
              results.push(result);
              page.on('pageerror', e => result.pageErrors.push(String(e)));
              page.on('response', r => {
                try {
                  const u = new URL(r.url());
                  if (u.hostname === 'jerryzuhow77.github.io' && r.status() >= 400) result.httpErrors.push({status:r.status(),url:r.url()});
                } catch {}
              });

              try {
                const response = await page.goto(`${base}?proof-v3=${Date.now()}-${viewportName}#chen-226-full`, {waitUntil:'domcontentloaded',timeout:60000});
                result.status = response?.status() ?? null;
                await page.waitForTimeout(1600);
                await page.evaluate(() => {
                  document.body.classList.remove('prologue-active');
                  document.querySelector('[data-entry-prologue]')?.setAttribute('hidden','');
                  for (const id of ['chen-223-full','chen-226-full']) {
                    const el = document.getElementById(id);
                    if (el) el.open = true;
                  }
                });

                const metrics = await page.evaluate(() => {
                  const info = sel => {
                    const el = document.querySelector(sel);
                    if (!el) return null;
                    const r = el.getBoundingClientRect(), s = getComputedStyle(el);
                    return { width:r.width, color:s.color, background:s.backgroundColor, fontSize:s.fontSize, lineHeight:s.lineHeight };
                  };
                  const judgmentText = document.querySelector('#chen-judgment-accountability')?.textContent || '';
                  return {
                    viewportWidth: innerWidth,
                    overflow: Math.max(document.documentElement.scrollWidth,document.body.scrollWidth)-innerWidth,
                    t223:info('#chen-223-full'),
                    t226:info('#chen-226-full'),
                    turn:info('#chen-226-full .transcript-turn'),
                    warning:info('#chen-226-full .transcript-disclaimer.warning'),
                    warningText:info('#chen-226-full .transcript-disclaimer.warning p'),
                    boundary:info('#chen-final-statement-20260226 > .record-boundary'),
                    boundaryText:info('#chen-final-statement-20260226 > .record-boundary p'),
                    finalText:info('#chen-final-statement-20260226 .final-statement-record > section > div p'),
                    summaryNote:info('#chen-226-full > summary small'),
                    legal:{
                      t223:document.querySelectorAll('#chen-223-full').length,
                      t226:document.querySelectorAll('#chen-226-full').length,
                      judgment:document.querySelectorAll('#chen-judgment-accountability').length,
                      guarantor:/保證人地位|保证人地位/.test(judgmentText),
                      individual:/個案|个案/.test(judgmentText),
                      firstInstance:/一審|一审|臺北地院|台北地院/.test(judgmentText),
                      replacementGlyphs:((document.documentElement.textContent||'').match(/\uFFFD/g)||[]).length
                    }
                  };
                });

                result.overflow = Math.round(metrics.overflow*100)/100;
                result.widths = {
                  t223:metrics.t223?.width/metrics.viewportWidth,
                  t226:metrics.t226?.width/metrics.viewportWidth,
                  turn:metrics.turn?.width/metrics.viewportWidth
                };
                result.colors = {
                  finalText:metrics.finalText?.color,
                  summaryNote:metrics.summaryNote?.color,
                  warningText:metrics.warningText?.color,
                  warningBackground:metrics.warning?.background,
                  boundaryText:metrics.boundaryText?.color,
                  boundaryBackground:metrics.boundary?.background
                };
                result.contrast.warning = contrast(metrics.warningText?.color,metrics.warning?.background);
                result.contrast.boundary = contrast(metrics.boundaryText?.color,metrics.boundary?.background);
                result.legal = metrics.legal;

                if (result.status !== 200) result.failures.push(`HTTP ${result.status}`);
                if (result.overflow > 2) result.failures.push(`overflow ${result.overflow}px`);
                if (metrics.legal.t223 !== 1 || metrics.legal.t226 !== 1 || metrics.legal.judgment !== 1) result.failures.push('required section count');
                if (!metrics.legal.guarantor || !metrics.legal.individual || !metrics.legal.firstInstance) result.failures.push('legal label incomplete');
                if (metrics.legal.replacementGlyphs) result.failures.push(`replacement glyphs ${metrics.legal.replacementGlyphs}`);
                if (result.pageErrors.length) result.failures.push(`${result.pageErrors.length} page error(s)`);
                if (result.httpErrors.length) result.failures.push(`${result.httpErrors.length} same-origin HTTP error(s)`);
                if (result.colors.finalText !== 'rgb(255, 248, 238)') result.failures.push(`final text ${result.colors.finalText}`);
                if (result.colors.summaryNote !== 'rgb(255, 232, 189)') result.failures.push(`summary note ${result.colors.summaryNote}`);
                if ((result.contrast.warning ?? 0) < 4.5) result.failures.push(`warning contrast ${(result.contrast.warning??0).toFixed(2)}`);
                if ((result.contrast.boundary ?? 0) < 4.5) result.failures.push(`boundary contrast ${(result.contrast.boundary??0).toFixed(2)}`);
                if (viewport.width <= 640) {
                  if ((result.widths.t223??0) < .86) result.failures.push(`223 width ${(result.widths.t223??0).toFixed(3)}`);
                  if ((result.widths.t226??0) < .86) result.failures.push(`226 width ${(result.widths.t226??0).toFixed(3)}`);
                  if ((result.widths.turn??0) < .80) result.failures.push(`dialogue width ${(result.widths.turn??0).toFixed(3)}`);
                }

                if (viewportName === 'desktop' || viewportName === 'mobile390') {
                  for (const [name,sel] of [
                    ['chen-223','#chen-223-full'],
                    ['chen-226','#chen-226-full'],
                    ['final-statement','#chen-final-statement-20260226 .final-statement-record'],
                    ['guarantor','#chen-judgment-accountability > .nonfinal-banner']
                  ]) {
                    const target = page.locator(sel);
                    await target.scrollIntoViewIfNeeded();
                    await page.waitForTimeout(150);
                    await target.screenshot({path:`${out}/${locale}_${viewportName}_${name}.png`});
                  }
                }
              } catch (e) {
                result.failures.push(`exception: ${e?.message||e}`);
                result.exception = String(e?.stack||e);
              }
              await context.close();
            }
          }

          await browser.close();
          const lines = ['# Live browser proof v3',''];
          for (const r of results) {
            lines.push(`## ${r.locale} · ${r.viewportName} (${r.viewport.width}×${r.viewport.height})`);
            lines.push(`- HTTP ${r.status}; overflow ${r.overflow}px`);
            lines.push(`- Widths: 223=${r.widths.t223?.toFixed(3)}, 226=${r.widths.t226?.toFixed(3)}, dialogue=${r.widths.turn?.toFixed(3)}`);
            lines.push(`- Contrast: warning=${r.contrast.warning?.toFixed(2)}, boundary=${r.contrast.boundary?.toFixed(2)}`);
            lines.push(`- Colors: final=${r.colors.finalText}; summary=${r.colors.summaryNote}`);
            lines.push(`- Legal: guarantor=${r.legal.guarantor}, individual=${r.legal.individual}, first-instance=${r.legal.firstInstance}`);
            lines.push(`- Errors: page=${r.pageErrors.length}, HTTP=${r.httpErrors.length}`);
            lines.push(`- Result: ${r.failures.length ? 'FAIL — '+r.failures.join(' | ') : 'PASS'}`,'');
          }
          const failureCount = results.reduce((n,r)=>n+r.failures.length,0);
          lines.push(`**Total failures: ${failureCount}**`);
          fs.writeFileSync(`${out}/report.json`,JSON.stringify({generatedAt:new Date().toISOString(),results},null,2));
          fs.writeFileSync(`${out}/summary.md`,lines.join('\n'));
          console.log(lines.join('\n'));
          if (failureCount) process.exit(1);
          JS

      - name: Upload browser proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chen-mobile-browser-proof-20260830-v3
          path: browser-proof-v3
          retention-days: 14
