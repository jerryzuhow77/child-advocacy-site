name: Page view counter smoke test

on:
  workflow_dispatch:
  schedule:
    # Daily at 06:23 Asia/Taipei (GitHub Actions cron uses UTC).
    - cron: '23 22 * * *'
  push:
    paths:
      - '.github/workflows/page-view-counter-smoke.yml'
      - 'cloudflare/page-view-counter/**'
      - 'assets/site.js'
      - 'assets/mobile-nav-view-counter-20260823.js'
      - 'assets/four-language-toolbar-20260901.js'
      - '.github/scripts/audit-page-view-coverage.py'

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Verify homepage and every public article load a counter
        run: python3 .github/scripts/audit-page-view-coverage.py

      - name: Check Worker health endpoint
        env:
          ENDPOINT: https://sweet-art-bed8child-advocacy-page-views.jerryzuhow77.workers.dev
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 3 "$ENDPOINT/health")"
          printf '%s\n' "$response"
          RESPONSE="$response" python3 - <<'PY'
          import json
          import os

          data = json.loads(os.environ['RESPONSE'])
          assert data.get('ok') is True, data
          assert data.get('service') == 'child-advocacy-page-views', data
          assert data.get('binding') == 'PAGE_VIEWS', data
          print('Cloudflare Worker health check passed.')
          PY

      - name: Read homepage count without incrementing it
        env:
          ENDPOINT: https://sweet-art-bed8child-advocacy-page-views.jerryzuhow77.workers.dev/views
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 3 "$ENDPOINT?page=homepage-all-languages-v1&increment=0")"
          printf '%s\n' "$response"
          RESPONSE="$response" python3 - <<'PY'
          import json
          import os

          data = json.loads(os.environ['RESPONSE'])
          assert data.get('ok') is True, data
          assert data.get('key') == 'homepage-all-languages-v1', data
          assert data.get('incremented') is False, data
          assert isinstance(data.get('count'), int) and data['count'] >= 0, data
          print(f"Homepage counter read-only check passed: {data['count']:,} views.")
          PY
