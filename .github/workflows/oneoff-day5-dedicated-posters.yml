name: Publish Day 5 dedicated medical posters

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/day5-posters-trigger.txt'

permissions:
  contents: write

concurrency:
  group: oneoff-day5-dedicated-posters
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'trigger-day5-posters-20260822'
    runs-on: ubuntu-latest
    steps:
      - name: Check out current production branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Install renderers
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends librsvg2-bin webp fonts-noto-cjk

      - name: Generate and publish four dedicated poster assets
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin main
          python -m py_compile .github/scripts/generate_day5_poster_assets.py .github/scripts/publish_day5_poster_assets.py
          python .github/scripts/generate_day5_poster_assets.py

          mkdir -p assets/art
          render() {
            local svg="$1"
            local output="$2"
            local png="/tmp/$(basename "${output%.webp}").png"
            rsvg-convert --width 1024 --height 1536 --keep-aspect-ratio "$svg" --output "$png"
            cwebp -quiet -q 88 -m 6 "$png" -o "$output"
            test "$(stat -c %s "$output")" -gt 50000
          }

          render /tmp/day5-poster-svg/day5-forensic-hant.svg assets/art/prison-watch-day5-forensic-zh-hant-20260822.webp
          render /tmp/day5-poster-svg/day5-forensic-hans.svg assets/art/prison-watch-day5-forensic-zh-hans-20260822.webp
          render /tmp/day5-poster-svg/day5-medical-hant.svg assets/art/prison-watch-day5-medical-zh-hant-20260822.webp
          render /tmp/day5-poster-svg/day5-medical-hans.svg assets/art/prison-watch-day5-medical-zh-hans-20260822.webp

          python .github/scripts/publish_day5_poster_assets.py
          node --check hearing-records/prison-watch/kaikai-day5-20250429/day5.js
          git diff --check

      - name: Commit and remove one-off machinery
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/day5-posters-trigger.txt
          rm -f .github/scripts/generate_day5_poster_assets.py
          rm -f .github/scripts/publish_day5_poster_assets.py
          rm -f .github/workflows/oneoff-day5-dedicated-posters.yml

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && { echo 'No poster changes were produced.'; exit 1; }
          git commit -m 'Add Day 5 dedicated forensic and medical posters'
          git pull --rebase origin main
          git push origin main
