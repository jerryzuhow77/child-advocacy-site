name: Verify Kaikai Chapter 2 entry media on production

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/oneoff-verify-kaikai-entry-audio-live-20260829.yml'

permissions:
  contents: write

concurrency:
  group: oneoff-verify-kaikai-entry-audio-live-20260829
  cancel-in-progress: false

jobs:
  verify-live:
    runs-on: ubuntu-latest
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wait for corrected production assets
        shell: bash
        run: |
          set -euo pipefail
          root='https://jerryzuhow77.github.io/child-advocacy-site/hearing-records/prison-watch/kaikai-final-chapter/'
          ready=0
          for attempt in $(seq 1 60); do
            stamp="${GITHUB_RUN_ID}-${attempt}"
            curl -fsSL --retry 2 -H 'Cache-Control: no-cache' "${root}?verify=${stamp}" -o /tmp/hant.html || true
            curl -fsSL --retry 2 -H 'Cache-Control: no-cache' "${root}zh-Hans/?verify=${stamp}" -o /tmp/hans.html || true
            if grep -q 'final-chapter.css?v=20260829-36' /tmp/hant.html 2>/dev/null \
              && grep -q 'final-chapter.css?v=20260829-36' /tmp/hans.html 2>/dev/null; then
              ready=1
              break
            fi
            sleep 5
          done
          test "$ready" -eq 1

      - name: Install Chromium automation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/kaikai-live-verify
          cd /tmp/kaikai-live-verify
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.55.0
          npx playwright install --with-deps chromium >/dev/null

      - name: Run production browser matrix
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/kaikai-live-evidence
          cat > /tmp/kaikai-live-verify/verify.mjs <<'NODE'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          import path from 'node:path';

          const root = 'https://jerryzuhow77.github.io/child-advocacy-site/hearing-records/prison-watch/kaikai-final-chapter/';
          const outDir = '/tmp/kaikai-live-evidence';
          const cases = [
            { name: 'zh-Hant-desktop', url: root, width: 1440, height: 1000, mobile: false, exit: 'skip' },
            { name: 'zh-Hant-mobile', url: root, width: 390, height: 844, mobile: true, exit: 'ended' },
            { name: 'zh-Hans-desktop', url: `${root}zh-Hans/`, width: 1440, height: 1000, mobile: false, exit: 'ended' },
            { name: 'zh-Hans-mobile', url: `${root}zh-Hans/`, width: 390, height: 844, mobile: true, exit: 'skip' }
          ];
          const assert = (value, message) => {
            if (!value) throw new Error(message);
          };

          const browser = await chromium.launch({ headless: true });
          const results = [];

          for (const testCase of cases) {
            const context = await browser.newContext({
              viewport: { width: testCase.width, height: testCase.height },
              isMobile: testCase.mobile,
              hasTouch: testCase.mobile,
              deviceScaleFactor: testCase.mobile ? 2 : 1,
              locale: testCase.name.includes('Hans') ? 'zh-CN' : 'zh-TW'
            });
            const page = await context.newPage();
            const pageErrors = [];
            const failedRequests = [];
            const mediaResponses = [];
            page.on('pageerror', error => pageErrors.push(error.message));
            page.on('requestfailed', request => failedRequests.push({
              url: request.url(),
              error: request.failure()?.errorText || ''
            }));
            page.on('response', response => {
              if (/kaikai-final-chapter-prologue|kaikai-chapter2-bgm/i.test(response.url())) {
                mediaResponses.push({ status: response.status(), url: response.url() });
              }
            });

            const response = await page.goto(`${testCase.url}?live-browser=${Date.now()}-${testCase.name}`, {
              waitUntil: 'domcontentloaded',
              timeout: 60000
            });
            assert(response?.status() === 200, `${testCase.name}: document HTTP ${response?.status()}`);
            const overlay = page.locator('[data-entry-prologue]');
            await overlay.waitFor({ state: 'visible', timeout: 15000 });

            const firstScreen = await page.evaluate(() => {
              const layer = document.querySelector('[data-entry-prologue]');
              const video = layer?.querySelector('[data-prologue-video]');
              const play = layer?.querySelector('[data-prologue-play]');
              const skip = layer?.querySelector('[data-prologue-skip]');
              const audio = document.querySelector('#chapterBgm');
              const main = document.querySelector('#main');
              const rect = layer?.getBoundingClientRect();
              const playRect = play?.getBoundingClientRect();
              const style = layer ? getComputedStyle(layer) : null;
              const playStyle = play ? getComputedStyle(play) : null;
              const center = document.elementFromPoint(innerWidth / 2, innerHeight / 2);
              const cssHref = [...document.querySelectorAll('link[rel="stylesheet"]')]
                .map(link => link.href).find(href => href.includes('final-chapter.css')) || '';
              return {
                cssHref,
                beforeMain: Boolean(layer && main && (layer.compareDocumentPosition(main) & Node.DOCUMENT_POSITION_FOLLOWING)),
                bodyLocked: document.body.classList.contains('prologue-active'),
                centerCovered: Boolean(layer && center && layer.contains(center)),
                position: style?.position || '',
                zIndex: Number.parseInt(style?.zIndex || '0', 10),
                rect: rect ? { x: rect.x, y: rect.y, width: rect.width, height: rect.height } : null,
                skipVisible: Boolean(skip && skip.getBoundingClientRect().width > 0),
                playPrompt: play ? {
                  hidden: play.hidden,
                  display: playStyle.display,
                  width: playRect.width,
                  height: playRect.height
                } : null,
                video: video ? {
                  autoplay: video.autoplay,
                  muted: video.muted,
                  playsInline: video.playsInline
                } : null,
                audioPaused: audio?.paused ?? null,
                audioTime: audio?.currentTime ?? null,
                trackCount: audio?.dataset.trackCount || '',
                overflowX: document.documentElement.scrollWidth - innerWidth
              };
            });

            assert(firstScreen.cssHref.includes('v=20260829-36'), `${testCase.name}: corrected CSS is not live`);
            assert(firstScreen.beforeMain, `${testCase.name}: prologue is after article content`);
            assert(firstScreen.bodyLocked && firstScreen.centerCovered, `${testCase.name}: prologue does not own first screen`);
            assert(firstScreen.position === 'fixed' && firstScreen.zIndex >= 1000000, `${testCase.name}: prologue is not viewport-fixed`);
            assert(firstScreen.rect && Math.abs(firstScreen.rect.x) <= 1 && Math.abs(firstScreen.rect.y) <= 1, `${testCase.name}: prologue origin is wrong`);
            assert(firstScreen.rect.width >= testCase.width - 1 && firstScreen.rect.height >= testCase.height - 1, `${testCase.name}: prologue does not cover viewport`);
            assert(firstScreen.skipVisible, `${testCase.name}: skip control is hidden`);
            assert(firstScreen.playPrompt?.hidden && firstScreen.playPrompt.display === 'none' && firstScreen.playPrompt.width === 0, `${testCase.name}: fallback play prompt overlays successful autoplay`);
            assert(firstScreen.video?.autoplay && firstScreen.video?.muted && firstScreen.video?.playsInline, `${testCase.name}: muted autoplay attributes are incomplete`);
            assert(firstScreen.audioPaused === true && firstScreen.audioTime === 0, `${testCase.name}: background audio started before a gesture`);
            assert(firstScreen.trackCount === '2', `${testCase.name}: two-track playlist is missing`);
            assert(firstScreen.overflowX <= 1, `${testCase.name}: horizontal overflow ${firstScreen.overflowX}px`);

            await page.waitForFunction(() => {
              const video = document.querySelector('[data-prologue-video]');
              return Boolean(video?.error) || (video?.currentTime || 0) > 0.1;
            }, null, { timeout: 30000 });
            const videoPlayback = await page.evaluate(() => {
              const video = document.querySelector('[data-prologue-video]');
              return {
                currentTime: video.currentTime,
                duration: video.duration,
                paused: video.paused,
                currentSrc: video.currentSrc,
                error: video.error ? { code: video.error.code, message: video.error.message } : null
              };
            });
            assert(!videoPlayback.error && !videoPlayback.paused && videoPlayback.currentTime > 0.1, `${testCase.name}: muted prologue did not autoplay`);
            await page.screenshot({ path: path.join(outDir, `${testCase.name}-prologue.png`) });

            if (testCase.exit === 'skip') {
              await page.locator('[data-prologue-skip]').click();
            }
            await page.waitForFunction(() => document.querySelector('[data-entry-prologue]')?.hidden === true, null, { timeout: 20000 });
            assert(await page.evaluate(() => !document.body.classList.contains('prologue-active')), `${testCase.name}: body remained locked`);

            const audioButton = page.locator('[data-audio-controller] button')
              .filter({ hasText: /播放配樂|播放配乐|暫停配樂|暂停配乐/ }).first();
            assert(await audioButton.count() === 1 && await audioButton.isVisible(), `${testCase.name}: background-music button is unavailable`);
            const audioInitiallyPaused = await page.evaluate(() => document.querySelector('#chapterBgm')?.paused ?? true);
            const activationMode = audioInitiallyPaused ? 'play-button' : `${testCase.exit}-exit`;
            if (audioInitiallyPaused) await audioButton.click();
            await page.waitForFunction(() => {
              const audio = document.querySelector('#chapterBgm');
              return audio && !audio.paused && audio.currentTime > 0.12;
            }, null, { timeout: 30000 });

            const readTrack = () => page.evaluate(() => {
              const audio = document.querySelector('#chapterBgm');
              const controller = document.querySelector('[data-audio-controller]');
              return {
                currentSrc: audio.currentSrc,
                currentTime: audio.currentTime,
                duration: audio.duration,
                paused: audio.paused,
                text: (controller?.textContent || '').replace(/\s+/g, ' ').trim()
              };
            });
            const firstTrack = await readTrack();
            assert(/1\/2/.test(firstTrack.text), `${testCase.name}: controller does not show 1/2`);

            const finishCurrentTrack = async () => {
              await page.waitForFunction(() => {
                const audio = document.querySelector('#chapterBgm');
                return Number.isFinite(audio?.duration) && audio.duration > 1;
              }, null, { timeout: 30000 });
              await page.evaluate(() => {
                const audio = document.querySelector('#chapterBgm');
                audio.currentTime = Math.max(0, audio.duration - 0.3);
              });
            };

            await finishCurrentTrack();
            await page.waitForFunction(() => /2\/2/.test(document.querySelector('[data-audio-controller]')?.textContent || ''), null, { timeout: 10000 });
            await page.waitForFunction(() => {
              const audio = document.querySelector('#chapterBgm');
              return audio && !audio.paused && audio.currentTime > 0.05;
            }, null, { timeout: 10000 });
            const secondTrack = await readTrack();
            assert(secondTrack.currentSrc !== firstTrack.currentSrc, `${testCase.name}: second track source did not change`);

            await finishCurrentTrack();
            await page.waitForFunction(() => /1\/2/.test(document.querySelector('[data-audio-controller]')?.textContent || ''), null, { timeout: 10000 });
            await page.waitForFunction(() => {
              const audio = document.querySelector('#chapterBgm');
              return audio && !audio.paused && audio.currentTime > 0.05;
            }, null, { timeout: 10000 });
            const loopedTrack = await readTrack();
            assert(loopedTrack.currentSrc === firstTrack.currentSrc, `${testCase.name}: playlist did not return to track 1`);
            await page.screenshot({ path: path.join(outDir, `${testCase.name}-article-audio.png`) });

            const unexpectedFailures = failedRequests.filter(item =>
              item.url.startsWith('https://jerryzuhow77.github.io/child-advocacy-site/')
              && item.error !== 'net::ERR_ABORTED'
            );
            const badMediaResponses = mediaResponses.filter(item => item.status < 200 || item.status >= 400);
            assert(pageErrors.length === 0, `${testCase.name}: page errors: ${pageErrors.join(' | ')}`);
            assert(unexpectedFailures.length === 0, `${testCase.name}: request failures: ${JSON.stringify(unexpectedFailures)}`);
            assert(badMediaResponses.length === 0, `${testCase.name}: bad media responses: ${JSON.stringify(badMediaResponses)}`);

            results.push({
              name: testCase.name,
              documentStatus: response.status(),
              exitMode: testCase.exit,
              activationMode,
              firstScreen,
              videoPlayback,
              firstTrack,
              secondTrack,
              loopedBack: loopedTrack.currentSrc === firstTrack.currentSrc,
              mediaResponses,
              pageErrors,
              unexpectedFailures
            });
            await context.close();
          }

          await browser.close();
          fs.writeFileSync(path.join(outDir, 'report.json'), JSON.stringify({
            verifiedAt: new Date().toISOString(),
            cases: results
          }, null, 2));
          console.log('LIVE_BROWSER_VERIFY_PASS');
          console.log(JSON.stringify(results.map(item => ({
            name: item.name,
            status: item.documentStatus,
            exitMode: item.exitMode,
            activationMode: item.activationMode,
            videoDuration: item.videoPlayback.duration,
            firstTrack: item.firstTrack.currentSrc,
            secondTrack: item.secondTrack.currentSrc,
            loopedBack: item.loopedBack,
            mediaResponses: item.mediaResponses.length,
            pageErrors: item.pageErrors.length,
            requestFailures: item.unexpectedFailures.length
          })), null, 2));
          NODE
          cd /tmp/kaikai-live-verify
          node verify.mjs

      - name: Upload browser evidence
        uses: actions/upload-artifact@v4
        with:
          name: kaikai-entry-audio-live-browser-evidence-20260829
          path: /tmp/kaikai-live-evidence/*
          if-no-files-found: error
          retention-days: 7

      - name: Remove completed one-off verifier
        shell: bash
        run: |
          set -euo pipefail
          workflow='.github/workflows/oneoff-verify-kaikai-entry-audio-live-20260829.yml'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main
          git rm "$workflow"
          git commit -m 'Remove completed Chapter 2 entry-media verifier'
          git push origin HEAD:main
