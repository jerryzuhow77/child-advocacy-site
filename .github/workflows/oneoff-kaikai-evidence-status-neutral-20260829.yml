name: Final verify durable Kaikai evidence-status wording

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oneoff-kaikai-evidence-status-neutral-20260829.yml'

permissions:
  contents: write

jobs:
  verify-and-clean:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Confirm committed durable wording
        shell: bash
        run: |
          set -euo pipefail
          grep -q '<strong>法院刑事認定</strong>依各審級裁判及其是否確定為準；' hearing-records/prison-watch/kaikai-final-chapter/index.html
          grep -q '<strong>法院刑事认定</strong>依各审级裁判及其是否确定为准；' hearing-records/prison-watch/kaikai-final-chapter/zh-Hans/index.html
          ! grep -q '<strong>一審法院認定</strong>仍在上訴；' hearing-records/prison-watch/kaikai-final-chapter/index.html
          ! grep -q '<strong>一审法院认定</strong>仍在上诉；' hearing-records/prison-watch/kaikai-final-chapter/zh-Hans/index.html

      - name: Wait for public wording
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p browser-validation/evidence-status-neutral-final
          urls=(
            'https://jerryzuhow77.github.io/child-advocacy-site/hearing-records/prison-watch/kaikai-final-chapter/'
            'https://jerryzuhow77.github.io/child-advocacy-site/hearing-records/prison-watch/kaikai-final-chapter/zh-Hans/'
          )
          phrases=(
            '法院刑事認定</strong>依各審級裁判及其是否確定為準'
            '法院刑事认定</strong>依各审级裁判及其是否确定为准'
          )
          for attempt in $(seq 1 60); do
            ready=1
            for i in 0 1; do
              html="$(curl -fsSL --connect-timeout 15 --max-time 30 "${urls[$i]}?qa=${GITHUB_SHA}-${attempt}" || true)"
              grep -q "${phrases[$i]}" <<<"$html" || ready=0
              grep -q 'id="medical-network-omissions"' <<<"$html" || ready=0
            done
            [[ "$ready" -eq 1 ]] && exit 0
            sleep 10
          done
          echo 'Durable wording was not visible on both public pages in time.' >&2
          exit 1

      - name: Install Playwright driver
        run: npm install --no-save playwright-core@1.55.0

      - name: Verify Traditional and Simplified desktop and mobile Chrome
        run: |
          node --input-type=module <<'JS'
          import { chromium } from 'playwright-core';
          import fs from 'node:fs';

          const out = 'browser-validation/evidence-status-neutral-final';
          fs.mkdirSync(out, { recursive: true });
          const sites = {
            'zh-Hant': {
              url: 'https://jerryzuhow77.github.io/child-advocacy-site/hearing-records/prison-watch/kaikai-final-chapter/',
              status: '法院刑事認定依各審級裁判及其是否確定為準',
              clinic: '興隆診所名稱目前只列為待核實就醫節點'
            },
            'zh-Hans': {
              url: 'https://jerryzuhow77.github.io/child-advocacy-site/hearing-records/prison-watch/kaikai-final-chapter/zh-Hans/',
              status: '法院刑事认定依各审级裁判及其是否确定为准',
              clinic: '兴隆诊所名称目前只列为待核实就医节点'
            }
          };
          const viewports = {
            desktop: { width: 1440, height: 1000 },
            mobile: { width: 390, height: 844 }
          };
          const browser = await chromium.launch({
            headless: true,
            executablePath: '/usr/bin/google-chrome',
            args: ['--no-sandbox', '--disable-dev-shm-usage']
          });
          const results = [];
          let failed = false;

          for (const [language, site] of Object.entries(sites)) {
            for (const [viewportName, viewport] of Object.entries(viewports)) {
              const context = await browser.newContext({
                viewport,
                locale: language === 'zh-Hant' ? 'zh-TW' : 'zh-CN',
                colorScheme: 'light'
              });
              const page = await context.newPage();
              const pageErrors = [];
              const httpErrors = [];
              page.on('pageerror', error => pageErrors.push(String(error)));
              page.on('response', response => {
                const parsed = new URL(response.url());
                if (parsed.hostname === 'jerryzuhow77.github.io' && response.status() >= 400) {
                  httpErrors.push({ url: response.url(), status: response.status() });
                }
              });

              const response = await page.goto(`${site.url}?qa=${Date.now()}-${language}-${viewportName}#medical-network-omissions`, {
                waitUntil: 'domcontentloaded',
                timeout: 60000
              });
              const boundary = page.locator('.medical-evidence-boundary');
              await boundary.waitFor({ state: 'visible', timeout: 15000 });
              await boundary.scrollIntoViewIfNeeded();
              await page.waitForTimeout(700);

              const state = await boundary.evaluate((node, expected) => {
                const compact = (node.textContent || '').replace(/\s+/g, '');
                const style = getComputedStyle(node);
                const rect = node.getBoundingClientRect();
                return {
                  status: compact.includes(expected.status),
                  clinic: compact.includes(expected.clinic),
                  stalePhraseAbsent: !compact.includes('一審法院認定仍在上訴') && !compact.includes('一审法院认定仍在上诉'),
                  rendered: style.display !== 'none' && style.visibility !== 'hidden' && Number(style.opacity) >= 0.99 && rect.width > 0 && rect.height > 0,
                  intersectsViewport: rect.top < innerHeight && rect.bottom > 0,
                  rect: { top: Math.round(rect.top), bottom: Math.round(rect.bottom), width: Math.round(rect.width), height: Math.round(rect.height) },
                  overflow: Math.max(0, Math.max(document.documentElement.scrollWidth, document.body.scrollWidth) - innerWidth)
                };
              }, site);

              await boundary.screenshot({ path: `${out}/${language}-${viewportName}-boundary.png` });
              const checks = {
                http200: response?.status() === 200,
                durableStatusCopy: state.status && state.clinic && state.stalePhraseAbsent,
                boundaryRendered: state.rendered,
                noOverflow: state.overflow <= 2,
                noPageErrors: pageErrors.length === 0,
                noHttpErrors: httpErrors.length === 0
              };
              const passed = Object.values(checks).every(Boolean);
              if (!passed) failed = true;
              results.push({ language, viewport: viewportName, dimensions: viewport, checks, state, pageErrors, httpErrors, passed });
              await context.close();
            }
          }

          await browser.close();
          fs.writeFileSync(`${out}/report.json`, JSON.stringify({ generatedAt: new Date().toISOString(), results }, null, 2));
          const lines = ['# Durable evidence-status wording final verification', ''];
          for (const result of results) {
            lines.push(`## ${result.language} · ${result.viewport} (${result.dimensions.width}×${result.dimensions.height})`);
            lines.push(`- Result: ${result.passed ? 'PASS' : 'FAIL'}`);
            lines.push(`- Copy: status=${result.state.status}, clinic=${result.state.clinic}, staleAbsent=${result.state.stalePhraseAbsent}`);
            lines.push(`- Rendered=${result.state.rendered}; intersectsViewport=${result.state.intersectsViewport}; rect=${JSON.stringify(result.state.rect)}`);
            lines.push(`- Overflow=${result.state.overflow}px; pageErrors=${result.pageErrors.length}; HTTP=${result.httpErrors.length}`);
            const failedChecks = Object.entries(result.checks).filter(([, value]) => !value).map(([key]) => key);
            lines.push(`- Failed checks: ${failedChecks.length ? failedChecks.join(', ') : 'none'}`);
            lines.push('');
          }
          fs.writeFileSync(`${out}/summary.md`, lines.join('\n'));
          console.log(lines.join('\n'));
          if (failed) process.exit(1);
          JS

      - name: Upload final browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kaikai-evidence-status-neutral-final-proof
          path: browser-validation/evidence-status-neutral-final
          retention-days: 14

      - name: Remove completed one-off workflow
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main
          git rm .github/workflows/oneoff-kaikai-evidence-status-neutral-20260829.yml
          git commit -m 'Remove completed evidence-status wording workflow'
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git pull --rebase origin main
          done
          exit 1
