name: Use durable court-status wording in Kaikai medical evidence boundary

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oneoff-kaikai-evidence-status-neutral-20260829.yml'

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace time-sensitive appeal wording
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin main
          python - <<'PY'
          from pathlib import Path
          replacements = {
              Path('hearing-records/prison-watch/kaikai-final-chapter/index.html'): (
                  '<strong>一審法院認定</strong>仍在上訴；',
                  '<strong>法院刑事認定</strong>依各審級裁判及其是否確定為準；',
              ),
              Path('hearing-records/prison-watch/kaikai-final-chapter/zh-Hans/index.html'): (
                  '<strong>一审法院认定</strong>仍在上诉；',
                  '<strong>法院刑事认定</strong>依各审级裁判及其是否确定为准；',
              ),
          }
          for path, (old, new) in replacements.items():
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one old status phrase, found {count}')
              text = text.replace(old, new, 1)
              if text.count(new) != 1:
                  raise SystemExit(f'{path}: new status phrase missing or duplicated')
              path.write_text(text, encoding='utf-8')
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hearing-records/prison-watch/kaikai-final-chapter/index.html
          git add hearing-records/prison-watch/kaikai-final-chapter/zh-Hans/index.html
          git commit -m 'Use durable court-status wording in medical evidence boundary'
          git push origin HEAD:main

      - name: Wait for corrected public wording
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p browser-validation/evidence-status-neutral
          urls=(
            'https://jerryzuhow77.github.io/child-advocacy-site/hearing-records/prison-watch/kaikai-final-chapter/'
            'https://jerryzuhow77.github.io/child-advocacy-site/hearing-records/prison-watch/kaikai-final-chapter/zh-Hans/'
          )
          phrases=(
            '法院刑事認定</strong>依各審級裁判及其是否確定為準'
            '法院刑事认定</strong>依各审级裁判及其是否确定为准'
          )
          for attempt in $(seq 1 75); do
            ready=1
            for i in 0 1; do
              html="$(curl -fsSL --connect-timeout 15 --max-time 30 "${urls[$i]}?qa=${GITHUB_SHA}-${attempt}" || true)"
              grep -q "${phrases[$i]}" <<<"$html" || ready=0
              grep -q 'id="medical-network-omissions"' <<<"$html" || ready=0
            done
            [[ "$ready" -eq 1 ]] && exit 0
            sleep 10
          done
          exit 1

      - name: Install Playwright driver
        run: npm install --no-save playwright-core@1.55.0

      - name: Verify public copy in desktop and mobile Chrome
        run: |
          node --input-type=module <<'JS'
          import { chromium } from 'playwright-core';
          import fs from 'node:fs';
          const out = 'browser-validation/evidence-status-neutral';
          fs.mkdirSync(out, { recursive: true });
          const sites = {
            'zh-Hant': {
              url: 'https://jerryzuhow77.github.io/child-advocacy-site/hearing-records/prison-watch/kaikai-final-chapter/',
              status: '法院刑事認定依各審級裁判及其是否確定為準',
              clinic: '興隆診所名稱目前只列為待核實就醫節點'
            },
            'zh-Hans': {
              url: 'https://jerryzuhow77.github.io/child-advocacy-site/hearing-records/prison-watch/kaikai-final-chapter/zh-Hans/',
              status: '法院刑事认定依各审级裁判及其是否确定为准',
              clinic: '兴隆诊所名称目前只列为待核实就医节点'
            }
          };
          const viewports = { desktop: { width: 1440, height: 1000 }, mobile: { width: 390, height: 844 } };
          const browser = await chromium.launch({ headless: true, executablePath: '/usr/bin/google-chrome', args: ['--no-sandbox','--disable-dev-shm-usage'] });
          const results = [];
          let failed = false;
          for (const [language, site] of Object.entries(sites)) {
            for (const [viewportName, viewport] of Object.entries(viewports)) {
              const context = await browser.newContext({ viewport, locale: language === 'zh-Hant' ? 'zh-TW' : 'zh-CN' });
              const page = await context.newPage();
              const pageErrors = [];
              const httpErrors = [];
              page.on('pageerror', error => pageErrors.push(String(error)));
              page.on('response', response => {
                const u = new URL(response.url());
                if (u.hostname === 'jerryzuhow77.github.io' && response.status() >= 400) httpErrors.push({ url: response.url(), status: response.status() });
              });
              const response = await page.goto(`${site.url}?qa=${Date.now()}-${language}-${viewportName}#medical-network-omissions`, { waitUntil: 'domcontentloaded', timeout: 60000 });
              await page.waitForSelector('.medical-evidence-boundary', { state: 'visible', timeout: 15000 });
              await page.locator('.medical-evidence-boundary').scrollIntoViewIfNeeded();
              await page.waitForTimeout(400);
              const state = await page.locator('.medical-evidence-boundary').evaluate((node, expected) => {
                const compact = (node.textContent || '').replace(/\s+/g, '');
                const rect = node.getBoundingClientRect();
                return {
                  status: compact.includes(expected.status),
                  clinic: compact.includes(expected.clinic),
                  stalePhraseAbsent: !compact.includes('一審法院認定仍在上訴') && !compact.includes('一审法院认定仍在上诉'),
                  visible: rect.top < innerHeight && rect.bottom > 0,
                  overflow: Math.max(0, Math.max(document.documentElement.scrollWidth, document.body.scrollWidth) - innerWidth)
                };
              }, site);
              await page.locator('.medical-evidence-boundary').screenshot({ path: `${out}/${language}-${viewportName}-boundary.png` });
              const checks = {
                http200: response?.status() === 200,
                durableStatusCopy: state.status && state.clinic && state.stalePhraseAbsent,
                visible: state.visible,
                noOverflow: state.overflow <= 2,
                noPageErrors: pageErrors.length === 0,
                noHttpErrors: httpErrors.length === 0
              };
              const passed = Object.values(checks).every(Boolean);
              if (!passed) failed = true;
              results.push({ language, viewport: viewportName, checks, state, pageErrors, httpErrors, passed });
              await context.close();
            }
          }
          await browser.close();
          fs.writeFileSync(`${out}/report.json`, JSON.stringify(results, null, 2));
          const lines = ['# Durable court-status boundary verification', ''];
          for (const r of results) lines.push(`- ${r.language} · ${r.viewport}: ${r.passed ? 'PASS' : 'FAIL'}; overflow=${r.state.overflow}px; pageErrors=${r.pageErrors.length}; HTTP=${r.httpErrors.length}`);
          fs.writeFileSync(`${out}/summary.md`, lines.join('\n'));
          console.log(lines.join('\n'));
          if (failed) process.exit(1);
          JS

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kaikai-evidence-status-neutral-proof
          path: browser-validation/evidence-status-neutral
          retention-days: 14

      - name: Remove completed workflow
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main
          git rm .github/workflows/oneoff-kaikai-evidence-status-neutral-20260829.yml
          git commit -m 'Remove completed evidence-status wording workflow'
          git push origin HEAD:main
