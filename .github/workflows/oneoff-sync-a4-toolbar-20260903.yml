name: One-off sync A4 dossier toolbar

on:
  push:
    branches:
      - 'fix/sync-a4-toolbar-after-news-20260903'
    paths:
      - '.github/workflows/oneoff-sync-a4-toolbar-20260903.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: oneoff-sync-a4-toolbar-20260903
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/sync-a4-toolbar-after-news-20260903
          fetch-depth: 0

      - name: Synchronize toolbar routes and sitemap
        run: |
          set -euo pipefail
          python3 .github/scripts/sync-four-language-toolbar.py
          python3 scripts/sync_sitemap.py
          python3 .github/scripts/verify-chapter-two-publication.py
          git diff --check

      - name: Verify A4 dossier synchronization
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          page = Path('cases/kaikai/a4-dossier/index.html').read_text(encoding='utf-8')
          assert 'data-cpa-four-language-toolbar-style' in page
          assert 'data-cpa-four-language-toolbar-flag' in page
          assert 'data-cpa-four-language-toolbar-script' in page

          routes = json.loads(Path('data/four-language-routes.json').read_text(encoding='utf-8'))
          assert routes['routes']['cases/kaikai/a4-dossier/']['zh-Hant'] == '/child-advocacy-site/cases/kaikai/a4-dossier/'
          print('A4 dossier toolbar and route synchronization verified.')
          PY

      - name: Commit generated files
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- cases/kaikai/a4-dossier/index.html data/four-language-routes.json sitemap.xml
          if git diff --cached --quiet; then
            echo 'Generated files are already synchronized.'
            exit 0
          fi
          git commit -m 'chore: synchronize A4 dossier toolbar and routes'
          git push origin HEAD:fix/sync-a4-toolbar-after-news-20260903
