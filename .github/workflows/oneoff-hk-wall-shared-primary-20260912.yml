name: Diagnose Cloudflare sync relay access

on:
  push:
    branches:
      - ops/hk-wall-shared-primary-20260912
    paths:
      - .github/workflows/oneoff-hk-wall-shared-primary-20260912.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hk-wall-shared-primary-20260912
  cancel-in-progress: false

jobs:
  diagnose-relay:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      HK_HOST: ${{ secrets.TENCENT_SSH_HOST }}
      HK_USER: ${{ secrets.TENCENT_SSH_USER }}
      HK_PORT: ${{ secrets.TENCENT_SSH_PORT }}
      HK_KEY_A: ${{ secrets.TENCENT_SSH_PRIVATE_KEY }}
      HK_KEY_B: ${{ secrets.TENCENT_CVM_SSH_KEY }}
      HK_KEY_C: ${{ secrets.SSH_PRIVATE_KEY }}
    steps:
      - name: Configure SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          host="${HK_HOST:-150.109.69.104}"
          user="${HK_USER:-ubuntu}"
          port="${HK_PORT:-22}"
          key="${HK_KEY_A:-${HK_KEY_B:-${HK_KEY_C:-}}}"
          test -n "$key"
          mkdir -p ~/.ssh
          printf '%s\n' "$key" > ~/.ssh/hk_key
          chmod 600 ~/.ssh/hk_key
          ssh-keyscan -p "$port" "$host" > ~/.ssh/known_hosts
          printf 'HOST=%s\nUSER=%s\nPORT=%s\n' "$host" "$user" "$port" >> "$GITHUB_ENV"

      - name: Check Cloudflare relay management access
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/hk_key -p "$PORT" "$USER@$HOST" 'bash -s' <<'SH'
          set -u
          cd /opt/global-protection
          echo '--- wrangler version ---'
          npx --no-install wrangler --version 2>&1 || true
          echo '--- wrangler identity ---'
          npx --no-install wrangler whoami 2>&1 || true
          echo '--- wrangler config files (paths only) ---'
          find "$HOME/.config/.wrangler" "$HOME/.wrangler" -maxdepth 4 -type f -printf '%p\n' 2>/dev/null | sort || true
          echo '--- Cloudflare environment variable names only ---'
          env | sed -n -E 's/^((CLOUDFLARE|CF)_[A-Za-z0-9_]+)=.*/\1/p' | sort -u
          echo '--- candidate sync Worker source files ---'
          find /opt/global-protection -maxdepth 6 -type f \
            \( -iname '*sync*' -o -iname 'wrangler.toml' -o -iname 'wrangler.json' -o -iname 'wrangler.jsonc' -o -iname 'worker.js' -o -iname 'worker.ts' \) \
            -not -path '*/node_modules/*' -not -path '*/dist/client/*' -not -path '*/.release-backups/*' \
            -printf '%p\n' 2>/dev/null | sort | head -n 240
          echo '--- files declaring HK_SYNC_SECRET ---'
          grep -RIlE '^[[:space:]]*HK_SYNC_SECRET[[:space:]]*=' /opt/global-protection \
            --exclude-dir=node_modules --exclude-dir=dist --exclude-dir=.release-backups 2>/dev/null | head -n 80 || true
          echo '--- local D1 files ---'
          find .wrangler/state -maxdepth 8 -type f -printf '%p %s bytes\n' 2>/dev/null | sort | head -n 120
          echo '--- deployments list for sync relay ---'
          npx --no-install wrangler deployments list --name global-protection-sync 2>&1 | sed -n '1,160p' || true
          echo '--- deployments command help ---'
          npx --no-install wrangler deployments --help 2>&1 | sed -n '1,160p' || true
          echo '--- no production mutation performed ---'
          SH


      - name: Publish deployment key identity
        shell: bash
        run: |
          set -Eeuo pipefail
          echo 'ssh_public_key_begin'
          ssh-keygen -y -f ~/.ssh/hk_key
          echo 'ssh_public_key_end'
          ssh-keygen -lf ~/.ssh/hk_key
