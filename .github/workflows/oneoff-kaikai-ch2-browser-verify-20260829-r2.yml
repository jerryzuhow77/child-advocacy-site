name: One-off Kaikai Chapter 2 browser verification r2

on:
  push:
    branches:
      - qa/kaikai-ch2-browser-verify-20260829-r2

permissions:
  contents: read

concurrency:
  group: kaikai-ch2-browser-verify-20260829-r2
  cancel-in-progress: false

jobs:
  verify-production:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out QA branch
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install browser driver
        run: npm install --no-save playwright-core@1.55.0

      - name: Wait for deployed asset version
        shell: bash
        run: |
          set -euo pipefail
          url='https://jerryzuhow77.github.io/child-advocacy-site/hearing-records/prison-watch/kaikai-final-chapter/'
          for i in {1..40}; do
            html="$(curl -fsSL --retry 2 "${url}?qa=$(date +%s%N)" || true)"
            if grep -Fq 'final-chapter.css?v=20260829-18' <<<"$html"; then
              exit 0
            fi
            sleep 3
          done
          echo 'Expected deployed CSS version was not found.' >&2
          exit 1

      - name: Run Google Chrome verification
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p browser-evidence
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import path from 'node:path';
          import { chromium } from 'playwright-core';

          const root = 'https://jerryzuhow77.github.io/child-advocacy-site/hearing-records/prison-watch/kaikai-final-chapter/';
          const out = path.resolve('browser-evidence');
          const locales = [
            { name: 'zh-Hant', path: '', lang: 'zh-Hant', title: '沒人要的孩子？', search: '周保母', collapsed: '重點顯示' },
            { name: 'zh-Hans', path: 'zh-Hans/', lang: 'zh-Hans', title: '没人要的孩子？', search: '周保母', collapsed: '重点显示' }
          ];
          const viewports = [
            { name: 'desktop', width: 1440, height: 1000 },
            { name: 'mobile', width: 390, height: 844 },
            { name: 'narrow', width: 320, height: 780 }
          ];
          const anchors = ['evidence-atlas', 'death-temperature-evidence', 'dental-warning', 'placement-spectrum'];
          const failures = [];
          const observations = [];
          let nonce = 0;

          const browser = await chromium.launch({
            headless: true,
            executablePath: '/usr/bin/google-chrome',
            args: ['--no-sandbox', '--disable-dev-shm-usage']
          });

          const addFailure = (label, detail) => failures.push(`${label}: ${typeof detail === 'string' ? detail : JSON.stringify(detail)}`);
          const makeUrl = (locale, hash = '') => `${root}${locale.path}?qa=${Date.now()}-${++nonce}${hash}`;

          async function makeSession(locale, viewport, mode = 'guided') {
            const context = await browser.newContext({
              viewport: { width: viewport.width, height: viewport.height },
              locale: locale.name === 'zh-Hant' ? 'zh-TW' : 'zh-CN',
              colorScheme: 'light'
            });
            await context.addInitScript((value) => {
              try { localStorage.setItem('kaikai-final-reading-depth-v1', value); } catch (_) {}
            }, mode);
            const page = await context.newPage();
            const diagnostics = { pageErrors: [], sameOriginHttpErrors: [], failedRequests: [] };
            const origin = new URL(root).origin;
            page.on('pageerror', (error) => diagnostics.pageErrors.push(String(error)));
            page.on('response', (response) => {
              const url = new URL(response.url());
              if (url.origin === origin && response.status() >= 400) diagnostics.sameOriginHttpErrors.push(`${response.status()} ${url.pathname}`);
            });
            page.on('requestfailed', (request) => {
              const url = new URL(request.url());
              const error = request.failure()?.errorText || 'unknown';
              const expectedAudioFallbackAbort = request.resourceType() === 'media'
                && /kaikai-chapter2-bgm-20260828\.webm$/.test(url.pathname)
                && error.includes('ERR_ABORTED');
              if (!expectedAudioFallbackAbort) diagnostics.failedRequests.push(`${error} ${url.pathname}`);
            });
            return { context, page, diagnostics };
          }

          async function open(page, url, settle = 1200) {
            const response = await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 60000 });
            await page.waitForLoadState('load', { timeout: 60000 }).catch(() => undefined);
            await page.evaluate(() => document.fonts?.ready).catch(() => undefined);
            await page.waitForTimeout(settle);
            return response;
          }

          async function layoutState(page) {
            return page.evaluate(() => {
              const visible = (element) => {
                if (!element) return false;
                const rect = element.getBoundingClientRect();
                const style = getComputedStyle(element);
                return !element.hidden && style.display !== 'none' && style.visibility !== 'hidden'
                  && Number(style.opacity) >= 0.99 && rect.width > 0 && rect.height > 0;
              };
              const heading = document.querySelector('.hero h1');
              const textNode = [...heading.childNodes].find((node) => node.nodeType === Node.TEXT_NODE && node.textContent.trim());
              const range = document.createRange();
              range.selectNodeContents(textNode);
              const searchRect = document.querySelector('#lifeSearch').getBoundingClientRect();
              const hero = document.querySelector('.hero-art img');
              return {
                titleLines: range.getClientRects().length,
                titleWhiteSpace: getComputedStyle(heading).whiteSpace,
                overflow: Math.max(document.documentElement.scrollWidth, document.body.scrollWidth) - innerWidth,
                searchLeft: Math.round(searchRect.left),
                searchRight: Math.round(searchRect.right),
                searchWidth: Math.round(searchRect.width),
                viewport: innerWidth,
                h1Visible: visible(heading),
                breadcrumbVisible: visible(document.querySelector('.chapter-breadcrumb')),
                titleBoundaryVisible: visible(document.querySelector('.title-boundary')),
                heroComplete: hero.complete,
                heroNaturalWidth: hero.naturalWidth,
                heroSrc: hero.currentSrc,
                audioPaused: document.querySelector('#chapterBgm')?.paused,
                audioTime: document.querySelector('#chapterBgm')?.currentTime,
                gsapAvailable: Boolean(window.gsap),
                cssVersion: [...document.querySelectorAll('link[rel="stylesheet"]')].map((link) => link.href).find((href) => href.includes('final-chapter.css')) || ''
              };
            });
          }

          async function anchorState(page, id) {
            return page.locator(`#${id}`).evaluate((element) => {
              const rect = element.getBoundingClientRect();
              const style = getComputedStyle(element);
              return {
                top: Math.round(rect.top),
                bottom: Math.round(rect.bottom),
                opacity: Number(style.opacity),
                hidden: element.hidden,
                display: style.display,
                visibility: style.visibility,
                inViewport: rect.top < innerHeight && rect.bottom > 0
              };
            });
          }

          const assertDiagnostics = (label, diagnostics) => {
            if (diagnostics.pageErrors.length || diagnostics.sameOriginHttpErrors.length || diagnostics.failedRequests.length) addFailure(label, diagnostics);
          };

          for (const locale of locales) {
            for (const viewport of viewports) {
              const session = await makeSession(locale, viewport, 'guided');
              const response = await open(session.page, makeUrl(locale));
              const layout = await layoutState(session.page);
              const semantic = await session.page.evaluate(() => ({
                lang: document.documentElement.lang,
                title: document.title,
                h1: document.querySelector('h1')?.innerText || '',
                navGroups: document.querySelectorAll('#siteNav details.nav-group').length,
                modeButtons: document.querySelectorAll('button[data-reading-depth]').length,
                mode: document.body.dataset.readingDepth
              }));
              const label = `${locale.name}/${viewport.name}`;
              observations.push({ test: 'normal', locale: locale.name, viewport: viewport.name, status: response?.status(), layout, semantic, diagnostics: session.diagnostics });
              if (!response || response.status() !== 200) addFailure(`${label} HTTP`, response?.status() ?? 'no response');
              if (semantic.lang !== locale.lang || !semantic.title.includes(locale.title) || !semantic.h1.includes(locale.title)) addFailure(`${label} language/title`, semantic);
              if (semantic.navGroups !== 5 || semantic.modeButtons !== 3 || semantic.mode !== 'guided') addFailure(`${label} navigation/mode`, semantic);
              if (!layout.h1Visible || !layout.breadcrumbVisible || !layout.titleBoundaryVisible || !layout.heroComplete || !layout.heroNaturalWidth) addFailure(`${label} visual basics`, layout);
              if (layout.overflow > 2 || layout.searchLeft < 0 || layout.searchRight > viewport.width + 1) addFailure(`${label} horizontal layout`, layout);
              if (viewport.name !== 'desktop' && (layout.titleLines !== 1 || layout.titleWhiteSpace !== 'nowrap')) addFailure(`${label} title wrapping`, layout);
              if (viewport.name === 'narrow' && layout.searchWidth > viewport.width - 20) addFailure(`${label} search width`, layout);
              if (viewport.name === 'mobile' && !/-640\.|-960\./.test(layout.heroSrc)) addFailure(`${label} responsive hero`, layout.heroSrc);
              if (layout.audioPaused !== true || Number(layout.audioTime) !== 0 || !layout.gsapAvailable) addFailure(`${label} media readiness`, layout);
              if (!layout.cssVersion.includes('20260829-18')) addFailure(`${label} CSS version`, layout.cssVersion);
              assertDiagnostics(`${label} runtime`, session.diagnostics);
              if (locale.name === 'zh-Hant') await session.page.screenshot({ path: path.join(out, `${locale.name}-${viewport.name}-top.png`), fullPage: false });
              await session.context.close();
            }
          }

          for (const locale of locales) {
            const modes = {};
            for (const mode of ['quick', 'guided', 'full']) {
              const session = await makeSession(locale, viewports[0], mode);
              await open(session.page, makeUrl(locale));
              modes[mode] = await session.page.evaluate(() => {
                const sections = [...document.querySelectorAll('main section[data-reading-level]')];
                return {
                  mode: document.body.dataset.readingDepth,
                  hidden: sections.filter((section) => section.hidden).length,
                  pressed: [...document.querySelectorAll('button[data-reading-depth]')]
                    .filter((button) => button.getAttribute('aria-pressed') === 'true')
                    .map((button) => button.dataset.readingDepth)
                };
              });
              assertDiagnostics(`${locale.name}/${mode} runtime`, session.diagnostics);
              await session.context.close();
            }
            observations.push({ test: 'modes', locale: locale.name, modes });
            if (modes.quick.mode !== 'quick' || modes.guided.mode !== 'guided' || modes.full.mode !== 'full') addFailure(`${locale.name} mode persistence`, modes);
            if (modes.quick.hidden < 1 || modes.full.hidden !== 0 || modes.quick.hidden < modes.guided.hidden || modes.guided.hidden < modes.full.hidden) addFailure(`${locale.name} mode hierarchy`, modes);
            if (modes.quick.pressed[0] !== 'quick' || modes.guided.pressed[0] !== 'guided' || modes.full.pressed[0] !== 'full') addFailure(`${locale.name} mode ARIA`, modes);
          }

          for (const locale of locales) {
            const session = await makeSession(locale, viewports[1], 'quick');
            await open(session.page, makeUrl(locale));

            await session.page.locator('#menuButton').click();
            await session.page.locator('.nav-group').filter({ has: session.page.locator('a[href="#evidence-atlas"]') }).evaluate((element) => { element.open = true; });
            await session.page.locator('#siteNav a[href="#evidence-atlas"]').click();
            await session.page.waitForTimeout(1700);
            const menu = await anchorState(session.page, 'evidence-atlas');
            observations.push({ test: 'menu', locale: locale.name, menu });
            if (!menu.inViewport || menu.opacity < 0.99 || menu.hidden) addFailure(`${locale.name} menu anchor`, menu);

            await open(session.page, makeUrl(locale));
            await session.page.locator('#lifeSearch').fill(locale.search);
            await session.page.waitForTimeout(300);
            const searched = await session.page.evaluate((term) => {
              const normalize = (value) => value.toLocaleLowerCase().replace(/\s+/g, ' ').trim();
              const query = normalize(term);
              const events = [...document.querySelectorAll('#lifeTimeline .life-event')];
              const matches = events.filter((event) => normalize(`${event.dataset.search || ''} ${event.textContent || ''}`).includes(query));
              return {
                active: document.body.classList.contains('life-search-active'),
                matches: matches.length,
                visibleMatches: matches.filter((event) => !event.hidden && getComputedStyle(event).display !== 'none' && event.getClientRects().length).length,
                status: document.querySelector('#lifeStatus')?.textContent || '',
                toggleDisplay: getComputedStyle(document.querySelector('#lifeQuickToggle')).display
              };
            }, locale.search);
            await session.page.locator('#lifeSearch').fill('');
            await session.page.waitForTimeout(200);
            const cleared = await session.page.evaluate(() => ({
              active: document.body.classList.contains('life-search-active'),
              status: document.querySelector('#lifeStatus')?.textContent || '',
              visibleEvents: [...document.querySelectorAll('#lifeTimeline .life-event')]
                .filter((event) => !event.hidden && getComputedStyle(event).display !== 'none' && event.getClientRects().length).length
            }));
            observations.push({ test: 'search', locale: locale.name, searched, cleared });
            if (!searched.active || searched.matches < 1 || searched.visibleMatches !== searched.matches || !searched.status.includes('找到') || searched.toggleDisplay !== 'none') addFailure(`${locale.name} search`, searched);
            if (cleared.active || !cleared.status.includes(locale.collapsed) || cleared.visibleEvents !== 4) addFailure(`${locale.name} search clear`, cleared);

            for (const id of anchors) {
              await open(session.page, makeUrl(locale, `#${id}`), 1900);
              const initial = await anchorState(session.page, id);
              await session.page.reload({ waitUntil: 'domcontentloaded', timeout: 60000 });
              await session.page.waitForLoadState('load', { timeout: 60000 }).catch(() => undefined);
              await session.page.waitForTimeout(1900);
              const reloaded = await anchorState(session.page, id);
              observations.push({ test: 'anchor', locale: locale.name, id, initial, reloaded });
              for (const [phase, state] of [['initial', initial], ['reload', reloaded]]) {
                if (!state.inViewport || state.opacity < 0.99 || state.hidden || state.display === 'none' || state.visibility === 'hidden') addFailure(`${locale.name} #${id} ${phase}`, state);
              }
              if (locale.name === 'zh-Hant' && id === 'dental-warning') await session.page.screenshot({ path: path.join(out, 'zh-Hant-mobile-dental-warning.png'), fullPage: false });
            }
            assertDiagnostics(`${locale.name} interactive runtime`, session.diagnostics);
            await session.context.close();
          }

          const puppet = await makeSession(locales[0], viewports[0], 'guided');
          await open(puppet.page, makeUrl(locales[0]));
          await puppet.page.locator('[data-puppet-action="play"]').click();
          await puppet.page.waitForTimeout(900);
          const playing = await puppet.page.evaluate(() => ({
            progress: Number(document.querySelector('.puppet-progress')?.getAttribute('aria-valuenow') || 0),
            playDisabled: document.querySelector('[data-puppet-action="play"]')?.disabled,
            pauseDisabled: document.querySelector('[data-puppet-action="pause"]')?.disabled
          }));
          await puppet.page.locator('[data-puppet-action="pause"]').click();
          await puppet.page.waitForTimeout(150);
          const paused = await puppet.page.evaluate(() => ({
            audioPaused: document.querySelector('#chapterBgm')?.paused,
            pauseDisabled: document.querySelector('[data-puppet-action="pause"]')?.disabled
          }));
          observations.push({ test: 'puppet', playing, paused });
          if (!(playing.progress > 0) || playing.playDisabled !== true || playing.pauseDisabled !== false || paused.audioPaused !== true || paused.pauseDisabled !== true) addFailure('puppet controls', { playing, paused });
          assertDiagnostics('puppet runtime', puppet.diagnostics);
          await puppet.context.close();

          await browser.close();
          const report = { generatedAt: new Date().toISOString(), target: root, passed: failures.length === 0, failures, observations };
          fs.writeFileSync(path.join(out, 'report.json'), JSON.stringify(report, null, 2));
          fs.writeFileSync(path.join(out, 'summary.txt'), `Result: ${report.passed ? 'PASS' : 'FAIL'}\nFailures: ${failures.length}\n${failures.join('\n')}`);
          console.log(JSON.stringify(report, null, 2));
          if (failures.length) process.exit(1);
          JS

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kaikai-chapter2-browser-verify-20260829-r2
          path: browser-evidence/
          if-no-files-found: error
          retention-days: 14
