name: One-off Jungein live prologue asset verify

on:
  push:
    branches:
      - ops/jungein-intro-probe-20260829
    paths:
      - .github/workflows/oneoff-jungein-live-asset-verify-20260829.yml

permissions:
  contents: read

concurrency:
  group: oneoff-jungein-live-prologue-asset-verify-20260829
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ORIGIN: https://cn.globalprotectionwall.com
      PAGE_PATH: /historical-cases/korea/jungein
      VIDEO_PATH: /jungein-prologue-20260829.mp4
      POSTER_PATH: /jungein-prologue-poster-20260829.webp
      PATCH_MARKER: global-protection-jungein-video-prologue-20260829
    steps:
      - name: Fetch page and release assets read-only
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p evidence/assets
          : > evidence/status.tsv

          check_url() {
            local label="$1"
            local url="$2"
            local output="$3"
            local headers="evidence/${label}.headers.txt"
            local meta="evidence/${label}.meta.txt"
            local code
            code="$(curl --silent --show-error --location --max-time 30 \
              --retry 2 --retry-all-errors \
              -A 'JungeinLiveAssetVerifier/20260829' \
              -D "$headers" \
              -o "$output" \
              -w '%{http_code}' \
              "$url" || true)"
            printf '%s\t%s\t%s\n' "$label" "$code" "$url" | tee -a evidence/status.tsv
            {
              printf 'label=%s\n' "$label"
              printf 'url=%s\n' "$url"
              printf 'http_code=%s\n' "$code"
              if [[ -f "$output" ]]; then
                printf 'bytes=%s\n' "$(wc -c < "$output")"
                printf 'sha256=%s\n' "$(sha256sum "$output" | awk '{print $1}')"
              fi
            } > "$meta"
          }

          check_url page "$ORIGIN$PAGE_PATH" evidence/page.html
          check_url video "$ORIGIN$VIDEO_PATH" evidence/jungein-prologue-20260829.mp4
          check_url poster "$ORIGIN$POSTER_PATH" evidence/jungein-prologue-poster-20260829.webp

          python3 - <<'PY'
          import html
          import json
          import pathlib
          import re
          import urllib.parse
          import urllib.request

          root = pathlib.Path('evidence')
          page = (root / 'page.html').read_text('utf-8', errors='replace') if (root / 'page.html').exists() else ''
          origin = 'https://cn.globalprotectionwall.com'
          base = origin + '/historical-cases/korea/jungein'
          marker = 'global-protection-jungein-video-prologue-20260829'
          urls = []
          for attr in ('src', 'href'):
              for raw in re.findall(rf'{attr}=["\']([^"\']+)["\']', page, re.I):
                  url = urllib.parse.urljoin(base, html.unescape(raw))
                  parsed = urllib.parse.urlparse(url)
                  if parsed.hostname == 'cn.globalprotectionwall.com' and parsed.path.endswith(('.js', '.css')) and url not in urls:
                      urls.append(url)

          results = []
          marker_hits = []
          for index, url in enumerate(urls[:50], 1):
              req = urllib.request.Request(url, headers={'User-Agent': 'JungeinLiveAssetVerifier/20260829'})
              entry = {'url': url}
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      body = response.read(20_000_000)
                      path = root / 'assets' / f'{index:02d}-{pathlib.PurePosixPath(urllib.parse.urlparse(url).path).name}'
                      path.write_bytes(body)
                      text = body.decode('utf-8', errors='ignore')
                      entry.update({'status': response.status, 'bytes': len(body), 'file': str(path)})
                      if marker in text or 'jungein-prologue-20260829.mp4' in text:
                          marker_hits.append(url)
              except Exception as exc:
                  entry['error'] = f'{type(exc).__name__}: {exc}'
              results.append(entry)

          summary = {
              'page_contains_patch_marker': marker in page,
              'page_contains_video_path': 'jungein-prologue-20260829.mp4' in page,
              'asset_count': len(urls),
              'marker_asset_urls': marker_hits,
              'assets': results,
          }
          (root / 'asset-scan.json').write_text(json.dumps(summary, ensure_ascii=False, indent=2), 'utf-8')
          print(json.dumps(summary, ensure_ascii=False, indent=2))
          PY

          {
            echo '## Jungein live prologue verification'
            echo
            echo '### Direct endpoints'
            echo '```text'
            cat evidence/status.tsv
            echo '```'
            echo
            echo '### Bundle scan'
            echo '```json'
            cat evidence/asset-scan.json
            echo '```'
            echo
            echo 'Read-only verification only; no production mutation was performed.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oneoff-jungein-live-prologue-asset-verify-20260829
          path: evidence/
          if-no-files-found: error
          retention-days: 7
