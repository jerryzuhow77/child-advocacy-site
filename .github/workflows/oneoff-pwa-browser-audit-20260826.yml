name: One-off PWA browser audit 2026-08-26

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/oneoff-pwa-browser-audit-20260826.yml

permissions:
  contents: read

jobs:
  audit:
    name: Headless Chrome installability audit
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Capture public PWA resources
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p pwa-audit-20260826/{official,wall-tw,wall-hk}

          capture() {
            local id="$1" home="$2" manifest="$3" sw="$4"
            local dir="pwa-audit-20260826/$id"
            local nonce="${GITHUB_SHA}-$(date +%s)"

            printf '%s\n' "$home" > "$dir/home.url"
            printf '%s\n' "$manifest" > "$dir/manifest.url"
            printf '%s\n' "$sw" > "$dir/sw.url"

            curl -fL --retry 3 --retry-delay 2 --connect-timeout 15 --max-time 60 \
              -D "$dir/home.headers" -o "$dir/home.html" "${home}?pwa-audit=${nonce}"
            curl -fL --retry 3 --retry-delay 2 --connect-timeout 15 --max-time 60 \
              -D "$dir/manifest.headers" -o "$dir/manifest.webmanifest" "${manifest}?pwa-audit=${nonce}"
            curl -fL --retry 3 --retry-delay 2 --connect-timeout 15 --max-time 60 \
              -D "$dir/sw.headers" -o "$dir/sw.js" "${sw}?pwa-audit=${nonce}"

            sha256sum "$dir/home.html" "$dir/manifest.webmanifest" "$dir/sw.js" > "$dir/sha256.txt"
          }

          capture official \
            'https://jerryzuhow77.github.io/child-advocacy-site/' \
            'https://jerryzuhow77.github.io/child-advocacy-site/manifest.webmanifest' \
            'https://jerryzuhow77.github.io/child-advocacy-site/sw.js'

          capture wall-tw \
            'https://global-protection.jerryzuhow77.chatgpt.site/' \
            'https://global-protection.jerryzuhow77.chatgpt.site/site.webmanifest' \
            'https://global-protection.jerryzuhow77.chatgpt.site/sw.js'

          capture wall-hk \
            'https://cn.globalprotectionwall.com/' \
            'https://cn.globalprotectionwall.com/site.webmanifest' \
            'https://cn.globalprotectionwall.com/sw.js'

      - name: Run Lighthouse PWA audits in Chrome
        shell: bash
        run: |
          set -u
          run_lighthouse() {
            local id="$1" url="$2" dir="pwa-audit-20260826/$1"
            set +e
            npx -y lighthouse@11.7.1 "${url}?pwa-browser-audit=${GITHUB_SHA}" \
              --only-categories=pwa \
              --output=json \
              --output=html \
              --output-path="$dir/lighthouse" \
              --chrome-flags='--headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage' \
              --max-wait-for-load=60000 \
              --quiet
            printf '%s\n' "$?" > "$dir/lighthouse-exit-code.txt"
            set -e
          }
          set -e

          run_lighthouse official 'https://jerryzuhow77.github.io/child-advocacy-site/'
          run_lighthouse wall-tw 'https://global-protection.jerryzuhow77.chatgpt.site/'
          run_lighthouse wall-hk 'https://cn.globalprotectionwall.com/'

      - name: Validate manifests, icons, service workers and browser reports
        shell: bash
        run: |
          python3 - <<'PY'
          import glob
          import json
          import pathlib
          import re
          import urllib.parse
          import urllib.request

          root = pathlib.Path('pwa-audit-20260826')
          site_names = {
              'official': '護童行動聯盟官網',
              'wall-tw': '全球守護留言牆・台灣版',
              'wall-hk': '全球守護留言牆・香港／大陸版',
          }
          summary = {'audited_at': None, 'sites': {}, 'all_core_pass': True}

          def header_value(text, name):
              matches = re.findall(rf'(?im)^{re.escape(name)}:\s*(.+?)\s*$', text)
              return matches[-1] if matches else None

          for site_id, label in site_names.items():
              directory = root / site_id
              report = {'label': label, 'checks': {}, 'errors': []}

              home_url = (directory / 'home.url').read_text().strip()
              manifest_url = (directory / 'manifest.url').read_text().strip()
              sw_url = (directory / 'sw.url').read_text().strip()
              manifest_headers = (directory / 'manifest.headers').read_text(errors='replace')
              sw_headers = (directory / 'sw.headers').read_text(errors='replace')

              try:
                  manifest = json.loads((directory / 'manifest.webmanifest').read_text())
              except Exception as exc:
                  manifest = {}
                  report['errors'].append(f'manifest JSON: {exc}')

              sw_text = (directory / 'sw.js').read_text(errors='replace')
              icons = manifest.get('icons') or []
              icon_results = []
              for icon in icons:
                  src = icon.get('src')
                  if not src:
                      continue
                  icon_url = urllib.parse.urljoin(manifest_url, src)
                  try:
                      request = urllib.request.Request(icon_url, headers={'User-Agent': 'PWA-Audit/20260826'})
                      with urllib.request.urlopen(request, timeout=30) as response:
                          payload = response.read()
                          icon_results.append({
                              'url': icon_url,
                              'status': response.status,
                              'content_type': response.headers.get('content-type'),
                              'bytes': len(payload),
                              'sizes': icon.get('sizes'),
                              'purpose': icon.get('purpose'),
                          })
                  except Exception as exc:
                      icon_results.append({'url': icon_url, 'status': 0, 'error': str(exc), 'sizes': icon.get('sizes')})

              report['manifest'] = manifest
              report['icon_results'] = icon_results
              report['resource_headers'] = {
                  'manifest_content_type': header_value(manifest_headers, 'content-type'),
                  'manifest_cache_control': header_value(manifest_headers, 'cache-control'),
                  'sw_content_type': header_value(sw_headers, 'content-type'),
                  'sw_cache_control': header_value(sw_headers, 'cache-control'),
                  'service_worker_allowed': header_value(sw_headers, 'service-worker-allowed'),
              }

              start_url = manifest.get('start_url')
              scope = manifest.get('scope')
              display_values = [manifest.get('display')] + list(manifest.get('display_override') or [])
              standalone = any(value in {'standalone', 'fullscreen', 'minimal-ui', 'window-controls-overlay'} for value in display_values)
              icon_192 = any(item.get('status') == 200 and '192x192' in str(item.get('sizes')) and item.get('bytes', 0) > 0 for item in icon_results)
              icon_512 = any(item.get('status') == 200 and '512x512' in str(item.get('sizes')) and item.get('bytes', 0) > 0 for item in icon_results)

              report['checks'].update({
                  'manifest_json_valid': bool(manifest),
                  'manifest_has_name': bool(manifest.get('name') and manifest.get('short_name')),
                  'manifest_has_start_url': bool(start_url),
                  'manifest_start_url_same_origin': bool(start_url) and urllib.parse.urljoin(manifest_url, start_url).split('/')[2] == home_url.split('/')[2],
                  'manifest_scope_same_origin': not scope or urllib.parse.urljoin(manifest_url, scope).split('/')[2] == home_url.split('/')[2],
                  'manifest_display_standalone': standalone,
                  'icon_192_http_ok': icon_192,
                  'icon_512_http_ok': icon_512,
                  'service_worker_script_shape': 'self.addEventListener' in sw_text and ('install' in sw_text or 'fetch' in sw_text),
                  'service_worker_not_html': '<html' not in sw_text.lower() and '<!doctype' not in sw_text.lower(),
                  'service_worker_content_type_ok': bool(re.search(r'javascript|ecmascript', report['resource_headers']['sw_content_type'] or '', re.I)),
                  'install_ui_present_in_html': bool(re.search(r'下載.{0,12}(App|APP)|加入主畫面|安裝.{0,8}(App|APP)', (directory / 'home.html').read_text(errors='replace'), re.I)),
              })

              lighthouse_json = sorted(glob.glob(str(directory / 'lighthouse*.json')))
              if lighthouse_json:
                  try:
                      lighthouse = json.loads(pathlib.Path(lighthouse_json[0]).read_text())
                      category = lighthouse.get('categories', {}).get('pwa', {})
                      audits = lighthouse.get('audits', {})
                      key_ids = [
                          'installable-manifest', 'service-worker', 'works-offline',
                          'splash-screen', 'themed-omnibox', 'maskable-icon',
                          'content-width', 'viewport'
                      ]
                      report['lighthouse'] = {
                          'path': lighthouse_json[0],
                          'pwa_score': category.get('score'),
                          'audits': {
                              audit_id: {
                                  'score': audits.get(audit_id, {}).get('score'),
                                  'title': audits.get(audit_id, {}).get('title'),
                                  'display_value': audits.get(audit_id, {}).get('displayValue'),
                                  'explanation': audits.get(audit_id, {}).get('explanation'),
                              }
                              for audit_id in key_ids if audit_id in audits
                          },
                      }
                      installable = report['lighthouse']['audits'].get('installable-manifest', {}).get('score')
                      service_worker = report['lighthouse']['audits'].get('service-worker', {}).get('score')
                      report['checks']['chrome_installable_manifest'] = installable == 1
                      report['checks']['chrome_service_worker'] = service_worker == 1
                  except Exception as exc:
                      report['errors'].append(f'Lighthouse JSON: {exc}')
              else:
                  report['errors'].append('Lighthouse JSON report missing')

              core = [
                  'manifest_json_valid', 'manifest_has_name', 'manifest_has_start_url',
                  'manifest_start_url_same_origin', 'manifest_scope_same_origin',
                  'manifest_display_standalone', 'icon_192_http_ok', 'icon_512_http_ok',
                  'service_worker_script_shape', 'service_worker_not_html',
                  'service_worker_content_type_ok', 'install_ui_present_in_html',
                  'chrome_installable_manifest', 'chrome_service_worker'
              ]
              report['core_pass'] = all(report['checks'].get(key) is True for key in core)
              if not report['core_pass']:
                  summary['all_core_pass'] = False
              summary['sites'][site_id] = report
              (directory / 'validation.json').write_text(json.dumps(report, ensure_ascii=False, indent=2))

          (root / 'summary.json').write_text(json.dumps(summary, ensure_ascii=False, indent=2))

          lines = [
              '# 三站 PWA／手機 App Chrome 驗證', '',
              '| 站點 | 核心結果 | Manifest | 192/512 圖示 | Service Worker | Chrome 可安裝 | 安裝入口 |',
              '|---|---:|---:|---:|---:|---:|---:|',
          ]
          for site_id, report in summary['sites'].items():
              checks = report['checks']
              mark = lambda value: 'PASS' if value else 'FAIL'
              lines.append(
                  f"| {report['label']} | {mark(report['core_pass'])} | {mark(checks.get('manifest_json_valid') and checks.get('manifest_display_standalone'))} | "
                  f"{mark(checks.get('icon_192_http_ok') and checks.get('icon_512_http_ok'))} | {mark(checks.get('chrome_service_worker'))} | "
                  f"{mark(checks.get('chrome_installable_manifest'))} | {mark(checks.get('install_ui_present_in_html'))} |"
              )
          lines += ['', '詳細 HTTP headers、Manifest、Service Worker、Lighthouse JSON/HTML 與逐站 validation.json 均包含於 artifact。']
          (root / 'SUMMARY.md').write_text('\n'.join(lines))
          print('\n'.join(lines))
          PY

      - name: Upload PWA audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: pwa-browser-audit-20260826-${{ github.sha }}
          path: pwa-audit-20260826
          if-no-files-found: error
          retention-days: 14
