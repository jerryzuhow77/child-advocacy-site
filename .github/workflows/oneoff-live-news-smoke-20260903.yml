name: Verify live news publication

on:
  push:
    branches:
      - feat/news-section-lin-xinci-20260903
    paths:
      - '.github/workflows/oneoff-live-news-smoke-20260903.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: oneoff-live-news-smoke-20260903
  cancel-in-progress: false

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout smoke-test branch
        uses: actions/checkout@v4
        with:
          ref: feat/news-section-lin-xinci-20260903
          fetch-depth: 0

      - name: Verify public GitHub Pages routes and rendered home section
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://jerryzuhow77.github.io/child-advocacy-site'
          SOURCE='https://www.nexttv.com.tw/NextTV/News/Home/Society/m/2026-09-02/2455025.html'

          wait_for_content() {
            local url="$1"
            local needle="$2"
            local output="$3"
            for attempt in $(seq 1 36); do
              if curl --fail --silent --show-error --location \
                --header 'Cache-Control: no-cache' \
                "${url}?live-smoke=20260903-${attempt}" > "$output" \
                && grep -Fq "$needle" "$output"; then
                return 0
              fi
              sleep 5
            done
            echo "Timed out waiting for live content: $url :: $needle" >&2
            return 1
          }

          wait_for_content "$BASE/news/lin-xinci-nexttv-20260902/" '林心慈案首度開庭' /tmp/article-hant.html
          grep -Fq "$SOURCE" /tmp/article-hant.html
          grep -Fq 'media-report-paper-clay-20260903.css' /tmp/article-hant.html

          wait_for_content "$BASE/news/lin-xinci-nexttv-20260902/zh-Hans/" '林心慈案首次开庭' /tmp/article-hans.html
          grep -Fq "$SOURCE" /tmp/article-hans.html

          wait_for_content "$BASE/en/news/lin-xinci-nexttv-20260902/" 'First hearing in the Lin Hsin-tzu case' /tmp/article-en.html
          grep -Fq "$SOURCE" /tmp/article-en.html

          wait_for_content "$BASE/ja/news/lin-xinci-nexttv-20260902/" '林心慈事件、初公判' /tmp/article-ja.html
          grep -Fq "$SOURCE" /tmp/article-ja.html

          wait_for_content "$BASE/assets/home-media-reports-20260903.js" 'home-media-reports' /tmp/live-module.js
          wait_for_content "$BASE/assets/home-media-reports-20260903.css" '.home-media-reports' /tmp/live-style.css

          BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$BROWSER"
          for attempt in $(seq 1 24); do
            "$BROWSER" \
              --headless=new \
              --no-sandbox \
              --disable-gpu \
              --disable-dev-shm-usage \
              --disable-background-networking \
              --disable-application-cache \
              --disk-cache-size=1 \
              --virtual-time-budget=15000 \
              --dump-dom "$BASE/?live-browser-smoke=20260903-${attempt}" > /tmp/live-home.html
            if grep -Fq 'id="home-media-reports"' /tmp/live-home.html \
              && grep -Fq '林心慈案首度開庭' /tmp/live-home.html \
              && grep -Fq 'news/lin-xinci-nexttv-20260902/' /tmp/live-home.html; then
              break
            fi
            if [ "$attempt" -eq 24 ]; then
              echo 'Live home section did not render after retries.' >&2
              exit 1
            fi
            sleep 5
          done

          python3 - <<'PY'
          from pathlib import Path
          text = Path('/tmp/live-home.html').read_text(encoding='utf-8')
          assert text.count('id="home-media-reports"') == 1
          assert text.index('id="news-flash"') < text.index('id="home-media-reports"')
          print('Live homepage and all four article routes are published and verified.')
          PY

      - name: Remove one-off workflow
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/oneoff-live-news-smoke-20260903.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m 'chore: finish live news publication smoke test'
            git push origin HEAD:feat/news-section-lin-xinci-20260903
          fi
