name: Global Protection map authorized-channel fallback 20260825

on:
  push:
    branches:
      - ops/global-protection-map-autofix-20260825
    paths:
      - .github/workflows/global-protection-map-auth-fallback-deploy-20260825.yml
      - handoffs/global-protection-map-autofix-20260825/ops/verify_live_browser.py

permissions:
  contents: read
  actions: read

concurrency:
  group: global-protection-map-authorized-fallback-20260825
  cancel-in-progress: false

jobs:
  deploy:
    name: Try every authorized SSH credential name, then verify live behavior
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      DEFAULT_HOST: 150.109.69.104
      DEFAULT_USER: ubuntu
      DEFAULT_PORT: "22"
      HANDOFF_DIR: handoffs/global-protection-map-autofix-20260825
      PATCH_ID: global-protection-map-autofix-20260825
    steps:
      - name: Check out verified operations scripts
        uses: actions/checkout@v4

      - name: Download the latest integrity-verified prepared package
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          umask 077
          mkdir -p deploy-output prepared
          curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts?name=global-protection-map-autofix-prepared-20260825&per_page=100" \
            -o deploy-output/artifacts.json
          artifact_id="$(python3 - <<'PY'
          import json
          data=json.load(open('deploy-output/artifacts.json'))
          branch='ops/global-protection-map-autofix-20260825'
          items=[a for a in data.get('artifacts',[]) if not a.get('expired') and (a.get('workflow_run') or {}).get('head_branch')==branch]
          if not items:
              raise SystemExit('No prepared artifact found for the repair branch')
          print(max(items,key=lambda a:a['id'])['id'])
          PY
          )"
          curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" \
            -o deploy-output/prepared.zip
          unzip -q deploy-output/prepared.zip -d prepared
          tarball="$(find prepared -type f -name 'global-protection-map-autofix-20260825.tar.gz' -print -quit)"
          [[ -n "$tarball" ]]
          cp "$tarball" deploy-output/global-protection-map-autofix-20260825.tar.gz
          tar -tzf deploy-output/global-protection-map-autofix-20260825.tar.gz > deploy-output/package-list.txt
          grep -q './ops/deploy_map_autofix.sh' deploy-output/package-list.txt
          grep -q './assets/tw/guardian-wall-D4pS1Kwy.js' deploy-output/package-list.txt
          grep -q './assets/hk/guardian-wall-2CHQLdmM.js' deploy-output/package-list.txt

      - name: Detect alternate authorized SSH keys or passwords
        id: auth
        shell: bash
        env:
          TENCENT_SSH_HOST: ${{ secrets.TENCENT_SSH_HOST }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          TENCENT_HOST: ${{ secrets.TENCENT_HOST }}
          TENCENT_SSH_USER: ${{ secrets.TENCENT_SSH_USER }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          TENCENT_USER: ${{ secrets.TENCENT_USER }}
          TENCENT_SSH_PORT: ${{ secrets.TENCENT_SSH_PORT }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          TENCENT_SSH_PRIVATE_KEY: ${{ secrets.TENCENT_SSH_PRIVATE_KEY }}
          TENCENT_CVM_SSH_KEY: ${{ secrets.TENCENT_CVM_SSH_KEY }}
          TENCENT_SSH_KEY: ${{ secrets.TENCENT_SSH_KEY }}
          TENCENT_PRIVATE_KEY: ${{ secrets.TENCENT_PRIVATE_KEY }}
          TENCENT_CLOUD_SSH_KEY: ${{ secrets.TENCENT_CLOUD_SSH_KEY }}
          TENCENT_KEY: ${{ secrets.TENCENT_KEY }}
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_PRIVATE_KEY: ${{ secrets.DEPLOY_PRIVATE_KEY }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          SERVER_SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_PRIVATE_KEY }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          TENCENT_SSH_PASSWORD: ${{ secrets.TENCENT_SSH_PASSWORD }}
          TENCENT_CVM_PASSWORD: ${{ secrets.TENCENT_CVM_PASSWORD }}
          TENCENT_PASSWORD: ${{ secrets.TENCENT_PASSWORD }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
          DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
        run: |
          set -Eeuo pipefail
          umask 077
          host="${TENCENT_SSH_HOST:-${SSH_HOST:-${SERVER_HOST:-${DEPLOY_HOST:-${TENCENT_HOST:-$DEFAULT_HOST}}}}}"
          user_name="${TENCENT_SSH_USER:-${SSH_USER:-${SERVER_USER:-${DEPLOY_USER:-${TENCENT_USER:-$DEFAULT_USER}}}}}"
          port="${TENCENT_SSH_PORT:-${SSH_PORT:-${SERVER_PORT:-${DEPLOY_PORT:-$DEFAULT_PORT}}}}"
          mode=none
          source_name=none
          value=''
          for name in \
            TENCENT_SSH_PRIVATE_KEY TENCENT_CVM_SSH_KEY TENCENT_SSH_KEY \
            TENCENT_PRIVATE_KEY TENCENT_CLOUD_SSH_KEY TENCENT_KEY \
            DEPLOY_SSH_PRIVATE_KEY DEPLOY_PRIVATE_KEY DEPLOY_KEY \
            SERVER_SSH_PRIVATE_KEY SERVER_SSH_KEY SSH_PRIVATE_KEY SSH_KEY; do
            candidate="${!name:-}"
            if [[ -n "$candidate" ]]; then mode=key; source_name="$name"; value="$candidate"; break; fi
          done
          if [[ "$mode" == none ]]; then
            for name in \
              TENCENT_SSH_PASSWORD TENCENT_CVM_PASSWORD TENCENT_PASSWORD \
              SSH_PASSWORD SERVER_PASSWORD DEPLOY_PASSWORD; do
              candidate="${!name:-}"
              if [[ -n "$candidate" ]]; then mode=password; source_name="$name"; value="$candidate"; break; fi
            done
          fi
          if [[ "$mode" == key ]]; then
            printf '%s\n' "$value" > deploy-output/id_authorized
            chmod 600 deploy-output/id_authorized
          elif [[ "$mode" == password ]]; then
            printf '%s' "$value" > deploy-output/authorized_password
            chmod 600 deploy-output/authorized_password
          fi
          echo "available=$([[ "$mode" != none ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "host=$host" >> "$GITHUB_OUTPUT"
          echo "user_name=$user_name" >> "$GITHUB_OUTPUT"
          echo "port=$port" >> "$GITHUB_OUTPUT"
          cat > deploy-output/auth-presence.json <<JSON
          {
            "authorized_channel_available": $([[ "$mode" != none ]] && echo true || echo false),
            "authentication_mode": "$mode",
            "authentication_source": "$source_name",
            "production_mutated": false
          }
          JSON

      - name: Deploy package with automatic backup and rollback generation
        id: deploy
        if: steps.auth.outputs.available == 'true'
        shell: bash
        env:
          TENCENT_APP_PATH: ${{ secrets.TENCENT_APP_PATH }}
          APP_PATH: ${{ secrets.APP_PATH }}
          DEPLOY_APP_PATH: ${{ secrets.DEPLOY_APP_PATH }}
        run: |
          set -Eeuo pipefail
          umask 077
          mode='${{ steps.auth.outputs.mode }}'
          host='${{ steps.auth.outputs.host }}'
          user_name='${{ steps.auth.outputs.user_name }}'
          port='${{ steps.auth.outputs.port }}'
          app_path="${TENCENT_APP_PATH:-${APP_PATH:-${DEPLOY_APP_PATH:-}}}"
          common=(-o ConnectTimeout=15 -o ServerAliveInterval=10 -o ServerAliveCountMax=3 -o StrictHostKeyChecking=accept-new)
          if [[ "$mode" == key ]]; then
            ssh_base=(ssh -i deploy-output/id_authorized -p "$port" "${common[@]}" -o BatchMode=yes)
            scp_base=(scp -q -i deploy-output/id_authorized -P "$port" "${common[@]}" -o BatchMode=yes)
          else
            sudo apt-get update -qq
            sudo apt-get install -y -qq sshpass
            export SSHPASS="$(cat deploy-output/authorized_password)"
            ssh_base=(sshpass -e ssh -p "$port" "${common[@]}" -o BatchMode=no -o PreferredAuthentications=password -o PubkeyAuthentication=no)
            scp_base=(sshpass -e scp -q -P "$port" "${common[@]}" -o BatchMode=no -o PreferredAuthentications=password -o PubkeyAuthentication=no)
          fi
          remote_tar=/tmp/global-protection-map-autofix-20260825.tar.gz
          remote_root=/tmp/global-protection-map-autofix-20260825
          "${scp_base[@]}" deploy-output/global-protection-map-autofix-20260825.tar.gz "${user_name}@${host}:${remote_tar}"
          printf -v app_q '%q' "$app_path"
          printf -v tar_q '%q' "$remote_tar"
          printf -v root_q '%q' "$remote_root"
          "${ssh_base[@]}" "${user_name}@${host}" \
            "APP_DIR=$app_q PACKAGE_TAR=$tar_q PACKAGE_DIR=$root_q bash -s" <<'REMOTE' \
            | tee deploy-output/remote-deploy.log
          set -Eeuo pipefail
          umask 077
          rm -rf "$PACKAGE_DIR"
          mkdir -p "$PACKAGE_DIR"
          tar -xzf "$PACKAGE_TAR" -C "$PACKAGE_DIR"
          chmod 700 "$PACKAGE_DIR/ops/deploy_map_autofix.sh"
          args=(--site auto --purge-cache no)
          [[ -n "${APP_DIR:-}" ]] && args+=(--app-dir "$APP_DIR")
          runner=(bash)
          if [[ "$(id -u)" -ne 0 ]] && command -v sudo >/dev/null 2>&1 && sudo -n true 2>/dev/null; then
            runner=(sudo -n bash)
          fi
          "${runner[@]}" "$PACKAGE_DIR/ops/deploy_map_autofix.sh" "${args[@]}" \
            | tee /tmp/global-protection-map-autofix-dry-run.log
          "${runner[@]}" "$PACKAGE_DIR/ops/deploy_map_autofix.sh" "${args[@]}" --execute \
            | tee /tmp/global-protection-map-autofix-execute.log
          grep -q 'Execution complete' /tmp/global-protection-map-autofix-execute.log
          REMOTE
          "${scp_base[@]}" "${user_name}@${host}:/tmp/global-protection-map-autofix-dry-run.log" deploy-output/remote-dry-run.log || true
          "${scp_base[@]}" "${user_name}@${host}:/tmp/global-protection-map-autofix-execute.log" deploy-output/remote-execute.log || true
          echo 'completed=true' >> "$GITHUB_OUTPUT"

      - name: Record that no alternate authorized channel exists
        if: steps.auth.outputs.available != 'true'
        shell: bash
        run: |
          cat > deploy-output/fallback-status.json <<'JSON'
          {
            "status": "not_executed",
            "reason": "no_supported_authorized_key_or_password_secret_found_under_known_names",
            "production_mutated": false
          }
          JSON

      - name: Verify public assets and message data
        id: edge
        if: steps.deploy.outputs.completed == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          for attempt in $(seq 1 12); do
            if python3 "$HANDOFF_DIR/ops/verify_live_after_deploy.py" \
              --site auto --timeout 35 --output deploy-output/live-verification.json; then
              echo 'passed=true' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 10
          done
          exit 1

      - name: Install Chromium for live interaction checks
        if: steps.edge.outputs.passed == 'true'
        shell: bash
        run: |
          python3 -m pip install --disable-pip-version-check playwright==1.54.0
          python3 -m playwright install --with-deps chromium

      - name: Verify marker filtering, selector synchronization, London, and persistent globe
        if: steps.edge.outputs.passed == 'true'
        shell: bash
        run: |
          python3 "$HANDOFF_DIR/ops/verify_live_browser.py" --site auto --output-dir deploy-output

      - name: Write sanitized final status
        if: always()
        shell: bash
        run: |
          cat > deploy-output/fallback-final-status.json <<JSON
          {
            "authorized_channel_available": $([[ '${{ steps.auth.outputs.available }}' == true ]] && echo true || echo false),
            "production_deploy_completed": $([[ '${{ steps.deploy.outputs.completed }}' == true ]] && echo true || echo false),
            "public_edge_verified": $([[ '${{ steps.edge.outputs.passed }}' == true ]] && echo true || echo false),
            "browser_verification_created": $([[ -f deploy-output/live-browser-verification.json ]] && echo true || echo false),
            "data_or_api_mutated": false
          }
          JSON
          {
            echo '## Authorized-channel fallback result'
            echo
            echo '```json'
            cat deploy-output/fallback-final-status.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload sanitized evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: global-protection-map-authorized-fallback-result-20260825
          path: |
            deploy-output/*.json
            deploy-output/*.log
            deploy-output/*.png
          if-no-files-found: warn
          retention-days: 14
