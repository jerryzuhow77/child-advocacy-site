name: Final dual-track responsibility browser check

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oneoff-kaikai-dual-track-final-check-20260829.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply final path and verifier corrections
        run: |
          git pull --rebase origin main
          python3 .github/scripts/finalize-kaikai-dual-track-pair-20260829.py
          node --check .github/scripts/verify-kaikai-dual-track-pair-20260829.mjs
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hearing-records/prison-watch/kaikai-final-chapter/zh-Hans/index.html
          git add .github/scripts/verify-kaikai-dual-track-pair-20260829.mjs
          git commit -m 'Fix and verify bilingual dual-track responsibility layout'
          git push origin HEAD:main

      - name: Wait for the corrected public version
        run: python3 .github/scripts/wait-kaikai-dual-track-live-20260829.py

      - name: Install Playwright driver
        run: npm install --no-save playwright-core@1.55.0

      - name: Verify public desktop and mobile layouts
        run: node .github/scripts/verify-kaikai-dual-track-pair-20260829.mjs

      - name: Upload final browser proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kaikai-dual-track-pair-final-browser-proof
          path: browser-validation/dual-track-pair
          retention-days: 14

      - name: Remove completed one-off tools
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main
          git rm -f .github/workflows/oneoff-kaikai-dual-track-pair-20260829.yml
          git rm -f .github/workflows/oneoff-kaikai-dual-track-pair-v2-20260829.yml
          git rm -f .github/workflows/oneoff-kaikai-dual-track-finalize-20260829.yml
          git rm -f .github/workflows/oneoff-kaikai-dual-track-final-check-20260829.yml
          git rm -f .github/scripts/render-kaikai-dual-track-hans-20260829.py
          git rm -f .github/scripts/place-kaikai-dual-track-poster-20260829.py
          git rm -f .github/scripts/prepare-kaikai-dual-track-source-20260829.py
          git rm -f .github/scripts/verify-kaikai-dual-track-pair-20260829.mjs
          git rm -f .github/scripts/finalize-kaikai-dual-track-pair-20260829.py
          git rm -f .github/scripts/wait-kaikai-dual-track-live-20260829.py
          git commit -m 'Remove completed dual-track responsibility publication tools'
          git push origin HEAD:main
