name: Keep sitemap synchronized

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - '**/index.html'
      - 'scripts/sync_sitemap.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: child-advocacy-site-sitemap
  cancel-in-progress: false

jobs:
  sitemap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild sitemap
        run: python3 scripts/sync_sitemap.py

      - name: Publish sitemap only when changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- sitemap.xml
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m 'Keep sitemap synchronized with public pages'
          git pull --rebase origin main
          git push
