name: Keep sitemap synchronized

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - '**/index.html'
      - 'scripts/sync_sitemap.py'
      - '.github/scripts/verify-chapter-two-publication.py'
      - '.github/workflows/sitemap-auto-sync.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: child-advocacy-site-sitemap
  cancel-in-progress: false

jobs:
  sitemap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild and publish sitemap from a fresh main snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          for attempt in 1 2 3 4 5; do
            # A queued run may have started before later public pages were
            # committed. Re-create its worktree from remote main for every
            # attempt so it can never publish an earlier sitemap snapshot.
            git fetch origin main --prune
            git checkout -B main origin/main

            python3 scripts/sync_sitemap.py
            python3 scripts/sync_sitemap.py
            python3 .github/scripts/verify-chapter-two-publication.py

            git add -- sitemap.xml
            git diff --cached --check
            git diff --cached --quiet && exit 0
            git commit -m 'Keep sitemap synchronized with public pages'

            if git push origin HEAD:main; then
              exit 0
            fi
          done

          echo 'Unable to publish a sitemap built from the current main after 5 attempts.' >&2
          exit 1
