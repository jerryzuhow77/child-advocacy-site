name: Kaikai medical and witness responsive regression

on:
  push:
    branches: [main]
    paths:
      - 'hearing-records/prison-watch/kaikai-final-chapter/medical-responsibility/**'
      - 'hearing-records/prison-watch/kaikai-final-chapter/witnesses/**'
      - 'hearing-records/prison-watch/kaikai-final-chapter/zh-Hans/witnesses/**'
      - '.github/workflows/kaikai-medical-witness-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chrome-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Wait for corrected Pages content
        shell: bash
        run: |
          set -euo pipefail
          medical='https://jerryzuhow77.github.io/child-advocacy-site/hearing-records/prison-watch/kaikai-final-chapter/medical-responsibility/'
          witness='https://jerryzuhow77.github.io/child-advocacy-site/hearing-records/prison-watch/kaikai-final-chapter/witnesses/'
          for attempt in $(seq 1 90); do
            token="${GITHUB_SHA}-${attempt}-$(date +%s)"
            medical_html="$(curl -fsSL --connect-timeout 15 --max-time 30 "${medical}?qa=${token}" || true)"
            witness_html="$(curl -fsSL --connect-timeout 15 --max-time 30 "${witness}?qa=${token}" || true)"
            if grep -q 'id="page-top"' <<<"$medical_html" \
              && grep -q 'id="witness-10-video-review"' <<<"$medical_html" \
              && grep -q 'id="witness-09"' <<<"$witness_html" \
              && ! grep -q 'medical-responsibility' <<<"$witness_html"; then
              echo 'Corrected public pages detected.'
              exit 0
            fi
            sleep 10
          done
          echo 'Timed out waiting for corrected public pages.' >&2
          exit 1

      - name: Install Playwright
        run: npm install --no-save playwright-core@1.55.0

      - name: Verify desktop and mobile layouts, anchors and assets
        shell: bash
        run: |
          mkdir -p browser-validation/kaikai-medical-witness
          node --input-type=module <<'JS'
          import { chromium } from 'playwright-core';
          import fs from 'node:fs';

          const root = 'https://jerryzuhow77.github.io/child-advocacy-site/hearing-records/prison-watch/kaikai-final-chapter/';
          const sites = [
            { name: 'medical-zh-Hant', type: 'medical', url: root + 'medical-responsibility/' },
            { name: 'medical-zh-Hans', type: 'medical', url: root + 'medical-responsibility/zh-Hans/' },
            { name: 'witness-zh-Hant', type: 'witness', url: root + 'witnesses/' },
            { name: 'witness-zh-Hans', type: 'witness', url: root + 'zh-Hans/witnesses/' }
          ];
          const viewports = [
            { name: 'desktop', width: 1440, height: 1000 },
            { name: 'mobile-390', width: 390, height: 844 },
            { name: 'mobile-320', width: 320, height: 760 }
          ];
          const medicalAnchors = ['dental-warning','medical-network-omissions','medical-investigation-sources','cai-hanyu','witness-10-role-gap','witness-10-video-review','cai-hanyu-transcript','emergency','sources','page-top'];
          const browser = await chromium.launch({ headless: true, executablePath: '/usr/bin/google-chrome', args: ['--no-sandbox','--disable-dev-shm-usage'] });
          const results = [];

          for (const site of sites) {
            for (const viewport of viewports) {
              const context = await browser.newContext({ viewport: { width: viewport.width, height: viewport.height } });
              const page = await context.newPage();
              const item = { site: site.name, viewport: viewport.name, status: null, overflow: null, broken: [], missingAnchors: [], pageErrors: [], fatal: [] };
              results.push(item);
              page.on('pageerror', error => item.pageErrors.push(String(error)));
              try {
                const response = await page.goto(site.url + '?qa=' + Date.now() + '-' + viewport.name, { waitUntil: 'domcontentloaded', timeout: 60000 });
                await page.waitForTimeout(1400);
                item.status = response?.status() ?? null;
                item.overflow = await page.evaluate(() => Math.max(document.documentElement.scrollWidth, document.body.scrollWidth) - innerWidth);
                item.widest = await page.evaluate(() => [...document.querySelectorAll('body *')].map((el, index) => {
                  const r = el.getBoundingClientRect();
                  const style = getComputedStyle(el);
                  return { index, tag: el.tagName, id: el.id || '', cls: String(el.className || '').slice(0,90), left: Math.round(r.left), right: Math.round(r.right), width: Math.round(r.width), scrollWidth: el.scrollWidth, minWidth: style.minWidth, whiteSpace: style.whiteSpace, text: (el.textContent || '').trim().replace(/\s+/g,' ').slice(0,80) };
                }).filter(x => x.right > innerWidth + 1 || x.left < -1 || x.scrollWidth > Math.ceil(x.width) + 2).sort((a,b) => Math.max(b.right-innerWidth,b.scrollWidth-b.width) - Math.max(a.right-innerWidth,a.scrollWidth-a.width)).slice(0,20));
                item.broken = await page.locator('img').evaluateAll(images => images.filter(img => img.complete && img.naturalWidth === 0).map(img => img.currentSrc || img.src));
                item.missingAnchors = await page.locator('a[href^="#"]').evaluateAll(links => [...new Set(links.map(a => a.getAttribute('href')).filter(h => h && h !== '#' && !document.querySelector(h)))]);
                if (site.type === 'medical') {
                  for (const id of medicalAnchors) {
                    if (await page.locator('#' + id).count() !== 1) item.fatal.push('#' + id + ' count mismatch');
                  }
                  for (const id of ['witness-10-video-review','cai-hanyu-transcript','emergency']) {
                    await page.goto(site.url + '?qa=' + Date.now() + '#' + id, { waitUntil: 'domcontentloaded', timeout: 60000 });
                    await page.waitForTimeout(700);
                    const state = await page.locator('#' + id).evaluate(el => {
                      const r = el.getBoundingClientRect();
                      return { top: Math.round(r.top), visible: r.bottom > 0 && r.top < innerHeight, opacity: Number(getComputedStyle(el).opacity) };
                    });
                    if (!state.visible || state.opacity < .99) item.fatal.push('#' + id + ' deep link invisible');
                  }
                } else {
                  const cards = await page.locator('[data-witness-card]').count();
                  if (cards !== 12) item.fatal.push('witness card count ' + cards);
                  const medicalLinks = await page.locator('a[href*="medical-responsibility"]').count();
                  if (medicalLinks !== 0) item.fatal.push('unpublished medical link count ' + medicalLinks);
                  const movedCards = await page.locator('.moved-witness-card').count();
                  if (movedCards !== 0) item.fatal.push('moved witness card is still public');
                }
                if (item.status !== 200) item.fatal.push('HTTP ' + item.status);
                if (item.overflow > 2) item.fatal.push('horizontal overflow ' + item.overflow + 'px');
                if (item.broken.length) item.fatal.push(item.broken.length + ' broken image(s)');
                if (item.missingAnchors.length) item.fatal.push('missing anchors: ' + item.missingAnchors.join(', '));
                if (item.pageErrors.length) item.fatal.push(item.pageErrors.length + ' page error(s)');
              } catch (error) {
                item.fatal.push('exception: ' + (error?.message || error));
              }
              await context.close();
            }
          }

          await browser.close();
          fs.writeFileSync('browser-validation/kaikai-medical-witness/report.json', JSON.stringify({ generatedAt: new Date().toISOString(), results }, null, 2));
          for (const r of results) console.log(JSON.stringify(r));
          const failed = results.filter(r => r.fatal.length);
          if (failed.length) {
            console.error(JSON.stringify({ failed }, null, 2));
            process.exit(1);
          }
          JS

      - name: Upload regression report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kaikai-medical-witness-regression
          path: browser-validation/kaikai-medical-witness
          retention-days: 14
