name: One-off fix Kaikai Chapter 2 mobile layout

on:
  push:
    branches:
      - fix/kaikai-ch2-mobile-layout-20260829

permissions:
  contents: write

concurrency:
  group: fix-kaikai-ch2-mobile-layout-20260829
  cancel-in-progress: false

jobs:
  patch-test-commit:
    if: ${{ !contains(github.event.head_commit.message, '[mobile-layout-fixed]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out fix branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Apply narrow-screen title and search-field fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          base = Path('hearing-records/prison-watch/kaikai-final-chapter')
          css_path = base / 'final-chapter.css'
          html_paths = [base / 'index.html', base / 'zh-Hans' / 'index.html']
          marker = '/* 2026-08-29 · final narrow-screen containment */'
          override = r'''

/* 2026-08-29 · final narrow-screen containment */
@media(max-width:760px){
  .hero h1{font-size:clamp(32px,9.5vw,38px);white-space:nowrap}
  .journey-tools{grid-template-columns:minmax(0,1fr)}
  .journey-tools label,.journey-tools input,.journey-tools p{min-width:0}
  .journey-tools input{width:100%;max-width:100%}
}
'''

          css = css_path.read_text(encoding='utf-8')
          if marker in css:
              raise SystemExit('Narrow-screen override already exists')
          css_path.write_text(css.rstrip() + override, encoding='utf-8')

          for html_path in html_paths:
              html = html_path.read_text(encoding='utf-8')
              old = 'final-chapter.css?v=20260828-17'
              new = 'final-chapter.css?v=20260829-18'
              if html.count(old) != 1:
                  raise SystemExit(f'{html_path}: expected exactly one {old}')
              html_path.write_text(html.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Static validation
        shell: bash
        run: |
          git diff --check
          grep -F '/* 2026-08-29 · final narrow-screen containment */' hearing-records/prison-watch/kaikai-final-chapter/final-chapter.css
          grep -F '.hero h1{font-size:clamp(32px,9.5vw,38px);white-space:nowrap}' hearing-records/prison-watch/kaikai-final-chapter/final-chapter.css
          grep -F '.journey-tools input{width:100%;max-width:100%}' hearing-records/prison-watch/kaikai-final-chapter/final-chapter.css
          grep -R -F 'final-chapter.css?v=20260829-18' hearing-records/prison-watch/kaikai-final-chapter/index.html hearing-records/prison-watch/kaikai-final-chapter/zh-Hans/index.html

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Playwright driver
        run: npm install --no-save playwright-core@1.55.0

      - name: Run local Google Chrome regression matrix
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p browser-validation/mobile-layout-fix
          python -m http.server 4173 > "$RUNNER_TEMP/kaikai-mobile-layout-http.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          ready=0
          for i in {1..30}; do
            if curl -fsS 'http://127.0.0.1:4173/hearing-records/prison-watch/kaikai-final-chapter/' >/dev/null; then ready=1; break; fi
            sleep 1
          done
          [[ "$ready" -eq 1 ]]

          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import path from 'node:path';
          import { chromium } from 'playwright-core';

          const root = 'http://127.0.0.1:4173/hearing-records/prison-watch/kaikai-final-chapter/';
          const output = path.resolve('browser-validation/mobile-layout-fix');
          const locales = [
            { name: 'zh-Hant', path: '', search: '周保母', title: '沒人要的孩子？', temperature: '急診醫師證詞：到院體溫約24°C' },
            { name: 'zh-Hans', path: 'zh-Hans/', search: '周保母', title: '没人要的孩子？', temperature: '急诊医师证词：到院体温约24°C' }
          ];
          const viewports = [
            { name: 'desktop', width: 1440, height: 1000 },
            { name: 'mobile', width: 390, height: 844 },
            { name: 'narrow-360', width: 360, height: 800 },
            { name: 'narrow-320', width: 320, height: 780 }
          ];
          const anchors = [
            'evidence-atlas', 'witness-conflicts', 'blood-boundary', 'restraint-boundary',
            'responsibility-orbit', 'death-temperature-evidence', 'dental-warning', 'placement-spectrum'
          ];
          const failures = [];
          const observations = [];
          let nonce = 0;
          const browser = await chromium.launch({
            headless: true,
            executablePath: '/usr/bin/google-chrome',
            args: ['--no-sandbox', '--disable-dev-shm-usage']
          });

          const url = (locale, hash = '') => `${root}${locale.path}?qa=${Date.now()}-${++nonce}${hash}`;
          const fail = (label, detail) => failures.push(`${label}: ${JSON.stringify(detail)}`);

          async function session(locale, viewport, mode = 'guided') {
            const context = await browser.newContext({ viewport: { width: viewport.width, height: viewport.height } });
            await context.addInitScript((value) => localStorage.setItem('kaikai-final-reading-depth-v1', value), mode);
            const page = await context.newPage();
            const errors = [];
            page.on('pageerror', (error) => errors.push(String(error)));
            return { context, page, errors };
          }

          async function open(page, target, settle = 1000) {
            const response = await page.goto(target, { waitUntil: 'domcontentloaded', timeout: 45000 });
            await page.waitForLoadState('load', { timeout: 45000 }).catch(() => undefined);
            await page.waitForTimeout(settle);
            return response;
          }

          async function layout(page) {
            return page.evaluate(() => {
              const heading = document.querySelector('.hero h1');
              const node = [...heading.childNodes].find((item) => item.nodeType === Node.TEXT_NODE && item.textContent.trim());
              const range = document.createRange();
              range.selectNodeContents(node);
              const search = document.querySelector('#lifeSearch').getBoundingClientRect();
              return {
                titleLines: range.getClientRects().length,
                whiteSpace: getComputedStyle(heading).whiteSpace,
                overflow: Math.max(document.documentElement.scrollWidth, document.body.scrollWidth) - innerWidth,
                searchLeft: Math.round(search.left), searchRight: Math.round(search.right), searchWidth: Math.round(search.width),
                viewport: innerWidth,
                columns: getComputedStyle(document.querySelector('.journey-tools')).gridTemplateColumns,
                cssVersion: [...document.querySelectorAll('link[rel="stylesheet"]')].map((link) => link.href).find((href) => href.includes('final-chapter.css')) || ''
              };
            });
          }

          async function anchorState(page, id) {
            return page.locator(`#${id}`).evaluate((element) => {
              const rect = element.getBoundingClientRect();
              const style = getComputedStyle(element);
              return {
                top: Math.round(rect.top), bottom: Math.round(rect.bottom), opacity: Number(style.opacity),
                hidden: element.hidden, display: style.display, visibility: style.visibility,
                inViewport: rect.top < innerHeight && rect.bottom > 0
              };
            });
          }

          for (const locale of locales) {
            for (const viewport of viewports) {
              const s = await session(locale, viewport);
              const response = await open(s.page, url(locale));
              const state = await layout(s.page);
              const text = await s.page.evaluate(() => ({
                title: document.querySelector('h1')?.innerText || '',
                temperature: document.querySelector('#death-temperature-evidence')?.textContent || '',
                atlas: document.querySelector('#evidence-atlas')?.textContent || ''
              }));
              observations.push({ test: 'layout', locale: locale.name, viewport: viewport.name, status: response?.status(), state, text, errors: s.errors });
              if (!response || response.status() !== 200) fail(`${locale.name}/${viewport.name} HTTP`, response?.status());
              if (!text.title.includes(locale.title) || !text.temperature.includes(locale.temperature) || !text.atlas.trim()) fail(`${locale.name}/${viewport.name} content`, text);
              if (state.overflow > 2 || state.searchLeft < 0 || state.searchRight > viewport.width + 1) fail(`${locale.name}/${viewport.name} horizontal`, state);
              if (viewport.name !== 'desktop' && (state.titleLines !== 1 || state.whiteSpace !== 'nowrap')) fail(`${locale.name}/${viewport.name} title`, state);
              if (viewport.name === 'narrow-320' && state.searchWidth > viewport.width - 20) fail(`${locale.name}/${viewport.name} search`, state);
              if (!state.cssVersion.includes('20260829-18')) fail(`${locale.name}/${viewport.name} CSS version`, state);
              if (s.errors.length) fail(`${locale.name}/${viewport.name} page errors`, s.errors);
              if (locale.name === 'zh-Hant') await s.page.screenshot({ path: path.join(output, `${locale.name}-${viewport.name}-top.png`), fullPage: false });
              await s.context.close();
            }
          }

          for (const locale of locales) {
            const s = await session(locale, viewports[1], 'quick');
            await open(s.page, url(locale));
            await s.page.locator('#lifeSearch').fill(locale.search);
            await s.page.waitForTimeout(250);
            const search = await s.page.evaluate((term) => {
              const normalize = (value) => value.toLocaleLowerCase().replace(/\s+/g, ' ').trim();
              const query = normalize(term);
              const events = [...document.querySelectorAll('#lifeTimeline .life-event')];
              const matches = events.filter((event) => normalize(`${event.dataset.search || ''} ${event.textContent || ''}`).includes(query));
              return {
                active: document.body.classList.contains('life-search-active'),
                matches: matches.length,
                visible: matches.filter((event) => !event.hidden && getComputedStyle(event).display !== 'none' && event.getClientRects().length).length
              };
            }, locale.search);
            observations.push({ test: 'search', locale: locale.name, search });
            if (!search.active || search.matches < 1 || search.visible !== search.matches) fail(`${locale.name} search`, search);

            await s.page.locator('#menuButton').click();
            await s.page.locator('.nav-group').filter({ has: s.page.locator('a[href="#evidence-atlas"]') }).evaluate((element) => { element.open = true; });
            await s.page.locator('#siteNav a[href="#evidence-atlas"]').click();
            await s.page.waitForTimeout(1700);
            const menu = await anchorState(s.page, 'evidence-atlas');
            observations.push({ test: 'menu-anchor', locale: locale.name, menu });
            if (!menu.inViewport || menu.opacity < 0.99 || menu.hidden) fail(`${locale.name} menu`, menu);

            for (const id of anchors) {
              await open(s.page, url(locale, `#${id}`), 1700);
              const initial = await anchorState(s.page, id);
              await s.page.reload({ waitUntil: 'domcontentloaded', timeout: 45000 });
              await s.page.waitForLoadState('load', { timeout: 45000 }).catch(() => undefined);
              await s.page.waitForTimeout(1700);
              const reloaded = await anchorState(s.page, id);
              observations.push({ test: 'anchor', locale: locale.name, id, initial, reloaded });
              for (const [phase, state] of [['initial', initial], ['reload', reloaded]]) {
                if (!state.inViewport || state.opacity < 0.99 || state.hidden || state.display === 'none' || state.visibility === 'hidden') fail(`${locale.name} #${id} ${phase}`, state);
              }
            }
            if (s.errors.length) fail(`${locale.name} interactive page errors`, s.errors);
            await s.context.close();
          }

          const font = await session(locales[1], viewports[0]);
          await open(font.page, url(locales[1]));
          const fontState = await font.page.evaluate(async () => {
            await document.fonts.ready;
            const root = getComputedStyle(document.documentElement);
            return {
              sans: root.getPropertyValue('--sans').trim(),
              serif: root.getPropertyValue('--serif').trim(),
              sansLoaded: document.fonts.check('400 16px "Noto Sans SC"', '陈尚洁'),
              serifLoaded: document.fonts.check('700 32px "Noto Serif SC"', '证据责任'),
              missing: (document.body.innerText.match(/\uFFFD|□/g) || []).length
            };
          });
          observations.push({ test: 'fonts', fontState });
          if (!fontState.sans.includes('Noto Sans SC') || !fontState.serif.includes('Noto Serif SC') || !fontState.sansLoaded || !fontState.serifLoaded || fontState.missing) fail('zh-Hans fonts', fontState);
          await font.context.close();

          await browser.close();
          const report = { passed: failures.length === 0, failures, observations };
          fs.writeFileSync(path.join(output, 'report.json'), JSON.stringify(report, null, 2));
          fs.writeFileSync(path.join(output, 'summary.txt'), `Result: ${report.passed ? 'PASS' : 'FAIL'}\nFailures: ${failures.length}\n${failures.join('\n')}`);
          console.log(JSON.stringify(report, null, 2));
          if (failures.length) process.exit(1);
          JS

      - name: Upload local browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kaikai-chapter2-mobile-layout-fix-evidence
          path: browser-validation/mobile-layout-fix/
          if-no-files-found: error
          retention-days: 14

      - name: Commit verified source changes and remove one-off workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -- .github/workflows/oneoff-fix-kaikai-ch2-mobile-layout-20260829.yml
          git add hearing-records/prison-watch/kaikai-final-chapter/final-chapter.css
          git add hearing-records/prison-watch/kaikai-final-chapter/index.html
          git add hearing-records/prison-watch/kaikai-final-chapter/zh-Hans/index.html
          git diff --cached --check
          git commit -m 'Fix Chapter 2 narrow mobile layout [mobile-layout-fixed]'
          git push origin "HEAD:${{ github.ref_name }}"
