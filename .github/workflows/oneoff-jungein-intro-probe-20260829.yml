name: One-off Jungein production source probe

on:
  push:
    branches:
      - ops/jungein-intro-probe-20260829
    paths:
      - .github/workflows/oneoff-jungein-intro-probe-20260829.yml

permissions:
  contents: read

concurrency:
  group: oneoff-jungein-intro-probe-20260829
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DEFAULT_HOST: 150.109.69.104
      DEFAULT_USER: ubuntu
      DEFAULT_PORT: "22"
      DEFAULT_APP_PATH: /opt/global-protection
      TARGET_URL: https://cn.globalprotectionwall.com/historical-cases/korea/jungein
    steps:
      - uses: actions/checkout@v4

      - name: Inspect live route and optional production source without changing it
        shell: bash
        env:
          TENCENT_SSH_HOST: ${{ secrets.TENCENT_SSH_HOST }}
          TENCENT_SSH_USER: ${{ secrets.TENCENT_SSH_USER }}
          TENCENT_SSH_PORT: ${{ secrets.TENCENT_SSH_PORT }}
          TENCENT_SSH_PRIVATE_KEY: ${{ secrets.TENCENT_SSH_PRIVATE_KEY }}
          TENCENT_CVM_SSH_KEY: ${{ secrets.TENCENT_CVM_SSH_KEY }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          TENCENT_APP_PATH: ${{ secrets.TENCENT_APP_PATH }}
        run: |
          set -Eeuo pipefail
          umask 077
          mkdir -p probe-output/live-assets

          HOST="${TENCENT_SSH_HOST:-$DEFAULT_HOST}"
          USER_NAME="${TENCENT_SSH_USER:-$DEFAULT_USER}"
          PORT="${TENCENT_SSH_PORT:-$DEFAULT_PORT}"
          APP_PATH="${TENCENT_APP_PATH:-$DEFAULT_APP_PATH}"
          SSH_KEY="${TENCENT_SSH_PRIVATE_KEY:-${TENCENT_CVM_SSH_KEY:-${SSH_PRIVATE_KEY:-}}}"

          curl --fail --silent --show-error --location --max-time 30 \
            -A 'JungeinReadOnlyProbe/20260829' \
            -D probe-output/live-headers.txt \
            -w '%{url_effective}\n%{http_code}\n%{content_type}\n' \
            "$TARGET_URL" \
            -o probe-output/live-page.html \
            > probe-output/live-response-meta.txt

          python3 - <<'PY'
          import html
          import json
          import pathlib
          import re
          import urllib.parse
          import urllib.request

          root = pathlib.Path('probe-output')
          page = (root / 'live-page.html').read_text('utf-8', errors='replace')
          base = 'https://cn.globalprotectionwall.com/historical-cases/korea/jungein'
          urls = []
          for attr in ('src', 'href'):
              for value in re.findall(rf'{attr}=["\']([^"\']+)["\']', page, re.I):
                  url = urllib.parse.urljoin(base, html.unescape(value))
                  parsed = urllib.parse.urlparse(url)
                  if parsed.hostname == 'cn.globalprotectionwall.com' and parsed.path.endswith(('.js', '.css')):
                      if url not in urls:
                          urls.append(url)

          manifest = []
          for index, url in enumerate(urls[:40], 1):
              suffix = pathlib.PurePosixPath(urllib.parse.urlparse(url).path).suffix or '.txt'
              filename = f'{index:02d}{suffix}'
              target = root / 'live-assets' / filename
              request = urllib.request.Request(url, headers={'User-Agent': 'JungeinReadOnlyProbe/20260829'})
              entry = {'index': index, 'url': url, 'file': f'live-assets/{filename}'}
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      body = response.read(15_000_000)
                      target.write_bytes(body)
                      entry.update({
                          'status': response.status,
                          'content_type': response.headers.get('Content-Type', ''),
                          'bytes': len(body),
                          'final_url': response.geturl(),
                      })
              except Exception as exc:
                  entry['error'] = f'{type(exc).__name__}: {exc}'
              manifest.append(entry)

          (root / 'live-assets.json').write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2), 'utf-8'
          )
          (root / 'live-assets.txt').write_text('\n'.join(urls) + ('\n' if urls else ''), 'utf-8')
          PY

          if [[ -n "$SSH_KEY" ]]; then
            printf '%s\n' "$SSH_KEY" > probe-output/id_probe
            chmod 600 probe-output/id_probe
            ssh -i probe-output/id_probe -p "$PORT" \
              -o BatchMode=yes -o ConnectTimeout=15 \
              -o StrictHostKeyChecking=accept-new \
              "${USER_NAME}@${HOST}" \
              "APP_PATH=$(printf '%q' "$APP_PATH") python3 -" \
              > probe-output/remote-source-snapshot.txt <<'PY'
          import hashlib
          import os
          from pathlib import Path

          app = Path(os.environ.get('APP_PATH', '/opt/global-protection')).resolve()
          print('PROBE_MODE=read_only')
          print(f'APP_PATH={app}')
          print(f'APP_EXISTS={app.exists()}')
          print('\n=== TOP LEVEL ===')
          if app.exists():
              for item in sorted(app.iterdir(), key=lambda p: p.name.lower()):
                  kind = 'DIR' if item.is_dir() else 'FILE'
                  try:
                      size = item.stat().st_size
                  except OSError:
                      size = -1
                  print(f'{kind}\t{size}\t{item.name}')

          skip_dirs = {
              '.git', 'node_modules', '.wrangler', '.cache', '.vite', 'coverage',
              '.map-autofix-backups', 'backups', 'backup', 'logs', '.next'
          }
          skip_names = {'.env', '.env.local', '.env.production', '.dev.vars'}
          text_suffixes = {
              '.ts', '.tsx', '.js', '.jsx', '.mjs', '.cjs', '.css', '.scss',
              '.html', '.json', '.md', '.yml', '.yaml', '.toml'
          }
          needles = (
              'jungein', 'junge-in', 'jung-in', '정인이', '정인', '鄭仁', '郑仁',
              '/historical-cases/korea', 'historical-cases/korea'
          )
          candidates = []
          if app.exists():
              for root, dirs, files in os.walk(app):
                  dirs[:] = [d for d in dirs if d not in skip_dirs]
                  root_path = Path(root)
                  for name in files:
                      path = root_path / name
                      if name in skip_names or path.suffix.lower() not in text_suffixes:
                          continue
                      try:
                          size = path.stat().st_size
                      except OSError:
                          continue
                      if size > 2_000_000:
                          continue
                      try:
                          text = path.read_text('utf-8', errors='ignore')
                      except OSError:
                          continue
                      rel = path.relative_to(app).as_posix()
                      haystack = (rel + '\n' + text).lower()
                      if any(n.lower() in haystack for n in needles):
                          source_rank = 0 if any(part in rel.split('/') for part in ('src', 'app', 'client', 'pages', 'routes', 'components')) else 1
                          dist_rank = 1 if rel.startswith('dist/') else 0
                          candidates.append((source_rank, dist_rank, rel, size, text))

          candidates.sort(key=lambda item: (item[0], item[1], item[2]))
          print('\n=== MATCHED FILES ===')
          for _, _, rel, size, text in candidates[:80]:
              digest = hashlib.sha256(text.encode('utf-8')).hexdigest()
              print(f'{size}\t{digest}\t{rel}')

          print('\n=== FULL MATCHED SOURCE FILES ===')
          total = 0
          emitted = 0
          for _, _, rel, size, text in candidates:
              if emitted >= 30 or total + len(text.encode('utf-8')) > 9_000_000:
                  break
              print(f'\n===== BEGIN FILE {rel} =====')
              print(text)
              print(f'===== END FILE {rel} =====')
              total += len(text.encode('utf-8'))
              emitted += 1
          print(f'\nEMITTED_FILES={emitted}')
          print(f'EMITTED_BYTES={total}')

          print('\n=== PROJECT DESCRIPTORS ===')
          for rel in ('package.json', 'vite.config.ts', 'vite.config.js', 'wrangler.toml', 'worker/index.ts'):
              path = app / rel
              if path.is_file() and path.stat().st_size < 1_000_000:
                  print(f'\n===== BEGIN DESCRIPTOR {rel} =====')
                  print(path.read_text('utf-8', errors='replace'))
                  print(f'===== END DESCRIPTOR {rel} =====')
          PY
            rm -f probe-output/id_probe
            printf 'ssh_probe=completed\n' > probe-output/ssh-probe-status.txt
          else
            printf 'ssh_probe=skipped_no_repository_key_secret\n' > probe-output/ssh-probe-status.txt
          fi

          {
            echo '## Jungein production source probe'
            echo
            echo '- Live route and same-origin assets were fetched read-only.'
            echo "- SSH source probe: \`$(cut -d= -f2 probe-output/ssh-probe-status.txt)\`"
            echo "- Same-origin JS/CSS assets listed: \`$(wc -l < probe-output/live-assets.txt)\`"
            echo '- No file, service, database, account, or DNS mutation was performed.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload read-only probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oneoff-jungein-intro-probe-20260829
          path: probe-output/
          if-no-files-found: error
          retention-days: 7
