name: One-off live mobile history layout stability

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oneoff-mobile-history-layout-stability-20260829.yml'

permissions:
  contents: read

jobs:
  mobile-stability:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install Playwright driver
        run: npm install --no-save playwright-core@1.55.0

      - name: Verify public mobile history layout remains stable
        run: |
          node --input-type=module <<'JS'
          import { chromium } from 'playwright-core';

          const sites = {
            'zh-Hant': 'https://jerryzuhow77.github.io/child-advocacy-site/',
            en: 'https://jerryzuhow77.github.io/child-advocacy-site/en/',
            ja: 'https://jerryzuhow77.github.io/child-advocacy-site/ja/'
          };
          const browser = await chromium.launch({
            headless: true,
            executablePath: '/usr/bin/google-chrome',
            args: ['--no-sandbox', '--disable-dev-shm-usage']
          });
          const results = [];

          for (const [language, url] of Object.entries(sites)) {
            const context = await browser.newContext({ viewport: { width: 390, height: 844 } });
            const page = await context.newPage();
            const mapRequests = [];
            const pageErrors = [];
            page.on('request', request => {
              if (request.url().includes('east-asia-case-memory-map-paper-clay-20260824.webp')) mapRequests.push(request.url());
            });
            page.on('pageerror', error => pageErrors.push(String(error)));

            const response = await page.goto(url + '?mobile-stability=1696f557-' + language, {
              waitUntil: 'domcontentloaded',
              timeout: 60000
            });
            await page.locator('#home-historical-cases').scrollIntoViewIfNeeded();
            await page.waitForFunction(() => document.querySelector('#home-historical-cases .history-relief-figure'), null, { timeout: 20000 });
            await page.waitForTimeout(1000);

            const measure = () => page.evaluate(() => {
              const zone = document.querySelector('#home-historical-cases');
              const panel = zone?.querySelector('.history-map-panel');
              const figure = zone?.querySelector('.history-relief-figure');
              const image = zone?.querySelector('.history-relief-image');
              const rect = element => {
                const r = element.getBoundingClientRect();
                return { top: Math.round(r.top + scrollY), width: Math.round(r.width), height: Math.round(r.height) };
              };
              return {
                zone: rect(zone),
                panel: rect(panel),
                figure: rect(figure),
                imageSrc: image?.currentSrc || image?.src || '',
                overflow: Math.max(document.documentElement.scrollWidth, document.body.scrollWidth) - innerWidth,
                script: [...document.scripts].map(s => s.src).find(src => src.includes('home-gsap-map-20260824.js')) || ''
              };
            });

            const early = await measure();
            await page.waitForTimeout(6000);
            const delayed = await measure();
            const delta = {
              zoneTop: delayed.zone.top - early.zone.top,
              panelTop: delayed.panel.top - early.panel.top,
              panelHeight: delayed.panel.height - early.panel.height,
              figureHeight: delayed.figure.height - early.figure.height
            };
            const uniqueMapRequests = [...new Set(mapRequests)];
            const fatal = [];
            if (response?.status() !== 200) fatal.push('HTTP ' + response?.status());
            if (!early.script.includes('20260829-mobile-layout-stability-1')) fatal.push('old map script');
            for (const [key, value] of Object.entries(delta)) if (Math.abs(value) > 4) fatal.push(key + ' shifted ' + value + 'px');
            if (early.overflow > 2 || delayed.overflow > 2) fatal.push('horizontal overflow');
            const stabilityRequests = uniqueMapRequests.filter(url => url.includes('20260829-mobile-layout-stability-1'));
            if (early.imageSrc !== delayed.imageSrc) fatal.push('map image source changed after delay');
            if (stabilityRequests.length > 1) fatal.push('stability artwork requested ' + stabilityRequests.length + ' times');
            if (pageErrors.length) fatal.push(pageErrors.length + ' page error(s)');
            results.push({ language, status: response?.status(), early, delayed, delta, mapRequests: uniqueMapRequests, pageErrors, fatal });
            await context.close();
          }

          await browser.close();
          console.log(JSON.stringify(results, null, 2));
          if (results.some(result => result.fatal.length)) process.exit(1);
          JS
