name: QA public Kaikai prologue video in Chrome

on:
  push:
    branches:
      - feat/kaikai-chapter2-prologue-video-20260829
    paths:
      - '.github/workflows/qa-kaikai-prologue-public-browser-20260829.yml'

permissions:
  contents: read

jobs:
  public-browser-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install Playwright driver
        run: npm install --no-save playwright-core@1.55.0

      - name: Check public desktop and mobile pages
        run: |
          mkdir -p browser-proof
          node --input-type=module <<'JS'
          import { chromium } from 'playwright-core';
          import fs from 'node:fs';

          const output = 'browser-proof';
          const sites = {
            'zh-Hant': 'https://jerryzuhow77.github.io/child-advocacy-site/hearing-records/prison-watch/kaikai-final-chapter/',
            'zh-Hans': 'https://jerryzuhow77.github.io/child-advocacy-site/hearing-records/prison-watch/kaikai-final-chapter/zh-Hans/'
          };
          const viewports = {
            desktop: { width: 1440, height: 1000 },
            mobile: { width: 390, height: 844 }
          };
          const browser = await chromium.launch({
            headless: true,
            executablePath: '/usr/bin/google-chrome',
            args: ['--no-sandbox', '--disable-dev-shm-usage', '--autoplay-policy=no-user-gesture-required']
          });
          const results = [];
          let failed = false;

          for (const [language, url] of Object.entries(sites)) {
            for (const [viewportName, viewport] of Object.entries(viewports)) {
              const context = await browser.newContext({
                viewport,
                locale: language === 'zh-Hant' ? 'zh-TW' : 'zh-CN',
                reducedMotion: 'no-preference'
              });
              const page = await context.newPage();
              const pageErrors = [];
              const sameOriginErrors = [];
              page.on('pageerror', error => pageErrors.push(String(error)));
              page.on('response', response => {
                const parsed = new URL(response.url());
                if (parsed.hostname === 'jerryzuhow77.github.io' && response.status() >= 400) {
                  sameOriginErrors.push({ url: response.url(), status: response.status() });
                }
              });

              const response = await page.goto(`${url}?browserproof=${Date.now()}-${language}-${viewportName}#prologue-film`, {
                waitUntil: 'domcontentloaded',
                timeout: 60000
              });
              await page.waitForTimeout(2500);

              const state = await page.evaluate(() => {
                const section = document.getElementById('prologue-film');
                const video = document.querySelector('[data-prologue-video], #prologue-film video');
                const source = video?.querySelector('source[type="video/mp4"]');
                const skip = document.querySelector('[data-prologue-skip]');
                const bodyText = document.body?.innerText || '';
                return {
                  title: document.title,
                  hash: location.hash,
                  sectionCount: document.querySelectorAll('#prologue-film').length,
                  videoCount: document.querySelectorAll('[data-prologue-video], #prologue-film video').length,
                  skipCount: document.querySelectorAll('[data-prologue-skip]').length,
                  source: source?.src || video?.currentSrc || video?.src || '',
                  poster: video?.poster || '',
                  autoplay: Boolean(video?.autoplay || video?.hasAttribute('autoplay')),
                  muted: Boolean(video?.muted || video?.defaultMuted || video?.hasAttribute('muted')),
                  playsInline: Boolean(video?.playsInline || video?.hasAttribute('playsinline')),
                  controls: Boolean(video?.controls || video?.hasAttribute('controls')),
                  readyState: video?.readyState ?? -1,
                  duration: Number.isFinite(video?.duration) ? video.duration : null,
                  width: video?.videoWidth || 0,
                  height: video?.videoHeight || 0,
                  sectionVisible: section ? (() => {
                    const rect = section.getBoundingClientRect();
                    return rect.top < innerHeight && rect.bottom > 0;
                  })() : false,
                  skipText: skip?.textContent?.trim() || '',
                  existingPuppetCopy: bodyText.includes('布袋戲') || bodyText.includes('布袋戏'),
                  overflow: Math.max(0, Math.max(document.documentElement.scrollWidth, document.body.scrollWidth) - innerWidth)
                };
              });

              await page.screenshot({ path: `${output}/${language}-${viewportName}.png`, fullPage: false });

              const checks = {
                http200: response?.status() === 200,
                pageLoaded: state.existingPuppetCopy,
                prologueSectionPresent: state.sectionCount === 1,
                videoPresent: state.videoCount === 1,
                skipPresent: state.skipCount >= 1,
                mp4SourcePresent: /\.mp4(?:$|\?)/i.test(state.source),
                posterPresent: Boolean(state.poster),
                autoplaySafeAttributes: state.autoplay && state.muted && state.playsInline && state.controls,
                mediaDecoded: state.readyState >= 2 && (state.duration ?? 0) > 0 && state.width > 0 && state.height > 0,
                deepLinkVisible: state.hash === '#prologue-film' && state.sectionVisible,
                noHorizontalOverflow: state.overflow <= 2,
                noPageErrors: pageErrors.length === 0,
                noSameOriginErrors: sameOriginErrors.length === 0
              };
              const passed = Object.values(checks).every(Boolean);
              if (!passed) failed = true;
              results.push({ language, viewport: viewportName, dimensions: viewport, status: response?.status() ?? null, state, checks, pageErrors, sameOriginErrors, passed });
              await context.close();
            }
          }

          await browser.close();
          fs.writeFileSync(`${output}/report.json`, JSON.stringify({ generatedAt: new Date().toISOString(), results }, null, 2));
          const lines = ['# Public Kaikai prologue video browser proof', ''];
          for (const result of results) {
            lines.push(`## ${result.language} · ${result.viewport} (${result.dimensions.width}×${result.dimensions.height})`);
            lines.push(`- Result: ${result.passed ? 'PASS' : 'FAIL'}`);
            lines.push(`- HTTP: ${result.status}; title: ${result.state.title}`);
            lines.push(`- Section/video/skip: ${result.state.sectionCount}/${result.state.videoCount}/${result.state.skipCount}`);
            lines.push(`- Source: ${result.state.source || '(missing)'}`);
            lines.push(`- Poster: ${result.state.poster || '(missing)'}`);
            lines.push(`- Decode: readyState=${result.state.readyState}, duration=${result.state.duration}, dimensions=${result.state.width}×${result.state.height}`);
            lines.push(`- Deep link: hash=${result.state.hash}, visible=${result.state.sectionVisible}`);
            lines.push(`- Overflow=${result.state.overflow}px; pageErrors=${result.pageErrors.length}; sameOriginErrors=${result.sameOriginErrors.length}`);
            const failedChecks = Object.entries(result.checks).filter(([, value]) => !value).map(([key]) => key);
            lines.push(`- Failed checks: ${failedChecks.length ? failedChecks.join(', ') : 'none'}`);
            lines.push('');
          }
          fs.writeFileSync(`${output}/summary.md`, lines.join('\n'));
          console.log(lines.join('\n'));
          if (failed) process.exit(1);
          JS

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kaikai-public-prologue-browser-proof
          path: browser-proof
          retention-days: 14
