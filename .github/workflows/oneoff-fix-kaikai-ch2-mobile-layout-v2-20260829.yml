name: One-off corrected Kaikai Chapter 2 mobile layout fix

on:
  push:
    branches:
      - fix/kaikai-ch2-mobile-layout-20260829

permissions:
  contents: write

jobs:
  fix-test-commit:
    if: ${{ !contains(github.event.head_commit.message, '[mobile-layout-fixed]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out fix branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Apply final mobile containment rules
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          base = Path('hearing-records/prison-watch/kaikai-final-chapter')
          css_path = base / 'final-chapter.css'
          html_paths = [base / 'index.html', base / 'zh-Hans' / 'index.html']
          marker = '/* 2026-08-29 · final narrow-screen containment */'
          rules = [
              '',
              marker,
              '@media(max-width:760px){',
              '  .hero h1{font-size:clamp(32px,9.5vw,38px);white-space:nowrap}',
              '  .journey-tools{grid-template-columns:minmax(0,1fr)}',
              '  .journey-tools label,.journey-tools input,.journey-tools p{min-width:0}',
              '  .journey-tools input{width:100%;max-width:100%}',
              '}',
              '',
          ]
          css = css_path.read_text(encoding='utf-8')
          if marker in css:
              raise SystemExit('Narrow-screen override already exists')
          css_path.write_text(css.rstrip() + '\n' + '\n'.join(rules), encoding='utf-8')

          for html_path in html_paths:
              html = html_path.read_text(encoding='utf-8')
              old = 'final-chapter.css?v=20260828-17'
              new = 'final-chapter.css?v=20260829-18'
              if html.count(old) != 1:
                  raise SystemExit(f'{html_path}: expected one {old}, found {html.count(old)}')
              html_path.write_text(html.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Static checks
        shell: bash
        run: |
          git diff --check
          grep -F '/* 2026-08-29 · final narrow-screen containment */' hearing-records/prison-watch/kaikai-final-chapter/final-chapter.css
          grep -F '.hero h1{font-size:clamp(32px,9.5vw,38px);white-space:nowrap}' hearing-records/prison-watch/kaikai-final-chapter/final-chapter.css
          grep -F '.journey-tools input{width:100%;max-width:100%}' hearing-records/prison-watch/kaikai-final-chapter/final-chapter.css
          grep -R -F 'final-chapter.css?v=20260829-18' hearing-records/prison-watch/kaikai-final-chapter/index.html hearing-records/prison-watch/kaikai-final-chapter/zh-Hans/index.html

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Chrome driver
        run: npm install --no-save playwright-core@1.55.0

      - name: Verify local pages in Google Chrome
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p browser-validation/mobile-layout-v2
          python -m http.server 4173 > "$RUNNER_TEMP/kaikai-mobile-layout.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in {1..30}; do
            curl -fsS 'http://127.0.0.1:4173/hearing-records/prison-watch/kaikai-final-chapter/' >/dev/null && break
            sleep 1
          done

          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import path from 'node:path';
          import { chromium } from 'playwright-core';

          const root = 'http://127.0.0.1:4173/hearing-records/prison-watch/kaikai-final-chapter/';
          const out = path.resolve('browser-validation/mobile-layout-v2');
          const locales = [
            { name: 'zh-Hant', path: '', title: '沒人要的孩子？', search: '周保母', temperature: '急診醫師證詞：到院體溫約24°C' },
            { name: 'zh-Hans', path: 'zh-Hans/', title: '没人要的孩子？', search: '周保母', temperature: '急诊医师证词：到院体温约24°C' }
          ];
          const viewports = [
            { name: 'desktop', width: 1440, height: 1000 },
            { name: 'mobile', width: 390, height: 844 },
            { name: 'narrow-360', width: 360, height: 800 },
            { name: 'narrow-320', width: 320, height: 780 }
          ];
          const anchors = ['evidence-atlas','witness-conflicts','blood-boundary','restraint-boundary','responsibility-orbit','death-temperature-evidence','dental-warning','placement-spectrum'];
          const failures = [];
          const observations = [];
          let nonce = 0;
          const browser = await chromium.launch({ headless: true, executablePath: '/usr/bin/google-chrome', args: ['--no-sandbox','--disable-dev-shm-usage'] });

          function addFailure(label, detail) {
            failures.push(`${label}: ${JSON.stringify(detail)}`);
          }

          async function makePage(locale, viewport, mode = 'guided') {
            const context = await browser.newContext({ viewport: { width: viewport.width, height: viewport.height } });
            await context.addInitScript((value) => localStorage.setItem('kaikai-final-reading-depth-v1', value), mode);
            const page = await context.newPage();
            const errors = [];
            page.on('pageerror', (error) => errors.push(String(error)));
            return { context, page, errors };
          }

          async function open(page, locale, hash = '', settle = 900) {
            const url = `${root}${locale.path}?qa=${Date.now()}-${++nonce}${hash}`;
            const response = await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 45000 });
            await page.waitForLoadState('load', { timeout: 45000 }).catch(() => undefined);
            await page.waitForTimeout(settle);
            return response;
          }

          async function readLayout(page) {
            return page.evaluate(() => {
              const h1 = document.querySelector('.hero h1');
              const textNode = [...h1.childNodes].find((node) => node.nodeType === Node.TEXT_NODE && node.textContent.trim());
              const range = document.createRange();
              range.selectNodeContents(textNode);
              const search = document.querySelector('#lifeSearch').getBoundingClientRect();
              return {
                titleLines: range.getClientRects().length,
                whiteSpace: getComputedStyle(h1).whiteSpace,
                overflow: Math.max(document.documentElement.scrollWidth, document.body.scrollWidth) - innerWidth,
                searchLeft: Math.round(search.left),
                searchRight: Math.round(search.right),
                searchWidth: Math.round(search.width),
                viewport: innerWidth,
                css: [...document.querySelectorAll('link[rel="stylesheet"]')].map((link) => link.href).find((href) => href.includes('final-chapter.css')) || ''
              };
            });
          }

          async function readAnchor(page, id) {
            return page.locator(`#${id}`).evaluate((element) => {
              const rect = element.getBoundingClientRect();
              const style = getComputedStyle(element);
              return {
                top: Math.round(rect.top),
                opacity: Number(style.opacity),
                hidden: element.hidden,
                display: style.display,
                visibility: style.visibility,
                inViewport: rect.top < innerHeight && rect.bottom > 0
              };
            });
          }

          for (const locale of locales) {
            for (const viewport of viewports) {
              const session = await makePage(locale, viewport);
              const response = await open(session.page, locale);
              const layout = await readLayout(session.page);
              const content = await session.page.evaluate(() => ({
                title: document.querySelector('h1')?.innerText || '',
                temperature: document.querySelector('#death-temperature-evidence')?.textContent || '',
                atlas: document.querySelector('#evidence-atlas')?.textContent || ''
              }));
              observations.push({ test: 'layout', locale: locale.name, viewport: viewport.name, status: response?.status(), layout, content, errors: session.errors });
              const label = `${locale.name}/${viewport.name}`;
              if (!response || response.status() !== 200) addFailure(`${label} HTTP`, response?.status());
              if (!content.title.includes(locale.title) || !content.temperature.includes(locale.temperature) || !content.atlas.trim()) addFailure(`${label} content`, content);
              if (layout.overflow > 2 || layout.searchLeft < 0 || layout.searchRight > viewport.width + 1) addFailure(`${label} horizontal`, layout);
              if (viewport.name !== 'desktop' && (layout.titleLines !== 1 || layout.whiteSpace !== 'nowrap')) addFailure(`${label} title`, layout);
              if (viewport.name === 'narrow-320' && layout.searchWidth > viewport.width - 20) addFailure(`${label} search width`, layout);
              if (!layout.css.includes('20260829-18')) addFailure(`${label} CSS version`, layout);
              if (session.errors.length) addFailure(`${label} page errors`, session.errors);
              if (locale.name === 'zh-Hant') await session.page.screenshot({ path: path.join(out, `${locale.name}-${viewport.name}-top.png`), fullPage: false });
              await session.context.close();
            }
          }

          for (const locale of locales) {
            const session = await makePage(locale, viewports[1], 'quick');
            await open(session.page, locale);
            await session.page.locator('#lifeSearch').fill(locale.search);
            await session.page.waitForTimeout(250);
            const search = await session.page.evaluate((term) => {
              const normalize = (value) => value.toLocaleLowerCase().replace(/\s+/g, ' ').trim();
              const query = normalize(term);
              const events = [...document.querySelectorAll('#lifeTimeline .life-event')];
              const matches = events.filter((event) => normalize(`${event.dataset.search || ''} ${event.textContent || ''}`).includes(query));
              return {
                active: document.body.classList.contains('life-search-active'),
                matches: matches.length,
                visible: matches.filter((event) => !event.hidden && getComputedStyle(event).display !== 'none' && event.getClientRects().length).length
              };
            }, locale.search);
            observations.push({ test: 'search', locale: locale.name, search });
            if (!search.active || search.matches < 1 || search.visible !== search.matches) addFailure(`${locale.name} search`, search);

            await session.page.locator('#menuButton').click();
            await session.page.locator('.nav-group').filter({ has: session.page.locator('a[href="#evidence-atlas"]') }).evaluate((element) => { element.open = true; });
            await session.page.locator('#siteNav a[href="#evidence-atlas"]').click();
            await session.page.waitForTimeout(1700);
            const menu = await readAnchor(session.page, 'evidence-atlas');
            observations.push({ test: 'menu', locale: locale.name, menu });
            if (!menu.inViewport || menu.opacity < 0.99 || menu.hidden) addFailure(`${locale.name} menu`, menu);

            for (const id of anchors) {
              await open(session.page, locale, `#${id}`, 1700);
              const initial = await readAnchor(session.page, id);
              await session.page.reload({ waitUntil: 'domcontentloaded', timeout: 45000 });
              await session.page.waitForLoadState('load', { timeout: 45000 }).catch(() => undefined);
              await session.page.waitForTimeout(1700);
              const reloaded = await readAnchor(session.page, id);
              observations.push({ test: 'anchor', locale: locale.name, id, initial, reloaded });
              for (const [phase, state] of [['initial', initial], ['reload', reloaded]]) {
                if (!state.inViewport || state.opacity < 0.99 || state.hidden || state.display === 'none' || state.visibility === 'hidden') addFailure(`${locale.name} #${id} ${phase}`, state);
              }
            }
            if (session.errors.length) addFailure(`${locale.name} interactive errors`, session.errors);
            await session.context.close();
          }

          const fontSession = await makePage(locales[1], viewports[0]);
          await open(fontSession.page, locales[1]);
          const fonts = await fontSession.page.evaluate(async () => {
            await document.fonts.ready;
            const root = getComputedStyle(document.documentElement);
            return {
              sans: root.getPropertyValue('--sans').trim(),
              serif: root.getPropertyValue('--serif').trim(),
              sansLoaded: document.fonts.check('400 16px "Noto Sans SC"', '陈尚洁'),
              serifLoaded: document.fonts.check('700 32px "Noto Serif SC"', '证据责任'),
              missing: (document.body.innerText.match(/\uFFFD|□/g) || []).length
            };
          });
          observations.push({ test: 'fonts', fonts });
          if (!fonts.sans.includes('Noto Sans SC') || !fonts.serif.includes('Noto Serif SC') || !fonts.sansLoaded || !fonts.serifLoaded || fonts.missing) addFailure('zh-Hans fonts', fonts);
          await fontSession.context.close();

          await browser.close();
          const report = { passed: failures.length === 0, failures, observations };
          fs.writeFileSync(path.join(out, 'report.json'), JSON.stringify(report, null, 2));
          fs.writeFileSync(path.join(out, 'summary.txt'), `Result: ${report.passed ? 'PASS' : 'FAIL'}\nFailures: ${failures.length}\n${failures.join('\n')}`);
          console.log(JSON.stringify(report, null, 2));
          if (failures.length) process.exit(1);
          JS

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kaikai-chapter2-mobile-layout-fix-evidence-v2
          path: browser-validation/mobile-layout-v2/
          if-no-files-found: error
          retention-days: 14

      - name: Commit verified fix and remove one-off workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -- .github/workflows/oneoff-fix-kaikai-ch2-mobile-layout-v2-20260829.yml
          git add hearing-records/prison-watch/kaikai-final-chapter/final-chapter.css
          git add hearing-records/prison-watch/kaikai-final-chapter/index.html
          git add hearing-records/prison-watch/kaikai-final-chapter/zh-Hans/index.html
          git diff --cached --check
          git commit -m 'Fix Chapter 2 narrow mobile layout [mobile-layout-fixed]'
          git push origin "HEAD:${{ github.ref_name }}"
