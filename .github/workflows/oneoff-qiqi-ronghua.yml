name: Enable Qiqi ronghua backgrounds
on:
  push:
    branches: [main]
    paths: ['.github/workflows/oneoff-qiqi-ronghua.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          from pathlib import Path
          for f in ['historical-cases/regions/mainland-china/fujian-qiqi/index.html','en/historical-cases/regions/mainland-china/fujian-qiqi/index.html','ja/historical-cases/regions/mainland-china/fujian-qiqi/index.html']:
            p=Path(f)
            if not p.exists(): continue
            s=p.read_text(encoding='utf-8')
            tag='  <link rel="stylesheet" href="../../../../assets/fujian-qiqi-ronghua.css?v=20260821-1">\n'
            if 'fujian-qiqi-ronghua.css' not in s:s=s.replace('</head>',tag+'</head>',1)
            p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add historical-cases/regions/mainland-china/fujian-qiqi/index.html en/historical-cases/regions/mainland-china/fujian-qiqi/index.html ja/historical-cases/regions/mainland-china/fujian-qiqi/index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Enable translucent ronghua backgrounds on Qiqi feature'
          git push
