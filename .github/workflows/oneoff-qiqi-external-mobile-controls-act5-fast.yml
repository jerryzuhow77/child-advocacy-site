name: Fast Qiqi mobile controls and Act V repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oneoff-qiqi-external-mobile-controls-act5-fast.yml'
      - 'scripts/patch_qiqi_external_mobile_controls.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: qiqi-mobile-external-controls-act5-20260821
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply external mobile controls and Act V fallback
        run: python3 scripts/patch_qiqi_external_mobile_controls.py

      - name: Refresh four-language cache versions
        env:
          QIQI_VERSION_SHA: ${{ github.sha }}
        run: python3 scripts/sync_fujian_qiqi_feature.py

      - name: Validate generated assets and pages
        run: |
          node --check assets/fujian-qiqi-feature.js
          python3 -m py_compile scripts/sync_fujian_qiqi_feature.py scripts/patch_qiqi_external_mobile_controls.py
          grep -q 'External mobile theatre controls and ready copy' assets/fujian-qiqi-feature.css
          grep -q 'External mobile theatre controls' assets/fujian-qiqi-feature.js
          grep -q 'is-ready-preview' assets/fujian-qiqi-feature.js
          grep -q "sceneAct(state) === '5' ? 0.18" assets/fujian-qiqi-feature.js
          grep -q "version: '1.3.4'" assets/fujian-qiqi-feature.js
          for page in \
            historical-cases/regions/mainland-china/fujian-qiqi/index.html \
            zh-hans/historical-cases/regions/mainland-china/fujian-qiqi/index.html \
            en/historical-cases/regions/mainland-china/fujian-qiqi/index.html \
            ja/historical-cases/regions/mainland-china/fujian-qiqi/index.html; do
            grep -q 'fujian-qiqi-feature.css?v=' "$page"
            grep -q 'fujian-qiqi-feature.js?v=' "$page"
          done
          git diff --check

      - name: Commit repaired assets and clean one-off files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f -- \
            .github/workflows/oneoff-qiqi-external-mobile-controls-act5.yml \
            .github/workflows/oneoff-qiqi-external-mobile-controls-act5-fast.yml \
            scripts/patch_qiqi_external_mobile_controls.py
          git add -- \
            assets/fujian-qiqi-feature.css \
            assets/fujian-qiqi-feature.js \
            historical-cases/regions/mainland-china/fujian-qiqi/index.html \
            zh-hans/historical-cases/regions/mainland-china/fujian-qiqi/index.html \
            en/historical-cases/regions/mainland-china/fujian-qiqi/index.html \
            ja/historical-cases/regions/mainland-china/fujian-qiqi/index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Move Qiqi mobile controls outside stage and restore Act V copy'
          git pull --rebase origin main
          git push
