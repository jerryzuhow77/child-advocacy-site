name: Four-language content QA and 9-16 hearing campaign
# Keep this workflow aligned with the active service-worker cache version.

on:
  push:
    branches: [main]
    paths:
      - '**/*.html'
      - 'en/hearing-records/index.html'
      - 'ja/hearing-records/index.html'
      - 'en/hearing-records/prison-watch/kaikai-final-chapter/**'
      - 'ja/hearing-records/prison-watch/kaikai-final-chapter/**'
      - 'hearing-records/prison-watch/kaikai-final-chapter/index.html'
      - 'hearing-records/prison-watch/kaikai-final-chapter/zh-Hans/index.html'
      - 'hearing-records/prison-watch/kaikai-day10-20250507/index.html'
      - 'hearing-records/prison-watch/kaikai-day10-20250507/zh-Hans/index.html'
      - 'en/hearing-records/prison-watch/kaikai-day10-20250507/index.html'
      - 'ja/hearing-records/prison-watch/kaikai-day10-20250507/index.html'
      - 'sitemap.xml'
      - '.github/scripts/verify-chapter-two-publication.py'
      - '.github/scripts/protect-chapter-two-hold.py'
      - '.github/scripts/sync-four-language-toolbar.py'
      - 'data/latest-bulletins.json'
      - 'data/four-language-routes.json'
      - 'assets/four-language-toolbar-20260901.css'
      - 'assets/four-language-toolbar-20260901.js'
      - 'assets/article-comments-20260828.js'
      - 'assets/home-view-counter-20260811.js'
      - 'assets/home-latest-i18n-20260826.js'
      - 'activity-records/20260820-taipei-station-advocacy/**'
      - 'en/activity-records/20260820-taipei-station-advocacy/**'
      - 'ja/activity-records/20260820-taipei-station-advocacy/**'
      - 'assets/site.js'
      - 'assets/site-base-20260823.js'
      - 'assets/site-four-language-qa-20260823.js'
      - 'assets/home-archive-layout-20260823.js'
      - 'assets/home-ia-hearing-campaign-20260823.js'
      - 'assets/home-ia-bootstrap-20260823.js'
      - 'assets/global-protection-wall-portal.js'
      - 'sw.js'
      - '.github/workflows/four-language-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JavaScript syntax checks
        run: |
          set -euo pipefail
          node --check assets/site.js
          node --check assets/site-base-20260823.js
          node --check assets/site-four-language-qa-20260823.js
          node --check assets/home-archive-layout-20260823.js
          node --check assets/home-ia-hearing-campaign-20260823.js
          node --check assets/home-ia-bootstrap-20260823.js
          node --check assets/global-protection-wall-portal.js
          node --check assets/four-language-toolbar-20260901.js
          node --check assets/article-comments-20260828.js
          node --check assets/home-view-counter-20260811.js
          node --check assets/mobile-nav-view-counter-20260823.js
          node --check sw.js

      - name: Static synchronization assertions
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path('.')
          base = (root / 'assets/site-base-20260823.js').read_text(encoding='utf-8')
          loader = (root / 'assets/site.js').read_text(encoding='utf-8')
          qa = (root / 'assets/site-four-language-qa-20260823.js').read_text(encoding='utf-8')
          hearing = (root / 'assets/home-ia-hearing-campaign-20260823.js').read_text(encoding='utf-8')
          portal = (root / 'assets/global-protection-wall-portal.js').read_text(encoding='utf-8')
          toolbar = (root / 'assets/four-language-toolbar-20260901.js').read_text(encoding='utf-8')
          comments = (root / 'assets/article-comments-20260828.js').read_text(encoding='utf-8')
          routes = json.loads((root / 'data/four-language-routes.json').read_text(encoding='utf-8'))
          sw = (root / 'sw.js').read_text(encoding='utf-8')
          pwa_install = (root / 'assets/pwa-install.js').read_text(encoding='utf-8')
          bulletin = json.loads((root / 'data/latest-bulletins.json').read_text(encoding='utf-8'))

          assert len(base) > 100_000, 'Original site behavior was not preserved in the base layer.'
          assert 'site-base-20260823.js' in loader and 'site-four-language-qa-20260823.js' in loader
          assert 'https://cn.globalprotectionwall.com/?section=member-submit' in qa
          assert "['中國大陸','大陸']" in qa and "['中国大陆','大陆']" in qa
          assert "['Mainland China','Mainland']" in qa
          assert '控訴審準備手続' in qa and '児童保護行動連盟' in qa
          assert '9/16 開庭前，留下你想說的話' in hearing
          assert 'Before the September 16 appeal hearing' in hearing
          assert '9月16日の控訴審を前に' in hearing
          assert '2026-09-16T14:30' in hearing
          assert "const mainlandWallBase='https://cn.globalprotectionwall.com/'" in portal
          assert "const wallBase='https://global-protection.jerryzuhow77.chatgpt.site/'" in portal
          canonical_wall_api = 'https://global-protection.jerryzuhow77.chatgpt.site/api/public/view-count'
          for asset in ('assets/four-language-toolbar-20260901.js', 'assets/article-comments-20260828.js', 'assets/home-post-engagement-20260826.js', 'assets/site-base-20260823.js'):
              assert canonical_wall_api in (root / asset).read_text(encoding='utf-8'), f'Canonical wall API missing from {asset}'
          assert 'cpa-four-language-toolbar' in toolbar
          assert 'four-language-routes.json?v=20260903-2' in toolbar, 'The toolbar and generated route manifest must share a fresh cache key.'
          assert 'parts.filter(part => part.toLowerCase() !== "zh-hans")' in comments, 'Comment keys must ignore physical locale route segments.'
          assert 'COMMENT_INDEX_ROUTES' in toolbar and 'attempts++<40' in toolbar, 'Unsupported comment pages must not poll indefinitely.'
          assert 'else setTimeout(go,120)' not in toolbar, 'The comment scroll retry must stay bounded.'
          comment_version = '20260903-comment-key-2'
          assert comment_version in toolbar and comment_version in loader, 'Toolbar and site loaders must request the fresh comments bundle.'
          excluded_roots = {'child-advocacy-site', 'child-advocacy-site-main', 'source', 'handoffs', 'global-protection-wall'}
          active_html = [path for path in root.rglob('*.html') if not any(part in excluded_roots or part.startswith('.') for part in path.relative_to(root).parts)]
          direct_comment_pages = [path for path in active_html if 'article-comments-20260828.js' in path.read_text(encoding='utf-8')]
          assert direct_comment_pages and all(f'article-comments-20260828.js?v={comment_version}' in path.read_text(encoding='utf-8') for path in direct_comment_pages), 'Every direct comments loader must use the fresh bundle version.'
          site_loader_pages = [path for path in active_html if 'site.js' in path.read_text(encoding='utf-8')]
          assert site_loader_pages and all(f'site.js?v={comment_version}' in path.read_text(encoding='utf-8') for path in site_loader_pages), 'Every site loader must deploy the comments-loader cache key.'
          lin_report = (root / 'news/lin-xinci-nexttv-20260902/index.html').read_text(encoding='utf-8')
          assert '辯方怎麼說' in lin_report and '日期登載錯誤' in lin_report, 'The attributed substantive defense position must remain in the report.'
          localized_art = '\n'.join((root / path).read_text(encoding='utf-8') for path in (
              'news/zh-Hans/index.html', 'en/news/index.html', 'ja/news/index.html',
              'news/lin-xinci-nexttv-20260902/zh-Hans/index.html',
              'en/news/lin-xinci-nexttv-20260902/index.html', 'ja/news/lin-xinci-nexttv-20260902/index.html'))
          assert all(term in localized_art for term in ('纸雕与黏土', 'paper-cut and clay', '紙彫刻と粘土造形')), 'Localized artwork descriptions must match the paper-cut and clay replacement.'
          assert routes['version'] == '20260903-2'
          assert set(routes['routes']['']) == {'zh-Hant', 'zh-Hans', 'en', 'ja'}
          import re
          cache_version = re.search(r"const VERSION = '([^']+)';", sw)
          assert cache_version, 'Service worker cache version is missing.'
          registration_tail = pwa_install.split('sw.js?v=', 1)[1] if 'sw.js?v=' in pwa_install else ''
          registration_version = registration_tail.split("'", 1)[0]
          assert registration_version == cache_version.group(1), 'PWA registration and service-worker cache namespace must use the same fresh version.'
          pwa_loader_pages = [path for path in active_html if 'pwa-install.js' in path.read_text(encoding='utf-8')]
          assert pwa_loader_pages and all(f'pwa-install.js?v={registration_version}' in path.read_text(encoding='utf-8') for path in pwa_loader_pages), 'Every PWA loader must deploy the matching service-worker namespace.'
          assert "const closing=group.classList.contains('is-expanded');" in base
          assert "group.matches(':hover')" not in base, 'A hovered nested menu must still open on its first click.'
          feed_sections = {
              name: [item.get('id') for item in bulletin[name]]
              for name in ('pinned', 'items')
          }
          for name, feed_ids in feed_sections.items():
              assert feed_ids.count('kaikai-chapter-one-20260828') == 1, f'Chapter One must appear exactly once in {name}.'
              expected_chapter_two = 1 if name == 'pinned' else 0
              assert feed_ids.count('kaikai-chapter-two-20260829') == expected_chapter_two, f'Chapter Two publication placement is incorrect in {name}.'
          print('Static synchronization assertions passed.')
          PY

      - name: Four-language toolbar synchronization
        run: |
          python3 .github/scripts/sync-four-language-toolbar.py
          git diff --exit-code

      - name: Chapter Two publication hold contract
        run: python3 .github/scripts/verify-chapter-two-publication.py

      - name: Browser-level homepage and campaign checks
        shell: bash
        run: |
          set -euo pipefail
          BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [[ -z "$BROWSER" ]]; then
            echo '::notice::No Chromium-compatible browser is installed on this runner; syntax and static assertions passed.'
            exit 0
          fi

          python3 -m http.server 8765 --bind 127.0.0.1 --directory .. >/tmp/child-site-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          sleep 2

          dump_dom() {
            "$BROWSER" \
              --headless=new \
              --no-sandbox \
              --disable-gpu \
              --disable-dev-shm-usage \
              --disable-background-networking \
              --virtual-time-budget=12000 \
              --dump-dom "$1"
          }

          dump_dom 'http://127.0.0.1:8765/child-advocacy-site/?qa=916-hant' > /tmp/home-hant.html
          grep -F 'id="cpa-four-language-toolbar"' /tmp/home-hant.html
          grep -F 'data-qa916-card="true"' /tmp/home-hant.html
          grep -F '一起寫下剴剴的故事' /tmp/home-hant.html

          dump_dom 'http://127.0.0.1:8765/child-advocacy-site/?lang=zh-Hans&qa=916-hans' > /tmp/home-hans.html
          grep -F 'id="cpa-four-language-toolbar"' /tmp/home-hans.html
          grep -F 'data-qa916-card="true"' /tmp/home-hans.html
          grep -F '一起写下剀剀的故事' /tmp/home-hans.html

          dump_dom 'http://127.0.0.1:8765/child-advocacy-site/en/?qa=916-en' > /tmp/home-en.html
          grep -F 'id="cpa-four-language-toolbar"' /tmp/home-en.html
          grep -F 'data-qa916-card="true"' /tmp/home-en.html
          grep -F 'Let Us Write Kai-Kai’s Story Together' /tmp/home-en.html
          if grep -F 'Mainland China' /tmp/home-en.html; then
            echo 'English UI still contains the deprecated Mainland China label.' >&2
            exit 1
          fi

          dump_dom 'http://127.0.0.1:8765/child-advocacy-site/ja/activity-records/20260820-kaikai-story-collection/?qa=916-ja' > /tmp/story-ja.html
          grep -F '控訴審準備手続' /tmp/story-ja.html
          grep -F '思いを投稿する' /tmp/story-ja.html
          if grep -E '治験|二次試験' /tmp/story-ja.html; then
            echo 'Japanese page still contains mistranslated court terminology.' >&2
            exit 1
          fi

          echo 'Browser-level four-language checks passed.'
