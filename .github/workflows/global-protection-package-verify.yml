name: Global Protection durable package verify

on:
  push:
    branches:
      - handoff/global-protection-durable-package-20260823
    paths:
      - .github/workflows/global-protection-package-verify.yml
      - handoffs/global-protection-archive-20260823/package/**
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/global-protection-package-verify.yml
      - handoffs/global-protection-archive-20260823/package/**

permissions:
  contents: read

jobs:
  verify:
    name: Reconstruct and verify repository-relative patches
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Restore and verify payloads
        shell: bash
        run: |
          set -Eeuo pipefail
          PACKAGE_DIR="handoffs/global-protection-archive-20260823/package"
          bash -n "$PACKAGE_DIR/restore_patches.sh"
          bash -n "$PACKAGE_DIR/ops/deploy_archive_merge_only.sh"
          bash "$PACKAGE_DIR/restore_patches.sh"

          echo '05b1a742ccb782eb92e5fbca199d4a60eef28ed1391628d0175f5a725f37eeca  handoffs/global-protection-archive-20260823/package/patches/guardian-wall.archive.patch' | sha256sum -c -
          echo '5b9a335bd5d58bff7be6c8132174f1eed2bbaad461f64c7fb9a2883fcd2f7820  handoffs/global-protection-archive-20260823/package/patches/globals.archive.patch' | sha256sum -c -

          test "$(wc -c < "$PACKAGE_DIR/patches/guardian-wall.archive.patch")" -eq 36149
          test "$(wc -c < "$PACKAGE_DIR/patches/globals.archive.patch")" -eq 17397

          grep -q '守護文章典藏館' "$PACKAGE_DIR/patches/guardian-wall.archive.patch"
          grep -q '守护文章典藏馆' "$PACKAGE_DIR/patches/guardian-wall.archive.patch"
          grep -q 'Guardian Article Archive' "$PACKAGE_DIR/patches/guardian-wall.archive.patch"
          grep -q 'archive-section' "$PACKAGE_DIR/patches/guardian-wall.archive.patch"
          grep -q 'ticker-archive-bridge' "$PACKAGE_DIR/patches/globals.archive.patch"
          grep -q 'related-guardian-line' "$PACKAGE_DIR/patches/globals.archive.patch"

          {
            echo '## Durable Global Protection package'
            echo
            echo '- Repository-relative patch reconstruction: `PASS`'
            echo '- Guardian component patch SHA-256: `05b1a742ccb782eb92e5fbca199d4a60eef28ed1391628d0175f5a725f37eeca`'
            echo '- Global CSS patch SHA-256: `5b9a335bd5d58bff7be6c8132174f1eed2bbaad461f64c7fb9a2883fcd2f7820`'
            echo '- Deployment and restore shell syntax: `PASS`'
            echo '- Expected archive markers: `PASS`'
            echo '- No production or data mutation was performed.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload reconstructed patches
        uses: actions/upload-artifact@v4
        with:
          name: global-protection-durable-patches
          path: handoffs/global-protection-archive-20260823/package/patches/
          if-no-files-found: error
          retention-days: 7
