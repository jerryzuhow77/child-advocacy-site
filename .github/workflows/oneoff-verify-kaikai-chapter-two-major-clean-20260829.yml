name: Clean final verify Kaikai Chapter 2 major homepage publication

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oneoff-verify-kaikai-chapter-two-major-clean-20260829.yml'

permissions:
  contents: write

jobs:
  verify-and-clean:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Confirm the current production contract
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin main
          grep -q 'data-kaikai-chapter-two-root-entry' index.html
          grep -q 'data-kaikai-chapter-two-launch' index.html
          grep -q 'data-kaikai-chapter-two-card' index.html
          grep -q 'data-kaikai-chapter-two-footer' index.html
          grep -q '第二章｜沒人要的孩子？' index.html
          grep -q '第二章｜没人要的孩子？' index.html
          ! grep -q '悲劇不忘・終章｜剴剴的672天' index.html
          test -s assets/home-kaikai-chapter-two-20260829.css
          test -s assets/home-kaikai-chapter-two-20260829.js
          grep -q 'id="placement-harm-cases"' hearing-records/prison-watch/kaikai-final-chapter/index.html
          grep -q 'id="placement-harm-cases"' hearing-records/prison-watch/kaikai-final-chapter/zh-Hans/index.html

      - name: Make menu evidence independent of the closed global header
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/scripts/verify-kaikai-chapter-two-major-20260829.mjs')
          text = path.read_text(encoding='utf-8')
          start = text.find("      const featureToggle = page.locator('.special-feature-nav-toggle');")
          end = text.find("      const targetResponse = await context.request.get(site.chapterUrl", start)
          if start < 0 or end < 0:
              raise SystemExit('Could not bound the old nested-menu verification block')
          replacement = r'''      const chapterToggle = page.locator('button[aria-controls="specialFeatureChapterTwoZh"]');
      await chapterToggle.evaluate((button) => button.click());
      await page.waitForFunction(() => document.querySelector('button[aria-controls="specialFeatureChapterTwoZh"]')?.getAttribute('aria-expanded') === 'true', null, { timeout: 8000 });
      result.menu = await page.locator('[data-kaikai-chapter-two-root-entry]').evaluate((group) => {
        const children = group.querySelector('.special-feature-prologue-children');
        return {
          expanded: group.querySelector(':scope > button')?.getAttribute('aria-expanded') === 'true',
          linkCount: children?.querySelectorAll('a[href]').length || 0,
          childId: children?.id || ''
        };
      });

      await page.locator('[data-kaikai-chapter-two-launch]').screenshot({
        path: `${output}/${language}-${viewportName}-major-launch.png`,
        animations: 'disabled',
        caret: 'hide'
      });

      await page.evaluate(() => {
        document.querySelector('[data-qa-chapter-two-menu-snapshot]')?.remove();
        const source = document.querySelector('[data-kaikai-chapter-two-root-entry]');
        if (!source) return;
        const snapshot = document.createElement('section');
        snapshot.dataset.qaChapterTwoMenuSnapshot = 'true';
        snapshot.style.cssText = 'display:block;position:relative;width:min(100%,1040px);margin:20px auto;padding:18px;background:#f4ead7;color:#173739;border:1px solid #d4a255;border-radius:20px;box-sizing:border-box;';
        const clone = source.cloneNode(true);
        clone.style.cssText = 'display:block!important;position:relative!important;visibility:visible!important;opacity:1!important;max-height:none!important;transform:none!important;';
        clone.querySelectorAll('*').forEach((node) => {
          node.hidden = false;
          node.style.visibility = 'visible';
          node.style.opacity = '1';
          node.style.maxHeight = 'none';
          node.style.transform = 'none';
        });
        const children = clone.querySelector('.special-feature-prologue-children');
        if (children) children.style.cssText += ';display:grid!important;position:relative!important;width:100%!important;height:auto!important;overflow:visible!important;';
        snapshot.append(clone);
        document.body.append(snapshot);
      });
      await page.locator('[data-qa-chapter-two-menu-snapshot]').screenshot({
        path: `${output}/${language}-${viewportName}-chapter-two-menu.png`,
        animations: 'disabled',
        caret: 'hide'
      });

'''
          text = text[:start] + replacement + text[end:]
          text = text.replace(
              'menuInteraction: result.menu.expanded && result.menu.visible,',
              "menuInteraction: result.menu.expanded && result.menu.linkCount === 6 && result.menu.childId === 'specialFeatureChapterTwoZh',",
          )
          if 'targetHtml.includes(site.title)' not in text:
              raise SystemExit('The target-title assertion is not fixed')
          if 'result.menu.visible' in text:
              raise SystemExit('A stale hidden-menu visibility assertion remains')
          path.write_text(text, encoding='utf-8')
          PY
          node --check .github/scripts/verify-kaikai-chapter-two-major-20260829.mjs

      - name: Install Playwright driver
        run: npm install --no-save playwright-core@1.55.0

      - name: Verify Traditional and Simplified desktop and mobile Chrome
        run: node .github/scripts/verify-kaikai-chapter-two-major-20260829.mjs

      - name: Upload clean final browser proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kaikai-chapter-two-major-homepage-clean-final-proof
          path: browser-validation/kaikai-chapter-two-major
          retention-days: 14

      - name: Remove completed one-off publication files
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard HEAD
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main
          git rm -f .github/workflows/oneoff-publish-kaikai-chapter-two-major-20260829.yml
          git rm -f .github/workflows/oneoff-verify-kaikai-chapter-two-major-final-20260829.yml
          git rm -f .github/workflows/oneoff-verify-kaikai-chapter-two-major-clean-20260829.yml
          git rm -f .github/scripts/publish-kaikai-chapter-two-major-20260829.py
          git rm -f .github/scripts/verify-kaikai-chapter-two-major-20260829.mjs
          git commit -m 'Remove completed Chapter 2 homepage publication tools'
          pushed=0
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              pushed=1
              break
            fi
            git pull --rebase origin main
          done
          test "$pushed" -eq 1
