name: One-off news pastel route sync and QA

on:
  push:
    branches:
      - 'feat/news-photo-pastel-grid-20260903'
    paths:
      - '.github/workflows/oneoff-news-pastel-sync-20260903.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: oneoff-news-pastel-sync-20260903
  cancel-in-progress: false

jobs:
  sync-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/news-photo-pastel-grid-20260903
          fetch-depth: 0

      - name: Merge latest main without reverting current publication state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main --prune
          git merge --no-edit origin/main
          git push origin HEAD:feat/news-photo-pastel-grid-20260903

      - name: JavaScript syntax
        run: |
          set -euo pipefail
          node --check assets/home-media-reports-20260903.js
          node --check assets/news-desk-20260903.js
          node --check assets/home-history-anchor-stability-20260825.js

      - name: Synchronize four-language routes and sitemap
        run: |
          set -euo pipefail
          python3 .github/scripts/sync-four-language-toolbar.py
          python3 scripts/sync_sitemap.py
          python3 .github/scripts/verify-chapter-two-publication.py

      - name: Verify news desk contract
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          from xml.etree import ElementTree as ET

          root = Path('.')
          index_pages = {
              'zh-Hant': root / 'news/index.html',
              'zh-Hans': root / 'news/zh-Hans/index.html',
              'en': root / 'en/news/index.html',
              'ja': root / 'ja/news/index.html',
          }
          article_pages = [
              root / 'news/lin-xinci-nexttv-20260902/index.html',
              root / 'news/lin-xinci-nexttv-20260902/zh-Hans/index.html',
              root / 'en/news/lin-xinci-nexttv-20260902/index.html',
              root / 'ja/news/lin-xinci-nexttv-20260902/index.html',
          ]
          pastel = root / 'assets/images/news-desk-pastel-hero-20260903.svg'
          assert pastel.exists() and '<svg' in pastel.read_text(encoding='utf-8')

          for language, page in index_pages.items():
              text = page.read_text(encoding='utf-8')
              assert 'newsDeskGrid' in text, (language, 'grid missing')
              assert 'news-desk-pastel-hero-20260903.svg' in text, (language, 'pastel hero missing')
              assert 'data-cpa-four-language-toolbar-style' in text, (language, 'toolbar css missing')
              assert 'data-cpa-four-language-toolbar-script' in text, (language, 'toolbar js missing')
              assert 'hreflang="zh-Hant"' in text and 'hreflang="zh-Hans"' in text
              assert 'hreflang="en"' in text and 'hreflang="ja"' in text

          for page in article_pages:
              text = page.read_text(encoding='utf-8')
              assert 'news-desk-pastel-hero-20260903.svg' in text, page
              assert 'image.taisounds.com/newsimages/' in text, page
              assert 'www.taisounds.com/news/content/96/174886' in text, page
              assert 'www.nexttv.com.tw/NextTV/News/Home/Society/m/2026-09-02/2455025.html' in text, page
              assert 'media-report-paper-clay-20260903.css?v=20260903-2' in text, page

          home = (root / 'assets/home-media-reports-20260903.js').read_text(encoding='utf-8')
          assert 'dataset.cpaNewsNav' in home and 'cpa-news-nav-link' in home
          assert '.sort((a, b)' in home and 'Date.parse' in home
          assert 'PHOTO_SOURCE_URL' in home and 'PHOTO_URL' in home

          desk = (root / 'assets/news-desk-20260903.js').read_text(encoding='utf-8')
          assert '.sort((a, b)' in desk and 'Date.parse' in desk
          assert 'PHOTO_SOURCE_URL' in desk and 'PHOTO_URL' in desk

          routes = json.loads((root / 'data/four-language-routes.json').read_text(encoding='utf-8'))
          editions = routes['routes']['news/']
          assert set(editions) == {'zh-Hant', 'zh-Hans', 'en', 'ja'}, editions
          assert editions['zh-Hant'] == '/child-advocacy-site/news/'
          assert editions['zh-Hans'] == '/child-advocacy-site/news/zh-Hans/'
          assert editions['en'] == '/child-advocacy-site/en/news/'
          assert editions['ja'] == '/child-advocacy-site/ja/news/'

          xml = ET.parse(root / 'sitemap.xml')
          locations = {node.text for node in xml.findall('.//{http://www.sitemaps.org/schemas/sitemap/0.9}loc')}
          expected = {
              'https://jerryzuhow77.github.io/child-advocacy-site/news/',
              'https://jerryzuhow77.github.io/child-advocacy-site/news/zh-Hans/',
              'https://jerryzuhow77.github.io/child-advocacy-site/en/news/',
              'https://jerryzuhow77.github.io/child-advocacy-site/ja/news/',
          }
          assert expected <= locations, expected - locations
          print('News pastel, photo credit, toolbar, route and sitemap assertions passed.')
          PY

      - name: Commit generated route and sitemap files
        run: |
          set -euo pipefail
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data/four-language-routes.json sitemap.xml news/index.html news/zh-Hans/index.html en/news/index.html ja/news/index.html
          if git diff --cached --quiet; then
            echo 'Generated files already synchronized.'
            exit 0
          fi
          git commit -m 'chore: synchronize news routes and sitemap'
          git push origin HEAD:feat/news-photo-pastel-grid-20260903
