name: Publish Day 5 complete medical testimony page

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/day5-minimal-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-day5-complete-medical-page
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'trigger-day5-publication'
    runs-on: ubuntu-latest
    steps:
      - name: Check out current production branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Reconstruct and install the validated Day 5 package
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin main

          work='/tmp/day5-minimal-publication'
          archive="$work/day5-minfull.tar.xz"
          rm -rf "$work"
          mkdir -p "$work"
          : > "$archive"

          shopt -s nullglob
          parts=(.github/day5-minpayload/part*.b64)
          if [ "${#parts[@]}" -ne 7 ]; then
            echo "Expected 7 Day 5 payload chunks, found ${#parts[@]}" >&2
            exit 1
          fi
          for part in "${parts[@]}"; do
            base64 --decode "$part" >> "$archive"
          done

          printf '%s  %s\n' '8054d0413aa568ae4117841525d2f9303a600a7e869ee5681212220aa1959ebf' "$archive" | sha256sum --check --strict
          xz --test "$archive"
          tar -xJf "$archive" -C "$work"
          test -f "$work/install.py"
          python "$work/install.py"

          node --check hearing-records/prison-watch/kaikai-day5-20250429/day5.js

      - name: Synchronize source mirrors, search and cache metadata
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json, re, shutil

          root = Path('.')
          page = Path('hearing-records/prison-watch/kaikai-day5-20250429')
          en_page = Path('en/hearing-records/prison-watch/kaikai-day5-20250429')
          ja_page = Path('ja/hearing-records/prison-watch/kaikai-day5-20250429')

          mirrors = [
              (page, Path('source') / page),
              (en_page, Path('source') / en_page),
              (ja_page, Path('source') / ja_page),
          ]
          for source, destination in mirrors:
              if destination.exists():
                  shutil.rmtree(destination)
              destination.parent.mkdir(parents=True, exist_ok=True)
              shutil.copytree(source, destination)

          data_mirrors = [
              (Path('data/hearing-records.json'), Path('source/data/hearing-records.json')),
              (Path('en/data/hearing-records.json'), Path('source/en/data/hearing-records.json')),
              (Path('ja/data/hearing-records.json'), Path('source/ja/data/hearing-records.json')),
          ]
          for source, destination in data_mirrors:
              destination.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(source, destination)

          search_path = Path('data/search-index.json')
          if search_path.exists():
              data = json.loads(search_path.read_text(encoding='utf-8'))
              items = data.setdefault('items', [])
              url = 'hearing-records/prison-watch/kaikai-day5-20250429/'
              items[:] = [item for item in items if item.get('url') != url]
              items.insert(0, {
                  'title': '剴剴案｜第五日・第五次審判期日',
                  'category': '旁聽紀錄・剴剴案',
                  'url': url,
                  'date': '2026-08-22',
                  'summary': '許倬憲法醫師與呂立醫師作證；完整整理法醫死因研判、兒少保護醫療鑑定、PMCT、營養不良、傷勢及庭上全部問答。',
                  'keywords': '剴剴案 第五日 第五次審判期日 許倬憲 呂立 法醫 兒少保護醫療 低血容性休克 PMCT 營養不良 42處傷勢 醫學鑑定 完整旁聽紀錄 兩位醫師證詞對照',
                  'text': '2025年4月29日第五次審判期日。上午許倬憲法醫師說明法醫解剖、死亡機轉與死因研判；下午呂立醫師說明兒少保護醫療鑑定、傷勢形成、PMCT、營養不良及照顧疏忽。頁面完整保留原始庭審順序，並設兩位醫師證詞對照專區。'
              })
              data['updated'] = '2026-08-22'
              data['count'] = len(items)
              search_path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
              source_search = Path('source/data/search-index.json')
              source_search.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(search_path, source_search)

          sw = Path('sw.js')
          if sw.exists():
              text = sw.read_text(encoding='utf-8')
              text = re.sub(r"const VERSION = '[^']+';", "const VERSION = '2026-08-22-day5-medical-record-v1';", text, count=1)
              sw.write_text(text, encoding='utf-8')
          PY

      - name: Validate all language pages and complete source record
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import json

          root = Path('.')
          pages = [
              root / 'hearing-records/prison-watch/kaikai-day5-20250429/index.html',
              root / 'en/hearing-records/prison-watch/kaikai-day5-20250429/index.html',
              root / 'ja/hearing-records/prison-watch/kaikai-day5-20250429/index.html',
              root / 'source/hearing-records/prison-watch/kaikai-day5-20250429/index.html',
              root / 'source/en/hearing-records/prison-watch/kaikai-day5-20250429/index.html',
              root / 'source/ja/hearing-records/prison-watch/kaikai-day5-20250429/index.html',
          ]

          class IDs(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.values = []
              def handle_starttag(self, tag, attrs):
                  self.values.extend(value for key, value in attrs if key == 'id' and value)

          for page in pages:
              if not page.is_file() or page.stat().st_size < 80_000:
                  raise SystemExit(f'missing or undersized Day 5 page: {page}')
              text = page.read_text(encoding='utf-8')
              if 'id="comparison"' not in text:
                  raise SystemExit(f'missing doctor comparison anchor: {page}')
              if text.count('day5-compare-card') != 8:
                  raise SystemExit(f'unexpected doctor comparison count: {page}')
              if text.count('day5-record-chapter') != 11:
                  raise SystemExit(f'unexpected complete-record chapter count: {page}')
              parser = IDs()
              parser.feed(text)
              duplicates = sorted({value for value in parser.values if parser.values.count(value) > 1})
              if duplicates:
                  raise SystemExit(f'duplicate IDs in {page}: {duplicates}')

          traditional = pages[0].read_text(encoding='utf-8')
          required = [
              '兩位醫師證詞對照專區',
              '完整旁聽紀錄',
              '許倬憲法醫師',
              '呂立醫師',
              '外傷不一定會從皮膚外觀呈現',
              '至少有42處確定的傷勢',
              '17:28 退庭',
          ]
          missing = [phrase for phrase in required if phrase not in traditional]
          if missing:
              raise SystemExit(f'missing required source-derived text: {missing}')

          for path in [
              'data/hearing-records.json',
              'en/data/hearing-records.json',
              'ja/data/hearing-records.json',
              'source/data/hearing-records.json',
              'source/en/data/hearing-records.json',
              'source/ja/data/hearing-records.json',
              'data/search-index.json',
          ]:
              json.loads((root / path).read_text(encoding='utf-8'))

          canonical = 'https://jerryzuhow77.github.io/child-advocacy-site/hearing-records/prison-watch/kaikai-day5-20250429/'
          if canonical not in (root / 'sitemap.xml').read_text(encoding='utf-8'):
              raise SystemExit('Day 5 canonical URL missing from sitemap')
          PY

      - name: Commit the verified official-site update
        shell: bash
        run: |
          set -euo pipefail

          rm -rf .github/day5-minpayload
          rm -rf .github/day5-payload
          rm -f .github/day5-deploy-package.tar.xz
          rm -f .github/day5-publish-trigger.txt
          rm -f .github/day5-publish-trigger-v2.txt
          rm -f .github/day5-minimal-trigger.txt
          rm -f .github/workflows/oneoff-publish-day5.yml
          rm -f .github/workflows/oneoff-publish-day5-medical.yml
          rm -f .github/workflows/oneoff-publish-day5-v2.yml
          rm -f .github/workflows/oneoff-publish-day5-v3.yml
          rm -f .github/workflows/oneoff-publish-day5-minimal.yml

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && { echo 'No publication changes were produced.'; exit 1; }
          git commit -m 'Publish Day 5 medical testimony comparison and full record'
          git pull --rebase origin main
          git push origin main
