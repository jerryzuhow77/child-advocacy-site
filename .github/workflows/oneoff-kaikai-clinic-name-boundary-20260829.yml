name: Clarify and verify Kaikai clinic-name evidence boundary

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oneoff-kaikai-clinic-name-boundary-20260829.yml'

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clarify that the exact clinic name remains unverified
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin main
          python - <<'PY'
          from pathlib import Path

          replacements = {
            Path('hearing-records/prison-watch/kaikai-final-chapter/index.html'): [
              (
                '已知就醫節點｜非監察院點名違失',
                '名稱待原始病歷核實｜非監察院點名違失'
              ),
              (
                '<h5>興隆內科小兒科診所</h5>',
                '<h5>興隆內科小兒科診所（名稱待核實）</h5>'
              ),
              (
                '公開就醫時間軸記載，劉彩萱於11月7日帶孩子至兒科診所準備接種疫苗，回報醫師評估體溫偏高、口鼻處有膿痂疹，因此先看診拿藥；11月9日再度帶孩子至兒科診所。',
                '依本次指定名稱列入待核實節點。兒盟公開時間軸僅記載，劉彩萱於11月7日帶孩子至「兒科診所」準備接種疫苗，回報醫師評估體溫偏高、口鼻處有膿痂疹，因此先看診拿藥；11月9日再度至兒科診所。該公開時間軸未揭露診所名稱。'
              ),
              (
                '監察院公開調查報告沒有點名興隆內科小兒科診所，也沒有對該診所作個別違失認定。本站將它列為「應回查的醫療接觸節點」；是否已出現可辨識兒虐的身體徵象、是否需要轉診或通報，仍須原始病歷、當時可見症狀、照顧者主訴、醫師證詞與後續追蹤紀錄。',
                '監察院公開調查報告及兒盟公開時間軸均未把該次兒科就診具名為興隆內科小兒科診所，監察院也沒有對該診所作個別違失認定。本站依本次指定名稱列為待核實節點；是否確為該次就醫機構，以及當時是否已出現可辨識兒虐的身體徵象、需要轉診或通報，仍須原始病歷、當時可見症狀、照顧者主訴、醫師證詞與後續追蹤紀錄。'
              ),
              (
                '<strong>興隆診所</strong>目前只列為已知就醫節點',
                '<strong>興隆診所名稱</strong>目前只列為待核實就醫節點'
              ),
            ],
            Path('hearing-records/prison-watch/kaikai-final-chapter/zh-Hans/index.html'): [
              (
                '已知就医节点｜非监察院点名失职',
                '名称待原始病历核实｜非监察院点名失职'
              ),
              (
                '<h5>兴隆内科小儿科诊所</h5>',
                '<h5>兴隆内科小儿科诊所（名称待核实）</h5>'
              ),
              (
                '公开就医时间轴记载，刘彩萱于11月7日带孩子至儿科诊所准备接种疫苗，回报医师评估体温偏高、口鼻处有脓痂疹，因此先看诊拿药；11月9日再次带孩子至儿科诊所。',
                '依本次指定名称列入待核实节点。儿盟公开时间轴仅记载，刘彩萱于11月7日带孩子至“儿科诊所”准备接种疫苗，回报医师评估体温偏高、口鼻处有脓痂疹，因此先看诊拿药；11月9日再次至儿科诊所。该公开时间轴未披露诊所名称。'
              ),
              (
                '监察院公开调查报告没有点名兴隆内科小儿科诊所，也没有对该诊所作个别失职认定。本站将它列为“应回查的医疗接触节点”；是否已出现可辨识儿虐的身体征象、是否需要转诊或通报，仍须原始病历、当时可见症状、照顾者主诉、医师证词与后续追踪纪录。',
                '监察院公开调查报告及儿盟公开时间轴均未把该次儿科就诊具名为兴隆内科小儿科诊所，监察院也没有对该诊所作个别失职认定。本站依本次指定名称列为待核实节点；是否确为该次就医机构，以及当时是否已出现可辨识儿虐的身体征象、需要转诊或通报，仍须原始病历、当时可见症状、照顾者主诉、医师证词与后续追踪纪录。'
              ),
              (
                '<strong>兴隆诊所</strong>目前只列为已知就医节点',
                '<strong>兴隆诊所名称</strong>目前只列为待核实就医节点'
              ),
            ],
          }

          for path, pairs in replacements.items():
            text = path.read_text(encoding='utf-8')
            for old, new in pairs:
              count = text.count(old)
              if count != 1:
                raise SystemExit(f'{path}: expected one match for {old[:40]!r}, found {count}')
              text = text.replace(old, new, 1)
            required = [
              '名稱待原始病歷核實' if 'zh-Hans' not in str(path) else '名称待原始病历核实',
              '未把該次兒科就診具名為興隆內科小兒科診所' if 'zh-Hans' not in str(path) else '未把该次儿科就诊具名为兴隆内科小儿科诊所',
            ]
            for phrase in required:
              if phrase not in text:
                raise SystemExit(f'{path}: missing {phrase}')
            path.write_text(text, encoding='utf-8')
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hearing-records/prison-watch/kaikai-final-chapter/index.html
          git add hearing-records/prison-watch/kaikai-final-chapter/zh-Hans/index.html
          git commit -m 'Clarify that the named pediatric clinic remains unverified'
          git push origin HEAD:main

      - name: Wait for corrected public copy
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p browser-validation/clinic-name-boundary
          urls=(
            'https://jerryzuhow77.github.io/child-advocacy-site/hearing-records/prison-watch/kaikai-final-chapter/'
            'https://jerryzuhow77.github.io/child-advocacy-site/hearing-records/prison-watch/kaikai-final-chapter/zh-Hans/'
          )
          phrases=(
            '名稱待原始病歷核實'
            '名称待原始病历核实'
          )
          for attempt in $(seq 1 90); do
            ready=1
            for i in 0 1; do
              html="$(curl -fsSL --connect-timeout 15 --max-time 30 "${urls[$i]}?qa=${GITHUB_SHA}-${attempt}" || true)"
              grep -q "${phrases[$i]}" <<<"$html" || ready=0
              grep -q 'id="medical-network-omissions"' <<<"$html" || ready=0
            done
            [[ "$ready" -eq 1 ]] && exit 0
            sleep 10
          done
          exit 1

      - name: Install Playwright driver
        run: npm install --no-save playwright-core@1.55.0

      - name: Verify corrected copy in desktop and mobile Chrome
        run: |
          node --input-type=module <<'JS'
          import { chromium } from 'playwright-core';
          import fs from 'node:fs';
          const out = 'browser-validation/clinic-name-boundary';
          fs.mkdirSync(out, { recursive: true });
          const sites = {
            'zh-Hant': {
              url: 'https://jerryzuhow77.github.io/child-advocacy-site/hearing-records/prison-watch/kaikai-final-chapter/',
              badge: '名稱待原始病歷核實',
              heading: '興隆內科小兒科診所（名稱待核實）',
              boundary: '未把該次兒科就診具名為興隆內科小兒科診所'
            },
            'zh-Hans': {
              url: 'https://jerryzuhow77.github.io/child-advocacy-site/hearing-records/prison-watch/kaikai-final-chapter/zh-Hans/',
              badge: '名称待原始病历核实',
              heading: '兴隆内科小儿科诊所（名称待核实）',
              boundary: '未把该次儿科就诊具名为兴隆内科小儿科诊所'
            }
          };
          const viewports = { desktop: { width: 1440, height: 1000 }, mobile: { width: 390, height: 844 } };
          const browser = await chromium.launch({ headless: true, executablePath: '/usr/bin/google-chrome', args: ['--no-sandbox','--disable-dev-shm-usage'] });
          const results = [];
          let failed = false;
          for (const [language, site] of Object.entries(sites)) {
            for (const [viewportName, viewport] of Object.entries(viewports)) {
              const context = await browser.newContext({ viewport, locale: language === 'zh-Hant' ? 'zh-TW' : 'zh-CN' });
              const page = await context.newPage();
              const pageErrors = [];
              const httpErrors = [];
              page.on('pageerror', error => pageErrors.push(String(error)));
              page.on('response', response => {
                const u = new URL(response.url());
                if (u.hostname === 'jerryzuhow77.github.io' && response.status() >= 400) httpErrors.push({ url: response.url(), status: response.status() });
              });
              const response = await page.goto(`${site.url}?qa=${Date.now()}-${language}-${viewportName}#medical-network-omissions`, { waitUntil: 'domcontentloaded', timeout: 60000 });
              await page.waitForSelector('#medical-network-omissions', { state: 'visible', timeout: 15000 });
              await page.waitForTimeout(900);
              const state = await page.locator('#medical-network-omissions').evaluate((section, expected) => {
                const text = section.textContent || '';
                const rect = section.getBoundingClientRect();
                return {
                  badge: text.includes(expected.badge),
                  heading: text.includes(expected.heading),
                  boundary: text.includes(expected.boundary),
                  institutionTimelineDisclosure: text.includes('未揭露診所名稱') || text.includes('未披露诊所名称'),
                  officialDentalCard: text.includes('監察院正式認定') || text.includes('监察院正式认定'),
                  visible: rect.top < innerHeight && rect.bottom > 0,
                  overflow: Math.max(0, Math.max(document.documentElement.scrollWidth, document.body.scrollWidth) - innerWidth)
                };
              }, site);
              await page.locator('.medical-contact-record').screenshot({ path: `${out}/${language}-${viewportName}-clinic-boundary.png` });
              const checks = {
                http200: response?.status() === 200,
                copyCorrect: state.badge && state.heading && state.boundary && state.institutionTimelineDisclosure,
                officialFindingStillPresent: state.officialDentalCard,
                deepLinkVisible: location !== null && state.visible,
                noOverflow: state.overflow <= 2,
                noPageErrors: pageErrors.length === 0,
                noHttpErrors: httpErrors.length === 0
              };
              const passed = Object.values(checks).every(Boolean);
              if (!passed) failed = true;
              results.push({ language, viewport: viewportName, checks, state, pageErrors, httpErrors, passed });
              await context.close();
            }
          }
          await browser.close();
          fs.writeFileSync(`${out}/report.json`, JSON.stringify(results, null, 2));
          const summary = ['# Clinic-name evidence-boundary verification', ''];
          for (const r of results) summary.push(`- ${r.language} · ${r.viewport}: ${r.passed ? 'PASS' : 'FAIL'}; overflow=${r.state.overflow}px; pageErrors=${r.pageErrors.length}; HTTP=${r.httpErrors.length}`);
          fs.writeFileSync(`${out}/summary.md`, summary.join('\n'));
          console.log(summary.join('\n'));
          if (failed) process.exit(1);
          JS

      - name: Upload corrected-copy evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kaikai-clinic-name-boundary-proof
          path: browser-validation/clinic-name-boundary
          retention-days: 14

      - name: Remove completed workflow
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main
          git rm .github/workflows/oneoff-kaikai-clinic-name-boundary-20260829.yml
          git commit -m 'Remove completed clinic-name boundary workflow'
          git push origin HEAD:main
