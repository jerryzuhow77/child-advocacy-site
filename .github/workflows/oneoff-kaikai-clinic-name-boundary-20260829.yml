name: Final Kaikai clinic-name boundary browser proof

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oneoff-kaikai-clinic-name-boundary-20260829.yml'

permissions:
  contents: write

jobs:
  verify-and-clean:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Confirm committed evidence boundary
        shell: bash
        run: |
          set -euo pipefail
          grep -q '名稱待原始病歷核實' hearing-records/prison-watch/kaikai-final-chapter/index.html
          grep -q '未把該次兒科就診具名為興隆內科小兒科診所' hearing-records/prison-watch/kaikai-final-chapter/index.html
          grep -q '名称待原始病历核实' hearing-records/prison-watch/kaikai-final-chapter/zh-Hans/index.html
          grep -q '未把该次儿科就诊具名为兴隆内科小儿科诊所' hearing-records/prison-watch/kaikai-final-chapter/zh-Hans/index.html

      - name: Wait for corrected public copy
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p browser-validation/clinic-name-boundary-final
          urls=(
            'https://jerryzuhow77.github.io/child-advocacy-site/hearing-records/prison-watch/kaikai-final-chapter/'
            'https://jerryzuhow77.github.io/child-advocacy-site/hearing-records/prison-watch/kaikai-final-chapter/zh-Hans/'
          )
          phrases=(
            '名稱待原始病歷核實'
            '名称待原始病历核实'
          )
          for attempt in $(seq 1 60); do
            ready=1
            for i in 0 1; do
              html="$(curl -fsSL --connect-timeout 15 --max-time 30 "${urls[$i]}?qa=${GITHUB_SHA}-${attempt}" || true)"
              grep -q "${phrases[$i]}" <<<"$html" || ready=0
              grep -q 'id="medical-network-omissions"' <<<"$html" || ready=0
            done
            [[ "$ready" -eq 1 ]] && exit 0
            sleep 10
          done
          exit 1

      - name: Install Playwright driver
        run: npm install --no-save playwright-core@1.55.0

      - name: Verify desktop and mobile Chrome
        run: |
          node --input-type=module <<'JS'
          import { chromium } from 'playwright-core';
          import fs from 'node:fs';

          const out = 'browser-validation/clinic-name-boundary-final';
          fs.mkdirSync(out, { recursive: true });
          const sites = {
            'zh-Hant': {
              url: 'https://jerryzuhow77.github.io/child-advocacy-site/hearing-records/prison-watch/kaikai-final-chapter/',
              badge: '名稱待原始病歷核實',
              heading: '興隆內科小兒科診所（名稱待核實）',
              boundary: '未把該次兒科就診具名為興隆內科小兒科診所',
              disclosure: '該公開時間軸未揭露診所名稱'
            },
            'zh-Hans': {
              url: 'https://jerryzuhow77.github.io/child-advocacy-site/hearing-records/prison-watch/kaikai-final-chapter/zh-Hans/',
              badge: '名称待原始病历核实',
              heading: '兴隆内科小儿科诊所（名称待核实）',
              boundary: '未把该次儿科就诊具名为兴隆内科小儿科诊所',
              disclosure: '该公开时间轴未披露诊所名称'
            }
          };
          const viewports = {
            desktop: { width: 1440, height: 1000 },
            mobile: { width: 390, height: 844 }
          };
          const browser = await chromium.launch({
            headless: true,
            executablePath: '/usr/bin/google-chrome',
            args: ['--no-sandbox', '--disable-dev-shm-usage']
          });
          const results = [];
          let failed = false;

          for (const [language, site] of Object.entries(sites)) {
            for (const [viewportName, viewport] of Object.entries(viewports)) {
              const context = await browser.newContext({
                viewport,
                locale: language === 'zh-Hant' ? 'zh-TW' : 'zh-CN',
                colorScheme: 'light'
              });
              const page = await context.newPage();
              const pageErrors = [];
              const httpErrors = [];
              page.on('pageerror', error => pageErrors.push(String(error)));
              page.on('response', response => {
                const u = new URL(response.url());
                if (u.hostname === 'jerryzuhow77.github.io' && response.status() >= 400) {
                  httpErrors.push({ url: response.url(), status: response.status() });
                }
              });

              const response = await page.goto(`${site.url}?qa=${Date.now()}-${language}-${viewportName}#medical-network-omissions`, {
                waitUntil: 'domcontentloaded',
                timeout: 60000
              });
              await page.waitForSelector('#medical-network-omissions', { state: 'visible', timeout: 15000 });
              await page.waitForFunction(() => {
                const section = document.getElementById('medical-network-omissions');
                if (!section || location.hash !== '#medical-network-omissions') return false;
                const rect = section.getBoundingClientRect();
                return rect.top < innerHeight && rect.bottom > 0;
              }, null, { timeout: 12000 });
              await page.waitForTimeout(500);

              const state = await page.locator('#medical-network-omissions').evaluate((section, expected) => {
                const text = section.textContent || '';
                const rect = section.getBoundingClientRect();
                return {
                  hash: location.hash,
                  badge: text.includes(expected.badge),
                  heading: text.includes(expected.heading),
                  boundary: text.includes(expected.boundary),
                  disclosure: text.includes(expected.disclosure),
                  officialDentalCard: text.includes('監察院正式認定') || text.includes('监察院正式认定'),
                  officialOmissionCount: section.querySelectorAll('.control-yuan-omission-grid article').length,
                  visible: rect.top < innerHeight && rect.bottom > 0,
                  top: Math.round(rect.top),
                  overflow: Math.max(0, Math.max(document.documentElement.scrollWidth, document.body.scrollWidth) - innerWidth)
                };
              }, site);

              await page.locator('.medical-contact-record').screenshot({
                path: `${out}/${language}-${viewportName}-clinic-boundary.png`
              });

              const checks = {
                http200: response?.status() === 200,
                copyCorrect: state.badge && state.heading && state.boundary && state.disclosure,
                officialFindingStillPresent: state.officialDentalCard && state.officialOmissionCount === 6,
                deepLinkVisible: state.hash === '#medical-network-omissions' && state.visible,
                noOverflow: state.overflow <= 2,
                noPageErrors: pageErrors.length === 0,
                noHttpErrors: httpErrors.length === 0
              };
              const passed = Object.values(checks).every(Boolean);
              if (!passed) failed = true;
              results.push({ language, viewport: viewportName, dimensions: viewport, checks, state, pageErrors, httpErrors, passed });
              await context.close();
            }
          }

          await browser.close();
          fs.writeFileSync(`${out}/report.json`, JSON.stringify({ generatedAt: new Date().toISOString(), results }, null, 2));
          const lines = ['# Clinic-name evidence-boundary final verification', ''];
          for (const result of results) {
            lines.push(`## ${result.language} · ${result.viewport} (${result.dimensions.width}×${result.dimensions.height})`);
            lines.push(`- Result: ${result.passed ? 'PASS' : 'FAIL'}`);
            lines.push(`- Copy: badge=${result.state.badge}, heading=${result.state.heading}, boundary=${result.state.boundary}, disclosure=${result.state.disclosure}`);
            lines.push(`- Deep link: hash=${result.state.hash}, top=${result.state.top}, visible=${result.state.visible}`);
            lines.push(`- Overflow=${result.state.overflow}px; pageErrors=${result.pageErrors.length}; HTTP=${result.httpErrors.length}`);
            const failedChecks = Object.entries(result.checks).filter(([, value]) => !value).map(([key]) => key);
            lines.push(`- Failed checks: ${failedChecks.length ? failedChecks.join(', ') : 'none'}`);
            lines.push('');
          }
          fs.writeFileSync(`${out}/summary.md`, lines.join('\n'));
          console.log(lines.join('\n'));
          if (failed) process.exit(1);
          JS

      - name: Upload final evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kaikai-clinic-name-boundary-final-proof
          path: browser-validation/clinic-name-boundary-final
          retention-days: 14

      - name: Remove completed workflow
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main
          git rm .github/workflows/oneoff-kaikai-clinic-name-boundary-20260829.yml
          git commit -m 'Remove completed clinic-name boundary workflow'
          git push origin HEAD:main
