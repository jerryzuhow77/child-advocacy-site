name: Publish visible selected Day 5 images

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/day5-visible-images-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: oneoff-day5-visible-selected-images
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'trigger-day5-visible-selected-images-20260822'
    runs-on: ubuntu-latest
    steps:
      - name: Check out current production branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validate selected JPEG artwork and update every Day 5 page
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin main
          python -m pip install --disable-pip-version-check --quiet pillow

          python - <<'PY'
          from __future__ import annotations

          from html import escape
          from pathlib import Path
          from PIL import Image, ImageStat
          import json
          import os
          import re

          root = Path('.')
          version = '20260822-selected-evidence-visible-1'
          absolute_base = 'https://jerryzuhow77.github.io/child-advocacy-site/assets/art/'

          assets = {
              'forensic_hant': root / 'assets/art/prison-watch-day5-selected-evidence-01-zh-hant-20260822.jpg',
              'forensic_hans': root / 'assets/art/prison-watch-day5-selected-evidence-01-zh-hans-20260822.jpg',
              'medical_hant': root / 'assets/art/prison-watch-day5-selected-evidence-02-zh-hant-20260822.jpg',
              'medical_hans': root / 'assets/art/prison-watch-day5-selected-evidence-02-zh-hans-20260822.jpg',
          }

          dimensions: dict[str, tuple[int, int]] = {}
          for key, path in assets.items():
              if not path.is_file() or path.stat().st_size < 100_000:
                  raise SystemExit(f'Missing or undersized selected artwork: {path}')
              with Image.open(path) as image:
                  image.verify()
              with Image.open(path) as image:
                  image.load()
                  if image.format not in {'JPEG', 'MPO'}:
                      raise SystemExit(f'Unexpected artwork format for {path}: {image.format}')
                  width, height = image.size
                  if width < 800 or height < 1100 or not 0.60 <= width / height <= 0.75:
                      raise SystemExit(f'Unexpected artwork dimensions for {path}: {image.size}')
                  gray = image.convert('L')
                  low, high = gray.getextrema()
                  stddev = ImageStat.Stat(gray).stddev[0]
                  if high - low < 90 or stddev < 24:
                      raise SystemExit(f'Artwork appears blank or flat: {path}; range={high-low}, stddev={stddev:.2f}')
                  dimensions[key] = image.size
                  print(f'Validated {path}: {image.size}, {path.stat().st_size} bytes, stddev={stddev:.2f}')

          pages = [
              root / 'hearing-records/prison-watch/kaikai-day5-20250429/index.html',
              root / 'en/hearing-records/prison-watch/kaikai-day5-20250429/index.html',
              root / 'ja/hearing-records/prison-watch/kaikai-day5-20250429/index.html',
              root / 'source/hearing-records/prison-watch/kaikai-day5-20250429/index.html',
              root / 'source/en/hearing-records/prison-watch/kaikai-day5-20250429/index.html',
              root / 'source/ja/hearing-records/prison-watch/kaikai-day5-20250429/index.html',
          ]

          notes = {
              'zh': (
                  '不是只有42處｜42處是可確認的最低數量',
                  '原始紀錄明載，簡報只挑選部分照片，並未呈現所有傷勢照片；「全身至少42處確定傷勢」是依現有資料仍能辨識、確認的下限。部分傷勢癒合後，死亡時外觀已看不到；頭皮等部位另被描述為傷勢「非常多，族繁不及備載」。因此，不應把42處理解成孩子曾受傷害的完整總數。正式表述應是「至少42處確定傷勢」，而不是只有42處。',
                  '資料依原始紀錄 P.5–6｜查看完整原文',
              ),
              'en': (
                  'Not only 42 injuries | 42 is the confirmed minimum',
                  'The source record states that only some photographs were selected and not every injury photograph was shown. “At least 42 confirmed injuries” is the minimum that could still be identified and confirmed. Some injuries had healed and were no longer visible at death, while injuries including those to the scalp were described as too numerous to list fully. The number 42 must not be read as the complete total of harm the child experienced.',
                  'Based on source record pp. 5–6 | Read the complete passage',
              ),
              'ja': (
                  '42か所だけではない｜42か所は確認できた最低数',
                  '原記録には、説明用資料では一部の写真だけを選び、すべての外傷写真を示していないと明記されています。「全身に少なくとも42か所の確定外傷」は、現存資料から確認できた下限です。治癒後、死亡時には外見から確認できなくなった外傷もあり、頭皮などの外傷は非常に多く、すべてを列挙できないとも説明されています。42か所を傷害の完全な総数と解釈してはいけません。',
                  '原記録5～6頁に基づく｜全文を確認',
              ),
          }

          def relative(page: Path, asset: Path) -> str:
              return os.path.relpath(asset, page.parent).replace(os.sep, '/')

          def set_attr(tag: str, name: str, value: str) -> str:
              escaped = escape(value, quote=True)
              pattern = re.compile(rf'\s{name}="[^"]*"', re.I)
              replacement = f' {name}="{escaped}"'
              if pattern.search(tag):
                  return pattern.sub(replacement, tag, count=1)
              return tag[:-1] + replacement + '>'

          def update_poster(text: str, page: Path, number: int, hant_key: str, hans_key: str, alt: str) -> str:
              pattern = re.compile(rf'<img\b[^>]*\bdata-day5-poster="{number}"[^>]*>', re.I)
              matches = pattern.findall(text)
              if len(matches) != 1:
                  raise SystemExit(f'Expected exactly one poster {number} tag in {page}; found {len(matches)}')

              def replacement(match: re.Match[str]) -> str:
                  tag = match.group(0)
                  traditional = relative(page, assets[hant_key])
                  simplified = relative(page, assets[hans_key])
                  width, height = dimensions[hant_key]
                  tag = set_attr(tag, 'data-traditional', traditional)
                  tag = set_attr(tag, 'data-simplified', simplified)
                  tag = set_attr(tag, 'src', f'{traditional}?v={version}')
                  tag = set_attr(tag, 'alt', alt)
                  tag = set_attr(tag, 'width', str(width))
                  tag = set_attr(tag, 'height', str(height))
                  tag = set_attr(tag, 'decoding', 'async')
                  tag = set_attr(tag, 'loading', 'eager' if number == 1 else 'lazy')
                  return tag

              return pattern.sub(replacement, text, count=1)

          for page in pages:
              text = page.read_text(encoding='utf-8')
              path_string = page.as_posix()
              language_key = 'en' if '/en/' in path_string else 'ja' if '/ja/' in path_string else 'zh'
              if language_key == 'en':
                  alt_one = 'Day 5 evidence-investigation poster with the child considering medical records'
                  alt_two = 'Day 5 evidence-investigation poster with two doctors reviewing the evidence board'
              elif language_key == 'ja':
                  alt_one = '第5回公判・子どもと医学資料を描いた証拠調査ポスター'
                  alt_two = '第5回公判・二人の医師が証拠ボードを確認する証拠調査ポスター'
              else:
                  alt_one = '第五日證據調查程序主視覺：孩子思考與醫學證據卡'
                  alt_two = '第五日證據調查程序主視覺：孩子抱膝與兩位醫師檢視證據板'

              text = update_poster(text, page, 1, 'forensic_hant', 'forensic_hans', alt_one)
              text = update_poster(text, page, 2, 'medical_hant', 'medical_hans', alt_two)
              text = re.sub(r'day5\.js\?v=[^"\']+', f'day5.js?v={version}', text)

              absolute_forensic = absolute_base + assets['forensic_hant'].name + f'?v={version}'
              text = re.sub(r'(<meta\s+property="og:image"\s+content=")[^"]*(")', rf'\1{absolute_forensic}\2', text, count=1)
              text = re.sub(r'(<meta\s+name="twitter:image"\s+content=")[^"]*(")', rf'\1{absolute_forensic}\2', text, count=1)
              text = re.sub(r'("image"\s*:\s*")[^"]*(")', rf'\1{absolute_forensic}\2', text, count=1)

              title, body, source = notes[language_key]
              note = (
                  '<aside id="day5InjuryCountNote" class="day5-injury-count-note" '
                  f'aria-label="{escape(title, quote=True)}"><strong>{title}</strong><p>{body}</p>'
                  f'<a href="#record-08">{source}</a></aside>'
              )
              note_pattern = re.compile(r'<aside id="day5InjuryCountNote"\b.*?</aside>', re.S)
              if note_pattern.search(text):
                  text = note_pattern.sub(note, text, count=1)
              else:
                  marker = '<article class="day5-compare-card is-agree"><header><span>04</span>'
                  start = text.find(marker)
                  if start < 0:
                      raise SystemExit(f'Comparison card 04 not found in {page}')
                  end = text.find('</article>', start)
                  if end < 0:
                      raise SystemExit(f'Comparison card 04 not closed in {page}')
                  end += len('</article>')
                  text = text[:end] + note + text[end:]

              if language_key == 'zh':
                  text = text.replace(
                      '<strong>至少42處</strong><small>部分癒合後已看不到</small>',
                      '<strong>至少42處</strong><small>42處是可確認下限，不是完整總數</small>',
                  )
              page.write_text(text, encoding='utf-8')

          for script in [
              root / 'hearing-records/prison-watch/kaikai-day5-20250429/day5.js',
              root / 'source/hearing-records/prison-watch/kaikai-day5-20250429/day5.js',
          ]:
              text = script.read_text(encoding='utf-8')
              text = re.sub(r"const posterVersion = '[^']+';", f"const posterVersion = '{version}';", text, count=1)
              script.write_text(text, encoding='utf-8')

          record_files = [
              (root / 'data/hearing-records.json', '../assets/art/'),
              (root / 'en/data/hearing-records.json', '../../assets/art/'),
              (root / 'ja/data/hearing-records.json', '../../assets/art/'),
              (root / 'source/data/hearing-records.json', '../assets/art/'),
              (root / 'source/en/data/hearing-records.json', '../../assets/art/'),
              (root / 'source/ja/data/hearing-records.json', '../../assets/art/'),
          ]
          for path, prefix in record_files:
              data = json.loads(path.read_text(encoding='utf-8'))
              entry = next((item for item in data if item.get('url') == 'prison-watch/kaikai-day5-20250429/'), None)
              if entry is None:
                  raise SystemExit(f'Day 5 record entry missing in {path}')
              entry['image'] = prefix + assets['forensic_hant'].name + f'?v={version}'
              path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          bulletins = root / 'data/latest-bulletins.json'
          if bulletins.exists():
              data = json.loads(bulletins.read_text(encoding='utf-8'))
              item = next((entry for entry in data.get('items', []) if entry.get('id') == 'kaikai-day5-20250429'), None)
              if item is not None:
                  item['image'] = absolute_forensic
                  bulletins.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          sw = root / 'sw.js'
          text = sw.read_text(encoding='utf-8')
          text = re.sub(r"const VERSION = '[^']+';", "const VERSION = '2026-08-22-day5-selected-evidence-visible-v1';", text, count=1)
          resources = [f"./assets/art/{path.name}" for path in assets.values()]
          start = text.find('const APP_SHELL = [')
          end = text.find('];', start)
          if start >= 0 and end >= 0:
              segment = text[start:end]
              missing = [resource for resource in resources if resource not in segment]
              if missing:
                  prefix = text[:end].rstrip()
                  if not prefix.endswith(','):
                      prefix += ','
                  prefix += '\n' + ',\n'.join(f"  '{resource}'" for resource in missing) + '\n'
                  text = prefix + text[end:]
          old_marker = "url.pathname.endsWith('/assets/art/prison-watch-day5-medical-zh-hant-20260822.webp');"
          if old_marker in text:
              new_marker = old_marker[:-1] + " ||\n    url.pathname.includes('/assets/art/prison-watch-day5-selected-evidence-');"
              text = text.replace(old_marker, new_marker)
          sw.write_text(text, encoding='utf-8')
          PY

          node --check hearing-records/prison-watch/kaikai-day5-20250429/day5.js
          node --check source/hearing-records/prison-watch/kaikai-day5-20250429/day5.js
          git diff --check

      - name: Validate visible output and all references
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageStat
          import json

          root = Path('.')
          version = '20260822-selected-evidence-visible-1'
          selected = [
              root / 'assets/art/prison-watch-day5-selected-evidence-01-zh-hant-20260822.jpg',
              root / 'assets/art/prison-watch-day5-selected-evidence-02-zh-hant-20260822.jpg',
          ]
          for path in selected:
              with Image.open(path) as image:
                  image.load()
                  gray = image.convert('L')
                  if ImageStat.Stat(gray).stddev[0] < 24:
                      raise SystemExit(f'Blank selected image: {path}')

          pages = [
              root / 'hearing-records/prison-watch/kaikai-day5-20250429/index.html',
              root / 'en/hearing-records/prison-watch/kaikai-day5-20250429/index.html',
              root / 'ja/hearing-records/prison-watch/kaikai-day5-20250429/index.html',
              root / 'source/hearing-records/prison-watch/kaikai-day5-20250429/index.html',
              root / 'source/en/hearing-records/prison-watch/kaikai-day5-20250429/index.html',
              root / 'source/ja/hearing-records/prison-watch/kaikai-day5-20250429/index.html',
          ]
          for page in pages:
              text = page.read_text(encoding='utf-8')
              for name in [
                  'prison-watch-day5-selected-evidence-01-zh-hant-20260822.jpg',
                  'prison-watch-day5-selected-evidence-02-zh-hant-20260822.jpg',
              ]:
                  if name not in text:
                      raise SystemExit(f'Selected image reference missing from {page}: {name}')
              if f'day5.js?v={version}' not in text:
                  raise SystemExit(f'Fresh Day 5 script key missing from {page}')
              if text.count('id="day5InjuryCountNote"') != 1:
                  raise SystemExit(f'42-plus note missing or duplicated in {page}')
              if 'prison-watch-day5-forensic-zh-hant-20260822.webp' in text or 'prison-watch-day5-medical-zh-hant-20260822.webp' in text:
                  raise SystemExit(f'Broken legacy WebP still referenced by {page}')

          zh = pages[0].read_text(encoding='utf-8')
          for phrase in ['不是只有42處', '42處是可確認的最低數量', '並未呈現所有傷勢照片', '族繁不及備載']:
              if phrase not in zh:
                  raise SystemExit(f'Missing strengthened injury note phrase: {phrase}')

          for path in [
              'data/hearing-records.json',
              'en/data/hearing-records.json',
              'ja/data/hearing-records.json',
              'source/data/hearing-records.json',
              'source/en/data/hearing-records.json',
              'source/ja/data/hearing-records.json',
              'data/latest-bulletins.json',
          ]:
              candidate = root / path
              if candidate.exists():
                  json.loads(candidate.read_text(encoding='utf-8'))
          PY
          grep -Fq "const VERSION = '2026-08-22-day5-selected-evidence-visible-v1';" sw.js

      - name: Commit the verified repair and remove one-off staging
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github/day5-image-fix
          rm -rf .github/day5-poster-repair
          rm -rf .github/day5-selected-medical
          rm -f .github/day5-visible-images-trigger.txt
          rm -f .github/day5-poster-repair-trigger.txt
          rm -f .github/day5-selected-art-trigger.txt
          rm -f .github/workflows/oneoff-day5-poster-repair.yml
          rm -f .github/workflows/oneoff-day5-user-selected-art.yml
          rm -f .github/workflows/oneoff-day5-visible-selected-images.yml

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && { echo 'No visible-image repair changes produced.'; exit 1; }
          git commit -m 'Show the selected Day 5 evidence posters and retain the 42-plus note'
          git pull --rebase origin main
          git push origin main
