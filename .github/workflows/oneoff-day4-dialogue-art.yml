name: Restyle Day 4 complete hearing record

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oneoff-day4-dialogue-art.yml'

permissions:
  contents: write

concurrency:
  group: day4-dialogue-art
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install complete dialogue in Day 3 visual style
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin main

          target='hearing-records/prison-watch/kaikai-day4-20250428/day4-verbatim.js'
          mkdir -p "$(dirname "$target")"
          cat .github/day4-dialogue-art/part*.b64 | base64 --decode | gzip -dc > "$target"
          printf '%s  %s\n' '01a71f9c5e2a3cff73d1e11f40ee66a5754d4b6b9ce736bd80d9700abaf2aa79' "$target" | sha256sum --check --strict

          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')

          def patch(path: Path, pattern: str, replacement: str, label: str) -> None:
              if not path.exists():
                  return
              text = path.read_text(encoding='utf-8')
              text, count = re.subn(pattern, replacement, text, count=1)
              if count != 1:
                  raise SystemExit(f'{label} anchor not found in {path}')
              path.write_text(text, encoding='utf-8')

          wrapper = root / 'hearing-records/prison-watch/kaikai-day3-20250425/day3-reading-core-20260821.js'
          dispatcher = root / 'hearing-records/prison-watch/kaikai-day3-20250425/day3-reading.js'
          patch(
              wrapper,
              r"day4-verbatim\.js\?v=[^']+",
              'day4-verbatim.js?v=20260821-dialogue-art-1',
              'Day 4 complete-record loader'
          )
          patch(
              dispatcher,
              r"day3-reading-core-20260821\.js\?v=[^']+",
              'day3-reading-core-20260821.js?v=20260821-shared-dialogue-art-1',
              'shared reader loader'
          )

          # Keep source mirrors synchronized when matching runtime files exist.
          source_wrapper = root / 'source' / wrapper
          source_dispatcher = root / 'source' / dispatcher
          if source_wrapper.exists():
              patch(
                  source_wrapper,
                  r"day4-verbatim\.js\?v=[^']+",
                  'day4-verbatim.js?v=20260821-dialogue-art-1',
                  'source Day 4 complete-record loader'
              )
          if source_dispatcher.exists():
              patch(
                  source_dispatcher,
                  r"day3-reading-core-20260821\.js\?v=[^']+",
                  'day3-reading-core-20260821.js?v=20260821-shared-dialogue-art-1',
                  'source shared reader loader'
              )
          PY

          node --check "$target"
          node --check hearing-records/prison-watch/kaikai-day3-20250425/day3-reading-core-20260821.js
          node --check hearing-records/prison-watch/kaikai-day3-20250425/day3-reading.js
          grep -Fq "title: '完整旁聽紀錄'" "$target"
          grep -Fq 'dialogue-question' "$target"
          grep -Fq 'dialogue-answer' "$target"
          grep -Fq 'record-chapter' "$target"
          if grep -Fq "title: '完整旁聽紀錄｜PDF" "$target"; then
            echo 'Visible title still overemphasizes PDF.' >&2
            exit 1
          fi

          rm -rf .github/day4-dialogue-art
          rm -f .github/workflows/oneoff-day4-dialogue-art.yml

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to publish.'
            exit 0
          fi
          git commit -m 'Present Day 4 full hearing dialogue in Day 3 visual style'
          git pull --rebase origin main
          git push origin main
