name: September advocacy article and comparison QA
on:
  pull_request:
  push:
    branches: [main]
    paths:
      - '**/early-warning-audit-20260908/**'
      - '**/guardian-duty-rebuttal/**'
      - 'assets/*20260908*'
      - 'assets/four-language-toolbar-20260901.js'
      - '.github/scripts/verify-advocacy-september.mjs'
      - '.github/scripts/verify-grandmother-motion.mjs'
      - 'features/kaikai-grandmother-rescue-barriers/**'
      - 'zh-Hans/features/kaikai-grandmother-rescue-barriers/**'
      - 'en/features/kaikai-grandmother-rescue-barriers/**'
      - 'ja/features/kaikai-grandmother-rescue-barriers/**'
      - '.github/workflows/advocacy-september-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  responsive:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - run: npm install --no-save playwright-core@1.55.0
      - name: Check four editions at desktop and Android widths
        run: |
          python3 -m http.server 8765 --directory .. >/tmp/advocacy-http.log 2>&1 &
          trap 'kill $!' EXIT
          node .github/scripts/verify-advocacy-september.mjs
          node .github/scripts/verify-grandmother-motion.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: september-advocacy-qa
          path: browser-validation/september-advocacy/
