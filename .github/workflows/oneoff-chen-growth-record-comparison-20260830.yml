name: Add Chen growth-record comparison
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oneoff-chen-growth-record-comparison-20260830.yml'
permissions:
  contents: write
concurrency:
  group: oneoff-chen-growth-record-comparison-20260830
  cancel-in-progress: false
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add the cross-case record comparison to both Chinese pages
        run: |
          python - <<'PY'
          from pathlib import Path

          targets = [
              {
                  "path": Path("hearing-records/prison-watch/kaikai-final-chapter/index.html"),
                  "nav_text": "同案成長紀錄對照",
                  "article": '''
      <article id="chen-growth-record-comparison" class="growth-record-comparison">
        <span>同一社工・不同個案</span>
        <h5>另一名兒童有完整成長紀錄，為什麼剴剴沒有？</h5>
        <p><b>庭上對照：</b>檢方先追問陳尚潔如何替劉童進行寶寶成長評估；受命法官隨後提示她為另一名服務兒童製作的成長日誌，內容涵蓋出生、飲食、排便、睡眠及身心發展，並確認確由陳尚潔撰寫，再直接追問：「為什麼他有寫，劉童沒寫？」</p>
        <p><b>責任判讀：</b>這項對照顯示，陳尚潔知道如何製作具體、細緻的兒童成長紀錄，也曾實際完成；因此剴剴案的問題較難只歸因於不熟悉表格或不知道怎麼記，而必須回答：為何同一社工在不同個案間出現明顯的追蹤與紀錄落差？但這仍是庭審質疑與證據評價線索，不能單憑一份紀錄斷言另一名兒童獲得完整保護，也不等於法院已就「差別對待」作成獨立法律認定。</p>
        <a href="#chen-growth-record-source-note">查看旁聽筆記中的回答與來源界線</a>
      </article>
''',
                  "note": '''
<aside class="record-boundary growth-record-source-note" id="chen-growth-record-source-note"><b>旁聽筆記對照</b><p>另一份2月23日旁聽筆記記載，受命法官問「為什麼他有寫，劉童沒寫？」陳尚潔回答「因為他媒合到收養」。目前頁面的公開轉錄版本把法官的追問與其後留職停薪問題合併呈現，未單列這句回答；因此在此補上來源差異，正式內容仍以法院筆錄為準。</p></aside>
''',
                  "modified_old": '<meta property="article:modified_time" content="2026-08-29">',
                  "modified_new": '<meta property="article:modified_time" content="2026-08-30">',
              },
              {
                  "path": Path("hearing-records/prison-watch/kaikai-final-chapter/zh-Hans/index.html"),
                  "nav_text": "同案成长纪录对照",
                  "article": '''
      <article id="chen-growth-record-comparison" class="growth-record-comparison">
        <span>同一社工・不同个案</span>
        <h5>另一名儿童有完整成长纪录，为什么剀剀没有？</h5>
        <p><b>庭上对照：</b>检方先追问陈尚洁如何替刘童进行宝宝成长评估；受命法官随后提示她为另一名服务儿童制作的成长日志，内容涵盖出生、饮食、排便、睡眠及身心发展，并确认确由陈尚洁撰写，再直接追问：“为什么他有写，刘童没写？”</p>
        <p><b>责任判读：</b>这项对照显示，陈尚洁知道如何制作具体、细致的儿童成长纪录，也曾实际完成；因此剀剀案的问题较难只归因于不熟悉表格或不知道怎么记，而必须回答：为何同一社工在不同个案间出现明显的追踪与纪录落差？但这仍是庭审质疑与证据评价线索，不能单凭一份纪录断言另一名儿童获得完整保护，也不等于法院已就“差别对待”作成独立法律认定。</p>
        <a href="#chen-growth-record-source-note">查看旁听笔记中的回答与来源界线</a>
      </article>
''',
                  "note": '''
<aside class="record-boundary growth-record-source-note" id="chen-growth-record-source-note"><b>旁听笔记对照</b><p>另一份2月23日旁听笔记记载，受命法官问“为什么他有写，刘童没写？”陈尚洁回答“因为他媒合到收养”。目前页面的公开转录版本把法官的追问与其后留职停薪问题合并呈现，未单列这句回答；因此在此补上来源差异，正式内容仍以法院笔录为准。</p></aside>
''',
                  "modified_old": '<meta property="article:modified_time" content="2026-08-29">',
                  "modified_new": '<meta property="article:modified_time" content="2026-08-30">',
              },
          ]

          for target in targets:
              path = target["path"]
              source = path.read_text(encoding="utf-8")

              if 'href="#chen-growth-record-comparison"' not in source:
                  nav_anchor = '<a href="#chen-questioning-20260223">2/23法庭攻防</a>'
                  if nav_anchor not in source:
                      raise RuntimeError(f"Navigation anchor not found in {path}")
                  source = source.replace(
                      nav_anchor,
                      nav_anchor + f'<a href="#chen-growth-record-comparison">{target["nav_text"]}</a>',
                      1,
                  )

              section_start = source.index(
                  '<section class="hearing-day" id="chen-questioning-20260223"'
              )
              dialogue_start = source.index(
                  '    <div class="hearing-dialogue"', section_start
              )

              if 'id="chen-growth-record-comparison"' not in source:
                  focus_close = source.rfind('    </aside>', section_start, dialogue_start)
                  if focus_close < 0:
                      raise RuntimeError(f"2/23 focus-map closing tag not found in {path}")
                  source = source[:focus_close] + target["article"] + source[focus_close:]
                  dialogue_start = source.index(
                      '    <div class="hearing-dialogue"', section_start
                  )

              if 'id="chen-growth-record-source-note"' not in source:
                  turn_120 = source.index(
                      '<article class="transcript-turn speaker-chen"><header><span>120</span>',
                      dialogue_start,
                  )
                  source = source[:turn_120] + target["note"] + source[turn_120:]

              if target["modified_old"] in source:
                  source = source.replace(
                      target["modified_old"], target["modified_new"], 1
                  )
              source = source.replace(
                  '"dateModified":"2026-08-29"',
                  '"dateModified":"2026-08-30"',
                  1,
              )

              if source.count('id="chen-growth-record-comparison"') != 1:
                  raise RuntimeError(f"Comparison card count invalid in {path}")
              if source.count('id="chen-growth-record-source-note"') != 1:
                  raise RuntimeError(f"Source note count invalid in {path}")
              if source.count('href="#chen-growth-record-comparison"') != 1:
                  raise RuntimeError(f"Comparison navigation link count invalid in {path}")

              path.write_text(source, encoding="utf-8")
              print(f"updated {path}")
          PY
          git diff --check
          python - <<'PY'
          from pathlib import Path
          checks = {
              Path('hearing-records/prison-watch/kaikai-final-chapter/index.html'): [
                  '同一社工・不同個案',
                  '為什麼他有寫，劉童沒寫？',
                  '因為他媒合到收養',
              ],
              Path('hearing-records/prison-watch/kaikai-final-chapter/zh-Hans/index.html'): [
                  '同一社工・不同个案',
                  '为什么他有写，刘童没写？',
                  '因为他媒合到收养',
              ],
          }
          for path, needles in checks.items():
              text = path.read_text(encoding='utf-8')
              missing = [needle for needle in needles if needle not in text]
              if missing:
                  raise SystemExit(f'{path}: missing {missing}')
              print(f'verified {path}')
          PY
      - name: Commit the focused content update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            hearing-records/prison-watch/kaikai-final-chapter/index.html \
            hearing-records/prison-watch/kaikai-final-chapter/zh-Hans/index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Add growth-record comparison to Chen accountability section'
          git pull --rebase origin main
          git push origin HEAD:main
