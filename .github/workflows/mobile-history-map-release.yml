name: Mobile history map cache bust

on:
  push:
    branches: [main]
    paths:
      - 'assets/home-gsap.js'
      - 'assets/home-gsap-map-20260824.js'
      - 'assets/home-archive-layout-20260823.js'
      - 'assets/home-history-paper-art-20260823.js'
      - 'assets/home-history-paper-art-20260823.css'
      - 'assets/home-history-relief-map-20260823.js'
      - 'assets/home-history-mobile-visibility-20260824.css'
      - 'assets/home-ia-bootstrap-20260823.js'
      - 'index.html'
      - 'en/index.html'
      - 'ja/index.html'
      - '.github/workflows/mobile-history-map-release.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-entrypoints:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Verify mobile history version chain
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          def capture(path, pattern, label):
              text = Path(path).read_text(encoding='utf-8')
              match = re.search(pattern, text)
              assert match, f'{label} version not found in {path}'
              return match.group(1), text

          expected, map_js = capture(
              'assets/home-gsap-map-20260824.js',
              r"var version='([^']+)';",
              'map loader',
          )
          loader_version, _ = capture(
              'assets/home-archive-layout-20260823.js',
              r"var version='([^']+)';",
              'archive loader',
          )
          paper_version, _ = capture(
              'assets/home-history-paper-art-20260823.js',
              r"var VERSION='([^']+)';",
              'paper stylesheet',
          )

          assert loader_version == expected, (loader_version, expected)
          assert paper_version == expected, (paper_version, expected)
          assert 'home-history-mobile-visibility-20260824.css' in map_js

          for path in ('index.html', 'en/index.html', 'ja/index.html'):
              html = Path(path).read_text(encoding='utf-8')
              match = re.search(r'home-gsap-map-20260824\.js\?v=([^"\']+)', html)
              assert match, f'map loader entrypoint missing in {path}'
              assert match.group(1) == expected, (path, match.group(1), expected)

          sw = Path('sw.js').read_text(encoding='utf-8')
          assert "url.pathname.includes('/assets/home-history-')" in sw
          assert "url.pathname.endsWith('/assets/home-gsap-map-20260824.js')" in sw
          print(f'Validated mobile history version chain: {expected}')
          PY

      - name: JavaScript syntax
        run: |
          set -euo pipefail
          node --check assets/home-gsap.js
          node --check assets/home-gsap-map-20260824.js
          node --check assets/home-archive-layout-20260823.js
          node --check assets/home-history-paper-art-20260823.js
          node --check assets/home-history-relief-map-20260823.js
          node --check assets/home-ia-bootstrap-20260823.js
