name: Deploy Hong Kong child advocacy mirror

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/deploy-hk-site-mirror.yml'
      - 'assets/site.js'
      - 'assets/legal-notice.js'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hong-kong-child-advocacy-mirror
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Verify nginx route isolation and rollback
        run: |
          python3 -m pip install --quiet PyYAML
          python3 scripts/test-hk-nginx-isolation.py

      - name: Build public mirror package
        shell: bash
        run: |
          set -Eeuo pipefail
          root="mirror/child-advocacy-site"
          mkdir -p "$root"
          find . -maxdepth 1 -type f \
            ! -name '*.md' ! -name '*.yml' ! -name '*.yaml' \
            ! -name '.gitignore' -exec cp -a {} "$root/" \;
          for dir in about activity-records art assets audio cases court-comics data en features global-protection-wall hearing-records historical-cases ja news social zh-Hans zh-hans; do
            test ! -d "$dir" || rsync -a \
              --exclude '__pycache__/' --exclude '*.pyc' \
              "$dir/" "$root/$dir/"
          done
          tar -C mirror -czf hk-child-advocacy-site.tgz child-advocacy-site

      - name: Validate published routes and redirect coverage
        shell: python
        run: |
          from pathlib import Path
          from urllib.parse import urlparse
          import xml.etree.ElementTree as ET

          root = Path("mirror/child-advocacy-site")
          required = [
              root / "index.html",
              root / "en/index.html",
              root / "ja/index.html",
              root / "news/index.html",
              root / "hearing-records/prison-watch/kaikai-day6-20250430/index.html",
              root / "assets/legal-notice.js",
          ]
          missing = [str(path) for path in required if not path.is_file()]
          assert not missing, "Missing required mirror files: " + ", ".join(missing)

          sitemap = ET.parse(root / "sitemap.xml")
          namespace = {"sm": "http://www.sitemaps.org/schemas/sitemap/0.9"}
          missing_routes = []
          for node in sitemap.findall(".//sm:loc", namespace):
              path = urlparse(node.text.strip()).path
              prefix = "/child-advocacy-site/"
              if not path.startswith(prefix):
                  continue
              relative = path[len(prefix):]
              candidate = root / relative
              if path.endswith("/"):
                  candidate = candidate / "index.html"
              if not candidate.is_file():
                  missing_routes.append(path)
          assert not missing_routes, "Sitemap routes missing from mirror: " + ", ".join(missing_routes[:20])

          uncovered = []
          for path in root.rglob("*.html"):
              text = path.read_text(encoding="utf-8", errors="ignore")
              if "assets/legal-notice.js" not in text and "assets/site.js" not in text:
                  continue
              # Pages using site.js load legal-notice.js through the shared loader.
          samples = [
              root / "index.html",
              root / "news/index.html",
              root / "hearing-records/prison-watch/kaikai-day6-20250430/index.html",
          ]
          for path in samples:
              text = path.read_text(encoding="utf-8", errors="ignore")
              if "assets/legal-notice.js" not in text and "assets/site.js" not in text:
                  uncovered.append(str(path))
          assert not uncovered, "Redirect layer missing from sampled entry points: " + ", ".join(uncovered)

          redirect = (root / "assets/legal-notice.js").read_text(encoding="utf-8")
          assert "https://cn.globalprotectionwall.com/child-advocacy-site" in redirect
          assert "window.location.search+window.location.hash" in redirect
          print(f"Validated {len(list(root.rglob('*.html')))} HTML files and all sitemap routes.")

      - uses: actions/upload-artifact@v4
        with:
          name: hk-child-advocacy-site
          path: hk-child-advocacy-site.tgz
          retention-days: 7

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      HK_HOST: ${{ secrets.TENCENT_SSH_HOST }}
      HK_USER: ${{ secrets.TENCENT_SSH_USER }}
      HK_PORT: ${{ secrets.TENCENT_SSH_PORT }}
      HK_KEY_A: ${{ secrets.TENCENT_SSH_PRIVATE_KEY }}
      HK_KEY_B: ${{ secrets.TENCENT_CVM_SSH_KEY }}
      HK_KEY_C: ${{ secrets.SSH_PRIVATE_KEY }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: hk-child-advocacy-site

      - name: Configure SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          host="${HK_HOST:-150.109.69.104}"
          user="${HK_USER:-ubuntu}"
          port="${HK_PORT:-22}"
          key="${HK_KEY_A:-${HK_KEY_B:-${HK_KEY_C:-}}}"
          if [ -z "$key" ]; then
            echo '::error::Hong Kong deployment requires a configured TENCENT_SSH_PRIVATE_KEY, TENCENT_CVM_SSH_KEY, or SSH_PRIVATE_KEY repository secret.'
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$key" > ~/.ssh/hk_key
          chmod 600 ~/.ssh/hk_key
          ssh-keyscan -p "$port" "$host" > ~/.ssh/known_hosts
          printf 'HOST=%s\nUSER=%s\nPORT=%s\n' "$host" "$user" "$port" >> "$GITHUB_ENV"

      - name: Upload versioned mirror release
        shell: bash
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          archive="/tmp/hk-child-advocacy-site-$RELEASE_SHA.tgz"
          scp -i ~/.ssh/hk_key -P "$PORT" hk-child-advocacy-site.tgz "$USER@$HOST:$archive"
          ssh -i ~/.ssh/hk_key -p "$PORT" "$USER@$HOST" \
            "sudo RELEASE_SHA='$RELEASE_SHA' ARCHIVE='$archive' bash -s" <<'REMOTE'
          set -Eeuo pipefail
          base=/srv/child-advocacy-site
          release="$base/releases/$RELEASE_SHA"
          staging="$base/releases/$RELEASE_SHA.staging"
          if [ ! -d "$release" ]; then
            rm -rf "$staging"
            mkdir -p "$staging"
            tar -xzf "$ARCHIVE" -C "$staging"
            test -s "$staging/child-advocacy-site/index.html"
            mv "$staging" "$release"
          fi
          rm -f "$ARCHIVE"
          ln -sfn "$release" "$base/current.next"
          mv -Tf "$base/current.next" "$base/current"
          REMOTE

      - name: Install isolated nginx mirror route
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/hk_key -p "$PORT" "$USER@$HOST" 'sudo python3 -' <<'PY'
          from pathlib import Path
          import re, shutil, subprocess, time

          domain = "cn.globalprotectionwall.com"
          marker = "# child-advocacy-full-mirror"
          candidates = []
          for root in (Path("/etc/nginx/sites-enabled"), Path("/etc/nginx/conf.d")):
              if root.exists():
                  candidates.extend(path for path in root.iterdir() if path.is_file() or path.is_symlink())

          def server_name_position(body):
              for match in re.finditer(r"(?m)^\s*server_name\s+([^;]+);", body):
                  if domain in match.group(1).split():
                      return match.start()
              return None

          target = text = domain_pos = None
          for path in candidates:
              try:
                  body = path.read_text()
              except Exception:
                  continue
              position = server_name_position(body)
              if position is not None:
                  target, text, domain_pos = path.resolve(), body, position
                  break
          if target is None:
              raise SystemExit("No nginx server block found for " + domain)

          legacy_marker = "# legacy-child-advocacy-cases-route"

          def structure(body):
              # Preserve offsets, but ignore braces inside comments and quoted values.
              return re.sub(r'''#[^\n]*|"(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*' '''.rstrip(),
                            lambda m: re.sub(r"[^\n]", " ", m.group()), body)

          def server_block_bounds(body, name_pos):
              syntax = structure(body)
              matches = list(re.finditer(r"(?m)^\s*server\s*\{", syntax[:name_pos]))
              if not matches:
                  raise SystemExit("Could not locate nginx server block start")
              server_pos = matches[-1].start()
              brace = body.find("{", matches[-1].start(), matches[-1].end())
              depth = 0
              for index in range(brace, len(body)):
                  if syntax[index] == "{":
                      depth += 1
                  elif syntax[index] == "}":
                      depth -= 1
                      if depth == 0:
                          return server_pos, index
              raise SystemExit("Could not locate nginx server block boundary")

          def remove_location_blocks(body, declaration):
              pattern = re.compile(r"(?m)^[ \t]*" + re.escape(declaration) + r"[ \t]*\{")
              while True:
                  syntax = structure(body)
                  match = next((m for m in pattern.finditer(syntax)
                                if syntax[:m.start()].count("{") - syntax[:m.start()].count("}") == 1), None)
                  if match is None:
                      return body
                  line_start = match.start()
                  marker_start = line_start
                  previous_start = body.rfind("\n", 0, max(0, line_start - 1)) + 1
                  previous = body[previous_start:line_start].strip()
                  if previous in {marker, legacy_marker}:
                      marker_start = previous_start
                  brace = body.find("{", match.start(), match.end())
                  depth = 0
                  block_end = None
                  for index in range(brace, len(body)):
                      if syntax[index] == "{":
                          depth += 1
                      elif syntax[index] == "}":
                          depth -= 1
                          if depth == 0:
                              block_end = index + 1
                              break
                  if block_end is None:
                      raise SystemExit("Could not parse existing nginx location: " + declaration)
                  while block_end < len(body) and body[block_end] in " \t\r\n":
                      block_end += 1
                  body = body[:marker_start] + body[block_end:]

          server_start, server_end = server_block_bounds(text, domain_pos)
          server_block = text[server_start:server_end + 1]

          # Normalize only exact mirror locations inside the selected Hong Kong
          # virtual host. Other server blocks and more-specific routes are preserved.
          for declaration in (
              "location = /child-advocacy-site",
              "location ^~ /child-advocacy-site/",
              "location ^~ /cases/",
              "location /cases/",
          ):
              server_block = remove_location_blocks(server_block, declaration)

          if server_name_position(server_block) is None:
              raise SystemExit("Target server_name disappeared while normalizing nginx config")
          insert_at = server_block.rfind("}")
          if insert_at < 0:
              raise SystemExit("Could not locate nginx server block boundary")

          snippet = """
              # child-advocacy-full-mirror
              location = /child-advocacy-site {
                  return 301 /child-advocacy-site/;
              }
              location ^~ /child-advocacy-site/ {
                  root /srv/child-advocacy-site/current;
                  try_files $uri $uri/ $uri/index.html =404;
                  add_header X-Robots-Tag "noindex, nofollow" always;
              }

              # legacy-child-advocacy-cases-route
              location ^~ /cases/ {
                  root /srv/child-advocacy-site/current/child-advocacy-site;
                  try_files $uri $uri/ $uri/index.html =404;
                  add_header X-Robots-Tag "noindex, nofollow" always;
              }
          """
          # Keep backups outside conf.d / sites-enabled: nginx must never load them.
          backup_dir = Path("/var/backups/child-advocacy-nginx")
          backup_dir.mkdir(parents=True, exist_ok=True)
          backup = backup_dir / (target.name + ".bak-" + str(time.time_ns()))
          shutil.copy2(target, backup)
          server_block = server_block[:insert_at] + snippet + server_block[insert_at:]
          target.write_text(text[:server_start] + server_block + text[server_end + 1:])
          try:
              subprocess.run(["nginx", "-t"], check=True)
              subprocess.run(["systemctl", "reload", "nginx"], check=True)
          except Exception:
              shutil.copy2(backup, target)
              subprocess.run(["nginx", "-t"], check=True)
              subprocess.run(["systemctl", "reload", "nginx"], check=True)
              raise
          PY

      - name: Recover Hong Kong wall service
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/hk_key -p "$PORT" "$USER@$HOST" 'sudo bash -s' <<'REMOTE'
          set -Eeuo pipefail
          service=global-protection.service
          local_url=http://127.0.0.1:8787/
          healthy=
          for attempt in 1 2 3; do
            code="$(curl --connect-timeout 3 --max-time 10 -sS -o /tmp/hk-wall-local.html -w '%{http_code}' "$local_url" || true)"
            if [ "$code" = 200 ] && [ "$(wc -c < /tmp/hk-wall-local.html)" -gt 1000 ]; then
              healthy=1
              break
            fi
            sleep 2
          done
          if [ -z "$healthy" ]; then
            systemctl restart "$service"
            for attempt in 1 2 3 4 5 6; do
              code="$(curl --connect-timeout 3 --max-time 10 -sS -o /tmp/hk-wall-local.html -w '%{http_code}' "$local_url" || true)"
              if [ "$code" = 200 ] && [ "$(wc -c < /tmp/hk-wall-local.html)" -gt 1000 ]; then
                healthy=1
                break
              fi
              sleep 5
            done
          fi
          test -n "$healthy" || {
            systemctl --no-pager --full status "$service" || true
            journalctl -u "$service" -n 80 --no-pager || true
            echo "Hong Kong wall service did not recover on port 8787"
            exit 1
          }
          nginx -t
          systemctl reload nginx
          REMOTE

      - name: Verify Hong Kong wall
        shell: bash
        run: |
          set -Eeuo pipefail
          checks=(/ /api/public/messages)
          for path in "${checks[@]}"; do
            ok=
            for attempt in 1 2 3 4 5; do
              code="$(curl --connect-timeout 10 --max-time 25 -sS -o /tmp/wall-response -w '%{http_code}' "https://cn.globalprotectionwall.com$path" || true)"
              size="$(wc -c < /tmp/wall-response 2>/dev/null || echo 0)"
              if [ "$code" = 200 ] && [ "$size" -gt 10 ]; then
                ok=1
                break
              fi
              sleep 4
            done
            test -n "$ok" || {
              echo "Hong Kong wall verification failed: $path status=${code:-none} size=${size:-0}"
              exit 1
            }
          done

      - name: Verify Hong Kong mirror
        shell: bash
        run: |
          set -Eeuo pipefail
          paths=(
            /child-advocacy-site/
            /cases/kaikai/features/rescue-windows/
            /cases/kaikai/features/final-24-hours/
            /cases/kaikai/features/final-24-hours/dialogues/
            /child-advocacy-site/cases/kaikai/features/final-24-hours/
            /child-advocacy-site/cases/kaikai/features/final-24-hours/dialogues/
            /child-advocacy-site/en/
            /child-advocacy-site/ja/
            /child-advocacy-site/news/
            /child-advocacy-site/hearing-records/prison-watch/kaikai-day6-20250430/
          )
          for path in "${paths[@]}"; do
            ok=
            for attempt in 1 2 3 4 5; do
              code="$(curl --connect-timeout 10 --max-time 25 -sS -o /tmp/page.html -w '%{http_code}' "https://cn.globalprotectionwall.com$path" || true)"
              if [ "$code" = 200 ] && [ "$(wc -c < /tmp/page.html)" -gt 1000 ]; then
                ok=1
                break
              fi
              sleep 4
            done
            test -n "$ok" || { echo "Mirror verification failed: $path status=${code:-none}"; exit 1; }
          done
