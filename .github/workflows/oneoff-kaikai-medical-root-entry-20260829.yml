name: Publish and verify Kaikai medical hub root navigation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oneoff-kaikai-medical-root-entry-20260829.yml'

permissions:
  contents: write

jobs:
  publish-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add bilingual root-menu entry and sitemap URLs
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin main
          python3 .github/scripts/add-kaikai-medical-root-entry-20260829.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          old = "root.querySelectorAll('[data-medical-hant][data-medical-hans]').forEach(node=>{"
          new = "document.querySelectorAll('[data-medical-hant][data-medical-hans]').forEach(node=>{"
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Expected one scoped medical-copy localizer, found {count}')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
          git diff --check
          grep -q 'KAIKAI-MEDICAL-ROOT-ENTRY-20260829' index.html
          grep -q 'data-kaikai-medical-root-entry' index.html
          grep -q 'medical-responsibility/zh-Hans/' index.html
          grep -q 'medical-responsibility/zh-Hans/' sitemap.xml
          grep -q 'medical-responsibility/' sitemap.xml

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sitemap.xml
          git commit -m 'Add medical responsibility hub to root navigation and sitemap'
          pushed=0
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              pushed=1
              break
            fi
            git pull --rebase origin main
          done
          test "$pushed" -eq 1

      - name: Wait for GitHub Pages publication
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p browser-validation/medical-root-entry
          root='https://jerryzuhow77.github.io/child-advocacy-site/'
          sitemap='https://jerryzuhow77.github.io/child-advocacy-site/sitemap.xml'
          medical='https://jerryzuhow77.github.io/child-advocacy-site/hearing-records/prison-watch/kaikai-final-chapter/medical-responsibility/'
          hans='https://jerryzuhow77.github.io/child-advocacy-site/hearing-records/prison-watch/kaikai-final-chapter/medical-responsibility/zh-Hans/'
          for attempt in $(seq 1 105); do
            ready=1
            token="${GITHUB_SHA}-${attempt}-$(date +%s%N)"
            root_html="$(curl -fsSL --connect-timeout 15 --max-time 30 "${root}?qa=${token}" || true)"
            map_xml="$(curl -fsSL --connect-timeout 15 --max-time 30 "${sitemap}?qa=${token}" || true)"
            grep -q 'KAIKAI-MEDICAL-ROOT-ENTRY-20260829' <<<"$root_html" || ready=0
            grep -q 'data-kaikai-medical-root-entry' <<<"$root_html" || ready=0
            grep -q 'medical-responsibility/zh-Hans/' <<<"$map_xml" || ready=0
            curl -fsSI --connect-timeout 15 --max-time 30 "${medical}?qa=${token}" >/dev/null || ready=0
            curl -fsSI --connect-timeout 15 --max-time 30 "${hans}?qa=${token}" >/dev/null || ready=0
            if [[ "$ready" -eq 1 ]]; then
              echo 'Root navigation and both localized medical hubs are public.'
              exit 0
            fi
            sleep 10
          done
          echo 'Timed out before the root medical navigation entry became public.' >&2
          exit 1

      - name: Install Playwright driver
        run: npm install --no-save playwright-core@1.55.0

      - name: Verify root entry and medical hub in desktop and mobile Chrome
        run: node .github/scripts/verify-kaikai-medical-root-entry-20260829.mjs

      - name: Upload browser screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kaikai-medical-root-entry-browser-proof
          path: browser-validation/medical-root-entry
          retention-days: 14
