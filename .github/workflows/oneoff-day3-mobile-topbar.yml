name: Enable Day3 mobile topbar
on:
  push:
    branches: [main]
    paths: ['.github/workflows/oneoff-day3-mobile-topbar.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('hearing-records/prison-watch/kaikai-day3-20250425/index.html')
          s=p.read_text(encoding='utf-8')
          tag='<link rel="stylesheet" href="./day3-mobile-topbar.css?v=20260821-1">\n'
          if 'day3-mobile-topbar.css' not in s:s=s.replace('</head>',tag+'</head>',1)
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hearing-records/prison-watch/kaikai-day3-20250425/index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Enable compact mobile topbar on Day 3 hearing record'
          git push
