<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>旁聽紀錄｜護童行動聯盟</title>
<link rel="stylesheet" href="../assets/site.css">
<link rel="icon" href="../assets/brand/favicon.jpg">
</head>
<body>
<header><div class="container nav"><a class="brand" href="../">護童行動聯盟</a><nav><a href="../">首頁</a><a href="../court-comics/">法庭漫畫</a><a href="../hearing-records/">旁聽紀錄</a><a href="../activity-records/">活動紀錄</a><a href="../activity-records/albums/">活動相簿</a><a href="../#social">官方社群</a><button class="lang-btn" onclick="toggleLang()">简</button></nav></div></header>
<section class="page-hero art-page-hero"><div class="container"><div class="art-eyebrow">HEARING RECORDS</div><h1>旁聽紀錄</h1><p>從庭訊現場留下可查閱的公共紀錄；區分庭上主張、程序進度與法院最終認定。</p></div></section>
<section><div class="container"><div id="list" class="record-list"></div></div></section>

<section class="visual-related">
  <div class="container">
    <div class="related-head">
      <div class="art-eyebrow dark">FEATURED RECORDS</div>
      <h2>專題導覽</h2>
    </div>
    <div class="visual-related-grid">
      <a class="visual-related-card" href="../hearing-records/tucheng-two-year-old-20260806/">
        <img src="../poster-hearing.jpg" alt="土城兩歲男童命案旁聽紀錄 AI 藝術廣告圖">
        <div class="visual-related-copy">
          <small>旁聽紀錄</small>
          <h3>「最後抱著兩瓶牛奶離世的孩子」</h3>
          <p>8/6 二審準備程序旁聽紀錄</p>
        </div>
      </a>
      <a class="visual-related-card" href="../activity-records/20260801-ketagal-rally/">
        <img src="../poster-rally.jpg" alt="8月1日反毒駕反酒駕凱道大遊行 AI 藝術廣告圖">
        <div class="visual-related-copy">
          <small>活動紀錄</small>
          <h3>反毒駕、反酒駕．凱道大遊行</h3>
          <p>活動文字、照片相簿與影片紀錄</p>
        </div>
      </a>
    </div>
  </div>
</section>

<footer><div class="container">護童行動聯盟</div></footer>
<script src="../assets/site.js"></script>
<script>
fetch('../data/hearing-records.json').then(r=>r.json()).then(a=>{
  const box=document.getElementById('list');
  box.innerHTML=a.slice().reverse().map(x=>`<article class="record-card">
    <a class="record-card-image" href="${x.url}"><img src="${x.image}" alt="${x.title}"></a>
    <div class="record-card-copy">
      <div class="meta">${x.date} ｜ ${x.court||''}</div>
      <h3>${x.title}</h3>
      <p>${x.summary||''}</p>
      <a class="read-btn" href="${x.url}">閱讀完整紀錄 →</a>
    </div>
  </article>`).join('');
  setLang(localStorage.getItem('siteLang')||'zh-Hant');
}).catch(()=>{document.getElementById('list').innerHTML='<div class="record">目前無法載入旁聽紀錄。</div>'});
</script>
</body></html>
