<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>旁聽紀錄｜護童行動聯盟</title>
<link rel="stylesheet" href="../assets/site.css">
</head>
<body>
<header><div class="container nav"><a class="brand" href="../">護童行動聯盟</a><nav><a href="../">首頁</a><a href="../court-comics/">法庭漫畫</a><a href="../hearing-records/">旁聽紀錄</a><a href="../activity-records/">活動紀錄</a><a href="../#social">官方社群</a><button class="lang-btn" onclick="toggleLang()">简</button></nav></div></header>
<section class="page-hero"><div class="container"><h1>旁聽紀錄</h1><p>依日期整理法院旁聽紀錄。列表提供案件摘要，點擊「閱讀完整紀錄」即可進入各場庭訊的獨立文章頁。</p></div></section>
<section><div class="container"><div id="list" class="record-list"></div></div></section>
<footer><div class="container">護童行動聯盟</div></footer>
<script src="../assets/site.js"></script>
<script>
fetch('../data/hearing-records.json').then(r=>r.json()).then(a=>{
  const box=document.getElementById('list');
  box.innerHTML=a.slice().reverse().map(x=>`<article class="record-card">
    <a class="record-card-image" href="${x.url}"><img src="${x.image}" alt="${x.title}"></a>
    <div class="record-card-copy">
      <div class="meta">${x.date} ｜ ${x.court||''}</div>
      <h3>${x.title}</h3>
      <p>${x.summary||''}</p>
      <a class="read-btn" href="${x.url}">閱讀完整紀錄 →</a>
    </div>
  </article>`).join('');
  setLang(localStorage.getItem('siteLang')||'zh-Hant');
}).catch(()=>{document.getElementById('list').innerHTML='<div class="record">目前無法載入旁聽紀錄。</div>'});
</script>
</body></html>
