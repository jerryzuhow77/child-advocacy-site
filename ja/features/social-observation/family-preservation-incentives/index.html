<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>子どもは安全に原家族と暮らせるか</title><link rel="stylesheet" href="/child-advocacy-site/assets/family-preservation-observation.css"></head><body><main class="page"><h1>子どもは安全に原家族と暮らせるか</h1><p>剴剴案、萱萱案、10歳女児の措置をめぐる争点、南投・呉児童事案、韓国の安置後死亡の警鐘、家族支援モデルの六事例を比較する。未確認の個人責任を推認するものではない。</p><h2>分離前の最低基準</h2><p>直ちに危険なら保護と医療を優先する。危険を低減できるなら72時間の安全計画を作る。支援不足なら30日以内に保育、休息支援、住居、医療、親支援を実際に開始する。</p></main></body></html>
