</head><body><main><h1>子どもの笑顔を守り、愛を羽ばたかせる</h1><p>10月4日、中国・深圳市龍崗区横崗大厦付近で、子どもの保護をテーマにした地域公益活動が開かれました。願いのカード、メッセージボード、手作りの交流を通じ、子どもの安全と権利を大切にする声が集まりました。</p><p>活動では剴剴の事件にも触れ、子どものSOSを見落とさず、保護のプロセスを可視化し、責任ある引き継ぎと継続的な確認を行う必要性を共有しました。</p><h2>司法手続への配慮</h2><p>剴剴事件に関連する陳尚潔氏の事件は、現在も司法手続中であり、<strong>判決は確定していません</strong>。本ページは刑事責任を予断するものではなく、事実と法的責任は裁判所の最終判断に委ねられます。</p><img src="/child-advocacy-site/assets/news/shenzhen-children-protection-20261004/01-1000029440.png" alt="深圳の子ども保護地域活動" width="100%"></main><script data-cpa-four-language-toolbar-script src="/child-advocacy-site/assets/four-language-toolbar-20260901.js?v=20260911-hk-site-home-4"></script>
