<div class="kaikai-memorial-copy"><p>志工夥伴來到墓園，帶著花、點心與守護孩子的心意，靜靜陪伴、深深追念。願每一次記得，都成為推動制度改變的力量；願下一個孩子，在傷害發生以前，就有人伸手接住。</p><strong>勿忘剴剴・讓思念成為守護</strong></div>
