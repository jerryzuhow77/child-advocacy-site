<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>8月1日凱道大遊行活動相簿｜護童行動聯盟</title>
<link rel="stylesheet" href="../../../assets/site.css">
<link rel="icon" href="../../../assets/brand/favicon.jpg">
</head>
<body>
<header><div class="container nav"><a class="brand" href="../../../">護童行動聯盟</a><nav>
<a href="../../../">首頁</a>
<a href="../../../court-comics/">法庭漫畫</a>
<a href="../../../hearing-records/">旁聽紀錄</a>
<a href="../../../activity-records/">活動紀錄</a>
<a href="../">活動相簿</a>
<button class="lang-btn" onclick="toggleLang()">简</button>
</nav></div></header>

<section class="page-hero art-page-hero album-hero"><div class="container"><div class="art-eyebrow">PHOTO ARCHIVE</div>
<div class="meta" style="color:#f5d869">2026 / 08 / 01</div>
<h1>反毒駕、反酒駕．凱道大遊行</h1>
<p>活動照片紀錄｜點擊照片可放大瀏覽。</p>
</div></section>

<section><div class="container">
<div id="albumGrid" class="album-photo-grid"></div>
</div></section>

<div id="lightbox" class="lightbox" aria-hidden="true">
  <button class="lightbox-close" aria-label="關閉">×</button>
  <button class="lightbox-prev" aria-label="上一張">‹</button>
  <figure><img id="lightboxImg" alt=""><figcaption id="lightboxCaption"></figcaption></figure>
  <button class="lightbox-next" aria-label="下一張">›</button>
</div>

<footer><div class="container">護童行動聯盟</div></footer>
<script src="../../../assets/site.js"></script>
<script>
let albumPhotos=[], currentIndex=0;
const grid=document.getElementById('albumGrid');
const lb=document.getElementById('lightbox');
const lbImg=document.getElementById('lightboxImg');
const lbCap=document.getElementById('lightboxCaption');

function openPhoto(i){
  currentIndex=i;
  const p=albumPhotos[i];
  lbImg.src=p.src; lbImg.alt=p.alt||p.caption||'活動照片';
  lbCap.textContent=p.caption||'';
  lb.classList.add('show'); lb.setAttribute('aria-hidden','false');
}
function closePhoto(){lb.classList.remove('show');lb.setAttribute('aria-hidden','true')}
function step(d){if(!albumPhotos.length)return;openPhoto((currentIndex+d+albumPhotos.length)%albumPhotos.length)}

fetch('./photos.json').then(r=>r.json()).then(data=>{
  albumPhotos=data;
  grid.innerHTML=data.map((p,i)=>`<figure class="album-photo-card" onclick="openPhoto(${i})"><img loading="lazy" src="${p.src}" alt="${p.alt||p.caption||'活動照片'}"><figcaption>${p.caption||''}</figcaption></figure>`).join('');
  setLang(localStorage.getItem('siteLang')||'zh-Hant');
});
document.querySelector('.lightbox-close').onclick=closePhoto;
document.querySelector('.lightbox-prev').onclick=()=>step(-1);
document.querySelector('.lightbox-next').onclick=()=>step(1);
lb.addEventListener('click',e=>{if(e.target===lb)closePhoto()});
document.addEventListener('keydown',e=>{if(!lb.classList.contains('show'))return;if(e.key==='Escape')closePhoto();if(e.key==='ArrowLeft')step(-1);if(e.key==='ArrowRight')step(1)});
</script>
</body></html>
