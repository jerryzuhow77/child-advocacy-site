<script src="../../../assets/site.js"></script>
<script>
let albumPhotos=[], currentIndex=0;
const grid=document.getElementById('albumGrid');
const lb=document.getElementById('lightbox');
const lbImg=document.getElementById('lightboxImg');
const lbCap=document.getElementById('lightboxCaption');

function openPhoto(i){
  currentIndex=i;
  const p=albumPhotos[i];
  lbImg.src=p.src; lbImg.alt=p.alt||p.caption||'活動照片';
  lbCap.textContent=p.caption||'';
  lb.classList.add('show'); lb.setAttribute('aria-hidden','false');
}
function closePhoto(){lb.classList.remove('show');lb.setAttribute('aria-hidden','true')}
function step(d){if(!albumPhotos.length)return;openPhoto((currentIndex+d+albumPhotos.length)%albumPhotos.length)}

fetch('./photos.json').then(r=>r.json()).then(data=>{
  albumPhotos=data;
  grid.innerHTML=data.map((p,i)=>`<figure class="album-photo-card" onclick="openPhoto(${i})"><img loading="lazy" src="${p.src}" alt="${p.alt||p.caption||'活動照片'}"><figcaption>${p.caption||''}</figcaption></figure>`).join('');
  setLang(localStorage.getItem('siteLang')||'zh-Hant');
});
document.querySelector('.lightbox-close').onclick=closePhoto;
document.querySelector('.lightbox-prev').onclick=()=>step(-1);
document.querySelector('.lightbox-next').onclick=()=>step(1);
lb.addEventListener('click',e=>{if(e.target===lb)closePhoto()});
document.addEventListener('keydown',e=>{if(!lb.classList.contains('show'))return;if(e.key==='Escape')closePhoto();if(e.key==='ArrowLeft')step(-1);if(e.key==='ArrowRight')step(1)});
</script>
