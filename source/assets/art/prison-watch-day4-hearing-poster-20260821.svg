<svg xmlns="http://www.w3.org/2000/svg" width="972" height="1619" viewBox="0 0 972 1619" role="img" aria-labelledby="title desc">
<title id="title">剴剴案第四日第四次審判期日重製編輯筆記主視覺</title>
<desc id="desc">深藍與紙色構成的法庭紀錄海報，兩張空椅象徵兩位證人，三個圓點連成甲地、丙地、乙地的照顧動線。</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7f0e5"/><stop offset=".52" stop-color="#e7eef0"/><stop offset="1" stop-color="#ead8cd"/></linearGradient>
  <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#102b3a"/><stop offset="1" stop-color="#315667"/></linearGradient>
  <linearGradient id="rust" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6f3029"/><stop offset="1" stop-color="#aa5947"/></linearGradient>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#102b3a" flood-opacity=".18"/></filter>
  <filter id="paper"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="3" seed="17" result="n"/><feColorMatrix in="n" type="saturate" values="0" result="g"/><feComponentTransfer in="g"><feFuncA type="table" tableValues="0 .06"/></feComponentTransfer></filter>
  <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#102b3a" stroke-opacity=".045" stroke-width="1"/></pattern>
</defs>
<rect width="972" height="1619" fill="url(#bg)"/>
<rect width="972" height="1619" fill="url(#grid)"/>
<rect width="972" height="1619" filter="url(#paper)" opacity=".12"/>
<path d="M0 0H972V258C804 226 660 263 520 236 363 207 245 129 0 179Z" fill="url(#ink)"/>
<path d="M0 1460C231 1399 376 1477 555 1448 719 1422 835 1341 972 1378V1619H0Z" fill="#102b3a"/>
