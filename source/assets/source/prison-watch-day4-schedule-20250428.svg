<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
<title id="title">2025年4月28日第四次審判期日預定程序重製圖</title>
<desc id="desc">以表格方式整理上午劉若琳、下午劉彩萱的證人詰問與休庭時段。</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8f2e8"/><stop offset="1" stop-color="#e7eef0"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#102b3a" flood-opacity=".14"/></filter></defs>
<rect width="1200" height="900" fill="url(#bg)"/>
<g font-family="Noto Sans CJK TC, PingFang TC, Microsoft JhengHei, sans-serif">
<text x="74" y="82" fill="#9f4e3f" font-size="23" font-weight="900" letter-spacing="4">COURT SCHEDULE · EDITED RECONSTRUCTION</text>
<text x="74" y="145" fill="#102b3a" font-size="48" font-weight="950">第四次審判期日｜預定程序</text>
<text x="74" y="190" fill="#4d6a77" font-size="23" font-weight="700">2025年4月28日（一）・證據調查程序</text>
<g transform="translate(74 242)" filter="url(#shadow)">
<rect width="1052" height="540" rx="28" fill="#fff" fill-opacity=".94" stroke="#102b3a" stroke-opacity=".13"/>
<rect width="1052" height="78" rx="28" fill="#102b3a"/><rect y="52" width="1052" height="26" fill="#102b3a"/>
<text x="76" y="50" fill="#fff" font-size="24" font-weight="900">時段</text><text x="282" y="50" fill="#fff" font-size="24" font-weight="900">程序</text><text x="772" y="50" fill="#fff" font-size="24" font-weight="900">證人／重點</text>
<g fill="#102b3a" font-size="22"><text x="64" y="130" font-weight="900">09:30–10:20</text><text x="282" y="130">辯護人主詰問</text><text x="772" y="130" font-weight="900">劉若琳</text>
<text x="64" y="194" font-weight="900">10:20–10:30</text><text x="282" y="194">暫休</text><text x="772" y="194">程序整理</text>
<text x="64" y="258" font-weight="900">10:30–11:00</text><text x="282" y="258">檢察官反詰問</text><text x="772" y="258">照顧觀察、傷勢與通報</text>
<text x="64" y="322" font-weight="900">11:00–11:15</text><text x="282" y="322">暫休</text><text x="772" y="322">程序整理</text>
<text x="64" y="386" font-weight="900">11:15–11:45</text><text x="282" y="386">法院詢問</text><text x="772" y="386">國民法官與職業法官</text>
<text x="64" y="450" font-weight="900">11:45–14:00</text><text x="282" y="450">午休</text><text x="772" y="450">下午續行</text>
<text x="64" y="514" font-weight="900">14:00–15:30</text><text x="282" y="514">辯護人主詰問</text><text x="772" y="514" font-weight="900">劉彩萱</text></g>
<g stroke="#d7e1e5" stroke-width="2"><line x1="0" y1="142" x2="1052" y2="142"/><line x1="0" y1="206" x2="1052" y2="206"/><line x1="0" y1="270" x2="1052" y2="270"/><line x1="0" y1="334" x2="1052" y2="334"/><line x1="0" y1="398" x2="1052" y2="398"/><line x1="0" y1="462" x2="1052" y2="462"/><line x1="205" y1="78" x2="205" y2="540"/><line x1="690" y1="78" x2="690" y2="540"/></g>
</g>
<text x="74" y="842" fill="#5a717c" font-size="18">依監所關注小組原始紀錄第1頁所附程序照片重製；實際入庭、休庭時間以旁聽紀錄為準。</text>
</g>
</svg>
