<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">粉彩畫風格的兒少新聞專區主視覺</title>
  <desc id="desc">莫蘭迪粉、霧藍與鼠尾草綠交疊成柔和紙張、雲朵與孩子剪影，為藝術意象而非事件現場。</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f9eee8"/>
      <stop offset=".48" stop-color="#eed9df"/>
      <stop offset="1" stop-color="#dbe4df"/>
    </linearGradient>
    <linearGradient id="sky" x1=".15" y1="0" x2=".9" y2="1">
      <stop offset="0" stop-color="#efd0d7"/>
      <stop offset=".5" stop-color="#cfd8df"/>
      <stop offset="1" stop-color="#c7d4c8"/>
    </linearGradient>
    <linearGradient id="child" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#cf9e87"/>
      <stop offset="1" stop-color="#9f7569"/>
    </linearGradient>
    <filter id="watercolor" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency=".018 .035" numOctaves="3" seed="17" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="13" xChannelSelector="R" yChannelSelector="G" result="rough"/>
      <feGaussianBlur in="rough" stdDeviation="1.2"/>
    </filter>
    <filter id="paperShadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="22" stdDeviation="22" flood-color="#715b58" flood-opacity=".18"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".7" numOctaves="2" seed="9" result="grain"/>
      <feColorMatrix in="grain" type="saturate" values="0" result="mono"/>
      <feComponentTransfer in="mono"><feFuncA type="table" tableValues="0 .08"/></feComponentTransfer>
    </filter>
    <clipPath id="frame"><rect x="905" y="126" width="510" height="590" rx="48"/></clipPath>
  </defs>
  <rect width="1600" height="900" fill="url(#paper)"/>
  <g filter="url(#watercolor)" opacity=".94">
    <path d="M-70 620C160 380 335 512 515 410c190-107 262-339 508-275 173 45 235 213 408 185 83-13 149-62 239-32v612H-70z" fill="url(#sky)"/>
    <ellipse cx="236" cy="150" rx="230" ry="145" fill="#f4cfd1" opacity=".58"/>
    <ellipse cx="1330" cy="720" rx="300" ry="215" fill="#b9c9be" opacity=".54"/>
    <path d="M0 757c256-126 402-55 588-105 173-47 296-176 495-132 173 39 298 164 517 100v280H0z" fill="#c89e98" opacity=".62"/>
    <path d="M0 807c310-98 527 33 790-39 258-71 395-177 810-31v163H0z" fill="#8fa594" opacity=".54"/>
  </g>
  <g filter="url(#paperShadow)">
    <path d="M132 105l568-45 56 622-568 50z" fill="#fffaf5" opacity=".93" transform="rotate(-4 444 396)"/>
    <path d="M214 169h367v22H214z" fill="#d8aaa9" opacity=".72" transform="rotate(-4 397 180)"/>
    <path d="M205 245h414v12H205zm8 72h354v12H213zm7 72h398v12H220zm7 72h326v12H227zm7 72h372v12H234z" fill="#c8c1bc" opacity=".58" transform="rotate(-4 410 391)"/>
    <circle cx="618" cy="588" r="54" fill="#e6c0b5" opacity=".8"/>
  </g>
  <g clip-path="url(#frame)" filter="url(#paperShadow)">
    <rect x="905" y="126" width="510" height="590" rx="48" fill="#f8efe9" opacity=".85"/>
    <circle cx="1270" cy="258" r="108" fill="#edc2b9" opacity=".7"/>
    <path d="M855 645c145-143 259-172 403-83 92 57 163 89 247 63v160H855z" fill="#aebfaf" opacity=".82"/>
    <path d="M855 700c188-90 333-56 650 17v94H855z" fill="#d2a49b" opacity=".78"/>
    <g transform="translate(1132 302)">
      <ellipse cx="84" cy="69" rx="67" ry="71" fill="url(#child)"/>
      <path d="M25 65c8-55 102-87 132-19 8 18 8 34 5 50-28-29-92-37-137-31z" fill="#6e5550" opacity=".86"/>
      <path d="M0 204c8-82 48-126 88-126s85 47 93 126l10 150H-12z" fill="#e7bdb5"/>
      <path d="M19 153c-29 43-42 106-37 165" fill="none" stroke="#bd8877" stroke-width="25" stroke-linecap="round"/>
      <path d="M158 153c29 43 42 106 37 165" fill="none" stroke="#bd8877" stroke-width="25" stroke-linecap="round"/>
      <path d="M46 67c17 14 54 15 76 0" fill="none" stroke="#f0d1c4" stroke-width="7" stroke-linecap="round" opacity=".58"/>
    </g>
  </g>
  <g opacity=".84" filter="url(#watercolor)">
    <path d="M804 56c-10 85 73 111 142 91-53 55-147 60-207 5 23-45 34-72 65-96z" fill="#c6a6b4"/>
    <path d="M758 727c27-97 92-111 160-67-31 9-51 34-63 81-32-18-61-21-97-14z" fill="#7f9b86"/>
    <path d="M1435 82c-77 63-34 131 30 150-75 10-139-45-143-121 45-18 75-31 113-29z" fill="#d8b2a6"/>
  </g>
  <rect width="1600" height="900" filter="url(#grain)" opacity=".65"/>
  <rect x="24" y="24" width="1552" height="852" rx="46" fill="none" stroke="#fff" stroke-opacity=".48" stroke-width="3"/>
</svg>
