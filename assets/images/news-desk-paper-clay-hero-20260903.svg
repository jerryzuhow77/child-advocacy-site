<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">紙雕與陶土藝術的兒少新聞主視覺</title>
<desc id="desc">莫蘭迪粉嫩色紙雕層景、訪視紀錄紙張與象徵剴剴的陶土孩童形象，為藝術意象，非事件現場重現。</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7e8e2"/><stop offset=".52" stop-color="#eadadd"/><stop offset="1" stop-color="#dbe4dc"/></linearGradient>
  <linearGradient id="clay" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d5a089"/><stop offset="1" stop-color="#a97361"/></linearGradient>
  <filter id="shadow" x="-30%" y="-30%" width="170%" height="180%"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#6d554d" flood-opacity=".18"/></filter>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation=".35"/></filter>
  <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" seed="14"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="table" tableValues="0 .045"/></feComponentTransfer></filter>
</defs>
<rect width="1600" height="900" fill="url(#bg)"/>
<!-- layered paper-cut landscape -->
<g filter="url(#shadow)">
  <path d="M0 570C205 445 347 486 510 402c181-93 295-221 485-169 157 43 245 143 376 113 87-20 157-82 229-50v604H0z" fill="#c7d2c5"/>
  <path d="M0 650c201-99 386-84 577-17 163 57 312 58 470-19 198-96 344-44 553 45v241H0z" fill="#d9b3b1"/>
  <path d="M0 747c288-93 480 47 742-10 266-58 448-144 858-36v199H0z" fill="#9eaf9f"/>
</g>
<!-- paper flowers -->
<g opacity=".96" filter="url(#shadow)">
  <g transform="translate(110 105)"><circle cx="0" cy="0" r="32" fill="#f6ede7"/><path d="M0-91 22-30 88-45 39 2 87 47 20 33 0 96-19 34-88 47-39 2-88-45-22-30z" fill="#d8b7c2"/><circle r="23" fill="#c88f82"/></g>
  <g transform="translate(1440 150) scale(.78)"><path d="M0-91 22-30 88-45 39 2 87 47 20 33 0 96-19 34-88 47-39 2-88-45-22-30z" fill="#bbc9bb"/><circle r="24" fill="#e4b0a6"/></g>
</g>
<!-- stacked visit records -->
<g transform="translate(180 165) rotate(-5 300 280)" filter="url(#shadow)">
  <rect x="44" y="44" width="480" height="525" rx="24" fill="#dfc7c3" opacity=".65"/>
  <rect x="22" y="20" width="480" height="525" rx="24" fill="#eee0d7"/>
  <rect width="480" height="525" rx="24" fill="#fffaf5"/>
  <rect x="52" y="55" width="175" height="18" rx="9" fill="#c89492"/>
  <rect x="52" y="104" width="343" height="10" rx="5" fill="#d6d0c8"/>
  <rect x="52" y="143" width="298" height="10" rx="5" fill="#d6d0c8"/>
  <rect x="52" y="182" width="360" height="10" rx="5" fill="#d6d0c8"/>
  <rect x="52" y="244" width="130" height="96" rx="13" fill="#e6d4d2"/>
  <rect x="204" y="244" width="208" height="15" rx="7" fill="#bdc9c0"/>
  <rect x="204" y="282" width="176" height="10" rx="5" fill="#d6d0c8"/>
  <rect x="204" y="317" width="198" height="10" rx="5" fill="#d6d0c8"/>
  <circle cx="406" cy="427" r="54" fill="none" stroke="#c47f78" stroke-width="11" opacity=".8"/>
  <path d="M376 430l22 23 44-55" fill="none" stroke="#c47f78" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
</g>
<!-- clay child sculpture -->
<g transform="translate(1035 210)" filter="url(#shadow)">
  <ellipse cx="210" cy="540" rx="168" ry="42" fill="#7d6257" opacity=".14"/>
  <path d="M93 382c18-114 67-179 124-179 62 0 114 71 128 183l19 161H70z" fill="#e7beb6"/>
  <path d="M82 342c-46 76-57 144-51 207" fill="none" stroke="#c88e78" stroke-width="38" stroke-linecap="round"/>
  <path d="M349 342c46 76 57 144 51 207" fill="none" stroke="#c88e78" stroke-width="38" stroke-linecap="round"/>
  <ellipse cx="215" cy="166" rx="106" ry="114" fill="url(#clay)"/>
  <path d="M113 164c9-94 174-141 207-24 7 26 3 47-2 67-43-47-133-63-205-43z" fill="#6d524a"/>
  <ellipse cx="178" cy="181" rx="8" ry="10" fill="#5c4944"/><ellipse cx="255" cy="181" rx="8" ry="10" fill="#5c4944"/>
  <path d="M181 225c18 16 49 16 68 0" fill="none" stroke="#8f5f55" stroke-width="7" stroke-linecap="round"/>
  <path d="M138 83c34-30 94-45 140-17" fill="none" stroke="#f2c9b7" stroke-width="9" stroke-linecap="round" opacity=".35"/>
  <circle cx="173" cy="145" r="7" fill="#f4caba" opacity=".42"/>
</g>
<!-- paper leaves foreground -->
<g filter="url(#shadow)">
  <path d="M920 733c-12-91 33-142 104-157-6 77-42 124-104 157z" fill="#859d89"/>
  <path d="M905 753c-68-63-71-130-29-190 40 66 44 124 29 190z" fill="#b7c5b7"/>
  <path d="M1450 706c-6-79 34-120 94-132-8 65-40 106-94 132z" fill="#d5a8b0"/>
</g>
<rect x="25" y="25" width="1550" height="850" rx="46" fill="none" stroke="#fff" stroke-opacity=".6" stroke-width="4"/>
<rect width="1600" height="900" filter="url(#grain)"/>
</svg>