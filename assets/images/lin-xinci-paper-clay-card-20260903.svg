<title id="title">林心慈新聞卡紙雕與陶土藝術</title>
<desc id="desc">以莫蘭迪粉、鼠尾草綠、象牙白紙雕層景，搭配中央陶土孩童、訪視紀錄紙張與守護雙手的藝術意象。</desc>
