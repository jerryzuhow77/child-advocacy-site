+<svg xmlns="http://www.w3.org/2000/svg" width="1122" height="1402" viewBox="0 0 1122 1402" role="img" aria-labelledby="title desc">
<title>剀剀案定讞後：閱覽评议單，能翻案吗？</title><desc>莫兰迪色调纸雕陶土艺术，深靛蓝与蓝色上衣的非识别性儿童背持纸鹤，左侧为法律程序解说。</desc>
<image href="kaikai-legal-brief-poster-bg-20260918-v2.jpg" width="1122" height="1402"/>
<rect x="54" y="76" width="590" height="650" rx="28" fill="#f7f2e9" fill-opacity=".90"/>
<text x="94" y="154" fill="#6c4d46" font-family="Noto Serif TC, PingFang TC, serif" font-size="27" letter-spacing="3">每日护童快报　2026.09.18</text>
<text x="94" y="255" fill="#182a44" font-family="Noto Serif TC, PingFang TC, serif" font-weight="700" font-size="66">剀剀案定讞後</text>
<text x="94" y="344" fill="#182a44" font-family="Noto Serif TC, PingFang TC, serif" font-weight="700" font-size="61">閱覽评议單，</text>
<text x="94" y="428" fill="#182a44" font-family="Noto Serif TC, PingFang TC, serif" font-weight="700" font-size="61">能翻案吗？</text>
<path d="M94 477H574" stroke="#ad8071" stroke-width="4"/>
<text x="94" y="548" fill="#40556e" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="34" font-weight="700">阅览不是重审</text>
<text x="94" y="608" fill="#40556e" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="31">救济需要具体法定事由</text>
<text x="94" y="676" fill="#7b665e" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="23">辨识程序界线，持续守护儿童</text>
</svg>
