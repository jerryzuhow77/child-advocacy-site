<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Snow magnolia Ronghua branch</title>
  <desc id="desc">An original moon-white and pale-rouge velvet magnolia ornament with five blossoms, green leaves, pearls and a curved golden hairpin.</desc>
  <defs>
    <linearGradient id="petal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffdf5"/><stop offset=".46" stop-color="#f4eadf"/>
      <stop offset=".78" stop-color="#d9e4de"/><stop offset="1" stop-color="#b87883"/>
    </linearGradient>
    <linearGradient id="petalPink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8f2e5"/><stop offset=".55" stop-color="#e5bcc0"/><stop offset="1" stop-color="#8b4452"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c9d7c9"/><stop offset=".48" stop-color="#7c9185"/><stop offset="1" stop-color="#315e58"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f1d17d"/><stop offset=".48" stop-color="#d0a24d"/><stop offset="1" stop-color="#8b5b22"/>
    </linearGradient>
    <radialGradient id="pearl" cx="30%" cy="26%" r="72%">
      <stop offset="0" stop-color="#fff"/><stop offset=".52" stop-color="#f7f0df"/><stop offset="1" stop-color="#8e8980"/>
    </radialGradient>
    <filter id="velvet" x="-12%" y="-12%" width="124%" height="124%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency=".025 .52" numOctaves="2" seed="51" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.1" xChannelSelector="R" yChannelSelector="B"/>
    </filter>
    <path id="petalShape" d="M0 6C-53-31-72-117-17-176C42-129 55-45 0 6Z"/>
    <path id="leafShape" d="M0 0C34-58 112-66 164-13C119 38 47 45 0 0Z"/>
    <g id="bloom" filter="url(#velvet)">
      <g fill="url(#petal)" stroke="#fffaf0" stroke-width="4">
        <use href="#petalShape" transform="rotate(-72)"/><use href="#petalShape" transform="rotate(-36)"/>
        <use href="#petalShape"/><use href="#petalShape" transform="rotate(36)"/><use href="#petalShape" transform="rotate(72)"/>
      </g>
      <g fill="url(#petalPink)" opacity=".9" transform="scale(.58) translate(0 10)">
        <use href="#petalShape" transform="rotate(-48)"/><use href="#petalShape"/><use href="#petalShape" transform="rotate(48)"/>
      </g>
      <g fill="none" stroke="#b8832c" stroke-width="4" stroke-linecap="round">
        <path d="M0 0L-43-42M0 0L-20-57M0 0L4-63M0 0L29-54M0 0L49-35"/>
      </g>
      <g fill="#d7a84c" stroke="#8a5a1e" stroke-width="2">
        <circle cx="-43" cy="-42" r="7"/><circle cx="-20" cy="-57" r="7"/><circle cx="4" cy="-63" r="7"/>
        <circle cx="29" cy="-54" r="7"/><circle cx="49" cy="-35" r="7"/>
      </g>
      <circle r="20" fill="url(#pearl)" stroke="#d0a24d" stroke-width="4"/>
    </g>
  </defs>

  <path d="M88 606C310 546 469 409 624 278C745 176 908 109 1118 126" fill="none" stroke="#513128" stroke-width="34" opacity=".2"/>
  <path d="M88 592C310 532 469 395 624 264C745 162 908 95 1118 112" fill="none" stroke="url(#gold)" stroke-width="18" stroke-linecap="round"/>
  <path d="M112 584C329 517 486 382 634 255C758 149 914 91 1087 108" fill="none" stroke="#fff1bd" stroke-width="3" opacity=".72"/>

  <g fill="url(#leaf)" stroke="#49685f" stroke-width="4" filter="url(#velvet)">
    <use href="#leafShape" transform="translate(274 532) rotate(207) scale(.9)"/>
    <use href="#leafShape" transform="translate(444 420) rotate(224) scale(.78)"/>
    <use href="#leafShape" transform="translate(661 250) rotate(29) scale(.74)"/>
    <use href="#leafShape" transform="translate(820 162) rotate(15) scale(.7)"/>
    <use href="#leafShape" transform="translate(982 108) rotate(205) scale(.62)"/>
  </g>
  <g fill="none" stroke="#e5ece2" stroke-width="3" opacity=".65">
    <path d="M274 532L174 471M444 420L357 341M661 250L752 196M820 162L919 129M982 108L905 60"/>
  </g>

  <g transform="translate(261 492) rotate(-11) scale(.78)"><use href="#bloom"/></g>
  <g transform="translate(493 352) rotate(7) scale(1.04)"><use href="#bloom"/></g>
  <g transform="translate(735 191) rotate(-9) scale(.76)"><use href="#bloom"/></g>
  <g transform="translate(947 105) rotate(12) scale(.6)"><use href="#bloom"/></g>
  <g transform="translate(1090 116) rotate(21) scale(.42)"><use href="#bloom"/></g>

  <g fill="url(#pearl)" stroke="#d0a24d" stroke-width="4">
    <circle cx="335" cy="649" r="18"/><circle cx="365" cy="696" r="14"/><circle cx="397" cy="730" r="10"/>
  </g>
  <path d="M276 550C298 605 325 637 335 649M335 649L365 696L397 730" fill="none" stroke="#c28b2d" stroke-width="5"/>
</svg>
