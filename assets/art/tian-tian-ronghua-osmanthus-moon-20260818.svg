<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Osmanthus moon Ronghua hairpin</title>
  <desc id="desc">An original crescent-shaped golden osmanthus velvet ornament with many small blossoms, jade leaves, a moon-white pearl and homeward tassels.</desc>
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6d884"/><stop offset=".45" stop-color="#d0a24d"/><stop offset="1" stop-color="#926126"/>
    </linearGradient>
    <linearGradient id="apricot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff0bc"/><stop offset=".48" stop-color="#dcb75f"/><stop offset="1" stop-color="#a16f47"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d4ddc7"/><stop offset=".5" stop-color="#7c9185"/><stop offset="1" stop-color="#365d52"/>
    </linearGradient>
    <radialGradient id="moon" cx="33%" cy="29%" r="72%">
      <stop offset="0" stop-color="#fff"/><stop offset=".46" stop-color="#f8f2e5"/><stop offset=".78" stop-color="#d9e4de"/><stop offset="1" stop-color="#87999a"/>
    </radialGradient>
    <filter id="velvet" x="-15%" y="-15%" width="130%" height="130%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency=".04 .64" numOctaves="2" seed="84" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.8" xChannelSelector="R" yChannelSelector="B"/>
    </filter>
    <path id="petal" d="M0 4C-22-14-25-51 0-73C25-51 22-14 0 4Z"/>
    <path id="leafShape" d="M0 0C28-43 84-48 119-8C83 29 34 31 0 0Z"/>
    <g id="flower" filter="url(#velvet)">
      <g fill="url(#apricot)" stroke="#f9e5a5" stroke-width="2">
        <use href="#petal"/><use href="#petal" transform="rotate(90)"/><use href="#petal" transform="rotate(180)"/><use href="#petal" transform="rotate(270)"/>
      </g>
      <circle r="11" fill="#f4d06c" stroke="#9a6822" stroke-width="2"/>
    </g>
  </defs>

  <path d="M800 67C433 100 179 376 288 652C118 466 201 157 477 53C591 10 711 16 800 67Z" fill="url(#gold)" opacity=".26"/>
  <path d="M784 88C462 124 239 372 326 607C184 438 264 191 496 99C592 61 695 56 784 88Z" fill="none" stroke="url(#gold)" stroke-width="23" stroke-linecap="round"/>
  <path d="M771 97C477 140 284 362 346 574" fill="none" stroke="#fff0b4" stroke-width="4" opacity=".65"/>

  <g fill="url(#leaf)" stroke="#46675d" stroke-width="3" filter="url(#velvet)">
    <use href="#leafShape" transform="translate(430 168) rotate(199) scale(.72)"/><use href="#leafShape" transform="translate(342 269) rotate(215) scale(.67)"/>
    <use href="#leafShape" transform="translate(311 403) rotate(226) scale(.62)"/><use href="#leafShape" transform="translate(342 527) rotate(146) scale(.58)"/>
    <use href="#leafShape" transform="translate(548 112) rotate(28) scale(.66)"/><use href="#leafShape" transform="translate(674 92) rotate(20) scale(.59)"/>
  </g>

  <g>
    <use href="#flower" transform="translate(473 143) scale(1.1)"/><use href="#flower" transform="translate(414 198) scale(.86)"/>
    <use href="#flower" transform="translate(358 257) scale(1.04)"/><use href="#flower" transform="translate(321 332) scale(.8)"/>
    <use href="#flower" transform="translate(306 414) scale(1.12)"/><use href="#flower" transform="translate(326 498) scale(.9)"/>
    <use href="#flower" transform="translate(374 565) scale(1.06)"/><use href="#flower" transform="translate(445 618) scale(.76)"/>
    <use href="#flower" transform="translate(563 108) scale(.82)"/><use href="#flower" transform="translate(648 88) scale(.7)"/>
    <use href="#flower" transform="translate(724 91) scale(.58)"/>
  </g>

  <circle cx="745" cy="354" r="179" fill="url(#moon)" stroke="#d0a24d" stroke-width="9" opacity=".95"/>
  <circle cx="701" cy="310" r="54" fill="#fff" opacity=".22"/>
  <path d="M877 479C964 532 1037 604 1085 698" fill="none" stroke="url(#gold)" stroke-width="12" stroke-linecap="round"/>
  <path d="M839 500C907 564 951 632 978 714" fill="none" stroke="url(#gold)" stroke-width="8"/>
  <g fill="url(#apricot)" stroke="#f4da92" stroke-width="3" filter="url(#velvet)">
    <path d="M1054 653C1018 689 1024 735 1062 754C1098 728 1096 687 1068 657Z"/>
    <path d="M954 675C922 707 929 744 963 758C994 735 991 701 968 679Z"/>
  </g>
  <circle cx="1060" cy="650" r="14" fill="url(#moon)" stroke="#d0a24d" stroke-width="4"/>
  <circle cx="961" cy="673" r="12" fill="url(#moon)" stroke="#d0a24d" stroke-width="4"/>
</svg>
