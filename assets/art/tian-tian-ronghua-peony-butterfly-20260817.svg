<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Rouge peony and butterfly Ronghua ornament</title>
  <desc id="desc">An original rouge and rattan-gold velvet peony ornament with a small stone-green butterfly, leaves, pearls and curling gold wire.</desc>
  <defs>
    <linearGradient id="rouge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff0e6"/>
      <stop offset=".34" stop-color="#e8a2a0"/>
      <stop offset=".7" stop-color="#b95a62"/>
      <stop offset="1" stop-color="#7c3442"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5d88a"/>
      <stop offset=".5" stop-color="#d0a24d"/>
      <stop offset="1" stop-color="#9c641f"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d2ddd1"/>
      <stop offset=".5" stop-color="#7c9185"/>
      <stop offset="1" stop-color="#315e58"/>
    </linearGradient>
    <radialGradient id="pearl" cx="31%" cy="27%" r="72%">
      <stop offset="0" stop-color="#fff"/>
      <stop offset=".48" stop-color="#f4ecdd"/>
      <stop offset=".82" stop-color="#c9bbaa"/>
      <stop offset="1" stop-color="#796e66"/>
    </radialGradient>
    <filter id="velvet" x="-8%" y="-8%" width="116%" height="116%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency=".045 .58" numOctaves="2" seed="51" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.9" xChannelSelector="R" yChannelSelector="B"/>
    </filter>
    <path id="petal" d="M0 3C-42-23-52-90 0-132C52-90 42-23 0 3Z"/>
    <path id="leaf" d="M0 0C31-54 98-56 139-8C95 32 37 34 0 0Z"/>
    <g id="peony" filter="url(#velvet)">
      <g fill="url(#rouge)" stroke="#f8d8cd" stroke-width="3">
        <use href="#petal" transform="rotate(0) scale(1.05)"/><use href="#petal" transform="rotate(45) scale(1.05)"/>
        <use href="#petal" transform="rotate(90) scale(1.05)"/><use href="#petal" transform="rotate(135) scale(1.05)"/>
        <use href="#petal" transform="rotate(180) scale(1.05)"/><use href="#petal" transform="rotate(225) scale(1.05)"/>
        <use href="#petal" transform="rotate(270) scale(1.05)"/><use href="#petal" transform="rotate(315) scale(1.05)"/>
      </g>
      <g fill="#f1c6b7" stroke="#fff0e4" stroke-width="2" transform="scale(.7) rotate(22.5)">
        <use href="#petal" transform="rotate(0)"/><use href="#petal" transform="rotate(60)"/>
        <use href="#petal" transform="rotate(120)"/><use href="#petal" transform="rotate(180)"/>
        <use href="#petal" transform="rotate(240)"/><use href="#petal" transform="rotate(300)"/>
      </g>
      <g fill="url(#gold)" transform="scale(.4) rotate(10)">
        <use href="#petal" transform="rotate(0)"/><use href="#petal" transform="rotate(72)"/>
        <use href="#petal" transform="rotate(144)"/><use href="#petal" transform="rotate(216)"/>
        <use href="#petal" transform="rotate(288)"/>
      </g>
      <circle r="24" fill="url(#pearl)" stroke="#d0a24d" stroke-width="4"/>
      <g fill="#d0a24d" stroke="#8f5e1d" stroke-width="2">
        <circle cx="0" cy="-48" r="7"/><circle cx="34" cy="-34" r="7"/><circle cx="48" cy="0" r="7"/>
        <circle cx="34" cy="34" r="7"/><circle cx="0" cy="48" r="7"/><circle cx="-34" cy="34" r="7"/>
        <circle cx="-48" cy="0" r="7"/><circle cx="-34" cy="-34" r="7"/>
      </g>
    </g>
  </defs>

  <g fill="none" stroke-linecap="round">
    <path d="M93 533C338 455 610 461 1033 579" stroke="#43241d" stroke-width="34" opacity=".23"/>
    <path d="M93 522C338 444 610 450 1033 568" stroke="url(#gold)" stroke-width="18"/>
    <path d="M129 512C371 456 619 462 994 561" stroke="#ffe29a" stroke-width="3" opacity=".7"/>
    <path d="M254 457C177 339 192 241 284 191" stroke="#b77a29" stroke-width="8"/>
    <path d="M863 475C944 377 949 291 891 226" stroke="#b77a29" stroke-width="8"/>
  </g>

  <g fill="url(#green)" stroke="#45685f" stroke-width="4" filter="url(#velvet)">
    <use href="#leaf" transform="translate(336 476) rotate(205) scale(.82)"/>
    <use href="#leaf" transform="translate(443 452) rotate(232) scale(.9)"/>
    <use href="#leaf" transform="translate(727 456) rotate(22) scale(.86)"/>
    <use href="#leaf" transform="translate(829 485) rotate(3) scale(.78)"/>
    <use href="#leaf" transform="translate(631 544) rotate(97) scale(.62)"/>
  </g>
  <g transform="translate(600 403) scale(1.08)"><use href="#peony"/></g>
  <g transform="translate(335 305) rotate(-17) scale(.5)"><use href="#peony"/></g>
  <g transform="translate(845 332) rotate(13) scale(.46)"><use href="#peony"/></g>

  <g transform="translate(912 170)" filter="url(#velvet)">
    <path d="M-12 26C-104-26-142 36-84 96C-48 134-16 104 0 64Z" fill="url(#green)" stroke="#315e58" stroke-width="5"/>
    <path d="M12 26C104-26 142 36 84 96C48 134 16 104 0 64Z" fill="url(#rouge)" stroke="#8b4452" stroke-width="5"/>
    <path d="M-3 30C-53 17-72 54-43 83M3 30C53 17 72 54 43 83" fill="none" stroke="#f4d887" stroke-width="5"/>
    <ellipse cx="0" cy="67" rx="16" ry="50" fill="url(#gold)" stroke="#8f5e1d" stroke-width="4"/>
    <path d="M-6 24C-24-8-41-13-52-2M6 24C24-8 41-13 52-2" fill="none" stroke="#b77a29" stroke-width="5" stroke-linecap="round"/>
    <circle cx="-52" cy="-2" r="8" fill="url(#pearl)" stroke="#d0a24d" stroke-width="3"/>
    <circle cx="52" cy="-2" r="8" fill="url(#pearl)" stroke="#d0a24d" stroke-width="3"/>
  </g>

  <g fill="none" stroke="#c58d2d" stroke-width="6" stroke-linecap="round">
    <path d="M292 181C247 95 276 47 320 62"/>
    <path d="M874 226C845 127 881 83 925 107"/>
    <path d="M191 463C109 420 67 449 84 485C99 516 143 506 147 475C151 448 124 438 108 457"/>
  </g>
  <g fill="url(#pearl)" stroke="#d0a24d" stroke-width="4">
    <circle cx="320" cy="62" r="14"/><circle cx="925" cy="107" r="14"/>
  </g>
  <g fill="#8b4452" stroke="#6d2834" stroke-width="3">
    <circle cx="358" cy="226" r="13"/><circle cx="805" cy="255" r="13"/>
  </g>
  <path d="M610 553L610 722" fill="none" stroke="#b77a29" stroke-width="13"/>
  <path d="M610 566L610 710" fill="none" stroke="#f1c75c" stroke-width="4" stroke-dasharray="4 8"/>
  <circle cx="610" cy="579" r="15" fill="url(#pearl)" stroke="#d0a24d" stroke-width="4"/>
  <circle cx="610" cy="618" r="13" fill="#8b4452" stroke="#6d2834" stroke-width="3"/>
</svg>
