<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Frost chrysanthemum Ronghua comb</title>
  <desc id="desc">An original layered moon-white and stone-blue velvet chrysanthemum comb with long curling petals, frost pearls and a dark indigo frame.</desc>
  <defs>
    <linearGradient id="petal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset=".35" stop-color="#e8efeb"/><stop offset=".7" stop-color="#91aeb7"/><stop offset="1" stop-color="#315e6b"/>
    </linearGradient>
    <linearGradient id="petalDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d9e4de"/><stop offset=".52" stop-color="#557b88"/><stop offset="1" stop-color="#172d39"/>
    </linearGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8f4e9"/><stop offset=".46" stop-color="#b7c7c7"/><stop offset="1" stop-color="#657579"/>
    </linearGradient>
    <radialGradient id="pearl" cx="30%" cy="26%" r="74%">
      <stop offset="0" stop-color="#fff"/><stop offset=".5" stop-color="#e9f0ec"/><stop offset="1" stop-color="#71858a"/>
    </radialGradient>
    <filter id="velvet" x="-12%" y="-12%" width="124%" height="124%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency=".028 .68" numOctaves="2" seed="73" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2" xChannelSelector="R" yChannelSelector="B"/>
    </filter>
    <path id="longPetal" d="M0 9C-17-35-21-118 0-203C22-117 18-35 0 9Z"/>
    <path id="curlPetal" d="M0 5C-34-30-34-102 6-145C28-102 18-37 0 5Z"/>
    <g id="chrysanthemum" filter="url(#velvet)">
      <g fill="url(#petalDark)" stroke="#dce8e4" stroke-width="3">
        <use href="#longPetal" transform="rotate(0)"/><use href="#longPetal" transform="rotate(30)"/><use href="#longPetal" transform="rotate(60)"/>
        <use href="#longPetal" transform="rotate(90)"/><use href="#longPetal" transform="rotate(120)"/><use href="#longPetal" transform="rotate(150)"/>
        <use href="#longPetal" transform="rotate(180)"/><use href="#longPetal" transform="rotate(210)"/><use href="#longPetal" transform="rotate(240)"/>
        <use href="#longPetal" transform="rotate(270)"/><use href="#longPetal" transform="rotate(300)"/><use href="#longPetal" transform="rotate(330)"/>
      </g>
      <g fill="url(#petal)" stroke="#fffdf5" stroke-width="3" transform="scale(.72) rotate(15)">
        <use href="#curlPetal" transform="rotate(0)"/><use href="#curlPetal" transform="rotate(30)"/><use href="#curlPetal" transform="rotate(60)"/>
        <use href="#curlPetal" transform="rotate(90)"/><use href="#curlPetal" transform="rotate(120)"/><use href="#curlPetal" transform="rotate(150)"/>
        <use href="#curlPetal" transform="rotate(180)"/><use href="#curlPetal" transform="rotate(210)"/><use href="#curlPetal" transform="rotate(240)"/>
        <use href="#curlPetal" transform="rotate(270)"/><use href="#curlPetal" transform="rotate(300)"/><use href="#curlPetal" transform="rotate(330)"/>
      </g>
      <circle r="38" fill="url(#silver)" stroke="#f9efd6" stroke-width="5"/>
      <g fill="url(#pearl)"><circle cx="-18" cy="-12" r="9"/><circle cx="5" cy="-19" r="9"/><circle cx="21" cy="0" r="9"/><circle cx="6" cy="20" r="9"/><circle cx="-19" cy="12" r="9"/></g>
    </g>
  </defs>

  <path d="M108 552C316 626 884 626 1092 552L1040 643C832 698 368 698 160 643Z" fill="#101f25" opacity=".9" stroke="#315e6b" stroke-width="8"/>
  <path d="M169 603C368 650 832 650 1031 603" fill="none" stroke="url(#silver)" stroke-width="9"/>
  <g transform="translate(350 407) scale(.84)"><use href="#chrysanthemum"/></g>
  <g transform="translate(600 316) scale(1.18)"><use href="#chrysanthemum"/></g>
  <g transform="translate(850 407) scale(.84)"><use href="#chrysanthemum"/></g>
  <g transform="translate(185 475) rotate(-14) scale(.46)"><use href="#chrysanthemum"/></g>
  <g transform="translate(1015 475) rotate(14) scale(.46)"><use href="#chrysanthemum"/></g>

  <g fill="none" stroke="url(#silver)" stroke-width="5">
    <path d="M255 564C234 632 240 687 270 731M445 566C429 629 438 684 466 729M755 566C771 629 762 684 734 729M945 564C966 632 960 687 930 731"/>
  </g>
  <g fill="url(#pearl)" stroke="#d9e4de" stroke-width="3">
    <circle cx="270" cy="731" r="16"/><circle cx="466" cy="729" r="13"/><circle cx="734" cy="729" r="13"/><circle cx="930" cy="731" r="16"/>
    <circle cx="247" cy="638" r="8"/><circle cx="437" cy="637" r="8"/><circle cx="763" cy="637" r="8"/><circle cx="953" cy="638" r="8"/>
  </g>
  <g fill="#f8f2e5" opacity=".78">
    <circle cx="128" cy="180" r="9"/><circle cx="211" cy="98" r="6"/><circle cx="328" cy="152" r="8"/><circle cx="914" cy="132" r="7"/><circle cx="1046" cy="188" r="10"/>
  </g>
</svg>
