<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Ten-knot camellia Ronghua wreath</title>
  <desc id="desc">An original symmetrical velvet camellia ornament with layered cinnabar petals, ten golden knots, jade leaves and paired tassels.</desc>
  <defs>
    <radialGradient id="red" cx="42%" cy="34%" r="72%">
      <stop offset="0" stop-color="#e9a39b"/><stop offset=".42" stop-color="#b75959"/><stop offset=".78" stop-color="#8e3d31"/><stop offset="1" stop-color="#55272a"/>
    </radialGradient>
    <linearGradient id="rose" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5d3c9"/><stop offset=".5" stop-color="#c86b72"/><stop offset="1" stop-color="#7b3342"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#bdcbb8"/><stop offset=".5" stop-color="#6e8779"/><stop offset="1" stop-color="#2f564d"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4d47e"/><stop offset=".5" stop-color="#d0a24d"/><stop offset="1" stop-color="#88551a"/>
    </linearGradient>
    <filter id="velvet" x="-12%" y="-12%" width="124%" height="124%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency=".032 .62" numOctaves="2" seed="62" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2" xChannelSelector="R" yChannelSelector="B"/>
    </filter>
    <path id="petal" d="M0 8C-48-22-62-91-12-135C39-99 51-37 0 8Z"/>
    <path id="leafShape" d="M0 0C34-55 111-58 151-7C105 35 42 38 0 0Z"/>
    <g id="camellia" filter="url(#velvet)">
      <g fill="url(#red)" stroke="#efb1a6" stroke-width="3">
        <use href="#petal" transform="rotate(0)"/><use href="#petal" transform="rotate(45)"/>
        <use href="#petal" transform="rotate(90)"/><use href="#petal" transform="rotate(135)"/>
        <use href="#petal" transform="rotate(180)"/><use href="#petal" transform="rotate(225)"/>
        <use href="#petal" transform="rotate(270)"/><use href="#petal" transform="rotate(315)"/>
      </g>
      <g fill="url(#rose)" transform="scale(.62) rotate(22.5)">
        <use href="#petal" transform="rotate(0)"/><use href="#petal" transform="rotate(60)"/>
        <use href="#petal" transform="rotate(120)"/><use href="#petal" transform="rotate(180)"/>
        <use href="#petal" transform="rotate(240)"/><use href="#petal" transform="rotate(300)"/>
      </g>
      <circle r="29" fill="url(#gold)" stroke="#f0ce78" stroke-width="5"/>
      <g fill="#fae2a0"><circle cx="-19" cy="-8" r="5"/><circle cx="0" cy="-17" r="5"/><circle cx="19" cy="-8" r="5"/><circle cx="14" cy="13" r="5"/><circle cx="-14" cy="13" r="5"/></g>
    </g>
    <g id="knot" fill="none" stroke="url(#gold)" stroke-width="9" stroke-linecap="round">
      <path d="M-18 0C-38-22-17-45 0-27C17-45 38-22 18 0C38 22 17 45 0 27C-17 45-38 22-18 0Z"/>
      <circle r="7" fill="#b56935" stroke="#f0c965" stroke-width="3"/>
    </g>
  </defs>

  <path d="M126 412C284 171 916 171 1074 412C916 638 284 638 126 412Z" fill="none" stroke="#48251f" stroke-width="35" opacity=".18"/>
  <path d="M126 398C284 157 916 157 1074 398C916 624 284 624 126 398Z" fill="none" stroke="url(#gold)" stroke-width="18"/>

  <g fill="url(#leaf)" stroke="#42665a" stroke-width="4" filter="url(#velvet)">
    <use href="#leafShape" transform="translate(245 273) rotate(200) scale(.78)"/><use href="#leafShape" transform="translate(356 205) rotate(222) scale(.72)"/>
    <use href="#leafShape" transform="translate(844 207) rotate(39) scale(.72)"/><use href="#leafShape" transform="translate(956 273) rotate(18) scale(.78)"/>
    <use href="#leafShape" transform="translate(300 545) rotate(151) scale(.66)"/><use href="#leafShape" transform="translate(901 545) rotate(69) scale(.66)"/>
  </g>

  <g transform="translate(352 373) scale(1.02)"><use href="#camellia"/></g>
  <g transform="translate(600 292) scale(1.24)"><use href="#camellia"/></g>
  <g transform="translate(848 373) scale(1.02)"><use href="#camellia"/></g>
  <g transform="translate(496 514) scale(.72)"><use href="#camellia"/></g>
  <g transform="translate(704 514) scale(.72)"><use href="#camellia"/></g>

  <g>
    <use href="#knot" transform="translate(214 413) scale(.72)"/><use href="#knot" transform="translate(287 536) scale(.66)"/>
    <use href="#knot" transform="translate(414 614) scale(.61)"/><use href="#knot" transform="translate(536 646) scale(.57)"/>
    <use href="#knot" transform="translate(600 660) scale(.54)"/><use href="#knot" transform="translate(664 646) scale(.57)"/>
    <use href="#knot" transform="translate(786 614) scale(.61)"/><use href="#knot" transform="translate(913 536) scale(.66)"/>
    <use href="#knot" transform="translate(986 413) scale(.72)"/><use href="#knot" transform="translate(600 92) scale(.72)"/>
  </g>

  <g fill="url(#rose)" stroke="#f1b9ac" stroke-width="3" filter="url(#velvet)">
    <path d="M214 460C174 518 182 600 229 638C276 597 278 522 236 463Z"/>
    <path d="M964 463C922 522 924 597 971 638C1018 600 1026 518 986 460Z"/>
  </g>
  <path d="M224 477V621M976 477V621" stroke="#f9d9cc" stroke-width="4" opacity=".66"/>
</svg>
