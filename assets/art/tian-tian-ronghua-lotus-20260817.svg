<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Moon-white Ronghua lotus hairpin</title>
  <desc id="desc">An original moon-white and stone-blue velvet lotus ornament with jade leaves, gold wire, pearls and a short tassel.</desc>
  <defs>
    <linearGradient id="lotus" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#315e6b"/>
      <stop offset=".18" stop-color="#8eabb2"/>
      <stop offset=".43" stop-color="#f8f2e5"/>
      <stop offset=".78" stop-color="#e7eee8"/>
      <stop offset="1" stop-color="#6e8779"/>
    </linearGradient>
    <linearGradient id="lotusInner" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffdf4"/>
      <stop offset=".62" stop-color="#d9e4de"/>
      <stop offset="1" stop-color="#7b9bab"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#cfd9c8"/>
      <stop offset=".48" stop-color="#7c9185"/>
      <stop offset="1" stop-color="#315a53"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3d27b"/>
      <stop offset=".48" stop-color="#d0a24d"/>
      <stop offset="1" stop-color="#8f5e1d"/>
    </linearGradient>
    <radialGradient id="pearl" cx="32%" cy="26%" r="72%">
      <stop offset="0" stop-color="#fff"/>
      <stop offset=".48" stop-color="#f4eddf"/>
      <stop offset=".8" stop-color="#c8c2b8"/>
      <stop offset="1" stop-color="#78736d"/>
    </radialGradient>
    <filter id="velvet" x="-8%" y="-8%" width="116%" height="116%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency=".04 .6" numOctaves="2" seed="37" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.8" xChannelSelector="R" yChannelSelector="B"/>
    </filter>
    <path id="petal" d="M0 5C-47-35-50-121 0-173C50-121 47-35 0 5Z"/>
    <path id="leafShape" d="M0 0C38-64 117-67 164-10C113 39 44 41 0 0Z"/>
    <g id="bloom" filter="url(#velvet)">
      <g fill="url(#lotus)" stroke="#f8f2e5" stroke-width="4">
        <use href="#petal" transform="rotate(-78) scale(.9 1)"/>
        <use href="#petal" transform="rotate(-52) scale(.96 1.04)"/>
        <use href="#petal" transform="rotate(-27) scale(.98 1.08)"/>
        <use href="#petal" transform="rotate(0) scale(1 1.12)"/>
        <use href="#petal" transform="rotate(27) scale(.98 1.08)"/>
        <use href="#petal" transform="rotate(52) scale(.96 1.04)"/>
        <use href="#petal" transform="rotate(78) scale(.9 1)"/>
      </g>
      <g fill="url(#lotusInner)" stroke="#fffaf0" stroke-width="3" transform="scale(.67) translate(0 13)">
        <use href="#petal" transform="rotate(-52)"/><use href="#petal" transform="rotate(-26)"/>
        <use href="#petal"/><use href="#petal" transform="rotate(26)"/><use href="#petal" transform="rotate(52)"/>
      </g>
      <g fill="#d0a24d" stroke="#8f5e1d" stroke-width="2">
        <circle cx="-50" cy="-34" r="8"/><circle cx="-31" cy="-51" r="8"/>
        <circle cx="-10" cy="-59" r="8"/><circle cx="12" cy="-58" r="8"/>
        <circle cx="34" cy="-48" r="8"/><circle cx="52" cy="-30" r="8"/>
      </g>
      <g fill="none" stroke="#b98528" stroke-width="4" stroke-linecap="round">
        <path d="M0 0L-50-34M0 0L-31-51M0 0L-10-59M0 0L12-58M0 0L34-48M0 0L52-30"/>
      </g>
      <circle r="24" fill="url(#pearl)" stroke="#d0a24d" stroke-width="4"/>
    </g>
  </defs>

  <g fill="none" stroke-linecap="round">
    <path d="M155 510C365 397 742 396 1060 533" stroke="#543122" stroke-width="31" opacity=".22"/>
    <path d="M155 498C365 385 742 384 1060 521" stroke="url(#gold)" stroke-width="17"/>
    <path d="M180 489C385 400 735 404 1027 514" stroke="#fff0b3" stroke-width="3" opacity=".72"/>
    <path d="M353 422C315 297 337 200 425 135" stroke="#c38b2c" stroke-width="9"/>
    <path d="M832 438C875 309 861 211 797 145" stroke="#c38b2c" stroke-width="9"/>
  </g>

  <g fill="url(#leaf)" stroke="#45685f" stroke-width="4" filter="url(#velvet)">
    <use href="#leafShape" transform="translate(360 459) rotate(205) scale(.9)"/>
    <use href="#leafShape" transform="translate(470 421) rotate(231) scale(.82)"/>
    <use href="#leafShape" transform="translate(730 425) rotate(23) scale(.86)"/>
    <use href="#leafShape" transform="translate(842 464) rotate(1) scale(.8)"/>
  </g>
  <g fill="none" stroke="#dce8de" stroke-width="3" opacity=".68">
    <path d="M360 459L253 397M470 421L382 337M730 425L824 362M842 464L952 414"/>
  </g>

  <g transform="translate(600 385) scale(1.1)"><use href="#bloom"/></g>
  <g transform="translate(419 203) rotate(-17) scale(.43)"><use href="#bloom"/></g>
  <g transform="translate(802 211) rotate(18) scale(.4)"><use href="#bloom"/></g>

  <g fill="none" stroke="#c58d2d" stroke-width="6" stroke-linecap="round">
    <path d="M466 157C419 73 446 27 489 43"/>
    <path d="M736 160C781 75 754 30 713 45"/>
  </g>
  <g fill="url(#pearl)" stroke="#d0a24d" stroke-width="4">
    <circle cx="489" cy="43" r="15"/><circle cx="713" cy="45" r="15"/>
  </g>
  <g fill="#315e6b" stroke="#d9e4de" stroke-width="3" filter="url(#velvet)">
    <path d="M474 563C432 612 439 682 486 714C533 681 538 615 495 566Z"/>
    <path d="M699 566C658 614 665 681 710 711C754 679 759 617 719 569Z"/>
  </g>
  <path d="M486 580V694M710 583V692" stroke="#f8f2e5" stroke-width="4" opacity=".7"/>
  <circle cx="486" cy="568" r="16" fill="url(#pearl)" stroke="#d0a24d" stroke-width="4"/>
  <circle cx="710" cy="571" r="16" fill="url(#pearl)" stroke="#d0a24d" stroke-width="4"/>
</svg>
