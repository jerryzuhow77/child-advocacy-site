<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title>Abstract modern ink-and-paper artwork for trauma-informed justice</title>
<desc>Warm handmade paper layers, a deep-teal protective arch, mist-teal paths and fine gold lines. No people, text or real location.</desc>
