<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Blue and moon-white Ronghua branch</title>
  <desc id="desc">An original decorative velvet-flower branch with three blossoms, two hanging buds, leaves, pearls and gold stamens.</desc>
  <defs>
    <linearGradient id="petal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#173e78"/>
      <stop offset=".18" stop-color="#6e92b4"/>
      <stop offset=".43" stop-color="#f7faf5"/>
      <stop offset=".78" stop-color="#dbe7e5"/>
      <stop offset="1" stop-color="#4f77a3"/>
    </linearGradient>
    <linearGradient id="petalInner" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#315e8f"/>
      <stop offset=".38" stop-color="#fffef7"/>
      <stop offset=".76" stop-color="#eaf0eb"/>
      <stop offset="1" stop-color="#5e80a4"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dce4cf"/>
      <stop offset=".48" stop-color="#8fa18c"/>
      <stop offset="1" stop-color="#385a56"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b07a53"/>
      <stop offset=".38" stop-color="#6d3c2c"/>
      <stop offset="1" stop-color="#321a18"/>
    </linearGradient>
    <radialGradient id="pearl" cx="34%" cy="28%" r="72%">
      <stop offset="0" stop-color="#fff"/>
      <stop offset=".45" stop-color="#f6f0df"/>
      <stop offset=".78" stop-color="#c9c3b7"/>
      <stop offset="1" stop-color="#807c75"/>
    </radialGradient>
    <filter id="velvet" x="-8%" y="-8%" width="116%" height="116%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency=".035 .58" numOctaves="2" seed="17" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.7" xChannelSelector="R" yChannelSelector="B"/>
    </filter>
    <path id="petalShape" d="M0 4C-43-29-50-105 0-146C50-105 43-29 0 4Z"/>
    <g id="stamens" fill="none" stroke="#c78b26" stroke-width="4" stroke-linecap="round">
      <path d="M0 0L-58-45M0 0L-37-64M0 0L-12-71M0 0L14-72M0 0L40-62M0 0L60-42M0 0L66-14"/>
      <g fill="#e0aa3f" stroke="#9b6515" stroke-width="2">
        <circle cx="-58" cy="-45" r="7"/><circle cx="-37" cy="-64" r="7"/>
        <circle cx="-12" cy="-71" r="7"/><circle cx="14" cy="-72" r="7"/>
        <circle cx="40" cy="-62" r="7"/><circle cx="60" cy="-42" r="7"/>
        <circle cx="66" cy="-14" r="7"/>
      </g>
      <circle cx="0" cy="0" r="19" fill="url(#pearl)" stroke="#d0a24d" stroke-width="3"/>
    </g>
    <g id="flower" filter="url(#velvet)">
      <g fill="url(#petal)" stroke="#ecf0e8" stroke-width="3">
        <use href="#petalShape" transform="rotate(0)"/><use href="#petalShape" transform="rotate(45)"/>
        <use href="#petalShape" transform="rotate(90)"/><use href="#petalShape" transform="rotate(135)"/>
        <use href="#petalShape" transform="rotate(180)"/><use href="#petalShape" transform="rotate(225)"/>
        <use href="#petalShape" transform="rotate(270)"/><use href="#petalShape" transform="rotate(315)"/>
      </g>
      <g fill="url(#petalInner)" opacity=".94" transform="scale(.62) rotate(22.5)">
        <use href="#petalShape" transform="rotate(0)"/><use href="#petalShape" transform="rotate(60)"/>
        <use href="#petalShape" transform="rotate(120)"/><use href="#petalShape" transform="rotate(180)"/>
        <use href="#petalShape" transform="rotate(240)"/><use href="#petalShape" transform="rotate(300)"/>
      </g>
      <g opacity=".28" fill="none" stroke="#fff" stroke-width="2">
        <path d="M0-10L0-128M9-7L46-111M-9-7L-45-111"/>
      </g>
      <use href="#stamens" transform="scale(.72)"/>
    </g>
    <path id="leafShape" d="M0 0C27-47 87-52 126-10C85 26 34 30 0 0Z"/>
  </defs>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M58 438C264 348 500 367 710 481C860 563 1010 604 1142 626" stroke="#2c1715" stroke-width="34" opacity=".26"/>
    <path d="M58 427C264 337 500 356 710 470C860 552 1010 593 1142 615" stroke="url(#wood)" stroke-width="27"/>
    <path d="M83 417C284 350 480 368 690 473" stroke="#d39a69" stroke-width="4" opacity=".55"/>
    <path d="M324 362C457 261 602 249 725 347" stroke="url(#wood)" stroke-width="19"/>
    <path d="M746 487C846 413 958 422 1042 493" stroke="url(#wood)" stroke-width="15"/>
    <path d="M276 361C288 455 310 526 348 588" stroke="#6d3c2c" stroke-width="10"/>
    <path d="M414 386C416 487 438 577 481 649" stroke="#6d3c2c" stroke-width="10"/>
  </g>

  <g fill="url(#leaf)" stroke="#45685f" stroke-width="3" filter="url(#velvet)">
    <use href="#leafShape" transform="translate(258 371) rotate(202) scale(.72)"/>
    <use href="#leafShape" transform="translate(433 337) rotate(222) scale(.78)"/>
    <use href="#leafShape" transform="translate(535 395) rotate(28) scale(.7)"/>
    <use href="#leafShape" transform="translate(668 456) rotate(35) scale(.72)"/>
    <use href="#leafShape" transform="translate(822 510) rotate(218) scale(.65)"/>
    <use href="#leafShape" transform="translate(932 556) rotate(30) scale(.54)"/>
    <use href="#leafShape" transform="translate(1090 595) rotate(209) scale(.42)"/>
  </g>
  <g fill="none" stroke="#e4eee3" stroke-width="2" opacity=".7">
    <path d="M273 354L201 319M446 323L373 284M548 406L614 446M679 466L748 504M836 493L778 463M940 568L1002 598"/>
  </g>

  <g transform="translate(322 275) scale(.92)"><use href="#flower"/></g>
  <g transform="translate(705 421) scale(.8)"><use href="#flower"/></g>
  <g transform="translate(988 535) scale(.55)"><use href="#flower"/></g>

  <g filter="url(#velvet)">
    <path d="M333 567C298 612 303 676 348 704C391 673 394 616 356 574Z" fill="url(#petal)" stroke="#e7eee9" stroke-width="3"/>
    <path d="M469 628C436 667 442 719 481 742C519 713 520 668 490 632Z" fill="url(#petal)" stroke="#e7eee9" stroke-width="3"/>
    <path d="M341 578C339 623 341 663 348 691M478 638C477 670 479 704 482 728" fill="none" stroke="#fff" stroke-width="3" opacity=".55"/>
  </g>
  <circle cx="344" cy="575" r="13" fill="url(#pearl)" stroke="#d0a24d" stroke-width="3"/>
  <circle cx="482" cy="637" r="13" fill="url(#pearl)" stroke="#d0a24d" stroke-width="3"/>
</svg>
