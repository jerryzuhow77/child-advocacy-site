<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">田田案白絨花全景紀念圖</title>
  <desc id="desc">冬季草原與遠方春光之間，一名匿名孩子的紙雕背影被白色絨花、月白花瓣與暖金花蕊環繞。</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1b21"/>
      <stop offset=".5" stop-color="#233d49"/>
      <stop offset=".76" stop-color="#607a7b"/>
      <stop offset="1" stop-color="#d9e4de"/>
    </linearGradient>
    <radialGradient id="dawn" cx="47%" cy="68%" r="42%">
      <stop offset="0" stop-color="#f7e8b9" stop-opacity=".94"/>
      <stop offset=".2" stop-color="#d0a24d" stop-opacity=".5"/>
      <stop offset=".58" stop-color="#7c9185" stop-opacity=".12"/>
      <stop offset="1" stop-color="#101f25" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="snow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8f2e5"/>
      <stop offset=".46" stop-color="#d9e4de"/>
      <stop offset="1" stop-color="#718782"/>
    </linearGradient>
    <linearGradient id="paperChild" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8f2e5"/>
      <stop offset=".48" stop-color="#d9e4de"/>
      <stop offset="1" stop-color="#9bb0a9"/>
    </linearGradient>
    <linearGradient id="petalWhite" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffdf6"/>
      <stop offset=".52" stop-color="#edf3ee"/>
      <stop offset="1" stop-color="#85aab2"/>
    </linearGradient>
    <linearGradient id="petalBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f9f7ec"/>
      <stop offset=".56" stop-color="#d9e4de"/>
      <stop offset="1" stop-color="#315e6b"/>
    </linearGradient>
    <linearGradient id="stem" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6f3d2b"/>
      <stop offset=".5" stop-color="#b18a4a"/>
      <stop offset="1" stop-color="#4d524e"/>
    </linearGradient>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="flowerShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="10" dy="16" stdDeviation="12" flood-color="#091014" flood-opacity=".48"/>
    </filter>
    <filter id="paperShadow" x="-40%" y="-30%" width="180%" height="180%">
      <feDropShadow dx="15" dy="22" stdDeviation="15" flood-color="#091014" flood-opacity=".5"/>
    </filter>
    <pattern id="paperFiber" width="38" height="38" patternUnits="userSpaceOnUse">
      <path d="M2 9c9 3 17-4 29 0M7 29c8-5 17 2 28-2" fill="none" stroke="#f8f2e5" stroke-opacity=".045" stroke-width="1"/>
    </pattern>
    <g id="ronghua">
      <g fill="url(#petalWhite)" stroke="#dce8e3" stroke-width="2.4">
        <path d="M0-16C-26-88-9-144 0-164c9 20 26 76 0 148Z"/>
        <path d="M0-16C-26-88-9-144 0-164c9 20 26 76 0 148Z" transform="rotate(40)"/>
        <path d="M0-16C-26-88-9-144 0-164c9 20 26 76 0 148Z" transform="rotate(80)"/>
        <path d="M0-16C-26-88-9-144 0-164c9 20 26 76 0 148Z" transform="rotate(120)"/>
        <path d="M0-16C-26-88-9-144 0-164c9 20 26 76 0 148Z" transform="rotate(160)"/>
        <path d="M0-16C-26-88-9-144 0-164c9 20 26 76 0 148Z" transform="rotate(200)"/>
        <path d="M0-16C-26-88-9-144 0-164c9 20 26 76 0 148Z" transform="rotate(240)"/>
        <path d="M0-16C-26-88-9-144 0-164c9 20 26 76 0 148Z" transform="rotate(280)"/>
        <path d="M0-16C-26-88-9-144 0-164c9 20 26 76 0 148Z" transform="rotate(320)"/>
      </g>
      <g fill="url(#petalBlue)" stroke="#f7f4e9" stroke-width="1.8" transform="scale(.62)">
        <ellipse cx="0" cy="-96" rx="28" ry="72"/>
        <ellipse cx="0" cy="-96" rx="28" ry="72" transform="rotate(60)"/>
        <ellipse cx="0" cy="-96" rx="28" ry="72" transform="rotate(120)"/>
        <ellipse cx="0" cy="-96" rx="28" ry="72" transform="rotate(180)"/>
        <ellipse cx="0" cy="-96" rx="28" ry="72" transform="rotate(240)"/>
        <ellipse cx="0" cy="-96" rx="28" ry="72" transform="rotate(300)"/>
      </g>
      <circle r="35" fill="#f6edd2" stroke="#b18a4a" stroke-width="4"/>
      <g fill="#d0a24d">
        <circle cx="0" cy="-48" r="7"/><circle cx="34" cy="-34" r="7"/><circle cx="48" cy="0" r="7"/>
        <circle cx="34" cy="34" r="7"/><circle cx="0" cy="48" r="7"/><circle cx="-34" cy="34" r="7"/>
        <circle cx="-48" cy="0" r="7"/><circle cx="-34" cy="-34" r="7"/>
      </g>
    </g>
    <g id="smallRonghua">
      <g fill="url(#petalBlue)" stroke="#f8f2e5" stroke-width="1.8">
        <ellipse cx="0" cy="-52" rx="22" ry="46"/>
        <ellipse cx="0" cy="-52" rx="22" ry="46" transform="rotate(60)"/>
        <ellipse cx="0" cy="-52" rx="22" ry="46" transform="rotate(120)"/>
        <ellipse cx="0" cy="-52" rx="22" ry="46" transform="rotate(180)"/>
        <ellipse cx="0" cy="-52" rx="22" ry="46" transform="rotate(240)"/>
        <ellipse cx="0" cy="-52" rx="22" ry="46" transform="rotate(300)"/>
      </g>
      <circle r="18" fill="#f6edd2" stroke="#b18a4a" stroke-width="3"/>
      <circle r="7" fill="#d0a24d"/>
    </g>
  </defs>

  <rect width="1920" height="1080" fill="url(#sky)"/>
  <rect width="1920" height="1080" fill="url(#dawn)"/>
  <rect width="1920" height="1080" fill="url(#paperFiber)"/>
  <circle cx="900" cy="735" r="178" fill="#f5d791" opacity=".22" filter="url(#softGlow)"/>
  <circle cx="900" cy="735" r="76" fill="#fff0bd" opacity=".5" filter="url(#softGlow)"/>

  <path d="M0 660C184 572 338 602 482 538c124-55 245-123 384-100 124 20 197 92 333 93 170 2 263-111 419-101 111 7 196 72 302 137v214H0Z" fill="#172321" opacity=".84"/>
  <path d="M0 719c191-75 356-43 514-92 153-48 270-120 408-72 108 37 195 119 335 98 170-25 291-93 433-45 94 31 166 90 230 133v197H0Z" fill="#315e6b" opacity=".58"/>
  <path d="M0 786c213-49 369-13 529-54 142-36 242-79 386-32 130 43 243 94 386 66 168-34 275-81 414-31 86 31 151 74 205 105v240H0Z" fill="url(#snow)"/>
  <path d="M0 866c212-44 378 7 535-13 147-18 270-69 413-25 122 38 206 94 360 79 164-17 291-68 422-24 81 27 142 59 190 88v109H0Z" fill="#eef1e8" opacity=".75"/>
  <path d="M22 997c220-61 387-37 574-47 158-8 280 21 424 24 203 4 321-39 507-31 132 6 251 38 393 64v73H0Z" fill="#d9e4de" opacity=".76"/>

  <g fill="none" stroke="#b18a4a" stroke-linecap="round" opacity=".72">
    <path d="M-40 1074C112 852 278 777 482 782c179 5 262 89 348 182" stroke-width="12"/>
    <path d="M63 1080C188 891 339 835 522 854" stroke-width="5"/>
    <path d="M235 1080C336 915 502 879 663 932" stroke-width="4"/>
  </g>

  <g filter="url(#paperShadow)">
    <ellipse cx="755" cy="1008" rx="154" ry="26" fill="#182321" opacity=".4"/>
    <path d="M703 1003c9-83 13-184 7-286-4-75 21-120 69-124 48-4 82 38 84 107 4 113 21 214 41 303Z" fill="url(#paperChild)" stroke="#f8f2e5" stroke-opacity=".7" stroke-width="5"/>
    <circle cx="782" cy="545" r="66" fill="url(#paperChild)" stroke="#f8f2e5" stroke-opacity=".72" stroke-width="5"/>
    <path d="M725 545c10-58 91-87 124-22-20-26-39-32-72-27-25 3-41 20-52 49Z" fill="#607a7b" opacity=".78"/>
    <path d="M726 720c-76 74-99 178-78 286M852 716c71 78 97 177 82 286" fill="none" stroke="#e7eee8" stroke-width="24" stroke-linecap="round"/>
    <path d="M727 772c-58 31-102 59-139 101M854 772c56 29 98 59 135 102" fill="none" stroke="#d9e4de" stroke-width="18" stroke-linecap="round"/>
  </g>

  <g opacity=".84">
    <path d="M847 776c33-45 47-95 50-155" fill="none" stroke="url(#stem)" stroke-width="8" stroke-linecap="round"/>
    <path d="M895 685c-37-31-64-61-79-94M893 690c40-29 65-61 82-96" fill="none" stroke="url(#stem)" stroke-width="5" stroke-linecap="round"/>
    <use href="#smallRonghua" x="813" y="583" transform="rotate(-8 813 583) scale(.72)"/>
    <use href="#smallRonghua" x="976" y="588" transform="rotate(9 976 588) scale(.66)"/>
  </g>

  <g filter="url(#flowerShadow)">
    <use href="#ronghua" x="230" y="824" transform="rotate(-11 230 824) scale(1.02)"/>
    <use href="#ronghua" x="478" y="910" transform="rotate(9 478 910) scale(.76)"/>
    <use href="#smallRonghua" x="610" y="754" transform="rotate(-8 610 754) scale(.9)"/>
    <use href="#smallRonghua" x="102" y="991" transform="rotate(12 102 991) scale(.76)"/>
  </g>

  <g fill="none" stroke="#f8f2e5" stroke-linecap="round" opacity=".34">
    <path d="M1115 995c64-71 151-94 234-72" stroke-width="3"/>
    <path d="M1272 1010c76-50 172-58 268-19" stroke-width="2"/>
    <path d="M1493 954c75-26 151-18 241 32" stroke-width="2"/>
  </g>
  <g fill="#f8f2e5" opacity=".72">
    <circle cx="1098" cy="762" r="3"/><circle cx="1185" cy="699" r="4"/><circle cx="1274" cy="808" r="2.5"/>
    <circle cx="1430" cy="718" r="3"/><circle cx="1518" cy="624" r="2.5"/><circle cx="1640" cy="794" r="4"/>
    <circle cx="1748" cy="682" r="3"/><circle cx="1814" cy="850" r="2"/>
  </g>
</svg>
