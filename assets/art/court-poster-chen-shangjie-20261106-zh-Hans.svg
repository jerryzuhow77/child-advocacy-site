<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc">
  <title id="title">11/6 陈尚洁案｜二审继续准备程序</title>
  <desc id="desc">庭期与法庭请以法院最新公告为准。主視覺為非辨識性藝術意象，非事件現場。</desc>
  <defs>
    <linearGradient id="veil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7f1e5" stop-opacity=".97"/>
      <stop offset=".48" stop-color="#f7f1e5" stop-opacity=".94"/>
      <stop offset=".72" stop-color="#f7f1e5" stop-opacity=".18"/>
      <stop offset="1" stop-color="#17364b" stop-opacity=".08"/>
    </linearGradient>
    <linearGradient id="foot" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#17364b"/>
      <stop offset="1" stop-color="#254d62"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#17364b" flood-opacity=".22"/>
    </filter>
  </defs>
  <image href="/child-advocacy-site/assets/art/chen-shangjie-prep-hearing-autumn-20260917.png" x="0" y="0" width="1080" height="1350" preserveAspectRatio="xMidYMid slice"/>
  <rect x="0" y="0" width="1080" height="720" fill="url(#veil)"/>
  <rect x="54" y="44" width="972" height="590" rx="38" fill="#f8f3e9" fill-opacity=".96" stroke="#29475a" stroke-opacity=".25" filter="url(#shadow)"/>
  <text x="88" y="104" class="eyebrow">COURT OBSERVATION · 2026.11.06</text>
  <text x="88" y="185" class="title">11/6 陈尚洁案</text>
  <rect x="88" y="245" width="904" height="92" rx="22" fill="#98473d"/>
  <text x="540" y="309" class="status" text-anchor="middle">二审继续准备程序</text>
  
    <text x="102" y="440" class="label">前次</text>
    <text x="290" y="440" class="value">9/16 第一次准备庭完成</text>
    <text x="102" y="512" class="label">期限</text>
    <text x="290" y="512" class="value">10/15 书状期限</text>
    <text x="102" y="584" class="label">下一庭</text>
    <text x="290" y="584" class="value">11/6・时间／法庭待法院公告</text>
  <rect x="78" y="720" width="924" height="186" rx="28" fill="#fbf7ee" fill-opacity=".90" stroke="#ffffff" stroke-opacity=".65"/>
  <text x="540" y="815" class="statement" text-anchor="middle">程序持续追踪，不预设裁判结果。</text>
  <rect x="54" y="1085" width="972" height="215" rx="34" fill="url(#foot)" fill-opacity=".97"/>
  <text x="88" y="1145" class="disclaimer">庭期与法庭请以法院最新公告为准</text>
  <text x="540" y="1230" class="org" text-anchor="middle">护童行动联盟</text>
  <text x="540" y="1272" class="tagline" text-anchor="middle">记录程序，也守住证据与责任的界线</text>
  <style>
    .eyebrow{font:700 28px/1.2 "Noto Sans CJK TC","Noto Sans CJK SC",sans-serif;letter-spacing:2px;fill:#263e4d}
    .title{font:800 62px/1.15 "Noto Serif CJK TC","Noto Serif CJK SC",serif;fill:#193247}
    .status{font:800 48px/1.1 "Noto Serif CJK TC","Noto Serif CJK SC",serif;fill:white}
    .label{font:700 30px/1.1 "Noto Sans CJK TC","Noto Sans CJK SC",sans-serif;fill:#586872}
    .value{font:800 36px/1.1 "Noto Sans CJK TC","Noto Sans CJK SC",sans-serif;fill:#203746}
    .statement{font:800 40px/1.2 "Noto Serif CJK TC","Noto Serif CJK SC",serif;fill:#1d4154}
    .disclaimer{font:500 25px/1.2 "Noto Sans CJK TC","Noto Sans CJK SC",sans-serif;fill:#f3ead8}
    .org{font:800 34px/1.1 "Noto Sans CJK TC","Noto Sans CJK SC",sans-serif;fill:white}
    .tagline{font:500 24px/1.1 "Noto Serif CJK TC","Noto Serif CJK SC",serif;fill:#eadfc9}
  </style>
</svg>