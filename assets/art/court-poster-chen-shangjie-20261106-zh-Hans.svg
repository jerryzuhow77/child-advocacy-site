<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc">
  <title id="title">11/6 陈尚洁案｜二审继续准备程序</title>
  <desc id="desc">11月6日14时30分开庭。依台湾高等法院公告，取得旁听证且符合公告资格者，须于13时40分至14时在刑事庭大厦一楼入口本人领证；不得代领或转让。</desc>
  <defs>
    <linearGradient id="veil" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f7f1e5" stop-opacity=".97"/><stop offset=".48" stop-color="#f7f1e5" stop-opacity=".94"/><stop offset=".72" stop-color="#f7f1e5" stop-opacity=".18"/><stop offset="1" stop-color="#17364b" stop-opacity=".08"/></linearGradient>
    <linearGradient id="foot" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#17364b"/><stop offset="1" stop-color="#254d62"/></linearGradient>
  </defs>
  <image href="/child-advocacy-site/assets/art/chen-shangjie-prep-hearing-autumn-20260917.png" x="0" y="0" width="1080" height="1350" preserveAspectRatio="xMidYMid slice"/>
  <rect x="0" y="0" width="1080" height="790" fill="url(#veil)"/>
  <rect x="54" y="44" width="972" height="746" rx="38" fill="#f8f3e9" fill-opacity=".96" stroke="#29475a" stroke-opacity=".25"/>
  <text x="88" y="104" class="eyebrow">COURT OBSERVATION · 2026.11.06</text>
  <text x="88" y="180" class="title">11/6 陈尚洁案</text>
  <rect x="88" y="230" width="904" height="86" rx="22" fill="#98473d"/>
  <text x="540" y="289" class="status" text-anchor="middle">二审继续准备程序</text>
  <text x="96" y="390" class="keylabel">旁听证领取</text>
  <text x="96" y="462" class="keytime">13:40–14:00</text>
  <text x="96" y="515" class="place">博爱路127号・刑事庭大厦一楼入口</text>
  <line x1="88" y1="550" x2="992" y2="550" stroke="#29475a" stroke-opacity=".24"/>
  <text x="96" y="606" class="qualification">仅限符合公告资格、已取得旁听证者本人领取</text>
  <text x="96" y="649" class="notice">不得代领或转让；逾时未领取者依公告办理候补</text>
  <text x="96" y="726" class="hearing">14:30 开庭・专一法庭</text>
  <rect x="78" y="838" width="924" height="160" rx="28" fill="#fbf7ee" fill-opacity=".90" stroke="#ffffff" stroke-opacity=".65"/>
  <text x="540" y="910" class="statement" text-anchor="middle">程序持续追踪，不预设裁判结果。</text>
  <text x="540" y="955" class="source" text-anchor="middle">庭期、旁听资格与候补规则，以法院公告为准</text>
  <rect x="54" y="1085" width="972" height="215" rx="34" fill="url(#foot)" fill-opacity=".97"/>
  <text x="540" y="1150" class="disclaimer" text-anchor="middle">一般参与者请勿误认为可直接入庭</text>
  <text x="540" y="1230" class="org" text-anchor="middle">护童行动联盟</text>
  <text x="540" y="1272" class="tagline" text-anchor="middle">记录程序，也守住证据与责任的界线</text>
  <style>.eyebrow{font:700 28px/1.2 "Noto Sans CJK TC","Noto Sans CJK SC",sans-serif;letter-spacing:2px;fill:#263e4d}.title{font:800 62px/1.15 "Noto Serif CJK TC","Noto Serif CJK SC",serif;fill:#193247}.status{font:800 46px/1.1 "Noto Serif CJK TC","Noto Serif CJK SC",serif;fill:white}.keylabel{font:700 29px/1.1 "Noto Sans CJK SC",sans-serif;fill:#586872}.keytime{font:800 64px/1 "Noto Serif CJK SC",serif;fill:#98473d}.place{font:800 31px/1.1 "Noto Sans CJK SC",sans-serif;fill:#203746}.qualification{font:800 30px/1.1 "Noto Sans CJK SC",sans-serif;fill:#203746}.notice{font:600 27px/1.1 "Noto Sans CJK SC",sans-serif;fill:#586872}.hearing{font:800 38px/1.1 "Noto Sans CJK SC",sans-serif;fill:#193247}.statement{font:800 38px/1.2 "Noto Serif CJK SC",serif;fill:#1d4154}.source{font:600 24px/1.2 "Noto Sans CJK SC",sans-serif;fill:#586872}.disclaimer{font:700 30px/1.2 "Noto Sans CJK SC",sans-serif;fill:#f3ead8}.org{font:800 34px/1.1 "Noto Sans CJK SC",sans-serif;fill:white}.tagline{font:500 24px/1.1 "Noto Serif CJK SC",serif;fill:#eadfc9}</style>
</svg>
