<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 52" role="img" aria-labelledby="title desc">
  <title id="title">金色紙雕千紙鶴</title>
  <desc id="desc">以多層暖金色幾何紙片組成的摺紙鶴圖案</desc>
  <defs>
    <linearGradient id="wingLeft" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff2bd"/>
      <stop offset="0.52" stop-color="#e4bd61"/>
      <stop offset="1" stop-color="#b87a24"/>
    </linearGradient>
    <linearGradient id="wingRight" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8dda0"/>
      <stop offset="0.55" stop-color="#d6a847"/>
      <stop offset="1" stop-color="#9d641e"/>
