    <path d="m45 25 12-10 5 1-4 4 9 4-18 7Z" fill="#f0d181"/>
    <path d="m49 31 18 7-27 1Z" fill="#b77724"/>
    <path d="m35 41-7 8-3-18Z" fill="#f4d98d"/>
    <path d="M27 21 35 20 25 27Z" fill="#fff0b4" opacity=".92"/>
