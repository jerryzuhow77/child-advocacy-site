  <path d="M80 95H530M1390 95H1840" stroke="#d4a652" stroke-width="3"/><circle cx="55" cy="95" r="10" fill="#b6463f"/><circle cx="1865" cy="95" r="10" fill="#b6463f"/>
  <text x="960" y="78" text-anchor="middle" class="title" font-size="46">剴剴的115天｜保護傘在哪裡斷開？</text>
  <text x="960" y="116" text-anchor="middle" class="subtitle" font-size="20">兩次啟動收出養程序・三個專業位置・十道可回查的文件門</text>


  <g filter="url(#shadow)">
    <rect x="80" y="145" width="700" height="112" rx="18" fill="#f8f1df" stroke="#d7bc82" stroke-width="2"/>
    <rect x="80" y="145" width="9" height="112" rx="4" fill="#d4a652"/>
    <text x="106" y="181" class="card-title" font-size="22">教育部｜案發時基金會法人主管</text>
    <text x="106" y="214" class="card-copy" font-size="17" text-anchor="start"><tspan x="106" dy="0">監督兒盟會務、財務、董事會與內控</tspan><tspan x="106" dy="27">不直接主管個案收出養業務</tspan></text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1140" y="145" width="700" height="112" rx="18" fill="#f8f1df" stroke="#d7bc82" stroke-width="2"/>
    <rect x="1140" y="145" width="9" height="112" rx="4" fill="#438d8e"/>
    <text x="1166" y="181" class="card-title" font-size="22">衛生福利部｜收出養業務主管</text>
    <text x="1166" y="214" class="card-copy" font-size="17" text-anchor="start"><tspan x="1166" dy="0">許可、檢查與評鑑收出養媒合服務者</tspan><tspan x="1166" dy="27">規範地方兒少保護與居家托育制度</tspan></text>
  </g>
  <path d="M430 258 C520 305 605 320 710 334" fill="none" stroke="#d4a652" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M1490 258 C1400 305 1315 320 1210 334" fill="none" stroke="#d4a652" stroke-width="4" marker-end="url(#arrow)"/>


  <g filter="url(#shadow)">
    <rect x="80" y="286" width="570" height="174" rx="18" fill="#f8f1df" stroke="#d7bc82" stroke-width="2"/>
    <rect x="80" y="286" width="9" height="174" rx="4" fill="#438d8e"/>
    <text x="106" y="322" class="card-title" font-size="22">第一次程序｜2022.01—06</text>
    <text x="106" y="355" class="card-copy" font-size="17" text-anchor="start"><tspan x="106" dy="0">母親求助 → 樹鶯轉介 → 兒盟承接</tspan><tspan x="106" dy="27">簽約並進入第一段全日照顧</tspan><tspan x="106" dy="27">監護人失聯後暫停、結案</tspan><tspan x="106" dy="27">釐清：曾啟動媒合，沒有完成收養</tspan></text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1270" y="286" width="570" height="174" rx="18" fill="#f8f1df" stroke="#d7bc82" stroke-width="2"/>
    <rect x="1270" y="286" width="9" height="174" rx="4" fill="#b6463f"/>
    <text x="1296" y="322" class="card-title" font-size="22">第二次程序｜2023.05—09</text>
    <text x="1296" y="355" class="card-copy" font-size="17" text-anchor="start"><tspan x="1296" dy="0">外婆取得監護 → 樹鶯再次轉介</tspan><tspan x="1296" dy="27">兒盟再派同一承辦社工並重啟</tspan><tspan x="1296" dy="27">09.01由劉彩萱提供24小時照顧</tspan><tspan x="1296" dy="27">釐清：仍在待出養階段，沒有完成收養</tspan></text>
  </g>
  <g filter="url(#shadow)">
    <g clip-path="url(#canopy)"><rect x="710" y="170" width="100" height="230" fill="#efe5cf"/><rect x="810" y="170" width="100" height="230" fill="#4d8e91"/><rect x="910" y="170" width="100" height="230" fill="#0f3d56"/><rect x="1010" y="170" width="100" height="230" fill="#d2a34d"/><rect x="1110" y="170" width="100" height="230" fill="#efe5cf"/></g>
    <path d="M710 390 Q960 170 1210 390 Q1152 333 1090 390 Q1028 323 960 390 Q892 323 830 390 Q768 333 710 390 Z" fill="none" stroke="#f2d79d" stroke-width="6"/>
    <path d="M960 390V447Q960 476 934 476" fill="none" stroke="#d4a652" stroke-width="7" stroke-linecap="round"/>
    <text x="760" y="326" text-anchor="middle" class="umbrella-label" font-size="14" transform="rotate(12 760 326)">中央制度</text><text x="860" y="313" text-anchor="middle" class="umbrella-label" font-size="14" transform="rotate(6 860 313)">家庭服務</text><text x="960" y="300" text-anchor="middle" class="umbrella-label" font-size="14" transform="rotate(0 960 300)">收出養</text><text x="1060" y="313" text-anchor="middle" class="umbrella-label" font-size="14" transform="rotate(-6 1060 313)">托育監管</text><text x="1160" y="326" text-anchor="middle" class="umbrella-label" font-size="14" transform="rotate(-12 1160 326)">第一線查證</text>
  </g>
  <g transform="translate(890 402)" filter="url(#shadow)">
    <circle cx="70" cy="29" r="25" fill="#242c32"/><path d="M47 26Q70 -2 94 26" fill="#1d252b"/><rect x="40" y="51" width="60" height="72" rx="22" fill="#143e56"/>
    <path d="M42 69H98M41 87H99M44 105H96" stroke="#b8cfce" stroke-width="11"/><rect x="49" y="116" width="17" height="32" rx="7" fill="#162d38"/><rect x="75" y="116" width="17" height="32" rx="7" fill="#162d38"/>
  </g>
  <text x="960" y="467" text-anchor="middle" class="child-title" font-size="19">剴剴｜權利主體</text>
  <text x="960" y="486" text-anchor="middle" class="child-copy" font-size="11">大人決定路徑，制度必須持續看見孩子</text>


  <g filter="url(#shadow)">
    <rect x="80" y="500" width="560" height="176" rx="18" fill="#f8f1df" stroke="#d7bc82" stroke-width="2"/>
    <rect x="80" y="500" width="9" height="176" rx="4" fill="#438d8e"/>
    <text x="106" y="536" class="card-title" font-size="22">施盈如｜新北樹鶯社工</text>
    <text x="106" y="569" class="card-copy" font-size="16" text-anchor="start"><tspan x="106" dy="0">掌握家庭求助、監護與前段照顧史</tspan><tspan x="106" dy="27">兩度轉介兒盟辦理收出養</tspan><tspan x="106" dy="27">法律狀態：證人，非刑事被告</tspan></text>
  </g>
  <g filter="url(#shadow)">
    <rect x="670" y="500" width="560" height="176" rx="18" fill="#f8f1df" stroke="#d7bc82" stroke-width="2"/>
    <rect x="670" y="500" width="9" height="176" rx="4" fill="#b6463f"/>
    <text x="696" y="536" class="card-title" font-size="22">陳尚潔｜兒盟收出養社工</text>
    <text x="696" y="569" class="card-copy" font-size="16" text-anchor="start"><tspan x="696" dy="0">承接媒合、安排合作保母、訪視追蹤</tspan><tspan x="696" dy="27">掌握跨階段資料與身心變化</tspan><tspan x="696" dy="27">法律狀態：一審2年，雙方上訴中</tspan></text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1260" y="500" width="560" height="176" rx="18" fill="#f8f1df" stroke="#d7bc82" stroke-width="2"/>
    <rect x="1260" y="500" width="9" height="176" rx="4" fill="#d4a652"/>
    <text x="1286" y="536" class="card-title" font-size="22">林心慈｜文山居托前訪視人員</text>
    <text x="1286" y="569" class="card-copy" font-size="16" text-anchor="start"><tspan x="1286" dy="0">訪視登記托育場域、外觀與生活紀錄</tspan><tspan x="1286" dy="27">文山沒有媒合剴剴；她也不是社工</tspan><tspan x="1286" dy="27">法律狀態：遭起訴，仍在審理</tspan></text>
  </g>
  <path d="M360 676V716H960" fill="none" stroke="#6f9b96" stroke-width="3" stroke-dasharray="10 8"/><path d="M960 676V716" stroke="#b6463f" stroke-width="3"/><path d="M1560 676V716H960" fill="none" stroke="#d4a652" stroke-width="3" stroke-dasharray="10 8"/>
  <g filter="url(#shadow)"><rect x="80" y="700" width="1760" height="82" rx="16" fill="#efe1c6" stroke="#d2b275" stroke-width="2"/><rect x="80" y="700" width="12" height="82" rx="6" fill="#b6463f"/><text x="114" y="732" class="card-title" font-size="21">劉彩萱｜兒盟合作保母＋臺北市登記托育人員</text><text x="114" y="758" class="card-copy" font-size="15">不是收養人・不是寄養家庭・不是臺北市社會局直接委任的保母</text><text x="1040" y="758" class="card-copy" font-size="14" text-anchor="middle">關係：兒盟安排照顧；文山居托依北市社會局委託訪視登記托育場域</text></g>

  <text x="80" y="836" class="small-label" font-size="20">五個未閉合的風險斷點</text>
  <g><rect x="275" y="805" width="240" height="52" rx="26" fill="#8f302f" stroke="#e6a36d" stroke-width="2"/><circle cx="299" cy="831" r="13" fill="#f6dcc0"/><text x="299" y="837" text-anchor="middle" class="risk-number" font-size="14">1</text><text x="407" y="839" text-anchor="middle" class="risk-copy" font-size="17">分段掌握</text><path d="M517 831 H554" stroke="#d45c52" stroke-width="6" stroke-dasharray="12 8"/></g><g><rect x="560" y="805" width="240" height="52" rx="26" fill="#8f302f" stroke="#e6a36d" stroke-width="2"/><circle cx="584" cy="831" r="13" fill="#f6dcc0"/><text x="584" y="837" text-anchor="middle" class="risk-number" font-size="14">2</text><text x="692" y="839" text-anchor="middle" class="risk-copy" font-size="17">單向轉述</text><path d="M802 831 H839" stroke="#d45c52" stroke-width="6" stroke-dasharray="12 8"/></g><g><rect x="845" y="805" width="240" height="52" rx="26" fill="#8f302f" stroke="#e6a36d" stroke-width="2"/><circle cx="869" cy="831" r="13" fill="#f6dcc0"/><text x="869" y="837" text-anchor="middle" class="risk-number" font-size="14">3</text><text x="977" y="839" text-anchor="middle" class="risk-copy" font-size="17">未交叉查證</text><path d="M1087 831 H1124" stroke="#d45c52" stroke-width="6" stroke-dasharray="12 8"/></g><g><rect x="1130" y="805" width="240" height="52" rx="26" fill="#8f302f" stroke="#e6a36d" stroke-width="2"/><circle cx="1154" cy="831" r="13" fill="#f6dcc0"/><text x="1154" y="837" text-anchor="middle" class="risk-number" font-size="14">4</text><text x="1262" y="839" text-anchor="middle" class="risk-copy" font-size="17">未升級介入</text><path d="M1372 831 H1409" stroke="#d45c52" stroke-width="6" stroke-dasharray="12 8"/></g><g><rect x="1415" y="805" width="240" height="52" rx="26" fill="#8f302f" stroke="#e6a36d" stroke-width="2"/><circle cx="1439" cy="831" r="13" fill="#f6dcc0"/><text x="1439" y="837" text-anchor="middle" class="risk-number" font-size="14">5</text><text x="1547" y="839" text-anchor="middle" class="risk-copy" font-size="17">安全網未閉合</text></g>
  <text x="960" y="890" text-anchor="middle" class="subtitle" font-size="15">十道文件門｜DAY01—DAY10是公開庭審紀錄，不是十個責任主體，也不是十項獨立定罪</text>
  <g transform="translate(90 906)"><use href="#door"/><text x="78" y="105" text-anchor="middle" class="door-label" font-size="15">DAY 01</text></g><g transform="translate(266 906)"><use href="#door"/><text x="78" y="105" text-anchor="middle" class="door-label" font-size="15">DAY 02</text></g><g transform="translate(442 906)"><use href="#door"/><text x="78" y="105" text-anchor="middle" class="door-label" font-size="15">DAY 03</text></g><g transform="translate(618 906)"><use href="#door"/><text x="78" y="105" text-anchor="middle" class="door-label" font-size="15">DAY 04</text></g><g transform="translate(794 906)"><use href="#door"/><text x="78" y="105" text-anchor="middle" class="door-label" font-size="15">DAY 05</text></g><g transform="translate(970 906)"><use href="#door"/><text x="78" y="105" text-anchor="middle" class="door-label" font-size="15">DAY 06</text></g><g transform="translate(1146 906)"><use href="#door"/><text x="78" y="105" text-anchor="middle" class="door-label" font-size="15">DAY 07</text></g><g transform="translate(1322 906)"><use href="#door"/><text x="78" y="105" text-anchor="middle" class="door-label" font-size="15">DAY 08</text></g><g transform="translate(1498 906)"><use href="#door"/><text x="78" y="105" text-anchor="middle" class="door-label" font-size="15">DAY 09</text></g><g transform="translate(1674 906)"><use href="#door"/><text x="78" y="105" text-anchor="middle" class="door-label" font-size="15">DAY 10</text></g>

  <text x="80" y="1060" class="small-label" font-size="20">六項關鍵細節釐清</text>
  <g><rect x="80" y="1082" width="560" height="80" rx="13" fill="#f9f3e5" stroke="#c9ad72" stroke-width="2"/><text x="98" y="1110" class="clarify-title" font-size="17">01｜兩度轉介 ≠ 兩次完成收養</text><text x="98" y="1139" class="clarify-copy" font-size="13" text-anchor="start"><tspan x="98" dy="0">第一次暫停結案；第二次進入出養前全日照顧，離世前未完成法院認可收養。</tspan></text></g><g><rect x="670" y="1082" width="560" height="80" rx="13" fill="#f9f3e5" stroke="#c9ad72" stroke-width="2"/><text x="688" y="1110" class="clarify-title" font-size="17">02｜待出養 ≠ 孤兒</text><text x="688" y="1139" class="clarify-copy" font-size="13" text-anchor="start"><tspan x="688" dy="0">孩子仍有原生家庭與監護人；「沒人要」是制度追問，不是身分定性。</tspan></text></g><g><rect x="1260" y="1082" width="560" height="80" rx="13" fill="#f9f3e5" stroke="#c9ad72" stroke-width="2"/><text x="1278" y="1110" class="clarify-title" font-size="17">03｜合作保母 ≠ 收養人／寄養家庭</text><text x="1278" y="1139" class="clarify-copy" font-size="13" text-anchor="start"><tspan x="1278" dy="0">劉彩萱承接兒盟安排的出養前全日照顧，法律角色不能互換。</tspan></text></g><g><rect x="80" y="1176" width="560" height="80" rx="13" fill="#f9f3e5" stroke="#c9ad72" stroke-width="2"/><text x="98" y="1204" class="clarify-title" font-size="17">04｜文山訪視 ≠ 文山媒合</text><text x="98" y="1233" class="clarify-copy" font-size="13" text-anchor="start"><tspan x="98" dy="0">文山依北市社會局委託管理登記場域；媒合與安排照顧者是兒盟。</tspan></text></g><g><rect x="670" y="1176" width="560" height="80" rx="13" fill="#fff1dc" stroke="#b6463f" stroke-width="2"/><text x="688" y="1204" class="clarify-title" font-size="17">05｜牙醫疑慮是轉述，不是直接通知</text><text x="688" y="1233" class="clarify-copy" font-size="13" text-anchor="start"><tspan x="688" dy="0">疑慮由劉彩萱轉述給陳尚潔；不能寫成牙醫直接告知，也不能寫成已確認虐待。</tspan></text></g><g><rect x="1260" y="1176" width="560" height="80" rx="13" fill="#fff1dc" stroke="#b6463f" stroke-width="2"/><text x="1278" y="1204" class="clarify-title" font-size="17">06｜法律狀態不能混寫</text><text x="1278" y="1233" class="clarify-copy" font-size="13" text-anchor="start"><tspan x="1278" dy="0">施盈如是證人；林心慈遭起訴；陳尚潔一審未定讞；主案劉姓姊妹才已定讞。</tspan></text></g>
  <rect x="80" y="1270" width="1760" height="60" rx="10" fill="#5f2528" stroke="#d4a652" stroke-width="1.5"/>
  <text x="960" y="1295" text-anchor="middle" class="boundary" font-size="13">證據界線｜兩度轉介、法院判決、監察院行政調查與庭上證述分層呈現。圖中路徑及紅色斷鏈是編輯性整理，不等於法院已認定所有節點負刑事責任。</text>
  <text x="960" y="1317" text-anchor="middle" class="art-note" font-size="12">公益象徵｜深海軍藍＋淺霧藍條紋幼童與雨傘，非真實肖像、證物或案件現場影像。</text>
  <g opacity=".11" filter="url(#paper)"><rect width="1920" height="1350" fill="#f5e6c2"/></g>
</svg>