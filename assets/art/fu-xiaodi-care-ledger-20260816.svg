<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">照顧交接簿與六份裁判的象徵畫面</title>
  <desc id="desc">深藍背景上，一份未完成的照顧交接表連接2005年9月16日與11月26日，旁側排列六張裁判頁；沒有兒童、傷勢或案件人物。</desc>
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071b27"/>
      <stop offset="0.55" stop-color="#123746"/>
      <stop offset="1" stop-color="#315663"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f0df"/>
      <stop offset="1" stop-color="#d9cbae"/>
    </linearGradient>
    <linearGradient id="light" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9c77a" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#cf8f56" stop-opacity="0.12"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#031016" flood-opacity="0.42"/>
    </filter>
    <pattern id="grain" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="5" r="0.8" fill="#ffffff" opacity="0.07"/>
      <circle cx="19" cy="15" r="0.7" fill="#000000" opacity="0.09"/>
      <path d="M2 20L12 18" stroke="#ffffff" stroke-width="0.5" opacity="0.04"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#night)"/>
  <rect width="1600" height="900" fill="url(#grain)"/>
  <circle cx="1320" cy="124" r="285" fill="#d1a569" opacity="0.08"/>
  <circle cx="1320" cy="124" r="182" fill="#e7c986" opacity="0.06"/>
  <path d="M0 705C330 620 495 780 814 689C1112 605 1288 671 1600 565V900H0Z" fill="#06151d" opacity="0.48"/>

