    <path d="M42 69H98M41 87H99M44 105H96" stroke="#b8cfce" stroke-width="11"/><rect x="49" y="116" width="17" height="32" rx="7" fill="#162d38"/><rect x="75" y="116" width="17" height="32" rx="7" fill="#162d38"/>
  </g>
  <text x="960" y="467" text-anchor="middle" class="child-title" font-size="19">剀剀｜权利主体</text>
  <text x="960" y="486" text-anchor="middle" class="child-copy" font-size="11">大人决定路径，制度必须持续看见孩子</text>


  <g filter="url(#shadow)">
    <rect x="80" y="500" width="560" height="176" rx="18" fill="#f8f1df" stroke="#d7bc82" stroke-width="2"/>
    <rect x="80" y="500" width="9" height="176" rx="4" fill="#438d8e"/>
    <text x="106" y="536" class="card-title" font-size="22">施盈如｜新北树莺社工</text>
    <text x="106" y="569" class="card-copy" font-size="16" text-anchor="start"><tspan x="106" dy="0">掌握家庭求助、监护与前段照顾史</tspan><tspan x="106" dy="27">两度转介儿盟办理收出养</tspan><tspan x="106" dy="27">法律状态：证人，非刑事被告</tspan></text>
  </g>
  <g filter="url(#shadow)">
    <rect x="670" y="500" width="560" height="176" rx="18" fill="#f8f1df" stroke="#d7bc82" stroke-width="2"/>
    <rect x="670" y="500" width="9" height="176" rx="4" fill="#b6463f"/>
    <text x="696" y="536" class="card-title" font-size="22">陈尚洁｜儿盟收出养社工</text>
    <text x="696" y="569" class="card-copy" font-size="16" text-anchor="start"><tspan x="696" dy="0">承接媒合、安排合作保母、访视追踪</tspan><tspan x="696" dy="27">掌握跨阶段资料与身心变化</tspan><tspan x="696" dy="27">法律状态：一审2年，双方上诉中</tspan></text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1260" y="500" width="560" height="176" rx="18" fill="#f8f1df" stroke="#d7bc82" stroke-width="2"/>
    <rect x="1260" y="500" width="9" height="176" rx="4" fill="#d4a652"/>
    <text x="1286" y="536" class="card-title" font-size="22">林心慈｜文山居托前访视人员</text>
    <text x="1286" y="569" class="card-copy" font-size="16" text-anchor="start"><tspan x="1286" dy="0">访视登记托育场域、外观与生活纪录</tspan><tspan x="1286" dy="27">文山没有媒合剀剀；她也不是社工</tspan><tspan x="1286" dy="27">法律状态：遭起诉，仍在审理</tspan></text>
  </g>
  <path d="M360 676V716H960" fill="none" stroke="#6f9b96" stroke-width="3" stroke-dasharray="10 8"/><path d="M960 676V716" stroke="#b6463f" stroke-width="3"/><path d="M1560 676V716H960" fill="none" stroke="#d4a652" stroke-width="3" stroke-dasharray="10 8"/>
  <g filter="url(#shadow)"><rect x="80" y="700" width="1760" height="82" rx="16" fill="#efe1c6" stroke="#d2b275" stroke-width="2"/><rect x="80" y="700" width="12" height="82" rx="6" fill="#b6463f"/><text x="114" y="732" class="card-title" font-size="21">刘彩萱｜儿盟合作保母＋台北市登记托育人员</text><text x="114" y="758" class="card-copy" font-size="15">不是收养人・不是寄养家庭・不是台北市社会局直接委任的保母</text><text x="1040" y="758" class="card-copy" font-size="14" text-anchor="middle">关系：儿盟安排照顾；文山居托依台北市社会局委托访视登记托育场域</text></g>

  <text x="80" y="808" class="small-label" font-size="20">中央—地方—民间关系层｜不是一条单一指挥链</text>
  <path d="M580 802H1840" stroke="#d4a652" stroke-width="2" stroke-dasharray="8 9" opacity=".65"/>

  <g filter="url(#shadow)">
    <rect x="80" y="820" width="425" height="150" rx="18" fill="#f8f1df" stroke="#d7bc82" stroke-width="2"/>
    <rect x="80" y="820" width="9" height="150" rx="4" fill="#d4a652"/>
    <text x="106" y="856" class="card-title" font-size="22">中央双轴｜教育部＋卫福部</text>
    <text x="106" y="889" class="card-copy" font-size="16" text-anchor="start"><tspan x="106" dy="0">教育部：案发时管儿盟基金会法人治理</tspan><tspan x="106" dy="27">卫福部：管收出养许可、检查与评鉴</tspan><tspan x="106" dy="27">两者不是同一种个案指挥权</tspan></text>
  </g>
  <g filter="url(#shadow)">
    <rect x="525" y="820" width="425" height="150" rx="18" fill="#f8f1df" stroke="#d7bc82" stroke-width="2"/>
    <rect x="525" y="820" width="9" height="150" rx="4" fill="#438d8e"/>
    <text x="551" y="856" class="card-title" font-size="22">新北家庭端｜新北市 → 树莺</text>
    <text x="551" y="889" class="card-copy" font-size="16" text-anchor="start"><tspan x="551" dy="0">树莺办理脆弱家庭服务、掌握家庭史</tspan><tspan x="551" dy="27">两度将收出养需求转介儿盟</tspan><tspan x="551" dy="27">不是刘彩萱的照顾安排者</tspan></text>
  </g>
  <g filter="url(#shadow)">
    <rect x="970" y="820" width="425" height="150" rx="18" fill="#f8f1df" stroke="#d7bc82" stroke-width="2"/>
    <rect x="970" y="820" width="9" height="150" rx="4" fill="#b6463f"/>
    <text x="996" y="856" class="card-title" font-size="22">民间收出养端｜树莺 → 儿盟</text>
    <text x="996" y="889" class="card-copy" font-size="16" text-anchor="start"><tspan x="996" dy="0">儿盟承接转介、签媒合服务契约</tspan><tspan x="996" dy="27">安排收出养社工与合作保母</tspan><tspan x="996" dy="27">儿盟不是地方政府附属机关</tspan></text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1415" y="820" width="425" height="150" rx="18" fill="#f8f1df" stroke="#d7bc82" stroke-width="2"/>
    <rect x="1415" y="820" width="9" height="150" rx="4" fill="#739b94"/>
    <text x="1441" y="856" class="card-title" font-size="22">台北托育端｜台北市 → 文山</text>
    <text x="1441" y="889" class="card-copy" font-size="16" text-anchor="start"><tspan x="1441" dy="0">台北市社会局委托文山办理居托管理</tspan><tspan x="1441" dy="27">访视登记托育场域与照顾纪录</tspan><tspan x="1441" dy="27">未媒合剀剀，也未直接委任保母</tspan></text>
  </g>
  <rect x="80" y="985" width="1760" height="72" rx="13" fill="#163e4c" stroke="#6f9b96" stroke-width="2"/>
  <circle cx="111" cy="1021" r="17" fill="#b6463f"/><path d="M103 1021h16M111 1013v16" stroke="#f6dfad" stroke-width="2.5"/>
  <text x="143" y="1027" class="relation-note" font-size="15">照顾现场的交会｜儿盟安排刘彩萱提供全日照顾；文山依地方委托访视登记托育场域；树莺仍在新北家庭服务端。各端掌握不同资料，却没有形成可验证的共同安全判断。</text>

  <text x="80" y="1092" class="small-label" font-size="20">五个未闭合的风险断点</text>
  <g><rect x="275" y="1104" width="240" height="52" rx="26" fill="#8f302f" stroke="#e6a36d" stroke-width="2"/><circle cx="299" cy="1130" r="13" fill="#f6dcc0"/><text x="299" y="1136" text-anchor="middle" class="risk-number" font-size="14">1</text><text x="407" y="1138" text-anchor="middle" class="risk-copy" font-size="17">分段掌握</text><path d="M517 1130 H554" stroke="#d45c52" stroke-width="6" stroke-dasharray="12 8"/></g><g><rect x="560" y="1104" width="240" height="52" rx="26" fill="#8f302f" stroke="#e6a36d" stroke-width="2"/><circle cx="584" cy="1130" r="13" fill="#f6dcc0"/><text x="584" y="1136" text-anchor="middle" class="risk-number" font-size="14">2</text><text x="692" y="1138" text-anchor="middle" class="risk-copy" font-size="17">单向转述</text><path d="M802 1130 H839" stroke="#d45c52" stroke-width="6" stroke-dasharray="12 8"/></g><g><rect x="845" y="1104" width="240" height="52" rx="26" fill="#8f302f" stroke="#e6a36d" stroke-width="2"/><circle cx="869" cy="1130" r="13" fill="#f6dcc0"/><text x="869" y="1136" text-anchor="middle" class="risk-number" font-size="14">3</text><text x="977" y="1138" text-anchor="middle" class="risk-copy" font-size="17">未交叉查证</text><path d="M1087 1130 H1124" stroke="#d45c52" stroke-width="6" stroke-dasharray="12 8"/></g><g><rect x="1130" y="1104" width="240" height="52" rx="26" fill="#8f302f" stroke="#e6a36d" stroke-width="2"/><circle cx="1154" cy="1130" r="13" fill="#f6dcc0"/><text x="1154" y="1136" text-anchor="middle" class="risk-number" font-size="14">4</text><text x="1262" y="1138" text-anchor="middle" class="risk-copy" font-size="17">未升级介入</text><path d="M1372 1130 H1409" stroke="#d45c52" stroke-width="6" stroke-dasharray="12 8"/></g><g><rect x="1415" y="1104" width="240" height="52" rx="26" fill="#8f302f" stroke="#e6a36d" stroke-width="2"/><circle cx="1439" cy="1130" r="13" fill="#f6dcc0"/><text x="1439" y="1136" text-anchor="middle" class="risk-number" font-size="14">5</text><text x="1547" y="1138" text-anchor="middle" class="risk-copy" font-size="17">安全网未闭合</text></g>
  <text x="960" y="1184" text-anchor="middle" class="subtitle" font-size="15">十道文件门｜DAY01—DAY10是公开庭审纪录，不是十个责任主体，也不是十项独立定罪</text>
  <g transform="translate(90 1200)"><use href="#door"/><text x="78" y="105" text-anchor="middle" class="door-label" font-size="15">DAY 01</text></g><g transform="translate(266 1200)"><use href="#door"/><text x="78" y="105" text-anchor="middle" class="door-label" font-size="15">DAY 02</text></g><g transform="translate(442 1200)"><use href="#door"/><text x="78" y="105" text-anchor="middle" class="door-label" font-size="15">DAY 03</text></g><g transform="translate(618 1200)"><use href="#door"/><text x="78" y="105" text-anchor="middle" class="door-label" font-size="15">DAY 04</text></g><g transform="translate(794 1200)"><use href="#door"/><text x="78" y="105" text-anchor="middle" class="door-label" font-size="15">DAY 05</text></g><g transform="translate(970 1200)"><use href="#door"/><text x="78" y="105" text-anchor="middle" class="door-label" font-size="15">DAY 06</text></g><g transform="translate(1146 1200)"><use href="#door"/><text x="78" y="105" text-anchor="middle" class="door-label" font-size="15">DAY 07</text></g><g transform="translate(1322 1200)"><use href="#door"/><text x="78" y="105" text-anchor="middle" class="door-label" font-size="15">DAY 08</text></g><g transform="translate(1498 1200)"><use href="#door"/><text x="78" y="105" text-anchor="middle" class="door-label" font-size="15">DAY 09</text></g><g transform="translate(1674 1200)"><use href="#door"/><text x="78" y="105" text-anchor="middle" class="door-label" font-size="15">DAY 10</text></g>

  <text x="80" y="1360" class="small-label" font-size="20">六项关键细节厘清</text>
  <g><rect x="80" y="1380" width="560" height="80" rx="13" fill="#f9f3e5" stroke="#c9ad72" stroke-width="2"/><text x="98" y="1408" class="clarify-title" font-size="17">01｜两度转介 ≠ 两次完成收养</text><text x="98" y="1437" class="clarify-copy" font-size="13" text-anchor="start"><tspan x="98" dy="0">第一次暂停结案；第二次进入出养前全日照顾，离世前未完成法院认可收养。</tspan></text></g><g><rect x="670" y="1380" width="560" height="80" rx="13" fill="#f9f3e5" stroke="#c9ad72" stroke-width="2"/><text x="688" y="1408" class="clarify-title" font-size="17">02｜待出养 ≠ 孤儿</text><text x="688" y="1437" class="clarify-copy" font-size="13" text-anchor="start"><tspan x="688" dy="0">孩子仍有原生家庭与监护人；“没人要”是制度追问，不是身份定性。</tspan></text></g><g><rect x="1260" y="1380" width="560" height="80" rx="13" fill="#f9f3e5" stroke="#c9ad72" stroke-width="2"/><text x="1278" y="1408" class="clarify-title" font-size="17">03｜合作保母 ≠ 收养人／寄养家庭</text><text x="1278" y="1437" class="clarify-copy" font-size="13" text-anchor="start"><tspan x="1278" dy="0">刘彩萱承接儿盟安排的出养前全日照顾，法律角色不能互换。</tspan></text></g><g><rect x="80" y="1474" width="560" height="80" rx="13" fill="#f9f3e5" stroke="#c9ad72" stroke-width="2"/><text x="98" y="1502" class="clarify-title" font-size="17">04｜文山访视 ≠ 文山媒合</text><text x="98" y="1531" class="clarify-copy" font-size="13" text-anchor="start"><tspan x="98" dy="0">文山依台北市社会局委托管理登记场域；媒合与安排照顾者是儿盟。</tspan></text></g><g><rect x="670" y="1474" width="560" height="80" rx="13" fill="#fff1dc" stroke="#b6463f" stroke-width="2"/><text x="688" y="1502" class="clarify-title" font-size="17">05｜牙医疑虑是转述，不是直接通知</text><text x="688" y="1531" class="clarify-copy" font-size="13" text-anchor="start"><tspan x="688" dy="0">疑虑由刘彩萱转述给陈尚洁；不能写成牙医直接告知，也不能写成已确认虐待。</tspan></text></g><g><rect x="1260" y="1474" width="560" height="80" rx="13" fill="#fff1dc" stroke="#b6463f" stroke-width="2"/><text x="1278" y="1502" class="clarify-title" font-size="17">06｜法律状态不能混写</text><text x="1278" y="1531" class="clarify-copy" font-size="13" text-anchor="start"><tspan x="1278" dy="0">施盈如是证人；林心慈遭起诉；陈尚洁一审未定谳；主案刘姓姐妹才已定谳。</tspan></text></g>
  <rect x="80" y="1582" width="1760" height="80" rx="10" fill="#5f2528" stroke="#d4a652" stroke-width="1.5"/>
  <text x="960" y="1611" text-anchor="middle" class="boundary" font-size="13">证据界线｜两度转介、法院判决、监察院行政调查与庭上证述分层呈现。图中路径及红色断链是编辑性整理，不等于法院已认定所有节点负刑事责任。</text>
  <text x="960" y="1640" text-anchor="middle" class="art-note" font-size="12">公益象征｜深海军蓝＋浅雾蓝条纹幼童与雨伞，非真实肖像、证物或案件现场影像。</text>
  <g opacity=".11" filter="url(#paper)"><rect width="1920" height="1700" fill="#f5e6c2"/></g>
