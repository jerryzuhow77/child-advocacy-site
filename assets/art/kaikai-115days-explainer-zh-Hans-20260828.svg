  <path d="M1490 258 C1400 305 1315 320 1210 334" fill="none" stroke="#d4a652" stroke-width="4" marker-end="url(#arrow)"/>


  <g filter="url(#shadow)">
    <rect x="80" y="286" width="570" height="174" rx="18" fill="#f8f1df" stroke="#d7bc82" stroke-width="2"/>
    <rect x="80" y="286" width="9" height="174" rx="4" fill="#438d8e"/>
    <text x="106" y="322" class="card-title" font-size="22">第一次程序｜2022.01—06</text>
    <text x="106" y="355" class="card-copy" font-size="17" text-anchor="start"><tspan x="106" dy="0">母亲求助 → 树莺转介 → 儿盟承接</tspan><tspan x="106" dy="27">签约并进入第一段全日照顾</tspan><tspan x="106" dy="27">监护人失联后暂停、结案</tspan><tspan x="106" dy="27">厘清：曾启动媒合，没有完成收养</tspan></text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1270" y="286" width="570" height="174" rx="18" fill="#f8f1df" stroke="#d7bc82" stroke-width="2"/>
    <rect x="1270" y="286" width="9" height="174" rx="4" fill="#b6463f"/>
    <text x="1296" y="322" class="card-title" font-size="22">第二次程序｜2023.05—09</text>
    <text x="1296" y="355" class="card-copy" font-size="17" text-anchor="start"><tspan x="1296" dy="0">外婆取得监护 → 树莺再次转介</tspan><tspan x="1296" dy="27">儿盟再派同一承办社工并重启</tspan><tspan x="1296" dy="27">09.01由刘彩萱提供24小时照顾</tspan><tspan x="1296" dy="27">厘清：仍在待出养阶段，没有完成收养</tspan></text>
  </g>
