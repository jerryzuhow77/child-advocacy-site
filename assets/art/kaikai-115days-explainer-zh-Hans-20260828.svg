  <title id="title">剀剀的115天｜保护伞在哪里断开？</title>
  <desc id="desc">两次启动收出养程序・四方关系层・十道可回查的文件门。证据界线｜两度转介、法院判决、监察院行政调查与庭上证述分层呈现。图中路径及红色断链是编辑性整理，不等于法院已认定所有节点负刑事责任。</desc>
