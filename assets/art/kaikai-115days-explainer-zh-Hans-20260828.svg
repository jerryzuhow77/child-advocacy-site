    <text x="760" y="326" text-anchor="middle" class="umbrella-label" font-size="14" transform="rotate(12 760 326)">中央制度</text><text x="860" y="313" text-anchor="middle" class="umbrella-label" font-size="14" transform="rotate(6 860 313)">家庭服务</text><text x="960" y="300" text-anchor="middle" class="umbrella-label" font-size="14" transform="rotate(0 960 300)">收出养</text><text x="1060" y="313" text-anchor="middle" class="umbrella-label" font-size="14" transform="rotate(-6 1060 313)">托育监管</text><text x="1160" y="326" text-anchor="middle" class="umbrella-label" font-size="14" transform="rotate(-12 1160 326)">第一线查证</text>
  </g>
