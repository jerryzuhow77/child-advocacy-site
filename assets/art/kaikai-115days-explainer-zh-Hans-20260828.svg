  <text x="960" y="78" text-anchor="middle" class="title" font-size="46">剀剀的115天｜保护伞在哪里断开？</text>
  <text x="960" y="116" text-anchor="middle" class="subtitle" font-size="20">两次启动收出养程序・四方关系层・十道可回查的文件门</text>


  <g filter="url(#shadow)">
    <rect x="80" y="145" width="700" height="112" rx="18" fill="#f8f1df" stroke="#d7bc82" stroke-width="2"/>
    <rect x="80" y="145" width="9" height="112" rx="4" fill="#d4a652"/>
    <text x="106" y="181" class="card-title" font-size="22">教育部｜案发时基金会法人主管</text>
    <text x="106" y="214" class="card-copy" font-size="17" text-anchor="start"><tspan x="106" dy="0">监督儿盟会务、财务、董事会与内控</tspan><tspan x="106" dy="27">不直接主管个案收出养业务</tspan></text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1140" y="145" width="700" height="112" rx="18" fill="#f8f1df" stroke="#d7bc82" stroke-width="2"/>
    <rect x="1140" y="145" width="9" height="112" rx="4" fill="#438d8e"/>
    <text x="1166" y="181" class="card-title" font-size="22">卫生福利部｜收出养业务主管</text>
    <text x="1166" y="214" class="card-copy" font-size="17" text-anchor="start"><tspan x="1166" dy="0">许可、检查与评鉴收出养媒合服务者</tspan><tspan x="1166" dy="27">规范地方儿童保护与居家托育制度</tspan></text>
  </g>
